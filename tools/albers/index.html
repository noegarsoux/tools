<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Interaction des couleurs</title>
  <link rel="stylesheet" href="../../assets/ui/atelier.css">
</head>
<body>
  <canvas></canvas>
  <script src="../../assets/ui/atelier.js"></script>
  <script>
    // Interaction des couleurs : les exercices de Josef Albers rejoués avec la charte. Une même couleur
    // posée sur deux fonds paraît double (un pont de cette couleur vient le prouver) ; deux rectangles
    // qui se croisent semblent transparents quand leur intersection est leur mélange ; deux couleurs
    // de même clarté et de teintes opposées font vibrer leur frontière ; et l'Hommage au carré.
    // Les mélanges se font en OKLab, l'espace où les écarts de clarté sont perçus de façon régulière.
    const canvas = document.querySelector('canvas');
    const ctx = canvas.getContext('2d');
    const TAU = Math.PI * 2;
    const PAL = (k) => Atelier.PALETTES[k].colors;
    const KB = PAL('kegelbahn'), BIEN = PAL('biennale'), GR = PAL('good-room'), LU = PAL('luzern'), SAL = PAL('salon'), TH = PAL('thermique');
    const EV = PAL('eventail'), MENTHE = PAL('menthe'), PYR = PAL('pyramides'), ORB = PAL('orbite');

    // ——— OKLab ———
    const lin = (c) => (c <= 0.04045 ? c / 12.92 : ((c + 0.055) / 1.055) ** 2.4);
    const gam = (c) => (c <= 0.0031308 ? 12.92 * c : 1.055 * c ** (1 / 2.4) - 0.055);
    function toLab(hex) {
      const r = lin(parseInt(hex.slice(1, 3), 16) / 255), g = lin(parseInt(hex.slice(3, 5), 16) / 255), b = lin(parseInt(hex.slice(5, 7), 16) / 255);
      const l = Math.cbrt(0.4122214708 * r + 0.5363325363 * g + 0.0514459929 * b), m = Math.cbrt(0.2119034982 * r + 0.6806995451 * g + 0.1073969566 * b), s = Math.cbrt(0.0883024619 * r + 0.2817188376 * g + 0.6299787005 * b);
      return [0.2104542553 * l + 0.793617785 * m - 0.0040720468 * s, 1.9779984951 * l - 2.428592205 * m + 0.4505937099 * s, 0.0259040371 * l + 0.7827717662 * m - 0.808675766 * s];
    }
    function fromLab([L, a, b]) {
      const l = (L + 0.3963377774 * a + 0.2158037573 * b) ** 3, m = (L - 0.1055613458 * a - 0.0638541728 * b) ** 3, s = (L - 0.0894841775 * a - 1.291485548 * b) ** 3;
      const r = 4.0767416621 * l - 3.3077115913 * m + 0.2309699292 * s, g = -1.2684380046 * l + 2.6097574011 * m - 0.3413193965 * s, bb = -0.0041960863 * l - 0.7034186147 * m + 1.707614701 * s;
      const h = (v) => Math.round(Math.max(0, Math.min(1, gam(v))) * 255).toString(16).padStart(2, '0');
      return '#' + h(r) + h(g) + h(bb);
    }
    const mix = (a, b, t) => { const A = toLab(a), B = toLab(b); return fromLab([A[0] + (B[0] - A[0]) * t, A[1] + (B[1] - A[1]) * t, A[2] + (B[2] - A[2]) * t]); };
    const Lof = (c) => toLab(c)[0];
    // Opposée en teinte, même clarté, chroma réglable (OKLCH).
    function opposite(c, chroma) {
      const [L, a, b] = toLab(c), C = Math.hypot(a, b) || 0.1, h = Math.atan2(b, a) + Math.PI, k = chroma ?? C;
      return fromLab([L, Math.cos(h) * k, Math.sin(h) * k]);
    }

    let hover = null, drag = null, shift = 0, plates = [], lastT = 0;

    const app = Atelier.app({
      stage: canvas,
      animate: true,
      seed: true,
      finish: { grain: 0.04, vignette: 0 },
      hint: 'Survol d’une planche : la preuve apparaît · glissez horizontalement pour décaler les couleurs · molette : nombre de planches',
      notes: 'Albers : « une couleur n’est presque jamais vue telle qu’elle est ». Les couleurs viennent de la charte ; les intermédiaires sont des mélanges en OKLab, à clarté perçue régulière.',
      params: {
        'Exercice': {
          etude: { type: 'segmented', label: 'Exercice', options: { deuxfonds: 'Une couleur, deux fonds', transparence: 'Transparence', vibration: 'Vibration', hommage: 'Hommage au carré', toutes: 'Toutes' }, value: 'toutes' },
          disposition: { type: 'segmented', label: 'Disposition', options: { seul: 'Une planche', planche: 'Planches' }, value: 'planche' },
          colonnes: { type: 'range', label: 'Colonnes', min: 2, max: 6, step: 1, value: 3, show: (q) => q.disposition === 'planche' },
          marge: { type: 'range', label: 'Marge', min: 0, max: 0.2, step: 0.005, value: 0.05 },
          arrondi: { type: 'range', label: 'Arrondi', min: 0, max: 0.3, step: 0.01, value: 0 },
        },
        'Réglages': {
          ecart: { type: 'range', label: 'Écart entre les fonds', min: 0.2, max: 1, step: 0.01, value: 0.75 },
          melange: { type: 'range', label: 'Mélange de la transparence', min: 0, max: 1, step: 0.01, value: 0.5 },
          chroma: { type: 'range', label: 'Saturation de la vibration', min: 0.05, max: 0.3, step: 0.005, value: 0.16 },
          bandes: { type: 'range', label: 'Bandes de la vibration', min: 3, max: 24, step: 1, value: 9 },
          carres: { type: 'range', label: 'Carrés de l’hommage', min: 3, max: 4, step: 1, value: 4 },
        },
        'Mouvement': {
          vitesse: { type: 'range', label: 'Vitesse', min: 0, max: 1, step: 0.01, value: 0.35 },
          preuve: { type: 'toggle', label: 'Montrer la preuve en boucle', value: true },
          derive: { type: 'range', label: 'Dérive des couleurs', min: 0, max: 1, step: 0.01, value: 0.4 },
        },
        'Couleur': {
          fond: { type: 'color', label: 'Fond de page', value: '#ecebe8' },
          couleurs: { type: 'palette', label: 'Couleurs de la charte', value: [KB[1], KB[2], KB[3], KB[5], KB[4], '#f4f3f0', '#111111'] },
        },
      },
      presets: {
        'Planches': {},
        'Deux fonds': { etude: 'deuxfonds', disposition: 'seul', ecart: 0.85 },
        'Transparence': { etude: 'transparence', disposition: 'planche', colonnes: 3, couleurs: [BIEN[2], BIEN[3], BIEN[4], '#3b5bdb', BIEN[0]] },
        'Vibration': { etude: 'vibration', disposition: 'planche', colonnes: 4, chroma: 0.19, bandes: 7, couleurs: [SAL[2], SAL[3], SAL[4], '#3c4fd0'] },
        'Hommage': { etude: 'hommage', disposition: 'seul', couleurs: [PYR[4], PYR[2], PYR[3], PYR[1], PYR[0]], derive: 0.6 },
        'Hommages': { etude: 'hommage', disposition: 'planche', colonnes: 4, couleurs: [TH[1], TH[2], TH[3], TH[4], TH[5], TH[0]], marge: 0.03 },
        'Luzern': { etude: 'toutes', colonnes: 2, couleurs: [LU[0], LU[1], LU[2], LU[3], LU[4]], fond: LU[3] },
        'Good Room': { etude: 'deuxfonds', colonnes: 3, couleurs: GR.slice(0, 5), fond: '#1a1a1a', ecart: 0.9 },
        'Éventail': { etude: 'transparence', disposition: 'seul', couleurs: EV, melange: 0.4, arrondi: 0.05 },
        'Menthe': { etude: 'hommage', colonnes: 3, couleurs: [MENTHE[0], MENTHE[2], MENTHE[3], MENTHE[1]], arrondi: 0.12, marge: 0.06 },
      },
      brand(colors) { return { couleurs: colors.slice(0, 8) }; },
      pointer: {
        move: (q) => { hover = { x: q.x, y: q.y }; },
        down: (q) => { drag = { x: q.x, s: shift }; },
        drag: (q) => { if (drag) shift = drag.s + (q.x - drag.x) / Math.min(app.size.w, app.size.h); },
        up: () => { drag = null; },
        wheel: (q, dy) => app.set('colonnes', Math.max(2, Math.min(6, p.colonnes + Math.sign(dy)))),
      },
      onChange(k) { if (k === '*') shift = 0; },
      export: { name: 'interaction-des-couleurs', svg: () => toSVG() },
    });
    const p = app.params;
    canvas.addEventListener('pointerleave', () => { hover = null; });

    // ——— Tirages : chaque planche reçoit un exercice et ses couleurs, d'après la graine ———
    function picks(k, n) {
      const r = app.rng(100 + k * 7), cols = p.couleurs.length ? p.couleurs : ['#e5452a', '#111111'], idx = cols.map((_, i) => i);
      for (let i = idx.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [idx[i], idx[j]] = [idx[j], idx[i]]; }
      const out = [];
      for (let i = 0; i < n; i++) out.push(cols[idx[i % idx.length]]);
      return { out, r };
    }
    // Couleur qui dérive : une couleur de la charte glisse lentement vers une voisine.
    function drift(c, d, t, k) {
      const cols = p.couleurs.length ? p.couleurs : [c], n = cols.length;
      const u = (0.5 + 0.5 * Math.sin(t * p.vitesse * 0.5 + k * 1.7)) * p.derive * 0.35;
      const s = ((shift % 1) + 1) % 1, j = Math.floor(s * n), f = s * n - j;
      let out = u > 0 ? mix(c, d, u) : c;
      if (shift) out = mix(out, mix(cols[j % n], cols[(j + 1) % n], f), Math.min(0.6, Math.abs(shift) * 0.6));
      return out;
    }

    // Formes d'une planche dans le carré (x, y, s) : liste de rectangles { x, y, w, h, c }.
    function plate(kind, k, x, y, s, t, hot) {
      const R = [], add = (rx, ry, rw, rh, c) => R.push({ x: x + rx * s, y: y + ry * s, w: rw * s, h: rh * s, c });
      const loop = 0.5 - 0.5 * Math.cos(t * p.vitesse * 0.9 + k * 2.3);
      switch (kind) {
        case 'deuxfonds': {
          // Deux fonds aussi éloignés que possible en clarté ; au centre, leur mélange à mi-chemin.
          const { out } = picks(k, 6);
          const byL = out.slice().sort((a, b) => Lof(a) - Lof(b));
          let A = byL[byL.length - 1], B = byL[0];
          A = mix(mix(A, B, 0.5), A, p.ecart); B = mix(mix(A, B, 0.5), B, p.ecart);
          A = drift(A, out[1], t, k); B = drift(B, out[2], t, k + 1);
          const C = mix(A, B, 0.5);
          add(0, 0, 0.5, 1, A); add(0.5, 0, 0.5, 1, B);
          add(0.19, 0.4, 0.12, 0.2, C); add(0.69, 0.4, 0.12, 0.2, C);
          // La preuve : un pont de la même couleur relie les deux carrés.
          const show = hot ? 1 : p.preuve ? Math.max(0, Math.min(1, (loop - 0.55) * 4)) : 0;
          if (show > 0) add(0.31, 0.47, 0.38 * show, 0.06, C);
          break;
        }
        case 'transparence': {
          // Deux rectangles croisés ; leur intersection est leur mélange : on croit voir un calque.
          const { out } = picks(k, 4);
          const bg = drift(out[2], out[3], t, k), a = drift(out[0], out[3], t, k + 2), b = drift(out[1], out[2], t, k + 3);
          const m = hot ? 0.5 + 0.45 * Math.sin(t * 3) : p.melange + (p.preuve ? (loop - 0.5) * 0.7 : 0);
          add(0, 0, 1, 1, bg);
          add(0.12, 0.2, 0.52, 0.42, a); add(0.36, 0.38, 0.52, 0.42, b);
          add(0.36, 0.38, 0.28, 0.24, mix(a, b, Math.max(0, Math.min(1, m))));
          break;
        }
        case 'vibration': {
          // Bandes de deux teintes opposées à clarté égale : la frontière vibre.
          const { out } = picks(k, 2);
          const c = drift(out[0], out[1], t, k), o = opposite(c, p.chroma);
          const cc = fromLab([toLab(o)[0], ...toLab(c).slice(1).map((v) => v / (Math.hypot(...toLab(c).slice(1)) || 1) * p.chroma)]);
          const n = Math.round(p.bandes), ph = (t * p.vitesse * 0.05 + k * 0.13) % (2 / n);
          add(0, 0, 1, 1, cc);
          for (let i = -1; i < n; i += 2) {
            const yy = i / n + ph * (p.preuve ? 1 : 0);
            add(0, Math.max(0, yy), 1, Math.max(0, Math.min(1, yy + 1 / n) - Math.max(0, yy)), o);
          }
          if (hot) add(0.3, 0.3, 0.4, 0.4, mix(cc, o, 0.5));
          break;
        }
        default: {
          // Hommage au carré : carrés emboîtés, plus serrés en haut (proportions 1 : 1,5 de la marge).
          const { out } = picks(k, 4);
          const n = Math.round(p.carres), outer = drift(out[0], out[2], t, k), inner = drift(out[1], out[3], t, k + 1);
          for (let i = 0; i < n; i++) {
            const u = i / (n - 1), sz = 1 - i * 0.2, off = (1 - sz) / 2;
            // Avec le survol, les carrés intermédiaires se figent en dégradé exact (la preuve du mélange).
            const c = i === 0 ? outer : i === n - 1 ? inner : mix(outer, inner, hot ? u : u + (loop - 0.5) * 0.35 * p.derive);
            // Centré en largeur, posé plus bas que le centre : trois parts de marge au-dessus pour une en dessous.
            add(off, (1 - sz) * 0.75, sz, sz, c);
          }
        }
      }
      return R;
    }

    function layout(t) {
      const { w, h } = app.size, out = [], kinds = ['deuxfonds', 'transparence', 'vibration', 'hommage'];
      const kindOf = (k) => (p.etude === 'toutes' ? kinds[k % 4] : p.etude);
      if (p.disposition === 'seul') {
        const m = Math.min(w, h) * p.marge, s = Math.min(w, h) - 2 * m;
        // Une seule planche : carrée, et le reste de la page en fond de la première couleur.
        const x = (w - s) / 2, y = (h - s) / 2, hot = hover && hover.x > x && hover.x < x + s && hover.y > y && hover.y < y + s;
        out.push({ x, y, s, rects: plate(kindOf(0), 0, x, y, s, t, hot) });
      } else {
        const c = Math.round(p.colonnes), cw = w / c, rows = Math.max(1, Math.round(h / cw)), ch = h / rows;
        const cell = Math.min(cw, ch), m = cell * p.marge, s = cell - 2 * m;
        for (let j = 0; j < rows; j++) for (let i = 0; i < c; i++) {
          const k = j * c + i, x = i * cw + (cw - s) / 2, y = j * ch + (ch - s) / 2;
          const hot = hover && hover.x > x && hover.x < x + s && hover.y > y && hover.y < y + s;
          out.push({ x, y, s, rects: plate(kindOf(k), k, x, y, s, t, hot) });
        }
      }
      return out;
    }

    function rr(c, x, y, w, h, r) {
      if (r <= 0) { c.rect(x, y, w, h); return; }
      r = Math.min(r, w / 2, h / 2);
      c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath();
    }

    function draw(t) {
      const { w, h, dpr } = app.size;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.fillStyle = p.fond; ctx.fillRect(0, 0, w, h);
      for (const pl of layout(t)) {
        ctx.save();
        ctx.beginPath(); rr(ctx, pl.x, pl.y, pl.s, pl.s, pl.s * p.arrondi); ctx.clip();
        for (const q of pl.rects) { ctx.fillStyle = q.c; ctx.fillRect(q.x, q.y, q.w + 0.5, q.h + 0.5); }
        ctx.restore();
      }
    }

    function toSVG() {
      const { w, h } = app.size, f = (v) => +v.toFixed(2);
      let s = `<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">\n<rect width="100%" height="100%" fill="${p.fond}"/>\n`;
      layout(lastT).forEach((pl, i) => {
        const r = f(pl.s * p.arrondi);
        s += `<clipPath id="c${i}"><rect x="${f(pl.x)}" y="${f(pl.y)}" width="${f(pl.s)}" height="${f(pl.s)}" rx="${r}"/></clipPath>\n<g clip-path="url(#c${i})">`;
        for (const q of pl.rects) s += `<rect x="${f(q.x)}" y="${f(q.y)}" width="${f(q.w + 0.5)}" height="${f(q.h + 0.5)}" fill="${q.c}"/>`;
        s += '</g>\n';
      });
      return s + '</svg>';
    }

    app.loop((t) => { lastT = t; draw(t); app.finish(ctx); });
  </script>
</body>
</html>
