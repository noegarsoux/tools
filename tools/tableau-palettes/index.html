<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tableau à palettes</title>
  <link rel="stylesheet" href="../../assets/ui/atelier.css">
</head>
<body>
  <canvas></canvas>
  <script src="../../assets/ui/atelier.js"></script>
  <script>
    // Tableau à palettes : chaque case est un tambour de palettes, une par couleur de la palette, dans l'ordre.
    // Pour changer de couleur, la case ne peut que basculer à la suivante : elle passe donc par les couleurs
    // intermédiaires. Une bascule : la moitié haute de la couleur actuelle tombe autour de la charnière
    // (hauteur ∝ cos πt), découvrant le haut de la suivante, puis son dos montre le bas de la suivante.
    // Chaque nouveau visuel démarre avec un retard propre à chaque case (cascade).
    const canvas = document.querySelector('canvas');
    const ctx = canvas.getContext('2d');
    const TAU = Math.PI * 2;
    const PAL = (k) => Atelier.PALETTES[k].colors;
    const BIEN = PAL('biennale'), MEN = PAL('menthe'), KB = PAL('kegelbahn');
    const SEQ = ['logo', 'degrade', 'cercles', 'rayures', 'damier', 'onde'];

    let simT = 0, B = null, bKey = '', logoM = null, logoKey = '', ptr = null, img = { k: 0, t0: 0, next: 0, lastOnde: 0 };

    const app = Atelier.app({
      stage: canvas,
      animate: true,
      seed: true,
      finish: { grain: 0.04, vignette: 0.15 },
      hint: 'Clic : visuel suivant · glissez pour faire basculer les palettes · molette : nombre de cases',
      notes: 'Dans les halls de gare, les tableaux Solari affichaient les départs en faisant défiler, case par case, des palettes imprimées : chaque case ne savait que passer à la palette suivante, et toutes cliquetaient en cascade avant de s\'arrêter sur la bonne. Ici, les palettes portent les couleurs de la marque plutôt que des lettres. Pour afficher un visuel (le logo, un dégradé, des cercles, des rayures, un damier, une onde qui ne s\'arrête jamais), chaque case fait défiler ses couleurs dans l\'ordre jusqu\'à la sienne. La charnière, la chute de la palette et son ombre sont dessinées pour chaque bascule.',
      params: {
        'Tableau': {
          colonnes: { type: 'range', label: 'Cases par ligne', min: 6, max: 90, step: 1, value: 36 },
          proportion: { type: 'range', label: 'Proportion des cases (h/l)', min: 0.6, max: 2, step: 0.01, value: 1.3 },
          ecart: { type: 'range', label: 'Écart entre cases', min: 0, max: 0.35, step: 0.005, value: 0.1 },
          cadre: { type: 'range', label: 'Cadre', min: 0, max: 0.12, step: 0.002, value: 0.035 },
          relief: { type: 'range', label: 'Relief des palettes', min: 0, max: 1, step: 0.01, value: 0.6 },
        },
        'Bascules': {
          vitesse: { type: 'range', label: 'Bascules par seconde', min: 2, max: 40, step: 0.5, value: 12 },
          cascade: { type: 'range', label: 'Étalement de la cascade (s)', min: 0, max: 4, step: 0.05, value: 1.2 },
          ordre: { type: 'select', label: 'Ordre', options: { gauche: 'De gauche à droite', diagonale: 'En diagonale', centre: 'Depuis le centre', hasard: 'Au hasard' }, value: 'diagonale' },
          pause: { type: 'range', label: 'Pause sur chaque visuel (s)', min: 0.5, max: 15, step: 0.1, value: 3.5 },
        },
        'Visuels': {
          visuel: { type: 'select', label: 'Visuel', options: { cycle: 'Tous, à tour de rôle', logo: 'Logo', degrade: 'Dégradé', cercles: 'Cercles', rayures: 'Rayures', damier: 'Damier', onde: 'Onde continue' }, value: 'cycle' },
          tailleLogo: { type: 'range', label: 'Taille du logo', min: 0.3, max: 1, step: 0.01, value: 0.8 },
          image: { type: 'file', label: 'Logo', accept: 'image/*' },
        },
        'Couleurs': {
          fond: { type: 'color', label: 'Cadre', value: '#141416' },
          couleurs: { type: 'palette', label: 'Palettes du tambour (dans l\'ordre)', value: ['#1d1d22', '#2f5fd0', '#e5452a', '#f2c230', '#f4f1ea'] },
        },
      },
      presets: {
        'Gare': {},
        'Logo': { visuel: 'logo', colonnes: 44, couleurs: ['#1d1d22', '#3a3a42', '#e5452a', '#f4f1ea'], pause: 6 },
        'Onde': { visuel: 'onde', colonnes: 40, vitesse: 16 },
        'Grandes palettes': { colonnes: 12, proportion: 1.4, vitesse: 7, cascade: 1.8, ordre: 'gauche' },
        'Pixels': { colonnes: 80, proportion: 1, ecart: 0.06, vitesse: 24, cascade: 0.8, ordre: 'hasard' },
        'Paysage': { proportion: 0.7, colonnes: 28, ordre: 'centre', visuel: 'cercles' },
        'Noir et blanc': { couleurs: ['#111111', '#555555', '#aaaaaa', '#f2f2f2'], fond: '#000000', visuel: 'degrade' },
        'Biennale': { fond: BIEN[1], couleurs: [BIEN[0], BIEN[3], BIEN[2], BIEN[4], BIEN[1]] },
        'Menthe': { fond: MEN[1], couleurs: [MEN[1], MEN[3], MEN[2], MEN[0]], visuel: 'onde' },
        'Kegelbahn': { fond: KB[0], couleurs: [KB[0], KB[2], KB[1], KB[5], KB[3], KB[4]], ordre: 'hasard' },
      },
      brand(colors) {
        const s = colors.slice().sort((a, b) => lum(a) - lum(b)), D = s[0];
        return { fond: mix(D, '#000000', 0.4), couleurs: s.length > 1 ? s : [D, '#ffffff'] };
      },
      pointer: {
        down: (q) => { ptr = { x: q.x, y: q.y, moved: 0 }; },
        drag: (q) => { if (!ptr) return; ptr.moved += Math.hypot(q.x - ptr.x, q.y - ptr.y); ptr.x = q.x; ptr.y = q.y; brush(q.x, q.y); },
        up: () => { if (ptr && ptr.moved < 6) nextImage(); ptr = null; },
        wheel: (q, dy) => app.set('colonnes', Math.max(6, Math.min(90, p.colonnes + (dy > 0 ? -2 : 2)))),
      },
      onChange(k) { if (['*', 'image'].includes(k)) logoKey = ''; },
      export: { name: 'tableau-palettes', svg: () => toSVG() },
    });
    const p = app.params;

    function hex(x) { const n = parseInt(x.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
    function lum(x) { const c = hex(x); return (c[0] * 0.299 + c[1] * 0.587 + c[2] * 0.114) / 255; }
    function mix(a, b, t) { const A = hex(a), C = hex(b); return '#' + A.map((v, i) => Math.round(v + (C[i] - v) * t).toString(16).padStart(2, '0')).join(''); }
    function rng(s) { let a = s >>> 0; return () => { a = (a + 0x6d2b79f5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }

    // ——— Logo ———
    function buildLogo() {
      const img0 = p.image || app.logoImg, key = img0 ? (img0.src || 'c') : 'demo'; if (key === logoKey) return; logoKey = key;
      const M = 200, c = document.createElement('canvas'); c.width = c.height = M; const x = c.getContext('2d', { willReadFrequently: true }), L = M * 0.94, cx = M / 2;
      if (img0) { const iw = img0.naturalWidth || img0.width, ih = img0.naturalHeight || img0.height, s = L / Math.max(iw, ih); x.drawImage(img0, cx - iw * s / 2, cx - ih * s / 2, iw * s, ih * s); }
      else { x.fillStyle = '#000'; x.beginPath(); x.arc(cx, cx, L * 0.48, 0, TAU); x.arc(cx, cx, L * 0.27, 0, TAU, true); x.fill('evenodd'); x.fillRect(cx - L * 0.07, cx - L * 0.5, L * 0.14, L); }
      const d = x.getImageData(0, 0, M, M).data; let transp = 0; for (let i = 3; i < d.length; i += 4) if (d[i] < 128) transp++; const useA = transp > M * M * 0.05;
      const m = new Uint8Array(M * M); for (let i = 0; i < M * M; i++) { const o = i * 4, l = (d[o] * 0.2126 + d[o + 1] * 0.7152 + d[o + 2] * 0.0722) / 255; m[i] = (useA ? d[o + 3] > 128 : d[o + 3] > 128 && l < 0.5) ? 1 : 0; }
      logoM = { m, M }; bKey = '';
    }

    // ——— Visuels : une valeur 0..1 par case, convertie en indice du tambour ———
    function field(kind, X, Y, w, h, k, t) {
      const R = rng(app.seed * 389 + k * 7919 + 11), m = Math.min(w, h), u = (X - w / 2) / m, v = (Y - h / 2) / m, n = Math.max(1, p.couleurs.length);
      if (kind === 'logo') {
        const S = m * p.tailleLogo, M = logoM.M; let c = 0;
        for (const [a, b] of [[-0.25, -0.25], [0.25, -0.25], [-0.25, 0.25], [0.25, 0.25], [0, 0]]) { const mu = Math.floor(((X + a * B.cw - w / 2) / S + 0.5) * M), mv = Math.floor(((Y + b * B.ch - h / 2) / S + 0.5) * M); if (mu >= 0 && mv >= 0 && mu < M && mv < M && logoM.m[mv * M + mu]) c++; }
        return c >= 3 ? 1 : 0;
      }
      if (kind === 'degrade') { const a = R() * TAU, s = 0.5 + 0.5 * (u * Math.cos(a) + v * Math.sin(a)) / 0.75; return Math.max(0, Math.min(1, s)); }
      if (kind === 'cercles') { const cx = (R() - 0.5) * 0.6, cy = (R() - 0.5) * 0.4, r = Math.hypot(u - cx, v - cy), f = 3 + R() * 3; return (Math.floor(r * f * n) % n) / Math.max(1, n - 1); }
      if (kind === 'rayures') { const a = R() < 0.5 ? 1 : -1, wdt = 0.06 + R() * 0.08; return (((Math.floor((u + a * v) / wdt) % n) + n) % n) / Math.max(1, n - 1); }
      if (kind === 'damier') { const s = 0.12 + R() * 0.12, i0 = Math.floor(R() * n), i1 = (i0 + 1 + Math.floor(R() * (n - 1))) % n, c = (Math.floor(u / s + 100) + Math.floor(v / s + 100)) % 2; const r2 = Math.hypot(u, v); return (r2 < 0.18 ? (i0 + 2) % n : c ? i0 : i1) / Math.max(1, n - 1); }
      // onde : change sans cesse
      return 0.5 + 0.5 * Math.sin(u * 7 + t * 1.3 + 2 * Math.sin(v * 5 - t * 0.7));
    }
    function kindOf(k) { return p.visuel === 'cycle' ? SEQ[k % SEQ.length] : p.visuel; }
    function orderOf(c, w, h) {
      const u = c.x / w, v = c.y / h;
      if (p.ordre === 'gauche') return u;
      if (p.ordre === 'centre') return Math.min(1, Math.hypot(u - 0.5, (v - 0.5) * h / w) * 1.6);
      if (p.ordre === 'hasard') return c.r;
      return (u + v) / 2;
    }

    // ——— Tableau ———
    function board(w, h) {
      buildLogo();
      const key = [p.colonnes, p.proportion, p.cadre, p.couleurs.length, app.seed, w, h].join(); if (key === bKey && B) return B; bKey = key;
      const m = Math.min(w, h), f = m * p.cadre, cw = (w - 2 * f) / p.colonnes, ch = cw * p.proportion, rows = Math.max(1, Math.floor((h - 2 * f) / ch)), oy = (h - rows * ch) / 2, R = rng(app.seed * 17 + 3);
      const cells = []; for (let j = 0; j < rows; j++) for (let i = 0; i < p.colonnes; i++) cells.push({ x: f + (i + 0.5) * cw, y: oy + (j + 0.5) * ch, cur: 0, tgt: 0, ph: 0, start: 0, r: R() });
      B = { cells, cw, ch, f, rows }; img.k = 0; setTargets(w, h, true);
      return B;
    }
    function setTargets(w, h, instant) {
      const n = Math.max(1, p.couleurs.length), kind = kindOf(img.k);
      for (const c of B.cells) {
        const t = field(kind, c.x, c.y, w, h, img.k, simT); c.tgt = Math.max(0, Math.min(n - 1, Math.round(t * (n - 1))));
        if (instant) { c.cur = c.tgt; c.ph = 0; } else c.start = simT + (kind === 'onde' ? 0 : orderOf(c, w, h) * p.cascade);
      }
      img.t0 = simT; img.next = simT + p.pause + p.cascade + (n - 1) / p.vitesse;
    }
    function nextImage() { img.k++; const { w, h } = app.size; setTargets(w, h, false); }
    function brush(x, y) { if (!B) return; const n = p.couleurs.length; for (const c of B.cells) if (Math.abs(c.x - x) < B.cw * 1.2 && Math.abs(c.y - y) < B.ch * 1.2 && c.ph === 0 && c.cur === c.tgt) { c.tgt = (c.cur + 1 + Math.floor(c.r * (n - 1))) % n; c.start = simT; c.back = true; } }
    function step(dt, w, h) {
      const n = Math.max(1, p.couleurs.length), fd = 1 / p.vitesse;
      if (kindOf(img.k) === 'onde') { if (simT - img.lastOnde > 0.25) { img.lastOnde = simT; const t = simT; for (const c of B.cells) { const v = field('onde', c.x, c.y, w, h, img.k, t); c.tgt = Math.max(0, Math.min(n - 1, Math.round(v * (n - 1)))); c.start = Math.min(c.start, simT); } } if (p.visuel === 'cycle' && simT > img.t0 + p.pause * 2.5) nextImage(); }
      else if (simT > img.next) nextImage();
      for (const c of B.cells) {
        if (c.cur === c.tgt && c.ph === 0) { if (c.back) { c.back = false; c.tgt = field(kindOf(img.k), c.x, c.y, w, h, img.k, simT) * (n - 1); c.tgt = Math.max(0, Math.min(n - 1, Math.round(c.tgt))); c.start = simT + 0.6; } continue; }
        if (simT < c.start) continue;
        c.ph += dt / fd; while (c.ph >= 1) { c.ph -= 1; c.cur = (c.cur + 1) % n; if (c.cur === c.tgt) { c.ph = 0; break; } }
      }
    }

    // ——— Dessin d'une case ———
    function render(pen, w, h) {
      const Cs = p.couleurs.length ? p.couleurs : ['#000000', '#ffffff'], n = Cs.length, g = Math.min(B.cw, B.ch) * p.ecart, cw = B.cw - g, ch = B.ch - g, hh = ch / 2, rl = p.relief;
      const top = Cs.map((c) => mix(c, '#ffffff', 0.07 * rl)), bot = Cs.map((c) => mix(c, '#000000', 0.1 * rl));
      pen.bg(p.fond);
      // cases au repos, regroupées par couleur
      const groupsT = Array.from({ length: n }, () => []), groupsB = Array.from({ length: n }, () => []), moving = [];
      for (const c of B.cells) { if (c.ph > 0) { moving.push(c); continue; } groupsT[c.cur].push(c); groupsB[c.cur].push(c); }
      for (let i = 0; i < n; i++) { pen.rects(groupsT[i], -cw / 2, -hh, cw, hh, top[i]); pen.rects(groupsB[i], -cw / 2, 0, cw, hh, bot[i]); }
      for (const c of moving) {
        const a = c.cur % n, b = (c.cur + 1) % n, t = c.ph, x = c.x - cw / 2, y = c.y;
        pen.rect(x, y - hh, cw, hh, top[b]); pen.rect(x, y, cw, hh, bot[a]);
        const k = Math.cos(Math.PI * t), wide = cw * (1 + 0.1 * Math.sin(Math.PI * t)), xw = c.x - wide / 2;
        if (t < 0.5) { const fh = hh * k; pen.rect(xw, y - fh, wide, fh, mix(top[a], '#000000', (1 - k) * 0.45 * rl)); pen.rect(x, y - hh, cw, hh * (1 - k) * 0.5, `rgba(0,0,0,${0.25 * rl})`); }
        else { const fh = hh * -k; pen.rect(xw, y, wide, fh, mix(bot[b], '#ffffff', (1 + k) * 0.2 * rl)); pen.rect(x, y + fh, cw, Math.min(hh - fh, hh * 0.35), `rgba(0,0,0,${0.3 * rl * (1 + k)})`); }
      }
      // charnières
      pen.hinges(B.cells, cw, Math.max(0.6, ch * 0.025), mix(p.fond, '#000000', 0.3));
    }

    app.loop((t, dt) => {
      dt = Math.min(1 / 20, dt || 0);
      const { w, h, dpr } = app.size; board(w, h);
      if (app.thumbnail) { img.k = 0; setTargets(w, h, true); for (const c of B.cells) { const d = (c.x / w + c.y / h) / 2; if (Math.abs(d - 0.55) < 0.06) { c.ph = 0.15 + 0.7 * ((d - 0.49) / 0.12); c.cur = (c.tgt + p.couleurs.length - 1) % Math.max(1, p.couleurs.length); } } }
      else { simT += dt; step(dt, w, h); }
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      render({
        bg(c) { ctx.fillStyle = c; ctx.fillRect(0, 0, w, h); },
        rects(L, dx, dy, rw, rh, c) { if (!L.length) return; ctx.fillStyle = c; ctx.beginPath(); for (const q of L) ctx.rect(q.x + dx, q.y + dy, rw, rh); ctx.fill(); },
        rect(x, y, rw, rh, c) { ctx.fillStyle = c; ctx.fillRect(x, y, rw, rh); },
        hinges(L, cw, lw, c) { ctx.fillStyle = c; ctx.beginPath(); for (const q of L) ctx.rect(q.x - cw / 2, q.y - lw / 2, cw, lw); ctx.fill(); },
      }, w, h);
      app.finish(ctx);
    });

    function toSVG() {
      const { w, h } = app.size, f = (v) => +v.toFixed(2); board(w, h);
      let s = '';
      render({
        bg(c) { s += `<rect width="100%" height="100%" fill="${c}"/>`; },
        rects(L, dx, dy, rw, rh, c) { if (!L.length) return; s += `<path fill="${c}" d="${L.map((q) => `M${f(q.x + dx)} ${f(q.y + dy)}h${f(rw)}v${f(rh)}h${f(-rw)}z`).join('')}"/>`; },
        rect(x, y, rw, rh, c) { if (rh <= 0) return; const m = /rgba\((\d+),(\d+),(\d+),([\d.]+)\)/.exec(c); s += m ? `<rect x="${f(x)}" y="${f(y)}" width="${f(rw)}" height="${f(rh)}" fill="#000000" fill-opacity="${+(+m[4]).toFixed(3)}"/>` : `<rect x="${f(x)}" y="${f(y)}" width="${f(rw)}" height="${f(rh)}" fill="${c}"/>`; },
        hinges(L, cw, lw, c) { s += `<path fill="${c}" d="${L.map((q) => `M${f(q.x - cw / 2)} ${f(q.y - lw / 2)}h${f(cw)}v${f(lw)}h${f(-cw)}z`).join('')}"/>`; },
      }, w, h);
      return `<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">${s}</svg>`;
    }
  </script>
</body>
</html>
