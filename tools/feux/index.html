<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Feux</title>
  <link rel="stylesheet" href="../../assets/ui/atelier.css">
</head>
<body>
  <canvas></canvas>
  <script src="../../assets/ui/atelier.js"></script>
  <script>
    // Feux : un feu d'artifice aux couleurs de la marque. Chaque fusée monte jusqu'à son apogée puis
    // éclate en bouquet (pivoine, saule, anneau, palmier, étoile ou logo) ; les étoiles subissent la
    // gravité et la traînée de l'air, scintillent et laissent des traînes, avec un reflet dans l'eau.
    const canvas = document.querySelector('canvas');
    const ctx = canvas.getContext('2d');
    const TAU = Math.PI * 2;
    const PAL = (k) => Atelier.PALETTES[k].colors;
    const P60 = PAL('papier-60'), BIEN = PAL('biennale'), MENTHE = PAL('menthe'), KB = PAL('kegelbahn'), GR = PAL('good-room'), NUIT = PAL('trame-nuit');
    const LUZ = PAL('luzern'), SALON = PAL('salon'), PYR = PAL('pyramides'), ACIDE = PAL('acide'), THER = PAL('thermique'), ORB = PAL('orbite');

    let rockets = [], sparks = [], flashes = [], launchAcc = 0.6, trailCv = null, trailX = null, refCv = null, refX = null, time = 0, finale = 0;
    let maskPts = null, maskKey = null, drag = null, warm = false, hold = -1;

    const app = Atelier.app({
      stage: canvas,
      animate: true,
      seed: true,
      finish: { grain: 0.05, vignette: 0.15 },
      hint: 'Touchez le ciel pour lancer une fusée à cet endroit · glissez pour une salve · molette : cadence',
      notes: 'Une étoile d’artifice est lancée avec une vitesse initiale puis freinée par l’air (décroissance exponentielle) et tirée vers le bas par la gravité. Pour le logo, chaque étoile reçoit la vitesse qui l’amène, au bout d’une seconde et malgré ces deux forces, sur un point du dessin.',
      params: {
        'Bouquet': {
          bouquet: { type: 'select', label: 'Bouquet', options: { mixte: 'Mélange', pivoine: 'Pivoine', saule: 'Saule', anneau: 'Anneau', palmier: 'Palmier', etoile: 'Étoile', logo: 'Logo' }, value: 'mixte' },
          image: { type: 'file', label: 'Logo', accept: 'image/*', show: (q) => q.bouquet === 'logo' || q.bouquet === 'mixte' },
          etoiles: { type: 'range', label: 'Étoiles par bouquet', min: 30, max: 400, step: 5, value: 150 },
          ampleur: { type: 'range', label: 'Ampleur', min: 0.3, max: 2, step: 0.05, value: 1 },
          duree: { type: 'range', label: 'Durée des étoiles', min: 0.4, max: 3, step: 0.05, value: 1.2 },
        },
        'Tir': {
          cadence: { type: 'range', label: 'Fusées par seconde', min: 0, max: 4, step: 0.05, value: 0.8 },
          gravite: { type: 'range', label: 'Gravité', min: 0, max: 2, step: 0.05, value: 1 },
          scintillement: { type: 'range', label: 'Scintillement', min: 0, max: 1, step: 0.01, value: 0.4 },
          trainee: { type: 'range', label: 'Traînées', min: 0, max: 0.97, step: 0.01, value: 0.82 },
        },
        'Ciel': {
          ciel: { type: 'color', label: 'Ciel', value: '#07081a' },
          horizon: { type: 'color', label: 'Horizon', value: '#1d1530' },
          reflet: { type: 'range', label: "Reflet dans l'eau", min: 0, max: 1, step: 0.01, value: 0.45 },
          couleurs: { type: 'palette', label: 'Étoiles', value: ['#e5452a', '#f2c230', '#f2b0c8', '#4b6cf0', '#f4f3f0', '#6fe0a0'] },
        },
      },
      presets: {
        'Nuit': {},
        'Saule doré': { bouquet: 'saule', couleurs: ['#f2c06a', '#ffe7a8', '#e8a23a'], etoiles: 220, duree: 2.4, trainee: 0.9, cadence: 0.5 },
        'Logo': { bouquet: 'logo', etoiles: 320, couleurs: ['#f4f3f0', '#e5452a'], cadence: 0.35, duree: 2, scintillement: 0.2 },
        'Biennale': { couleurs: [BIEN[2], BIEN[3], BIEN[4], BIEN[0]], ciel: BIEN[1], horizon: '#2a1210', bouquet: 'mixte' },
        'Anneaux': { bouquet: 'anneau', couleurs: [KB[1], KB[2], KB[3], KB[5]], ciel: KB[0], horizon: '#1a0a1f', etoiles: 120 },
        'Palmiers': { bouquet: 'palmier', couleurs: ['#f2c06a', '#e5452a', '#ffffff'], etoiles: 60, duree: 1.8, trainee: 0.9 },
        'Finale': { cadence: 3.2, etoiles: 120, duree: 1, trainee: 0.75, reflet: 0.6 },
        'Menthe': { couleurs: [MENTHE[2], MENTHE[3], MENTHE[0]], ciel: '#0b1714', horizon: MENTHE[1], bouquet: 'pivoine' },
        'Luzern': { couleurs: [LUZ[0], LUZ[1], LUZ[2], LUZ[4]], ciel: LUZ[3], horizon: '#2a1606', bouquet: 'etoile' },
        'Thermique': { couleurs: [THER[2], THER[3], THER[4], THER[5]], ciel: '#10102e', horizon: THER[1], bouquet: 'mixte', scintillement: 0.7 },
        'Acide': { bouquet: 'logo', couleurs: [ACIDE[2], ACIDE[3]], ciel: ACIDE[1], horizon: '#2a2a20', etoiles: 280, cadence: 0.5 },
        'Orbite': { couleurs: [ORB[0], ORB[2]], ciel: ORB[1], horizon: '#24100a', bouquet: 'anneau', reflet: 0.2 },
        'Jour': { ciel: '#cfe0ee', horizon: '#f4efe6', couleurs: ['#e5452a', '#2f4fa8', '#f2c230'], trainee: 0.6, reflet: 0.3, scintillement: 0 },
      },
      brand(colors) {
        const c = colors.slice(1).length ? colors.slice(1) : ['#f2c230'];
        const lum = (h) => { const n = parseInt(h.slice(1), 16); return ((n >> 16) & 255) * 0.299 + ((n >> 8) & 255) * 0.587 + (n & 255) * 0.114; };
        const all = [colors[0]].concat(c).sort((a, b) => lum(a) - lum(b));
        return { ciel: all[0], horizon: all[1] && lum(all[1]) < 90 ? all[1] : all[0], couleurs: all.slice(1).slice(0, 6) };
      },
      pointer: {
        down: (q) => { drag = { x0: q.x, y0: q.y, lx: q.x, ly: q.y, moved: false }; },
        drag: (q) => { if (!drag) return; if (Math.hypot(q.x - drag.x0, q.y - drag.y0) > 8) drag.moved = true; if (Math.hypot(q.x - drag.lx, q.y - drag.ly) > 70) { launch(q.x, q.y); drag.lx = q.x; drag.ly = q.y; } },
        up: (q) => { if (drag && !drag.moved) launch(q.x, q.y); drag = null; },
        wheel: (q, dy) => app.set('cadence', Math.max(0, Math.min(4, +(p.cadence + (dy > 0 ? -0.1 : 0.1)).toFixed(2)))),
      },
      onChange(k) { if (k === 'image') maskKey = null; },
      onSeed() { rockets = []; sparks = []; },
      export: { name: 'feux', svg: () => toSVG() },
    });
    const p = app.params;

    const G = () => Math.min(app.size.w, app.size.h) * 0.42 * p.gravite;
    const waterY = () => app.size.h * (1 - 0.24 * Math.min(1, p.reflet * 2));

    // ——— Lancement ———
    function launch(tx, ty) {
      const { w, h } = app.size, S = Math.min(w, h), r = app.random;
      const ground = waterY();
      const x0 = tx != null ? tx + (r() - 0.5) * S * 0.06 : w * (0.12 + r() * 0.76);
      const apex = ty != null ? Math.min(ground - S * 0.15, ty) : h * (0.14 + r() * 0.3);
      const H = Math.max(S * 0.1, ground - apex), g = Math.max(1, G());
      const vy = -Math.sqrt(2 * g * H), tFlight = -vy / g;
      const xT = tx != null ? tx : x0 + (r() - 0.5) * S * 0.15;
      rockets.push({ x: x0, y: ground, vx: (xT - x0) / tFlight, vy, t: 0, tFlight, kind: pickKind(), cols: pickCols() });
    }
    function pickKind() {
      if (p.bouquet !== 'mixte') return p.bouquet;
      const r = app.random(); const hasLogo = !!(p.image || app.logoImg);
      return r < 0.28 ? 'pivoine' : r < 0.46 ? 'saule' : r < 0.62 ? 'anneau' : r < 0.76 ? 'palmier' : r < 0.9 ? 'etoile' : hasLogo ? 'logo' : 'pivoine';
    }
    function pickCols() {
      const c = p.couleurs.length ? p.couleurs : ['#f2c230'], r = app.random;
      const a = c[Math.floor(r() * c.length)], b = c[Math.floor(r() * c.length)];
      return r() < 0.5 ? [a] : [a, b];
    }

    // ——— Points du logo ———
    function logoPoints() {
      const img = p.image || app.logoImg, key = img ? (img.src || 'c') : 'demo';
      if (key === maskKey && maskPts) return maskPts;
      maskKey = key;
      const M = 120, c = document.createElement('canvas'); c.width = c.height = M; const x = c.getContext('2d', { willReadFrequently: true });
      if (img) { const iw = img.naturalWidth || img.width, ih = img.naturalHeight || img.height, k = M * 0.92 / Math.max(iw, ih); x.drawImage(img, (M - iw * k) / 2, (M - ih * k) / 2, iw * k, ih * k); }
      else { x.fillStyle = '#000'; x.beginPath(); x.arc(60, 60, 56, 0, TAU); x.arc(60, 60, 34, 0, TAU, true); x.fill('evenodd'); x.fillRect(53, 2, 14, 116); }
      const d = x.getImageData(0, 0, M, M).data, inside = new Uint8Array(M * M);
      let transp = 0; for (let i = 3; i < d.length; i += 16) if (d[i] < 128) transp++;
      const useA = transp > d.length / 16 * 0.05;
      for (let i = 0; i < M * M; i++) { const l = (d[i * 4] * 0.2126 + d[i * 4 + 1] * 0.7152 + d[i * 4 + 2] * 0.0722) / 255; inside[i] = (useA ? d[i * 4 + 3] > 128 : d[i * 4 + 3] > 128 && l < 0.5) ? 1 : 0; }
      // on garde surtout le contour : un dessin d'étoiles se lit mieux par ses bords
      const edge = [], fill = [];
      for (let j = 1; j < M - 1; j++) for (let i = 1; i < M - 1; i++) {
        if (!inside[j * M + i]) continue;
        const e = !inside[j * M + i - 1] || !inside[j * M + i + 1] || !inside[(j - 1) * M + i] || !inside[(j + 1) * M + i];
        (e ? edge : fill).push([i / M - 0.5, j / M - 0.5]);
      }
      maskPts = { edge: edge.length ? edge : [[0, 0]], fill: fill.length ? fill : [[0, 0]] };
      return maskPts;
    }

    // ——— Éclatement ———
    function burst(rk) {
      const S = Math.min(app.size.w, app.size.h), r = app.random, n = Math.round(p.etoiles), amp = p.ampleur, cols = rk.cols;
      const V = S * 0.7 * amp, life = p.duree, drag = 1.6;
      flashes.push({ x: rk.x, y: rk.y, t: 0, col: cols[0] });
      const add = (vx, vy, o = {}) => sparks.push({ x: rk.x, y: rk.y, vx: vx + rk.vx * 0.15, vy: vy + rk.vy * 0.1, t: 0, life: life * (0.75 + r() * 0.5) * (o.lifeK || 1), col: o.col || cols[Math.floor(r() * cols.length)], drag: o.drag ?? drag, size: o.size || 1, trail: o.trail || 0, flick: r() < p.scintillement, hold: o.hold || 0, ph: r() * TAU, child: o.child || 0 });
      const kind = rk.kind;
      if (kind === 'pivoine' || kind === 'saule') {
        for (let i = 0; i < n; i++) {
          // direction uniforme sur la sphère, projetée : densité plus forte sur le bord, comme une vraie pivoine
          const z = r() * 2 - 1, a = r() * TAU, s = Math.sqrt(1 - z * z), sp = V * (0.92 + r() * 0.16);
          if (kind === 'saule') add(Math.cos(a) * s * sp * 0.75, Math.sin(a) * s * sp * 0.75, { drag: 2.6, lifeK: 2.1, trail: 1, size: 0.8 });
          else add(Math.cos(a) * s * sp, Math.sin(a) * s * sp);
        }
      } else if (kind === 'anneau') {
        const tilt = (r() - 0.5) * 1.2, rot = r() * TAU, ct = Math.cos(tilt + Math.PI / 2.6);
        for (let i = 0; i < n; i++) { const a = i / n * TAU, x = Math.cos(a), y = Math.sin(a) * ct, cx = x * Math.cos(rot) - y * Math.sin(rot), cy = x * Math.sin(rot) + y * Math.cos(rot); add(cx * V, cy * V, { size: 1.2 }); }
        for (let i = 0; i < n * 0.25; i++) { const a = r() * TAU, s = r() * 0.25; add(Math.cos(a) * V * s, Math.sin(a) * V * s, { col: cols[cols.length - 1], size: 0.7 }); }
      } else if (kind === 'palmier') {
        const m = 7 + Math.floor(r() * 5);
        for (let i = 0; i < m; i++) { const a = -Math.PI / 2 + (i / m - 0.5) * TAU * 0.9 + (r() - 0.5) * 0.2; add(Math.cos(a) * V * 0.9, Math.sin(a) * V * 0.9 - V * 0.15, { drag: 1.1, lifeK: 1.6, trail: 2, size: 2.2, child: 1 }); }
      } else if (kind === 'etoile') {
        const k = 5, rot = r() * TAU;
        for (let i = 0; i < n; i++) {
          const u = i / n * k, seg = Math.floor(u), f = u - seg, a0 = rot + seg / k * TAU, a1 = rot + (seg + 0.5) / k * TAU, a2 = rot + (seg + 1) / k * TAU;
          const P0 = [Math.cos(a0), Math.sin(a0)], P1 = [Math.cos(a1) * 0.42, Math.sin(a1) * 0.42], P2 = [Math.cos(a2), Math.sin(a2)];
          const q = f < 0.5 ? [P0[0] + (P1[0] - P0[0]) * f * 2, P0[1] + (P1[1] - P0[1]) * f * 2] : [P1[0] + (P2[0] - P1[0]) * (f - 0.5) * 2, P1[1] + (P2[1] - P1[1]) * (f - 0.5) * 2];
          add(q[0] * V, q[1] * V, { size: 1.1 });
        }
      } else if (kind === 'logo') {
        // vitesse calculée pour arriver sur le dessin à T, malgré la traînée k et la gravité g
        const pts = logoPoints(), T = 0.9, k = drag, g = G(), Z = S * 0.5 * amp, e = 1 - Math.exp(-k * T);
        for (let i = 0; i < n; i++) {
          const src = r() < 0.75 ? pts.edge : pts.fill, q = src[Math.floor(r() * src.length)];
          const dx = q[0] * Z, dy = q[1] * Z;
          const vx = dx * k / e, vy = (dy + g * T / k) * k / e - g / k;
          add(vx - rk.vx * 0.15, vy - rk.vy * 0.1, { hold: T, lifeK: 1.6, size: 1.1 });
        }
      }
    }

    // ——— Simulation ———
    function stepAll(dt) {
      const g = G(), { w, h } = app.size, S = Math.min(w, h);
      launchAcc += dt * p.cadence * (1 + finale);
      if (!app.thumbnail || rockets.length + sparks.length < 1) while (launchAcc >= 1) { launchAcc -= 1 + (app.random() - 0.5) * 0.6; launch(); }
      for (const rk of rockets) {
        rk.t += dt; rk.vy += g * dt; rk.x += rk.vx * dt; rk.y += rk.vy * dt;
        if (app.random() < 0.9) sparks.push({ x: rk.x, y: rk.y, vx: (app.random() - 0.5) * 20, vy: 30 + app.random() * 30, t: 0, life: 0.35 + app.random() * 0.3, col: '#ffd9a0', drag: 2, size: 0.6, trail: 0, flick: true, hold: 0, ph: app.random() * TAU, child: 0 });
        if (rk.vy >= -S * 0.02 || rk.t >= rk.tFlight) { rk.done = true; burst(rk); }
      }
      rockets = rockets.filter((r) => !r.done);
      const born = [];
      for (const s of sparks) {
        s.t += dt;
        // au-delà du temps de tenue, l'air freine beaucoup plus : le dessin reste en suspens un instant
        const k = s.hold && s.t > s.hold ? s.drag * 3.2 : s.drag, f = Math.exp(-k * dt);
        s.vx *= f; s.vy = s.vy * f + g * dt * (s.hold && s.t > s.hold && s.t < s.hold + 0.5 ? 0.15 : 1);
        s.x += s.vx * dt; s.y += s.vy * dt;
        // palmier : ses comètes lâchent des étincelles
        if (s.child && app.random() < 0.7) born.push({ x: s.x, y: s.y, vx: s.vx * 0.1 + (app.random() - 0.5) * 30, vy: s.vy * 0.1 + (app.random() - 0.5) * 30, t: 0, life: 0.5 + app.random() * 0.5, col: s.col, drag: 2.5, size: 0.6, trail: 0, flick: true, hold: 0, ph: 0, child: 0 });
      }
      sparks = sparks.filter((s) => s.t < s.life && s.y < h + 20).concat(born);
      if (sparks.length > 9000) sparks.splice(0, sparks.length - 9000);
      for (const f of flashes) f.t += dt;
      flashes = flashes.filter((f) => f.t < 0.35);
      finale = Math.max(0, finale - dt * 0.2);
    }

    // ——— Dessin ———
    const hex = (h) => { const n = parseInt(h.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; };
    function sky(x, w, h, alpha) {
      const g = x.createLinearGradient(0, 0, 0, h); g.addColorStop(0, p.ciel); g.addColorStop(1, p.horizon);
      x.globalAlpha = alpha; x.fillStyle = g; x.fillRect(0, 0, w, h); x.globalAlpha = 1;
    }
    function drawSparks(x) {
      const dark = (() => { const [r, g, b] = hex(p.ciel); return r * 0.3 + g * 0.6 + b * 0.1 < 128; })();
      x.globalCompositeOperation = dark ? 'lighter' : 'source-over';
      for (const s of sparks) {
        const u = s.t / s.life, fade = u < 0.7 ? 1 : 1 - (u - 0.7) / 0.3;
        let a = fade; if (s.flick) a *= 0.45 + 0.55 * (Math.sin(s.t * 38 + s.ph * 9) > 0 ? 1 : 0.2);
        if (a <= 0.02) continue;
        const rad = Math.max(0.6, 1.5 * s.size * (1 - u * 0.5));
        x.globalAlpha = a; x.fillStyle = s.col;
        if (s.trail) { x.strokeStyle = s.col; x.lineWidth = rad * 1.2; x.lineCap = 'round'; x.beginPath(); x.moveTo(s.x, s.y); x.lineTo(s.x - s.vx * 0.04 * s.trail, s.y - s.vy * 0.04 * s.trail); x.stroke(); }
        x.beginPath(); x.arc(s.x, s.y, rad, 0, TAU); x.fill();
      }
      for (const rk of rockets) { x.globalAlpha = 1; x.fillStyle = '#fff2d0'; x.beginPath(); x.arc(rk.x, rk.y, 1.8, 0, TAU); x.fill(); }
      x.globalAlpha = 1; x.globalCompositeOperation = 'source-over';
    }

    app.loop((t, dt) => {
      const { w, h, dpr } = app.size;
      dt = Math.min(0.04, dt || 0);
      time += dt;
      // miniature : trois bouquets tirés ensemble, image figée peu après l'éclatement
      if (app.thumbnail && !warm) { warm = true; launchAcc = 0; launch(app.size.w * 0.3, app.size.h * 0.32); launch(app.size.w * 0.68, app.size.h * 0.24); launch(app.size.w * 0.5, app.size.h * 0.4); }
      if (app.thumbnail) { dt = 1 / 60; if (hold < 0 && !rockets.length) hold = 0; if (hold >= 0) hold++; }
      const frozen = app.thumbnail && hold > 16;
      if (!frozen) stepAll(dt);
      if (!trailCv || trailCv.width !== canvas.width || trailCv.height !== canvas.height) { trailCv = document.createElement('canvas'); trailCv.width = canvas.width; trailCv.height = canvas.height; trailX = trailCv.getContext('2d'); trailX.setTransform(dpr, 0, 0, dpr, 0, 0); sky(trailX, w, h, 1); }
      trailX.setTransform(dpr, 0, 0, dpr, 0, 0);
      if (!frozen) { sky(trailX, w, h, 1 - p.trainee); drawSparks(trailX); }
      ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.drawImage(trailCv, 0, 0);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      // éclair de l'éclatement
      for (const f of flashes) {
        const R = Math.min(w, h) * 0.25 * p.ampleur, g = ctx.createRadialGradient(f.x, f.y, 0, f.x, f.y, R), [r0, g0, b0] = hex(f.col);
        g.addColorStop(0, `rgba(${r0},${g0},${b0},${0.25 * (1 - f.t / 0.35)})`); g.addColorStop(1, `rgba(${r0},${g0},${b0},0)`);
        ctx.globalCompositeOperation = 'lighter'; ctx.fillStyle = g; ctx.fillRect(f.x - R, f.y - R, R * 2, R * 2); ctx.globalCompositeOperation = 'source-over';
      }
      // reflet : le ciel renversé sous la ligne d'eau, découpé en bandes qui ondulent
      if (p.reflet > 0) {
        const wy = waterY(), H = h - wy;
        ctx.fillStyle = p.horizon; ctx.fillRect(0, wy, w, H);
        const band = 3;
        for (let y = 0; y < H; y += band) {
          const src = wy - y * 1.4 - band, off = Math.sin(y * 0.35 + time * 3) * (1 + y * 0.06) + Math.sin(y * 0.11 - time * 1.7) * 2;
          if (src < 0) break;
          ctx.globalAlpha = p.reflet * 0.75 * (1 - y / H * 0.6);
          ctx.drawImage(trailCv, 0, src * dpr, canvas.width, band * 1.4 * dpr, off, wy + y, w, band);
        }
        ctx.globalAlpha = 1;
        ctx.fillStyle = 'rgba(0,0,0,0.25)'; ctx.fillRect(0, wy, w, 1.5);
      }
      app.finish(ctx);
    });

    function toSVG() {
      const { w, h } = app.size, f = (v) => v.toFixed(1), out = [];
      const dark = (() => { const [r, g, b] = hex(p.ciel); return r * 0.3 + g * 0.6 + b * 0.1 < 128; })();
      for (const s of sparks) {
        const u = s.t / s.life, a = u < 0.7 ? 1 : 1 - (u - 0.7) / 0.3; if (a <= 0.02) continue;
        const rad = Math.max(0.6, 1.5 * s.size * (1 - u * 0.5));
        // traînée : segment le long de la vitesse
        const L = Math.min(40, Math.hypot(s.vx, s.vy) * 0.06 * (s.trail ? 2 : 1));
        const nx = s.x - s.vx / (Math.hypot(s.vx, s.vy) || 1) * L, ny = s.y - s.vy / (Math.hypot(s.vx, s.vy) || 1) * L;
        out.push(`<path d="M${f(nx)} ${f(ny)}L${f(s.x)} ${f(s.y)}" stroke="${s.col}" stroke-opacity="${(a * 0.5).toFixed(2)}" stroke-width="${f(rad * 1.2)}" stroke-linecap="round"/><circle cx="${f(s.x)}" cy="${f(s.y)}" r="${f(rad)}" fill="${s.col}" fill-opacity="${a.toFixed(2)}"/>`);
      }
      const wy = waterY();
      const water = p.reflet > 0 ? `<rect x="0" y="${f(wy)}" width="${w}" height="${f(h - wy)}" fill="${p.horizon}"/><g transform="translate(0 ${f(wy * 2)}) scale(1 -1)" opacity="${(p.reflet * 0.5).toFixed(2)}" clip-path="url(#eau)">${out.join('')}</g>` : '';
      return `<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">\n<defs><linearGradient id="ciel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${p.ciel}"/><stop offset="1" stop-color="${p.horizon}"/></linearGradient><clipPath id="eau"><rect x="0" y="${f(2 * wy - h)}" width="${w}" height="${f(h - wy)}"/></clipPath></defs>\n<rect width="100%" height="100%" fill="url(#ciel)"/>\n<g style="mix-blend-mode:${dark ? 'screen' : 'normal'}">${out.join('\n')}</g>\n${water}\n</svg>`;
    }
  </script>
</body>
</html>
