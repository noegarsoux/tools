<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jardin zen</title>
  <link rel="stylesheet" href="../../assets/ui/atelier.css">
</head>
<body>
  <canvas></canvas>
  <script src="../../assets/ui/atelier.js"></script>
  <script>
    // Jardin zen : le gravier est une couche peinte une fois, puis repeinte au fil du râteau.
    // Chaque passage de râteau est un « trait » : une polyligne centrale et une polyligne décalée par dent.
    // Le râteau aplanit une bande (couleur du sable), puis creuse ses dents : chaque sillon est un trait d'ombre
    // décalé vers la lumière et un trait clair décalé à l'opposé. Les couleurs sont opaques, on peut donc
    // repeindre un morceau déjà peint sans rien assombrir. Autour des pierres, des anneaux ; autour du logo,
    // des courbes de niveau de sa carte de distance (transformée de Felzenszwalb + carrés marchants).
    const canvas = document.querySelector('canvas');
    const ctx = canvas.getContext('2d');
    const TAU = Math.PI * 2;
    const PAL = (k) => Atelier.PALETTES[k].colors;
    const BIEN = PAL('biennale'), MEN = PAL('menthe'), KB = PAL('kegelbahn');
    const LX = -0.6, LY = -0.8; // direction de la lumière (vers la source)

    let G = null, gKey = '', logoM = null, logoKey = '', ptr = null, simT = 0;

    const app = Atelier.app({
      stage: canvas,
      animate: true,
      seed: true,
      finish: { grain: 0.05, vignette: 0.14 },
      hint: 'Glissez pour ratisser · clic : poser ou ôter une pierre · molette : nombre de dents',
      notes: 'Dans les jardins secs japonais, le gravier tient lieu d\'eau. Chaque matin, un moine le ratisse : de longs sillons parallèles pour la mer calme, des anneaux autour des rochers comme des ronds dans l\'eau. Ici, un râteau invisible repasse sans fin le jardin, en effaçant le dessin précédent sous le nouveau : sillons droits, vagues, diagonales, damier à la manière de Mirei Shigemori ou grande spirale. Les pierres reçoivent leurs anneaux à la fin de chaque passage, et le logo, posé comme une dalle, s\'entoure de courbes qui épousent sa forme. Glissez pour ratisser vous-même, cliquez pour poser une pierre ou en retirer une.',
      params: {
        'Râteau': {
          motif: { type: 'select', label: 'Motif', options: { droites: 'Sillons droits', vagues: 'Vagues', diagonales: 'Diagonales', damier: 'Damier', spirale: 'Spirale' }, value: 'droites' },
          dents: { type: 'range', label: 'Dents', min: 2, max: 12, step: 1, value: 5 },
          ecart: { type: 'range', label: 'Écart des dents', min: 0.005, max: 0.03, step: 0.0005, value: 0.011 },
          profondeur: { type: 'range', label: 'Profondeur des sillons', min: 0.1, max: 1, step: 0.01, value: 0.55 },
          ondulation: { type: 'range', label: 'Ondulation des vagues', min: 0.2, max: 2, step: 0.01, value: 1 },
        },
        'Pierres': {
          pierres: { type: 'range', label: 'Pierres', min: 0, max: 9, step: 1, value: 5 },
          taillePierres: { type: 'range', label: 'Taille', min: 0.02, max: 0.12, step: 0.001, value: 0.05 },
          anneaux: { type: 'range', label: 'Anneaux', min: 0, max: 6, step: 1, value: 2 },
          mousse: { type: 'range', label: 'Mousse', min: 0, max: 1, step: 0.01, value: 0.4 },
        },
        'Passage': {
          duree: { type: 'range', label: 'Durée d\'un passage (s)', min: 5, max: 90, step: 1, value: 26 },
          pause: { type: 'range', label: 'Pause entre deux passages (s)', min: 0, max: 20, step: 0.5, value: 2 },
          alterner: { type: 'toggle', label: 'Varier le dessin à chaque passage', value: true },
        },
        'Logo en dalle': {
          logo: { type: 'toggle', label: 'Inclure le logo', value: false },
          tailleLogo: { type: 'range', label: 'Taille du logo', min: 0.15, max: 0.7, step: 0.01, value: 0.34, show: (q) => q.logo },
          image: { type: 'file', label: 'Logo', accept: 'image/*', show: (q) => q.logo },
        },
        'Couleurs': {
          sable: { type: 'color', label: 'Gravier', value: '#e6dfd1' },
          ombre: { type: 'color', label: 'Ombre des sillons', value: '#6d6152' },
          lumiere: { type: 'color', label: 'Lumière des sillons', value: '#fbf8f1' },
          couleurs: { type: 'palette', label: 'Pierres', value: ['#4a4744', '#6a625a', '#38332f'] },
          vert: { type: 'color', label: 'Mousse', value: '#6f8a3a' },
        },
      },
      presets: {
        'Ryōan-ji': {},
        'Vagues': { motif: 'vagues', pierres: 3, taillePierres: 0.06, anneaux: 3 },
        'Damier': { motif: 'damier', pierres: 0, dents: 4, ecart: 0.012, sable: '#dcd8cf', mousse: 0 },
        'Spirale': { motif: 'spirale', pierres: 1, taillePierres: 0.07, anneaux: 1, dents: 6, ecart: 0.009 },
        'Diagonales': { motif: 'diagonales', pierres: 4, dents: 3, ecart: 0.016, anneaux: 3, profondeur: 0.75 },
        'Logo': { logo: true, pierres: 3, anneaux: 3, motif: 'vagues', ondulation: 0.6, couleurs: ['#2a2724'], vert: '#5e7a34' },
        'Nuit': { sable: '#2b2d33', ombre: '#0d0e12', lumiere: '#6f7480', couleurs: ['#15161a', '#22242a'], vert: '#3c5a3a', profondeur: 0.75, motif: 'vagues' },
        'Biennale': { sable: BIEN[0], ombre: BIEN[1], lumiere: '#ffffff', couleurs: [BIEN[1], BIEN[2], BIEN[3]], vert: BIEN[4], motif: 'diagonales', dents: 4, profondeur: 0.8 },
        'Menthe': { sable: MEN[0], ombre: MEN[3], lumiere: '#ffffff', couleurs: [MEN[1], MEN[3]], vert: MEN[2], motif: 'vagues', mousse: 0.7 },
        'Kegelbahn': { sable: KB[0], ombre: '#1d1a22', lumiere: '#ffffff', couleurs: KB.slice(1), vert: KB[2], motif: 'damier', pierres: 4, mousse: 0 },
      },
      brand(colors) {
        const s = colors.slice().sort((a, b) => lum(a) - lum(b)), L = s[s.length - 1], D = s[0];
        return { sable: L, ombre: mix(L, D, 0.75), lumiere: mix(L, '#ffffff', 0.7), couleurs: s.length > 2 ? s.slice(0, -1) : [D], vert: s[Math.floor(s.length / 2)] };
      },
      pointer: {
        down: (q) => { ptr = { x: q.x, y: q.y, moved: 0, pts: [[q.x, q.y]], t: simT }; },
        drag: (q) => { if (!ptr) return; ptr.moved += Math.hypot(q.x - ptr.x, q.y - ptr.y); ptr.x = q.x; ptr.y = q.y; if (G && ptr.moved > 6) userRake(q.x, q.y); },
        up: (q) => { if (ptr && ptr.moved < 6) toggleStone(ptr.x, ptr.y); else if (ptr && G && ptr.pts.length > 1) G.extra.push({ S: makeStroke(ptr.pts, false), t: ptr.t }); ptr = null; },
        wheel: (q, dy) => app.set('dents', Math.max(2, Math.min(12, p.dents + (dy > 0 ? -1 : 1)))),
      },
      onChange(k) { if (['*', 'logo', 'image'].includes(k)) logoKey = ''; },
      export: { name: 'jardin-zen', svg: () => toSVG() },
    });
    const p = app.params;

    function hex(x) { const n = parseInt(x.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
    function lum(x) { const c = hex(x); return (c[0] * 0.299 + c[1] * 0.587 + c[2] * 0.114) / 255; }
    function mix(a, b, t) { const A = hex(a), C = hex(b); return '#' + A.map((v, i) => Math.round(v + (C[i] - v) * t).toString(16).padStart(2, '0')).join(''); }
    function rng(s) { let a = s >>> 0; return () => { a = (a + 0x6d2b79f5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }

    // ——— Logo ———
    function buildLogo() {
      const img0 = p.image || app.logoImg, key = [p.logo, img0 ? (img0.src || 'c') : 'demo'].join(); if (key === logoKey) return; logoKey = key; gKey = '';
      const M = 200, c = document.createElement('canvas'); c.width = c.height = M; const x = c.getContext('2d', { willReadFrequently: true }), L = M * 0.94, cx = M / 2;
      if (img0) { const iw = img0.naturalWidth || img0.width, ih = img0.naturalHeight || img0.height, s = L / Math.max(iw, ih); x.drawImage(img0, cx - iw * s / 2, cx - ih * s / 2, iw * s, ih * s); }
      else { x.fillStyle = '#000'; x.beginPath(); x.arc(cx, cx, L * 0.48, 0, TAU); x.arc(cx, cx, L * 0.27, 0, TAU, true); x.fill('evenodd'); x.fillRect(cx - L * 0.07, cx - L * 0.5, L * 0.14, L); }
      const d = x.getImageData(0, 0, M, M).data; let transp = 0; for (let i = 3; i < d.length; i += 4) if (d[i] < 128) transp++; const useA = transp > M * M * 0.05;
      const m = new Uint8Array(M * M); for (let i = 0; i < M * M; i++) { const o = i * 4, l = (d[o] * 0.2126 + d[o + 1] * 0.7152 + d[o + 2] * 0.0722) / 255; m[i] = (useA ? d[o + 3] > 128 : d[o + 3] > 128 && l < 0.5) ? 1 : 0; }
      logoM = { m, M };
    }

    function sampleLogo(u, v) {
      const M = logoM.M, i = Math.floor(u), j = Math.floor(v), fu = u - i, fv = v - j, at = (a, b) => (a >= 0 && b >= 0 && a < M && b < M ? logoM.m[b * M + a] : 0);
      return (at(i, j) * (1 - fu) + at(i + 1, j) * fu) * (1 - fv) + (at(i, j + 1) * (1 - fu) + at(i + 1, j + 1) * fu) * fv;
    }
    // distance euclidienne exacte (Felzenszwalb & Huttenlocher), au carré, en cellules
    function edt1(f, n, d, v, z) {
      let k = 0; v[0] = 0; z[0] = -1e20; z[1] = 1e20;
      for (let q = 1; q < n; q++) { let s; do { const r = v[k]; s = ((f[q] + q * q) - (f[r] + r * r)) / (2 * q - 2 * r); if (s <= z[k]) k--; else break; } while (k >= 0); k++; v[k] = q; z[k] = s; z[k + 1] = 1e20; }
      k = 0; for (let q = 0; q < n; q++) { while (z[k + 1] < q) k++; const r = v[k]; d[q] = (q - r) * (q - r) + f[r]; }
    }
    function edt(F, nx, ny) {
      const n = Math.max(nx, ny), f = new Float64Array(n), d = new Float64Array(n), v = new Int32Array(n), z = new Float64Array(n + 1);
      for (let i = 0; i < nx; i++) { for (let j = 0; j < ny; j++) f[j] = F[j * nx + i]; edt1(f, ny, d, v, z); for (let j = 0; j < ny; j++) F[j * nx + i] = d[j]; }
      for (let j = 0; j < ny; j++) { for (let i = 0; i < nx; i++) f[i] = F[j * nx + i]; edt1(f, nx, d, v, z); for (let i = 0; i < nx; i++) F[j * nx + i] = Math.sqrt(d[i]); }
    }
    // carrés marchants + chaînage des segments en polylignes
    function contours(F, nx, ny, lev, ox, oy, cs) {
      const pt = new Map(), adj = new Map();
      const P = (id) => { let q = pt.get(id); if (q) return q; const cell = id >> 1, i = cell % nx, j = (cell - i) / nx; let a, b, ax, ay, bx, by; if (id & 1) { a = F[j * nx + i]; b = F[(j + 1) * nx + i]; ax = bx = i; ay = j; by = j + 1; } else { a = F[j * nx + i]; b = F[j * nx + i + 1]; ay = by = j; ax = i; bx = i + 1; } const t = (lev - a) / (b - a || 1e-9); q = [ox + (ax + (bx - ax) * t) * cs, oy + (ay + (by - ay) * t) * cs]; pt.set(id, q); return q; };
      const link = (a, b) => { (adj.get(a) || adj.set(a, []).get(a)).push(b); (adj.get(b) || adj.set(b, []).get(b)).push(a); };
      for (let j = 0; j < ny - 1; j++) for (let i = 0; i < nx - 1; i++) {
        const A = F[j * nx + i] > lev, B = F[j * nx + i + 1] > lev, C = F[(j + 1) * nx + i + 1] > lev, D = F[(j + 1) * nx + i] > lev, idx = A | (B << 1) | (C << 2) | (D << 3);
        if (idx === 0 || idx === 15) continue;
        const T = (j * nx + i) * 2, R = (j * nx + i + 1) * 2 + 1, Bo = ((j + 1) * nx + i) * 2, Le = (j * nx + i) * 2 + 1;
        const ctr = (F[j * nx + i] + F[j * nx + i + 1] + F[(j + 1) * nx + i + 1] + F[(j + 1) * nx + i]) / 4 > lev;
        switch (idx) {
          case 1: case 14: link(Le, T); break; case 2: case 13: link(T, R); break; case 3: case 12: link(Le, R); break;
          case 4: case 11: link(R, Bo); break; case 6: case 9: link(T, Bo); break; case 7: case 8: link(Le, Bo); break;
          case 5: if (ctr) { link(Le, Bo); link(T, R); } else { link(Le, T); link(R, Bo); } break;
          case 10: if (ctr) { link(Le, T); link(R, Bo); } else { link(Le, Bo); link(T, R); } break;
        }
      }
      const seen = new Set(), out = [];
      const walk = (s) => { const L = [s]; seen.add(s); let cur = s; for (;;) { const nb = (adj.get(cur) || []).find((x) => !seen.has(x)); if (nb === undefined) break; seen.add(nb); L.push(nb); cur = nb; } return L; };
      for (const [id, nb] of adj) if (nb.length === 1 && !seen.has(id)) out.push({ pts: walk(id).map(P), closed: false });
      for (const [id] of adj) if (!seen.has(id)) { const L = walk(id).map(P); out.push({ pts: L, closed: true }); }
      return out;
    }
    // rééchantillonne à pas régulier puis lisse : des normales calmes pour décaler les dents
    function smoothLine(pts, closed, step) {
      const P = closed ? pts.concat([pts[0]]) : pts; let L = 0; for (let k = 1; k < P.length; k++) L += Math.hypot(P[k][0] - P[k - 1][0], P[k][1] - P[k - 1][1]);
      if (L < G.W * 6) return null;
      const n = Math.max(8, Math.round(L / step)), o = []; let k = 0, acc = 0;
      for (let i = 0; i < n + (closed ? 0 : 1); i++) { const s = i * L / n; while (k < P.length - 2 && acc + Math.hypot(P[k + 1][0] - P[k][0], P[k + 1][1] - P[k][1]) < s) { acc += Math.hypot(P[k + 1][0] - P[k][0], P[k + 1][1] - P[k][1]); k++; } const sl = Math.hypot(P[k + 1][0] - P[k][0], P[k + 1][1] - P[k][1]) || 1, t = Math.min(1, (s - acc) / sl); o.push([P[k][0] + (P[k + 1][0] - P[k][0]) * t, P[k][1] + (P[k + 1][1] - P[k][1]) * t]); }
      let A = o; for (let it = 0; it < 4; it++) { const B = A.map((q, i) => { if (!closed && (i === 0 || i === A.length - 1)) return q; const a = A[(i - 1 + A.length) % A.length], c = A[(i + 1) % A.length]; return [(a[0] + q[0] * 2 + c[0]) / 4, (a[1] + q[1] * 2 + c[1]) / 4]; }); A = B; }
      return A;
    }
    function chaikin(pts, closed) {
      const o = []; const n = pts.length; for (let k = 0; k < (closed ? n : n - 1); k++) { const a = pts[k], b = pts[(k + 1) % n]; o.push([a[0] * 0.75 + b[0] * 0.25, a[1] * 0.75 + b[1] * 0.25], [a[0] * 0.25 + b[0] * 0.75, a[1] * 0.25 + b[1] * 0.75]); }
      if (!closed) { o.unshift(pts[0]); o.push(pts[n - 1]); } return o;
    }

    // ——— Traits de râteau ———
    function makeStroke(pts0, closed) {
      const pts = closed ? pts0.concat([pts0[0]]) : pts0.slice(), n = pts.length, cum = new Float64Array(n);
      for (let k = 1; k < n; k++) cum[k] = cum[k - 1] + Math.hypot(pts[k][0] - pts[k - 1][0], pts[k][1] - pts[k - 1][1]);
      const seg = []; for (let k = 0; k < n - 1; k++) { const dx = pts[k + 1][0] - pts[k][0], dy = pts[k + 1][1] - pts[k][1], l = Math.hypot(dx, dy) || 1; seg.push([-dy / l, dx / l]); }
      const nor = []; for (let k = 0; k < n; k++) {
        let a = seg[k - 1], b = seg[k]; if (closed && (k === 0 || k === n - 1)) { a = seg[n - 2]; b = seg[0]; }
        a = a || b; b = b || a; if (!a) { nor.push([0, 0]); continue; }
        let nx = a[0] + b[0], ny = a[1] + b[1], l = Math.hypot(nx, ny); if (l < 1e-6) { nx = b[0]; ny = b[1]; l = 1; } nx /= l; ny /= l; const c = Math.max(0.5, nx * b[0] + ny * b[1]); nor.push([nx / c, ny / c]);
      }
      const D = p.dents, sp = G.sp, off = [];
      for (let i = 0; i < D; i++) { const o = (i - (D - 1) / 2) * sp; off.push(pts.map((q, k) => [q[0] + nor[k][0] * o, q[1] + nor[k][1] * o])); }
      return { pts, cum, L: cum[n - 1], off, nor, closed };
    }
    function sub(arr, cum, a, b) {
      const n = cum.length; if (n < 2 || b <= a) return null; const o = [];
      let k = 0; while (k < n - 2 && cum[k + 1] < a) k++;
      const at = (j, s) => { const t = (s - cum[j]) / ((cum[j + 1] - cum[j]) || 1e-9); return [arr[j][0] + (arr[j + 1][0] - arr[j][0]) * t, arr[j][1] + (arr[j + 1][1] - arr[j][1]) * t]; };
      o.push(at(k, Math.max(a, 0)));
      for (let j = k + 1; j < n; j++) { if (cum[j] >= b) { o.push(at(j - 1, b)); return o; } o.push(arr[j]); }
      return o;
    }
    function cols() { const S = p.sable, d = p.profondeur; return { band: S, dark: mix(S, p.ombre, d), light: mix(S, p.lumiere, Math.min(1, d * 1.1)) }; }
    // dessine la portion [a, b] d'un trait ; les dents sont reprises un peu en arrière pour recoller les morceaux
    function drawRange(pen, S, a, b, back) {
      const c = cols(), sp = G.sp, W = G.W;
      const band = sub(S.pts, S.cum, Math.max(0, a - Math.min(back == null ? W : back, sp)), b); if (!band) return;
      const z = S.closed && a <= 0 && b >= S.L; // anneau entier : chemin fermé, sans couture
      pen.line(band, c.band, W + sp * 0.2, false, 0, 0, z);
      const a2 = Math.max(0, a - (back == null ? W : back)), dd = sp * 0.16;
      for (const O of S.off) { const L = sub(O, S.cum, a2, b); if (!L) continue; pen.line(L, c.dark, sp * 0.4, false, LX * dd, LY * dd, z); }
      for (const O of S.off) { const L = sub(O, S.cum, a2, b); if (!L) continue; pen.line(L, c.light, sp * 0.26, false, -LX * dd * 1.2, -LY * dd * 1.2, z); }
    }

    // ——— Jardin ———
    function blob(R, r, n) { const ph = [R() * TAU, R() * TAU, R() * TAU], o = []; for (let k = 0; k < n; k++) { const a = k / n * TAU; o.push(r * (1 + 0.07 * Math.sin(a * 2 + ph[0]) + 0.05 * Math.sin(a * 3 + ph[1]) + 0.03 * Math.sin(a * 5 + ph[2]))); } return o; }
    function newStone(R, x, y, r) { return { x, y, r, rr: blob(R, r, 40), moss: blob(R, r * (1.08 + 0.32 * p.mousse), 40), top: blob(R, r * 0.62, 40), rot: R() * TAU, col: p.couleurs.length ? p.couleurs[Math.floor(R() * p.couleurs.length)] : '#444444' }; }
    function reach(s) { return s.r * (1.12 + 0.34 * p.mousse); }

    function garden(w, h) {
      buildLogo();
      const key = [p.motif, p.dents, p.ecart, p.profondeur, p.ondulation, p.pierres, p.taillePierres, p.anneaux, p.mousse, p.logo, p.tailleLogo, logoKey, p.sable, p.ombre, p.lumiere, p.couleurs.join(), p.vert, app.seed, w, h, app.size.dpr].join();
      if (key === gKey && G) return G; gKey = key;
      const R = rng(app.seed * 7919 + 3), m = Math.min(w, h), sp = m * p.ecart, W = sp * p.dents;
      G = { w, h, m, sp, W, R, stones: [], logo: null, v: 0, extra: [], pass: null, wait: 0 };
      // logo en dalle, au centre
      if (p.logo && logoM) {
        const S = m * p.tailleLogo * 1.6, marg = (p.anneaux + 1) * W + sp * 2, side = S + marg * 2, cs = Math.max(1.5, side / 240), nx = Math.ceil(side / cs) + 1, ox = w * 0.5 - side / 2, oy = h * 0.5 - side / 2;
        const F = new Float64Array(nx * nx), Mk = new Float64Array(nx * nx);
        for (let j = 0; j < nx; j++) for (let i = 0; i < nx; i++) { const x = ox + i * cs, y = oy + j * cs, inn = sampleLogo(((x - w / 2) / S + 0.5) * logoM.M - 0.5, ((y - h / 2) / S + 0.5) * logoM.M - 0.5) > 0.5; F[j * nx + i] = inn ? 0 : 1e20; Mk[j * nx + i] = sampleLogo(((x - w / 2) / S + 0.5) * logoM.M - 0.5, ((y - h / 2) / S + 0.5) * logoM.M - 0.5); }
        edt(F, nx, nx);
        // bordure fermée pour que les contours se referment
        for (let k = 0; k < nx; k++) { Mk[k] = Mk[(nx - 1) * nx + k] = Mk[k * nx] = Mk[k * nx + nx - 1] = 0; }
        const shape = contours(Mk, nx, nx, 0.5, ox, oy, cs).map((c) => chaikin(chaikin(c.pts, c.closed), c.closed));
        const rings = []; for (let j = 0; j < p.anneaux; j++) for (const c of contours(F, nx, nx, (sp * 1.2 + W * (j + 0.5)) / cs, ox, oy, cs)) { const q = smoothLine(c.pts, c.closed, sp); if (q) rings.push({ pts: q, closed: c.closed }); }
        G.logo = { shape, rings, R: S * 0.5 + marg };
      }
      // pierres, sans chevauchement d'anneaux
      for (let k = 0, tries = 0; k < p.pierres && tries < 600; tries++) {
        const r = m * p.taillePierres * (0.6 + R() * 0.7), s = newStone(R, 0, 0, r), zone = reach(s) + p.anneaux * W + sp;
        s.x = zone * 0.4 + R() * (w - zone * 0.8); s.y = zone * 0.4 + R() * (h - zone * 0.8);
        let ok = true; for (const o of G.stones) if (Math.hypot(o.x - s.x, o.y - s.y) < zone + reach(o) + p.anneaux * W + sp) ok = false;
        if (G.logo && Math.hypot(s.x - w / 2, s.y - h / 2) < G.logo.R + zone * 0.8) ok = false;
        if (ok) { G.stones.push(s); k++; }
      }
      G.layer = document.createElement('canvas'); G.layer.width = Math.ceil(w * app.size.dpr); G.layer.height = Math.ceil(h * app.size.dpr);
      G.lctx = G.layer.getContext('2d'); G.lctx.setTransform(app.size.dpr, 0, 0, app.size.dpr, 0, 0);
      G.base = pattern(0); G.lctx.fillStyle = p.sable; G.lctx.fillRect(0, 0, w, h);
      for (const S of G.base.list) drawRange(layerPen(), S, 0, S.L, 0);
      const mk = () => { const c = document.createElement('canvas'); c.width = G.layer.width; c.height = G.layer.height; const g = c.getContext('2d'); g.setTransform(app.size.dpr, 0, 0, app.size.dpr, 0, 0); return { c, g }; }; G.A = mk(); G.B = mk();
      G.wait = p.pause; return G;
    }

    function ringStrokes() {
      const out = [], W = G.W;
      for (const s of G.stones) for (let j = 0; j < p.anneaux; j++) {
        const r = s.r * 0.95 + W * (j + 0.5), n = Math.max(32, Math.ceil(TAU * r / (G.sp * 1.5))), a0 = s.rot + j; const pts = [];
        for (let k = 0; k < n; k++) { const a = a0 + k / n * TAU; pts.push([s.x + Math.cos(a) * r, s.y + Math.sin(a) * r]); }
        out.push(makeStroke(pts, true));
      }
      if (G.logo) for (const c of G.logo.rings) out.push(makeStroke(c.pts, c.closed));
      return out;
    }

    function pattern(v) {
      const { w, h, W, sp } = G, list = [], mo = p.motif, alt = p.alterner ? v : 0;
      if (mo === 'droites' || mo === 'vagues') {
        const vert = mo === 'droites' && alt % 2 === 1, A = mo === 'vagues' ? W * 0.75 * p.ondulation : 0, lam = W * 7, ph = alt * 1.7 + (alt % 2) * Math.PI;
        const span = vert ? w : h, len = vert ? h : w, nl = Math.ceil((span + A * 2) / W) + 1, o0 = (span - (nl - 1) * W) / 2;
        for (let i = 0; i < nl; i++) {
          const c = o0 + i * W, pts = [], step = A > 0 ? sp * 0.8 : len + W * 2;
          for (let t = -W; t <= len + W + 1e-6; t += step) { const y = c + A * Math.sin(t / lam * TAU + ph); pts.push(vert ? [y, t] : [t, y]); }
          if (pts.length < 2) pts.push(vert ? [c, len + W] : [len + W, c]);
          if (i % 2) pts.reverse(); list.push(makeStroke(pts, false));
        }
      } else if (mo === 'diagonales') {
        const sg = alt % 2 ? -1 : 1, dx = Math.SQRT1_2, dy = sg * Math.SQRT1_2, nx = -dy, ny = dx, cx = w / 2, cy = h / 2, rad = Math.hypot(w, h) / 2 + W, nl = Math.ceil(rad * 2 / W);
        for (let i = 0; i < nl; i++) {
          const o = -rad + (i + 0.5) * W, px = cx + nx * o, py = cy + ny * o;
          let t0 = -1e9, t1 = 1e9; for (const [p0, d, lo, hi] of [[px, dx, -W, w + W], [py, dy, -W, h + W]]) { const a = (lo - p0) / d, b = (hi - p0) / d; t0 = Math.max(t0, Math.min(a, b)); t1 = Math.min(t1, Math.max(a, b)); }
          if (t1 <= t0) continue; let pts = [[px + dx * t0, py + dy * t0], [px + dx * t1, py + dy * t1]]; if (list.length % 2) pts.reverse(); list.push(makeStroke(pts, false));
        }
      } else if (mo === 'damier') {
        const T = W * 3, nx = Math.ceil(w / T), ny = Math.ceil(h / T), ox = (w - nx * T) / 2, oy = (h - ny * T) / 2;
        for (let b = 0; b < ny; b++) for (let a0 = 0; a0 < nx; a0++) {
          const a = b % 2 ? nx - 1 - a0 : a0, x = ox + a * T, y = oy + b * T, hor = (a + b + alt) % 2 === 0;
          for (let k = 0; k < 3; k++) { let pts = hor ? [[x, y + W * (k + 0.5)], [x + T, y + W * (k + 0.5)]] : [[x + W * (k + 0.5), y], [x + W * (k + 0.5), y + T]]; if (k % 2) pts.reverse(); list.push(makeStroke(pts, false)); }
        }
      } else {
        const R = rng(app.seed * 131 + alt * 977 + 7), st = G.stones.length && alt % 2 === 0 ? G.stones[0] : null;
        const cx = G.logo ? w / 2 : st ? st.x : w * (0.3 + R() * 0.4), cy = G.logo ? h / 2 : st ? st.y : h * (0.3 + R() * 0.4), r0 = G.logo ? G.logo.R : st ? reach(st) + W * 0.5 : W;
        const rmax = Math.hypot(Math.max(cx, w - cx), Math.max(cy, h - cy)) + W, pts = [], dir = alt % 2 ? -1 : 1;
        for (let th = 0, r = r0; r < rmax; ) { pts.push([cx + Math.cos(th * dir) * r, cy + Math.sin(th * dir) * r]); const dth = Math.min(0.3, sp * 0.8 / r); th += dth; r = r0 + W * th / TAU; }
        list.push(makeStroke(pts, false));
      }
      const nLines = list.length; for (const S of ringStrokes()) list.push(S);
      let tot = 0; const starts = []; for (const S of list) { starts.push(tot); tot += S.L; }
      return { list, starts, tot, nLines };
    }

    function layerPen(g0) {
      const g = g0 || G.lctx;
      return { line(pts, c, lw, round, dx, dy, z) { g.beginPath(); g.moveTo(pts[0][0] + dx, pts[0][1] + dy); for (let k = 1; k < pts.length; k++) g.lineTo(pts[k][0] + dx, pts[k][1] + dy); if (z) g.closePath(); g.strokeStyle = c; g.lineWidth = lw; g.lineCap = round ? 'round' : 'butt'; g.lineJoin = 'round'; g.stroke(); } };
    }

    // ——— Interaction ———
    function userRake(x, y) {
      const P = ptr.pts, last = P[P.length - 1]; if (Math.hypot(x - last[0], y - last[1]) < G.sp * 1.2) return;
      P.push([x, y]); const k = P.length, part = P.slice(Math.max(0, k - 4)); if (part.length < 2) return;
      const S = makeStroke(part, false), segL = S.L - S.cum[S.cum.length - 2];
      drawRange(layerPen(), S, S.L - segL, S.L, S.L);
      ptr.dir = [x - last[0], y - last[1]];
    }
    function toggleStone(x, y) {
      if (!G) return;
      const i = G.stones.findIndex((s) => Math.hypot(s.x - x, s.y - y) < reach(s)); if (i >= 0) { G.stones.splice(i, 1); return; }
      const R = rng((x * 131 + y * 71 + simT * 1000) | 0), s = newStone(R, x, y, G.m * p.taillePierres * (0.7 + R() * 0.5)); G.stones.push(s);
      const W = G.W; for (let j = 0; j < p.anneaux; j++) { const r = s.r * 0.95 + W * (j + 0.5), n = Math.max(32, Math.ceil(TAU * r / (G.sp * 1.5))), pts = []; for (let k = 0; k < n; k++) { const a = s.rot + j + k / n * TAU; pts.push([x + Math.cos(a) * r, y + Math.sin(a) * r]); } const S = makeStroke(pts, true); drawRange(layerPen(), S, 0, S.L, 0); G.extra.push({ S, t: simT }); }
    }

    // ——— Passages ———
    // Un passage : le nouveau dessin est peint d'un coup dans deux calques cachés (A : sillons, B : sillons + anneaux),
    // puis dévoilé morceau par morceau sous le râteau, à travers la bande qu'il couvre. Repeindre une image identique
    // sur elle-même ne change rien : les morceaux se recouvrent un peu, sans couture.
    function startPass() {
      G.v++; const P = pattern(G.v);
      for (const [T, n] of [[G.A, P.nLines], [G.B, P.list.length]]) { T.g.fillStyle = p.sable; T.g.fillRect(0, 0, G.w, G.h); const pen = layerPen(T.g); for (let i = 0; i < n; i++) drawRange(pen, P.list[i], 0, P.list[i].L, 0); }
      G.pass = { P, s: 0, t0: simT, speed: P.tot / Math.max(1, p.duree) };
    }
    function reveal(S, a, b, src) {
      const hw = G.W / 2 + G.sp * 0.12, g = G.lctx, C = sub(S.pts, S.cum, a, b), N = sub(S.nor, S.cum, a, b); if (!C || C.length < 2) return;
      g.save(); g.beginPath();
      C.forEach((q, k) => { const nl = Math.hypot(N[k][0], N[k][1]) || 1, x = q[0] + N[k][0] / nl * hw, y = q[1] + N[k][1] / nl * hw; k ? g.lineTo(x, y) : g.moveTo(x, y); });
      for (let k = C.length - 1; k >= 0; k--) { const nl = Math.hypot(N[k][0], N[k][1]) || 1; g.lineTo(C[k][0] - N[k][0] / nl * hw, C[k][1] - N[k][1] / nl * hw); }
      g.closePath(); g.clip(); g.setTransform(1, 0, 0, 1, 0, 0); g.drawImage(src.c, 0, 0); g.restore();
    }
    function advance(dt) {
      if (!G.pass) { G.wait -= dt; if (G.wait <= 0) startPass(); return; }
      const Pa = G.pass, s0 = Pa.s, s1 = Math.min(Pa.P.tot, s0 + Pa.speed * dt), L = Pa.P.list;
      for (let i = 0; i < L.length; i++) { const a = Pa.P.starts[i], S = L[i]; if (a + S.L < s0 - G.sp || a > s1) continue; const la = Math.max(0, s0 - a - G.sp), lb = Math.min(S.L, s1 - a); if (lb > la) reveal(S, la, lb, i < Pa.P.nLines ? G.A : G.B); }
      Pa.s = s1;
      if (s1 >= Pa.P.tot) { G.base = Pa.P; G.extra = G.extra.filter((e) => e.t > Pa.t0); G.pass = null; G.wait = p.pause; }
    }
    function rakePos() {
      if (ptr && ptr.dir && ptr.moved > 6) return { x: ptr.x, y: ptr.y, dx: ptr.dir[0], dy: ptr.dir[1] };
      const Pa = G.pass; if (!Pa) return null;
      let i = 0; while (i < Pa.P.list.length - 1 && Pa.P.starts[i + 1] <= Pa.s) i++;
      const S = Pa.P.list[i], l = Math.min(S.L, Pa.s - Pa.P.starts[i]); let k = 0; while (k < S.cum.length - 2 && S.cum[k + 1] < l) k++;
      const t = (l - S.cum[k]) / ((S.cum[k + 1] - S.cum[k]) || 1), a = S.pts[k], b = S.pts[k + 1];
      return { x: a[0] + (b[0] - a[0]) * t, y: a[1] + (b[1] - a[1]) * t, dx: b[0] - a[0], dy: b[1] - a[1] };
    }

    // ——— Dessin des pierres (commun canvas / SVG) ———
    function poly(s, rr, sc, dx, dy) { const n = rr.length, o = []; for (let k = 0; k < n; k++) { const a = s.rot + k / n * TAU; o.push([s.x + dx + Math.cos(a) * rr[k] * sc, s.y + dy + Math.sin(a) * rr[k] * sc]); } return o; }
    function stones(pen) {
      const sh = p.ombre;
      if (G.logo) { const d = G.sp * 1.4, cs = p.couleurs[0] || '#333333'; pen.shape(G.logo.shape, sh, 0.35, -LX * d * 2, -LY * d * 2); pen.shape(G.logo.shape, cs, 1, 0, 0); pen.shape(G.logo.shape, mix(cs, '#ffffff', 0.14), 1, LX * d * 0.35, LY * d * 0.35, 0.985); }
      for (const s of G.stones) {
        const r = s.r;
        if (p.mousse > 0.01) { pen.poly(poly(s, s.moss, 1, 0, 0), p.vert, 1); pen.poly(poly(s, s.moss, 0.92, LX * r * 0.05, LY * r * 0.05), mix(p.vert, '#ffffff', 0.12), 1); }
        pen.poly(poly(s, s.rr, 1, -LX * r * 0.16, -LY * r * 0.16), sh, 0.4);
        pen.poly(poly(s, s.rr, 1, 0, 0), s.col, 1);
        pen.poly(poly(s, s.top, 1, LX * r * 0.18, LY * r * 0.18), mix(s.col, '#ffffff', 0.16), 1);
        pen.poly(poly(s, s.top, 0.45, LX * r * 0.32, LY * r * 0.32), mix(s.col, '#ffffff', 0.28), 1);
      }
    }
    function canvasPen() {
      return {
        poly(pts, c, a) { ctx.globalAlpha = a; ctx.fillStyle = c; ctx.beginPath(); pts.forEach((q, k) => k ? ctx.lineTo(q[0], q[1]) : ctx.moveTo(q[0], q[1])); ctx.closePath(); ctx.fill(); ctx.globalAlpha = 1; },
        shape(loops, c, a, dx, dy, sc) { ctx.save(); ctx.globalAlpha = a; ctx.fillStyle = c; ctx.translate(dx, dy); if (sc) { ctx.translate(G.w / 2, G.h / 2); ctx.scale(sc, sc); ctx.translate(-G.w / 2, -G.h / 2); } ctx.beginPath(); for (const L of loops) L.forEach((q, k) => k ? ctx.lineTo(q[0], q[1]) : ctx.moveTo(q[0], q[1])); ctx.fill('evenodd'); ctx.restore(); },
      };
    }
    function drawRake(r) {
      const l = Math.hypot(r.dx, r.dy) || 1, ux = r.dx / l, uy = r.dy / l, nx = -uy, ny = ux, W = G.W * 0.56, wood = mix(p.ombre, '#a07a4c', 0.55);
      ctx.save(); ctx.lineCap = 'round';
      ctx.strokeStyle = 'rgba(0,0,0,0.18)'; ctx.lineWidth = G.sp * 0.7; ctx.beginPath(); ctx.moveTo(r.x - ux * G.sp + 6, r.y - uy * G.sp + 8); ctx.lineTo(r.x - ux * G.W * 2.2 + 6, r.y - uy * G.W * 2.2 + 8); ctx.stroke();
      ctx.strokeStyle = wood; ctx.lineWidth = G.sp * 0.55; ctx.beginPath(); ctx.moveTo(r.x - ux * G.sp, r.y - uy * G.sp); ctx.lineTo(r.x - ux * G.W * 2.2, r.y - uy * G.W * 2.2); ctx.stroke();
      ctx.lineWidth = G.sp * 0.9; ctx.beginPath(); ctx.moveTo(r.x + nx * W - ux * G.sp, r.y + ny * W - uy * G.sp); ctx.lineTo(r.x - nx * W - ux * G.sp, r.y - ny * W - uy * G.sp); ctx.stroke();
      ctx.restore();
    }

    app.loop((t, dt) => {
      dt = Math.min(1 / 20, dt || 0);
      const { w, h, dpr } = app.size; garden(w, h);
      if (!app.thumbnail) { simT += dt; advance(dt); }
      ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.drawImage(G.layer, 0, 0, canvas.width, canvas.height);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      stones(canvasPen());
      if (!app.thumbnail) { const r = rakePos(); if (r) drawRake(r); }
      app.finish(ctx);
    });

    function toSVG() {
      const { w, h } = app.size, f = (v) => +v.toFixed(2); garden(w, h);
      let s = `<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><rect width="100%" height="100%" fill="${p.sable}"/>`;
      const pen = { line(pts, c, lw, round, dx, dy, z) { s += `<path d="M${pts.map((q) => f(q[0] + dx) + ' ' + f(q[1] + dy)).join('L')}${z ? 'Z' : ''}" fill="none" stroke="${c}" stroke-width="${f(lw)}" stroke-linecap="${round ? 'round' : 'butt'}" stroke-linejoin="round"/>`; } };
      for (const S of G.base.list) drawRange(pen, S, 0, S.L, 0);
      if (G.pass) { const Pa = G.pass; for (let i = 0; i < Pa.P.list.length; i++) { const a = Pa.P.starts[i], S = Pa.P.list[i]; if (a >= Pa.s) break; drawRange(pen, S, 0, Math.min(S.L, Pa.s - a), 0); } }
      for (const e of G.extra) drawRange(pen, e.S, 0, e.S.L, 0);
      const ptsD = (pts) => 'M' + pts.map((q) => f(q[0]) + ' ' + f(q[1])).join('L') + 'Z';
      stones({
        poly(pts, c, a) { s += `<path d="${ptsD(pts)}" fill="${c}"${a < 1 ? ` fill-opacity="${a}"` : ''}/>`; },
        shape(loops, c, a, dx, dy, sc) { const k = sc || 1, cx = w / 2, cy = h / 2; s += `<path d="${loops.map((L) => ptsD(L.map((q) => [cx + (q[0] - cx) * k + dx, cy + (q[1] - cy) * k + dy]))).join('')}" fill="${c}" fill-rule="evenodd"${a < 1 ? ` fill-opacity="${a}"` : ''}/>`; },
      });
      return s + '</svg>';
    }
  </script>
</body>
