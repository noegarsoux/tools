<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dominos</title>
  <link rel="stylesheet" href="../../assets/ui/atelier.css">
</head>
<body>
  <canvas></canvas>
  <script src="../../assets/ui/atelier.js"></script>
  <script>
    // Dominos : une chaîne de dominos aux couleurs de la marque, posée en spirale, en serpentin, en arbre
    // qui se divise ou sur le contour du logo. Le premier tombe, chacun bascule comme un pendule inversé
    // et pousse le suivant ; puis la chaîne se relève et recommence. Vue en perspective cavalière.
    const canvas = document.querySelector('canvas');
    const ctx = canvas.getContext('2d');
    const TAU = Math.PI * 2;
    const PAL = (k) => Atelier.PALETTES[k].colors;
    const BIEN = PAL('biennale'), KB = PAL('kegelbahn'), SALON = PAL('salon'), BIT = PAL('bitmap'), THER = PAL('thermique'), GLY = PAL('glyphes'), MENTHE = PAL('menthe'), ACIDE = PAL('acide'), PYR = PAL('pyramides');

    let doms = [], roots = [], dKey = '', phase = 'wait', phaseT = 0, drag = null, drawnPaths = [], vecCache = null, vecKey = null, warm = false;

    const app = Atelier.app({
      stage: canvas,
      animate: true,
      seed: true,
      finish: { grain: 0.04, vignette: 0.12 },
      hint: 'Touchez un domino pour le pousser · glissez pour poser une nouvelle file · molette : vitesse',
      notes: 'Chaque domino est un pendule inversé : une fois poussé, il bascule de plus en plus vite autour de son arête avant, jusqu’à toucher le suivant, qu’il pousse à son tour, puis il reste appuyé sur lui. L’onde avance ainsi à vitesse presque constante.',
      params: {
        'Parcours': {
          chemin: { type: 'select', label: 'Parcours', options: { spirale: 'Spirale', serpentin: 'Serpentin', arbre: 'Arbre', logo: 'Logo', vagues: 'Vagues' }, value: 'spirale' },
          image: { type: 'file', label: 'Logo', accept: 'image/*', show: (q) => q.chemin === 'logo' },
          hauteur: { type: 'range', label: 'Hauteur des dominos', min: 0.015, max: 0.08, step: 0.001, value: 0.035 },
          espacement: { type: 'range', label: 'Espacement', min: 0.35, max: 0.8, step: 0.01, value: 0.55 },
          largeur: { type: 'range', label: 'Largeur', min: 0.25, max: 1, step: 0.01, value: 0.5 },
        },
        'Chute': {
          vitesse: { type: 'range', label: 'Vitesse', min: 0.2, max: 3, step: 0.05, value: 1.4 },
          vue: { type: 'range', label: 'Inclinaison de la vue', min: 0.2, max: 1, step: 0.01, value: 0.55 },
          ombre: { type: 'toggle', label: 'Ombres', value: true },
        },
        'Couleurs': {
          coloration: { type: 'select', label: 'Couleur', options: { alterne: 'En alternance', bandes: 'Par bandes', degrade: 'Le long du chemin', une: 'Une seule' }, value: 'bandes' },
          couleurs: { type: 'palette', label: 'Dominos', value: ['#e5452a', '#111111', '#f2b0c8', '#f2e640'] },
          fond: { type: 'color', label: 'Sol', value: '#f4f3f0' },
        },
      },
      presets: {
        'Spirale': {},
        'Serpentin': { chemin: 'serpentin', couleurs: [SALON[2], SALON[3], SALON[4], SALON[1]], fond: SALON[0], coloration: 'alterne' },
        'Arbre': { chemin: 'arbre', couleurs: [MENTHE[3], MENTHE[1], MENTHE[2]], fond: MENTHE[0], coloration: 'degrade' },
        'Logo': { chemin: 'logo', hauteur: 0.028, couleurs: [KB[1], KB[2], KB[3], KB[5]], fond: KB[0], coloration: 'bandes' },
        'Vagues': { chemin: 'vagues', couleurs: [BIT[2], BIT[3], BIT[4]], fond: BIT[0], coloration: 'bandes' },
        'Kegelbahn': { chemin: 'spirale', couleurs: [KB[1], KB[2], KB[3], KB[4], KB[5]], fond: KB[0], coloration: 'alterne' },
        'Thermique': { chemin: 'serpentin', couleurs: [THER[1], THER[2], THER[3], THER[4], THER[5]], fond: THER[0], coloration: 'degrade' },
        'Glyphes': { chemin: 'arbre', couleurs: [GLY[2], GLY[3], GLY[4], GLY[5], GLY[6]], fond: GLY[1], coloration: 'alterne' },
        'Grands': { hauteur: 0.07, espacement: 0.6, largeur: 0.6, chemin: 'serpentin', vitesse: 0.7 },
        'Petits': { hauteur: 0.018, chemin: 'logo', couleurs: ['#111111'], coloration: 'une', fond: '#e9e6df' },
        'Acide': { couleurs: [ACIDE[2], ACIDE[3], ACIDE[1]], fond: '#2a2a24', chemin: 'vagues', coloration: 'alterne' },
        'Pyramides': { couleurs: [PYR[2], PYR[3], PYR[4], PYR[5]], fond: PYR[0], chemin: 'arbre', vue: 0.8 },
        'Vue haute': { vue: 0.95, chemin: 'spirale', coloration: 'degrade' },
      },
      brand(colors) {
        const fond = colors[0], c = colors.slice(1);
        return { fond, couleurs: c.length ? c : ['#111111'] };
      },
      pointer: {
        down: (q) => { drag = { pts: [[q.x, q.y]], moved: false, x0: q.x, y0: q.y }; },
        drag: (q) => {
          if (!drag) return;
          if (Math.hypot(q.x - drag.x0, q.y - drag.y0) > 10) drag.moved = true;
          const l = drag.pts[drag.pts.length - 1];
          if (Math.hypot(q.x - l[0], q.y - l[1]) > 4) drag.pts.push([q.x, q.y]);
        },
        up: (q) => {
          if (!drag) return;
          if (!drag.moved) pushAt(q.x, q.y);
          else if (drag.pts.length > 4) { drawnPaths.push(drag.pts.map(([x, y]) => toGround(x, y))); dKey = ''; }
          drag = null;
        },
        wheel: (q, dy) => app.set('vitesse', Math.max(0.2, Math.min(3, +(p.vitesse + (dy > 0 ? -0.1 : 0.1)).toFixed(2)))),
      },
      onChange(k) { if (k === 'image') vecKey = null; if (['chemin', 'image', 'hauteur', 'espacement', 'largeur', 'couleurs', 'coloration', 'vue'].includes(k)) dKey = ''; },
      onSeed() { dKey = ''; drawnPaths = []; },
      export: { name: 'dominos', svg: () => toSVG() },
    });
    const p = app.params;

    // ——— Projection : sol (X, Y) vu en biais, hauteur Z vers le haut ———
    function view() {
      const { w, h } = app.size, cy = Math.max(0.2, p.vue);
      // le sol est écrasé verticalement par cos de l'inclinaison ; la hauteur par son sinus
      return { w, h, sy: cy, sz: Math.sqrt(1 - cy * cy * 0.85), ox: w / 2, oy: h / 2 };
    }
    const proj = (V, X, Y, Z) => [V.ox + X, V.oy + Y * V.sy - Z * V.sz];
    function toGround(x, y) { const V = view(); return [x - V.ox, (y - V.oy) / V.sy]; }

    // ——— Parcours ———
    function logoLoops() {
      const img = p.image || app.logoImg, key = img ? (img.src || 'c') : 'demo';
      if (key === vecKey && vecCache) return vecCache;
      vecKey = key;
      const L = 200, c = document.createElement('canvas'); c.width = c.height = L; const x = c.getContext('2d', { willReadFrequently: true });
      if (img) { const iw = img.naturalWidth || img.width, ih = img.naturalHeight || img.height, k = L * 0.9 / Math.max(iw, ih); x.drawImage(img, (L - iw * k) / 2, (L - ih * k) / 2, iw * k, ih * k); }
      else { x.fillStyle = '#000'; x.beginPath(); x.arc(100, 100, 86, 0, TAU); x.arc(100, 100, 50, 0, TAU, true); x.fill('evenodd'); x.fillRect(90, 6, 20, 188); }
      const d = x.getImageData(0, 0, L, L).data, g = new Float32Array(L * L);
      let transp = 0; for (let i = 3; i < d.length; i += 16) if (d[i] < 128) transp++;
      const useA = transp > d.length / 16 * 0.05;
      for (let i = 0; i < L * L; i++) { const a = d[i * 4 + 3] / 255, l = (d[i * 4] * 0.2126 + d[i * 4 + 1] * 0.7152 + d[i * 4 + 2] * 0.0722) / 255; g[i] = useA ? a : (1 - l) * a; }
      vecCache = marching(g, L, L, 0.5).map((lp) => { const o = []; for (let i = 0; i < lp.length; i += 2) o.push([lp[i] / L - 0.5, lp[i + 1] / L - 0.5]); return o; }).filter((l) => l.length > 6);
      return vecCache;
    }
    function marching(g, W, H, T) {
      const hid = (x, y) => (y * W + x) * 2, vid = (x, y) => (y * W + x) * 2 + 1, link = new Map();
      const add = (a, b) => { (link.get(a) || link.set(a, []).get(a)).push(b); (link.get(b) || link.set(b, []).get(b)).push(a); };
      const pos = (id) => { const e = id >> 1, x = e % W, y = (e - x) / W; if (id & 1) { const a = g[y * W + x], b = g[(y + 1) * W + x]; return [x, y + (T - a) / (b - a || 1e-6)]; } const a = g[y * W + x], b = g[y * W + x + 1]; return [x + (T - a) / (b - a || 1e-6), y]; };
      for (let y = 0; y < H - 1; y++) for (let x = 0; x < W - 1; x++) {
        const a = g[y * W + x] > T, b = g[y * W + x + 1] > T, c = g[(y + 1) * W + x + 1] > T, d = g[(y + 1) * W + x] > T, code = (a << 3) | (b << 2) | (c << 1) | d;
        if (code === 0 || code === 15) continue;
        const t = hid(x, y), bo = hid(x, y + 1), l = vid(x, y), r = vid(x + 1, y);
        switch (code) { case 1: case 14: add(l, bo); break; case 2: case 13: add(bo, r); break; case 3: case 12: add(l, r); break; case 4: case 11: add(t, r); break; case 6: case 9: add(t, bo); break; case 7: case 8: add(l, t); break; case 5: add(l, t); add(bo, r); break; case 10: add(t, r); add(l, bo); break; }
      }
      const seen = new Set(), loops = [];
      for (const start of link.keys()) {
        if (seen.has(start)) continue;
        const lp = []; let prev = -1, cur = start, guard = 0;
        while (guard++ < 100000) { seen.add(cur); const [px, py] = pos(cur); lp.push(px, py); const nb = link.get(cur), nx = nb[0] !== prev ? nb[0] : nb[1]; if (nx == null || nx === start || seen.has(nx)) break; prev = cur; cur = nx; }
        if (lp.length >= 12) loops.push(lp);
      }
      return loops;
    }
    // rééchantillonne une polyligne à pas constant
    function resample(pts, step, closed) {
      const src = closed ? pts.concat([pts[0]]) : pts, out = [[src[0][0], src[0][1]]]; let acc = 0;
      for (let i = 1; i < src.length; i++) {
        let [ax, ay] = src[i - 1]; const [bx, by] = src[i]; let seg = Math.hypot(bx - ax, by - ay);
        while (acc + seg >= step) { const t = (step - acc) / seg; ax += (bx - ax) * t; ay += (by - ay) * t; out.push([ax, ay]); seg = Math.hypot(bx - ax, by - ay); acc = 0; }
        acc += seg;
      }
      return out;
    }
    function paths() {
      const V = view(), { w, h } = V, Wg = w * 0.86, Hg = h * 0.8 / V.sy, S = Math.min(Wg, Hg), out = [];
      if (p.chemin === 'spirale') {
        const pts = [], turns = 3.2, R = Math.min(Wg / 2, Hg / 2) * 0.95;
        for (let i = 0; i <= 900; i++) { const u = i / 900, a = u * turns * TAU, r = R * (1 - u * 0.88); pts.push([Math.cos(a) * r, Math.sin(a) * r]); }
        out.push({ pts, parent: -1 });
      } else if (p.chemin === 'serpentin') {
        const rows = 5, pts = [], ww = Wg * 0.42, hh = Hg * 0.42;
        for (let k = 0; k < rows; k++) {
          const y = -hh + k / (rows - 1) * hh * 2, dir = k % 2 ? -1 : 1;
          for (let i = 0; i <= 60; i++) pts.push([dir * (-ww + i / 60 * ww * 2), y]);
          if (k < rows - 1) { const r = hh / (rows - 1); for (let i = 1; i < 20; i++) { const a = -Math.PI / 2 + i / 20 * Math.PI; pts.push([dir * ww + dir * Math.cos(a) * r, y + r + Math.sin(a) * r]); } }
        }
        out.push({ pts, parent: -1 });
      } else if (p.chemin === 'vagues') {
        const rows = 4;
        for (let k = 0; k < rows; k++) { const y = -Hg * 0.36 + k / (rows - 1) * Hg * 0.72, pts = []; for (let i = 0; i <= 200; i++) { const u = i / 200; pts.push([-Wg * 0.45 + u * Wg * 0.9, y + Math.sin(u * TAU * 2 + k) * Hg * 0.07]); } out.push({ pts, parent: k ? 0 : -1, at: 0 }); }
      } else if (p.chemin === 'arbre') {
        // un tronc qui se divise en deux, trois fois
        const grow = (x, y, a, len, depth, parent, at) => {
          const pts = []; for (let i = 0; i <= 40; i++) { const u = i / 40, aa = a + Math.sin(u * Math.PI) * 0.25 * (depth % 2 ? 1 : -1); pts.push([x + Math.cos(aa) * len * u, y + Math.sin(aa) * len * u]); }
          const id = out.length; out.push({ pts, parent, at });
          if (depth < 3) { const [ex, ey] = pts[pts.length - 1]; grow(ex, ey, a - 0.5, len * 0.7, depth + 1, id, 1); grow(ex, ey, a + 0.5, len * 0.7, depth + 1, id, 1); }
        };
        grow(0, Hg * 0.46, -Math.PI / 2, Math.min(Hg * 0.32, Wg * 0.24), 0, -1, 0);
      } else {
        const loops = logoLoops();
        loops.forEach((l, i) => out.push({ pts: l.map(([a, b]) => [a * S * 1.0, b * S * 1.0]), closed: true, parent: i ? i - 1 : -1, at: 1 }));
      }
      for (const d of drawnPaths) out.push({ pts: d, parent: -2 });
      return out;
    }

    // ——— Construction des dominos ———
    function build() {
      const V = view(), key = [V.w, V.h, p.chemin, p.hauteur, p.espacement, p.largeur, p.couleurs.join(), p.coloration, p.vue, vecKey, drawnPaths.length, app.seed].join();
      if (key === dKey) return; dKey = key;
      const S = Math.min(V.w, V.h), H = S * p.hauteur, gap = H * p.espacement, T = H * 0.16, Wd = H * p.largeur;
      const cols = p.couleurs.length ? p.couleurs : ['#111111'];
      doms = []; roots = [];
      const ps = paths(), firstOf = [], lastOf = [];
      let total = 0;
      ps.forEach((pa, pi) => {
        const pts = resample(pa.pts, gap, pa.closed);
        firstOf[pi] = doms.length;
        for (let i = 0; i < pts.length; i++) {
          if (pa.closed && i === pts.length - 1) break;
          const a = pts[Math.max(0, i - 1)], b = pts[Math.min(pts.length - 1, i + 1)];
          const dir = Math.atan2(b[1] - a[1], b[0] - a[0]);
          const d = { x: pts[i][0], y: pts[i][1], dir, H, T, W: Wd, th: 0, om: 0, on: false, kids: [], k: total++, path: pi, col: cols[0], done: false };
          if (i > 0) doms[doms.length - 1].kids.push(doms.length);
          doms.push(d);
        }
        lastOf[pi] = doms.length - 1;
      });
      // raccords : une branche part du milieu (ou de la fin) de son parent ; une file dessinée part seule
      ps.forEach((pa, pi) => {
        if (firstOf[pi] > lastOf[pi]) return;
        if (pa.parent === -1) roots.push(firstOf[pi]);
        else if (pa.parent >= 0) { const src = pa.at === 0 ? firstOf[pa.parent] : lastOf[pa.parent]; doms[src].kids.push(firstOf[pi]); }
      });
      // couleurs
      const n = doms.length;
      doms.forEach((d, i) => {
        const c = p.coloration === 'une' ? 0 : p.coloration === 'alterne' ? i : p.coloration === 'bandes' ? Math.floor(i / 9) : Math.floor(i / n * cols.length);
        d.col = cols[c % cols.length];
      });
      phase = 'wait'; phaseT = 0;
    }

    // ——— Chute ———
    function lean(T, gap, H) { return Math.asin(Math.min(1, (gap - 0.0) / H)); }
    function step(dt) {
      for (const d of doms) {
        if (!d.on || d.done) continue;
        const gp = d.H * p.espacement, thc = lean(d.T, gp, d.H);
        // pendule inversé autour de l'arête avant : th'' = (3g / 2H) sin(th + th0)
        const th0 = Math.atan2(d.T, d.H);
        d.om += 160 * p.vitesse * p.vitesse * Math.sin(d.th + th0) * dt;
        d.th += d.om * dt;
        if (d.th >= thc && d.kids.length) {
          // le choc transmet une partie de l'élan
          for (const k of d.kids) { const e = doms[k]; if (!e.on) { e.on = true; e.om = Math.max(e.om, d.om * 0.6); } }
          // il reste appuyé sur le suivant
          const nx = doms[d.kids[0]];
          const lim = thc + (nx.th / (Math.PI / 2)) * (Math.PI / 2 - thc) * 0.92;
          if (d.th > lim) { d.th = lim; d.om = Math.min(d.om, nx.om); }
        } else if (d.th >= Math.PI / 2 * 0.985) { d.th = Math.PI / 2 * 0.985; d.om = 0; d.done = true; }
      }
    }
    function pushAt(x, y) {
      const V = view(); let best = -1, bd = 30 * 30;
      doms.forEach((d, i) => { const [sx, sy] = proj(V, d.x, d.y, d.H * 0.5); const e = (sx - x) ** 2 + (sy - y) ** 2; if (e < bd) { bd = e; best = i; } });
      if (best >= 0 && !doms[best].on) { doms[best].on = true; doms[best].om = 1.5; if (phase === 'wait' || phase === 'up') { phase = 'fall'; phaseT = 0; } }
    }
    function cycle(dt) {
      phaseT += dt;
      if (phase === 'wait' && phaseT > 1.2) { for (const r of roots) { doms[r].on = true; doms[r].om = 1.5; } phase = 'fall'; phaseT = 0; }
      else if (phase === 'fall') {
        let moving = false; for (const d of doms) if (d.on && Math.abs(d.om) > 0.01 && !d.done) { moving = true; break; }
        const pending = doms.some((d) => !d.on && roots.length);
        if (phaseT > 1 && (!moving || phaseT > 60)) { phase = 'rest'; phaseT = 0; }
      } else if (phase === 'rest' && phaseT > 2.2) { phase = 'up'; phaseT = 0; }
      else if (phase === 'up') {
        // relevage : une vague qui redresse les dominos dans l'ordre
        const n = doms.length, dur = Math.max(1.5, Math.min(4, n / 120));
        doms.forEach((d, i) => { const u = Math.max(0, Math.min(1, phaseT / dur * 1.4 - i / n * 0.4)); if (u > 0) { d.th *= Math.max(0, 1 - u * 0.25); if (u >= 1 || d.th < 0.002) { d.th = 0; d.om = 0; d.on = false; d.done = false; } } });
        if (phaseT > dur * 1.2) { doms.forEach((d) => { d.th = 0; d.om = 0; d.on = false; d.done = false; }); phase = 'wait'; phaseT = 0; }
      }
    }

    // ——— Dessin d'un domino : boîte basculée autour de son arête avant ———
    const hexs = (h) => { const n = parseInt(h.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; };
    const shade = (h, k) => { const [r, g, b] = hexs(h); return `rgb(${Math.min(255, Math.round(r * k))},${Math.min(255, Math.round(g * k))},${Math.min(255, Math.round(b * k))})`; };
    function corners(d) {
      const c = Math.cos(d.dir), s = Math.sin(d.dir), ct = Math.cos(d.th), st = Math.sin(d.th);
      // repère local : a le long du chemin (vers l'avant), b en travers, z vers le haut ; pivot sur l'arête avant au sol
      const P = [];
      for (const a0 of [-d.T, 0]) for (const b0 of [-d.W / 2, d.W / 2]) for (const z0 of [0, d.H]) {
        const a = a0 * ct + z0 * st, z = -a0 * st + z0 * ct;
        P.push([d.x + (a + d.T / 2) * c - b0 * s, d.y + (a + d.T / 2) * s + b0 * c, z]);
      }
      return P; // indices : bit2 = a (0 arrière, 1 avant), bit1 = b, bit0 = z
    }
    const FACES = [[0, 1, 3, 2, 'back'], [4, 6, 7, 5, 'front'], [0, 4, 5, 1, 'l'], [2, 3, 7, 6, 'r'], [1, 5, 7, 3, 'top'], [0, 2, 6, 4, 'bot']];
    function faces(d, V) {
      const P = corners(d), out = [];
      const L = [-0.4, -0.6, 0.7]; // lumière
      for (const f of FACES) {
        const a = P[f[0]], b = P[f[1]], c = P[f[2]];
        const ux = b[0] - a[0], uy = b[1] - a[1], uz = b[2] - a[2], vx = c[0] - a[0], vy = c[1] - a[1], vz = c[2] - a[2];
        let nx = uy * vz - uz * vy, ny = uz * vx - ux * vz, nz = ux * vy - uy * vx; const nl = Math.hypot(nx, ny, nz) || 1; nx /= nl; ny /= nl; nz /= nl;
        // normale sortante : comparée au centre de la boîte
        const cx = (P[0][0] + P[7][0]) / 2, cy = (P[0][1] + P[7][1]) / 2, cz = (P[0][2] + P[7][2]) / 2;
        const fx = (a[0] + c[0]) / 2 - cx, fy = (a[1] + c[1]) / 2 - cy, fz = (a[2] + c[2]) / 2 - cz;
        if (nx * fx + ny * fy + nz * fz < 0) { nx = -nx; ny = -ny; nz = -nz; }
        // visible si elle regarde vers l'observateur (vers +Y au sol et vers le haut)
        const vis = ny * V.sz + nz * V.sy; if (vis <= 0.001) continue;
        const lam = Math.max(0, nx * L[0] + ny * L[1] + nz * L[2]);
        out.push({ pts: f.slice(0, 4).map((k) => proj(V, P[k][0], P[k][1], P[k][2])), k: 0.55 + 0.6 * lam, top: f[4] === 'top' });
      }
      return out;
    }

    app.loop((tt, dt) => {
      const V = view(), { w, h } = V, { dpr } = app.size;
      build();
      if (app.thumbnail && !warm) { warm = true; for (const r of roots) { doms[r].on = true; doms[r].om = 1.5; } phase = 'fall'; for (let k = 0; k < 150; k++) step(1 / 60); }
      dt = Math.min(1 / 30, dt || 0);
      if (!app.thumbnail) { cycle(dt); for (let s = 0; s < 4; s++) step(dt / 4); }
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.fillStyle = p.fond; ctx.fillRect(0, 0, w, h);
      // ombres portées sur le sol
      const order = doms.map((d, i) => i).sort((a, b) => doms[a].y - doms[b].y);
      if (p.ombre) {
        ctx.fillStyle = 'rgba(0,0,0,0.13)';
        for (const i of order) {
          const d = doms[i], P = corners(d), sh = (q) => proj(V, q[0] + q[2] * 0.45, q[1] + q[2] * 0.25, 0);
          const pts = [0, 1, 3, 2, 6, 7, 5, 4].map((k) => sh(P[k]));
          ctx.beginPath(); pts.forEach(([x, y], k) => (k ? ctx.lineTo(x, y) : ctx.moveTo(x, y))); ctx.closePath(); ctx.fill();
        }
      }
      ctx.lineJoin = 'round';
      for (const i of order) {
        const d = doms[i];
        for (const f of faces(d, V)) {
          ctx.fillStyle = shade(d.col, f.k);
          ctx.beginPath(); f.pts.forEach(([x, y], k) => (k ? ctx.lineTo(x, y) : ctx.moveTo(x, y))); ctx.closePath(); ctx.fill();
          ctx.strokeStyle = shade(d.col, f.k * 0.8); ctx.lineWidth = 0.6; ctx.stroke();
        }
      }
      if (drag && drag.moved) { ctx.strokeStyle = 'rgba(0,0,0,0.35)'; ctx.setLineDash([3, 5]); ctx.lineWidth = 1.5; ctx.beginPath(); drag.pts.forEach(([x, y], k) => (k ? ctx.lineTo(x, y) : ctx.moveTo(x, y))); ctx.stroke(); ctx.setLineDash([]); }
      app.finish(ctx);
    });

    function toSVG() {
      const V = view(), { w, h } = V, f = (v) => v.toFixed(1), out = [`<rect width="100%" height="100%" fill="${p.fond}"/>`];
      const order = doms.map((d, i) => i).sort((a, b) => doms[a].y - doms[b].y);
      if (p.ombre) {
        const sh = [];
        for (const i of order) { const d = doms[i], P = corners(d), s = (q) => proj(V, q[0] + q[2] * 0.45, q[1] + q[2] * 0.25, 0); sh.push('M' + [0, 1, 3, 2, 6, 7, 5, 4].map((k) => s(P[k]).map(f).join(' ')).join('L') + 'Z'); }
        out.push(`<path d="${sh.join('')}" fill="#000" fill-opacity="0.13"/>`);
      }
      for (const i of order) { const d = doms[i]; for (const fc of faces(d, V)) out.push(`<path d="M${fc.pts.map((q) => q.map(f).join(' ')).join('L')}Z" fill="${shade(d.col, fc.k)}" stroke="${shade(d.col, fc.k * 0.8)}" stroke-width="0.6" stroke-linejoin="round"/>`); }
      return `<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">\n${out.join('\n')}\n</svg>`;
    }
  </script>
