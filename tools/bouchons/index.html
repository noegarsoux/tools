<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bouchons</title>
  <link rel="stylesheet" href="../../assets/ui/atelier.css">
</head>
<body>
  <canvas></canvas>
  <script src="../../assets/ui/atelier.js"></script>
  <script>
    // Bouchons : l'automate de Nagel et Schreckenberg. La route est une boucle de cases ; à chaque pas, chaque voiture
    // accélère d'un cran (jusqu'à la vitesse maximale), freine pour ne pas toucher celle de devant, et parfois freine
    // sans raison. Ce petit hasard suffit : au-delà d'une certaine densité, des bouchons naissent de nulle part et
    // remontent la file à contre-sens. Le diagramme espace-temps (une ligne par pas, la plus récente en bas) les montre
    // comme des bandes obliques.
    const canvas = document.querySelector('canvas');
    const ctx = canvas.getContext('2d');
    const TAU = Math.PI * 2;
    const PAL = (k) => Atelier.PALETTES[k].colors;
    const KB = PAL('kegelbahn'), BIEN = PAL('biennale'), SAL = PAL('salon'), MEN = PAL('menthe'), THERM = PAL('thermique'), LUZ = PAL('luzern');

    let L = 0, N = 0, pos = null, vel = null, hold = null, R = 0, head = 0, rows = null, dg = null, dgx = null, dgImg = null, dgKey = '';
    let simKey = '', path = null, plen = 0, acc = 0, maskKey = null, contour = null, held = null;

    const app = Atelier.app({
      stage: canvas,
      animate: true,
      seed: true,
      finish: { grain: 0.04, vignette: 0.1 },
      hint: 'Touchez une voiture pour la faire piler · glissez pour freiner au passage · molette : densité',
      notes: 'Chaque voiture accélère quand elle peut, freine pour ne pas toucher celle de devant, et de temps en temps freine pour rien. Personne ne provoque d’accident, et pourtant, passé une certaine densité, des bouchons apparaissent d’eux-mêmes et reculent le long de la file pendant que les voitures, elles, avancent. Le diagramme espace-temps empile les instants : chaque bouchon y trace une bande qui remonte vers la gauche.',
      params: {
        'Trafic': {
          densite: { type: 'range', label: 'Densité', min: 0.03, max: 0.7, step: 0.01, value: 0.2 },
          vmax: { type: 'range', label: 'Vitesse maximale', min: 1, max: 9, step: 1, value: 5 },
          hasard: { type: 'range', label: 'Freinages au hasard', min: 0, max: 0.6, step: 0.01, value: 0.16 },
          demarrage: { type: 'range', label: 'Lenteur au démarrage', min: 0, max: 0.9, step: 0.01, value: 0.45 },
          longueur: { type: 'range', label: 'Longueur de la route (cases)', min: 80, max: 1200, step: 10, value: 360 },
          cadence: { type: 'range', label: 'Pas par seconde', min: 1, max: 40, step: 1, value: 10 },
        },
        'Route': {
          vue: { type: 'segmented', label: 'Vue', options: { route: 'Route', diagramme: 'Espace-temps', cible: 'Cible' }, value: 'cible' },
          forme: { type: 'select', label: 'Tracé', options: { anneau: 'Anneau', stade: 'Stade', huit: 'Huit', logo: 'Contour du logo' }, value: 'anneau', show: (q) => q.vue === 'route' },
          image: { type: 'file', label: 'Logo', accept: 'image/*', show: (q) => q.vue === 'route' && q.forme === 'logo' },
          largeur: { type: 'range', label: 'Largeur de la route', min: 0.3, max: 4, step: 0.05, value: 2, show: (q) => q.vue === 'route' },
          taille: { type: 'range', label: 'Longueur des voitures', min: 0.3, max: 1, step: 0.01, value: 0.8, show: (q) => q.vue === 'route' },
          traine: { type: 'range', label: 'Traînées', min: 0, max: 0.98, step: 0.01, value: 0.9, show: (q) => q.vue === 'route' },
          centre: { type: 'range', label: 'Rayon du présent', min: 0.02, max: 0.4, step: 0.01, value: 0.12, show: (q) => q.vue === 'cible' },
        },
        'Couleurs': {
          fond: { type: 'color', label: 'Fond', value: '#f2efe8' },
          route: { type: 'color', label: 'Route', value: '#1c1c1e', show: (q) => q.vue === 'route' },
          couleurs: { type: 'palette', label: 'De l’arrêt à la pleine vitesse', value: ['#e5452a', '#f2b0c8', '#2f4fa8'] },
        },
      },
      presets: {
        'Cible': {},
        'Anneau': { vue: 'route', longueur: 140, densite: 0.24, couleurs: ['#e5452a', '#f2c230', '#f4f1ea'] },
        'Espace-temps': { vue: 'diagramme', longueur: 420, couleurs: ['#e5452a', '#f2b0c8', '#111111'], fond: '#f4f3f0', cadence: 14 },
        'Bandes serrées': { vue: 'diagramme', densite: 0.32, longueur: 600, vmax: 4, hasard: 0.22, couleurs: ['#111111', '#3a6fd0', '#d4d0c6'], fond: '#f2efe8', cadence: 20 },
        'Fluide': { vue: 'route', longueur: 160, densite: 0.08, hasard: 0.1, couleurs: ['#e5452a', '#4f9d7a', '#a4e0bc'], fond: '#191d1e', route: '#2b3132' },
        'Saturé': { vue: 'route', densite: 0.45, longueur: 160, couleurs: ['#e5452a', '#f2c230', '#f4f1ea'] },
        'Huit': { vue: 'route', forme: 'huit', longueur: 240, densite: 0.2, route: '#111111', couleurs: ['#e5452a', '#f2c230', '#f4f1ea'] },
        'Stade': { vue: 'route', forme: 'stade', longueur: 220, largeur: 2.6, couleurs: [KB[5], KB[3], KB[2]], fond: KB[0], route: '#1d1a24' },
        'Logo': { vue: 'route', forme: 'logo', longueur: 260, densite: 0.2, largeur: 1.6, couleurs: ['#e5452a', '#f2c230', '#f4f1ea'] },
        'Kegelbahn': { vue: 'diagramme', couleurs: [KB[1], KB[2], KB[3]], fond: KB[0], longueur: 360 },
        'Thermique': { vue: 'diagramme', couleurs: [THERM[2], THERM[3], THERM[1], THERM[4]], fond: '#0c0c14', longueur: 500, densite: 0.28 },
        'Luzern': { vue: 'cible', couleurs: [LUZ[0], LUZ[2], LUZ[1]], fond: LUZ[4], centre: 0.2, densite: 0.26 },
      },
      brand(colors) {
        const lum = (x) => { const c = hex(x); return c[0] * 0.299 + c[1] * 0.587 + c[2] * 0.114; };
        const s = colors.slice().sort((a, b) => lum(a) - lum(b)), dark = s[0], light = s[s.length - 1], mid = s.slice(1, -1);
        return { fond: light, route: dark, couleurs: mid.length ? mid.concat([dark]) : [dark] };
      },
      pointer: {
        down: (q) => { held = { x0: q.x, y0: q.y, moved: false }; brakeNear(q.x, q.y, 1.6); },
        drag: (q) => { if (!held) return; if (Math.hypot(q.x - held.x0, q.y - held.y0) > 6) held.moved = true; brakeNear(q.x, q.y, 0.25); },
        up: () => { held = null; },
        wheel: (q, dy) => app.set('densite', Math.max(0.03, Math.min(0.7, +(p.densite + (dy > 0 ? -0.01 : 0.01)).toFixed(2)))),
      },
      onChange(k) {
        if (k === 'image') { maskKey = null; contour = null; }
        if (k === 'densite' && pos) { adjustCount(); return; }
        if (k === '*' || ['longueur', 'forme', 'image', 'vue'].includes(k)) simKey = '';
        dgKey = '';
      },
      onSeed() { simKey = ''; },
      export: { name: 'bouchons', svg: () => toSVG() },
    });
    const p = app.params;

    const hex = (x) => { const n = parseInt(x.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; };
    function mulberry(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
    let rnd = Math.random;

    // ——— Automate de Nagel–Schreckenberg (voitures rangées dans l'ordre de la boucle) ———
    function reset() {
      const { w, h } = app.size; L = Math.round(p.longueur); rnd = mulberry(app.seed * 6007 + 11);
      N = Math.max(1, Math.min(L - 1, Math.round(L * p.densite)));
      pos = new Int32Array(N); vel = new Int8Array(N); hold = new Float32Array(N); prev = new Int32Array(N);
      // départ presque régulier : les bouchons naissent d'eux-mêmes
      for (let i = 0; i < N; i++) { pos[i] = Math.min(L - 1, Math.floor(i * L / N + rnd() * 0.4)); vel[i] = Math.floor(rnd() * (p.vmax + 1)); }
      R = Math.max(24, Math.round(L * h / w)); rows = new Uint8Array(R * L); head = 0; dgKey = '';
      buildPath(w, h); if (tctx) { tctx.setTransform(1, 0, 0, 1, 0, 0); tctx.clearRect(0, 0, trail.width, trail.height); }
      for (let k = 0; k < R; k++) step();
    }
    let prev = null;
    function step() {
      const vm = Math.round(p.vmax);
      prev.set(pos);
      for (let i = 0; i < N; i++) {
        const nx = pos[(i + 1) % N], gap = N === 1 ? L - 1 : ((nx - pos[i] - 1) % L + L) % L;
        let v = vel[i];
        if (hold[i] > 0) { vel[i] = 0; continue; }
        // lenteur au démarrage : une voiture arrêtée hésite avant de repartir
        if (v === 0 && gap > 0 && rnd() < p.demarrage) { vel[i] = 0; continue; }
        v = Math.min(v + 1, vm, gap);
        if (v > 0 && rnd() < p.hasard) v--;
        vel[i] = v;
      }
      for (let i = 0; i < N; i++) pos[i] = (pos[i] + vel[i]) % L;
      // nouvelle ligne du diagramme
      head = (head + 1) % R; const o = head * L; rows.fill(0, o, o + L);
      for (let i = 0; i < N; i++) rows[o + pos[i]] = 1 + vel[i];
      writeRow(head);
    }
    function adjustCount() {
      const target = Math.max(1, Math.min(L - 1, Math.round(L * p.densite)));
      while (N < target) {
        // une voiture entre dans le plus grand trou
        let bi = 0, bg = -1; for (let i = 0; i < N; i++) { const g = ((pos[(i + 1) % N] - pos[i] - 1) % L + L) % L; if (g > bg) { bg = g; bi = i; } }
        if (bg < 1) break; const np = (pos[bi] + 1 + (bg >> 1)) % L;
        pos = insert(pos, bi + 1, np); vel = insert(vel, bi + 1, Math.min(vel[bi], 2)); hold = insert(hold, bi + 1, 0); prev = insert(prev, bi + 1, np); N++;
      }
      while (N > target && N > 1) { const k = Math.floor(rnd() * N); pos = cut(pos, k); vel = cut(vel, k); hold = cut(hold, k); prev = cut(prev, k); N--; }
    }
    function insert(a, k, v) { const b = new a.constructor(a.length + 1); b.set(a.subarray(0, k)); b[k] = v; b.set(a.subarray(k), k + 1); return b; }
    function cut(a, k) { const b = new a.constructor(a.length - 1); b.set(a.subarray(0, k)); b.set(a.subarray(k + 1), k); return b; }

    // ——— Tracé de la route : points régulièrement espacés le long d'une boucle ———
    function shapePts(w, h) {
      const cx = w / 2, cy = h / 2, u = Math.min(w, h), out = [];
      if (p.forme === 'stade') { const a = w * 0.38, b = h * 0.32; for (let i = 0; i < 400; i++) { const t = i / 400 * TAU, c = Math.cos(t), s = Math.sin(t); const ex = 2 / 5, X = Math.sign(c) * Math.pow(Math.abs(c), ex), Y = Math.sign(s) * Math.pow(Math.abs(s), ex); out.push([cx + X * a, cy + Y * b]); } }
      else if (p.forme === 'huit') { for (let i = 0; i < 600; i++) { const t = i / 600 * TAU; out.push([cx + Math.sin(t) * w * 0.4, cy + Math.sin(t) * Math.cos(t) * h * 0.8]); } }
      else if (p.forme === 'logo') { const c = logoContour(); if (c && c.length > 8) { for (const [x, y] of c) out.push([cx + x * u * 0.82, cy + y * u * 0.82]); } }
      if (out.length < 8) for (let i = 0; i < 400; i++) { const t = i / 400 * TAU; out.push([cx + Math.cos(t) * u * 0.38, cy + Math.sin(t) * u * 0.38]); }
      return out;
    }
    function buildPath(w, h) {
      const P = shapePts(w, h), n = P.length, cum = [0];
      for (let i = 1; i <= n; i++) { const a = P[i - 1], b = P[i % n]; cum.push(cum[i - 1] + Math.hypot(b[0] - a[0], b[1] - a[1])); }
      plen = cum[n]; const M = 4096; path = new Float32Array(M * 2); let j = 0;
      for (let k = 0; k < M; k++) { const s = k / M * plen; while (cum[j + 1] < s) j++; const a = P[j], b = P[(j + 1) % n], f = (s - cum[j]) / Math.max(1e-6, cum[j + 1] - cum[j]); path[k * 2] = a[0] + (b[0] - a[0]) * f; path[k * 2 + 1] = a[1] + (b[1] - a[1]) * f; }
    }
    function at(s) {
      // s en cases → point et tangente
      const M = path.length / 2, u = ((s / L) % 1 + 1) % 1 * M, i = Math.floor(u), f = u - i, j = (i + 1) % M, k = (i + 2) % M;
      const x = path[i * 2] + (path[j * 2] - path[i * 2]) * f, y = path[i * 2 + 1] + (path[j * 2 + 1] - path[i * 2 + 1]) * f;
      const tx = path[k * 2] - path[i * 2], ty = path[k * 2 + 1] - path[i * 2 + 1], tl = Math.hypot(tx, ty) || 1;
      return [x, y, tx / tl, ty / tl];
    }
    // contour du logo : marching squares sur un masque, plus longue boucle, lissée, centrée
    function logoContour() {
      const img0 = p.image || app.logoImg, key = img0 ? (img0.src || 'c') : 'demo';
      if (key === maskKey && contour) return contour; maskKey = key;
      const S = 220, c = document.createElement('canvas'); c.width = c.height = S; const x = c.getContext('2d', { willReadFrequently: true });
      if (img0) { const iw = img0.naturalWidth || img0.width, ih = img0.naturalHeight || img0.height, k = S * 0.8 / Math.max(iw, ih); x.drawImage(img0, (S - iw * k) / 2, (S - ih * k) / 2, iw * k, ih * k); }
      else { x.fillStyle = '#000'; x.beginPath(); x.arc(S / 2, S / 2, S * 0.4, 0, TAU); x.arc(S / 2, S / 2, S * 0.22, 0, TAU, true); x.fill('evenodd'); x.fillRect(S * 0.45, S * 0.06, S * 0.1, S * 0.88); }
      const d = x.getImageData(0, 0, S, S).data, m = new Uint8Array(S * S); let transp = 0; for (let i = 3; i < d.length; i += 4) if (d[i] < 128) transp++;
      const useA = transp > S * S * 0.05;
      for (let i = 0; i < S * S; i++) { const l = (d[i * 4] * 0.2126 + d[i * 4 + 1] * 0.7152 + d[i * 4 + 2] * 0.0722) / 255; m[i] = (useA ? d[i * 4 + 3] > 128 : d[i * 4 + 3] > 128 && l < 0.5) ? 1 : 0; }
      // masque adouci (deux flous en boîte) : le contour passe entre les pixels, sans escaliers
      let B = Float32Array.from(m), T2 = new Float32Array(S * S);
      for (let it = 0; it < 2; it++) {
        for (let Y = 0; Y < S; Y++) for (let X = 0; X < S; X++) { let a = 0; for (let k = -1; k <= 1; k++) a += B[Y * S + Math.min(S - 1, Math.max(0, X + k))]; T2[Y * S + X] = a / 3; }
        for (let Y = 0; Y < S; Y++) for (let X = 0; X < S; X++) { let a = 0; for (let k = -1; k <= 1; k++) a += T2[Math.min(S - 1, Math.max(0, Y + k)) * S + X]; B[Y * S + X] = a / 3; }
      }
      const V = (X, Y) => (X < 0 || Y < 0 || X >= S || Y >= S) ? 0 : B[Y * S + X], G = (X, Y) => V(X, Y) > 0.5 ? 1 : 0;
      const link = new Map(), add = (a, b) => { (link.get(a) || link.set(a, []).get(a)).push(b); (link.get(b) || link.set(b, []).get(b)).push(a); };
      const H = (X, Y) => (Y * (S + 2) + X) * 2, Vt = (X, Y) => (Y * (S + 2) + X) * 2 + 1;
      for (let Y = -1; Y < S; Y++) for (let X = -1; X < S; X++) {
        const tl = G(X, Y), tr = G(X + 1, Y), br = G(X + 1, Y + 1), bl = G(X, Y + 1), cs = tl * 8 + tr * 4 + br * 2 + bl; if (cs === 0 || cs === 15) continue;
        const e = [H(X + 1, Y + 1), Vt(X + 2, Y + 1), H(X + 1, Y + 2), Vt(X + 1, Y + 1)];
        const pairs = { 1: [[3, 2]], 14: [[3, 2]], 2: [[2, 1]], 13: [[2, 1]], 3: [[3, 1]], 12: [[3, 1]], 4: [[0, 1]], 11: [[0, 1]], 6: [[0, 2]], 9: [[0, 2]], 7: [[3, 0]], 8: [[3, 0]], 5: [[3, 0], [2, 1]], 10: [[0, 1], [3, 2]] }[cs];
        for (const [a, b] of pairs) add(e[a], e[b]);
      }
      const ptOf = (id) => { const c2 = id >> 1, X = c2 % (S + 2) - 1, Y = Math.floor(c2 / (S + 2)) - 1; if (id & 1) { const a = V(X, Y), b = V(X, Y + 1); return [X, Y + Math.max(0, Math.min(1, (0.5 - a) / ((b - a) || 1)))]; } const a = V(X, Y), b = V(X + 1, Y); return [X + Math.max(0, Math.min(1, (0.5 - a) / ((b - a) || 1))), Y]; };
      const seen = new Set(); let best = null;
      for (const st of link.keys()) {
        if (seen.has(st)) continue; const loop = []; let pr = -1, cu = st;
        while (cu !== undefined && !seen.has(cu)) { seen.add(cu); loop.push(ptOf(cu)); const Lk = link.get(cu); const nx = Lk[0] !== pr ? Lk[0] : Lk[1]; pr = cu; cu = nx; }
        if (!best || loop.length > best.length) best = loop;
      }
      if (!best) { contour = null; return null; }
      // lissage (Chaikin ×3), coordonnées centrées dans [-0.5, 0.5]
      let C = best; for (let it = 0; it < 3; it++) { const o = []; for (let i = 0; i < C.length; i++) { const a = C[i], b = C[(i + 1) % C.length]; o.push([a[0] * 0.75 + b[0] * 0.25, a[1] * 0.75 + b[1] * 0.25], [a[0] * 0.25 + b[0] * 0.75, a[1] * 0.25 + b[1] * 0.75]); } C = o; }
      let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9; for (const [X, Y] of C) { x0 = Math.min(x0, X); x1 = Math.max(x1, X); y0 = Math.min(y0, Y); y1 = Math.max(y1, Y); }
      const sz = Math.max(x1 - x0, y1 - y0) || 1; contour = C.map(([X, Y]) => [(X - (x0 + x1) / 2) / sz, (Y - (y0 + y1) / 2) / sz]);
      return contour;
    }

    // ——— Freiner sous le doigt ———
    function brakeNear(x, y, t) {
      if (!pos) return; let bi = -1, bd = 1e9;
      if (p.vue === 'diagramme') { const c = x / app.size.w * L; for (let i = 0; i < N; i++) { const d = Math.min(Math.abs(pos[i] - c), L - Math.abs(pos[i] - c)); if (d < bd) { bd = d; bi = i; } } if (bd > L * 0.04) bi = -1; }
      else { for (let i = 0; i < N; i++) { const [px, py] = at(pos[i]); const d = Math.hypot(px - x, py - y); if (d < bd) { bd = d; bi = i; } } if (bd > Math.min(app.size.w, app.size.h) * 0.08) bi = -1; }
      if (bi >= 0) { hold[bi] = Math.max(hold[bi], t); vel[bi] = 0; }
    }

    // ——— Couleurs ———
    function speedCol(v) {
      const C = p.couleurs.map(hex), n = C.length, vm = Math.round(p.vmax), t = vm > 0 ? Math.min(1, v / vm) : 0;
      if (n === 1) return C[0]; const u = t * (n - 1), i = Math.min(n - 2, Math.floor(u)), f = u - i;
      return [C[i][0] + (C[i + 1][0] - C[i][0]) * f, C[i][1] + (C[i + 1][1] - C[i][1]) * f, C[i][2] + (C[i + 1][2] - C[i][2]) * f];
    }
    const css = (c) => `rgb(${c.map(Math.round).join()})`;
    let LUTc = null;
    function writeRow(r) {
      if (!dgImg) return; const d = dgImg.data, o = r * L;
      for (let x = 0; x < L; x++) { const v = rows[o + x], c = LUTc[v], q = (o + x) * 4; d[q] = c[0]; d[q + 1] = c[1]; d[q + 2] = c[2]; d[q + 3] = 255; }
      dgDirty = true;
    }
    let dgDirty = false;
    function ensureDiagram() {
      const k = [L, R, p.fond, p.couleurs.join(), p.vmax].join();
      if (k === dgKey && dg) return;
      dgKey = k; LUTc = [hex(p.fond)]; for (let v = 0; v <= 9; v++) LUTc.push(speedCol(v));
      if (!dg || dg.width !== L || dg.height !== R) { dg = document.createElement('canvas'); dg.width = L; dg.height = R; dgx = dg.getContext('2d'); dgImg = dgx.createImageData(L, R); }
      for (let r = 0; r < R; r++) writeRow(r);
    }

    app.loop((t, dt) => {
      dt = Math.min(0.1, dt || 0);
      const { w, h, dpr } = app.size;
      const key = [p.longueur, p.forme, p.vue, w, h, app.seed, maskKey].join();
      if (key !== simKey || !pos) { reset(); simKey = [p.longueur, p.forme, p.vue, w, h, app.seed, maskKey].join(); }
      ensureDiagram();
      if (dt > 0 && !app.thumbnail) {
        for (let i = 0; i < N; i++) hold[i] = Math.max(0, hold[i] - dt);
        acc += dt * p.cadence; let n = 0; while (acc >= 1 && n < 8) { step(); acc -= 1; n++; } if (acc > 1) acc = 0;
      }
      const fr = app.thumbnail ? 0 : Math.max(0, Math.min(1, acc));
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.fillStyle = p.fond; ctx.fillRect(0, 0, w, h);
      if (p.vue === 'diagramme') {
        if (dgDirty) { dgx.putImageData(dgImg, 0, 0); dgDirty = false; }
        // la ligne la plus récente en bas ; défilement continu entre deux pas
        const rh = h / (R - 1), top = R - 1 - head, off = -fr * rh;
        ctx.imageSmoothingEnabled = false;
        if (head + 1 < R) ctx.drawImage(dg, 0, head + 1, L, R - head - 1, 0, off, w, (R - head - 1) * rh);
        ctx.drawImage(dg, 0, 0, L, head + 1, 0, off + (R - head - 1) * rh, w, (head + 1) * rh);
        ctx.imageSmoothingEnabled = true; void top;
      } else if (p.vue === 'cible') drawTarget(w, h, dpr, fr);
      else drawRoad(w, h, fr, dt, dpr);
      app.finish(ctx);
    });

    function cars(w, h, fr, wider) {
      const cell = plen / L, len = cell * p.taille, wid = Math.max(1.5, roadW(cell) * 0.6) * (wider ? 1.5 : 1), out = [];
      for (let i = 0; i < N; i++) {
        const s = prev[i] + vel[i] * fr, [x, y, tx, ty] = at(s + 0.5), hl = len / 2, hw = wid / 2;
        out.push([x - tx * hl - ty * hw, y - ty * hl + tx * hw, x + tx * hl - ty * hw, y + ty * hl + tx * hw, x + tx * hl + ty * hw, y + ty * hl - tx * hw, x - tx * hl + ty * hw, y - ty * hl - tx * hw, vel[i]]);
      }
      return out;
    }
    const roadW = (cell) => Math.max(3, cell * 0.95 * p.largeur);
    let trail = null, tctx = null;
    function carPaths(w, h, fr, wider) {
      const vm = Math.round(p.vmax), bins = []; for (let v = 0; v <= vm; v++) bins.push(new Path2D());
      for (const c of cars(w, h, fr, wider)) { const B = bins[Math.min(vm, c[8])]; B.moveTo(c[0], c[1]); B.lineTo(c[2], c[3]); B.lineTo(c[4], c[5]); B.lineTo(c[6], c[7]); B.closePath(); }
      return bins;
    }
    function drawRoad(w, h, fr, dt, dpr) {
      const cell = plen / L, M = path.length / 2, rw = roadW(cell);
      const P = new Path2D(); P.moveTo(path[0], path[1]); for (let k = 1; k < M; k++) P.lineTo(path[k * 2], path[k * 2 + 1]); P.closePath();
      ctx.lineJoin = 'round'; ctx.strokeStyle = p.route; ctx.lineWidth = rw; ctx.stroke(P);
      // traînées : les voitures laissent une trace qui s'efface, couleur de leur vitesse
      if (p.traine > 0 && !app.thumbnail) {
        const W2 = Math.round(w * dpr), H2 = Math.round(h * dpr);
        if (!trail || trail.width !== W2 || trail.height !== H2) { trail = document.createElement('canvas'); trail.width = W2; trail.height = H2; tctx = trail.getContext('2d'); }
        tctx.setTransform(1, 0, 0, 1, 0, 0); tctx.globalCompositeOperation = 'destination-out'; tctx.fillStyle = `rgba(0,0,0,${1 - Math.pow(p.traine, dt * 60)})`; tctx.fillRect(0, 0, W2, H2);
        tctx.globalCompositeOperation = 'source-over'; tctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        carPaths(w, h, fr, true).forEach((B, v) => { tctx.fillStyle = css(speedCol(v)); tctx.fill(B); });
        ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 0.85; ctx.drawImage(trail, 0, 0); ctx.restore();
      }
      carPaths(w, h, fr, false).forEach((B, v) => { ctx.fillStyle = css(speedCol(v)); ctx.fill(B); });
    }
    // cible : le présent sur un cercle intérieur, le passé en anneaux qui s'éloignent
    let tg = null, tgx = null, tgImg = null, RR = null, CC = null, tgKey = '';
    function drawTarget(w, h, dpr, fr) {
      const CW = Math.max(120, Math.min(760, Math.round(w * Math.min(dpr, 1.5) * 0.7))), CH = Math.max(80, Math.round(CW * h / w)), k = [CW, CH, L, R, p.centre].join();
      if (k !== tgKey) {
        tgKey = k; tg = document.createElement('canvas'); tg.width = CW; tg.height = CH; tgx = tg.getContext('2d'); tgImg = tgx.createImageData(CW, CH);
        RR = new Float32Array(CW * CH); CC = new Int32Array(CW * CH);
        const cx = CW / 2, cy = CH / 2, r0 = Math.min(CW, CH) * p.centre, rmax = Math.hypot(CW, CH) / 2, dr = (rmax - r0) / (R - 2);
        for (let y = 0; y < CH; y++) for (let x = 0; x < CW; x++) { const dx = x + 0.5 - cx, dy = y + 0.5 - cy, rr = Math.hypot(dx, dy), i = y * CW + x; RR[i] = (rr - r0) / dr; CC[i] = Math.floor(((Math.atan2(dy, dx) / TAU) + 1.25) % 1 * L) % L; }
      }
      const d = tgImg.data, F = LUTc[0];
      for (let i = 0; i < CW * CH; i++) {
        const a = Math.floor(RR[i] - fr), o = i * 4; let c = F;
        if (a >= 0 && a < R - 1) { const row = ((head - a) % R + R) % R; c = LUTc[rows[row * L + CC[i]]]; }
        d[o] = c[0]; d[o + 1] = c[1]; d[o + 2] = c[2]; d[o + 3] = 255;
      }
      tgx.putImageData(tgImg, 0, 0);
      ctx.imageSmoothingEnabled = true; ctx.drawImage(tg, 0, 0, w, h);
    }

    // ——— Export SVG ———
    function toSVG() {
      const { w, h } = app.size, f = (v) => +v.toFixed(2), out = [`<rect width="100%" height="100%" fill="${p.fond}"/>`];
      const vm = Math.round(p.vmax), hx = (c) => '#' + c.map((v) => Math.round(v).toString(16).padStart(2, '0')).join('');
      if (p.vue === 'diagramme') {
        const rh = h / (R - 1), cw = w / L, bins = []; for (let v = 0; v <= vm + 1; v++) bins.push([]);
        for (let k = 0; k < R; k++) {
          const r = (head + 1 + k) % R, y = k * rh, o = r * L; let x = 0;
          while (x < L) { const v = rows[o + x]; let e = x + 1; while (e < L && rows[o + e] === v) e++; if (v) bins[v].push(`M${f(x * cw)} ${f(y)}h${f((e - x) * cw)}v${f(rh)}h${f(-(e - x) * cw)}z`); x = e; }
        }
        bins.forEach((B, v) => { if (v && B.length) out.push(`<path fill="${hx(speedCol(v - 1))}" shape-rendering="crispEdges" d="${B.join('')}"/>`); });
      } else if (p.vue === 'cible') {
        // anneaux : chaque instant passé est un cercle, chaque voiture un arc de la couleur de sa vitesse
        const cx = w / 2, cy = h / 2, r0 = Math.min(w, h) * p.centre, rmax = Math.hypot(w, h) / 2, dr = (rmax - r0) / (R - 2), bins = []; for (let v = 0; v <= vm + 1; v++) bins.push([]);
        for (let a = 0; a < R - 1; a++) {
          const row = ((head - a) % R + R) % R, o = row * L, rr = r0 + (a + 0.5) * dr; let x = 0;
          while (x < L) {
            const v = rows[o + x]; let e = x + 1; while (e < L && rows[o + e] === v) e++;
            if (v) { const t0 = x / L * TAU - TAU / 4, t1 = e / L * TAU - TAU / 4; bins[v].push(`M${f(cx + Math.cos(t0) * rr)} ${f(cy + Math.sin(t0) * rr)}A${f(rr)} ${f(rr)} 0 ${t1 - t0 > Math.PI ? 1 : 0} 1 ${f(cx + Math.cos(t1) * rr)} ${f(cy + Math.sin(t1) * rr)}`); }
            x = e;
          }
        }
        bins.forEach((B, v) => { if (v && B.length) out.push(`<path fill="none" stroke="${hx(speedCol(v - 1))}" stroke-width="${f(dr * 1.04)}" d="${B.join('')}"/>`); });
      } else {
        const M = path.length / 2; let d = `M${f(path[0])} ${f(path[1])}`; for (let k = 1; k < M; k += 2) d += `L${f(path[k * 2])} ${f(path[k * 2 + 1])}`;
        out.push(`<path d="${d}Z" fill="none" stroke="${p.route}" stroke-width="${f(roadW(plen / L))}" stroke-linejoin="round"/>`);
        const bins = []; for (let v = 0; v <= vm; v++) bins.push([]);
        for (const c of cars(w, h, 0)) bins[Math.min(vm, c[8])].push(`M${f(c[0])} ${f(c[1])}L${f(c[2])} ${f(c[3])}L${f(c[4])} ${f(c[5])}L${f(c[6])} ${f(c[7])}Z`);
        bins.forEach((B, v) => { if (B.length) out.push(`<path fill="${hx(speedCol(v))}" d="${B.join('')}"/>`); });
      }
      return `<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">${out.join('')}</svg>`;
    }
  </script>
</body>
</html>
