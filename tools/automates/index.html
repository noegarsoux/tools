<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Automates élémentaires</title>
  <link rel="stylesheet" href="../../assets/ui/atelier.css">
</head>
<body>
  <canvas></canvas>
  <script src="../../assets/ui/atelier.js"></script>
  <script>
    // Automates cellulaires à une dimension : une rangée de cellules, et une règle qui dit, pour chaque cellule,
    // ce qu'elle devient selon elle-même et ses deux voisines. Chaque génération est une nouvelle ligne, posée sous la
    // précédente : le temps devient la hauteur. 256 règles élémentaires (Wolfram), plus les règles totalistiques à trois
    // états. Dans le logo, une seconde règle prend le relais : le logo apparaît comme un changement de texture.
    const canvas = document.querySelector('canvas');
    const ctx = canvas.getContext('2d');
    const TAU = Math.PI * 2;
    const PAL = (k) => Atelier.PALETTES[k].colors;
    const BIEN = PAL('biennale'), GLY = PAL('glyphes'), SAL = PAL('salon'), MEN = PAL('menthe'), KB = PAL('kegelbahn');

    let cols = 0, rows = 0, cell = 0, ring = null, orig = null, logoCol = null, head = 0, filled = 0, acc = 0, ruleNow = 30, codeNow = 1599, cur = null, nxt = null, mutT = 0, layoutKey = '', held = null, maskKey = '', lastPaint = -1;

    const app = Atelier.app({
      stage: canvas,
      animate: true,
      seed: true,
      finish: { grain: 0.03, vignette: 0.12 },
      hint: 'Touchez ou glissez pour semer des cellules · molette : règle voisine',
      notes: 'Une rangée de cellules allumées ou éteintes, et une règle : chaque cellule regarde ses deux voisines et devient, à la ligne suivante, ce que la règle prévoit pour ces trois cases. Huit configurations possibles, deux réponses chacune : 256 règles, numérotées par Stephen Wolfram. La 90 dessine le triangle de Sierpiński, la 30 un désordre qui sert de générateur de hasard, la 110 des structures qui se croisent et calculent. En mode totalistique, trois états et la somme des voisines : 2 187 règles. Une cellule semée au pointeur propage son onde vers le bas, en cône.',
      params: {
        'Règle': {
          mode: { type: 'segmented', label: 'Famille', options: { elementaire: 'Élémentaire', totalistique: 'Trois états' }, value: 'elementaire' },
          regle: { type: 'range', label: 'Règle', min: 0, max: 255, step: 1, value: 110, show: (q) => q.mode === 'elementaire' },
          code: { type: 'range', label: 'Code', min: 0, max: 2186, step: 1, value: 1599, show: (q) => q.mode === 'totalistique' },
          depart: { type: 'segmented', label: 'Première ligne', options: { point: 'Un point', hasard: 'Hasard', rare: 'Quelques points' }, value: 'hasard' },
          densite: { type: 'range', label: 'Densité', min: 0.02, max: 0.9, step: 0.01, value: 0.5, show: (q) => q.depart === 'hasard' },
          mutation: { type: 'range', label: 'Dérive de la règle', min: 0, max: 1, step: 0.01, value: 0 },
        },
        'Règle du logo': {
          logo: { type: 'toggle', label: 'Règle différente dans le logo', value: false },
          regleLogo: { type: 'range', label: 'Règle dans le logo', min: 0, max: 255, step: 1, value: 30, show: (q) => q.logo && q.mode === 'elementaire' },
          codeLogo: { type: 'range', label: 'Code dans le logo', min: 0, max: 2186, step: 1, value: 1041, show: (q) => q.logo && q.mode === 'totalistique' },
          image: { type: 'file', label: 'Logo', accept: 'image/*', show: (q) => q.logo },
        },
        'Mouvement': {
          vitesse: { type: 'range', label: 'Lignes par seconde', min: 0, max: 60, step: 0.5, value: 12 },
        },
        'Cellules': {
          taille: { type: 'range', label: 'Taille', min: 3, max: 40, step: 1, value: 9 },
          forme: { type: 'segmented', label: 'Forme', options: { carre: 'Carré', pastille: 'Pastille', lien: 'Liens' }, value: 'carre' },
          ecart: { type: 'range', label: 'Écart', min: 0, max: 0.6, step: 0.01, value: 0.12 },
          teinte: { type: 'segmented', label: 'Couleur selon', options: { voisinage: 'Voisinage', age: 'Durée', uni: 'Une seule' }, value: 'voisinage' },
        },
        'Couleurs': {
          fond: { type: 'color', label: 'Fond', value: '#101012' },
          couleurs: { type: 'palette', label: 'Cellules', value: ['#ef5a2f', '#edd14b', '#486cfc'] },
          accent: { type: 'color', label: 'Logo et semis', value: '#f4f1ea' },
        },
      },
      presets: {
        'Règle 110': {},
        'Règle 30': { regle: 30, depart: 'point', couleurs: ['#f4f1ea', '#cfcac0'], teinte: 'uni', ecart: 0.08, taille: 6 },
        'Sierpiński': { regle: 90, depart: 'point', forme: 'pastille', ecart: 0.1, taille: 7, couleurs: ['#486cfc', '#f272ba', '#edd14b', '#f4f1ea'] },
        'Tissage': { regle: 54, forme: 'lien', taille: 12, densite: 0.3, couleurs: [SAL[1], SAL[2], SAL[3]], fond: SAL[0], ecart: 0.2 },
        'Trois états': { mode: 'totalistique', code: 1599, depart: 'point', taille: 7, ecart: 0.06, couleurs: ['#edd14b', '#ef5a2f'] },
        'Dérive': { regle: 105, mutation: 0.55, vitesse: 20, taille: 7, couleurs: GLY.slice(2, 7), ecart: 0.1 },
        'Logo': { logo: true, regle: 204, regleLogo: 30, densite: 0.5, teinte: 'uni', couleurs: ['#2a2a2f'], accent: '#ef5a2f', taille: 7, ecart: 0.1 },
        'Biennale': { regle: 150, depart: 'point', fond: BIEN[0], couleurs: [BIEN[1], BIEN[2], BIEN[3]], accent: BIEN[4], forme: 'pastille', taille: 10 },
        'Menthe': { regle: 73, fond: MEN[1], couleurs: [MEN[2], MEN[3], MEN[0]], forme: 'lien', taille: 10 },
        'Kegelbahn': { regle: 45, depart: 'rare', fond: KB[0], couleurs: [KB[1], KB[2]], teinte: 'age', taille: 8, ecart: 0.16 },
      },
      brand(colors) {
        const lum = (x) => { const c = hex(x); return c[0] * 0.299 + c[1] * 0.587 + c[2] * 0.114; };
        const s = colors.slice().sort((a, b) => lum(a) - lum(b)), rest = s.slice(1);
        return { fond: s[0], couleurs: rest.length ? rest : ['#ffffff'], accent: s[s.length - 1] };
      },
      pointer: {
        down: (q) => { held = 'tap'; sow(q.x, q.y); held = 'down'; },
        drag: (q) => { if (held) { held = 'drag'; sow(q.x, q.y); } },
        up: () => { held = null; lastPaint = -1; },
        wheel: (q, dy) => {
          const d = dy > 0 ? 1 : -1;
          if (p.mode === 'elementaire') app.set('regle', (p.regle + d + 256) % 256); else app.set('code', (p.code + d + 2187) % 2187);
        },
      },
      onChange(k) {
        if (k === 'image') maskKey = '';
        if (k === 'regle' || k === 'code' || k === '*') { ruleNow = p.regle; codeNow = p.code; }
        if (['*', 'mode', 'depart', 'densite', 'taille', 'logo', 'image'].includes(k)) layoutKey = '';
        dirtyAll = true;
      },
      onSeed() { layoutKey = ''; },
      export: { name: 'automates', svg: () => toSVG() },
    });
    const p = app.params;

    const hex = (x) => { const n = parseInt(x.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; };

    // ——— Grille : un anneau de lignes (états), avec la configuration qui a produit chaque cellule ———
    function layout() {
      const { w, h } = app.size, key = [w, h, p.taille, p.mode, p.depart, p.densite, p.logo, p.image ? 1 : 0, app.logoImg ? 1 : 0].join();
      if (key === layoutKey && ring) return; layoutKey = key; dirtyAll = true;
      cell = p.taille; cols = Math.ceil(w / cell) + 1; rows = Math.ceil(h / cell) + 2;
      ring = new Uint8Array(cols * rows); orig = new Uint8Array(cols * rows); logoCol = new Uint8Array(cols * rows); ageRing = new Uint16Array(cols * rows); dirty = new Uint8Array(rows); dirtyAll = true;
      cur = new Uint8Array(cols); nxt = new Uint8Array(cols);
      const rng = app.rng(), K = p.mode === 'totalistique' ? 3 : 2;
      if (p.depart === 'point') cur[cols >> 1] = 1;
      else if (p.depart === 'rare') { for (let i = 0; i < 7; i++) cur[(rng() * cols) | 0] = 1 + ((rng() * (K - 1)) | 0); }
      else for (let i = 0; i < cols; i++) cur[i] = rng() < p.densite ? 1 + ((rng() * (K - 1)) | 0) : 0;
      ruleNow = p.regle; codeNow = p.code; head = 0; filled = 0; acc = 0; gen = 0; genOf = new Int32Array(rows);
      buildMask(w, h);
      push(cur, null);
      for (let i = 0; i < rows - 1; i++) step();
    }
    // le logo en coordonnées de grille, posé au centre de l'écran (il défile avec la grille : la zone est fixe à l'écran)
    let maskG = null, period = 1, gen = 0, genOf = null, ageRing = null, dirty = null, dirtyAll = true, strip = null, sctx = null;
    function buildMask(w, h) {
      maskG = null; if (!p.logo) return;
      const img0 = p.image || app.logoImg; maskKey = (img0 ? (img0.src || 'c') : 'demo');
      const c = document.createElement('canvas'); c.width = cols; c.height = rows; const x = c.getContext('2d', { willReadFrequently: true });
      // le logo est inscrit dans le flux des générations : il défile vers le haut, puis revient après un blanc
      c.height = period = Math.round(rows * 1.3);
      const L = Math.min(w, h) * 0.62 / cell, cx = w / 2 / cell, cy = (h / 2 + cell) / cell;
      if (img0) { const iw = img0.naturalWidth || img0.width, ih = img0.naturalHeight || img0.height, k = L / Math.max(iw, ih); x.drawImage(img0, cx - iw * k / 2, cy - ih * k / 2, iw * k, ih * k); }
      else { x.fillStyle = '#000'; x.beginPath(); x.arc(cx, cy, L * 0.48, 0, TAU); x.arc(cx, cy, L * 0.27, 0, TAU, true); x.fill('evenodd'); x.fillRect(cx - L * 0.07, cy - L * 0.5, L * 0.14, L); }
      const NM = cols * period, d = x.getImageData(0, 0, cols, period).data; let transp = 0; for (let i = 3; i < d.length; i += 4) if (d[i] < 128) transp++;
      const useA = transp > NM * 0.05; maskG = new Uint8Array(NM);
      for (let i = 0; i < NM; i++) { const l = (d[i * 4] * 0.2126 + d[i * 4 + 1] * 0.7152 + d[i * 4 + 2] * 0.0722) / 255; maskG[i] = (useA ? d[i * 4 + 3] > 128 : d[i * 4 + 3] > 128 && l < 0.5) ? 1 : 0; }
    }
    // la ligne qui va apparaître en bas de l'écran : rangée d'écran = rows - 1
    function push(row, from, inLogo) {
      const o = head * cols, pr = ((head - 1 + rows) % rows) * cols, first = filled === 0; ring.set(row, o); genOf[head] = gen++;
      for (let i = 0; i < cols; i++) ageRing[o + i] = row[i] ? (first ? 1 : ageRing[pr + i] + 1) : 0;
      dirty[head] = 1; dirty[(head - 1 + rows) % rows] = 1; if (from) orig.set(from, o); else orig.fill(0, o, o + cols);
      if (inLogo) logoCol.set(inLogo, o); else logoCol.fill(0, o, o + cols);
      head = (head + 1) % rows; filled = Math.min(rows, filled + 1);
    }
    const fromBuf = new Uint8Array(4096), logoBuf = new Uint8Array(4096);
    // une génération à partir de la ligne src ; g est son numéro (pour savoir où passe le logo)
    function evolve(src, dst, g) {
      const tot = p.mode === 'totalistique', n = cols, rA = ruleNow, rB = p.regleLogo, cA = digits(codeNow), cB = digits(p.codeLogo), mo = (g % period) * cols;
      for (let i = 0; i < n; i++) {
        const l = src[(i - 1 + n) % n], c = src[i], r = src[(i + 1) % n], inL = maskG ? maskG[mo + i] : 0;
        let v, f;
        if (tot) { const s = l + c + r; v = (inL ? cB : cA)[s]; f = s; }
        else { f = (l << 2) | (c << 1) | r; v = ((inL ? rB : rA) >> f) & 1; }
        dst[i] = v; fromBuf[i] = f; logoBuf[i] = inL;
      }
    }
    function step() {
      evolve(cur, nxt, gen);
      [cur, nxt] = [nxt, cur];
      push(cur, fromBuf.subarray(0, cols), logoBuf.subarray(0, cols));
    }
    const digCache = new Map();
    function digits(code) { let d = digCache.get(code); if (d) return d; d = new Uint8Array(7); let c = code; for (let i = 0; i < 7; i++) { d[i] = c % 3; c = (c / 3) | 0; } digCache.set(code, d); return d; }

    // semer : sous le pointeur, une cellule bascule, et toutes les lignes en dessous sont recalculées : l'onde descend en cône
    function sow(x, y) {
      if (!ring) return; const i = Math.max(0, Math.min(cols - 1, Math.floor(x / cell)));
      const r0 = Math.max(0, Math.min(rows - 2, Math.floor((y + acc * cell) / cell)));
      if (held === 'drag' && i === lastPaint) return; lastPaint = i;
      const K = p.mode === 'totalistique' ? 3 : 2, o0 = ((head + r0) % rows) * cols;
      for (let k = -1; k <= 1; k++) { const j = (i + k + cols) % cols; ring[o0 + j] = k === 0 && held !== 'drag' ? (ring[o0 + j] + 1) % K : Math.max(1, ring[o0 + j]); orig[o0 + j] = 255; }
      const row = new Uint8Array(cols);
      for (let r = r0 + 1; r < rows; r++) {
        const ri = (head + r) % rows, up = ((ri - 1 + rows) % rows) * cols;
        evolve(ring.subarray(up, up + cols), row, genOf[ri]);
        for (let j = 0; j < cols; j++) { const changed = row[j] !== ring[ri * cols + j]; ring[ri * cols + j] = row[j]; orig[ri * cols + j] = changed && row[j] ? 255 : fromBuf[j]; logoCol[ri * cols + j] = logoBuf[j]; ageRing[ri * cols + j] = row[j] ? ageRing[up + j] + 1 : 0; }
      }
      dirtyAll = true;
      cur.set(ring.subarray(((head - 1 + rows) % rows) * cols, ((head - 1 + rows) % rows) * cols + cols));
    }

    app.loop((t, dt) => {
      dt = Math.min(0.1, dt || 0);
      const { w, h, dpr } = app.size;
      layout();
      // dérive : de temps en temps, un bit de la règle bascule ; on revient vers la règle choisie ensuite
      if (p.mutation > 0 && !app.thumbnail) {
        mutT += dt * p.mutation * 0.6;
        if (mutT > 1) { mutT = 0; const rng = Math.random; if (p.mode === 'elementaire') ruleNow = ruleNow === p.regle ? p.regle ^ (1 << ((rng() * 8) | 0)) : (rng() < 0.5 ? p.regle : ruleNow ^ (1 << ((rng() * 8) | 0))); else { const d = digits(codeNow).slice(); d[(rng() * 7) | 0] = (rng() * 3) | 0; codeNow = d.reduce((a, v, i) => a + v * 3 ** i, 0); } }
      }
      if (!app.thumbnail) { acc += dt * p.vitesse; while (acc >= 1) { acc -= 1; step(); } }
      draw(ctx, w, h, dpr);
      app.finish(ctx);
    });

    // couleur d'une cellule : -1 pour l'accent (logo, semis), sinon un indice dans la palette
    function colorOf(o, v) {
      const nC = p.couleurs.length;
      if (orig[o] === 255 || logoCol[o]) return -1;
      if (p.teinte === 'uni') return (v - 1) % nC;
      if (p.teinte === 'age') return Math.min(nC - 1, ((ageRing[o] - 1) / 3) | 0);
      return p.mode === 'totalistique' ? (v - 1 + orig[o]) % nC : orig[o] % nC;
    }
    // chaque ligne est dessinée une fois dans une bande hors écran (un anneau, comme les données), puis la bande défile
    function drawRow(X, ri) {
      const C = p.couleurs, y0 = ri * cell, W = cols * cell, o = ri * cols, g = cell * p.ecart, s = cell - g;
      X.save(); X.beginPath(); X.rect(0, y0, W, cell); X.clip();
      X.fillStyle = p.fond; X.fillRect(0, y0, W, cell);
      const paths = C.map(() => new Path2D()), acP = new Path2D(), pathOf = (ci) => ci < 0 ? acP : paths[ci];
      if (p.forme === 'lien') {
        const lw = Math.max(1, cell * (0.42 - p.ecart * 0.5)), yc = y0 + cell / 2;
        const hasUp = ri !== head, up = ((ri - 1 + rows) % rows) * cols, dn = (ri + 1) % rows, hasDn = dn !== head, od = dn * cols;
        for (let i = 0; i < cols; i++) {
          const v = ring[o + i]; if (!v) continue; const P = pathOf(colorOf(o + i, v)), cx = i * cell + cell / 2; let any = false;
          if (hasUp) for (let d = -1; d <= 1; d++) { const j = i + d; if (j < 0 || j >= cols || !ring[up + j]) continue; P.moveTo(cx, yc); P.lineTo(cx + d * cell / 2, y0); any = true; }
          if (!any) { P.moveTo(cx + lw / 2, yc); P.arc(cx, yc, lw / 2, 0, TAU); }
        }
        // la moitié haute des liens des cellules filles, qui tombe dans cette ligne
        if (hasDn) for (let j = 0; j < cols; j++) {
          const v = ring[od + j]; if (!v) continue; const P = pathOf(colorOf(od + j, v)), cx = j * cell + cell / 2;
          for (let d = -1; d <= 1; d++) { const i = j + d; if (i < 0 || i >= cols || !ring[o + i]) continue; P.moveTo(cx + d * cell / 2, y0 + cell); P.lineTo(cx + d * cell, yc); }
        }
        X.lineCap = 'round'; X.lineWidth = lw;
        paths.forEach((P, k) => { X.strokeStyle = C[k]; X.stroke(P); }); X.strokeStyle = p.accent; X.stroke(acP);
      } else {
        const rr = p.forme === 'pastille' ? s / 2 : Math.min(s * 0.18, 3);
        for (let i = 0; i < cols; i++) { const v = ring[o + i]; if (!v) continue; const P = pathOf(colorOf(o + i, v)), x = i * cell + g / 2; if (rr > 0.6) P.roundRect(x, y0 + g / 2, s, s, rr); else P.rect(x, y0 + g / 2, s, s); }
        paths.forEach((P, k) => { X.fillStyle = C[k]; X.fill(P); }); X.fillStyle = p.accent; X.fill(acP);
      }
      X.restore();
    }
    function draw(c, w, h, dpr) {
      const ks = Math.min(dpr, 2), SW = Math.ceil(cols * cell * ks), SH = Math.ceil(rows * cell * ks);
      if (!strip || strip.width !== SW || strip.height !== SH) { strip = document.createElement('canvas'); strip.width = SW; strip.height = SH; sctx = strip.getContext('2d'); dirtyAll = true; }
      sctx.setTransform(ks, 0, 0, ks, 0, 0);
      for (let ri = 0; ri < rows; ri++) if (dirtyAll || dirty[ri]) { drawRow(sctx, ri); dirty[ri] = 0; }
      dirtyAll = false;
      c.setTransform(dpr, 0, 0, dpr, 0, 0);
      c.fillStyle = p.fond; c.fillRect(0, 0, w, h);
      // ordre à l'écran : de la plus ancienne (head) à la plus récente
      const sm = acc * cell, y0 = Math.round(-sm * ks) / ks, n1 = rows - head, W = cols * cell;
      c.imageSmoothingEnabled = ks !== dpr;
      c.drawImage(strip, 0, head * cell * ks, SW, n1 * cell * ks, 0, y0, W, n1 * cell);
      if (head > 0) c.drawImage(strip, 0, 0, SW, head * cell * ks, 0, y0 + n1 * cell, W, head * cell);
    }

    // pour l'export : toutes les cellules dans l'ordre de l'écran
    function cells(fn) {
      const sm = acc * cell;
      for (let r = 0; r < rows; r++) {
        const ri = (head + r) % rows, o = ri * cols, y = r * cell - sm;
        for (let i = 0; i < cols; i++) { const v = ring[o + i]; if (v) fn(i * cell, y, colorOf(o + i, v), ri, i, r); }
      }
    }

    function toSVG() {
      const { w, h } = app.size, C = p.couleurs, g = cell * p.ecart, s = cell - g, f = (v) => +v.toFixed(2), bins = C.map(() => []), ac = [];
      if (p.forme === 'lien') {
        const lw = Math.max(1, cell * (0.42 - p.ecart * 0.5));
        cells((x, y, ci, ri, i, r) => {
          if (r === 0) return; const L = ci < 0 ? ac : bins[ci], cx = x + cell / 2, cy = y + cell / 2, up = ((ri - 1 + rows) % rows) * cols; let d0 = '';
          for (const d of [-1, 0, 1]) { const j = i + d; if (j >= 0 && j < cols && ring[up + j]) d0 += `M${f(cx)} ${f(cy)}L${f(cx + d * cell)} ${f(cy - cell)}`; }
          L.push(d0 || `M${f(cx)} ${f(cy)}h0`);
        });
        const g2 = (col, L) => L.length ? `<path fill="none" stroke="${col}" stroke-width="${f(lw)}" stroke-linecap="round" d="${L.join('')}"/>` : '';
        return `<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><rect width="100%" height="100%" fill="${p.fond}"/>${C.map((c, k) => g2(c, bins[k])).join('')}${g2(p.accent, ac)}</svg>`;
      }
      const rr = p.forme === 'pastille' ? s / 2 : Math.min(s * 0.18, 3);
      cells((x, y, ci) => { if (y > h || y + cell < 0 || x > w) return; (ci < 0 ? ac : bins[ci]).push(`<rect x="${f(x + g / 2)}" y="${f(y + g / 2)}" width="${f(s)}" height="${f(s)}"${rr > 0.6 ? ` rx="${f(rr)}"` : ''}/>`); });
      const grp = (col, L) => L.length ? `<g fill="${col}">${L.join('')}</g>` : '';
      return `<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><rect width="100%" height="100%" fill="${p.fond}"/>${C.map((c, k) => grp(c, bins[k])).join('')}${grp(p.accent, ac)}</svg>`;
    }
  </script>
</body>
</html>
