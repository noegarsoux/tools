<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tuiles de Truchet</title>
  <link rel="stylesheet" href="../../assets/ui/atelier.css">
</head>
<body>
  <canvas style="cursor: crosshair"></canvas>
  <script src="../../assets/ui/atelier.js"></script>
  <script>
    const canvas = document.querySelector('canvas');
    const ctx = canvas.getContext('2d');
    let grid = [], cols = 0, rows = 0;

    const app = Atelier.app({
      stage: canvas,
      animate: true,
      params: {
        'Tuiles': {
          style: { type: 'select', label: 'Style', value: 'arcs', options: { arcs: 'Arcs', diagonal: 'Diagonales', maze: 'Labyrinthe', triangles: 'Triangles', circles: 'Quarts pleins' } },
          size: { type: 'range', label: 'Taille', min: 16, max: 200, step: 2, value: 64 },
          stroke: { type: 'range', label: 'Trait', min: 1, max: 48, step: 1, value: 12 },
          bias: { type: 'range', label: 'Orientation', min: 0, max: 1, step: 0.05, value: 0.5 },
        },
        'Mouvement': {
          rate: { type: 'range', label: 'Rotations / s', min: 0, max: 60, step: 1, value: 12 },
          ease: { type: 'range', label: 'Souplesse', min: 0.02, max: 0.4, step: 0.01, value: 0.12 },
        },
        'Couleur': {
          bg: { type: 'color', label: 'Fond', value: '#111114' },
          fg: { type: 'color', label: 'Motif', value: '#ff5a36' },
        },
      },
      presets: {
        'Corail': { style: 'arcs', size: 64, stroke: 12, bg: '#111114', fg: '#ff5a36', rate: 12 },
        'Labyrinthe': { style: 'maze', size: 36, stroke: 6, bg: '#f2efe8', fg: '#1b1b1b', rate: 30 },
        'Bauhaus': { style: 'circles', size: 110, bg: '#1d3fbb', fg: '#f7c948', rate: 6 },
        'Signal': { style: 'triangles', size: 48, bg: '#0b0b0b', fg: '#e8ff3a', rate: 40 },
        'Néon': { style: 'arcs', size: 90, stroke: 4, bg: '#08010f', fg: '#4cc9f0', rate: 20 },
      },
      notes: 'Cliquez sur une tuile pour la faire pivoter.',
      export: { png: true, video: true, svg: () => toSVG(), name: 'truchet' },
      onChange(key) { if (['size', 'bias', 'style', '*'].includes(key)) build(); },
      onSeed: () => build(),
      onResize: () => build(),
    });
    const p = app.params;

    // Chaque tuile a une orientation cible (quarts de tour) et un angle affiché qui la rejoint en douceur.
    function build() {
      const r = app.rng();
      cols = Math.ceil(app.size.w / p.size); rows = Math.ceil(app.size.h / p.size);
      const four = p.style === 'triangles' || p.style === 'circles';
      grid = Array.from({ length: cols * rows }, () => {
        let o = r() < p.bias ? 1 : 0;
        if (four) o = o * 2 + (r() < 0.5 ? 1 : 0);
        return { target: o, angle: o };
      });
    }

    function shape(c, s, style) {
      const h = s / 2;
      c.beginPath();
      switch (style) {
        case 'arcs':
          c.arc(-h, -h, h, 0, Math.PI / 2); c.moveTo(h, 0); c.arc(h, h, h, -Math.PI / 2, -Math.PI, true); c.stroke(); break;
        case 'diagonal': c.moveTo(-h, -h); c.lineTo(h, h); c.stroke(); break;
        case 'maze': c.moveTo(-h, h); c.lineTo(h, -h); c.stroke(); break;
        case 'triangles': c.moveTo(-h, -h); c.lineTo(h, -h); c.lineTo(-h, h); c.closePath(); c.fill(); break;
        case 'circles':
          c.moveTo(-h, -h); c.arc(-h, -h, h, 0, Math.PI / 2); c.closePath();
          c.moveTo(h, h); c.arc(h, h, h, Math.PI, Math.PI * 1.5); c.closePath(); c.fill(); break;
      }
    }

    function draw() {
      const { w, h, dpr } = app.size, s = p.size;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.fillStyle = p.bg; ctx.fillRect(0, 0, w, h);
      ctx.strokeStyle = ctx.fillStyle = p.fg;
      ctx.lineWidth = p.stroke; ctx.lineCap = 'round';
      for (let j = 0; j < rows; j++) for (let i = 0; i < cols; i++) {
        const t = grid[j * cols + i];
        ctx.save();
        ctx.translate(i * s + s / 2, j * s + s / 2);
        ctx.rotate(t.angle * Math.PI / 2);
        shape(ctx, s, p.style);
        ctx.restore();
      }
    }

    let budget = 0;
    app.loop((t, dt) => {
      budget += p.rate * dt;
      while (budget >= 1 && grid.length) { grid[Math.floor(Math.random() * grid.length)].target += 1; budget -= 1; }
      const k = 1 - Math.pow(1 - p.ease, dt * 60);
      for (const g of grid) g.angle += (g.target - g.angle) * k;
      draw();
    });

    canvas.addEventListener('click', (e) => {
      const r = canvas.getBoundingClientRect();
      const i = Math.floor((e.clientX - r.left) / p.size), j = Math.floor((e.clientY - r.top) / p.size);
      const g = grid[j * cols + i];
      if (g) { g.target += 1; if (!app.playing) { g.angle = g.target; draw(); } }
    });

    function toSVG() {
      const { w, h } = app.size, s = p.size, hs = s / 2;
      const paths = {
        arcs: `<path d="M0 ${-hs}A${hs} ${hs} 0 0 1 ${-hs} 0M${hs} 0A${hs} ${hs} 0 0 0 0 ${hs}" fill="none" stroke="${p.fg}"/>`,
        diagonal: `<line x1="${-hs}" y1="${-hs}" x2="${hs}" y2="${hs}" stroke="${p.fg}"/>`,
        maze: `<line x1="${-hs}" y1="${hs}" x2="${hs}" y2="${-hs}" stroke="${p.fg}"/>`,
        triangles: `<path d="M${-hs} ${-hs}H${hs}L${-hs} ${hs}Z" fill="${p.fg}"/>`,
        circles: `<path d="M${-hs} ${-hs}h${hs}a${hs} ${hs} 0 0 1 ${-hs} ${hs}Z M${hs} ${hs}h${-hs}a${hs} ${hs} 0 0 1 ${hs} ${-hs}Z" fill="${p.fg}"/>`,
      };
      let out = '';
      for (let j = 0; j < rows; j++) for (let i = 0; i < cols; i++) {
        const a = Math.round(grid[j * cols + i].target) * 90;
        out += `<g transform="translate(${i * s + hs} ${j * s + hs}) rotate(${a})">${paths[p.style]}</g>`;
      }
      return `<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><rect width="${w}" height="${h}" fill="${p.bg}"/><g stroke-width="${p.stroke}" stroke-linecap="round">${out}</g></svg>`;
    }

    build();
  </script>
</body>
</html>
