<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Boule à neige</title>
  <link rel="stylesheet" href="../../assets/ui/atelier.css">
</head>
<body>
  <canvas></canvas>
  <script src="../../assets/ui/atelier.js"></script>
  <script>
    // Boule à neige : les flocons vivent dans le repère de la boule. Chacun tend vers la vitesse du liquide
    // (un tourbillon fait de sinus croisés, dont l'amplitude retombe après chaque secousse) plus sa propre
    // vitesse de chute, lente. Quand la boule accélère, le liquide reste en arrière : dans le repère de la boule,
    // chaque flocon reçoit −a. Les flocons rebondissent sur la paroi, se posent sur le sol enneigé ou sur le dessus
    // du logo (masque rastérisé), et une secousse assez forte les remet tous en suspension.
    const canvas = document.querySelector('canvas');
    const ctx = canvas.getContext('2d');
    const TAU = Math.PI * 2;
    const PAL = (k) => Atelier.PALETTES[k].colors;
    const BIE = PAL('biennale'), LUZ = PAL('luzern'), MEN = PAL('menthe'), KEG = PAL('kegelbahn'), ORB = PAL('orbite');

    let simT = 0, vKey = '', logoM = null, logoKey = '', ptr = null, S = null, gKey = '', BG = null, bgKey = '', LG = null, lgKey = '';

    const app = Atelier.app({
      stage: canvas,
      animate: true,
      seed: true,
      finish: { grain: 0.04, vignette: 0.22 },
      hint: 'Attrapez la boule et secouez-la · clic : petite secousse · molette : tourbillon',
      notes: 'Dans une boule à neige, les flocons sont des grains blancs en suspension dans un liquide un peu épais : quand on la secoue, le liquide traîne derrière le verre et se met à tourner, puis tout retombe lentement. Ici, le logo se dresse en relief au milieu de la boule, les flocons et quelques paillettes aux couleurs de la marque tourbillonnent, se posent sur le sol et sur le dessus du logo, et une secousse les fait repartir. Attrapez la boule pour la secouer vous-même.',
      params: {
        'Neige': {
          flocons: { type: 'range', label: 'Flocons', min: 200, max: 5000, step: 50, value: 1800 },
          taille: { type: 'range', label: 'Taille des flocons', min: 0.4, max: 3, step: 0.05, value: 1 },
          chute: { type: 'range', label: 'Vitesse de chute', min: 0.1, max: 2, step: 0.01, value: 0.6 },
          paillettes: { type: 'range', label: 'Paillettes', min: 0, max: 0.5, step: 0.01, value: 0.12 },
          tourbillon: { type: 'range', label: 'Tourbillon', min: 0.2, max: 2, step: 0.01, value: 1 },
        },
        'Secousses': {
          secouer: { type: 'toggle', label: 'Secouer seul', value: true },
          intervalle: { type: 'range', label: 'Intervalle', min: 3, max: 20, step: 0.5, value: 8 },
          force: { type: 'range', label: 'Force', min: 0.2, max: 2, step: 0.01, value: 1 },
        },
        'Boule': {
          echelle: { type: 'range', label: 'Taille du logo', min: 0.3, max: 1, step: 0.01, value: 0.62 },
          relief: { type: 'range', label: 'Relief', min: 0, max: 1, step: 0.01, value: 0.5 },
          logo: { type: 'color', label: 'Logo', value: '#e5452a' },
          neige: { type: 'color', label: 'Neige', value: '#f7f7f4' },
          liquide: { type: 'color', label: 'Liquide', value: '#a9c7e8' },
          socle: { type: 'color', label: 'Socle', value: '#2a2320' },
          couleurs: { type: 'palette', label: 'Paillettes', value: ['#f2c230', '#e5452a', '#9db0ef'] },
          fond: { type: 'color', label: 'Fond', value: '#1d2230' },
          image: { type: 'file', label: 'Logo', accept: 'image/*' },
        },
      },
      presets: {
        'Souvenir': {},
        'Tempête': { flocons: 3200, taille: 0.8, tourbillon: 1.8, force: 1.6, intervalle: 5, chute: 0.45 },
        'Paillettes': { paillettes: 0.5, flocons: 2200, couleurs: ['#f2c230', '#f4f1ea', '#e57d9e'], liquide: '#f2b0c8', logo: '#16161a', fond: '#3a1f2c', socle: '#e8d9c4' },
        'Gros flocons': { flocons: 500, taille: 2.6, chute: 0.35, paillettes: 0, tourbillon: 0.6 },
        'Nuit': { fond: '#07080c', liquide: '#2a3a6a', logo: '#f2c230', socle: '#111111', neige: '#e8ecf4', paillettes: 0.2, couleurs: ['#f2c230', '#ffffff'] },
        'Grand logo': { echelle: 0.92, relief: 0.8, logo: '#2f5fd0', liquide: '#dfe9f2', fond: '#e9e5dc', socle: '#16161a' },
        'Plat': { relief: 0, logo: '#16161a', liquide: '#ffffff', neige: '#16161a', fond: '#f4f1ea', socle: '#e5452a', paillettes: 0.25, couleurs: ['#e5452a'] },
        'Biennale': { logo: BIE[1], liquide: BIE[3], neige: BIE[0], socle: BIE[2], fond: BIE[4], couleurs: [BIE[2], BIE[1]], paillettes: 0.2 },
        'Luzern': { logo: LUZ[0], liquide: LUZ[2], neige: '#ffffff', socle: LUZ[3], fond: LUZ[1], couleurs: [LUZ[0], LUZ[4]], paillettes: 0.3 },
        'Menthe': { logo: MEN[1], liquide: MEN[2], neige: MEN[0], socle: MEN[3], fond: mix(MEN[3], '#000000', 0.4), couleurs: [MEN[0], MEN[2]], flocons: 2600 },
      },
      brand(colors) {
        const s = colors.slice().sort((a, b) => lum(a) - lum(b)), D = s[0], L = s[s.length - 1], mid = s.length > 2 ? s.slice(1, -1) : [D];
        return { logo: mid[0], fond: D, socle: mix(D, '#ffffff', 0.1), neige: L, liquide: mix(L, mid[mid.length - 1], 0.35), couleurs: mid.concat([L]) };
      },
      pointer: {
        down: (q) => { ptr = { x: q.x, y: q.y, x0: q.x, y0: q.y, moved: 0, grab: !!S && Math.hypot(q.x - S.cx - S.ox, q.y - S.cy - S.oy) < S.R * 1.25 }; if (ptr.grab) { ptr.gx = S.ox - q.x; ptr.gy = S.oy - q.y; S.hold = simT + 4; } },
        drag: (q) => { if (!ptr) return; ptr.moved += Math.hypot(q.x - ptr.x, q.y - ptr.y); ptr.x = q.x; ptr.y = q.y; if (ptr.grab) S.hold = simT + 4; },
        up: () => { if (ptr && ptr.moved < 6 && S) { shake(0.6); } ptr = null; },
        wheel: (q, dy) => app.set('tourbillon', Math.max(0.2, Math.min(2, +(p.tourbillon + (dy > 0 ? -0.1 : 0.1)).toFixed(2)))),
      },
      onChange(k) { if (['*', 'image'].includes(k)) logoKey = ''; },
      export: { name: 'boule-a-neige', svg: () => toSVG() },
    });
    const p = app.params;

    function hex(x) { const n = parseInt(x.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
    function lum(x) { const c = hex(x); return (c[0] * 0.299 + c[1] * 0.587 + c[2] * 0.114) / 255; }
    function mix(a, b, t) { const A = hex(a), C = hex(b); return '#' + A.map((v, i) => Math.round(v + (C[i] - v) * t).toString(16).padStart(2, '0')).join(''); }
    function rng(s) { let a = s >>> 0; return () => { a = (a + 0x6d2b79f5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }

    function buildLogo() {
      const img0 = p.image || app.logoImg, key = img0 ? (img0.src || 'c') : 'demo'; if (key === logoKey) return; logoKey = key; vKey = '';
      const M = 200, c = document.createElement('canvas'); c.width = c.height = M; const x = c.getContext('2d', { willReadFrequently: true }), L = M * 0.94, cx = M / 2;
      if (img0) { const iw = img0.naturalWidth || img0.width, ih = img0.naturalHeight || img0.height, s = L / Math.max(iw, ih); x.drawImage(img0, cx - iw * s / 2, cx - ih * s / 2, iw * s, ih * s); }
      else { x.fillStyle = '#000'; x.beginPath(); x.arc(cx, cx, L * 0.48, 0, TAU); x.arc(cx, cx, L * 0.27, 0, TAU, true); x.fill('evenodd'); x.fillRect(cx - L * 0.07, cx - L * 0.5, L * 0.14, L); }
      const d = x.getImageData(0, 0, M, M).data; let transp = 0; for (let i = 3; i < d.length; i += 4) if (d[i] < 128) transp++; const useA = transp > M * M * 0.05;
      const F = new Float64Array(M * M); for (let i = 0; i < M * M; i++) { const o = i * 4, l = (d[o] * 0.2126 + d[o + 1] * 0.7152 + d[o + 2] * 0.0722) / 255; F[i] = useA ? d[o + 3] / 255 : (d[o + 3] / 255) * Math.min(1, Math.max(0, (0.75 - l) * 2)); }
      { const G2 = new Float64Array(M * M); for (let j = 1; j < M - 1; j++) for (let i = 1; i < M - 1; i++) { let a = 0; for (let b = -1; b <= 1; b++) for (let c = -1; c <= 1; c++) a += F[(j + b) * M + i + c] * (b || c ? (b && c ? 1 : 2) : 4); G2[j * M + i] = a / 16; } F.set(G2); }
      for (let k = 0; k < M; k++) F[k] = F[(M - 1) * M + k] = F[k * M] = F[k * M + M - 1] = 0;
      logoM = contours(F, M, M, 0.5, 0, 0, 1).filter((c) => c.closed && c.pts.length > 6).map((c) => chaikin(chaikin(c.pts, true), true).map((q) => [q[0] / M - 0.5, q[1] / M - 0.5]));
    }
    // carrés marchants + chaînage
    function contours(F, nx, ny, lev, ox, oy, cs) {
      const pt = new Map(), adj = new Map();
      const P = (id) => { let q = pt.get(id); if (q) return q; const cell = id >> 1, i = cell % nx, j = (cell - i) / nx; let a, b, ax, ay, bx, by; if (id & 1) { a = F[j * nx + i]; b = F[(j + 1) * nx + i]; ax = bx = i; ay = j; by = j + 1; } else { a = F[j * nx + i]; b = F[j * nx + i + 1]; ay = by = j; ax = i; bx = i + 1; } const t = (lev - a) / (b - a || 1e-9); q = [ox + (ax + (bx - ax) * t) * cs, oy + (ay + (by - ay) * t) * cs]; pt.set(id, q); return q; };
      const link = (a, b) => { (adj.get(a) || adj.set(a, []).get(a)).push(b); (adj.get(b) || adj.set(b, []).get(b)).push(a); };
      for (let j = 0; j < ny - 1; j++) for (let i = 0; i < nx - 1; i++) {
        const A = F[j * nx + i] > lev, B = F[j * nx + i + 1] > lev, C = F[(j + 1) * nx + i + 1] > lev, D = F[(j + 1) * nx + i] > lev, idx = A | (B << 1) | (C << 2) | (D << 3);
        if (idx === 0 || idx === 15) continue;
        const T = (j * nx + i) * 2, R = (j * nx + i + 1) * 2 + 1, Bo = ((j + 1) * nx + i) * 2, Le = (j * nx + i) * 2 + 1;
        const ctr = (F[j * nx + i] + F[j * nx + i + 1] + F[(j + 1) * nx + i + 1] + F[(j + 1) * nx + i]) / 4 > lev;
        switch (idx) {
          case 1: case 14: link(Le, T); break; case 2: case 13: link(T, R); break; case 3: case 12: link(Le, R); break;
          case 4: case 11: link(R, Bo); break; case 6: case 9: link(T, Bo); break; case 7: case 8: link(Le, Bo); break;
          case 5: if (ctr) { link(Le, Bo); link(T, R); } else { link(Le, T); link(R, Bo); } break;
          case 10: if (ctr) { link(Le, T); link(R, Bo); } else { link(Le, Bo); link(T, R); } break;
        }
      }
      const seen = new Set(), out = [];
      const walk = (s) => { const L = [s]; seen.add(s); let cur = s; for (;;) { const nb = (adj.get(cur) || []).find((x) => !seen.has(x)); if (nb === undefined) break; seen.add(nb); L.push(nb); cur = nb; } return L; };
      for (const [id, nb] of adj) if (nb.length === 1 && !seen.has(id)) out.push({ pts: walk(id).map(P), closed: false });
      for (const [id] of adj) if (!seen.has(id)) out.push({ pts: walk(id).map(P), closed: true });
      return out;
    }
    function chaikin(pts, closed) {
      const o = []; const n = pts.length; for (let k = 0; k < (closed ? n : n - 1); k++) { const a = pts[k], b = pts[(k + 1) % n]; o.push([a[0] * 0.75 + b[0] * 0.25, a[1] * 0.75 + b[1] * 0.25], [a[0] * 0.25 + b[0] * 0.75, a[1] * 0.25 + b[1] * 0.75]); }
      if (!closed) { o.unshift(pts[0]); o.push(pts[n - 1]); } return o;
    }

    // ——— Scène (repère local : centre de la boule) ———
    const ground = (x, R = S.R) => R * (0.5 - 0.1 * Math.max(0, 1 - (x / (R * 0.95)) ** 2));
    function build(w, h) {
      buildLogo();
      const m = Math.min(w, h), R = m * 0.33, cx = w / 2, cy = h * 0.46, R0 = rng(app.seed), n = p.flocons | 0, fl = [];
      const ls = R * 1.15 * p.echelle, lx = 0, ly = ground(0, R) - ls * 0.46;
      for (let i = 0; i < n; i++) { const a = R0() * TAU, r = Math.sqrt(R0()) * R * 0.9; fl.push({ x: Math.cos(a) * r, y: Math.sin(a) * r * 0.9, vx: 0, vy: 0, s: (0.6 + R0() * R0() * 1.6), g: R0() < p.paillettes ? 1 + Math.floor(R0() * 8) : 0, tw: R0() * TAU, set: false, k: 0.6 + R0() * 0.8 }); }
      S = { w, h, m, R, cx, cy, fl, ls, lx, ly, ox: 0, oy: 0, vx: 0, vy: 0, ang: 0, A: 1.2, next: simT + 2.5, hold: -1, auto: null, R0, mask: null };
      // masque du logo (repère local, résolution 1 px CSS / 2)
      const MS = 2, Wm = Math.ceil(R * 2 / MS), mc = document.createElement('canvas'); mc.width = mc.height = Wm; const g = mc.getContext('2d', { willReadFrequently: true });
      g.translate(Wm / 2, Wm / 2); g.scale(1 / MS, 1 / MS); g.fillStyle = '#000'; g.beginPath(); for (const lp of logoM) { lp.forEach((q, k) => k ? g.lineTo(lx + q[0] * ls, ly + q[1] * ls) : g.moveTo(lx + q[0] * ls, ly + q[1] * ls)); g.closePath(); } g.fill('evenodd');
      const d = g.getImageData(0, 0, Wm, Wm).data, M = new Uint8Array(Wm * Wm); for (let i = 0; i < Wm * Wm; i++) M[i] = d[i * 4 + 3] > 127 ? 1 : 0;
      S.mask = { M, Wm, MS };
    }
    const inLogo = (x, y) => { const k = S.mask, i = Math.floor(x / k.MS + k.Wm / 2), j = Math.floor(y / k.MS + k.Wm / 2); return i >= 0 && j >= 0 && i < k.Wm && j < k.Wm && k.M[j * k.Wm + i] === 1; };
    function shake(f) { S.auto = { t0: simT, d: 0.9, f: f * p.force, dir: S.R0() < 0.5 ? 1 : -1, ang: (S.R0() - 0.5) * 0.8 }; }

    function step(dt) {
      const R = S.R, sp = 1;
      // mouvement de la boule : main (pointeur), secousse automatique, ou ressort de retour
      let tx = 0, ty = 0;
      if (ptr && ptr.grab) { tx = ptr.x + ptr.gx; ty = ptr.y + ptr.gy; const lim = S.m * 0.25, d = Math.hypot(tx, ty); if (d > lim) { tx *= lim / d; ty *= lim / d; } }
      else if (S.auto) { const u = (simT - S.auto.t0) / S.auto.d; if (u >= 1) S.auto = null; else { const e = Math.sin(Math.PI * u), a = S.auto; tx = Math.sin(u * TAU * 2.5) * e * S.m * 0.06 * a.f * Math.cos(a.ang) * a.dir; ty = Math.sin(u * TAU * 2.5 + 0.6) * e * S.m * 0.05 * a.f; } }
      if (!ptr && !S.auto && p.secouer && simT >= S.next && simT >= S.hold) { shake(1); S.next = simT + p.intervalle; }
      const k = ptr && ptr.grab ? 900 : 260, c = ptr && ptr.grab ? 60 : 14;
      const ax = k * (tx - S.ox) - c * S.vx, ay = k * (ty - S.oy) - c * S.vy;
      S.vx += ax * dt; S.vy += ay * dt; S.ox += S.vx * dt; S.oy += S.vy * dt; S.ang = Math.max(-0.12, Math.min(0.12, S.vx / (S.m * 6)));
      const amag = Math.hypot(ax, ay);
      S.A = Math.max(S.A * Math.exp(-dt * 0.7), Math.min(3, amag / (S.m * 6)) * p.tourbillon);
      const wake = amag > S.m * 6;
      const t = simT, A = S.A * R * 0.9, fall = R * 0.16 * p.chute, ka = 1 / (S.m * 1.0);
      for (const f of S.fl) {
        if (f.set) { if (wake && S.R0() < 0.25) { f.set = false; f.vy = -R * (0.3 + S.R0() * 0.6); f.vx = (S.R0() - 0.5) * R * 0.6; } else continue; }
        const X = f.x / R, Y = f.y / R;
        const s1 = Math.sin(2.7 * X - t * 0.8), c1 = Math.cos(2.7 * X - t * 0.8), s2 = Math.sin(3.1 * Y + t * 0.9), c2 = Math.cos(3.1 * Y + t * 0.9), c3 = Math.cos(2.1 * X - 3.7 * Y + t * 1.2);
        const s3 = Math.sin(2.1 * X - 3.7 * Y + t * 1.2), psi = 0.5 * s1 * s2 + 0.3 * s3 + 0.15 * (X * X + Y * Y), Wf = Math.max(0, 1 - X * X - Y * Y);
        const pY = 0.5 * 3.1 * s1 * c2 - 0.3 * 3.7 * c3 + 0.3 * Y, pX = 0.5 * 2.7 * c1 * s2 + 0.3 * 2.1 * c3 + 0.3 * X;
        const ux = A * 0.6 * (pY * Wf - 2 * Y * psi), uy = -A * 0.6 * (pX * Wf - 2 * X * psi);
        const tvx = ux, tvy = uy + fall * f.k * (f.g ? 1.4 : 1) * (0.6 + f.s * 0.4);
        const drag = 3.2 / f.k;
        f.vx += ((tvx - f.vx) * drag - ax * ka * R * 0.22) * dt; f.vy += ((tvy - f.vy) * drag - ay * ka * R * 0.22) * dt;
        f.x += f.vx * dt; f.y += f.vy * dt; f.tw += dt * 6;
        const d = Math.hypot(f.x, f.y), lim = R * 0.96; if (d > lim) { const nx = f.x / d, ny = f.y / d; f.x = nx * lim; f.y = ny * lim; const vn = f.vx * nx + f.vy * ny; if (vn > 0) { f.vx -= 1.6 * vn * nx; f.vy -= 1.6 * vn * ny; } f.x -= nx * R * 0.02 * S.R0(); f.y -= ny * R * 0.02 * S.R0(); }
        if (f.y >= ground(f.x) && f.vy > 0 && A < R * 0.35) { f.y = ground(f.x) - S.R0() * R * 0.015; f.set = true; f.vx = f.vy = 0; }
        else if (f.vy > 0 && inLogo(f.x, f.y)) { if (A < R * 0.5) { let y = f.y; for (let s = 0; s < 40 && inLogo(f.x, y); s++) y -= 1.5; f.y = y; f.set = true; f.vx = f.vy = 0; } else { f.vy *= -0.3; f.y -= 2; } }
        else if (f.y >= ground(f.x)) { f.y = ground(f.x); f.vy = -Math.abs(f.vy) * 0.3; }
      }
    }

    // ——— Couches fixes ———
    function room(w, h, dpr) {
      const key = [w, h, dpr, p.fond].join('|'); if (key === bgKey) return BG; bgKey = key;
      BG = BG || document.createElement('canvas'); BG.width = Math.round(w * dpr); BG.height = Math.round(h * dpr);
      const g = BG.getContext('2d'), R = rng(3), m = Math.min(w, h); g.setTransform(dpr, 0, 0, dpr, 0, 0);
      const gr = g.createLinearGradient(0, 0, 0, h); gr.addColorStop(0, mix(p.fond, '#ffffff', 0.1)); gr.addColorStop(0.68, p.fond); gr.addColorStop(0.7, mix(p.fond, '#000000', 0.15)); gr.addColorStop(1, mix(p.fond, '#000000', 0.35)); g.fillStyle = gr; g.fillRect(0, 0, w, h);
      g.save(); g.filter = `blur(${m * 0.02}px)`; for (let k = 0; k < 18; k++) { const x = R() * w, y = R() * h * 0.6, r = m * (0.02 + R() * 0.06); g.fillStyle = `rgba(255,${200 + R() * 55 | 0},${150 + R() * 100 | 0},${0.04 + R() * 0.08})`; g.beginPath(); g.arc(x, y, r, 0, TAU); g.fill(); } g.restore();

    }
    function logoLayer(dpr) {
      const key = [S.R, dpr, p.logo, p.relief, p.echelle, p.neige, logoKey].join('|'); if (key === lgKey) return LG; lgKey = key;
      const R = S.R, W = Math.ceil(R * 2 * dpr); LG = LG || document.createElement('canvas'); LG.width = LG.height = W; const g = LG.getContext('2d');
      g.setTransform(dpr, 0, 0, dpr, R * dpr, R * dpr); g.clearRect(-R, -R, R * 2, R * 2);

      g.beginPath(); g.moveTo(-R, R); for (let x = -R; x <= R; x += 4) g.lineTo(x, gy(x)); g.lineTo(R, R); g.closePath(); g.fill();

      // ombre au sol
      g.save(); g.filter = `blur(${R * 0.03 * dpr}px)`; g.fillStyle = 'rgba(30,40,60,0.35)'; g.beginPath(); g.ellipse(S.lx, gy(0) + R * 0.01, S.ls * 0.45, R * 0.05, 0, 0, TAU); g.fill(); g.restore();
      const dep = R * 0.08 * p.relief, nL = Math.ceil(dep / 0.7);
      for (let k = nL; k >= 1; k--) { const u = k / nL; g.fillStyle = mix(p.logo, '#000000', 0.35 + 0.2 * u); path(dep * u * 0.75, -dep * u * 0.55); g.fill('evenodd'); }
      const fg = g.createLinearGradient(0, S.ly - S.ls / 2, 0, S.ly + S.ls / 2); fg.addColorStop(0, mix(p.logo, '#ffffff', 0.12)); fg.addColorStop(1, mix(p.logo, '#000000', 0.12)); g.fillStyle = fg; path(0, 0); g.fill('evenodd');
      return LG;
    }

    function drawBase(g, R, front) {
      const top = R * 0.8, bw = R * 1.02, bh = R * 0.42, ew = R * 0.28;
      if (!front) { g.fillStyle = mix(p.socle, '#000000', 0.4); g.beginPath(); g.ellipse(0, top, bw * 0.9, ew * 0.85, 0, 0, TAU); g.fill(); return; }
      const gr = g.createLinearGradient(-bw * 1.1, 0, bw * 1.1, 0); gr.addColorStop(0, mix(p.socle, '#000000', 0.45)); gr.addColorStop(0.3, mix(p.socle, '#ffffff', 0.18)); gr.addColorStop(0.55, p.socle); gr.addColorStop(1, mix(p.socle, '#000000', 0.55));
      g.fillStyle = gr; g.beginPath(); g.moveTo(-bw * 0.9, top); g.lineTo(bw * 0.9, top); g.lineTo(bw * 1.1, top + bh); g.ellipse(0, top + bh, bw * 1.1, ew, 0, 0, Math.PI); g.lineTo(-bw * 0.9, top); g.closePath(); g.fill();
      g.beginPath(); g.ellipse(0, top, bw * 0.9, ew * 0.85, 0, 0, Math.PI); g.fillStyle = 'rgba(0,0,0,0)'; g.strokeStyle = 'rgba(255,255,255,0.18)'; g.lineWidth = R * 0.012; g.stroke();
      g.strokeStyle = 'rgba(255,255,255,0.12)'; g.beginPath(); g.ellipse(0, top + bh * 0.55, bw * 1.0, ew * 0.95, 0, 0.15, Math.PI - 0.15); g.stroke();
    }

    const LY = {};
    function layer(kind, dpr) {
      const R = S.R, key = [kind, R, dpr, p.socle, p.liquide, p.fond, kind === 'back' ? (logoLayer(dpr), lgKey) : ''].join('|'), o = LY[kind] || (LY[kind] = { c: document.createElement('canvas'), k: '' });
      if (o.k === key) return o.c; o.k = key;
      o.c.width = Math.ceil(2.5 * R * dpr); o.c.height = Math.ceil(2.7 * R * dpr); const g = o.c.getContext('2d'); g.setTransform(dpr, 0, 0, dpr, 1.25 * R * dpr, 1.05 * R * dpr);
      if (kind === 'back') {
        drawBase(g, R, false);
        g.save(); g.beginPath(); g.arc(0, 0, R, 0, TAU); g.clip();
        const lq = g.createRadialGradient(-R * 0.2, -R * 0.3, R * 0.1, 0, 0, R); lq.addColorStop(0, mix(p.liquide, '#ffffff', 0.25)); lq.addColorStop(1, mix(p.liquide, p.fond, 0.35)); g.globalAlpha = 0.55; g.fillStyle = lq; g.fillRect(-R, -R, R * 2, R * 2); g.globalAlpha = 1;
        g.drawImage(logoLayer(dpr), -R, -R, R * 2, R * 2);
        g.restore();
      } else {
        g.save(); g.beginPath(); g.arc(0, 0, R, 0, TAU); g.clip(); const rim = g.createRadialGradient(0, 0, R * 0.7, 0, 0, R); rim.addColorStop(0, 'rgba(0,0,0,0)'); rim.addColorStop(0.85, 'rgba(0,0,0,0.08)'); rim.addColorStop(1, 'rgba(0,0,0,0.38)'); g.fillStyle = rim; g.fillRect(-R, -R, R * 2, R * 2);
        g.restore();
        g.save(); g.globalAlpha = 0.55; g.strokeStyle = '#ffffff'; g.lineCap = 'round'; g.lineWidth = R * 0.05; g.beginPath(); g.arc(0, 0, R * 0.86, Math.PI * 1.08, Math.PI * 1.38); g.stroke();
        g.globalAlpha = 0.85; g.fillStyle = '#ffffff'; g.beginPath(); g.ellipse(-R * 0.52, -R * 0.52, R * 0.07, R * 0.035, -0.75, 0, TAU); g.fill();
        g.globalAlpha = 0.18; g.beginPath(); g.moveTo(R * 0.35, -R * 0.72); g.quadraticCurveTo(R * 0.72, -R * 0.45, R * 0.78, -R * 0.05); g.lineTo(R * 0.62, -R * 0.08); g.quadraticCurveTo(R * 0.56, -R * 0.42, R * 0.25, -R * 0.62); g.closePath(); g.fill();
        g.globalAlpha = 0.3; g.lineWidth = R * 0.015; g.beginPath(); g.arc(0, 0, R * 0.99, Math.PI * 0.05, Math.PI * 0.45); g.stroke(); g.restore();
        g.strokeStyle = 'rgba(255,255,255,0.25)'; g.lineWidth = Math.max(0.8, R * 0.008); g.beginPath(); g.arc(0, 0, R, 0, TAU); g.stroke();
        drawBase(g, R, true);
      }
      return o.c;
    }

    app.loop((t, dt) => {
      dt = Math.min(1 / 20, dt || 0);
      const { w, h, dpr } = app.size; buildLogo();
      const key = [w, h, p.flocons, p.paillettes, p.echelle, app.seed, logoKey].join('|'); if (!S || key !== gKey) { gKey = key; build(w, h); }
      if (app.thumbnail) { if (!S.th) { S.th = true; for (let k = 0; k < 400; k++) { simT += 1 / 60; step(1 / 60); } shake(1.2); for (let k = 0; k < 75; k++) { simT += 1 / 60; step(1 / 60); } } }
      else { const n = 1; for (let k = 0; k < n; k++) { simT += dt / n; step(dt / n); } }
      const R = S.R, C = p.couleurs.length ? p.couleurs : ['#f2c230'];
      ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.drawImage(room(w, h, dpr), 0, 0);
      const X = S.cx + S.ox, Y = S.cy + S.oy, cs = Math.cos(S.ang), sn = Math.sin(S.ang);
      // ombre portée de la boule sur la table
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.fillStyle = 'rgba(0,0,0,0.35)'; ctx.beginPath(); ctx.ellipse(X + R * 0.1, S.cy + R * 1.27, R * 1.25, R * 0.16, 0, 0, TAU); ctx.fill();
      ctx.setTransform(cs * dpr, sn * dpr, -sn * dpr, cs * dpr, X * dpr, Y * dpr);
      ctx.drawImage(layer('back', dpr), -1.25 * R, -1.05 * R, 2.5 * R, 2.7 * R);
      ctx.save(); ctx.beginPath(); ctx.arc(0, 0, R, 0, TAU); ctx.clip();
      // flocons
      const fs = Math.max(0.6, S.m * 0.0028 * p.taille);
      ctx.fillStyle = p.neige;
      ctx.globalAlpha = 0.9; for (const f of S.fl) if (!f.g) { const s = fs * f.s; ctx.fillRect(f.x - s / 2, f.y - s / 2, s, s); }
      for (const f of S.fl) if (f.g) { const s = fs * f.s * 1.3, tw = 0.35 + 0.65 * Math.abs(Math.sin(f.tw)); ctx.globalAlpha = tw; ctx.fillStyle = C[f.g % C.length]; ctx.fillRect(f.x - s / 2, f.y - s / 2, s, s); if (tw > 0.93) { ctx.fillStyle = '#ffffff'; ctx.fillRect(f.x - s * 1.5, f.y - 0.4, s * 3, 0.8); ctx.fillRect(f.x - 0.4, f.y - s * 1.5, 0.8, s * 3); } }
      ctx.globalAlpha = 1;
      ctx.restore(); ctx.drawImage(layer('front', dpr), -1.25 * R, -1.05 * R, 2.5 * R, 2.7 * R);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      app.finish(ctx);
    });

    function toSVG() {
      const { w, h } = app.size, f = (v) => +v.toFixed(2); buildLogo(); const R = S.R, X = S.cx + S.ox, Y = S.cy + S.oy, C = p.couleurs.length ? p.couleurs : ['#f2c230'];
      const top = R * 0.8, bw = R * 1.02, bh = R * 0.42, ew = R * 0.28, dep = R * 0.08 * p.relief;
      const lp = (ox, oy) => logoM.map((l) => 'M' + l.map((q) => f(ox + S.lx + q[0] * S.ls) + ' ' + f(oy + S.ly + q[1] * S.ls)).join('L') + 'Z').join('');
      let gnd = `M${f(-R)} ${f(R)}`; for (let x = -R; x <= R; x += 6) gnd += `L${f(x)} ${f(ground(x))}`; gnd += `L${f(R)} ${f(R)}Z`;
      let inner = `<circle r="${f(R)}" fill="${mix(p.liquide, p.fond, 0.2)}" opacity="0.6"/><path d="${gnd}" fill="${p.neige}"/>`;
      const nL = Math.max(1, Math.ceil(dep / 1.5)); if (dep > 0) for (let k = nL; k >= 1; k--) inner += `<path fill-rule="evenodd" fill="${mix(p.logo, '#000000', 0.35 + 0.2 * k / nL)}" d="${lp(dep * k / nL * 0.75, -dep * k / nL * 0.55)}"/>`;
      inner += `<path fill-rule="evenodd" fill="${p.logo}" d="${lp(0, 0)}"/>`;
      const fs = Math.max(0.6, S.m * 0.0028 * p.taille);
      let snow = ''; for (const fl of S.fl) { const s = fs * fl.s * (fl.g ? 1.3 : 1); snow += `<rect x="${f(fl.x - s / 2)}" y="${f(fl.y - s / 2)}" width="${f(s)}" height="${f(s)}" fill="${fl.g ? C[fl.g % C.length] : p.neige}"/>`; }
      inner += snow + `<circle r="${f(R)}" fill="url(#bord)"/>`;
      const base = `<path d="M${f(-bw * 0.9)} ${f(top)}H${f(bw * 0.9)}L${f(bw * 1.1)} ${f(top + bh)}A${f(bw * 1.1)} ${f(ew)} 0 0 1 ${f(-bw * 1.1)} ${f(top + bh)}Z" fill="url(#socle)"/>`;
      const defs = `<linearGradient id="ciel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${mix(p.fond, '#ffffff', 0.1)}"/><stop offset="0.68" stop-color="${p.fond}"/><stop offset="1" stop-color="${mix(p.fond, '#000000', 0.35)}"/></linearGradient><radialGradient id="bord"><stop offset="0.7" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity="0.38"/></radialGradient><linearGradient id="socle" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="${mix(p.socle, '#000000', 0.45)}"/><stop offset="0.3" stop-color="${mix(p.socle, '#ffffff', 0.18)}"/><stop offset="1" stop-color="${mix(p.socle, '#000000', 0.55)}"/></linearGradient><clipPath id="verre"><circle r="${f(R)}"/></clipPath>`;
      const s = `<rect width="100%" height="100%" fill="url(#ciel)"/><ellipse cx="${f(X + R * 0.1)}" cy="${f(S.cy + R * 1.27)}" rx="${f(R * 1.25)}" ry="${f(R * 0.16)}" fill="#000" opacity="0.35"/><g transform="translate(${f(X)} ${f(Y)}) rotate(${f(S.ang * 180 / Math.PI)})"><ellipse cy="${f(top)}" rx="${f(bw * 0.9)}" ry="${f(ew * 0.85)}" fill="${mix(p.socle, '#000000', 0.4)}"/><g clip-path="url(#verre)">${inner}</g><path d="M${f(Math.cos(Math.PI * 1.08) * R * 0.86)} ${f(Math.sin(Math.PI * 1.08) * R * 0.86)}A${f(R * 0.86)} ${f(R * 0.86)} 0 0 1 ${f(Math.cos(Math.PI * 1.38) * R * 0.86)} ${f(Math.sin(Math.PI * 1.38) * R * 0.86)}" fill="none" stroke="#fff" stroke-opacity="0.55" stroke-width="${f(R * 0.05)}" stroke-linecap="round"/><circle r="${f(R)}" fill="none" stroke="#fff" stroke-opacity="0.25" stroke-width="${f(Math.max(0.8, R * 0.008))}"/>${base}</g>`;
      return `<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><defs>${defs}</defs>${s}</svg>`;
    }
  </script>
