<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Taches de Rorschach</title>
  <link rel="stylesheet" href="../../assets/ui/atelier.css">
</head>
<body>
  <canvas></canvas>
  <script src="../../assets/ui/atelier.js"></script>
  <script>
    // Taches de Rorschach : un champ d'« encre » est calculé sur une grille, toujours en |x| pour que la feuille soit
    // pliée en deux. Le champ mêle un bruit fractal 3D (le temps est la troisième dimension), une enveloppe qui garde
    // l'encre près du pli, les gouttes déposées au doigt et, en option, le logo flouté. On en tire des courbes de niveau
    // (marching squares) qu'on chaîne en boucles fermées et qu'on remplit en pair-impair : chaque niveau est un aplat.
    const canvas = document.querySelector('canvas');
    const ctx = canvas.getContext('2d');
    const TAU = Math.PI * 2;
    const PAL = (k) => Atelier.PALETTES[k].colors;
    const BIEN = PAL('biennale'), GLY = PAL('glyphes'), SAL = PAL('salon'), MEN = PAL('menthe'), KB = PAL('kegelbahn');

    let simT = 0, drops = [], logoF = null, logoKey = '', perm = null, permSeed = -1;

    const app = Atelier.app({
      stage: canvas,
      animate: true,
      seed: true,
      finish: { grain: 0.06, vignette: 0.1 },
      hint: 'Glissez pour déposer de l\'encre · molette : quantité d\'encre',
      notes: 'Une goutte d\'encre, une feuille pliée en deux, on appuie, on rouvre : la tache est parfaitement symétrique et l\'œil y voit aussitôt des papillons, des visages, des bêtes. Le poète Justinus Kerner en faisait des poèmes dès 1857 ; en 1921, le psychiatre Hermann Rorschach en tire dix planches restées célèbres. Les surréalistes, avec la décalcomanie d\'Óscar Domínguez, en firent une façon de laisser le hasard dessiner. Ici l\'encre est un relief de bruit qui évolue lentement, toujours replié sur l\'axe vertical ; chaque niveau du relief devient un aplat, comme les couches d\'encre qui se superposent. Déposez des gouttes au doigt : elles apparaissent aussitôt de l\'autre côté du pli.',
      params: {
        'Encre': {
          quantite: { type: 'range', label: 'Quantité d\'encre', min: -0.6, max: 0.6, step: 0.01, value: 0 },
          niveaux: { type: 'range', label: 'Couches', min: 1, max: 6, step: 1, value: 3 },
          ecart: { type: 'range', label: 'Écart entre couches', min: 0.02, max: 0.3, step: 0.005, value: 0.1 },
          echelle: { type: 'range', label: 'Échelle des formes', min: 0.4, max: 3, step: 0.01, value: 1.2 },
          detail: { type: 'range', label: 'Détail du bord', min: 1, max: 6, step: 1, value: 4 },
          etalement: { type: 'range', label: 'Étalement', min: 0.2, max: 1.2, step: 0.01, value: 0.62 },
          pli: { type: 'segmented', label: 'Pliage', options: { simple: 'En deux', double: 'En quatre', aucun: 'Aucun' }, value: 'simple' },
        },
        'Mouvement': {
          vitesse: { type: 'range', label: 'Vitesse', min: 0, max: 2, step: 0.01, value: 0.35 },
          respiration: { type: 'range', label: 'Respiration', min: 0, max: 1, step: 0.01, value: 0.3 },
        },
        'Éclaboussures': {
          gouttes: { type: 'range', label: 'Gouttes', min: 0, max: 80, step: 1, value: 22 },
          tailleGouttes: { type: 'range', label: 'Taille', min: 0.2, max: 2, step: 0.01, value: 1, show: (q) => q.gouttes > 0 },
        },
        'Logo à l\'encre': {
          logo: { type: 'toggle', label: 'Le logo est imprimé dans l\'encre', value: false },
          poidsLogo: { type: 'range', label: 'Poids du logo', min: 0.1, max: 1.5, step: 0.01, value: 0.7, show: (q) => q.logo },
          tailleLogo: { type: 'range', label: 'Taille du logo', min: 0.2, max: 1.4, step: 0.01, value: 0.6, show: (q) => q.logo },
          image: { type: 'file', label: 'Logo', accept: 'image/*', show: (q) => q.logo },
        },
        'Couleurs': {
          fond: { type: 'color', label: 'Papier', value: '#f1ece1' },
          couleurs: { type: 'palette', label: 'Couches, du bord au cœur', value: ['#3a3a44', '#1f1f27', '#0b0b10'] },
          contour: { type: 'toggle', label: 'Liseré', value: false },
          trait: { type: 'color', label: 'Couleur du liseré', value: '#0b0b10', show: (q) => q.contour },
        },
      },
      presets: {
        'Planche I': {},
        'Couleurs': { couleurs: ['#ef5a2f', '#f272ba', '#1b1b1f'], niveaux: 3, ecart: 0.12, gouttes: 30 },
        'Papillon': { etalement: 0.72, echelle: 0.8, quantite: 0.03, detail: 5, gouttes: 12, couleurs: ['#1b1b1f'], niveaux: 1 },
        'En quatre': { pli: 'double', echelle: 1.6, niveaux: 4, couleurs: ['#c9d6f2', '#486cfc', '#2c3566', '#0b0c12'], quantite: 0.05 },
        'Liseré': { contour: true, niveaux: 5, ecart: 0.06, couleurs: ['#f1ece1'], trait: '#1b1b1f', gouttes: 0 },
        'Aquarelle': { couleurs: ['#cfe0f2', '#9fbfe6', '#6c8fd0', '#486cfc'], niveaux: 4, ecart: 0.05, detail: 6, respiration: 0.5 },
        'Logo': { logo: true, poidsLogo: 0.6, tailleLogo: 0.55, couleurs: ['#ef5a2f', '#1b1b1f'], niveaux: 2, ecart: 0.16, quantite: -0.05 },
        'Biennale': { fond: BIEN[0], couleurs: [BIEN[3], BIEN[2], BIEN[1]], niveaux: 3 },
        'Menthe': { fond: MEN[1], couleurs: [MEN[2], MEN[0]], niveaux: 2, pli: 'double' },
        'Kegelbahn': { fond: KB[0], couleurs: [KB[2], KB[1]], niveaux: 2, contour: true, trait: KB[2], gouttes: 40 },
      },
      brand(colors) {
        const s = colors.slice().sort((a, b) => lum(a) - lum(b)), L = s[s.length - 1];
        return { fond: L, couleurs: s.length > 1 ? s.slice(0, -1).reverse() : ['#000000'], trait: s[0] };
      },
      pointer: {
        down: (q) => addDrop(q.x, q.y),
        drag: (q) => { const l = drops[drops.length - 1]; if (!l || Math.hypot(q.x - l.sx, q.y - l.sy) > 14) addDrop(q.x, q.y); },
        wheel: (q, dy) => app.set('quantite', Math.max(-0.6, Math.min(0.6, +(p.quantite + (dy > 0 ? -0.03 : 0.03)).toFixed(2)))),
      },
      onChange(k) { if (['*', 'logo', 'image'].includes(k)) logoKey = ''; if (k === '*') drops = []; },
      export: { name: 'rorschach', svg: () => toSVG() },
    });
    const p = app.params;

    function hex(x) { const n = parseInt(x.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
    function lum(x) { const c = hex(x); return (c[0] * 0.299 + c[1] * 0.587 + c[2] * 0.114) / 255; }

    // ——— Bruit de gradient 3D (Perlin amélioré) ———
    function buildPerm() {
      const R = app.rng(), a = [...Array(256).keys()]; for (let i = 255; i > 0; i--) { const j = Math.floor(R() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
      perm = new Uint8Array(512); for (let i = 0; i < 512; i++) perm[i] = a[i & 255];
    }
    const fade = (t) => t * t * t * (t * (t * 6 - 15) + 10), lerp = (a, b, t) => a + (b - a) * t;
    function grad(h, x, y, z) { const u = h < 8 ? x : y, v = h < 4 ? y : (h === 12 || h === 14 ? x : z); return ((h & 1) ? -u : u) + ((h & 2) ? -v : v); }
    function noise(x, y, z) {
      const X = Math.floor(x) & 255, Y = Math.floor(y) & 255, Z = Math.floor(z) & 255; x -= Math.floor(x); y -= Math.floor(y); z -= Math.floor(z);
      const u = fade(x), v = fade(y), w = fade(z), P = perm, A = P[X] + Y, AA = P[A] + Z, AB = P[A + 1] + Z, B = P[X + 1] + Y, BA = P[B] + Z, BB = P[B + 1] + Z;
      return lerp(lerp(lerp(grad(P[AA] & 15, x, y, z), grad(P[BA] & 15, x - 1, y, z), u), lerp(grad(P[AB] & 15, x, y - 1, z), grad(P[BB] & 15, x - 1, y - 1, z), u), v),
        lerp(lerp(grad(P[AA + 1] & 15, x, y, z - 1), grad(P[BA + 1] & 15, x - 1, y, z - 1), u), lerp(grad(P[AB + 1] & 15, x, y - 1, z - 1), grad(P[BB + 1] & 15, x - 1, y - 1, z - 1), u), v), w);
    }

    // ——— Logo flouté ———
    function buildLogo() {
      const img0 = p.image || app.logoImg, key = [p.logo, img0 ? (img0.src || 'c') : 'demo'].join(); if (key === logoKey) return; logoKey = key;
      logoF = null; if (!p.logo) return;
      const M = 96, c = document.createElement('canvas'); c.width = c.height = M; const x = c.getContext('2d', { willReadFrequently: true }), L = M * 0.8, cx = M / 2;
      if (img0) { const iw = img0.naturalWidth || img0.width, ih = img0.naturalHeight || img0.height, s = L / Math.max(iw, ih); x.drawImage(img0, cx - iw * s / 2, cx - ih * s / 2, iw * s, ih * s); }
      else { x.fillStyle = '#000'; x.beginPath(); x.arc(cx, cx, L * 0.48, 0, TAU); x.arc(cx, cx, L * 0.27, 0, TAU, true); x.fill('evenodd'); x.fillRect(cx - L * 0.07, cx - L * 0.5, L * 0.14, L); }
      const d = x.getImageData(0, 0, M, M).data; let transp = 0; for (let i = 3; i < d.length; i += 4) if (d[i] < 128) transp++; const useA = transp > M * M * 0.05;
      let f = new Float32Array(M * M); for (let i = 0; i < M * M; i++) { const o = i * 4, l = (d[o] * 0.2126 + d[o + 1] * 0.7152 + d[o + 2] * 0.0722) / 255; f[i] = (useA ? d[o + 3] > 128 : d[o + 3] > 128 && l < 0.5) ? 1 : 0; }
      // deux passes de flou en boîte : le logo boit dans le papier
      for (let pass = 0; pass < 2; pass++) {
        const g = new Float32Array(M * M);
        for (let j = 0; j < M; j++) for (let i = 0; i < M; i++) { let s = 0, n = 0; for (let dj = -1; dj <= 1; dj++) for (let di = -1; di <= 1; di++) { const ii = i + di, jj = j + dj; if (ii < 0 || jj < 0 || ii >= M || jj >= M) continue; s += f[jj * M + ii]; n++; } g[j * M + i] = s / n; }
        f = g;
      }
      logoF = { f, M };
    }
    function logoAt(u, v) {
      if (!logoF) return 0; const M = logoF.M, S = p.tailleLogo, x = (u / S * 0.5 + 0.5) * (M - 1), y = (v / S * 0.5 + 0.5) * (M - 1);
      if (x < 0 || y < 0 || x >= M - 1 || y >= M - 1) return 0; const i = Math.floor(x), j = Math.floor(y), fx = x - i, fy = y - j, F = logoF.f, o = j * M + i;
      return (F[o] * (1 - fx) + F[o + 1] * fx) * (1 - fy) + (F[o + M] * (1 - fx) + F[o + M + 1] * fx) * fy;
    }

    function addDrop(X, Y) {
      const { w, h } = app.size, m = Math.min(w, h), u = (X - w / 2) / (m / 2), v = (Y - h / 2) / (m / 2);
      drops.push({ u, v, sx: X, sy: Y, t: simT }); if (drops.length > 60) drops.shift();
    }

    // ——— Champ d'encre ———
    function field(u, v, t) {
      // pliage : la feuille est repliée sur l'axe vertical (et l'horizontal en quatre)
      let x = p.pli === 'aucun' ? u : Math.abs(u), y = p.pli === 'double' ? Math.abs(v) : v;
      const sc = p.echelle * 1.6, z = t * p.vitesse * 0.12; let n = 0, amp = 1, fr = 1, norm = 0;
      // léger gauchissement du domaine : bords d'encre qui « coulent »
      const wx = noise(x * 2.2 + 31.7, y * 2.2 - 8.3, z * 0.7) * 0.22, wy = noise(x * 2.2 - 19.1, y * 2.2 + 5.9, z * 0.7 + 3.3) * 0.22; x += wx; y += wy;
      for (let o = 0; o < p.detail; o++) { n += noise(x * sc * fr + 11.3, y * sc * fr + 4.1, z * fr + o * 7.7) * amp; norm += amp; amp *= 0.5; fr *= 2.03; }
      n /= norm;
      // enveloppe : l'encre se tient près du pli et au milieu de la feuille
      const e = p.etalement, env = Math.exp(-((x * 1.3) ** 2 / (e * e * 1.1) + (y * 0.95) ** 2 / (e * e * 1.6)));
      let f = n * 1.25 + env * 0.62 - 0.38 - (1 - env) * (1 - env) * 0.3 + p.quantite + Math.sin(t * 0.5) * p.respiration * 0.06;
      for (const d of drops) { const age = Math.min(1, (t - d.t) * 2), dx = (p.pli === 'aucun' ? u : Math.abs(u)) - (p.pli === 'aucun' ? d.u : Math.abs(d.u)), dy = (p.pli === 'double' ? Math.abs(v) - Math.abs(d.v) : v - d.v); f += 0.55 * age * Math.exp(-(dx * dx + dy * dy) / (0.006 + 0.012 * age)); }
      if (logoF) f += logoAt(u, v) * p.poidsLogo * 0.9 - (p.poidsLogo * 0.2);
      return f;
    }

    // ——— Couches : marching squares, segments chaînés en boucles ———
    function layers(w, h, t) {
      if (permSeed !== app.seed || !perm) { buildPerm(); permSeed = app.seed; }
      buildLogo();
      const m = Math.min(w, h), GW = Math.round(220 * w / Math.max(w, h)) + 2, GH = Math.round(220 * h / Math.max(w, h)) + 2, sx = w / (GW - 3), sy = h / (GH - 3);
      const F = new Float32Array(GW * GH), sym = p.pli !== 'aucun' && !logoF;
      for (let j = 0; j < GH; j++) for (let i = 0; i < GW; i++) {
        // bord de la grille forcé à « pas d'encre » : toutes les courbes se referment
        if (i === 0 || j === 0 || i === GW - 1 || j === GH - 1) { F[j * GW + i] = -9; continue; }
        // pli vertical sans logo : le champ est symétrique, on ne calcule que la moitié gauche
        if (sym && i > GW - 1 - i) { F[j * GW + i] = F[j * GW + GW - 1 - i]; continue; }
        const X = (i - 1) * sx, Y = (j - 1) * sy; F[j * GW + i] = field((X - w / 2) / (m / 2), (Y - h / 2) / (m / 2), t);
      }
      const out = [];
      for (let k = 0; k < p.niveaux; k++) {
        const lv = k * p.ecart, segs = [], P = (i, j) => [(i - 1) * sx, (j - 1) * sy];
        for (let j = 0; j < GH - 1; j++) for (let i = 0; i < GW - 1; i++) {
          const o = j * GW + i, a = F[o], b = F[o + 1], c = F[o + GW + 1], d = F[o + GW], idx = (a > lv ? 8 : 0) | (b > lv ? 4 : 0) | (c > lv ? 2 : 0) | (d > lv ? 1 : 0);
          if (idx === 0 || idx === 15) continue;
          // identifiants d'arêtes : horizontale (i,j)→ 2·o, verticale (i,j) → 2·o+1
          const T = 2 * o, Bm = 2 * (o + GW), Lf = 2 * o + 1, R = 2 * (o + 1) + 1;
          const e = (ea, eb) => segs.push(ea, eb);
          switch (idx) { case 1: case 14: e(Lf, Bm); break; case 2: case 13: e(Bm, R); break; case 3: case 12: e(Lf, R); break; case 4: case 11: e(T, R); break; case 6: case 9: e(T, Bm); break; case 7: case 8: e(Lf, T); break; case 5: e(Lf, T); e(Bm, R); break; case 10: e(T, R); e(Lf, Bm); break; }
        }
        // position d'une arête : interpolation linéaire du passage au niveau
        const pos = (id) => {
          const o = id >> 1, i = o % GW, j = (o / GW) | 0;
          if ((id & 1) === 0) { const a = F[o], b = F[o + 1], tt = (lv - a) / (b - a); return [(i - 1 + tt) * sx, (j - 1) * sy]; }
          const a = F[o], b = F[o + GW], tt = (lv - a) / (b - a); return [(i - 1) * sx, (j - 1 + tt) * sy];
        };
        const adj = new Map(); for (let s = 0; s < segs.length; s += 2) { for (const [x, y] of [[segs[s], segs[s + 1]], [segs[s + 1], segs[s]]]) { const L = adj.get(x); if (L) L.push(y); else adj.set(x, [y]); } }
        const seen = new Set(), loops = [];
        for (const start of adj.keys()) {
          if (seen.has(start)) continue; const loop = [start]; seen.add(start); let prev = -1, cur = start;
          for (;;) { const L = adj.get(cur); let nx = -1; for (const q of L) if (q !== prev && !seen.has(q)) { nx = q; break; } if (nx < 0) break; seen.add(nx); loop.push(nx); prev = cur; cur = nx; }
          if (loop.length > 2) loops.push(loop.map(pos));
        }
        out.push(loops);
      }
      // éclaboussures : gouttes posées sur les crêtes du bruit, symétriques
      const spl = [], R = app.rng();
      for (let i = 0; i < p.gouttes; i++) {
        const u = (R() * 1.6 - 0.05) * (w / m), v = (R() * 2 - 1) * 0.95, f = field(u, v, t);
        if (f < -0.05 && f > -0.32) { const r = m * 0.006 * p.tailleGouttes * (0.5 + R() * 1.6) * Math.min(1, (f + 0.32) * 5); if (r > 0.6) { spl.push([w / 2 + u * m / 2, h / 2 + v * m / 2, r]); if (p.pli !== 'aucun') spl.push([w / 2 - u * m / 2, h / 2 + v * m / 2, r]); if (p.pli === 'double') { spl.push([w / 2 + u * m / 2, h / 2 - v * m / 2, r]); spl.push([w / 2 - u * m / 2, h / 2 - v * m / 2, r]); } } }
      }
      return { out, spl };
    }
    function layerColor(k) { const C = p.couleurs.length ? p.couleurs : ['#000000']; return C[Math.min(C.length - 1, k)]; }

    app.loop((t, dt) => {
      dt = Math.min(0.1, dt || 0);
      if (!app.thumbnail) simT += dt; else simT = 2.5;
      const { w, h, dpr } = app.size, { out, spl } = layers(w, h, simT);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.fillStyle = p.fond; ctx.fillRect(0, 0, w, h);
      out.forEach((loops, k) => {
        const P2 = new Path2D(); for (const L of loops) { P2.moveTo(L[0][0], L[0][1]); for (let i = 1; i < L.length; i++) P2.lineTo(L[i][0], L[i][1]); P2.closePath(); }
        ctx.fillStyle = layerColor(k); ctx.fill(P2, 'evenodd');
        if (p.contour) { ctx.strokeStyle = p.trait; ctx.lineWidth = 1; ctx.lineJoin = 'round'; ctx.stroke(P2); }
        if (k === 0 && spl.length) { const P3 = new Path2D(); for (const [x, y, r] of spl) { P3.moveTo(x + r, y); P3.arc(x, y, r, 0, TAU); } ctx.fill(P3); if (p.contour) ctx.stroke(P3); }
      });
      app.finish(ctx);
    });

    function toSVG() {
      const { w, h } = app.size, f = (v) => +v.toFixed(1), { out, spl } = layers(w, h, simT);
      let s = `<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><rect width="100%" height="100%" fill="${p.fond}"/>`;
      const st = p.contour ? ` stroke="${p.trait}" stroke-width="1" stroke-linejoin="round"` : '';
      out.forEach((loops, k) => {
        let d = ''; for (const L of loops) d += 'M' + L.map((q) => f(q[0]) + ' ' + f(q[1])).join('L') + 'z';
        if (d) s += `<path d="${d}" fill="${layerColor(k)}" fill-rule="evenodd"${st}/>`;
        if (k === 0) for (const [x, y, r] of spl) s += `<circle cx="${f(x)}" cy="${f(y)}" r="${f(r)}" fill="${layerColor(0)}"${st}/>`;
      });
      return s + '</svg>';
    }
  </script>
</body>
</html>
