<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ressort d’escalier</title>
  <link rel="stylesheet" href="../../assets/ui/atelier.css">
</head>
<body>
  <canvas></canvas>
  <script src="../../assets/ui/atelier.js"></script>
  <script>
    // Ressort d'escalier : un ressort à spires jointives descend un escalier sans fin. Le ressort est découpé
    // en trois parties : la pile posée sur la marche de départ, l'arche, et la pile qui se forme sur la marche
    // d'arrivée. Au début du pas, la spire du haut s'envole sur un arc de Bézier jusqu'à la marche suivante en
    // entraînant l'arche ; puis les spires passent d'une pile à l'autre à travers l'arche. Chaque spire est un
    // anneau perpendiculaire à la courbe : on dessine toutes les moitiés arrière, puis toutes les moitiés avant.
    const canvas = document.querySelector('canvas');
    const ctx = canvas.getContext('2d');
    const TAU = Math.PI * 2;
    const PAL = (k) => Atelier.PALETTES[k].colors;
    const BIE = PAL('biennale'), LUZ = PAL('luzern'), MEN = PAL('menthe');
    const MATS = ['metal', 'arcenciel', 'bicolore'];

    let vKey = '', logoM = null, logoKey = '', ptr = null, S = null, gKey = '', simT = 0, logoP = null, logoPK = '';

    const app = Atelier.app({
      stage: canvas,
      animate: true,
      seed: true,
      finish: { grain: 0.04, vignette: 0.3 },
      hint: 'Glisser ↔ : faire avancer ou reculer le ressort · clic : autre matière · molette : hauteur des marches',
      notes: 'Le jouet qui descend l’escalier tout seul : la spire du haut bascule sur la marche suivante, puis les spires passent une à une à travers l’arche d’une pile à l’autre. L’escalier défile sans fin, ses contremarches portent le logo, et on peut faire avancer ou reculer le ressort à la main.',
      params: {
        'Ressort': {
          spires: { type: 'range', label: 'Spires', min: 24, max: 120, step: 1, value: 70 },
          rayon: { type: 'range', label: 'Rayon', min: 0.4, max: 1.5, step: 0.01, value: 1 },
          fil: { type: 'range', label: 'Épaisseur du fil', min: 0.5, max: 3, step: 0.05, value: 1.4 },
          matiere: { type: 'select', label: 'Matière', options: { metal: 'Métal', arcenciel: 'Arc-en-ciel', bicolore: 'Bicolore' }, value: 'metal' },
          vitesse: { type: 'range', label: 'Pas par seconde', min: 0.1, max: 1.5, step: 0.01, value: 0.45 },
          souplesse: { type: 'range', label: 'Souplesse de l’arche', min: 0.2, max: 1.2, step: 0.01, value: 0.7 },
          image: { type: 'file', label: 'Image du logo', accept: 'image/*' },
        },
        'Escalier': {
          marche: { type: 'range', label: 'Hauteur de marche', min: 0.5, max: 2, step: 0.01, value: 1 },
          giron: { type: 'range', label: 'Profondeur de marche', min: 0.7, max: 2, step: 0.01, value: 1.1 },
          logo: { type: 'toggle', label: 'Logo sur les contremarches', value: true },
          couleurs: { type: 'palette', label: 'Ressort', value: ['#e5452a', '#f2e640', '#5bb08a', '#2f5fd0', '#7d38e7'] },
          escalier: { type: 'color', label: 'Marches', value: '#e9e4da' },
          fond: { type: 'color', label: 'Fond', value: '#c8c1b4' },
        },
      },
      presets: {
        'Métal': {},
        'Arc-en-ciel': { matiere: 'arcenciel', fil: 2.2, rayon: 1.15, spires: 56 },
        'Bicolore': { matiere: 'bicolore', couleurs: ['#e5452a', '#f4f3f0'], fil: 2, escalier: '#16161a', fond: '#0d0d10' },
        'Long ressort': { spires: 116, fil: 0.9, souplesse: 1.1, vitesse: 0.3 },
        'Court et vif': { spires: 32, vitesse: 1.1, marche: 0.7, giron: 0.8 },
        'Grandes marches': { marche: 1.8, giron: 1.6, souplesse: 1, vitesse: 0.35 },
        'Nuit': { fond: '#111318', escalier: '#2a2d36', matiere: 'arcenciel', couleurs: ['#f2b0c8', '#9dd3f0', '#f2e640'] },
        'Lent': { vitesse: 0.15, spires: 80 },
        'Biennale': { matiere: 'bicolore', couleurs: [BIE[2], BIE[3], BIE[4]], escalier: BIE[0], fond: BIE[1] },
        'Luzern': { matiere: 'arcenciel', couleurs: [LUZ[0], LUZ[1], LUZ[2]], escalier: LUZ[4], fond: LUZ[3] },
        'Menthe': { matiere: 'bicolore', couleurs: [MEN[2], MEN[3]], escalier: MEN[0], fond: MEN[1] },
      },
      brand(colors) {
        const s = colors.slice().sort((a, b) => lum(a) - lum(b)), D = s[0], L = s[s.length - 1], mid = s.length > 2 ? s.slice(0, -1) : [D];
        return { couleurs: mid, escalier: L, fond: mix(D, L, 0.55), matiere: 'bicolore' };
      },
      pointer: {
        down: (q) => { ptr = { x: q.x, y: q.y, moved: 0, lx: q.x }; if (S) S.grab = true; },
        drag: (q) => { if (!ptr || !S) return; ptr.moved = Math.max(ptr.moved, Math.hypot(q.x - ptr.x, q.y - ptr.y)); if (ptr.moved > 6) { S.u += (q.x - ptr.lx) / (S.sw * 1.6); } ptr.lx = q.x; },
        up: () => { if (!S) return; S.grab = false; if (ptr && ptr.moved <= 6) { const i = MATS.indexOf(p.matiere); app.set('matiere', MATS[(i + 1) % MATS.length]); } ptr = null; },
        wheel: (q, dy) => app.set('marche', Math.max(0.5, Math.min(2, +(p.marche + (dy > 0 ? -0.1 : 0.1)).toFixed(2)))),
      },
      onChange(k) { if (['*', 'image'].includes(k)) logoKey = ''; },
      export: { name: 'ressort-escalier', svg: () => toSVG() },
    });
    const p = app.params;

    function hex(x) { const n = parseInt(x.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
    function lum(x) { const c = hex(x); return (c[0] * 0.299 + c[1] * 0.587 + c[2] * 0.114) / 255; }
    function mix(a, b, t) { const A = hex(a), C = hex(b); return '#' + A.map((v, i) => Math.round(v + (C[i] - v) * t).toString(16).padStart(2, '0')).join(''); }
    function rgba(c, a) { const h = hex(c); return `rgba(${h[0]},${h[1]},${h[2]},${a})`; }
    const sstep = (x) => { x = Math.max(0, Math.min(1, x)); return x * x * (3 - 2 * x); };
    const col = (i) => { const c = p.couleurs; return c.length ? c[((i % c.length) + c.length) % c.length] : '#e5452a'; };

    function buildLogo() {
      const img0 = p.image || app.logoImg, key = img0 ? (img0.src || 'c') : 'demo'; if (key === logoKey) return; logoKey = key; vKey = '';
      const M = 200, c = document.createElement('canvas'); c.width = c.height = M; const x = c.getContext('2d', { willReadFrequently: true }), L = M * 0.94, cx = M / 2;
      if (img0) { const iw = img0.naturalWidth || img0.width, ih = img0.naturalHeight || img0.height, s = L / Math.max(iw, ih); x.drawImage(img0, cx - iw * s / 2, cx - ih * s / 2, iw * s, ih * s); }
      else { x.fillStyle = '#000'; x.beginPath(); x.arc(cx, cx, L * 0.48, 0, TAU); x.arc(cx, cx, L * 0.27, 0, TAU, true); x.fill('evenodd'); x.fillRect(cx - L * 0.07, cx - L * 0.5, L * 0.14, L); }
      const d = x.getImageData(0, 0, M, M).data; let transp = 0; for (let i = 3; i < d.length; i += 4) if (d[i] < 128) transp++; const useA = transp > M * M * 0.05;
      const F = new Float64Array(M * M); for (let i = 0; i < M * M; i++) { const o = i * 4, l = (d[o] * 0.2126 + d[o + 1] * 0.7152 + d[o + 2] * 0.0722) / 255; F[i] = useA ? d[o + 3] / 255 : (d[o + 3] / 255) * Math.min(1, Math.max(0, (0.75 - l) * 2)); }
      { const G2 = new Float64Array(M * M); for (let j = 1; j < M - 1; j++) for (let i = 1; i < M - 1; i++) { let a = 0; for (let b = -1; b <= 1; b++) for (let c = -1; c <= 1; c++) a += F[(j + b) * M + i + c] * (b || c ? (b && c ? 1 : 2) : 4); G2[j * M + i] = a / 16; } F.set(G2); }
      for (let k = 0; k < M; k++) F[k] = F[(M - 1) * M + k] = F[k * M] = F[k * M + M - 1] = 0;
      logoM = contours(F, M, M, 0.5, 0, 0, 1).filter((c) => c.closed && c.pts.length > 6).map((c) => chaikin(chaikin(c.pts, true), true).map((q) => [q[0] / M - 0.5, q[1] / M - 0.5]));
    }
    // carrés marchants + chaînage
    function contours(F, nx, ny, lev, ox, oy, cs) {
      const pt = new Map(), adj = new Map();
      const P = (id) => { let q = pt.get(id); if (q) return q; const cell = id >> 1, i = cell % nx, j = (cell - i) / nx; let a, b, ax, ay, bx, by; if (id & 1) { a = F[j * nx + i]; b = F[(j + 1) * nx + i]; ax = bx = i; ay = j; by = j + 1; } else { a = F[j * nx + i]; b = F[j * nx + i + 1]; ay = by = j; ax = i; bx = i + 1; } const t = (lev - a) / (b - a || 1e-9); q = [ox + (ax + (bx - ax) * t) * cs, oy + (ay + (by - ay) * t) * cs]; pt.set(id, q); return q; };
      const link = (a, b) => { (adj.get(a) || adj.set(a, []).get(a)).push(b); (adj.get(b) || adj.set(b, []).get(b)).push(a); };
      for (let j = 0; j < ny - 1; j++) for (let i = 0; i < nx - 1; i++) {
        const A = F[j * nx + i] > lev, B = F[j * nx + i + 1] > lev, C = F[(j + 1) * nx + i + 1] > lev, D = F[(j + 1) * nx + i] > lev, idx = A | (B << 1) | (C << 2) | (D << 3);
        if (idx === 0 || idx === 15) continue;
        const T = (j * nx + i) * 2, R = (j * nx + i + 1) * 2 + 1, Bo = ((j + 1) * nx + i) * 2, Le = (j * nx + i) * 2 + 1;
        const ctr = (F[j * nx + i] + F[j * nx + i + 1] + F[(j + 1) * nx + i + 1] + F[(j + 1) * nx + i]) / 4 > lev;
        switch (idx) {
          case 1: case 14: link(Le, T); break; case 2: case 13: link(T, R); break; case 3: case 12: link(Le, R); break;
          case 4: case 11: link(R, Bo); break; case 6: case 9: link(T, Bo); break; case 7: case 8: link(Le, Bo); break;
          case 5: if (ctr) { link(Le, Bo); link(T, R); } else { link(Le, T); link(R, Bo); } break;
          case 10: if (ctr) { link(Le, T); link(R, Bo); } else { link(Le, Bo); link(T, R); } break;
        }
      }
      const seen = new Set(), out = [];
      const walk = (s) => { const L = [s]; seen.add(s); let cur = s; for (;;) { const nb = (adj.get(cur) || []).find((x) => !seen.has(x)); if (nb === undefined) break; seen.add(nb); L.push(nb); cur = nb; } return L; };
      for (const [id, nb] of adj) if (nb.length === 1 && !seen.has(id)) out.push({ pts: walk(id).map(P), closed: false });
      for (const [id] of adj) if (!seen.has(id)) out.push({ pts: walk(id).map(P), closed: true });
      return out;
    }
    function chaikin(pts, closed) {
      const o = []; const n = pts.length; for (let k = 0; k < (closed ? n : n - 1); k++) { const a = pts[k], b = pts[(k + 1) % n]; o.push([a[0] * 0.75 + b[0] * 0.25, a[1] * 0.75 + b[1] * 0.25], [a[0] * 0.25 + b[0] * 0.75, a[1] * 0.25 + b[1] * 0.75]); }
      if (!closed) { o.unshift(pts[0]); o.push(pts[n - 1]); } return o;
    }

    function logoPath() {
      if (!logoM) return null; if (logoP && logoPK === logoKey) return logoP; logoPK = logoKey; logoP = new Path2D();
      for (const L of logoM) { logoP.moveTo(L[0][0], L[0][1]); for (let k = 1; k < L.length; k++) logoP.lineTo(L[k][0], L[k][1]); logoP.closePath(); }
      return logoP;
    }
    function build(w, h) {
      const u0 = Math.min(w, h) / 7.2;
      S = { w, h, u0, u: S ? S.u : 0, grab: false };
      geo();
    }
    function geo() { const u0 = S.u0; S.sh = u0 * 0.9 * p.marche; S.sw = u0 * 2.2 * p.giron; S.r = u0 * 0.55 * p.rayon; S.dz = S.r * 1.9 / Math.max(70, Math.round(p.spires)); S.lw = Math.max(0.7, S.r * 0.028 * p.fil); }
    // marche n : coin supérieur avant (x, y) en coordonnées monde (y vers le bas)
    const stepPt = (n) => [n * S.sw, n * S.sh];
    const bez = (a, b, c, d, t) => { const m = 1 - t; return [m * m * m * a[0] + 3 * m * m * t * b[0] + 3 * m * t * t * c[0] + t * t * t * d[0], m * m * m * a[1] + 3 * m * m * t * b[1] + 3 * m * t * t * c[1] + t * t * t * d[1]]; };

    // ——— état du ressort pour la phase u ∈ [0,1) du pas n ———
    // renvoie une liste de spires {x, y, ax, ay} : centre et direction de l'axe de l'anneau (tangente)
    function coils(n, u) {
      const N = Math.round(p.spires), { r, dz } = S, xa = n * S.sw + S.sw * 0.5, ya = n * S.sh, xb = xa + S.sw, yb = ya + S.sh;
      const lift = 0.32, fA = u < lift ? 0 : sstep((u - lift) / (1 - lift)), h = u < lift ? 0.45 * sstep(u / lift) : 0.45 + 0.55 * fA, g = fA;
      const nA = Math.round(N * (1 - h)), nB = Math.round(N * g), nArch = Math.max(0, N - nA - nB);
      const out = [];
      for (let i = 0; i < nA; i++) out.push({ x: xa, y: ya - (i + 0.5) * dz, ax: 0, ay: -1, i });
      const topA = [xa, ya - nA * dz];
      let end, tEnd;
      const H = Math.max(S.sw, S.sh) * 0.9 * p.souplesse + r;
      if (u < lift) {
        // la spire de tête vole sur un arc de la pile A à la marche B
        const s = sstep(u / lift), Q0 = [xa, ya - N * dz], Q1 = [xa, ya - N * dz - H], Q2 = [xb, yb - H * 0.6], Q3 = [xb, yb];
        end = bez(Q0, Q1, Q2, Q3, s); const e2 = bez(Q0, Q1, Q2, Q3, Math.min(1, s + 0.01)), e1 = bez(Q0, Q1, Q2, Q3, Math.max(0, s - 0.01)); tEnd = [e2[0] - e1[0], e2[1] - e1[1]];
      } else { end = [xb, yb - nB * dz]; tEnd = [0, 1]; }
      const tl = Math.hypot(tEnd[0], tEnd[1]) || 1; tEnd = [tEnd[0] / tl, tEnd[1] / tl];
      if (nArch > 0) {
        const d = Math.hypot(end[0] - topA[0], end[1] - topA[1]), k = Math.max(r * 0.8, Math.min(H, d * 0.75)) * p.souplesse;
        const P0 = topA, P1 = [topA[0], topA[1] - k], P2 = [end[0] - tEnd[0] * k, end[1] - tEnd[1] * k], P3 = end;
        // échantillonnage à abscisse curviligne constante
        const M = 80, pts = [], len = [0]; for (let j = 0; j <= M; j++) pts.push(bez(P0, P1, P2, P3, j / M)); for (let j = 1; j <= M; j++) len.push(len[j - 1] + Math.hypot(pts[j][0] - pts[j - 1][0], pts[j][1] - pts[j - 1][1]));
        const L = len[M];
        for (let i = 0; i < nArch; i++) {
          const target = (i + 0.5) / nArch * L; let j = 1; while (j < M && len[j] < target) j++; const f = (target - len[j - 1]) / (len[j] - len[j - 1] || 1);
          const x = pts[j - 1][0] + (pts[j][0] - pts[j - 1][0]) * f, y = pts[j - 1][1] + (pts[j][1] - pts[j - 1][1]) * f, tx = pts[j][0] - pts[j - 1][0], ty = pts[j][1] - pts[j - 1][1], tn = Math.hypot(tx, ty) || 1;
          out.push({ x, y, ax: ty > 0 ? -tx / tn : tx / tn, ay: ty > 0 ? -ty / tn : ty / tn, i: nA + i });
        }
      }
      for (let i = 0; i < nB; i++) out.push({ x: xb, y: yb - (nB - i - 0.5) * dz, ax: 0, ay: -1, i: nA + nArch + i });
      return out;
    }
    function coilCol(i, N) {
      if (p.matiere === 'arcenciel') { const c = p.couleurs.length ? p.couleurs : ['#e5452a']; const t = i / Math.max(1, N - 1) * (c.length - 1), a = Math.floor(t); return mix(c[Math.min(a, c.length - 1)], c[Math.min(a + 1, c.length - 1)], t - a); }
      if (p.matiere === 'bicolore') return col(Math.floor(i / Math.max(1, Math.round(N / 10))));
      return '#9ea4ae';
    }

    // ——— dessin ———
    function stairs(x, n0, n1, toWorld) {
      const { sw, sh } = S, L = lum(p.escalier), riser = mix(p.escalier, '#000000', 0.16), tread = p.escalier, edge = mix(p.escalier, '#000000', 0.32);
      for (let n = n0; n <= n1; n++) {
        const xa = n * sw, ya = n * sh, td = Math.min(sh * 0.35, sw * 0.18);
        // flanc de la marche (vu de côté), dessus en léger raccourci, nez de marche
        x.fillStyle = riser; x.fillRect(xa, ya, sw + 0.5, S.h * 3);
        x.fillStyle = tread; x.beginPath(); x.moveTo(xa, ya); x.lineTo(xa + sw, ya); x.lineTo(xa + sw + td * 0.6, ya - td); x.lineTo(xa + td * 0.6, ya - td); x.closePath(); x.fill();
        x.fillStyle = edge; x.fillRect(xa, ya, sw, Math.max(1.5, sh * 0.06));
        x.fillStyle = rgba('#000000', 0.12); x.fillRect(xa + sw - Math.max(1, sw * 0.02), ya, Math.max(1, sw * 0.02), sh);
        if (p.logo) { const lp = logoPath(); if (lp) { const s = Math.min(sw, sh) * 0.62; x.save(); x.translate(xa + sw * 0.5, ya + sh * 0.55); x.scale(s, s); x.fillStyle = mix(riser, L > 0.5 ? '#000000' : '#ffffff', 0.2); x.fill(lp, 'evenodd'); x.restore(); } }
      }
    }
    function spring(x, C) {
      const { r } = S, N = Math.round(p.spires), lw = S.lw, tilt = 0.34;
      const q = p.matiere === 'arcenciel' ? Math.max(1, Math.round(N / 48)) : 1, cOf = (i) => coilCol(Math.floor(i / q) * q, N);
      // anneau : grand axe perpendiculaire à l'axe de la spire, petit axe le long de l'axe (vue un peu plongeante)
      // les spires consécutives de même couleur partagent un seul tracé
      const pass = (colOf, a0, a1) => {
        let cur = null, path = null; const flush = () => { if (path) { x.strokeStyle = cur; x.stroke(path); } };
        for (const c of C) { const cc = colOf(c.i); if (cc !== cur) { flush(); cur = cc; path = new Path2D(); } const ang = Math.atan2(c.ay, c.ax) + Math.PI / 2; const ca = Math.cos(ang), sa = Math.sin(ang), ex = r * Math.cos(a0), ey = r * tilt * Math.sin(a0); path.moveTo(c.x + ca * ex - sa * ey, c.y + sa * ex + ca * ey); path.ellipse(c.x, c.y, r, r * tilt, ang, a0, a1); }
        flush();
      };
      x.lineCap = 'round'; x.lineWidth = lw;
      // moitiés arrière, plus sombres
      pass(p.matiere === 'metal' ? () => '#555a64' : (i) => mix(cOf(i), '#000000', 0.4), Math.PI, TAU);
      pass(cOf, 0, Math.PI);
      if (p.matiere === 'metal') { x.lineWidth = lw * 0.45; pass(() => 'rgba(255,255,255,0.7)', 0.55, 1.25); }
    }
    function view() {
      // la caméra suit le ressort en douceur, de marche en marche
      const n = Math.floor(S.u), f = S.u - n, s = sstep(f), cx = (n + s + 0.5) * S.sw + S.sw * 0.5, cy = (n + s) * S.sh;
      return { n, f, ox: S.w * 0.45 - cx, oy: S.h * 0.62 - cy };
    }

    app.loop((t, dt) => {
      dt = Math.min(1 / 20, dt || 0);
      const { w, h, dpr } = app.size; buildLogo();
      const key = [w, h, app.seed].join('|'); if (!S || key !== gKey) { gKey = key; build(w, h); }
      geo();
      if (app.thumbnail) S.u = 0.55;
      else if (!S.grab) S.u += dt * p.vitesse;
      simT += dt;
      const V = view();
      ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.fillStyle = p.fond; ctx.fillRect(0, 0, canvas.width, canvas.height); ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      const g = ctx.createRadialGradient(w * 0.45, h * 0.35, 0, w * 0.45, h * 0.35, Math.max(w, h) * 0.8); g.addColorStop(0, rgba(mix(p.fond, '#ffffff', 0.25), 0.6)); g.addColorStop(1, rgba(p.fond, 0)); ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
      ctx.save(); ctx.translate(V.ox, V.oy);
      const nn = Math.ceil(w / S.sw) + 3; stairs(ctx, V.n - nn, V.n + nn);
      // ombre portée douce sous le ressort
      const C = coils(V.n, V.f);
      ctx.fillStyle = rgba('#000000', 0.12); for (const yy of [[V.n, 0], [V.n + 1, 1]]) { const xa = yy[0] * S.sw + S.sw * 0.5, ya = yy[0] * S.sh; ctx.beginPath(); ctx.ellipse(xa + S.r * 0.3, ya + 1, S.r * 1.2, S.r * 0.18, 0, 0, TAU); ctx.fill(); }
      spring(ctx, C);
      ctx.restore();
      app.finish(ctx);
    });

    // ——— SVG ———
    function toSVG() {
      const { w, h } = app.size, f = (v) => +v.toFixed(2), V = view(), { sw, sh, r } = S, N = Math.round(p.spires), tilt = 0.34, lw = S.lw;
      let o = `<rect width="100%" height="100%" fill="${p.fond}"/><g transform="translate(${f(V.ox)} ${f(V.oy)})">`;
      const riser = mix(p.escalier, '#000000', 0.16), nn = Math.ceil(w / sw) + 3;
      let lp = ''; if (logoM) for (const L of logoM) { const st = Math.max(1, Math.floor(L.length / 120)); lp += 'M' + f(L[0][0] * 100) + ' ' + f(L[0][1] * 100); for (let k = st; k < L.length; k += st) lp += 'L' + f(L[k][0] * 100) + ' ' + f(L[k][1] * 100); lp += 'Z'; }
      for (let n = V.n - nn; n <= V.n + nn; n++) { const xa = n * sw, ya = n * sh, td = Math.min(sh * 0.35, sw * 0.18); o += `<rect x="${f(xa)}" y="${f(ya)}" width="${f(sw + 0.5)}" height="${f(h * 3)}" fill="${riser}"/><path d="M${f(xa)} ${f(ya)}L${f(xa + sw)} ${f(ya)}L${f(xa + sw + td * 0.6)} ${f(ya - td)}L${f(xa + td * 0.6)} ${f(ya - td)}Z" fill="${p.escalier}"/>`; if (p.logo && lp) { const s = Math.min(sw, sh) * 0.62; o += `<path d="${lp}" transform="translate(${f(xa + sw * 0.5)} ${f(ya + sh * 0.55)}) scale(${f(s / 100)})" fill="${mix(riser, lum(p.escalier) > 0.5 ? '#000000' : '#ffffff', 0.2)}" fill-rule="evenodd"/>`; } }
      const C = coils(V.n, V.f), arc = (c, a0, a1) => { const ang = Math.atan2(c.ay, c.ax) + Math.PI / 2, ca = Math.cos(ang), sa = Math.sin(ang), pt = (t) => { const ex = r * Math.cos(t), ey = r * tilt * Math.sin(t); return [c.x + ex * ca - ey * sa, c.y + ex * sa + ey * ca]; }; const A = pt(a0), B = pt(a1); return `M${f(A[0])} ${f(A[1])}A${f(r)} ${f(r * tilt)} ${f(ang * 180 / Math.PI)} 0 1 ${f(B[0])} ${f(B[1])}`; };
      for (const c of C) o += `<path d="${arc(c, Math.PI, TAU - 1e-3)}" fill="none" stroke="${p.matiere === 'metal' ? '#555a64' : mix(coilCol(c.i, N), '#000000', 0.4)}" stroke-width="${f(lw)}" stroke-linecap="round"/>`;
      for (const c of C) o += `<path d="${arc(c, 0, Math.PI - 1e-3)}" fill="none" stroke="${coilCol(c.i, N)}" stroke-width="${f(lw)}" stroke-linecap="round"/>`;
      o += '</g>';
      return `<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">${o}</svg>`;
    }
  </script>
</body>
