<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sable</title>
  <link rel="stylesheet" href="../../assets/ui/atelier.css">
</head>
<body>
  <canvas></canvas>
  <script src="../../assets/ui/atelier.js"></script>
  <script>
    // Sable : automate de grains. Chaque grain tombe s'il le peut, sinon glisse en diagonale,
    // sinon s'étale un peu selon la fluidité. Des sources versent des couleurs qui changent
    // avec le temps et forment des strates ; un sablier se retourne quand il est vide.
    const canvas = document.querySelector('canvas');
    const ctx = canvas.getContext('2d');
    const TAU = Math.PI * 2;
    const PAL = (k) => Atelier.PALETTES[k].colors;
    const P60 = PAL('papier-60'), BIEN = PAL('biennale'), MENTHE = PAL('menthe'), KB = PAL('kegelbahn'), GR = PAL('good-room'), THER = PAL('thermique');
    const NUIT = PAL('trame-nuit'), LUZ = PAL('luzern'), SALON = PAL('salon'), PYR = PAL('pyramides'), EVT = PAL('eventail'), BITMAP = PAL('bitmap');
    const WALL = 255;

    let gw = 0, gh = 0, cs = 0, ox = 0, oy = 0, cell = null, shade = null, stamp = null, frameId = 1, img = null, off = null, offCtx = null;
    let lastFill = 0, hover = null, drag = null, draining = false, flip = 0, flipping = false, emptyT = 0, maskCache = null, maskKey = null, lut = null, lutKey = '';

    const app = Atelier.app({
      stage: canvas,
      animate: true,
      seed: true,
      finish: { taille: 0.02, vignette: 0 },
      hint: 'Le pointeur verse du sable · glissez pour creuser · touchez pour faire jaillir les grains · molette : débit',
      notes: 'Un grain tombe, sinon glisse en diagonale, sinon s’étale selon la fluidité. Les couleurs des sources changent à intervalles réguliers : les couches se lisent comme des strates.',
      params: {
        'Scène': {
          scene: { type: 'select', label: 'Scène', options: { strates: 'Bocal à strates', sablier: 'Sablier', chicanes: 'Planche à clous', logo: 'Sur le logo' }, value: 'strates' },
          image: { type: 'file', label: 'Logo', accept: 'image/*', show: (q) => q.scene === 'logo' },
          taille: { type: 'range', label: 'Taille des grains (px)', min: 2, max: 12, step: 1, value: 4 },
        },
        'Sable': {
          debit: { type: 'range', label: 'Débit', min: 0, max: 40, step: 1, value: 16 },
          sources: { type: 'range', label: 'Sources', min: 1, max: 6, step: 1, value: 3 },
          balayage: { type: 'range', label: 'Balayage des sources', min: 0, max: 1, step: 0.01, value: 0.45 },
          periode: { type: 'range', label: 'Changement de couleur (s)', min: 0.5, max: 10, step: 0.5, value: 2.5 },
          fluidite: { type: 'range', label: 'Fluidité', min: 0, max: 1, step: 0.01, value: 0.08 },
          vitesse: { type: 'range', label: 'Vitesse de chute', min: 1, max: 4, step: 1, value: 2 },
          vidange: { type: 'toggle', label: 'Vider quand c’est plein', value: true },
        },
        'Couleur': {
          fond: { type: 'color', label: 'Fond', value: P60[0] },
          murs: { type: 'color', label: 'Parois', value: P60[1] },
          couleurs: { type: 'palette', label: 'Couleurs des grains', value: [BIEN[2], BIEN[3], BIEN[4], BIEN[1]] },
          nuance: { type: 'range', label: 'Nuance des grains', min: 0, max: 0.5, step: 0.01, value: 0.14 },
        },
      },
      presets: {
        'Strates': {},
        'Sablier': { scene: 'sablier', taille: 4, fond: NUIT[0], murs: NUIT[2], couleurs: [GR[2], GR[1], GR[3], GR[4]], nuance: 0.12, vitesse: 2 },
        'Clous': { scene: 'chicanes', taille: 4, fond: '#e9e4d6', murs: EVT[0], couleurs: [EVT[3], EVT[1], EVT[2], EVT[4]], sources: 1, balayage: 0.05, debit: 12, periode: 1.5 },
        'Logo': { scene: 'logo', taille: 3, fond: P60[0], murs: P60[1], couleurs: ['#e5452a', '#f2b0c8', '#f2e640'], sources: 4, debit: 14 },
        'Désert': { taille: 3, fond: '#f2e4cf', murs: '#3b2a10', couleurs: ['#d9a25f', '#c47a3a', '#e8c89a', '#8f4f2a', '#f0dcb8'], nuance: 0.2, sources: 4, periode: 3.5, fluidite: 0.03 },
        'Menthe': { taille: 5, fond: MENTHE[0], murs: MENTHE[1], couleurs: [MENTHE[3], MENTHE[2], MENTHE[1]], sources: 2, balayage: 0.8, periode: 2 },
        'Thermique': { scene: 'chicanes', taille: 3, fond: THER[0], murs: THER[1], couleurs: [THER[2], THER[3], THER[4], THER[5]], sources: 3, debit: 16 },
        'Kegelbahn': { scene: 'sablier', taille: 5, fond: KB[0], murs: KB[4], couleurs: [KB[1], KB[2], KB[3], KB[5]], nuance: 0.08 },
        'Pixels': { taille: 10, fond: BITMAP[0], murs: BITMAP[1], couleurs: [BITMAP[2], BITMAP[3], BITMAP[4], BITMAP[1]], nuance: 0, sources: 2, debit: 3, periode: 2, vitesse: 1 },
        'Luzern': { scene: 'logo', taille: 4, fond: LUZ[0], murs: LUZ[3], couleurs: [LUZ[4], LUZ[2], LUZ[1]], sources: 3, debit: 10, fluidite: 0.2 },
        'Salon': { taille: 6, fond: SALON[0], murs: SALON[1], couleurs: [SALON[2], SALON[3], SALON[4]], sources: 5, balayage: 0.25, periode: 1.5, nuance: 0.06 },
        'Pyramides': { scene: 'chicanes', taille: 5, fond: PYR[0], murs: PYR[6], couleurs: [PYR[2], PYR[3], PYR[4], PYR[5], PYR[1]], sources: 2, debit: 8 },
      },
      brand(colors) {
        const c = colors.slice(1).length ? colors.slice(1) : ['#111111'];
        const lum = (h) => { const n = parseInt(h.slice(1), 16); return ((n >> 16) & 255) * 0.299 + ((n >> 8) & 255) * 0.587 + (n & 255) * 0.114; };
        const dark = c.slice().sort((a, b) => lum(a) - lum(b))[0];
        return { fond: colors[0], murs: dark, couleurs: (c.length > 1 ? c.filter((x) => x !== dark) : c).slice(0, 7) };
      },
      pointer: {
        move: (q) => { hover = { x: q.x, y: q.y }; },
        down: (q) => { drag = { x: q.x, y: q.y, moved: false }; },
        drag: (q) => {
          hover = { x: q.x, y: q.y };
          if (!drag) return;
          if (Math.hypot(q.x - drag.x, q.y - drag.y) > 6) drag.moved = true;
          if (drag.moved) dig(q.x, q.y);
        },
        up: (q) => { if (drag && !drag.moved) blast(q.x, q.y); drag = null; },
        wheel: (q, dy) => app.set('debit', Math.max(0, Math.min(40, p.debit + (dy > 0 ? -1 : 1)))),
      },
      onChange(k) { if (['scene', 'image', 'taille', '*'].includes(k)) setup(); },
      onSeed() { setup(); },
      export: { name: 'sable', svg: () => toSVG() },
    });
    const p = app.params;
    canvas.addEventListener('pointerleave', () => { hover = null; });

    function logoMask() {
      const img = p.image || app.logoImg, key = img ? (img.src || 'c') : 'demo';
      if (key === maskKey) return maskCache;
      maskKey = key;
      const M = 200, c = document.createElement('canvas'); c.width = c.height = M; const x = c.getContext('2d', { willReadFrequently: true });
      if (img) { const iw = img.naturalWidth || img.width, ih = img.naturalHeight || img.height, k = M * 0.96 / Math.max(iw, ih); x.drawImage(img, (M - iw * k) / 2, (M - ih * k) / 2, iw * k, ih * k); }
      else { x.fillStyle = '#000'; x.beginPath(); x.arc(100, 100, 96, 0, TAU); x.arc(100, 100, 56, 0, TAU, true); x.fill('evenodd'); x.fillRect(88, 4, 24, 192); }
      const d = x.getImageData(0, 0, M, M).data, a = new Uint8Array(M * M);
      let transp = 0; for (let i = 3; i < d.length; i += 16) if (d[i] < 128) transp++;
      const useA = transp > d.length / 16 * 0.05;
      for (let i = 0; i < M * M; i++) { const l = (d[i * 4] * 0.2126 + d[i * 4 + 1] * 0.7152 + d[i * 4 + 2] * 0.0722) / 255; a[i] = (useA ? d[i * 4 + 3] > 128 : d[i * 4 + 3] > 128 && l < 0.5) ? 1 : 0; }
      maskCache = { M, a };
      return maskCache;
    }

    // ——— Scènes : parois et remplissage initial ———
    function setup() {
      const { w, h } = app.size; if (!w) return;
      cs = Math.round(p.taille); gw = Math.floor(w / cs); gh = Math.floor(h / cs); ox = Math.floor((w - gw * cs) / 2); oy = Math.floor((h - gh * cs) / 2);
      cell = new Uint8Array(gw * gh); shade = new Uint8Array(gw * gh); stamp = new Uint8Array(gw * gh);
      off = document.createElement('canvas'); off.width = gw; off.height = gh; offCtx = off.getContext('2d'); img = offCtx.createImageData(gw, gh);
      draining = false; flip = 0; flipping = false; emptyT = 0;
      const r = app.rng(7), S = Math.min(gw, gh);
      const wall = (x, y) => { if (x >= 0 && y >= 0 && x < gw && y < gh) cell[y * gw + x] = WALL; };
      // Bords latéraux et fond toujours fermés (le fond s'ouvre pour la vidange).
      for (let y = 0; y < gh; y++) { wall(0, y); wall(gw - 1, y); }
      for (let x = 0; x < gw; x++) wall(x, gh - 1);
      if (p.scene === 'sablier') {
        const cx = gw / 2, cy = gh / 2, hw = Math.min(gw * 0.4, gh * 0.34), neck = Math.max(1, Math.round(S * 0.012));
        const half = gh * 0.44;
        for (let y = 0; y < gh; y++) {
          const t = Math.abs(y - cy) / half;
          if (t > 1) { for (let x = 0; x < gw; x++) wall(x, y); continue; }
          const width = neck + (hw - neck) * Math.pow(Math.sin(Math.min(1, t) * Math.PI / 2), 0.7) * (t > 0.92 ? Math.sqrt(Math.max(0, 1 - (t - 0.92) / 0.08 * 0.6)) : 1);
          for (let x = 0; x < gw; x++) if (Math.abs(x + 0.5 - cx) > width) wall(x, y);
        }
        // Remplissage du bulbe haut, en couches.
        const cols = Math.max(1, p.couleurs.length), top = Math.floor(cy - half), mid = Math.floor(cy - 2), band = Math.max(2, Math.round((mid - top) / (cols * 2)));
        for (let y = top; y < mid; y++) for (let x = 0; x < gw; x++) { const i = y * gw + x; if (!cell[i] && y > top + (mid - top) * 0.12) { cell[i] = 1 + (Math.floor((y - top) / band) % cols); shade[i] = r() * 255; } }
      } else if (p.scene === 'strates') {
        // Le bocal commence à moitié rempli de strates ondulées.
        const cols = Math.max(1, p.couleurs.length), y0 = gh * 0.55, ph = [r() * TAU, r() * TAU, r() * TAU];
        for (let y = Math.floor(y0); y < gh - 1; y++) for (let x = 1; x < gw - 1; x++) {
          const u = x / gw, wav = Math.sin(u * 7 + ph[0]) * 0.035 + Math.sin(u * 13 + ph[1]) * 0.018 + Math.sin(u * 3 + ph[2]) * 0.05;
          const top = y0 / gh + 0.06 + Math.sin(u * 5 + ph[1]) * 0.05; if (y / gh < top) continue;
          const band = Math.floor((y / gh + wav) * 26);
          const i = y * gw + x; cell[i] = 1 + ((band % cols) + cols) % cols; shade[i] = r() * 255;
        }
      } else if (p.scene === 'chicanes') {
        // Clous en quinconce au milieu, cases verticales en bas.
        const sp = Math.max(4, Math.round(S * 0.07)), y0 = Math.round(gh * 0.22), y1 = Math.round(gh * 0.6);
        for (let y = y0, row = 0; y < y1; y += Math.round(sp * 0.87), row++) for (let x = (row % 2 ? sp / 2 : 0) + sp / 2; x < gw - 1; x += sp) { const X = Math.round(x); wall(X, y); wall(X + 1, y); wall(X, y + 1); wall(X + 1, y + 1); }
        for (let x = sp / 2; x < gw - 1; x += sp) for (let y = Math.round(gh * 0.68); y < gh; y++) wall(Math.round(x), y);
      } else if (p.scene === 'logo') {
        const L = logoMask(), Z = Math.round(S * 0.6), lx = Math.round((gw - Z) / 2), ly = Math.round(gh * 0.3);
        for (let y = 0; y < Z; y++) for (let x = 0; x < Z; x++) if (L.a[Math.floor(y / Z * L.M) * L.M + Math.floor(x / Z * L.M)]) wall(lx + x, ly + y);
      }
    }

    // ——— Interaction ———
    function toCell(x, y) { return [Math.floor((x - ox) / cs), Math.floor((y - oy) / cs)]; }
    function pour(x, y, n, col) {
      const [cx, cy] = toCell(x, y), r = app.random;
      for (let k = 0; k < n; k++) { const X = cx + Math.round((r() - 0.5) * 5), Y = cy + Math.round((r() - 0.5) * 3); if (X > 0 && Y >= 0 && X < gw - 1 && Y < gh - 1) { const i = Y * gw + X; if (!cell[i]) { cell[i] = 1 + col; shade[i] = r() * 255; } } }
    }
    function dig(x, y) {
      const [cx, cy] = toCell(x, y), R = Math.max(2, Math.round(Math.min(gw, gh) * 0.035));
      for (let j = -R; j <= R; j++) for (let i = -R; i <= R; i++) { if (i * i + j * j > R * R) continue; const X = cx + i, Y = cy + j; if (X > 0 && Y >= 0 && X < gw - 1 && Y < gh - 1) { const k = Y * gw + X; if (cell[k] !== WALL) cell[k] = 0; } }
    }
    function blast(x, y) {
      const [cx, cy] = toCell(x, y), R = Math.max(4, Math.round(Math.min(gw, gh) * 0.12)), r = app.random;
      for (let j = -R; j <= R; j++) for (let i = -R; i <= R; i++) {
        if (i * i + j * j > R * R) continue; const X = cx + i, Y = cy + j;
        if (X <= 0 || Y < 0 || X >= gw - 1 || Y >= gh - 1) continue;
        const k = Y * gw + X; if (!cell[k] || cell[k] === WALL) continue;
        // Le grain est projeté vers le haut et vers l'extérieur.
        const d = Math.hypot(i, j) || 1, f = (1 - d / R) * R * 3.5 + r() * R * 1.2;
        const tx = Math.round(X + i / d * f * 0.8 + (r() - 0.5) * 2), ty = Math.round(Y - Math.abs(j / d * f) - f * 0.6);
        if (tx > 0 && ty >= 0 && tx < gw - 1 && ty < gh - 1 && !cell[ty * gw + tx]) { cell[ty * gw + tx] = cell[k]; shade[ty * gw + tx] = shade[k]; cell[k] = 0; }
      }
    }

    // ——— Simulation ———
    function step() {
      frameId = (frameId % 250) + 1;
      const r = app.random, fl = p.fluidite, fid = frameId;
      for (let y = gh - 2; y >= 0; y--) {
        const ltr = r() < 0.5, row = y * gw;
        for (let n = 1; n < gw - 1; n++) {
          const x = ltr ? n : gw - 1 - n, i = row + x, c = cell[i];
          if (!c || c === WALL || stamp[i] === fid) continue;
          const b = i + gw;
          let t = -1;
          if (!cell[b]) t = b;
          else {
            const d = r() < 0.5 ? 1 : -1;
            if (!cell[b + d] && !cell[i + d]) t = b + d;
            else if (!cell[b - d] && !cell[i - d]) t = b - d;
            else if (fl > 0 && r() < fl) { if (!cell[i + d]) t = i + d; else if (!cell[i - d]) t = i - d; }
          }
          if (t >= 0) { cell[t] = c; shade[t] = shade[i]; cell[i] = 0; stamp[t] = fid; }
        }
      }
    }

    function buildLut() {
      const key = [p.fond, p.murs, p.nuance, ...p.couleurs].join('|');
      if (key === lutKey) return; lutKey = key;
      const hex = (c) => { const n = parseInt(c.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; };
      const cols = p.couleurs.length ? p.couleurs : ['#888888'];
      lut = new Uint32Array(256 * 16);
      const pack = (r, g, b) => (255 << 24) | (Math.max(0, Math.min(255, b)) << 16) | (Math.max(0, Math.min(255, g)) << 8) | Math.max(0, Math.min(255, r));
      const f = hex(p.fond), m = hex(p.murs);
      for (let s = 0; s < 16; s++) { lut[s] = pack(...f); lut[WALL * 16 + s] = pack(...m); }
      for (let k = 0; k < 254; k++) { const c = hex(cols[k % cols.length]); for (let s = 0; s < 16; s++) { const v = 1 + (s / 15 - 0.5) * 2 * p.nuance; lut[(k + 1) * 16 + s] = pack(c[0] * v, c[1] * v, c[2] * v); } }
    }

    app.loop((t, dt) => {
      const { w, h, dpr } = app.size;
      dt = Math.min(0.05, dt || 0);
      if (!cell || gw !== Math.floor(w / Math.round(p.taille)) || gh !== Math.floor(h / Math.round(p.taille))) setup();
      const ncol = Math.max(1, p.couleurs.length), r = app.random;
      if (!flipping) {
        // Sources : balayage sinusoïdal, couleur qui tourne avec le temps.
        if (p.scene !== 'sablier' && p.debit > 0 && lastFill < 0.75) {
          const S = Math.round(p.sources);
          for (let k = 0; k < S; k++) {
            const base = (k + 0.5) / S, sw = Math.sin(t * (0.35 + k * 0.13) + k * 2.1) * p.balayage * 0.5 / Math.max(1, S * 0.6);
            const x = ox + (Math.min(0.95, Math.max(0.05, base + sw))) * gw * cs, col = (k + Math.floor(t / p.periode)) % ncol;
            pour(x, oy + cs * 2, Math.round(p.debit * (0.6 + r() * 0.8) / Math.max(1, S * 0.5)), col);
          }
        }
        if (hover && !drag) pour(hover.x, hover.y, 6, Math.floor(t / p.periode + 1) % ncol);
        for (let s = 0; s < Math.round(p.vitesse); s++) step();
        // Remplissage et vidange par le fond.
        let filled = 0, topHalf = 0; const N = gw * gh;
        for (let i = 0; i < N; i += 7) { const c = cell[i]; if (c && c !== WALL) { filled++; if (i < N / 2) topHalf++; } }
        const fill = filled * 7 / N; lastFill = fill;
        if (p.scene === 'sablier') {
          emptyT = topHalf < 3 ? emptyT + dt : 0;
          if (emptyT > 1.2) { flipping = true; flip = 0; }
        } else if (p.vidange) {
          if (fill > (p.scene === 'strates' ? 0.6 : 0.4)) draining = true; else if (fill < (p.scene === 'strates' ? 0.42 : 0.2)) draining = false;
          if (draining) {
            // Trois trous dans le fond : les strates s'y creusent en entonnoirs.
            const y = gh - 2, hw = Math.max(1, Math.round(gw * 0.018));
            for (const f of [0.22, 0.5, 0.78]) { const cx = Math.round(gw * f); for (let x = cx - hw; x <= cx + hw; x++) { const i = y * gw + x; if (x > 0 && x < gw - 1 && cell[i] !== WALL) cell[i] = 0; } }
          }
        }
      } else {
        flip += dt / 1.1;
        if (flip >= 1) { cell.reverse(); shade.reverse(); flipping = false; flip = 0; emptyT = 0; }
      }
      // Rendu à la résolution de la grille puis agrandi sans lissage.
      buildLut();
      const px = new Uint32Array(img.data.buffer);
      for (let i = 0; i < px.length; i++) px[i] = lut[cell[i] * 16 + (shade[i] >> 4)];
      offCtx.putImageData(img, 0, 0);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.fillStyle = p.fond; ctx.fillRect(0, 0, w, h);
      ctx.imageSmoothingEnabled = false;
      if (flipping) { const e = flip < 0.5 ? 2 * flip * flip : 1 - Math.pow(-2 * flip + 2, 2) / 2; ctx.translate(w / 2, h / 2); ctx.rotate(e * Math.PI); ctx.scale(1 - Math.sin(e * Math.PI) * 0.12, 1 - Math.sin(e * Math.PI) * 0.12); ctx.translate(-w / 2, -h / 2); }
      ctx.drawImage(off, ox, oy, gw * cs, gh * cs);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      app.finish(ctx);
    });

    function toSVG() {
      const { w, h } = app.size, cols = p.couleurs.length ? p.couleurs : ['#888888'], groups = new Map();
      // Rectangles fusionnés par rangée et par couleur (sans la nuance des grains).
      for (let y = 0; y < gh; y++) {
        let x = 0;
        while (x < gw) {
          const c = cell[y * gw + x]; let e = x + 1;
          while (e < gw && cell[y * gw + e] === c) e++;
          if (c) { const col = c === WALL ? p.murs : cols[(c - 1) % cols.length]; (groups.get(col) || groups.set(col, []).get(col)).push(`M${ox + x * cs} ${oy + y * cs}h${(e - x) * cs}v${cs}h${-(e - x) * cs}z`); }
          x = e;
        }
      }
      let out = '';
      for (const [col, d] of groups) out += `<path fill="${col}" d="${d.join('')}"/>\n`;
      return `<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" shape-rendering="crispEdges">\n<rect width="100%" height="100%" fill="${p.fond}"/>\n${out}</svg>`;
    }
  </script>
</body>
</html>
