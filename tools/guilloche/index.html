<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Guilloché</title>
  <link rel="stylesheet" href="../../assets/ui/atelier.css">
</head>
<body>
  <canvas></canvas>
  <script src="../../assets/ui/atelier.js"></script>
  <script>
    // Guilloché : le décor des montres et des billets. Une même sinusoïde, enroulée en cercle ou tendue en bande, est
    // répétée des dizaines de fois avec un petit décalage de phase : les copies se croisent et tressent une corde.
    // Plusieurs bandes de fréquences différentes forment un médaillon. Le logo est une image latente, comme sur les
    // billets : dans sa forme, l'onde s'aplatit en hachures parallèles et le logo apparaît sans être dessiné.
    const canvas = document.querySelector('canvas');
    const ctx = canvas.getContext('2d');
    const TAU = Math.PI * 2;
    const PAL = (k) => Atelier.PALETTES[k].colors;
    const BIEN = PAL('biennale'), GLY = PAL('glyphes'), SAL = PAL('salon'), MEN = PAL('menthe'), KB = PAL('kegelbahn');

    let simT = 0, held = null, phaseU = 0, relief = null, rW = 0, rH = 0, reliefKey = '';

    const app = Atelier.app({
      stage: canvas,
      animate: true,
      seed: false,
      finish: { grain: 0.04, vignette: 0.1 },
      hint: 'Glissez pour faire tourner les phases · molette : nombre de lobes',
      notes: 'Le guillochage est une gravure faite au tour : un burin suit une came qui le fait onduler, et la pièce tourne d\'un cran entre deux passes. Chaque passe trace la même onde, décalée : à quelques dizaines de passes, les ondes se croisent et tressent une corde, une rosace, une moire. Les graveurs de billets ont industrialisé ce décor, impossible à reproduire à la main, pour décourager les faussaires. Ici, chaque ligne est r = R + A·sin(pθ + φ) + B·sin(qθ), et φ avance d\'une ligne à l\'autre. Le logo devient une image latente, comme sur les billets : dans sa forme, l\'onde s\'aplatit en hachures parallèles et le logo apparaît sans qu\'aucun trait ne le dessine.',
      params: {
        'Motif': {
          forme: { type: 'segmented', label: 'Forme', options: { rosace: 'Rosace', medaillon: 'Médaillon', bande: 'Bandes' }, value: 'medaillon' },
          lignes: { type: 'range', label: 'Lignes par bande', min: 3, max: 120, step: 1, value: 36 },
          lobes: { type: 'range', label: 'Lobes', min: 2, max: 60, step: 1, value: 14 },
          ondes: { type: 'range', label: 'Onde secondaire', min: 0, max: 30, step: 1, value: 3 },
          amplitude: { type: 'range', label: 'Amplitude', min: 0, max: 1, step: 0.01, value: 0.45 },
          amplitude2: { type: 'range', label: 'Amplitude secondaire', min: 0, max: 1, step: 0.01, value: 0.25 },
          decalage: { type: 'range', label: 'Décalage entre lignes', min: 0, max: 1, step: 0.005, value: 0.5 },
          etalement: { type: 'range', label: 'Étalement', min: 0, max: 1, step: 0.01, value: 0.15 },
          bandes: { type: 'range', label: 'Bandes', min: 1, max: 9, step: 1, value: 4, show: (q) => q.forme !== 'rosace' },
        },
        'Mouvement': {
          vitesse: { type: 'range', label: 'Rotation des phases', min: -1, max: 1, step: 0.01, value: 0.18 },
          respiration: { type: 'range', label: 'Respiration de l\'amplitude', min: 0, max: 1, step: 0.01, value: 0.3 },
        },
        'Image latente': {
          logo: { type: 'toggle', label: 'Logo caché dans la trame', value: false },
          hauteur: { type: 'range', label: 'Contraste', min: 0, max: 1, step: 0.01, value: 1, show: (q) => q.logo },
          flou: { type: 'range', label: 'Douceur des bords', min: 0, max: 1, step: 0.01, value: 0.15, show: (q) => q.logo },
          image: { type: 'file', label: 'Logo', accept: 'image/*', show: (q) => q.logo },
        },
        'Trait': {
          epaisseur: { type: 'range', label: 'Épaisseur', min: 0.2, max: 3, step: 0.05, value: 0.7 },
          opacite: { type: 'range', label: 'Opacité', min: 0.1, max: 1, step: 0.01, value: 0.9 },
        },
        'Couleurs': {
          fond: { type: 'color', label: 'Fond', value: '#f1ece1' },
          couleurs: { type: 'palette', label: 'Encres', value: ['#1d4d3a', '#2f6f8f', '#7a3b5c'] },
        },
      },
      presets: {
        'Médaillon': {},
        'Rosace': { forme: 'rosace', lignes: 48, lobes: 18, ondes: 0, amplitude: 0.5, amplitude2: 0, decalage: 0.5, etalement: 0, couleurs: ['#7a3b5c'], epaisseur: 0.6 },
        'Bordure': { forme: 'bande', bandes: 5, lignes: 24, lobes: 22, ondes: 4, amplitude: 0.55, amplitude2: 0.3, decalage: 0.45, etalement: 0.1, couleurs: ['#2f6f8f', '#1d4d3a', '#7a3b5c'] },
        'Billet': { forme: 'medaillon', bandes: 6, lignes: 30, lobes: 20, ondes: 5, amplitude: 0.42, amplitude2: 0.3, logo: true, hauteur: 1, flou: 0.1, fond: '#e7efe2', couleurs: ['#3f6b4a', '#7a8f3c', '#3b5a7a'], epaisseur: 0.55 },
        'Moire': { forme: 'rosace', lignes: 90, lobes: 7, ondes: 13, amplitude: 0.9, amplitude2: 0.4, decalage: 0.11, etalement: 0.05, couleurs: ['#1b1b1f', '#3a3a44'], epaisseur: 0.35, opacite: 0.8 },
        'Nuit': { forme: 'medaillon', fond: '#0f1116', couleurs: ['#edd14b', '#ef5a2f', '#f272ba'], epaisseur: 0.6, lobes: 16, ondes: 4, bandes: 5 },
        'Logo': { forme: 'bande', bandes: 9, lignes: 16, lobes: 30, ondes: 0, amplitude: 0.3, amplitude2: 0, decalage: 0.5, etalement: 0.35, logo: true, hauteur: 1, flou: 0.1, couleurs: ['#1b1b1f'], fond: '#f1ece1', epaisseur: 0.6 },
        'Biennale': { forme: 'medaillon', fond: BIEN[0], couleurs: [BIEN[1], BIEN[2], BIEN[3]], lobes: 12, bandes: 4, epaisseur: 0.8 },
        'Menthe': { forme: 'rosace', fond: MEN[1], couleurs: [MEN[2], MEN[3], MEN[0]], lignes: 60, lobes: 24, ondes: 6, amplitude: 0.6 },
        'Kegelbahn': { forme: 'bande', fond: KB[0], couleurs: [KB[1], KB[2]], bandes: 6, lobes: 16, lignes: 20, epaisseur: 0.8 },
      },
      brand(colors) {
        const s = colors.slice().sort((a, b) => lum(b) - lum(a)), rest = s.slice(1);
        return { fond: s[0], couleurs: rest.length ? rest : ['#000000'] };
      },
      pointer: {
        down: (q) => { held = { x: q.x, ph: phaseU }; },
        drag: (q) => { if (held) phaseU = held.ph + (q.x - held.x) / app.size.w * TAU; },
        up: () => { held = null; },
        wheel: (q, dy) => app.set('lobes', Math.max(2, Math.min(60, p.lobes + (dy > 0 ? -1 : 1)))),
      },
      onChange(k) { if (['image', 'logo', 'flou', '*'].includes(k)) reliefKey = ''; },
      export: { name: 'guilloche', svg: () => toSVG() },
    });
    const p = app.params;

    function hex(x) { const n = parseInt(x.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
    function lum(x) { const c = hex(x); return (c[0] * 0.299 + c[1] * 0.587 + c[2] * 0.114) / 255; }
    function mix(a, b, t) { const A = hex(a), B = hex(b); return '#' + A.map((v, i) => Math.round(v + (B[i] - v) * t).toString(16).padStart(2, '0')).join(''); }

    // ——— Relief : le logo flouté, en quart de résolution ———
    function buildRelief(w, h) {
      const img0 = p.image || app.logoImg, key = [w, h, p.flou, img0 ? (img0.src || 'c') : 'demo'].join();
      if (key === reliefKey) return; reliefKey = key;
      const k = 0.25; rW = Math.ceil(w * k); rH = Math.ceil(h * k);
      const c = document.createElement('canvas'); c.width = rW; c.height = rH; const x = c.getContext('2d', { willReadFrequently: true });
      const L = Math.min(rW, rH) * 0.58, cx = rW / 2, cy = rH / 2;
      if (img0) { const iw = img0.naturalWidth || img0.width, ih = img0.naturalHeight || img0.height, s = L / Math.max(iw, ih); x.drawImage(img0, cx - iw * s / 2, cy - ih * s / 2, iw * s, ih * s); }
      else { x.fillStyle = '#000'; x.beginPath(); x.arc(cx, cy, L * 0.48, 0, TAU); x.arc(cx, cy, L * 0.27, 0, TAU, true); x.fill('evenodd'); x.fillRect(cx - L * 0.07, cy - L * 0.5, L * 0.14, L); }
      const N = rW * rH, d = x.getImageData(0, 0, rW, rH).data; let transp = 0; for (let i = 3; i < d.length; i += 4) if (d[i] < 128) transp++;
      const useA = transp > N * 0.05; let a = new Float32Array(N);
      for (let i = 0; i < N; i++) { const l = (d[i * 4] * 0.2126 + d[i * 4 + 1] * 0.7152 + d[i * 4 + 2] * 0.0722) / 255; a[i] = (useA ? d[i * 4 + 3] > 128 : d[i * 4 + 3] > 128 && l < 0.5) ? 1 : 0; }
      // flou par boîtes successives (≈ gaussien)
      const r = Math.max(1, Math.round(1 + p.flou * Math.min(rW, rH) * 0.03));
      let b = new Float32Array(N);
      for (let pass = 0; pass < 3; pass++) {
        for (let j = 0; j < rH; j++) { let s = 0; for (let i = -r; i <= r; i++) s += a[j * rW + Math.max(0, Math.min(rW - 1, i))]; for (let i = 0; i < rW; i++) { b[j * rW + i] = s / (2 * r + 1); s += a[j * rW + Math.min(rW - 1, i + r + 1)] - a[j * rW + Math.max(0, i - r)]; } }
        for (let i = 0; i < rW; i++) { let s = 0; for (let j = -r; j <= r; j++) s += b[Math.max(0, Math.min(rH - 1, j)) * rW + i]; for (let j = 0; j < rH; j++) { a[j * rW + i] = s / (2 * r + 1); s += b[Math.min(rH - 1, j + r + 1) * rW + i] - b[Math.max(0, j - r) * rW + i]; } }
      }
      relief = a;
    }
    function reliefAt(x, y) {
      const u = x * 0.25 - 0.5, v = y * 0.25 - 0.5, i = Math.floor(u), j = Math.floor(v), fx = u - i, fy = v - j;
      const g = (ii, jj) => (ii < 0 || jj < 0 || ii >= rW || jj >= rH) ? 0 : relief[jj * rW + ii];
      return (g(i, j) * (1 - fx) + g(i + 1, j) * fx) * (1 - fy) + (g(i, j + 1) * (1 - fx) + g(i + 1, j + 1) * fx) * fy;
    }

    // ——— Les lignes : des polylignes écran, avec leur couleur ———
    function bands(w, h) {
      const B = [];
      if (p.forme === 'rosace') B.push({ kind: 'r', R: 0.62, W: 0.5, p: p.lobes, q: p.ondes, ph: 0 });
      else if (p.forme === 'medaillon') {
        // des couronnes qui se chevauchent un peu, et une fleur au centre
        const n = p.bandes, r0 = 0.36, r1 = 0.93, step = n > 1 ? (r1 - r0) / (n - 1) : 0.3;
        B.push({ kind: 'r', R: 0.17, W: 0.34, p: Math.max(3, Math.round(p.lobes / 2)), q: 0, ph: 0.4, k: 1.8 });
        for (let k = 0; k < n; k++) { const t = n > 1 ? k / (n - 1) : 1; B.push({ kind: 'r', R: n > 1 ? r0 + k * step : 0.65, W: Math.min(0.45, step * 1.5), p: Math.max(2, Math.round(p.lobes * (0.6 + t * 0.9))), q: p.ondes, ph: k * 0.7 }); }
      } else {
        const n = p.bandes;
        for (let k = 0; k < n; k++) B.push({ kind: 'b', y: (k + 0.5) / n, W: 1 / n, p: Math.max(1, Math.round(p.lobes * (k % 2 ? 0.75 : 1))), q: p.ondes, ph: k * 1.3 });
      }
      return B;
    }
    function build(w, h, t) {
      const out = [], C = p.couleurs.length ? p.couleurs : ['#000000'], useR = p.logo && relief;
      const Rmax = Math.min(w, h) * 0.46, cx = w / 2, cy = h / 2, amp = 1 + p.respiration * 0.35 * Math.sin(t * 0.5);
      const phase = t * p.vitesse + phaseU, n = p.lignes, H = p.hauteur;
      const B = bands(w, h);
      B.forEach((b, bi) => {
        for (let i = 0; i < n; i++) {
          const f = n > 1 ? i / (n - 1) : 0.5, phi = i * p.decalage * TAU / b.p + phase * (bi % 2 ? -1 : 1) + b.ph;
          const col = C.length === 1 ? C[0] : (() => { const u = ((bi + f) / Math.max(1, B.length)) * (C.length - 1), k = Math.min(C.length - 2, Math.floor(u)); return mix(C[k], C[k + 1], u - k); })();
          const P = [];
          if (b.kind === 'r') {
            const base = b.R + (f - 0.5) * b.W * p.etalement * 1.6, A = b.W * 0.5 * Math.min(1, p.amplitude * (b.k || 1)) * amp, A2 = b.W * 0.5 * p.amplitude2 * (b.k ? 0 : 1);
            const steps = Math.max(160, Math.min(1600, Math.round((b.p * 14 + 60) * (0.4 + b.R))));
            for (let s = 0; s <= steps; s++) {
              const th = s / steps * TAU, c = Math.cos(th), sn = Math.sin(th);
              // image latente : dans le logo, l'onde s'aplatit et les lignes s'écartent en hachures parallèles
              const wv = A * Math.sin(b.p * th + phi) + A2 * Math.sin(b.q * th - phase * 0.5), r0 = (base + wv) * Rmax;
              const m = useR ? Math.min(1, reliefAt(cx + c * r0, cy + sn * r0) * H) : 0;
              const r = (base + (f - 0.5) * b.W * 0.9 * m + wv * (1 - m)) * Rmax;
              P.push(cx + c * r, cy + sn * r);
            }
          } else {
            const yb = h * 0.08 + b.y * h * 0.84, Wb = b.W * h * 0.84, A = Wb * 0.5 * p.amplitude * amp, A2 = Wb * 0.5 * p.amplitude2, base = (f - 0.5) * Wb * p.etalement * 1.6;
            const x0 = w * 0.06, x1 = w * 0.94, steps = Math.max(160, Math.min(1600, Math.round(b.p * 16 + 120)));
            for (let s = 0; s <= steps; s++) {
              const u = s / steps, x = x0 + (x1 - x0) * u, th = u * TAU;
              const wv = A * Math.sin(b.p * th + phi) + A2 * Math.sin(b.q * th - phase * 0.5), m = useR ? Math.min(1, reliefAt(x, yb + base + wv) * H) : 0;
              const y = yb + base + (f - 0.5) * Wb * 0.9 * m + wv * (1 - m);
              P.push(x, y);
            }
          }
          out.push({ P, col, closed: b.kind === 'r' });
        }
      });
      return out;
    }

    app.loop((t, dt) => {
      dt = Math.min(0.1, dt || 0);
      if (!app.thumbnail && !held) simT += dt;
      const { w, h, dpr } = app.size;
      if (p.logo) buildRelief(w, h);
      const L = build(w, h, simT);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.fillStyle = p.fond; ctx.fillRect(0, 0, w, h);
      ctx.lineWidth = p.epaisseur; ctx.lineJoin = 'round'; ctx.globalAlpha = p.opacite;
      // une passe par couleur
      const byCol = new Map(); for (const l of L) { let P2 = byCol.get(l.col); if (!P2) byCol.set(l.col, (P2 = new Path2D())); P2.moveTo(l.P[0], l.P[1]); for (let i = 2; i < l.P.length; i += 2) P2.lineTo(l.P[i], l.P[i + 1]); if (l.closed) P2.closePath(); }
      for (const [col, P2] of byCol) { ctx.strokeStyle = col; ctx.stroke(P2); }
      ctx.globalAlpha = 1;
      app.finish(ctx);
    });

    function toSVG() {
      const { w, h } = app.size, f = (v) => +v.toFixed(2);
      if (p.logo) buildRelief(w, h);
      const L = build(w, h, simT), byCol = new Map();
      for (const l of L) { let d = `M${f(l.P[0])} ${f(l.P[1])}`; for (let i = 2; i < l.P.length; i += 2) d += `L${f(l.P[i])} ${f(l.P[i + 1])}`; if (l.closed) d += 'Z'; byCol.set(l.col, (byCol.get(l.col) || '') + d); }
      let body = ''; for (const [col, d] of byCol) body += `<path d="${d}" stroke="${col}"/>`;
      return `<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><rect width="100%" height="100%" fill="${p.fond}"/><g fill="none" stroke-width="${f(p.epaisseur)}" stroke-linejoin="round" stroke-opacity="${f(p.opacite)}">${body}</g></svg>`;
    }
  </script>
</body>
</html>
