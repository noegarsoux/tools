<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Plan de ville</title>
  <link rel="stylesheet" href="../../assets/ui/atelier.css">
</head>
<body>
  <canvas></canvas>
  <script src="../../assets/ui/atelier.js"></script>
  <script>
    // Plan de ville : une file d'attente de tronçons, à la manière de Parish et Müller. Chaque tronçon proposé est
    // confronté au réseau déjà construit : s'il en croise un, il s'arrête au croisement ; s'il passe près d'un carrefour,
    // il s'y raccroche ; s'il double une rue existante, il est abandonné. Les avenues filent en ondulant et sèment des
    // rues à angle droit ; les rues ne naissent que là où la densité (autour des centres, ou dans le logo) le permet.
    // Les maisons s'alignent le long des rues, et des voitures circulent sur le graphe des carrefours.
    const canvas = document.querySelector('canvas');
    const ctx = canvas.getContext('2d');
    const TAU = Math.PI * 2;
    const PAL = (k) => Atelier.PALETTES[k].colors;
    const BIEN = PAL('biennale'), GLY = PAL('glyphes'), SAL = PAL('salon'), MEN = PAL('menthe'), KB = PAL('kegelbahn');

    let C = null, cKey = '', simT = 0, cycle = 0, logoM = null, logoKey = '', drawing = null;

    const app = Atelier.app({
      stage: canvas,
      animate: true,
      seed: true,
      finish: { grain: 0.035, vignette: 0.1 },
      hint: 'Glissez pour tracer une avenue · touchez pour fonder un quartier · molette : échelle',
      notes: 'Une ville ne se dessine pas d\'un coup : elle pousse le long de ses routes. En 2001, Yoav Parish et Pascal Müller proposent de la faire croître comme une plante : chaque route propose un prolongement, et des règles locales décident s\'il est accepté, raccourci jusqu\'au carrefour voisin ou abandonné parce qu\'il doublerait une rue existante. Les grandes avenues filent loin en ondulant, les rues s\'en détachent à angle droit et se rejoignent pour fermer des îlots, et la densité décide où la ville s\'épaissit. Ici la ville pousse sous vos yeux autour de ses centres, les maisons s\'alignent le long des trottoirs et les voitures circulent ; tracez une avenue au doigt et les rues viendront s\'y greffer.',
      params: {
        'Ville': {
          centres: { type: 'range', label: 'Centres', min: 1, max: 4, step: 1, value: 2 },
          densite: { type: 'range', label: 'Densité', min: 0.1, max: 1, step: 0.01, value: 0.6 },
          etendue: { type: 'range', label: 'Étendue', min: 0.2, max: 1.2, step: 0.01, value: 0.55 },
          echelle: { type: 'range', label: 'Échelle des îlots', min: 0.5, max: 2, step: 0.01, value: 1 },
          sinuosite: { type: 'range', label: 'Sinuosité', min: 0, max: 1, step: 0.01, value: 0.35 },
          quadrillage: { type: 'range', label: 'Régularité du quadrillage', min: 0, max: 1, step: 0.01, value: 0.75 },
        },
        'Croissance': {
          vitesse: { type: 'range', label: 'Vitesse de croissance', min: 0.2, max: 4, step: 0.05, value: 1 },
          boucle: { type: 'toggle', label: 'Recommencer une fois finie', value: true },
          voitures: { type: 'range', label: 'Voitures', min: 0, max: 300, step: 1, value: 90 },
        },
        'Rendu': {
          maisons: { type: 'toggle', label: 'Maisons', value: true },
          avenues: { type: 'range', label: 'Largeur des avenues', min: 0.5, max: 6, step: 0.1, value: 3 },
          rues: { type: 'range', label: 'Largeur des rues', min: 0.3, max: 3, step: 0.05, value: 1.2 },
        },
        'Logo bâti': {
          logo: { type: 'toggle', label: 'La ville pousse dans le logo', value: false },
          tailleLogo: { type: 'range', label: 'Taille du logo', min: 0.4, max: 1.8, step: 0.01, value: 1.15, show: (q) => q.logo },
          image: { type: 'file', label: 'Logo', accept: 'image/*', show: (q) => q.logo },
        },
        'Couleurs': {
          fond: { type: 'color', label: 'Terrain', value: '#ece6d8' },
          couleurAvenues: { type: 'color', label: 'Avenues', value: '#ef5a2f' },
          couleurRues: { type: 'color', label: 'Rues', value: '#1b1b1f' },
          couleurs: { type: 'palette', label: 'Maisons', value: ['#cfc4ae', '#b9ad94', '#a89c83'] },
          couleurVoitures: { type: 'color', label: 'Voitures', value: '#486cfc' },
        },
      },
      presets: {
        'Plan': {},
        'Nuit': { fond: '#0b0c12', couleurAvenues: '#edd14b', couleurRues: '#3a4466', couleurs: ['#161a28', '#1b2032', '#12151f'], couleurVoitures: '#f4f1ea', voitures: 220, rues: 0.9 },
        'Damier': { quadrillage: 1, sinuosite: 0, centres: 1, etendue: 0.8, densite: 0.85, echelle: 0.9 },
        'Village': { centres: 1, densite: 0.55, etendue: 0.45, sinuosite: 0.8, quadrillage: 0.2, echelle: 1.3, voitures: 25 },
        'Métropole': { centres: 4, densite: 0.95, etendue: 1, echelle: 0.7, voitures: 260, avenues: 2.4, rues: 0.8 },
        'Nolli': { fond: '#f4f1ea', couleurAvenues: '#1b1b1f', couleurRues: '#1b1b1f', couleurs: ['#1b1b1f'], voitures: 0, avenues: 2, rues: 1, densite: 0.8 },
        'Logo': { logo: true, centres: 1, densite: 0.95, etendue: 1, echelle: 0.75, quadrillage: 0.85, couleurAvenues: '#ef5a2f', voitures: 120 },
        'Biennale': { fond: BIEN[0], couleurAvenues: BIEN[2], couleurRues: BIEN[1], couleurs: [BIEN[3], BIEN[4]], couleurVoitures: BIEN[1] },
        'Menthe': { fond: MEN[1], couleurAvenues: MEN[0], couleurRues: MEN[3], couleurs: [MEN[2], MEN[3]], couleurVoitures: MEN[0] },
        'Kegelbahn': { fond: KB[0], couleurAvenues: KB[2], couleurRues: KB[1], couleurs: ['#1a1030', '#221640'], couleurVoitures: KB[2], voitures: 200 },
      },
      brand(colors) {
        const s = colors.slice().sort((a, b) => lum(a) - lum(b)), L = s[s.length - 1];
        return { fond: L, couleurRues: s[0], couleurAvenues: s[Math.max(0, s.length - 2)], couleurs: [mix(L, s[0], 0.18), mix(L, s[0], 0.28)], couleurVoitures: s[Math.floor(s.length / 2)] };
      },
      pointer: {
        down: (q) => { drawing = { x: q.x, y: q.y, moved: false, a: null }; },
        drag: (q) => {
          if (!drawing || !C) return; const st = step0() * 1.6, d = Math.hypot(q.x - drawing.x, q.y - drawing.y);
          if (d < st) return;
          const a = Math.atan2(q.y - drawing.y, q.x - drawing.x);
          addUserAvenue(drawing.x, drawing.y, q.x, q.y, a); drawing = { x: q.x, y: q.y, moved: true, a };
        },
        up: () => { if (drawing && !drawing.moved && C) found(drawing.x, drawing.y); drawing = null; },
        wheel: (q, dy) => app.set('echelle', Math.max(0.5, Math.min(2, +(p.echelle + (dy > 0 ? -0.05 : 0.05)).toFixed(2)))),
      },
      onChange(k) { if (['*', 'centres', 'densite', 'etendue', 'sinuosite', 'quadrillage', 'logo', 'tailleLogo', 'image'].includes(k)) cKey = ''; if (['*', 'logo', 'image'].includes(k)) logoKey = ''; },
      onSeed() { cKey = ''; },
      export: { name: 'plan-de-ville', svg: () => toSVG() },
    });
    const p = app.params;

    function hex(x) { const n = parseInt(x.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
    function lum(x) { const c = hex(x); return (c[0] * 0.299 + c[1] * 0.587 + c[2] * 0.114) / 255; }
    function mix(a, b, t) { const A = hex(a), B = hex(b); return '#' + A.map((v, i) => Math.round(v + (B[i] - v) * t).toString(16).padStart(2, '0')).join(''); }
    function mulberry(a) { return () => { a |= 0; a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }

    // ——— Logo ———
    function buildLogo() {
      const img0 = p.image || app.logoImg, key = [p.logo, img0 ? (img0.src || 'c') : 'demo'].join(); if (key === logoKey) return; logoKey = key;
      logoM = null; if (!p.logo) return;
      const M = 200, c = document.createElement('canvas'); c.width = c.height = M; const x = c.getContext('2d', { willReadFrequently: true }), L = M * 0.94, cx = M / 2;
      if (img0) { const iw = img0.naturalWidth || img0.width, ih = img0.naturalHeight || img0.height, s = L / Math.max(iw, ih); x.drawImage(img0, cx - iw * s / 2, cx - ih * s / 2, iw * s, ih * s); }
      else { x.fillStyle = '#000'; x.beginPath(); x.arc(cx, cx, L * 0.48, 0, TAU); x.arc(cx, cx, L * 0.27, 0, TAU, true); x.fill('evenodd'); x.fillRect(cx - L * 0.07, cx - L * 0.5, L * 0.14, L); }
      const d = x.getImageData(0, 0, M, M).data; let transp = 0; for (let i = 3; i < d.length; i += 4) if (d[i] < 128) transp++; const useA = transp > M * M * 0.05;
      const m = new Uint8Array(M * M); for (let i = 0; i < M * M; i++) { const o = i * 4, l = (d[o] * 0.2126 + d[o + 1] * 0.7152 + d[o + 2] * 0.0722) / 255; m[i] = (useA ? d[o + 3] > 128 : d[o + 3] > 128 && l < 0.5) ? 1 : 0; }
      logoM = { m, M };
    }

    // ——— La ville : état complet ———
    function newCity(w, h) {
      buildLogo();
      const R = mulberry(Math.floor(app.rng()() * 1e9) + cycle * 104729), m = Math.min(w, h), step0 = m * 0.034 * p.echelle;
      const city = { w, h, m, R, step0, segs: [], grid: new Map(), nodes: new Map(), houses: [], hgrid: new Map(), queue: [], hq: [], g: 0, lastAdd: 0, cars: [], centres: [], doneAt: -1 };
      C = city;
      if (p.logo && logoM) {
        // dans le logo : plusieurs quartiers fondés en des points tirés à l'intérieur de la silhouette
        let tries = 0; while (city.centres.length < 2 + p.centres * 2 && tries++ < 4000) { const x = w / 2 + (R() - 0.5) * m * p.tailleLogo, y = h / 2 + (R() - 0.5) * m * p.tailleLogo; if (density(x, y) > 0 && city.centres.every((c) => Math.hypot(c[0] - x, c[1] - y) > m * 0.12)) city.centres.push([x, y]); }
      } else for (let i = 0; i < p.centres; i++) {
        const n = p.centres, a = i / n * TAU + R() * 1.5, r = n === 1 ? 0 : m * (0.12 + R() * 0.16);
        city.centres.push([w / 2 + Math.cos(a) * r * (w / m) * 0.8, h / 2 + Math.sin(a) * r]);
      }
      for (const c of city.centres) seed(c[0], c[1], 0);
      return city;
    }
    // l'échelle se lit en direct : la molette change la taille des prochains îlots sans raser la ville
    const step0 = () => C.m * 0.034 * p.echelle;
    function seed(x, y, t) {
      const R = C.R, a0 = R() * TAU, k = 3 + Math.floor(R() * 2);
      for (let i = 0; i < k; i++) C.queue.push({ x, y, a: a0 + i * TAU / k + (R() - 0.5) * 0.3 * (1 - p.quadrillage), type: 0, t: t + i * 0.05, depth: 0, from: -1 });
    }
    function found(x, y) { seed(x, y, C.g); C.centres.push([x, y]); C.doneAt = -1; }
    function addUserAvenue(x0, y0, x1, y1, a) {
      const id = addSeg(x0, y0, x1, y1, 0, true);
      for (const s of [-1, 1]) C.queue.push({ x: x1, y: y1, a: a + s * Math.PI / 2, type: 1, t: C.g + 0.15, depth: 0, from: id, free: true });
      C.doneAt = -1;
    }

    // densité : bosses autour des centres (ou masque du logo), modulée d'un bruit doux
    function density(x, y) {
      const { w, h, m } = C;
      if (p.logo && logoM) { const S = m * 0.5 * p.tailleLogo, u = Math.floor(((x - w / 2) / S * 0.5 + 0.5) * logoM.M), v = Math.floor(((y - h / 2) / S * 0.5 + 0.5) * logoM.M); return u >= 0 && v >= 0 && u < logoM.M && v < logoM.M && logoM.m[v * logoM.M + u] ? 1 : 0; }
      let d = 0; const R2 = (m * 0.5 * p.etendue) ** 2;
      for (const c of C.centres) d = Math.max(d, Math.exp(-((x - c[0]) ** 2 + (y - c[1]) ** 2) / R2));
      return d * (0.75 + 0.25 * Math.sin(x * 0.013 + y * 0.007) * Math.cos(y * 0.011 - x * 0.005));
    }

    // ——— Index spatial des tronçons ———
    const CELL = 40, ck = (i, j) => i * 92821 + j;
    function cellsOf(ax, ay, bx, by, pad = 0) { const out = []; const i0 = Math.floor((Math.min(ax, bx) - pad) / CELL), i1 = Math.floor((Math.max(ax, bx) + pad) / CELL), j0 = Math.floor((Math.min(ay, by) - pad) / CELL), j1 = Math.floor((Math.max(ay, by) + pad) / CELL); for (let j = j0; j <= j1; j++) for (let i = i0; i <= i1; i++) out.push(ck(i, j)); return out; }
    function nearSegs(ax, ay, bx, by, pad) { const set = new Set(); for (const k of cellsOf(ax, ay, bx, by, pad)) { const L = C.grid.get(k); if (L) for (const s of L) set.add(s); } return set; }
    const nkey = (x, y) => Math.round(x * 2) + ',' + Math.round(y * 2);
    function addNode(x, y, id) { const k = nkey(x, y); let n = C.nodes.get(k); if (!n) C.nodes.set(k, (n = { x, y, segs: [] })); n.segs.push(id); return n; }
    function addSeg(ax, ay, bx, by, type, user) {
      const id = C.segs.length; C.segs.push({ ax, ay, bx, by, type, t: C.g, user: !!user });
      for (const k of cellsOf(ax, ay, bx, by)) { let L = C.grid.get(k); if (!L) C.grid.set(k, (L = [])); L.push(id); }
      addNode(ax, ay, id); addNode(bx, by, id); C.lastAdd = C.g;
      if (type === 1 || type === 0) C.hq.push({ id, t: C.g + 0.35 });
      return id;
    }
    function segInter(ax, ay, bx, by, s) {
      const rx = bx - ax, ry = by - ay, sx = s.bx - s.ax, sy = s.by - s.ay, den = rx * sy - ry * sx; if (Math.abs(den) < 1e-9) return null;
      const qx = s.ax - ax, qy = s.ay - ay, t = (qx * sy - qy * sx) / den, u = (qx * ry - qy * rx) / den;
      return t > 1e-3 && t <= 1 && u >= -1e-3 && u <= 1 + 1e-3 ? t : null;
    }
    function distSeg(x, y, s) { const vx = s.bx - s.ax, vy = s.by - s.ay, l2 = vx * vx + vy * vy || 1, t = Math.max(0, Math.min(1, ((x - s.ax) * vx + (y - s.ay) * vy) / l2)); return [Math.hypot(x - s.ax - vx * t, y - s.ay - vy * t), s.ax + vx * t, s.ay + vy * t]; }

    // ——— Un tronçon proposé : contraintes locales ———
    function propose(it) {
      const { R, w, h } = C, st = step0() * (it.type === 0 ? 1.5 : 1) * (0.85 + R() * 0.3), dx = Math.cos(it.a), dy = Math.sin(it.a);
      const reach = st * 1.9, ex = it.x + dx * reach, ey = it.y + dy * reach;
      if (it.x < -40 || it.y < -40 || it.x > w + 40 || it.y > h + 40) return;
      if (it.type === 1 && !it.free && R() > Math.sqrt(Math.min(1, density(it.x + dx * st, it.y + dy * st) * (0.6 + p.densite * 1.6)))) return;
      if (p.logo && logoM && density(it.x + dx * st, it.y + dy * st) === 0) return;
      // 1) croisement : on s'arrête au premier tronçon coupé
      const near = nearSegs(it.x, it.y, ex, ey, 4); let tb = Infinity;
      for (const sid of near) { if (sid === it.from) continue; const s = C.segs[sid]; const t = segInter(it.x, it.y, ex, ey, s); if (t !== null && t < tb) tb = t; }
      if (tb * reach < st * 0.25) return;
      if (tb < Infinity) { addSeg(it.x, it.y, it.x + dx * reach * tb, it.y + dy * reach * tb, it.type); return; }
      let qx = it.x + dx * st, qy = it.y + dy * st;
      // 2) un carrefour tout proche : on s'y raccroche
      const sn = st * 0.6; let snap = null, sd = sn;
      for (const sid of nearSegs(qx, qy, qx, qy, sn)) { const s = C.segs[sid]; for (const e of [[s.ax, s.ay], [s.bx, s.by]]) { const d = Math.hypot(e[0] - qx, e[1] - qy); if (d < sd && Math.hypot(e[0] - it.x, e[1] - it.y) > st * 0.3) { sd = d; snap = e; } } }
      if (snap) { addSeg(it.x, it.y, snap[0], snap[1], it.type); return; }
      // 3) doublon : une rue presque parallèle juste à côté, on abandonne
      const mx = (it.x + qx) / 2, my = (it.y + qy) / 2;
      for (const sid of nearSegs(mx, my, mx, my, st * 0.4)) { if (sid === it.from) continue; const s = C.segs[sid]; if (distSeg(mx, my, s)[0] < st * 0.38) return; }
      const id = addSeg(it.x, it.y, qx, qy, it.type);
      if (C.segs.length > 5000) return;
      // 4) suites : l'avenue continue en ondulant et sème des rues ; la rue continue ou bifurque
      const jit = (1 - p.quadrillage) * 0.5, T = it.t + (it.type === 0 ? 0.32 : 0.45) / p.vitesse;
      if (it.type === 0) {
        C.queue.push({ x: qx, y: qy, a: it.a + (R() - 0.5) * p.sinuosite * 0.45, type: 0, t: T, depth: it.depth + 1, from: id });
        for (const s of [-1, 1]) if (R() < 0.42) C.queue.push({ x: qx, y: qy, a: it.a + s * Math.PI / 2 + (R() - 0.5) * jit, type: 1, t: T + (0.5 + R() * 0.8) / p.vitesse, depth: 0, from: id });
        if (R() < 0.035) C.queue.push({ x: qx, y: qy, a: it.a + (R() < 0.5 ? -1 : 1) * Math.PI / 2, type: 0, t: T + 1 / p.vitesse, depth: 0, from: id });
      } else if (it.depth < 40) {
        if (R() < 0.93) C.queue.push({ x: qx, y: qy, a: it.a + (R() - 0.5) * jit * 0.6 + (R() - 0.5) * p.sinuosite * 0.2, type: 1, t: T, depth: it.depth + 1, from: id, free: it.free && it.depth < 3 });
        for (const s of [-1, 1]) if (R() < 0.37) C.queue.push({ x: qx, y: qy, a: it.a + s * Math.PI / 2 + (R() - 0.5) * jit, type: 1, t: T + (0.4 + R() * 0.8) / p.vitesse, depth: it.depth + 1, from: id });
      }
    }

    // ——— Maisons : rectangles alignés le long d'une rue, sans toucher ni rues ni voisines ———
    function houses(sid) {
      const s = C.segs[sid], R = C.R, L = Math.hypot(s.bx - s.ax, s.by - s.ay); if (L < 4) return;
      const ux = (s.bx - s.ax) / L, uy = (s.by - s.ay) / L, nx = -uy, ny = ux, sc = step0() / 30, half = (s.type === 0 ? p.avenues : p.rues) / 2 + 2.2 * sc;
      for (const side of [-1, 1]) {
        let u = 3 * sc;
        while (u < L - 3 * sc) {
          const bw = (7 + R() * 9) * sc, bd = (7 + R() * 7) * sc; if (u + bw > L - 2 * sc) break;
          const cx = s.ax + ux * (u + bw / 2) + nx * side * (half + bd / 2), cy = s.ay + uy * (u + bw / 2) + ny * side * (half + bd / 2), rr = Math.hypot(bw, bd) / 2;
          let ok = density(cx, cy) > 0.04 || p.logo;
          if (ok) for (const k of nearSegs(cx, cy, cx, cy, rr + 6)) { const t = C.segs[k], hw = (t.type === 0 ? p.avenues : p.rues) / 2 + 1; if (distSeg(cx, cy, t)[0] < Math.min(bw, bd) / 2 + hw) { ok = false; break; } }
          if (ok) { const gi = Math.floor(cx / 30), gj = Math.floor(cy / 30); outer: for (let j = gj - 1; j <= gj + 1; j++) for (let i = gi - 1; i <= gi + 1; i++) { const H = C.hgrid.get(ck(i, j)); if (H) for (const o of H) if (Math.hypot(o.cx - cx, o.cy - cy) < (o.rr + rr) * 0.78) { ok = false; break outer; } } }
          if (ok) {
            const hs = { cx, cy, rr, t: C.g, col: Math.floor(R() * 8), P: [[-bw / 2, -bd / 2], [bw / 2, -bd / 2], [bw / 2, bd / 2], [-bw / 2, bd / 2]].map(([a, b]) => [cx + ux * a + nx * b, cy + uy * a + ny * b]) };
            C.houses.push(hs); const k = ck(Math.floor(cx / 30), Math.floor(cy / 30)); let H = C.hgrid.get(k); if (!H) C.hgrid.set(k, (H = [])); H.push(hs);
          }
          u += bw + (1 + R() * 2.5) * sc;
        }
      }
    }

    // ——— Avancer le temps de la ville ———
    function grow(dt) {
      C.g += dt;
      let budget = 400;
      while (budget-- > 0 && C.queue.length) {
        let bi = 0; for (let i = 1; i < C.queue.length; i++) if (C.queue[i].t < C.queue[bi].t) bi = i;
        if (C.queue[bi].t > C.g) break;
        const it = C.queue[bi]; C.queue[bi] = C.queue[C.queue.length - 1]; C.queue.pop(); propose(it);
      }
      if (p.maisons) { let k = 0; while (k < C.hq.length) { if (C.hq[k].t <= C.g) { houses(C.hq[k].id); C.hq[k] = C.hq[C.hq.length - 1]; C.hq.pop(); } else k++; } }
    }
    function finishAll() { let guard = 0; while ((C.queue.length || C.hq.length) && guard++ < 3000) grow(0.1); }

    // ——— Voitures : elles roulent de carrefour en carrefour ———
    function stepCars(dt) {
      const want = C.segs.length > 10 ? p.voitures | 0 : 0;
      while (C.cars.length < want) { const sid = Math.floor(Math.random() * C.segs.length); C.cars.push({ sid, u: Math.random(), dir: Math.random() < 0.5 ? 1 : -1, v: 0.6 + Math.random() * 0.8 }); }
      if (C.cars.length > want) C.cars.length = want;
      for (const car of C.cars) {
        const s = C.segs[car.sid], L = Math.hypot(s.bx - s.ax, s.by - s.ay) || 1;
        car.u += car.dir * dt * step0() * 2.4 * car.v * (s.type === 0 ? 1.5 : 1) / L;
        if (car.u > 1 || car.u < 0) {
          const end = car.u > 1 ? [s.bx, s.by] : [s.ax, s.ay], n = C.nodes.get(nkey(end[0], end[1])), opts = n ? n.segs.filter((k) => k !== car.sid) : [];
          if (!opts.length) { car.dir *= -1; car.u = Math.max(0, Math.min(1, car.u)); continue; }
          const pick = opts[Math.floor(Math.random() * opts.length)], t = C.segs[pick], atA = Math.hypot(t.ax - end[0], t.ay - end[1]) < 1;
          car.sid = pick; car.dir = atA ? 1 : -1; car.u = atA ? 0 : 1;
        }
      }
    }

    function ensure(w, h) {
      const key = [p.centres, p.densite, p.etendue, p.sinuosite, p.quadrillage, p.logo, p.tailleLogo, w, h, cycle].join();
      if (key !== cKey || !C) { const fromCycle = !!C && C.cycle !== cycle; cKey = key; newCity(w, h); C.cycle = cycle; if (app.thumbnail) finishAll(); else if (!fromCycle) for (let k = 0; k < 18; k++) grow(0.1); }
    }

    app.loop((t, dt) => {
      dt = Math.min(0.1, dt || 0);
      simT += dt;
      const { w, h, dpr } = app.size;
      ensure(w, h);
      grow(dt);
      if (!C.queue.length && C.doneAt < 0) C.doneAt = simT;
      if (C.doneAt >= 0 && p.boucle && !app.thumbnail && simT - C.doneAt > 10 && !drawing) { cycle++; cKey = ''; ensure(w, h); }
      stepCars(dt);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.fillStyle = p.fond; ctx.fillRect(0, 0, w, h);
      draw(ctx);
      app.finish(ctx);
    });

    function houseColor(i) { const H = p.couleurs.length ? p.couleurs : ['#999999']; return H[i % H.length]; }
    function segPart(s) { const f = Math.max(0, Math.min(1, (C.g - s.t) / 0.3 * p.vitesse)); return [s.ax, s.ay, s.ax + (s.bx - s.ax) * f, s.ay + (s.by - s.ay) * f]; }
    function draw(c) {
      if (p.maisons) {
        const by = new Map(); for (const hs of C.houses) { const col = houseColor(hs.col); let L = by.get(col); if (!L) by.set(col, (L = [])); L.push(hs); }
        for (const [col, L] of by) { const P2 = new Path2D(); for (const hs of L) { const k = Math.min(1, (C.g - hs.t) * 3), cx = hs.cx, cy = hs.cy; P2.moveTo(cx + (hs.P[0][0] - cx) * k, cy + (hs.P[0][1] - cy) * k); for (let i = 1; i < 4; i++) P2.lineTo(cx + (hs.P[i][0] - cx) * k, cy + (hs.P[i][1] - cy) * k); P2.closePath(); } c.fillStyle = col; c.fill(P2); }
      }
      c.lineCap = 'round'; c.lineJoin = 'round';
      for (const type of [1, 0]) {
        const P2 = new Path2D(); for (const s of C.segs) { if (s.type !== type) continue; const q = segPart(s); P2.moveTo(q[0], q[1]); P2.lineTo(q[2], q[3]); }
        c.strokeStyle = type === 0 ? p.couleurAvenues : p.couleurRues; c.lineWidth = type === 0 ? p.avenues : p.rues; c.stroke(P2);
      }
      if (C.cars.length) {
        const P3 = new Path2D(), r = Math.max(1, p.rues * 0.9);
        for (const car of C.cars) { const s = C.segs[car.sid]; if (!s) continue; const x = s.ax + (s.bx - s.ax) * car.u, y = s.ay + (s.by - s.ay) * car.u; P3.moveTo(x + r, y); P3.arc(x, y, r, 0, TAU); }
        c.fillStyle = p.couleurVoitures; c.fill(P3);
      }
    }

    function toSVG() {
      const { w, h } = app.size, f = (v) => +v.toFixed(1);
      let s = `<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><rect width="100%" height="100%" fill="${p.fond}"/>`;
      if (p.maisons) {
        const by = new Map(); for (const hs of C.houses) { const col = houseColor(hs.col); by.set(col, (by.get(col) || '') + 'M' + hs.P.map((q) => f(q[0]) + ' ' + f(q[1])).join('L') + 'z'); }
        for (const [col, d] of by) s += `<path d="${d}" fill="${col}"/>`;
      }
      for (const type of [1, 0]) {
        let d = ''; for (const sg of C.segs) if (sg.type === type) { const q = segPart(sg); d += `M${f(q[0])} ${f(q[1])}L${f(q[2])} ${f(q[3])}`; }
        if (d) s += `<path d="${d}" fill="none" stroke="${type === 0 ? p.couleurAvenues : p.couleurRues}" stroke-width="${f(type === 0 ? p.avenues : p.rues)}" stroke-linecap="round"/>`;
      }
      const r = Math.max(1, p.rues * 0.9);
      for (const car of C.cars) { const sg = C.segs[car.sid]; if (!sg) continue; s += `<circle cx="${f(sg.ax + (sg.bx - sg.ax) * car.u)}" cy="${f(sg.ay + (sg.by - sg.ay) * car.u)}" r="${f(r)}" fill="${p.couleurVoitures}"/>`; }
      return s + '</svg>';
    }
  </script>
</body>
</html>
