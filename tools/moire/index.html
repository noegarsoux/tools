<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Moiré</title>
  <link rel="stylesheet" href="../../assets/ui/atelier.css">
  <style>
    @font-face {
      font-family: "Atelier Mot";
      src: url("Lato-Black.ttf") format("truetype");
      font-weight: 900;
      font-style: normal;
      font-display: swap;
    }
    /* Le kit pose hidden sur la ligne, mais .at-row { display: grid } reprend le dessus. */
    .at-row[hidden] { display: none !important; }
  </style>
</head>
<body>
  <canvas></canvas>
  <script src="../../assets/ui/atelier.js"></script>
  <script>
    const canvas = document.querySelector('canvas');
    const ctx = canvas.getContext('2d');
    const FONT = '"Atelier Mot", Lato, "Liberation Sans", sans-serif';
    const CYCLE = 6;
    const BLEND = {
      over: 'source-over', multiply: 'multiply', screen: 'screen',
      overlay: 'overlay', difference: 'difference', exclusion: 'exclusion',
    };
    const MIX = {
      over: 'normal', multiply: 'multiply', screen: 'screen',
      overlay: 'overlay', difference: 'difference', exclusion: 'exclusion',
    };

    let fontB64 = null;
    fetch('Lato-Black.ttf')
      .then((r) => r.arrayBuffer())
      .then((buf) => { fontB64 = toBase64(buf); })
      .catch(() => {});

    function toBase64(buffer) {
      const bytes = new Uint8Array(buffer);
      let bin = '';
      for (let i = 0; i < bytes.length; i += 4096) {
        bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 4096));
      }
      return btoa(bin);
    }

    const f2 = (v) => (Math.round(v * 100) / 100).toString();
    const hex = (c, fallback) => (/^#[0-9a-f]{6}$/i.test(c) ? c : fallback);
    const esc = (s) => String(s).replace(/[&<>"']/g, (ch) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&apos;' }[ch]));

    let app;
    const p = () => app.params;

    function field(t) {
      const rnd = app.rng(5);
      const cycle = ((t / CYCLE) % 1 + 1) % 1;
      return { spin: rnd() < 0.5 ? -1 : 1, phase: rnd() * Math.PI * 2, lat: rnd(), cycle };
    }

    function logoReady() {
      const img = p().logo;
      return !!(img && img.naturalWidth);
    }

    function maskKind() {
      const m = p().masque;
      if (m === 'plein') return 'none';
      if (m === 'titre') return (logoReady() || (p().text || '').trim()) ? 'titre' : 'none';
      if (m === 'disque') return 'disque';
      if (logoReady()) return 'logo';
      if ((p().text || '').trim()) return 'text';
      return 'none';
    }

    function layoutWord(g, w, h) {
      const chars = Array.from((p().text || '').trim()).slice(0, 22);
      if (!chars.length) return null;
      const trackEm = p().approche;
      const measure = (size) => {
        g.font = `900 ${size}px ${FONT}`;
        const widths = chars.map((ch) => g.measureText(ch).width);
        const track = size * trackEm;
        const width = widths.reduce((a, b) => a + b, 0) + track * Math.max(0, chars.length - 1);
        return { widths, width, track };
      };
      let size = h * 0.7;
      let m = measure(size);
      const maxW = w * 0.94;
      if (m.width > maxW && m.width > 0) {
        size *= maxW / m.width;
        m = measure(size);
      }
      const corps = p().corps ?? 1;
      if (corps !== 1) {
        size *= corps;
        m = measure(size);
      }
      return { chars, size, widths: m.widths, width: m.width, track: m.track };
    }

    function drawWord(g, w, h, color) {
      const lay = layoutWord(g, w, h);
      if (!lay) return false;
      g.save();
      g.font = `900 ${lay.size}px ${FONT}`;
      g.fillStyle = color;
      g.textAlign = 'left';
      g.textBaseline = 'middle';
      let x = (w - lay.width) / 2;
      const y = h * 0.5 + lay.size * 0.045;
      for (let i = 0; i < lay.chars.length; i++) {
        g.fillText(lay.chars[i], x, y);
        x += lay.widths[i] + lay.track;
      }
      g.restore();
      return true;
    }

    function drawLogo(g, w, h) {
      const img = p().logo;
      const maxW = w * 0.7;
      const maxH = h * 0.62;
      const s = Math.min(maxW / img.naturalWidth, maxH / img.naturalHeight);
      const dw = img.naturalWidth * s;
      const dh = img.naturalHeight * s;
      g.drawImage(img, (w - dw) / 2, (h - dh) / 2, dw, dh);
    }

    function drawDisc(g, w, h) {
      const r = Math.min(w, h) * p().sceau * 0.5;
      g.beginPath();
      g.arc(w / 2, h / 2, Math.max(1, r), 0, Math.PI * 2);
      g.fill();
    }

    function centers(w, h, f, index) {
      const dist = Math.min(w, h) * p().separation;
      const ang = f.phase + f.cycle * Math.PI * 2 * f.spin;
      const sign = index === 0 ? 1 : -1;
      return {
        cx: w / 2 + Math.cos(ang) * dist * 0.5 * sign,
        cy: h / 2 + Math.sin(ang) * dist * 0.5 * sign,
      };
    }

    function rings(g, cx, cy, spacing, lw, phase, color, maxR) {
      const off = ((phase % spacing) + spacing) % spacing;
      g.beginPath();
      g.strokeStyle = color;
      g.lineWidth = lw;
      for (let r = off < 0.5 ? off + spacing : off; r < maxR; r += spacing) {
        g.moveTo(cx + r, cy);
        g.arc(cx, cy, r, 0, Math.PI * 2);
      }
      g.stroke();
    }

    function visitSpiral(cx, cy, spacing, rot, chirality, maxR, visitor) {
      const arms = 2;
      const b = (spacing * arms) / (Math.PI * 2);
      const maxA = maxR / b;
      const dA = Math.min(0.32, Math.max(0.05, 0.9 / b));
      const dir = chirality < 0 ? -1 : 1;
      for (let k = 0; k < arms; k++) {
        const arm = rot + dir * ((Math.PI * 2 * k) / arms);
        visitor({ op: 'M', x: cx, y: cy });
        let prev = 0;
        for (let a = dA; a <= maxA + 1e-4; a += dA) {
          const aa = Math.min(a, maxA);
          const r = Math.max(0.4, b * aa);
          const theta = arm + dir * aa;
          visitor({
            op: 'A', r, acw: dir < 0,
            prevTheta: arm + dir * prev, theta,
            x: cx + Math.cos(theta) * r, y: cy + Math.sin(theta) * r,
          });
          prev = aa;
          if (aa >= maxA) break;
        }
      }
    }

    function spiral(g, cx, cy, spacing, rot, chirality, color, lw, maxR) {
      g.beginPath();
      g.strokeStyle = color;
      g.lineWidth = lw;
      g.lineJoin = 'round';
      g.lineCap = 'round';
      visitSpiral(cx, cy, spacing, rot, chirality, maxR, (seg) => {
        if (seg.op === 'M') g.moveTo(seg.x, seg.y);
        else g.arc(cx, cy, seg.r, seg.prevTheta, seg.theta, seg.acw);
      });
      g.stroke();
    }

    function lines(g, w, h, angle, spacing, lw, shift, color) {
      const diag = Math.hypot(w, h);
      const phase = ((shift % spacing) + spacing) % spacing;
      g.save();
      g.translate(w / 2, h / 2);
      g.rotate(angle);
      g.strokeStyle = color;
      g.lineWidth = lw;
      g.lineCap = 'butt';
      g.beginPath();
      for (let x = -diag + phase; x <= diag + spacing; x += spacing) {
        g.moveTo(x, -diag);
        g.lineTo(x, diag);
      }
      g.stroke();
      g.restore();
    }

    function waves(g, w, h, angle, spacing, lw, shift, color, cycle, index) {
      const diag = Math.hypot(w, h);
      const phase = ((shift % spacing) + spacing) % spacing;
      const amp = p().onde * spacing * 1.2;
      const freq = (Math.PI * 2) / (spacing * (7 - p().onde * 3.2));
      const wobble = cycle * Math.PI * 2 + index * 1.3;
      const step = Math.max(5, spacing * 0.42);
      g.save();
      g.translate(w / 2, h / 2);
      g.rotate(angle);
      g.strokeStyle = color;
      g.lineWidth = lw;
      g.lineJoin = 'round';
      g.lineCap = 'butt';
      for (let x = -diag + phase; x <= diag + spacing; x += spacing) {
        g.beginPath();
        let i = 0;
        for (let y = -diag; y <= diag + step; y += step) {
          const warp = Math.sin(y * freq + wobble) * amp;
          if (i++ === 0) g.moveTo(x + warp, y);
          else g.lineTo(x + warp, y);
        }
        g.stroke();
      }
      g.restore();
    }

    function rays(g, cx, cy, n, lw, rot, color, len) {
      g.beginPath();
      g.strokeStyle = color;
      g.lineWidth = lw;
      g.lineCap = 'butt';
      for (let i = 0; i < n; i++) {
        const a = rot + (i / n) * Math.PI * 2;
        g.moveTo(cx, cy);
        g.lineTo(cx + Math.cos(a) * len, cy + Math.sin(a) * len);
      }
      g.stroke();
    }

    const tileCache = new Map();
    function hexTile(spacing, radius, color, scale) {
      const key = [spacing, radius.toFixed(2), color, Math.round(scale * 100)].join('|');
      const cached = tileCache.get(key);
      if (cached) return cached;
      const S = Math.max(4, Math.round(spacing * scale));
      const H = Math.max(4, Math.round(spacing * Math.sqrt(3) * scale));
      const tile = document.createElement('canvas');
      tile.width = S;
      tile.height = H;
      const pen = tile.getContext('2d');
      pen.fillStyle = color;
      const r = Math.max(0.6, radius * scale);
      for (const [x, y] of [[S / 2, H / 4], [0, (3 * H) / 4], [S, (3 * H) / 4]]) {
        pen.beginPath();
        pen.arc(x, y, r, 0, Math.PI * 2);
        pen.fill();
      }
      tileCache.set(key, tile);
      if (tileCache.size > 48) tileCache.delete(tileCache.keys().next().value);
      return tile;
    }

    function dots(g, w, h, spacing, radius, angle, ox, oy, color, scale) {
      const pattern = g.createPattern(hexTile(spacing, radius, color, scale), 'repeat');
      if (!pattern) return;
      pattern.setTransform(new DOMMatrix().scale(1 / scale));
      g.save();
      g.translate(w / 2 + ox, h / 2 + oy);
      g.rotate(angle);
      g.fillStyle = pattern;
      const reach = Math.hypot(w, h);
      g.fillRect(-reach, -reach, reach * 2, reach * 2);
      g.restore();
    }

    function paintLayer(g, w, h, t, index, scale) {
      const prm = p();
      const f = field(t);
      const spacing = Math.max(2, prm.spacing);
      const lw = Math.max(0.65, spacing * prm.duty);
      const color = index === 0 ? prm.ink : prm.ink2;
      const reach = Math.hypot(w, h) * 0.52 + spacing;
      const { cx, cy } = centers(w, h, f, index);

      if (prm.mode === 'cercles') {
        const phase = (index === 0 ? -1 : 1) * f.cycle * spacing;
        rings(g, cx, cy, spacing, lw, phase, color, reach);
      } else if (prm.mode === 'spirales') {
        const chir = index === 0 ? 1 : (prm.oppose ? -1 : 1);
        const rot = f.phase + f.cycle * Math.PI * 2 * f.spin + (index === 1 ? prm.delta * Math.PI / 180 : 0);
        spiral(g, cx, cy, spacing, rot, chir, color, lw, reach);
      } else if (prm.mode === 'traits') {
        const angle = prm.angle * Math.PI / 180 + (index === 1 ? prm.delta * Math.PI / 180 : 0);
        const shift = f.lat * spacing + (index === 1 ? f.cycle * spacing : 0);
        if (prm.onde > 0.01) waves(g, w, h, angle, spacing, lw, shift, color, f.cycle, index);
        else lines(g, w, h, angle, spacing, lw, shift, color);
      } else if (prm.mode === 'rayons') {
        const n = Math.max(3, Math.round(prm.branches) || 3);
        const rot = f.phase + (index === 1 ? prm.delta * Math.PI / 180 + f.cycle * Math.PI * 2 * f.spin : 0);
        rays(g, cx, cy, n, lw, rot, color, reach);
      } else {
        const angle = prm.angle * Math.PI / 180 + (index === 1 ? prm.delta * Math.PI / 180 : 0);
        const ox = (index === 1 ? f.cycle : f.lat) * spacing;
        const oy = index === 0 ? f.lat * spacing * 0.5 : 0;
        dots(g, w, h, spacing, Math.max(0.65, spacing * prm.duty * 0.5), angle, ox, oy, color, scale || 1);
      }
    }

    function fillCover(g, color) {
      g.save();
      g.setTransform(1, 0, 0, 1, 0, 0);
      g.fillStyle = color;
      g.fillRect(0, 0, g.canvas.width, g.canvas.height);
      g.restore();
    }

    function drawScene(g, w, h, t, scale) {
      fillCover(g, p().papier);
      g.setTransform(scale, 0, 0, scale, 0, 0);
      g.globalCompositeOperation = 'source-over';
      paintLayer(g, w, h, t, 0, scale);
      g.globalCompositeOperation = BLEND[p().fusion] || 'source-over';
      paintLayer(g, w, h, t, 1, scale);
      g.globalCompositeOperation = 'source-over';
    }

    function scratch(w, h, scale, reuse, slot) {
      const W = Math.max(1, Math.round(w * scale));
      const H = Math.max(1, Math.round(h * scale));
      let c = reuse ? slot.current : null;
      if (!c || c.width !== W || c.height !== H) {
        c = document.createElement('canvas');
        c.width = W;
        c.height = H;
        if (reuse) slot.current = c;
      }
      const g = c.getContext('2d');
      g.setTransform(1, 0, 0, 1, 0, 0);
      g.clearRect(0, 0, W, H);
      return c;
    }
    const sceneSlot = { current: null };
    const maskSlot = { current: null };

    // Le mot est d'abord dessiné en une seule forme : destination-in lettre par lettre
    // ne garde que l'intersection, et la deuxième lettre efface la première.
    function shapeMask(w, h, scale, kind, reuse) {
      const buf = scratch(w, h, scale, reuse, maskSlot);
      const g = buf.getContext('2d');
      g.setTransform(scale, 0, 0, scale, 0, 0);
      g.fillStyle = '#000';
      if (kind === 'disque') drawDisc(g, w, h);
      else if (kind === 'logo') drawLogo(g, w, h);
      else drawWord(g, w, h, '#000');
      return buf;
    }

    function render(g, w, h, scale, t, reuse) {
      const kind = maskKind();
      if (kind === 'none' || kind === 'titre') {
        drawScene(g, w, h, t, scale);
        if (kind === 'titre') {
          g.setTransform(scale, 0, 0, scale, 0, 0);
          if (logoReady()) drawLogo(g, w, h);
          else drawWord(g, w, h, hex(p().aplat, '#141210'));
        }
        return;
      }
      const buf = scratch(w, h, scale, reuse, sceneSlot);
      const b = buf.getContext('2d');
      drawScene(b, w, h, t, scale);
      const mask = shapeMask(w, h, scale, kind, reuse);
      b.setTransform(scale, 0, 0, scale, 0, 0);
      b.globalCompositeOperation = p().masque === 'reserve' ? 'destination-out' : 'destination-in';
      b.drawImage(mask, 0, 0, w, h);
      b.globalCompositeOperation = 'source-over';
      fillCover(g, hex(p().aplat, '#141210'));
      g.setTransform(scale, 0, 0, scale, 0, 0);
      g.drawImage(buf, 0, 0, w, h);
    }

    function layerSVG(w, h, t, index) {
      const prm = p();
      const f = field(t);
      const spacing = Math.max(2, prm.spacing);
      const lw = Math.max(0.65, spacing * prm.duty);
      const color = hex(index === 0 ? prm.ink : prm.ink2, '#141210');
      const reach = Math.hypot(w, h) * 0.52 + spacing;
      const { cx, cy } = centers(w, h, f, index);
      const sw = `fill="none" stroke="${color}" stroke-width="${f2(lw)}"`;

      if (prm.mode === 'cercles') {
        const phase = (index === 0 ? -1 : 1) * f.cycle * spacing;
        const off = ((phase % spacing) + spacing) % spacing;
        let out = '';
        for (let r = off < 0.5 ? off + spacing : off; r < reach; r += spacing) {
          out += `<circle cx="${f2(cx)}" cy="${f2(cy)}" r="${f2(r)}" ${sw}/>`;
        }
        return out;
      }
      if (prm.mode === 'spirales') {
        const chir = index === 0 ? 1 : (prm.oppose ? -1 : 1);
        const rot = f.phase + f.cycle * Math.PI * 2 * f.spin + (index === 1 ? prm.delta * Math.PI / 180 : 0);
        let d = '';
        visitSpiral(cx, cy, spacing, rot, chir, reach, (seg) => {
          if (seg.op === 'M') d += `M${f2(seg.x)} ${f2(seg.y)}`;
          else d += `A${f2(seg.r)} ${f2(seg.r)} 0 0 ${seg.acw ? 0 : 1} ${f2(seg.x)} ${f2(seg.y)}`;
        });
        return `<path d="${d}" ${sw} stroke-linejoin="round" stroke-linecap="round"/>`;
      }
      if (prm.mode === 'traits') {
        const angle = prm.angle * Math.PI / 180 + (index === 1 ? prm.delta * Math.PI / 180 : 0);
        const shift = f.lat * spacing + (index === 1 ? f.cycle * spacing : 0);
        const diag = Math.hypot(w, h);
        const phase = ((shift % spacing) + spacing) % spacing;
        const cos = Math.cos(angle);
        const sin = Math.sin(angle);
        const amp = prm.onde > 0.01 ? prm.onde * spacing * 1.2 : 0;
        const freq = (Math.PI * 2) / (spacing * (7 - prm.onde * 3.2));
        const wobble = f.cycle * Math.PI * 2 + index * 1.3;
        const step = Math.max(5, spacing * 0.42);
        let out = '';
        const X = (x, y) => w / 2 + x * cos - y * sin;
        const Y = (x, y) => h / 2 + x * sin + y * cos;
        for (let x = -diag + phase; x <= diag + spacing; x += spacing) {
          if (amp === 0) {
            out += `<line x1="${f2(X(x, -diag))}" y1="${f2(Y(x, -diag))}" x2="${f2(X(x, diag))}" y2="${f2(Y(x, diag))}" ${sw}/>`;
          } else {
            let d = '';
            let i = 0;
            for (let y = -diag; y <= diag + step; y += step) {
              const xx = x + Math.sin(y * freq + wobble) * amp;
              d += `${i++ === 0 ? 'M' : 'L'}${f2(X(xx, y))} ${f2(Y(xx, y))}`;
            }
            out += `<path d="${d}" ${sw} stroke-linejoin="round"/>`;
          }
        }
        return out;
      }
      if (prm.mode === 'rayons') {
        const n = Math.max(3, Math.round(prm.branches) || 3);
        const rot = f.phase + (index === 1 ? prm.delta * Math.PI / 180 + f.cycle * Math.PI * 2 * f.spin : 0);
        let out = '';
        for (let i = 0; i < n; i++) {
          const a = rot + (i / n) * Math.PI * 2;
          out += `<line x1="${f2(cx)}" y1="${f2(cy)}" x2="${f2(cx + Math.cos(a) * reach)}" y2="${f2(cy + Math.sin(a) * reach)}" ${sw}/>`;
        }
        return out;
      }
      const angle = prm.angle * Math.PI / 180 + (index === 1 ? prm.delta * Math.PI / 180 : 0);
      const ox = (index === 1 ? f.cycle : f.lat) * spacing;
      const oy = index === 0 ? f.lat * spacing * 0.5 : 0;
      const radius = Math.max(0.65, spacing * prm.duty * 0.5);
      const cos = Math.cos(angle);
      const sin = Math.sin(angle);
      const reachD = Math.hypot(w, h) * 0.5 + spacing * 2;
      const rowH = spacing * Math.sqrt(3) / 2;
      let out = '';
      const j0 = Math.floor(-reachD / rowH) - 1;
      const j1 = Math.ceil(reachD / rowH) + 1;
      const i0 = Math.floor(-reachD / spacing) - 2;
      const i1 = Math.ceil(reachD / spacing) + 2;
      for (let j = j0; j <= j1; j++) {
        const y = j * rowH;
        const xoff = (j & 1) ? spacing * 0.5 : 0;
        for (let i = i0; i <= i1; i++) {
          const x = i * spacing + xoff;
          const sx = w / 2 + ox + x * cos - y * sin;
          const sy = h / 2 + oy + x * sin + y * cos;
          if (sx < -radius || sy < -radius || sx > w + radius || sy > h + radius) continue;
          out += `<circle cx="${f2(sx)}" cy="${f2(sy)}" r="${f2(radius)}" fill="${color}"/>`;
        }
      }
      return out;
    }

    function wordSVG(w, h, fill) {
      const lay = layoutWord(ctx, w, h);
      if (!lay) return '';
      const y = h * 0.5 + lay.size * 0.045;
      let x = (w - lay.width) / 2;
      let out = '';
      for (let i = 0; i < lay.chars.length; i++) {
        out += `<text x="${f2(x)}" y="${f2(y)}" fill="${fill}" font-family="Atelier Mot, Lato, sans-serif" font-weight="900" font-size="${f2(lay.size)}" dominant-baseline="middle">${esc(lay.chars[i])}</text>`;
        x += lay.widths[i] + lay.track;
      }
      return out;
    }

    function logoBox(w, h) {
      const img = p().logo;
      const maxW = w * 0.7;
      const maxH = h * 0.62;
      const s = Math.min(maxW / img.naturalWidth, maxH / img.naturalHeight);
      const dw = img.naturalWidth * s;
      const dh = img.naturalHeight * s;
      return { x: (w - dw) / 2, y: (h - dh) / 2, dw, dh };
    }

    function logoSVG(w, h) {
      const box = logoBox(w, h);
      const c = document.createElement('canvas');
      c.width = p().logo.naturalWidth;
      c.height = p().logo.naturalHeight;
      c.getContext('2d').drawImage(p().logo, 0, 0);
      const href = c.toDataURL('image/png');
      return `<image href="${href}" x="${f2(box.x)}" y="${f2(box.y)}" width="${f2(box.dw)}" height="${f2(box.dh)}"/>`;
    }

    function fontDefs() {
      if (!fontB64) return '';
      return `<style>@font-face{font-family:"Atelier Mot";src:url("data:font/ttf;base64,${fontB64}") format("truetype");font-weight:900;}</style>`;
    }

    function toSVG() {
      const { w, h } = app.size;
      const t = app.time;
      const kind = maskKind();
      const papier = hex(p().papier, '#f4efe6');
      const aplat = hex(p().aplat, '#141210');
      const mix = MIX[p().fusion] || 'normal';
      const scene = `<rect width="${w}" height="${h}" fill="${papier}"/>${layerSVG(w, h, t, 0)}<g style="mix-blend-mode:${mix}">${layerSVG(w, h, t, 1)}</g>`;
      let defs = '';
      let body = scene;
      if (kind === 'titre') {
        const mark = logoReady() ? logoSVG(w, h) : wordSVG(w, h, aplat);
        if (!logoReady()) defs = fontDefs();
        body = `${scene}${mark}`;
      } else if (kind === 'disque') {
        const r = Math.min(w, h) * p().sceau * 0.5;
        defs = `<clipPath id="m"><circle cx="${f2(w / 2)}" cy="${f2(h / 2)}" r="${f2(r)}"/></clipPath>`;
        body = `<rect width="${w}" height="${h}" fill="${aplat}"/><g clip-path="url(#m)">${scene}</g>`;
      } else if (kind === 'text' && p().masque !== 'reserve') {
        defs = `${fontDefs()}<clipPath id="m">${wordSVG(w, h, '#000')}</clipPath>`;
        body = `<rect width="${w}" height="${h}" fill="${aplat}"/><g clip-path="url(#m)">${scene}</g>`;
      } else if (kind === 'text') {
        defs = `${fontDefs()}<mask id="m" maskUnits="userSpaceOnUse" x="0" y="0" width="${w}" height="${h}"><rect width="${w}" height="${h}" fill="#fff"/>${wordSVG(w, h, '#000')}</mask>`;
        body = `<rect width="${w}" height="${h}" fill="${aplat}"/><g mask="url(#m)">${scene}</g>`;
      } else if (kind === 'logo' && p().masque !== 'reserve') {
        defs = `<mask id="m" maskUnits="userSpaceOnUse" x="0" y="0" width="${w}" height="${h}" style="mask-type:alpha">${logoSVG(w, h)}</mask>`;
        body = `<rect width="${w}" height="${h}" fill="${aplat}"/><g mask="url(#m)">${scene}</g>`;
      } else if (kind === 'logo') {
        defs = `<mask id="logoA" maskUnits="userSpaceOnUse" x="0" y="0" width="${w}" height="${h}" style="mask-type:alpha">${logoSVG(w, h)}</mask><mask id="m" maskUnits="userSpaceOnUse" x="0" y="0" width="${w}" height="${h}"><rect width="${w}" height="${h}" fill="#fff"/><rect width="${w}" height="${h}" fill="#000" mask="url(#logoA)"/></mask>`;
        body = `<rect width="${w}" height="${h}" fill="${aplat}"/><g mask="url(#m)">${scene}</g>`;
      }
      const defsTag = defs ? `<defs>${defs}</defs>` : '';
      return `<?xml version="1.0" encoding="UTF-8"?>\n<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">${defsTag}${body}</svg>`;
    }

    const shared = {
      mode: 'cercles', spacing: 22, duty: 0.34, angle: 12, delta: 4, separation: 0.2,
      branches: 64, oppose: true, onde: 0,
      papier: '#f4efe6', aplat: '#141210', ink: '#141210', ink2: '#e23b24', fusion: 'multiply',
      text: 'ATELIER', masque: 'titre', approche: -0.046, corps: 1.12, sceau: 0.74,
    };

    app = Atelier.app({
      stage: canvas,
      animate: true,
      seed: 48231,
      params: {
        'Trame': {
          mode: { type: 'select', label: 'Famille', value: 'cercles', options: { cercles: 'Cercles', spirales: 'Spirales', traits: 'Traits', rayons: 'Rayons', points: 'Points' } },
          spacing: { type: 'range', label: 'Pas', min: 6, max: 48, step: 1, value: 22 },
          duty: { type: 'range', label: 'Graisse', min: 0.06, max: 0.82, step: 0.01, value: 0.34 },
          angle: { type: 'range', label: 'Inclinaison', min: -90, max: 90, step: 1, value: 12, show: (q) => q.mode === 'traits' || q.mode === 'points' },
          delta: { type: 'range', label: 'Décalage', min: 0, max: 36, step: 0.5, value: 4, show: (q) => q.mode !== 'cercles' },
          separation: { type: 'range', label: 'Centres', min: 0, max: 0.48, step: 0.005, value: 0.2, show: (q) => q.mode === 'cercles' || q.mode === 'spirales' || q.mode === 'rayons' },
          branches: { type: 'range', label: 'Faisceaux', min: 8, max: 160, step: 1, value: 64, show: (q) => q.mode === 'rayons' },
          onde: { type: 'range', label: 'Ondulation', min: 0, max: 1, step: 0.01, value: 0, show: (q) => q.mode === 'traits' },
          oppose: { type: 'toggle', label: 'Sens opposés', value: true, show: (q) => q.mode === 'spirales' },
        },
        'Couleur': {
          papier: { type: 'color', label: 'Papier', value: '#f4efe6' },
          aplat: { type: 'color', label: 'Aplat', value: '#141210', show: (q) => q.masque !== 'plein' },
          ink: { type: 'color', label: 'Encre', value: '#141210' },
          ink2: { type: 'color', label: 'Seconde', value: '#e23b24' },
          fusion: { type: 'select', label: 'Fusion', value: 'multiply', options: { over: 'Normale', multiply: 'Produit', screen: 'Écran', overlay: 'Incrustation', difference: 'Différence', exclusion: 'Exclusion' } },
        },
        'Marque': {
          text: { type: 'text', label: 'Texte', value: 'ATELIER', maxlength: 22 },
          masque: { type: 'select', label: 'Cadre', value: 'titre', options: { titre: 'Titre posé', plein: 'Plein cadre', disque: 'Disque', mot: 'Dans le mot', reserve: 'Réserve' } },
          approche: { type: 'range', label: 'Approche', min: -0.08, max: 0.16, step: 0.002, value: -0.046, show: (q) => (q.masque === 'mot' || q.masque === 'reserve' || q.masque === 'titre') && !(q.logo && q.logo.naturalWidth) },
          corps: { type: 'range', label: 'Corps', min: 0.4, max: 1.7, step: 0.01, value: 1.12, show: (q) => (q.masque === 'mot' || q.masque === 'reserve' || q.masque === 'titre') && !(q.logo && q.logo.naturalWidth) },
          sceau: { type: 'range', label: 'Diamètre', min: 0.28, max: 0.98, step: 0.01, value: 0.74, show: (q) => q.masque === 'disque' },
          logo: { type: 'file', label: 'Logo', accept: 'image/*', button: 'Importer un logo' },
        },
      },
      presets: {
        Affiche: { ...shared, seed: 48231 },
        Lettrage: {
          ...shared, masque: 'mot', papier: '#f3ecdf', aplat: '#0c0c0b', ink: '#161513', ink2: '#e23b24',
          spacing: 16, duty: 0.3, separation: 0.16, corps: 1.02, seed: 12044,
        },
        'Deux encres': {
          ...shared, mode: 'spirales', masque: 'plein', papier: '#f6f0e4', ink: '#1a3f8b', ink2: '#ef3d1e',
          spacing: 14, duty: 0.22, separation: 0.13, delta: 16, oppose: true, seed: 90812,
        },
        Registre: {
          ...shared, mode: 'traits', masque: 'plein', papier: '#f7f4ee', ink: '#0c6e8a', ink2: '#d0126a',
          spacing: 9, duty: 0.2, angle: 6, delta: 2, onde: 0, seed: 33017,
        },
        Sceau: {
          ...shared, mode: 'spirales', masque: 'disque', papier: '#e7d3a2', aplat: '#100e0c',
          ink: '#21180f', ink2: '#8d3418', spacing: 11, duty: 0.26, separation: 0.07, delta: 12, sceau: 0.7, seed: 67120,
        },
        Réserve: {
          ...shared, mode: 'traits', masque: 'reserve', papier: '#12110f', aplat: '#f3ecdf', ink: '#f4efe6', ink2: '#ff4d2a',
          fusion: 'screen', spacing: 13, duty: 0.22, angle: 82, delta: 3.5, onde: 0.48, corps: 1.08, seed: 25008,
        },
      },
      notes: 'À vitesse 1, le motif boucle toutes les 6 secondes. Un logo importé remplace le texte comme forme.',
      export: {
        png: (scale) => {
          const { w, h } = app.size;
          const c = document.createElement('canvas');
          c.width = Math.max(1, Math.round(w * scale));
          c.height = Math.max(1, Math.round(h * scale));
          render(c.getContext('2d'), w, h, scale, app.time, false);
          return c;
        },
        svg: () => toSVG(),
        video: true,
        name: 'moire',
      },
      onChange: () => paint(),
      onSeed: () => paint(),
      onResize: () => paint(),
    });

    function paint() {
      const { w, h, dpr } = app.size;
      if (w < 2 || h < 2) return;
      render(ctx, w, h, dpr, app.time, true);
    }

    document.fonts.load('900 80px "Atelier Mot"').then(() => paint()).catch(() => {});
    paint();
    app.loop(() => paint());
  </script>
</body>
</html>
