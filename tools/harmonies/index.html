<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Harmonies de couleurs</title>
  <style>
    :root { --bg: #0f0f12; --panel: rgba(24,24,29,.92); --ink: #f1efe9; --muted: #96939c; --line: #2a2a31; --accent: #ff5a36; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 13px/1.4 system-ui, sans-serif; overflow: hidden; }
    #swatches { position: fixed; inset: 0; display: flex; }
    .sw { flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: flex-end; padding: 20px 16px 24px; cursor: pointer; border: 0; text-align: left; font: inherit; transition: flex .3s; }
    .sw:hover { flex: 1.25; }
    .sw b { font: 600 18px ui-monospace, monospace; letter-spacing: .02em; }
    .sw small { opacity: .7; font: 12px ui-monospace, monospace; margin-top: 2px; }
    .sw .copied { opacity: 0; font-weight: 600; transition: opacity .2s; margin-bottom: 6px; }
    .sw.flash .copied { opacity: 1; }
    .panel { position: fixed; top: 16px; left: 16px; width: 260px; max-height: calc(100vh - 32px); overflow: auto; background: var(--panel); backdrop-filter: blur(8px); border: 1px solid var(--line); border-radius: 12px; padding: 14px; display: grid; gap: 12px; }
    .panel h1 { font-size: 14px; margin: 0; }
    .panel label { display: grid; gap: 4px; color: var(--muted); }
    .panel label span { display: flex; justify-content: space-between; }
    .panel output { color: var(--ink); font-variant-numeric: tabular-nums; }
    input[type=range], select { width: 100%; accent-color: var(--accent); }
    input[type=color] { width: 100%; height: 36px; border: 0; padding: 0; background: none; cursor: pointer; }
    select { background: #2a2a31; color: var(--ink); border: 0; border-radius: 6px; padding: 6px; font: inherit; }
    .row { display: flex; gap: 8px; }
    button.b { flex: 1; border: 0; border-radius: 8px; padding: 8px; font: 600 13px system-ui; cursor: pointer; background: #2a2a31; color: var(--ink); }
    button.primary { background: var(--accent); color: #fff; }
    @media (max-width: 600px) {
      #swatches { flex-direction: column; bottom: 45vh; }
      .sw { flex-direction: row; justify-content: space-between; align-items: center; padding: 8px 16px; }
      .sw:hover { flex: 1; }
      .sw .copied { margin: 0; }
      .panel { top: auto; bottom: 0; right: 0; left: 0; width: auto; max-height: 45vh; border-radius: 12px 12px 0 0; }
    }
  </style>
</head>
<body>
  <div id="swatches"></div>
  <aside class="panel" data-ui>
    <h1>Harmonies de couleurs</h1>
    <label><span>Couleur de base</span><input id="base" type="color" value="#ff5a36"></label>
    <label><span>Harmonie</span>
      <select id="mode">
        <option value="analogous">Analogue</option>
        <option value="complementary">Complémentaire</option>
        <option value="split">Complémentaire divisée</option>
        <option value="triad">Triade</option>
        <option value="tetrad">Tétrade</option>
        <option value="mono">Monochrome</option>
      </select>
    </label>
    <label><span>Nombre de couleurs <output></output></span><input id="count" type="range" min="3" max="8" value="5"></label>
    <label><span>Écart de luminosité <output></output></span><input id="spread" type="range" min="0" max="0.5" step="0.01" value="0.25"></label>
    <label><span>Chroma <output></output></span><input id="chroma" type="range" min="0.2" max="1.5" step="0.05" value="1"></label>
    <div class="row">
      <button class="b" id="random">Aléatoire</button>
      <button class="b" id="css">Copier CSS</button>
    </div>
    <button class="b primary" id="save">Exporter PNG</button>
  </aside>
  <script>
    const $ = (id) => document.getElementById(id);

    // Conversions sRGB <-> OKLab <-> OKLCH (Björn Ottosson).
    const toLin = (c) => (c <= 0.04045 ? c / 12.92 : ((c + 0.055) / 1.055) ** 2.4);
    const toGam = (c) => (c <= 0.0031308 ? 12.92 * c : 1.055 * c ** (1 / 2.4) - 0.055);
    function hexToOklch(hex) {
      const [r, g, b] = [1, 3, 5].map((i) => toLin(parseInt(hex.slice(i, i + 2), 16) / 255));
      const l = Math.cbrt(0.4122214708 * r + 0.5363325363 * g + 0.0514459929 * b);
      const m = Math.cbrt(0.2119034982 * r + 0.6806995451 * g + 0.1073969566 * b);
      const s = Math.cbrt(0.0883024619 * r + 0.2817188376 * g + 0.6299787005 * b);
      const L = 0.2104542553 * l + 0.793617785 * m - 0.0040720468 * s;
      const A = 1.9779984951 * l - 2.428592205 * m + 0.4505937099 * s;
      const B = 0.0259040371 * l + 0.7827717662 * m - 0.808675766 * s;
      return { L, C: Math.hypot(A, B), H: ((Math.atan2(B, A) * 180) / Math.PI + 360) % 360 };
    }
    function oklchToRgb({ L, C, H }) {
      const a = C * Math.cos((H * Math.PI) / 180), b = C * Math.sin((H * Math.PI) / 180);
      const l = (L + 0.3963377774 * a + 0.2158037573 * b) ** 3;
      const m = (L - 0.1055613458 * a - 0.0638541728 * b) ** 3;
      const s = (L - 0.0894841775 * a - 1.291485548 * b) ** 3;
      return [
        4.0767416621 * l - 3.3077115913 * m + 0.2309699292 * s,
        -1.2684380046 * l + 2.6097574011 * m - 0.3413193965 * s,
        -0.0041960863 * l - 0.7034186147 * m + 1.707614701 * s,
      ].map(toGam);
    }
    // Réduit le chroma jusqu'à rentrer dans le gamut sRGB.
    function toHex(c) {
      let lo = 0, hi = c.C, rgb = oklchToRgb(c);
      const inGamut = (v) => v.every((x) => x >= -1e-4 && x <= 1 + 1e-4);
      if (!inGamut(rgb)) {
        for (let i = 0; i < 20; i++) {
          const mid = (lo + hi) / 2;
          inGamut(oklchToRgb({ ...c, C: mid })) ? (lo = mid) : (hi = mid);
        }
        rgb = oklchToRgb({ ...c, C: lo });
      }
      return '#' + rgb.map((x) => Math.round(Math.min(1, Math.max(0, x)) * 255).toString(16).padStart(2, '0')).join('');
    }

    const OFFSETS = {
      analogous: [-40, -20, 0, 20, 40],
      complementary: [0, 180],
      split: [0, 150, 210],
      triad: [0, 120, 240],
      tetrad: [0, 90, 180, 270],
      mono: [0],
    };

    let palette = [];
    function generate() {
      const base = hexToOklch($('base').value);
      const n = +$('count').value, spread = +$('spread').value, k = +$('chroma').value;
      const offs = OFFSETS[$('mode').value];
      palette = Array.from({ length: n }, (_, i) => {
        const t = n === 1 ? 0 : i / (n - 1) - 0.5;
        const H = (base.H + offs[i % offs.length] + 360) % 360;
        const L = Math.min(0.97, Math.max(0.15, base.L + t * spread * 2));
        return toHex({ L, C: base.C * k, H });
      });
      render();
    }

    function render() {
      $('swatches').replaceChildren(...palette.map((hex) => {
        const el = document.createElement('button');
        el.className = 'sw';
        el.style.background = hex;
        el.style.color = hexToOklch(hex).L > 0.65 ? '#111' : '#fff';
        el.innerHTML = `<span class="copied">Copié</span><b>${hex.toUpperCase()}</b><small>${fmt(hex)}</small>`;
        el.setAttribute('aria-label', `Copier ${hex}`);
        el.onclick = () => copy(hex, el);
        return el;
      }));
    }
    const fmt = (hex) => { const { L, C, H } = hexToOklch(hex); return `oklch(${(L * 100).toFixed(1)}% ${C.toFixed(3)} ${H.toFixed(0)})`; };

    async function copy(text, el) {
      try { await navigator.clipboard.writeText(text); } catch { /* presse-papiers indisponible */ }
      if (el) { el.classList.add('flash'); setTimeout(() => el.classList.remove('flash'), 900); }
    }

    document.querySelectorAll('input, select').forEach((el) => {
      const out = el.closest('label')?.querySelector('output');
      const sync = () => { if (out) out.textContent = el.value; };
      sync();
      el.addEventListener('input', () => { sync(); generate(); });
      el.addEventListener('change', () => { sync(); generate(); });
    });
    $('random').onclick = () => {
      $('base').value = toHex({ L: 0.55 + Math.random() * 0.25, C: 0.08 + Math.random() * 0.14, H: Math.random() * 360 });
      $('mode').selectedIndex = Math.floor(Math.random() * $('mode').options.length);
      generate();
    };
    $('css').onclick = () => copy(':root {\n' + palette.map((h, i) => `  --color-${i + 1}: ${h};`).join('\n') + '\n}');
    $('save').onclick = () => {
      const c = document.createElement('canvas');
      c.width = 200 * palette.length; c.height = 400;
      const x = c.getContext('2d');
      palette.forEach((h, i) => {
        x.fillStyle = h; x.fillRect(i * 200, 0, 200, 400);
        x.fillStyle = hexToOklch(h).L > 0.65 ? '#111' : '#fff';
        x.font = '600 20px ui-monospace, monospace';
        x.fillText(h.toUpperCase(), i * 200 + 16, 376);
      });
      const a = document.createElement('a');
      a.download = 'palette.png';
      a.href = c.toDataURL('image/png');
      a.click();
    };

    generate();
  </script>
</body>
</html>
