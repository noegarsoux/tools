<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Harmonies de couleurs</title>
  <link rel="stylesheet" href="../../assets/ui/atelier.css">
  <style>
    #swatches { display: flex; }
    .sw { flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: flex-end; padding: 20px 16px 24px; cursor: pointer; border: 0; text-align: left; font: inherit; transition: flex .3s; }
    .sw:hover { flex: 1.25; }
    .sw b { font: 600 18px var(--at-mono); letter-spacing: .02em; }
    .sw small { opacity: .7; font: 11px var(--at-mono); margin-top: 2px; }
    .sw .copied { opacity: 0; font-weight: 600; transition: opacity .2s; margin-bottom: 6px; }
    .sw.flash .copied { opacity: 1; }
    @media (max-width: 720px) {
      #swatches { flex-direction: column; }
      .sw { flex-direction: row; justify-content: space-between; align-items: center; padding: 6px 16px; }
      .sw b { font-size: 14px; }
      .sw:hover { flex: 1; }
      .sw .copied { margin: 0; }
    }
  </style>
</head>
<body>
  <div id="swatches" class="at-fill"></div>
  <script src="../../assets/ui/atelier.js"></script>
  <script>
    const $ = (id) => document.getElementById(id);

    // Conversions sRGB <-> OKLab <-> OKLCH (Björn Ottosson).
    const toLin = (c) => (c <= 0.04045 ? c / 12.92 : ((c + 0.055) / 1.055) ** 2.4);
    const toGam = (c) => (c <= 0.0031308 ? 12.92 * c : 1.055 * c ** (1 / 2.4) - 0.055);
    function hexToOklch(hex) {
      const [r, g, b] = [1, 3, 5].map((i) => toLin(parseInt(hex.slice(i, i + 2), 16) / 255));
      const l = Math.cbrt(0.4122214708 * r + 0.5363325363 * g + 0.0514459929 * b);
      const m = Math.cbrt(0.2119034982 * r + 0.6806995451 * g + 0.1073969566 * b);
      const s = Math.cbrt(0.0883024619 * r + 0.2817188376 * g + 0.6299787005 * b);
      const L = 0.2104542553 * l + 0.793617785 * m - 0.0040720468 * s;
      const A = 1.9779984951 * l - 2.428592205 * m + 0.4505937099 * s;
      const B = 0.0259040371 * l + 0.7827717662 * m - 0.808675766 * s;
      return { L, C: Math.hypot(A, B), H: ((Math.atan2(B, A) * 180) / Math.PI + 360) % 360 };
    }
    function oklchToRgb({ L, C, H }) {
      const a = C * Math.cos((H * Math.PI) / 180), b = C * Math.sin((H * Math.PI) / 180);
      const l = (L + 0.3963377774 * a + 0.2158037573 * b) ** 3;
      const m = (L - 0.1055613458 * a - 0.0638541728 * b) ** 3;
      const s = (L - 0.0894841775 * a - 1.291485548 * b) ** 3;
      return [
        4.0767416621 * l - 3.3077115913 * m + 0.2309699292 * s,
        -1.2684380046 * l + 2.6097574011 * m - 0.3413193965 * s,
        -0.0041960863 * l - 0.7034186147 * m + 1.707614701 * s,
      ].map(toGam);
    }
    // Réduit le chroma jusqu'à rentrer dans le gamut sRGB.
    function toHex(c) {
      let lo = 0, hi = c.C, rgb = oklchToRgb(c);
      const inGamut = (v) => v.every((x) => x >= -1e-4 && x <= 1 + 1e-4);
      if (!inGamut(rgb)) {
        for (let i = 0; i < 20; i++) {
          const mid = (lo + hi) / 2;
          inGamut(oklchToRgb({ ...c, C: mid })) ? (lo = mid) : (hi = mid);
        }
        rgb = oklchToRgb({ ...c, C: lo });
      }
      return '#' + rgb.map((x) => Math.round(Math.min(1, Math.max(0, x)) * 255).toString(16).padStart(2, '0')).join('');
    }

    const OFFSETS = {
      analogous: [-40, -20, 0, 20, 40],
      complementary: [0, 180],
      split: [0, 150, 210],
      triad: [0, 120, 240],
      tetrad: [0, 90, 180, 270],
      mono: [0],
    };

    let palette = [];
    const app = Atelier.app({
      stage: $('swatches'),
      params: {
        'Base': {
          base: { type: 'color', label: 'Couleur', value: '#ff5a36' },
          mode: { type: 'select', label: 'Harmonie', value: 'analogous', options: { analogous: 'Analogue', complementary: 'Complémentaire', split: 'Compl. divisée', triad: 'Triade', tetrad: 'Tétrade', mono: 'Monochrome' } },
        },
        'Palette': {
          count: { type: 'range', label: 'Couleurs', min: 3, max: 8, step: 1, value: 5 },
          spread: { type: 'range', label: 'Luminosité', min: 0, max: 0.5, step: 0.01, value: 0.25 },
          chroma: { type: 'range', label: 'Chroma', min: 0.2, max: 1.5, step: 0.05, value: 1 },
        },
      },
      presets: {
        'Corail': { base: '#ff5a36', mode: 'analogous', count: 5, spread: 0.25, chroma: 1 },
        'Électrique': { base: '#3a5cff', mode: 'split', count: 5, spread: 0.3, chroma: 1.3 },
        'Forêt': { base: '#2f7d4f', mode: 'mono', count: 6, spread: 0.4, chroma: 0.8 },
        'Pop': { base: '#ff2e88', mode: 'triad', count: 6, spread: 0.2, chroma: 1.2 },
        'Sable': { base: '#c8a27a', mode: 'complementary', count: 5, spread: 0.35, chroma: 0.5 },
      },
      export: {
        name: 'palette',
        png: (scale) => {
          const c = document.createElement('canvas');
          c.width = 200 * palette.length * scale; c.height = 400 * scale;
          const x = c.getContext('2d');
          x.scale(scale, scale);
          palette.forEach((h, i) => {
            x.fillStyle = h; x.fillRect(i * 200, 0, 200, 400);
            x.fillStyle = hexToOklch(h).L > 0.65 ? '#111' : '#fff';
            x.font = '600 20px ui-monospace, monospace';
            x.fillText(h.toUpperCase(), i * 200 + 16, 376);
          });
          return c;
        },
        svg: () => `<svg xmlns="http://www.w3.org/2000/svg" width="${palette.length * 200}" height="400">${palette.map((h, i) => `<rect x="${i * 200}" y="0" width="200" height="400" fill="${h}"/>`).join('')}</svg>`,
        extra: { 'Copier les variables CSS': () => copy(':root {\n' + palette.map((h, i) => `  --color-${i + 1}: ${h};`).join('\n') + '\n}') },
      },
      onChange: generate,
      onSeed() {
        const r = app.rng();
        app.set('base', toHex({ L: 0.55 + r() * 0.25, C: 0.08 + r() * 0.14, H: r() * 360 }), true);
        app.set('mode', Object.keys(OFFSETS)[Math.floor(r() * 6)], true);
        generate();
      },
    });
    const p = app.params;

    function generate() {
      const base = hexToOklch(p.base);
      const n = p.count, offs = OFFSETS[p.mode];
      palette = Array.from({ length: n }, (_, i) => {
        const t = n === 1 ? 0 : i / (n - 1) - 0.5;
        const H = (base.H + offs[i % offs.length] + 360) % 360;
        const L = Math.min(0.97, Math.max(0.15, base.L + t * p.spread * 2));
        return toHex({ L, C: base.C * p.chroma, H });
      });
      $('swatches').replaceChildren(...palette.map((hex) => {
        const el = document.createElement('div');
        el.className = 'sw';
        el.tabIndex = 0;
        el.setAttribute('role', 'button');
        el.style.background = hex;
        el.style.color = hexToOklch(hex).L > 0.65 ? '#111' : '#fff';
        el.innerHTML = `<span class="copied">Copié</span><b>${hex.toUpperCase()}</b><small>${fmt(hex)}</small>`;
        el.setAttribute('aria-label', `Copier ${hex}`);
        el.onclick = () => copy(hex, el);
        el.onkeydown = (e) => { if (e.key === 'Enter') copy(hex, el); };
        return el;
      }));
    }
    const fmt = (hex) => { const { L, C, H } = hexToOklch(hex); return `oklch(${(L * 100).toFixed(1)}% ${C.toFixed(3)} ${H.toFixed(0)})`; };

    async function copy(text, el) {
      try { await navigator.clipboard.writeText(text); } catch { /* presse-papiers indisponible */ }
      if (el) { el.classList.add('flash'); setTimeout(() => el.classList.remove('flash'), 900); }
    }

    generate();
  </script>
</body>
</html>
