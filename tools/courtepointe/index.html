<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Courtepointe</title>
  <link rel="stylesheet" href="../../assets/ui/atelier.css">
</head>
<body>
  <canvas></canvas>
  <script src="../../assets/ui/atelier.js"></script>
  <script>
    // Courtepointe : une grille de blocs de patchwork. Chaque bloc est un petit assemblage de pièces (triangles, rondins,
    // arcs) dessiné dans un carré unité, puis tourné d'un quart de tour. Une règle de rotation (losanges, zigzag,
    // moulinet…) fait naître le grand motif ; une vague fait pivoter les blocs les uns après les autres, et le motif
    // d'ensemble se recompose. Le logo est « piqué » à la manière des quilts pixelisés : blocs pleins à l'intérieur,
    // demi-carrés orientés le long du bord.
    const canvas = document.querySelector('canvas');
    const ctx = canvas.getContext('2d');
    const TAU = Math.PI * 2;
    const PAL = (k) => Atelier.PALETTES[k].colors;
    const BIEN = PAL('biennale'), MEN = PAL('menthe'), KB = PAL('kegelbahn');

    let simT = 0, extra = new Map(), logoM = null, logoKey = '', lastKey = '';

    const app = Atelier.app({
      stage: canvas,
      animate: true,
      seed: true,
      finish: { grain: 0.035, vignette: 0.08 },
      hint: 'Cliquez ou glissez sur les blocs pour les tourner · molette : nombre de blocs',
      notes: 'Le patchwork américain se construit bloc par bloc : un carré de tissu assemblé de quelques pièces, toujours les mêmes, qu\'on répète en les tournant. Un demi-carré (deux triangles) suffit déjà : selon l\'orientation de chacun, la courtepointe montre des losanges, des chevrons ou des moulinets. Les blocs ont des noms : le vol d\'oies, la cabane en rondins, le chemin d\'ivrogne aux quarts de cercle. À Gee\'s Bend, en Alabama, les quilteuses ont tiré de ces règles des compositions libres que les musées exposent aujourd\'hui comme de la peinture abstraite. Ici une vague tourne les blocs d\'un quart de tour, l\'un après l\'autre, et le grand motif se défait puis se recompose ; un clic tourne un bloc ; le logo est cousu en demi-carrés.',
      params: {
        'Blocs': {
          bloc: { type: 'select', label: 'Bloc', options: { melange: 'Mélange', demi: 'Demi-carrés', sablier: 'Sabliers', oies: 'Vol d\'oies', rondins: 'Cabane en rondins', chemin: 'Chemin d\'ivrogne', damier: 'Quatre carrés' }, value: 'demi' },
          regle: { type: 'select', label: 'Orientation', options: { losanges: 'Losanges', zigzag: 'Chevrons', moulinet: 'Moulinets', hasard: 'Au hasard' }, value: 'losanges' },
          blocs: { type: 'range', label: 'Blocs (petit côté)', min: 3, max: 24, step: 1, value: 8 },
          joint: { type: 'range', label: 'Bande entre blocs', min: 0, max: 0.2, step: 0.005, value: 0.04 },
        },
        'Mouvement': {
          onde: { type: 'segmented', label: 'Vague', options: { diagonale: 'Diagonale', centre: 'Du centre', hasard: 'Au hasard' }, value: 'diagonale' },
          vitesse: { type: 'range', label: 'Vitesse', min: 0, max: 2, step: 0.01, value: 0.5 },
          duree: { type: 'range', label: 'Durée d\'un quart de tour', min: 0.1, max: 1.5, step: 0.01, value: 0.5 },
        },
        'Tissus': {
          imprimes: { type: 'range', label: 'Tissus imprimés', min: 0, max: 1, step: 0.01, value: 0.25 },
          piqures: { type: 'toggle', label: 'Piqûres', value: true },
          relief: { type: 'range', label: 'Ombre des coutures', min: 0, max: 1, step: 0.01, value: 0.4 },
        },
        'Logo cousu': {
          logo: { type: 'toggle', label: 'Coudre le logo', value: false },
          tailleLogo: { type: 'range', label: 'Taille du logo', min: 0.3, max: 1.8, step: 0.01, value: 1.3, show: (q) => q.logo },
          image: { type: 'file', label: 'Logo', accept: 'image/*', show: (q) => q.logo },
        },
        'Couleurs': {
          fond: { type: 'color', label: 'Bandes', value: '#f1ece1' },
          couleurs: { type: 'palette', label: 'Tissus', value: ['#1b1b1f', '#ef5a2f', '#486cfc', '#edd14b', '#e9dfcb'] },
          accent: { type: 'color', label: 'Logo', value: '#ef5a2f', show: (q) => q.logo },
          fil: { type: 'color', label: 'Fil', value: '#f8f4ea', show: (q) => q.piqures },
        },
      },
      presets: {
        'Losanges': {},
        'Chevrons': { regle: 'zigzag', couleurs: ['#2c3566', '#e9dfcb', '#486cfc', '#c9d6f2'], blocs: 10, onde: 'centre' },
        'Moulinets': { regle: 'moulinet', couleurs: ['#ef5a2f', '#f6e9d3', '#f272ba', '#edd14b'], blocs: 8, imprimes: 0.4 },
        'Mélange': { bloc: 'melange', regle: 'hasard', blocs: 7, onde: 'hasard', imprimes: 0.45 },
        'Rondins': { bloc: 'rondins', regle: 'losanges', couleurs: ['#3b2a20', '#e8d8b8', '#b5452b', '#d9a441'], blocs: 7, joint: 0 },
        'Chemin d\'ivrogne': { bloc: 'chemin', regle: 'moulinet', couleurs: ['#1b1b1f', '#f1ece1'], blocs: 9, joint: 0, imprimes: 0, piqures: false },
        'Logo': { logo: true, bloc: 'demi', regle: 'hasard', couleurs: ['#d9d3c4', '#e9e3d4', '#c9c2b2'], accent: '#ef5a2f', blocs: 16, joint: 0.02, imprimes: 0.15, onde: 'hasard' },
        'Biennale': { fond: BIEN[0], couleurs: [BIEN[1], BIEN[2], BIEN[3], BIEN[4]], bloc: 'sablier', regle: 'hasard', blocs: 8 },
        'Menthe': { fond: MEN[1], couleurs: [MEN[0], MEN[2], MEN[3]], bloc: 'oies', regle: 'zigzag', blocs: 9, fil: MEN[3] },
        'Kegelbahn': { fond: KB[0], couleurs: [KB[1], KB[2], KB[0]], bloc: 'melange', regle: 'moulinet', blocs: 8, fil: KB[2] },
      },
      brand(colors) {
        const s = colors.slice().sort((a, b) => lum(a) - lum(b));
        return { fond: s[s.length - 1], couleurs: s.length > 1 ? s : [s[0], '#ffffff'], accent: s[Math.floor(s.length / 2)], fil: s[s.length - 1] };
      },
      pointer: {
        down: (q) => { lastKey = ''; turnAt(q.x, q.y); },
        drag: (q) => turnAt(q.x, q.y),
        up: () => { lastKey = ''; },
        wheel: (q, dy) => app.set('blocs', Math.max(3, Math.min(24, p.blocs + (dy > 0 ? 1 : -1)))),
      },
      onChange(k) { if (['*', 'logo', 'image'].includes(k)) logoKey = ''; if (['*', 'blocs'].includes(k)) extra = new Map(); },
      export: { name: 'courtepointe', svg: () => toSVG() },
    });
    const p = app.params;

    function hex(x) { const n = parseInt(x.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
    function lum(x) { const c = hex(x); return (c[0] * 0.299 + c[1] * 0.587 + c[2] * 0.114) / 255; }
    function mix(a, b, t) { const A = hex(a), B = hex(b); return '#' + A.map((v, i) => Math.round(v + (B[i] - v) * t).toString(16).padStart(2, '0')).join(''); }
    // hasard stable par bloc (graine × coordonnées)
    function hsh(i, j, k) { let h = (i * 374761393 + j * 668265263 + k * 2147483647 + (app.seed | 0) * 1274126177) | 0; h = Math.imul(h ^ (h >>> 13), 1274126177); h ^= h >>> 16; return (h >>> 0) / 4294967296; }

    // ——— Logo ———
    function buildLogo() {
      const img0 = p.image || app.logoImg, key = [p.logo, img0 ? (img0.src || 'c') : 'demo'].join(); if (key === logoKey) return; logoKey = key;
      logoM = null; if (!p.logo) return;
      const M = 200, c = document.createElement('canvas'); c.width = c.height = M; const x = c.getContext('2d', { willReadFrequently: true }), L = M * 0.94, cx = M / 2;
      if (img0) { const iw = img0.naturalWidth || img0.width, ih = img0.naturalHeight || img0.height, s = L / Math.max(iw, ih); x.drawImage(img0, cx - iw * s / 2, cx - ih * s / 2, iw * s, ih * s); }
      else { x.fillStyle = '#000'; x.beginPath(); x.arc(cx, cx, L * 0.48, 0, TAU); x.arc(cx, cx, L * 0.27, 0, TAU, true); x.fill('evenodd'); x.fillRect(cx - L * 0.07, cx - L * 0.5, L * 0.14, L); }
      const d = x.getImageData(0, 0, M, M).data; let transp = 0; for (let i = 3; i < d.length; i += 4) if (d[i] < 128) transp++; const useA = transp > M * M * 0.05;
      const m = new Uint8Array(M * M); for (let i = 0; i < M * M; i++) { const o = i * 4, l = (d[o] * 0.2126 + d[o + 1] * 0.7152 + d[o + 2] * 0.0722) / 255; m[i] = (useA ? d[o + 3] > 128 : d[o + 3] > 128 && l < 0.5) ? 1 : 0; }
      logoM = { m, M };
    }
    function inLogo(X, Y, w, h) {
      if (!logoM || !p.logo) return 0; const S = Math.min(w, h) * 0.5 * p.tailleLogo, u = Math.floor(((X - w / 2) / S * 0.5 + 0.5) * logoM.M), v = Math.floor(((Y - h / 2) / S * 0.5 + 0.5) * logoM.M);
      return u >= 0 && v >= 0 && u < logoM.M && v < logoM.M && logoM.m[v * logoM.M + u] === 1 ? 1 : 0;
    }

    // ——— Pièces d'un bloc, dans le carré unité [-0.5, 0.5]² ; c = indice de couleur du bloc ———
    const tri = (a, b, c, k) => ({ P: [a, b, c], c: k });
    const rect = (x0, y0, x1, y1, k) => ({ P: [[x0, y0], [x1, y0], [x1, y1], [x0, y1]], c: k });
    const PIECES = {
      demi: [tri([-0.5, -0.5], [0.5, -0.5], [-0.5, 0.5], 0), tri([0.5, -0.5], [0.5, 0.5], [-0.5, 0.5], 1)],
      moitie: [rect(-0.5, -0.5, 0.5, 0, 0), rect(-0.5, 0, 0.5, 0.5, 1)],
      plein: [rect(-0.5, -0.5, 0.5, 0.5, 0)],
      sablier: [tri([-0.5, -0.5], [0.5, -0.5], [0, 0], 0), tri([0.5, -0.5], [0.5, 0.5], [0, 0], 1), tri([0.5, 0.5], [-0.5, 0.5], [0, 0], 0), tri([-0.5, 0.5], [-0.5, -0.5], [0, 0], 2)],
      oies: [0, 0.5].flatMap((y) => [tri([-0.5, y], [0, y - 0.5], [0.5, y], 0), tri([-0.5, y - 0.5], [0, y - 0.5], [-0.5, y], 1), tri([0, y - 0.5], [0.5, y - 0.5], [0.5, y], 1)]),
      damier: [rect(-0.5, -0.5, 0, 0, 0), rect(0, -0.5, 0.5, 0, 1), rect(-0.5, 0, 0, 0.5, 1), rect(0, 0, 0.5, 0.5, 0)],
      chemin: (() => { const A = [[-0.5, -0.5]]; for (let k = 0; k <= 12; k++) { const a = k / 12 * Math.PI / 2; A.push([-0.5 + Math.cos(a) * 0.68, -0.5 + Math.sin(a) * 0.68]); } return [rect(-0.5, -0.5, 0.5, 0.5, 1), { P: A, c: 0 }]; })(),
      rondins: (() => {
        const out = [rect(-0.1, -0.1, 0.1, 0.1, 2)]; let x0 = -0.1, y0 = -0.1, x1 = 0.1, y1 = 0.1; const d = 0.1;
        // les rondins tournent autour du cœur : côtés haut et droit foncés, bas et gauche clairs
        for (let r = 0; r < 4; r++) {
          out.push(rect(x0, y0 - d, x1, y0, 0)); y0 -= d; out.push(rect(x1, y0, x1 + d, y1, 0)); x1 += d;
          out.push(rect(x0, y1, x1, y1 + d, 1)); y1 += d; out.push(rect(x0 - d, y0, x0, y1, 1)); x0 -= d;
        }
        return out;
      })(),
    };
    const KINDS = ['demi', 'sablier', 'oies', 'rondins', 'chemin', 'damier'];
    const RULES = { losanges: [[0, 1], [3, 2]], moulinet: [[1, 2], [0, 3]] };

    function turnAt(x, y) {
      const G = grid(app.size.w, app.size.h), i = Math.floor((x - G.ox) / G.s), j = Math.floor((y - G.oy) / G.s), key = i + ',' + j; if (key === lastKey) return; lastKey = key;
      const e = extra.get(key) || { n: 0, t: -9 }; const done = Math.min(1, (simT - e.t) / Math.max(0.05, p.duree)); extra.set(key, { n: e.n + (done < 1 ? 1 : 1), t: done < 1 ? e.t : simT, base: done < 1 ? (e.base || 0) : e.n });
    }
    function grid(w, h) { const s = Math.min(w, h) / p.blocs, nx = Math.ceil(w / s), ny = Math.ceil(h / s); return { s, nx, ny, ox: (w - nx * s) / 2, oy: (h - ny * s) / 2 }; }
    const ease = (x) => x <= 0 ? 0 : x >= 1 ? 1 : x * x * (3 - 2 * x);

    // ——— Blocs : géométrie, couleurs, angle courant ———
    function blocks(w, h, t) {
      buildLogo();
      const G = grid(w, h), C = p.couleurs.length > 1 ? p.couleurs : [p.couleurs[0] || '#000000', p.fond], n = C.length, out = [];
      const per = 7 / Math.max(0.05, p.vitesse), dur = Math.max(0.05, p.duree);
      for (let j = 0; j < G.ny; j++) for (let i = 0; i < G.nx; i++) {
        const x = G.ox + (i + 0.5) * G.s, y = G.oy + (j + 0.5) * G.s, r1 = hsh(i, j, 1), r2 = hsh(i, j, 2), r3 = hsh(i, j, 3);
        let kind = p.bloc === 'melange' ? KINDS[Math.floor(r1 * KINDS.length)] : p.bloc;
        let rot = p.regle === 'hasard' ? Math.floor(r2 * 4) : p.regle === 'zigzag' ? (i & 1) + ((j & 1) ? 2 : 0) * 0 : RULES[p.regle][j & 1][i & 1];
        if (p.regle === 'zigzag') rot = (i & 1) ? 1 : 0;
        // couleurs : avec une règle, la pièce 0 garde la couleur dominante pour que le grand motif se lise
        let c0, c1, c2;
        if (p.regle === 'hasard' || p.bloc === 'melange') { c0 = C[Math.floor(r3 * n)]; c1 = C[(Math.floor(r3 * n) + 1 + Math.floor(hsh(i, j, 4) * (n - 1))) % n]; }
        else { c0 = C[0]; c1 = C[1 + Math.floor(r3 * (n - 1))]; }
        c2 = C[Math.floor(hsh(i, j, 5) * n)]; if (c2 === c0 || c2 === c1) c2 = C[(C.indexOf(c2) + 1) % n]; if (n === 2) c2 = c0;
        let cols = [c0, c1, c2], fixed = false;
        // logo : coins du bloc testés dans le masque → plein, demi-carré ou demi-bande
        if (p.logo && logoM) {
          const q = 0.36 * G.s, K = [inLogo(x - q, y - q, w, h), inLogo(x + q, y - q, w, h), inLogo(x + q, y + q, w, h), inLogo(x - q, y + q, w, h)], cnt = K[0] + K[1] + K[2] + K[3], mid = inLogo(x, y, w, h);
          if (cnt === 4 || (cnt === 2 && K[0] === K[2] && mid) || (cnt === 0 && mid)) { kind = 'plein'; cols = [p.accent]; fixed = true; rot = 0; }
          else if (cnt === 3) { const out0 = K.indexOf(0); kind = 'demi'; rot = (out0 + 2) % 4; cols = [p.accent, c1 === p.accent ? c0 : c1]; fixed = true; }
          else if (cnt === 1) { kind = 'demi'; rot = K.indexOf(1); cols = [p.accent, c1 === p.accent ? c0 : c1]; fixed = true; }
          else if (cnt === 2) { const k = K[0] && K[1] ? 0 : K[1] && K[2] ? 1 : K[2] && K[3] ? 2 : 3; kind = 'moitie'; rot = k; cols = [p.accent, c1 === p.accent ? c0 : c1]; fixed = true; }
        }
        // vague : nombre de quarts de tour déjà faits, plus l'avancement du tour en cours
        let ang = rot;
        if (!fixed && p.vitesse > 0) {
          const d = p.onde === 'diagonale' ? (i + j) / (G.nx + G.ny) : p.onde === 'centre' ? Math.hypot(x - w / 2, y - h / 2) / Math.hypot(w / 2, h / 2) : hsh(i, j, 6);
          const ph = t / per - d * 0.7, k = Math.floor(ph), f = (ph - k) * per;
          ang += k + ease(f / dur);
        }
        const e = extra.get(i + ',' + j); if (e && !fixed) ang += (e.base || 0) + ease((t - e.t) / dur) * (e.n - (e.base || 0));
        out.push({ i, j, x, y, kind, cols, ang, pr: hsh(i, j, 7), pk: hsh(i, j, 8) });
      }
      return { G, out };
    }

    // imprimé d'une pièce : pois ou rayures, une teinte plus claire ou plus sombre que la pièce
    function printOf(B, k) {
      const r = hsh(B.i * 7 + k, B.j * 3 - k, 9); if (r >= p.imprimes) return null;
      const col = B.cols[k] || B.cols[0], tone = lum(col) > 0.55 ? mix(col, '#000000', 0.18) : mix(col, '#ffffff', 0.28);
      return { type: hsh(B.i, B.j, 10 + k) < 0.5 ? 'pois' : 'rayures', tone, a: Math.floor(hsh(B.i, B.j, 20 + k) * 4) * Math.PI / 4 };
    }
    function printShapes(pr) {
      // dans le carré unité : grille de pois ou bandes inclinées
      const S = [];
      if (pr.type === 'pois') { for (let y = -0.5; y <= 0.5; y += 0.125) for (let x = -0.5; x <= 0.5; x += 0.125) S.push({ c: [x + ((Math.round(y * 8) & 1) ? 0.0625 : 0), y], r: 0.022 }); }
      else { const c = Math.cos(pr.a), s = Math.sin(pr.a); for (let u = -0.75; u <= 0.75; u += 0.1) S.push({ L: [[u * c - 0.8 * s, u * s + 0.8 * c], [u * c + 0.8 * s, u * s - 0.8 * c]] }); }
      return S;
    }

    app.loop((t, dt) => {
      dt = Math.min(0.1, dt || 0);
      if (!app.thumbnail) simT += dt; else simT = 2.6;
      const { w, h, dpr } = app.size, { G, out } = blocks(w, h, simT), sz = G.s * (1 - p.joint);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.fillStyle = p.fond; ctx.fillRect(0, 0, w, h);
      // les blocs en train de tourner passent au-dessus de leurs voisins
      const L = (B) => Math.sin((B.ang - Math.floor(B.ang)) * Math.PI), order = out.map((B) => [L(B), B]).sort((u, v) => u[0] - v[0]).map((u) => u[1]);
      for (const B of order) {
        const a = B.ang * Math.PI / 2;
        ctx.setTransform(dpr * sz * Math.cos(a), dpr * sz * Math.sin(a), -dpr * sz * Math.sin(a), dpr * sz * Math.cos(a), dpr * B.x, dpr * B.y);
        const PS = PIECES[B.kind];
        // ombre portée : le bloc se soulève pendant qu'il tourne
        if (p.relief > 0) {
          const lift = Math.sin((B.ang - Math.floor(B.ang)) * Math.PI), o = dpr * sz * (0.025 + 0.08 * lift);
          ctx.setTransform(dpr * sz * Math.cos(a), dpr * sz * Math.sin(a), -dpr * sz * Math.sin(a), dpr * sz * Math.cos(a), dpr * B.x + o, dpr * B.y + o);
          ctx.fillStyle = `rgba(0,0,0,${(0.16 + 0.14 * lift) * p.relief})`; ctx.fillRect(-0.5, -0.5, 1, 1);
          ctx.setTransform(dpr * sz * Math.cos(a), dpr * sz * Math.sin(a), -dpr * sz * Math.sin(a), dpr * sz * Math.cos(a), dpr * B.x, dpr * B.y);
        }
        for (let k = 0; k < PS.length; k++) {
          const pc = PS[k], col = B.cols[pc.c] || B.cols[0];
          ctx.beginPath(); ctx.moveTo(pc.P[0][0], pc.P[0][1]); for (let m = 1; m < pc.P.length; m++) ctx.lineTo(pc.P[m][0], pc.P[m][1]); ctx.closePath();
          ctx.fillStyle = col; ctx.fill();
          // un léger débord masque les jours entre pièces voisines
          ctx.strokeStyle = col; ctx.lineWidth = 0.6 / sz; ctx.stroke();
          const pr = printOf(B, k);
          if (pr) {
            ctx.save(); ctx.clip(); ctx.fillStyle = pr.tone; ctx.strokeStyle = pr.tone; ctx.lineWidth = 0.028;
            const S = printShapes(pr); ctx.beginPath();
            for (const s of S) { if (s.r) { ctx.moveTo(s.c[0] + s.r, s.c[1]); ctx.arc(s.c[0], s.c[1], s.r, 0, TAU); } else { ctx.moveTo(s.L[0][0], s.L[0][1]); ctx.lineTo(s.L[1][0], s.L[1][1]); } }
            pr.type === 'pois' ? ctx.fill() : ctx.stroke(); ctx.restore();
          }
        }
        if (p.piqures) {
          ctx.setTransform(dpr * sz * Math.cos(a), dpr * sz * Math.sin(a), -dpr * sz * Math.sin(a), dpr * sz * Math.cos(a), dpr * B.x, dpr * B.y);
          ctx.strokeStyle = p.fil; ctx.globalAlpha = 0.75; ctx.lineWidth = Math.max(0.7, sz * 0.012) / sz; ctx.setLineDash([0.035, 0.03]);
          ctx.beginPath();
          for (const pc of PS) { if (PS.length > 8) break; let cx = 0, cy = 0; for (const q of pc.P) { cx += q[0]; cy += q[1]; } cx /= pc.P.length; cy /= pc.P.length; ctx.moveTo(cx + (pc.P[0][0] - cx) * 0.8, cy + (pc.P[0][1] - cy) * 0.8); for (let m = 1; m < pc.P.length; m++) ctx.lineTo(cx + (pc.P[m][0] - cx) * 0.8, cy + (pc.P[m][1] - cy) * 0.8); ctx.closePath(); }
          if (PS.length > 8) { ctx.rect(-0.43, -0.43, 0.86, 0.86); }
          ctx.stroke(); ctx.setLineDash([]); ctx.globalAlpha = 1;
        }
      }
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      app.finish(ctx);
    });

    function toSVG() {
      const { w, h } = app.size, f = (v) => +v.toFixed(4), F = (v) => +v.toFixed(2), { G, out } = blocks(w, h, simT), sz = G.s * (1 - p.joint);
      let s = `<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><rect width="100%" height="100%" fill="${p.fond}"/>`, cid = 0;
      for (const B of out) {
        const a = B.ang * 90, PS = PIECES[B.kind];
        s += `<g transform="translate(${F(B.x)} ${F(B.y)}) rotate(${F(a)}) scale(${F(sz)})">`;
        for (let k = 0; k < PS.length; k++) {
          const pc = PS[k], col = B.cols[pc.c] || B.cols[0], pts = pc.P.map((q) => f(q[0]) + ',' + f(q[1])).join(' ');
          s += `<polygon points="${pts}" fill="${col}" stroke="${col}" stroke-width="${f(0.6 / sz)}"/>`;
          const pr = printOf(B, k);
          if (pr) {
            const id = 'c' + cid++; s += `<clipPath id="${id}"><polygon points="${pts}"/></clipPath><g clip-path="url(#${id})">`;
            const S = printShapes(pr);
            if (pr.type === 'pois') s += `<path d="${S.map((q) => `M${f(q.c[0] + q.r)} ${f(q.c[1])}a${q.r} ${q.r} 0 1 0 ${-2 * q.r} 0a${q.r} ${q.r} 0 1 0 ${2 * q.r} 0`).join('')}" fill="${pr.tone}"/>`;
            else s += `<path d="${S.map((q) => `M${f(q.L[0][0])} ${f(q.L[0][1])}L${f(q.L[1][0])} ${f(q.L[1][1])}`).join('')}" stroke="${pr.tone}" stroke-width="0.028" fill="none"/>`;
            s += '</g>';
          }
        }
        if (p.piqures) {
          let d = '';
          if (PS.length > 8) d = 'M-0.43 -0.43H0.43V0.43H-0.43Z';
          else for (const pc of PS) { let cx = 0, cy = 0; for (const q of pc.P) { cx += q[0]; cy += q[1]; } cx /= pc.P.length; cy /= pc.P.length; d += 'M' + pc.P.map((q) => f(cx + (q[0] - cx) * 0.8) + ' ' + f(cy + (q[1] - cy) * 0.8)).join('L') + 'Z'; }
          s += `<path d="${d}" fill="none" stroke="${p.fil}" stroke-opacity="0.75" stroke-width="${f(Math.max(0.7, sz * 0.012) / sz)}" stroke-dasharray="0.035 0.03"/>`;
        }
        s += '</g>';
      }
      return s + '</svg>';
    }
  </script>
