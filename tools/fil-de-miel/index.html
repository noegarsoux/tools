<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fil de miel</title>
  <link rel="stylesheet" href="../../assets/ui/atelier.css">
</head>
<body>
  <canvas></canvas>
  <script src="../../assets/ui/atelier.js"></script>
  <script>
    // Fil de miel : un filet visqueux tombe d'une buse sur une surface qui bouge (tapis, plateau tournant ou
    // table traçante). Modèle géométrique : le point de contact pose le fil à vitesse constante et tourne autour
    // de l'aplomb de la buse ; quand la surface l'emporte, la bobine se déroule en boucles, en huit, en méandres,
    // puis en ligne droite quand la surface va plus vite que le fil.
    const canvas = document.querySelector('canvas');
    const ctx = canvas.getContext('2d');
    const TAU = Math.PI * 2;
    const PAL = (k) => Atelier.PALETTES[k].colors;
    const BIEN = PAL('biennale'), KB = PAL('kegelbahn'), MENTHE = PAL('menthe'), ORB = PAL('orbite'), LUZ = PAL('luzern'), SALON = PAL('salon');

    let ease = null, simKey = '', frozen = false, rng = Math.random, buses = [], belt = { off: 0, ang: 0 }, T = 0, held = null, head = { x: 0, y: 0 }, lastSize = '';

    const app = Atelier.app({
      stage: canvas,
      animate: true,
      seed: true,
      finish: { grain: 0.05, vignette: 0.15 },
      hint: 'Glissez pour guider les buses · touchez pour inverser l’enroulement · molette : vitesse du support',
      notes: 'Un filet de miel qui tombe sur une surface immobile s’enroule en bobine. Si la surface avance, la bobine se déroule : boucles décalées, boucles alternées, huit, puis méandres, et enfin une ligne droite quand la surface va plus vite que le fil. Ici, le point de contact pose le fil à vitesse constante et cherche sans cesse à tourner autour de l’aplomb de la buse, à la distance du rayon de bobine ; tout le reste vient du support qui l’emporte.',
      params: {
        'Machine': {
          mode: { type: 'segmented', label: 'Support', options: { tapis: 'Tapis', plateau: 'Plateau', traceur: 'Traceur' }, value: 'tapis' },
          buses: { type: 'range', label: 'Buses', min: 1, max: 9, step: 1, value: 5 },
          ecart: { type: 'range', label: 'Écart des buses', min: 0.2, max: 1, step: 0.01, value: 0.8 },
          avance: { type: 'range', label: 'Vitesse du support / fil', min: 0, max: 1.3, step: 0.01, value: 0.5 },
          gradient: { type: 'range', label: 'Écart de vitesse entre buses', min: 0, max: 1, step: 0.01, value: 1 },
        },
        'Fil': {
          rayon: { type: 'range', label: 'Rayon de bobine', min: 0.006, max: 0.07, step: 0.001, value: 0.022 },
          frequence: { type: 'range', label: 'Tours par seconde', min: 0.2, max: 4, step: 0.05, value: 1.6 },
          variation: { type: 'range', label: 'Variation des rayons', min: 0, max: 1, step: 0.01, value: 0.15 },
          raideur: { type: 'range', label: 'Raideur du fil', min: 0.2, max: 2.5, step: 0.05, value: 0.5 },
          irregularite: { type: 'range', label: 'Irrégularité', min: 0, max: 1, step: 0.01, value: 0.2 },
        },
        'Matière': {
          epaisseur: { type: 'range', label: 'Épaisseur du fil', min: 0.1, max: 1, step: 0.01, value: 0.42 },
          etalement: { type: 'range', label: 'Étalement en refroidissant', min: 0, max: 1, step: 0.01, value: 0.35 },
          brillance: { type: 'range', label: 'Brillance', min: 0, max: 1, step: 0.01, value: 0.7 },
          transparence: { type: 'range', label: 'Transparence', min: 0, max: 0.8, step: 0.01, value: 0.15 },
          persistance: { type: 'range', label: 'Persistance (s)', min: 4, max: 60, step: 1, value: 24 },
          lumiere: { type: 'range', label: 'Direction de la lumière', min: 0, max: 360, step: 1, value: 225 },
        },
        'Couleurs': {
          fond: { type: 'color', label: 'Support', value: '#efe6d6' },
          fils: { type: 'palette', label: 'Fils', value: ['#d98a1c', '#c46a12', '#e9a93a'] },
        },
      },
      presets: {
        'Miel': {},
        'Bobines': { avance: 0.18, gradient: 0.2, rayon: 0.03, buses: 4 },
        'Méandres': { avance: 0.86, gradient: 0.12, irregularite: 0.5, buses: 7, rayon: 0.016, fils: ['#3a2416', '#5a3420'], fond: '#f2ece2', brillance: 0.5 },
        'Machine à coudre': { avance: 0.5, gradient: 1, buses: 9, ecart: 0.92, rayon: 0.012, epaisseur: 0.3, fond: '#111111', fils: [BIEN[2], BIEN[3], BIEN[4], '#f4f3f0'] },
        'Plateau': { mode: 'plateau', buses: 6, avance: 0.45, ecart: 0.9, rayon: 0.018, fils: [KB[1], KB[2], KB[3], KB[5]], fond: KB[0] },
        'Traceur': { mode: 'traceur', buses: 1, avance: 0.4, rayon: 0.03, epaisseur: 0.45, persistance: 40, fond: '#f4f1ea', fils: ['#151515'] , brillance: 0.25, transparence: 0 },
        'Caramel': { fond: '#2a1a12', fils: ['#c9741f', '#e59a3c', '#f2c06a'], etalement: 0.7, brillance: 0.9 },
        'Biennale': { fond: BIEN[0], fils: [BIEN[2], BIEN[3], BIEN[1]], avance: 0.5, buses: 6, transparence: 0 },
        'Menthe': { fond: MENTHE[0], fils: [MENTHE[3], MENTHE[2], MENTHE[1]], avance: 0.25 },
        'Orbite': { mode: 'plateau', fond: ORB[1], fils: [ORB[0], ORB[2]], buses: 3, rayon: 0.03, avance: 0.3 },
        'Luzern': { fond: LUZ[4], fils: [LUZ[0], LUZ[1], LUZ[2]], avance: 0.7, gradient: 1, buses: 8, transparence: 0 },
      },
      brand(colors) {
        const lum = (x) => { const c = hex(x); return c[0] * 0.299 + c[1] * 0.587 + c[2] * 0.114; };
        const all = colors.slice().sort((a, b) => lum(b) - lum(a));
        return { fond: all[0], fils: all.length > 1 ? all.slice(1) : [all[0]] };
      },
      pointer: {
        down: (q) => { held = { x: q.x, y: q.y, x0: q.x, y0: q.y, moved: false }; },
        drag: (q) => { if (!held) return; held.x = q.x; held.y = q.y; if (Math.hypot(q.x - held.x0, q.y - held.y0) > 6) held.moved = true; },
        up: (q) => {
          if (held && !held.moved) { // touche : la buse la plus proche change de sens
            let best = null, bd = 1e9; for (const b of buses) { const d = Math.hypot(b.sx - held.x0, b.sy - held.y0); if (d < bd) { bd = d; best = b; } }
            if (best) { const a = Math.atan2(best.y0n - best.y, best.x0n - best.x); best.th = 2 * a - best.th; }
          } else if (held) {
            // la position choisie reste : les buses ne reviennent pas en arrière en tirant le fil
            for (const b of buses) { b.bx = b.sx; b.by = b.sy; if (p.mode === 'traceur') { b.bx = b.sx - head.x + app.size.w / 2; b.by = b.sy - head.y + app.size.h / 2; } }
            if (p.mode === 'traceur') { ease = { x: head.x, y: head.y, k: 0 }; }
          }
          held = null;
        },
        wheel: (q, dy) => app.set('avance', Math.max(0, Math.min(1.3, +(p.avance + (dy > 0 ? -0.05 : 0.05)).toFixed(2)))),
      },
      onChange(k) { if (k === '*' || ['mode', 'buses', 'ecart', 'rayon', 'variation'].includes(k)) simKey = ''; frozen = false; },
      onSeed() { simKey = ''; frozen = false; },
      export: { name: 'fil-de-miel', svg: () => toSVG() },
    });
    const p = app.params;

    const hex = (x) => { const n = parseInt(x.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; };
    const mix = (a, b, t) => { const A = hex(a), B = hex(b); return '#' + A.map((v, i) => Math.round(v + (B[i] - v) * t).toString(16).padStart(2, '0')).join(''); };
    const rgba = (x, al) => { const c = hex(x); return `rgba(${c[0]},${c[1]},${c[2]},${al})`; };
    function mulberry(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

    // ——— Géométrie du support ———
    // coordonnées « support » : celles où le fil est posé ; l'écran les voit déplacées (tapis) ou tournées (plateau)
    function axes() { const { w, h } = app.size; const long = w >= h; return { w, h, ux: long ? -1 : 0, uy: long ? 0 : -1, vx: long ? 0 : 1, vy: long ? 1 : 0, L: long ? w : h, S: long ? h : w }; }
    function toScreen(x, y, b) {
      const { w, h } = app.size;
      if (p.mode === 'tapis') { const A = axes(); return [x + A.ux * b.off, y + A.uy * b.off]; }
      if (p.mode === 'plateau') { const c = Math.cos(belt.ang), s = Math.sin(belt.ang); return [w / 2 + x * c - y * s, h / 2 + x * s + y * c]; }
      return [x, y];
    }
    function toBelt(x, y, b) {
      const { w, h } = app.size;
      if (p.mode === 'tapis') { const A = axes(); return [x - A.ux * b.off, y - A.uy * b.off]; }
      if (p.mode === 'plateau') { const c = Math.cos(-belt.ang), s = Math.sin(-belt.ang), dx = x - w / 2, dy = y - h / 2; return [dx * c - dy * s, dx * s + dy * c]; }
      return [x, y];
    }

    // ——— Buses ———
    const CAP = 60000;
    function reset() {
      const { w, h } = app.size, m = Math.min(w, h); rng = mulberry(app.seed * 7919 + 3);
      belt = { off: 0, ang: 0 }; T = 0; buses = [];
      const n = p.buses, A = axes();
      for (let i = 0; i < n; i++) {
        const f = n === 1 ? 0.5 : i / (n - 1), R = p.rayon * m * (1 + p.variation * (rng() * 2 - 1) * 0.6);
        let bx, by;
        if (p.mode === 'tapis') { const along = A.L * 0.1, across = (f - 0.5) * A.S * p.ecart * 0.86 * (n === 1 ? 0 : 1); bx = w / 2 + A.ux * (A.L / 2 - along) * -1 + A.vx * across; by = h / 2 + A.uy * (A.L / 2 - along) * -1 + A.vy * across; }
        else if (p.mode === 'plateau') { const r = m * 0.48 * p.ecart * (n === 1 ? 0.6 : 0.25 + 0.75 * f); bx = w / 2 + r; by = h / 2; }
        else { bx = w / 2 + (f - 0.5) * m * 0.5 * p.ecart * (n === 1 ? 0 : 1); by = h / 2; }
        const [px, py] = toBelt(bx, by, { off: 0 });
        buses.push({ off: 0, i, f, R, bx, by, sx: bx, sy: by, x: px + R, y: py, th: rng() < 0.5 ? Math.PI / 2 : -Math.PI / 2, X: new Float32Array(CAP), Y: new Float32Array(CAP), Tm: new Float32Array(CAP), s: 0, n: 0, acc: 0, col: 0, noise: 0 });
      }
      buses.forEach((b, i) => { b.col = i % p.fils.length; });
    }
    // la tête du traceur se promène (Lissajous) quand personne ne la tient
    function nozzlePos(b, t) {
      const { w, h } = app.size, m = Math.min(w, h);
      if (p.mode === 'traceur') {
        const V = TAU * b.R * p.frequence, sp = p.avance * V / (m * 0.3) * 0.6;
        let cx, cy;
        if (held && held.moved) { cx = held.x; cy = held.y; } else {
          cx = w / 2 + Math.sin(t * sp * 1.0 + 0.3) * w * 0.34; cy = h / 2 + Math.sin(t * sp * 1.618) * h * 0.32;
          // après un guidage à la main, la tête rejoint doucement sa promenade
          if (ease && ease.k < 1) { const e = ease.k * ease.k * (3 - 2 * ease.k); cx = ease.x + (cx - ease.x) * e; cy = ease.y + (cy - ease.y) * e; }
        }
        head.x = cx; head.y = cy;
        return [cx + (b.bx - w / 2), cy + (b.by - h / 2)];
      }
      if (held && held.moved && p.mode === 'tapis') { const A = axes(); const d = (held.x - held.x0) * A.vx + (held.y - held.y0) * A.vy; return [b.bx + A.vx * d, b.by + A.vy * d]; }
      if (held && held.moved && p.mode === 'plateau') { const r0 = Math.hypot(b.bx - w / 2, b.by - h / 2), d = Math.hypot(held.x - w / 2, held.y - h / 2) - Math.hypot(held.x0 - w / 2, held.y0 - h / 2), r = Math.max(4, r0 + d); return [w / 2 + r, h / 2]; }
      return [b.bx, b.by];
    }
    function supportSpeed(b) {
      // vitesse du support sous la buse, en unités de vitesse du fil ; le gradient donne une vitesse propre à chaque buse
      return Math.max(p.avance > 0.02 ? 0.12 : 0, p.avance + p.gradient * (b.f - 0.5) * 0.8);
    }
    function simulate(dt) {
      const { w, h } = app.size, m = Math.min(w, h), A = axes();
      // pas de temps interne ~ 1/12 de radian de bobine
      const fmax = p.frequence, sub = Math.max(1, Math.ceil(dt * fmax * TAU * 12)), hdt = dt / sub;
      const V0 = TAU * p.rayon * m * p.frequence;
      for (let k = 0; k < sub; k++) {
        T += hdt; if (ease && ease.k < 1) ease.k = Math.min(1, ease.k + hdt / 1.5);
        // le support bouge
        if (p.mode === 'tapis') for (const b of buses) b.off += supportSpeed(b) * V0 * hdt;
        else if (p.mode === 'plateau') { const rRef = m * 0.3; belt.ang += p.avance * V0 / rRef * hdt; }
        for (const b of buses) {
          const V = TAU * b.R * p.frequence;
          const [sx, sy] = nozzlePos(b, T); b.sx = sx; b.sy = sy;
          // tapis : chaque buse a son propre tapis (vitesse propre) → on décale sa position de buse dans son repère
          const [nx, ny] = toBelt(sx, sy, b); b.x0n = nx; b.y0n = ny;
          const dx = nx - b.x, dy = ny - b.y, d = Math.hypot(dx, dy) || 1e-6, hx = dx / d, hy = dy / d;
          // modèle géométrique : la courbure posée dépend seulement de la position de l'aplomb vue du point de contact
          // κ·R = sin ψ · ρ^α (ψ : angle entre la tangente et l'aplomb, ρ : distance / rayon de bobine)
          const c0 = Math.cos(b.th), s0 = Math.sin(b.th), rho = d / b.R;
          let sn = c0 * hy - s0 * hx; if (c0 * hx + s0 * hy < 0) sn = sn >= 0 ? 1 : -1;
          b.noise += (rng() - 0.5) * p.irregularite * 0.5 - b.noise * 0.08;
          b.th += (sn * Math.pow(rho, p.raideur) + b.noise * 0.6) * V / b.R * hdt;
          // fil tendu : si l'aplomb s'éloigne trop, le point de contact glisse plus vite (ligne droite)
          const stretch = Math.min(4, Math.max(1, (rho / 2.2) * (rho / 2.2)));
          b.x += Math.cos(b.th) * V * stretch * hdt; b.y += Math.sin(b.th) * V * stretch * hdt;
          // enregistrement
          b.acc += V * stretch * hdt;
          if (b.acc >= Math.max(1.5, b.R * 0.22) || b.n === 0) { b.acc = 0; push(b, b.x, b.y, T); }
        }
      }
      prune();
    }
    function push(b, x, y, t) {
      if (b.n >= CAP) { const keep = CAP >> 1; b.X.copyWithin(0, b.n - keep, b.n); b.Y.copyWithin(0, b.n - keep, b.n); b.Tm.copyWithin(0, b.n - keep, b.n); b.n = keep; b.s = Math.max(0, b.s - (CAP - keep)); }
      b.X[b.n] = x; b.Y[b.n] = y; b.Tm[b.n] = t; b.n++;
    }
    function prune() {
      // on oublie ce qui est sorti de l'écran (tapis) ou trop vieux (plateau, traceur)
      const { w, h } = app.size, pad = Math.max(w, h) * 0.08;
      for (const b of buses) {
        if (p.mode === 'tapis') {
          while (b.s < b.n - 2) { const [x, y] = toScreen(b.X[b.s], b.Y[b.s], b); if (x < -pad || y < -pad || x > w + pad || y > h + pad) b.s++; else break; }
        } else { while (b.s < b.n - 2 && T - b.Tm[b.s] > p.persistance) b.s++; }
      }
    }

    // ——— Rendu ———
    function screenOf(b, i) {
      return toScreen(b.X[i], b.Y[i], b);
    }
    function draw() {
      const { w, h, dpr } = app.size, m = Math.min(w, h);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
      ctx.fillStyle = p.fond; ctx.fillRect(0, 0, w, h);
      if (p.mode === 'plateau') { // le plateau : une légère couronne pour sentir la rotation
        ctx.strokeStyle = rgba(mix(p.fond, '#000000', 0.5), 0.08); ctx.lineWidth = 1;
        for (let r = m * 0.12; r < Math.max(w, h); r += m * 0.12) { ctx.beginPath(); ctx.arc(w / 2, h / 2, r, 0, TAU); ctx.stroke(); }
      }
      const la = p.lumiere * Math.PI / 180, lx = Math.cos(la), ly = Math.sin(la), dark = lumHex(p.fond) < 90;
      const wd = (b) => Math.max(0.6, b.R * p.epaisseur * 0.55);
      // morceaux dessinés du plus ancien au plus récent : le fil neuf passe par-dessus l'ancien
      const CH = 40, chunks = [];
      for (const b of buses) for (let i = b.s; i < b.n - 1; i += CH) chunks.push([b.Tm[i], b, i, Math.min(b.n - 1, i + CH)]);
      chunks.sort((u, v) => u[0] - v[0]);
      // bouts plats : pas de couture visible entre deux morceaux consécutifs
      ctx.lineCap = 'butt'; ctx.lineJoin = 'round';
      const op = 1 - p.transparence;
      for (const [t0, b, i0, i1] of chunks) {
        const age = T - t0, sp = 1 + p.etalement * 0.9 * Math.min(1, age / 6), W0 = wd(b) * sp;
        let fade = 1; if (p.mode !== 'tapis') fade = Math.min(1, (p.persistance - age) / (p.persistance * 0.25));
        if (fade <= 0) continue;
        const col = p.fils[b.col % p.fils.length], path = new Path2D();
        let [x, y] = screenOf(b, i0); path.moveTo(x, y);
        let minx = x, maxx = x, miny = y, maxy = y;
        for (let i = i0 + 1; i <= i1; i++) { [x, y] = screenOf(b, i); path.lineTo(x, y); if (x < minx) minx = x; if (x > maxx) maxx = x; if (y < miny) miny = y; if (y > maxy) maxy = y; }
        if (maxx < -W0 * 3 || minx > w + W0 * 3 || maxy < -W0 * 3 || miny > h + W0 * 3) continue;
        const gloss = p.brillance * Math.max(0, 1 - p.etalement * 0.7 * Math.min(1, age / 8));
        // ombre portée
        ctx.globalAlpha = (dark ? 0.5 : 0.22) * fade; ctx.strokeStyle = dark ? '#000000' : mix(p.fond, '#000000', 0.55); ctx.lineWidth = W0 * 1.25;
        ctx.save(); ctx.translate(-lx * W0 * 0.5, -ly * W0 * 0.5); ctx.stroke(path); ctx.restore();
        // corps : bord sombre puis cœur
        ctx.globalAlpha = op * fade; ctx.strokeStyle = mix(col, '#000000', 0.28); ctx.lineWidth = W0; ctx.stroke(path);
        ctx.strokeStyle = col; ctx.lineWidth = W0 * 0.72; ctx.stroke(path);
        // reflet décalé vers la lumière
        if (gloss > 0.02) { ctx.globalAlpha = gloss * 0.85 * fade; ctx.strokeStyle = mix(col, '#ffffff', 0.75); ctx.lineWidth = W0 * 0.2; ctx.save(); ctx.translate(lx * W0 * 0.22, ly * W0 * 0.22); ctx.stroke(path); ctx.restore(); }
      }
      ctx.globalAlpha = 1; ctx.lineCap = 'round';
      // filets qui tombent et buses
      for (const b of buses) {
        if (b.n < 1) continue;
        const [cx, cy] = screenOf(b, b.n - 1), W0 = wd(b), col = p.fils[b.col % p.fils.length];
        ctx.strokeStyle = mix(col, '#000000', 0.2); ctx.lineWidth = W0 * 1.1; ctx.beginPath(); ctx.moveTo(b.sx, b.sy); ctx.quadraticCurveTo((b.sx * 2 + cx) / 3, (b.sy * 2 + cy) / 3, cx, cy); ctx.stroke();
        ctx.strokeStyle = col; ctx.lineWidth = W0 * 0.7; ctx.stroke();
        ctx.globalAlpha = p.brillance * 0.8; ctx.strokeStyle = mix(col, '#ffffff', 0.7); ctx.lineWidth = W0 * 0.18; ctx.beginPath(); ctx.moveTo(b.sx + lx * W0 * 0.2, b.sy + ly * W0 * 0.2); ctx.lineTo(cx + lx * W0 * 0.2, cy + ly * W0 * 0.2); ctx.stroke(); ctx.globalAlpha = 1;
        // la buse vue de dessus : anneau métallique et son ombre
        const r = Math.max(3, W0 * 1.5);
        ctx.fillStyle = 'rgba(0,0,0,0.18)'; ctx.beginPath(); ctx.arc(b.sx - lx * r * 0.9, b.sy - ly * r * 0.9, r * 1.05, 0, TAU); ctx.fill();
        const g = ctx.createRadialGradient(b.sx + lx * r * 0.4, b.sy + ly * r * 0.4, r * 0.1, b.sx, b.sy, r);
        g.addColorStop(0, '#f4f4f2'); g.addColorStop(0.6, '#a9a9a6'); g.addColorStop(1, '#5c5c5a');
        ctx.fillStyle = g; ctx.beginPath(); ctx.arc(b.sx, b.sy, r, 0, TAU); ctx.fill();
        ctx.fillStyle = mix(col, '#000000', 0.15); ctx.beginPath(); ctx.arc(b.sx, b.sy, r * 0.45, 0, TAU); ctx.fill();
      }
    }
    function lumHex(x) { const c = hex(x); return c[0] * 0.299 + c[1] * 0.587 + c[2] * 0.114; }

    app.loop((tt, dt) => {
      dt = Math.min(0.05, dt || 0);
      const { w, h } = app.size;
      const key = [p.mode, p.buses, p.ecart, p.rayon, p.variation, w, h, app.seed].join();
      if (key !== simKey) {
        reset(); simKey = key;
        // pré-calcul : l'écran est déjà couvert au démarrage
        const m = Math.min(w, h), V0 = TAU * p.rayon * m * p.frequence;
        const slow = Math.min(...buses.map(supportSpeed)), pre = p.mode === 'tapis' ? Math.min(50, Math.max(w, h) * 0.95 / Math.max(1e-3, slow * V0)) : p.mode === 'plateau' ? Math.min(30, p.persistance * 0.8) : Math.min(20, p.persistance * 0.6);
        for (let s = 0; s < pre; s += 0.05) simulate(0.05);
      }
      if (app.thumbnail) { if (!frozen) frozen = true; }
      else simulate(dt);
      draw();
      app.finish(ctx);
    });

    // ——— Export SVG : les fils visibles, en tracés ———
    function toSVG() {
      const { w, h } = app.size, out = [`<rect width="100%" height="100%" fill="${p.fond}"/>`];
      for (const b of buses) {
        if (b.n - b.s < 2) continue;
        const pts = []; let last = null;
        for (let i = b.s; i < b.n; i++) { const [x, y] = screenOf(b, i); if (last && Math.hypot(x - last[0], y - last[1]) < 1.2) continue; last = [x, y]; pts.push(x.toFixed(1) + ',' + y.toFixed(1)); }
        const col = p.fils[b.col % p.fils.length], wdt = Math.max(0.6, b.R * p.epaisseur * 0.55);
        out.push(`<polyline points="${pts.join(' ')}" fill="none" stroke="${col}" stroke-width="${wdt.toFixed(2)}" stroke-linecap="round" stroke-linejoin="round"/>`);
      }
      return `<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">${out.join('')}</svg>`;
    }
  </script>
</body>
</html>
