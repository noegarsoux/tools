<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Plan de métro</title>
  <link rel="stylesheet" href="../../assets/ui/atelier.css">
</head>
<body>
  <canvas></canvas>
  <script src="../../assets/ui/atelier.js"></script>
  <script>
    // Plan de métro : un schéma octilinéaire à la Harry Beck. Chaque ligne traverse la carte en passant par quelques
    // points de passage près du centre ; entre deux points, on ne s'autorise que l'horizontale, la verticale et les
    // diagonales à 45° (une diagonale puis une droite). Les angles sont arrondis, les stations posées à intervalle
    // régulier, et une station devient correspondance quand une autre ligne passe tout près. Le fleuve suit la même
    // règle. Le contour du logo, extrait par marching squares puis simplifié, devient une ligne circulaire.
    const canvas = document.querySelector('canvas');
    const ctx = canvas.getContext('2d');
    const TAU = Math.PI * 2;
    const PAL = (k) => Atelier.PALETTES[k].colors;
    const BIEN = PAL('biennale'), MEN = PAL('menthe'), KB = PAL('kegelbahn');

    let simT = 0, net = null, netKey = '', cycle = 0, t0 = 0, userLines = [], drawing = null, logoM = null, logoKey = '';

    const app = Atelier.app({
      stage: canvas,
      animate: true,
      seed: true,
      finish: { grain: 0.02, vignette: 0.05 },
      hint: 'Tracez une ligne au doigt · clic : nouveau réseau · molette : maille',
      notes: 'En 1931, Harry Beck, dessinateur électricien au métro de Londres, propose un plan qui ne respecte plus les distances : les lignes n\'y vont qu\'à l\'horizontale, à la verticale ou à 45°, les stations sont régulièrement espacées et le centre, où tout se croise, est dilaté. On le trouve d\'abord trop abstrait ; il devient le modèle de presque tous les plans de transport, jusqu\'à celui de New York dessiné par Massimo Vignelli en 1972. Cet outil invente des réseaux selon la même règle : chaque ligne traverse la carte par des points de passage, les angles sont arrondis, les correspondances apparaissent là où les lignes se frôlent, et des rames y circulent. Le doigt trace une nouvelle ligne ; le logo devient une ligne circulaire.',
      params: {
        'Réseau': {
          lignes: { type: 'range', label: 'Lignes', min: 2, max: 12, step: 1, value: 7 },
          maille: { type: 'range', label: 'Maille', min: 0.015, max: 0.08, step: 0.001, value: 0.032 },
          detours: { type: 'range', label: 'Points de passage', min: 1, max: 6, step: 1, value: 3 },
          etendue: { type: 'range', label: 'Étalement du centre', min: 0.1, max: 0.9, step: 0.01, value: 0.55 },
          espacement: { type: 'range', label: 'Espacement des stations', min: 1.5, max: 10, step: 0.5, value: 3.5 },
          duree: { type: 'range', label: 'Nouveau réseau toutes les (s)', min: 0, max: 60, step: 1, value: 18 },
        },
        'Rames': {
          rames: { type: 'range', label: 'Rames par ligne', min: 0, max: 8, step: 1, value: 3 },
          vitesse: { type: 'range', label: 'Vitesse', min: 0, max: 3, step: 0.01, value: 1 },
        },
        'Rendu': {
          epaisseur: { type: 'range', label: 'Épaisseur des lignes', min: 0.1, max: 0.6, step: 0.01, value: 0.26 },
          arrondi: { type: 'range', label: 'Arrondi des angles', min: 0, max: 3, step: 0.05, value: 1.2 },
          stations: { type: 'segmented', label: 'Stations', options: { traits: 'Traits', ronds: 'Ronds' }, value: 'traits' },
          fleuve: { type: 'toggle', label: 'Fleuve', value: true },
        },
        'Ligne du logo': {
          logo: { type: 'toggle', label: 'Ligne circulaire du logo', value: false },
          tailleLogo: { type: 'range', label: 'Taille du logo', min: 0.3, max: 1.8, step: 0.01, value: 1.1, show: (q) => q.logo },
          image: { type: 'file', label: 'Logo', accept: 'image/*', show: (q) => q.logo },
        },
        'Couleurs': {
          fond: { type: 'color', label: 'Fond', value: '#f4f1ea' },
          couleurs: { type: 'palette', label: 'Lignes', value: ['#e5452a', '#486cfc', '#1f9d55', '#edd14b', '#f272ba', '#7b4bd6', '#1b1b1f', '#ef8a2f'] },
          eau: { type: 'color', label: 'Fleuve', value: '#cfe0f2', show: (q) => q.fleuve },
          encre: { type: 'color', label: 'Correspondances', value: '#1b1b1f' },
          accent: { type: 'color', label: 'Ligne du logo', value: '#ef5a2f', show: (q) => q.logo },
        },
      },
      presets: {
        'Beck': {},
        'Vignelli': { fond: '#ffffff', stations: 'ronds', arrondi: 0.6, epaisseur: 0.22, fleuve: false, lignes: 9, maille: 0.026 },
        'Nuit': { fond: '#101015', eau: '#1c2333', encre: '#f4f1ea', couleurs: ['#f272ba', '#7fe0c2', '#edd14b', '#486cfc', '#ef5a2f'], lignes: 5 },
        'Dense': { lignes: 12, maille: 0.022, detours: 4, espacement: 2.5, epaisseur: 0.3, etendue: 0.6 },
        'Trois lignes': { lignes: 3, maille: 0.05, epaisseur: 0.32, rames: 2, couleurs: ['#e5452a', '#1b1b1f', '#486cfc'], espacement: 4 },
        'Banlieue': { etendue: 0.85, detours: 5, lignes: 6, arrondi: 2.4, maille: 0.028 },
        'Logo': { logo: true, lignes: 5, couleurs: ['#c9c2b2', '#d8d2c4', '#b8b1a0'], accent: '#ef5a2f', fleuve: false, epaisseur: 0.24, maille: 0.028, rames: 2 },
        'Biennale': { fond: BIEN[0], couleurs: [BIEN[2], BIEN[1], BIEN[3], BIEN[4]], eau: mix(BIEN[3], BIEN[0], 0.6), encre: BIEN[1] },
        'Menthe': { fond: MEN[0], couleurs: [MEN[1], MEN[3], MEN[2]], eau: mix(MEN[2], MEN[0], 0.5), encre: MEN[1], lignes: 5 },
        'Kegelbahn': { fond: KB[0], couleurs: [KB[1], KB[2], KB[3], KB[5]], eau: '#161a2a', encre: '#f4f1ea', lignes: 8 },
      },
      brand(colors) {
        const s = colors.slice().sort((a, b) => lum(a) - lum(b)), L = s[s.length - 1];
        return { fond: L, couleurs: s.length > 1 ? s.slice(0, -1) : ['#000000'], encre: s[0], eau: mix(s[Math.floor(s.length / 2)], L, 0.7), accent: s[Math.floor(s.length / 2)] };
      },
      pointer: {
        down: (q) => { drawing = { pts: [[q.x, q.y]], moved: 0 }; },
        drag: (q) => { if (!drawing) return; const l = drawing.pts[drawing.pts.length - 1]; const d = Math.hypot(q.x - l[0], q.y - l[1]); if (d > 6) { drawing.pts.push([q.x, q.y]); drawing.moved += d; } },
        up: () => { if (!drawing) return; const d = drawing; drawing = null; if (d.moved < 30) { cycle++; t0 = simT; netKey = ''; userLines = []; return; } addUserLine(d.pts); },
        wheel: (q, dy) => app.set('maille', Math.max(0.015, Math.min(0.08, +(p.maille * (dy > 0 ? 1 / 1.08 : 1.08)).toFixed(3)))),
      },
      onChange(k) { if (['*', 'logo', 'image'].includes(k)) logoKey = ''; if (k === '*') { userLines = []; t0 = simT; } },
      export: { name: 'plan-de-metro', svg: () => toSVG() },
    });
    const p = app.params;

    function hex(x) { const n = parseInt(x.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
    function lum(x) { const c = hex(x); return (c[0] * 0.299 + c[1] * 0.587 + c[2] * 0.114) / 255; }
    function mix(a, b, t) { const A = hex(a), B = hex(b); return '#' + A.map((v, i) => Math.round(v + (B[i] - v) * t).toString(16).padStart(2, '0')).join(''); }
    function rngFrom(s) { let a = s >>> 0; return () => { a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }

    // ——— Logo : masque puis contour ———
    function buildLogo() {
      const img0 = p.image || app.logoImg, key = [p.logo, img0 ? (img0.src || 'c') : 'demo'].join(); if (key === logoKey) return; logoKey = key; netKey = '';
      logoM = null; if (!p.logo) return;
      const M = 72, c = document.createElement('canvas'); c.width = c.height = M; const x = c.getContext('2d', { willReadFrequently: true }), L = M * 0.86, cx = M / 2;
      if (img0) { const iw = img0.naturalWidth || img0.width, ih = img0.naturalHeight || img0.height, s = L / Math.max(iw, ih); x.drawImage(img0, cx - iw * s / 2, cx - ih * s / 2, iw * s, ih * s); }
      else { x.fillStyle = '#000'; x.beginPath(); x.arc(cx, cx, L * 0.48, 0, TAU); x.arc(cx, cx, L * 0.27, 0, TAU, true); x.fill('evenodd'); x.fillRect(cx - L * 0.07, cx - L * 0.5, L * 0.14, L); }
      const d = x.getImageData(0, 0, M, M).data; let transp = 0; for (let i = 3; i < d.length; i += 4) if (d[i] < 128) transp++; const useA = transp > M * M * 0.05;
      const m = new Float32Array(M * M); for (let i = 0; i < M * M; i++) { const o = i * 4, l = (d[o] * 0.2126 + d[o + 1] * 0.7152 + d[o + 2] * 0.0722) / 255; m[i] = (useA ? d[o + 3] / 255 : (d[o + 3] > 128 ? 1 - l : 0)); }
      logoM = { m, M };
    }
    function logoLoops() {
      const { m, M } = logoM, segs = [], lv = 0.5, F = (i, j) => (i < 0 || j < 0 || i >= M || j >= M ? 0 : m[j * M + i]);
      // grille agrandie d'une case de chaque côté pour fermer les contours ; arêtes : 2·o (horizontale), 2·o+1 (verticale)
      const W = M + 2, val = (i, j) => F(i - 1, j - 1);
      for (let j = 0; j < W - 1; j++) for (let i = 0; i < W - 1; i++) {
        const a = val(i, j), b = val(i + 1, j), c = val(i + 1, j + 1), dd = val(i, j + 1), idx = (a > lv ? 8 : 0) | (b > lv ? 4 : 0) | (c > lv ? 2 : 0) | (dd > lv ? 1 : 0);
        if (idx === 0 || idx === 15) continue; const o = j * W + i, T = 2 * o, Bm = 2 * (o + W), Lf = 2 * o + 1, R = 2 * (o + 1) + 1, e = (x, y) => segs.push(x, y);
        switch (idx) { case 1: case 14: e(Lf, Bm); break; case 2: case 13: e(Bm, R); break; case 3: case 12: e(Lf, R); break; case 4: case 11: e(T, R); break; case 6: case 9: e(T, Bm); break; case 7: case 8: e(Lf, T); break; case 5: e(Lf, T); e(Bm, R); break; case 10: e(T, R); e(Lf, Bm); break; }
      }
      const pos = (id) => { const o = id >> 1, i = o % W, j = (o / W) | 0; if ((id & 1) === 0) { const a = val(i, j), b = val(i + 1, j); return [i + (lv - a) / (b - a) - 1, j - 1]; } const a = val(i, j), b = val(i, j + 1); return [i - 1, j + (lv - a) / (b - a) - 1]; };
      const adj = new Map(); for (let s = 0; s < segs.length; s += 2) for (const [x, y] of [[segs[s], segs[s + 1]], [segs[s + 1], segs[s]]]) { const L = adj.get(x); if (L) L.push(y); else adj.set(x, [y]); }
      const seen = new Set(), loops = [];
      for (const st of adj.keys()) {
        if (seen.has(st)) continue; const loop = [st]; seen.add(st); let prev = -1, cur = st;
        for (;;) { const L = adj.get(cur); let nx = -1; for (const q of L) if (q !== prev && !seen.has(q)) { nx = q; break; } if (nx < 0) break; seen.add(nx); loop.push(nx); prev = cur; cur = nx; }
        if (loop.length > 8) loops.push(loop.map(pos));
      }
      return loops.sort((a, b) => b.length - a.length).filter((L, i) => i === 0 || L.length > 24).slice(0, 4).map((L) => ({ L, M }));
    }
    function simplify(P, eps) {
      if (P.length < 3) return P; let dm = 0, k = 0; const A = P[0], B = P[P.length - 1], dx = B[0] - A[0], dy = B[1] - A[1], L = Math.hypot(dx, dy) || 1;
      for (let i = 1; i < P.length - 1; i++) { const d = Math.abs((P[i][0] - A[0]) * dy - (P[i][1] - A[1]) * dx) / L; if (d > dm) { dm = d; k = i; } }
      if (dm <= eps) return [A, B]; return simplify(P.slice(0, k + 1), eps).slice(0, -1).concat(simplify(P.slice(k), eps));
    }

    // ——— Géométrie octilinéaire ———
    function route(A, B, diagFirst) {
      const dx = B[0] - A[0], dy = B[1] - A[1], d = Math.min(Math.abs(dx), Math.abs(dy)), sx = Math.sign(dx), sy = Math.sign(dy);
      const mid = diagFirst ? [A[0] + sx * d, A[1] + sy * d] : [B[0] - sx * d, B[1] - sy * d];
      return [mid, B];
    }
    function octi(W, R, g) {
      const snap = (q) => [Math.round(q[0] / g) * g, Math.round(q[1] / g) * g], P = [snap(W[0])];
      for (let i = 1; i < W.length; i++) { const B = snap(W[i]); P.push(...route(P[P.length - 1], B, R() < 0.5)); }
      // supprime les doublons et fusionne les segments alignés
      const out = [P[0]];
      for (let i = 1; i < P.length; i++) {
        const q = P[i], l = out[out.length - 1]; if (Math.hypot(q[0] - l[0], q[1] - l[1]) < 1e-6) continue;
        if (out.length >= 2) { const a = out[out.length - 2], c1 = (l[0] - a[0]) * (q[1] - l[1]) - (l[1] - a[1]) * (q[0] - l[0]), dot = (l[0] - a[0]) * (q[0] - l[0]) + (l[1] - a[1]) * (q[1] - l[1]); if (Math.abs(c1) < 1e-6 && dot > 0) { out[out.length - 1] = q; continue; } }
        out.push(q);
      }
      return out;
    }
    // échantillonnage avec angles arrondis, longueur cumulée
    function rounded(P, r0, closed) {
      const pts = [], n = P.length, Q = closed ? P.concat([P[0], P[1]]) : P;
      const push = (x, y) => { const l = pts[pts.length - 1]; if (!l || Math.hypot(x - l[0], y - l[1]) > 0.5) pts.push([x, y]); };
      if (!closed) push(P[0][0], P[0][1]);
      for (let i = 1; i < Q.length - 1; i++) {
        const a = Q[i - 1], b = Q[i], c = Q[i + 1], l1 = Math.hypot(b[0] - a[0], b[1] - a[1]), l2 = Math.hypot(c[0] - b[0], c[1] - b[1]); if (!l1 || !l2) continue;
        const r = Math.min(r0, l1 / 2, l2 / 2), u = [(b[0] - a[0]) / l1, (b[1] - a[1]) / l1], v = [(c[0] - b[0]) / l2, (c[1] - b[1]) / l2], s = [b[0] - u[0] * r, b[1] - u[1] * r], e = [b[0] + v[0] * r, b[1] + v[1] * r];
        push(s[0], s[1]); for (let k = 1; k <= 6; k++) { const t = k / 6, mt = 1 - t; push(mt * mt * s[0] + 2 * mt * t * b[0] + t * t * e[0], mt * mt * s[1] + 2 * mt * t * b[1] + t * t * e[1]); }
      }
      if (closed) push(pts[0][0], pts[0][1]); else push(P[n - 1][0], P[n - 1][1]);
      const cum = [0]; for (let i = 1; i < pts.length; i++) cum.push(cum[i - 1] + Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]));
      return { pts, cum, len: cum[cum.length - 1] };
    }
    function at(G, s) {
      s = Math.max(0, Math.min(G.len, s)); let lo = 0, hi = G.cum.length - 1; while (hi - lo > 1) { const mid = (lo + hi) >> 1; if (G.cum[mid] <= s) lo = mid; else hi = mid; }
      const a = G.pts[lo], b = G.pts[hi], L = G.cum[hi] - G.cum[lo] || 1, t = (s - G.cum[lo]) / L; return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, Math.atan2(b[1] - a[1], b[0] - a[0])];
    }

    function makeLine(P, col, g, closed, w, h) {
      const G = rounded(P, g * p.arrondi, closed), st = [], step = g * p.espacement;
      for (let s = step * 0.5; s < G.len - step * 0.3; s += step) { const q = at(G, s); if (q[0] > g && q[1] > g && q[0] < w - g && q[1] < h - g) st.push({ x: q[0], y: q[1], a: q[2], s, x2: false }); }
      return { G, col, st, closed };
    }

    function build(w, h) {
      buildLogo();
      const key = [p.lignes, p.maille, p.detours, p.etendue, p.espacement, p.arrondi, p.fleuve, p.logo, p.tailleLogo, app.seed, cycle, w, h, logoKey, userLines.length].join(); if (key === netKey && net) return net; netKey = key;
      const m = Math.min(w, h), g = p.maille * m, R = rngFrom((app.seed | 0) * 7919 + cycle * 104729 + 17), cx = w / 2, cy = h / 2, Rb = Math.hypot(w, h) / 2 + g * 2, C = p.couleurs.length ? p.couleurs : ['#000000'];
      const lines = [], toC = (q) => [q[0] - cx, q[1] - cy], fromC = (q) => [q[0] + cx, q[1] + cy];
      for (let k = 0; k < p.lignes; k++) {
        // chaque ligne traverse la carte par le centre étalé, sous un angle qui lui est propre
        const a = (k + R() * 0.7) / p.lignes * Math.PI, a2 = a + Math.PI + (R() - 0.5) * 1.1, d = [Math.cos(a), Math.sin(a)];
        const W = [[Math.cos(a) * Rb, Math.sin(a) * Rb]];
        const wp = []; for (let i = 0; i < p.detours; i++) { const r = Math.sqrt(R()) * p.etendue * m * 0.5, b = R() * TAU; wp.push([Math.cos(b) * r * (w / m) ** 0.5, Math.sin(b) * r]); }
        wp.sort((u, v) => (v[0] * d[0] + v[1] * d[1]) - (u[0] * d[0] + u[1] * d[1]));
        W.push(...wp, [Math.cos(a2) * Rb, Math.sin(a2) * Rb]);
        const P = octi(W, R, g).map(fromC);
        lines.push(makeLine(P, C[k % C.length], g, false, w, h));
      }
      for (const U of userLines) lines.push(makeLine(octi(U.pts.map(toC), rngFrom(U.seed), g).map(fromC), U.col, g, false, w, h));
      // ligne circulaire du logo
      if (p.logo && logoM) {
        const S = m * 0.5 * p.tailleLogo;
        for (const { L, M } of logoLoops()) {
          let far = 0, fd = 0; for (let i = 1; i < L.length; i++) { const d = Math.hypot(L[i][0] - L[0][0], L[i][1] - L[0][1]); if (d > fd) { fd = d; far = i; } }
          // boucle fermée : on la coupe au point le plus éloigné du départ avant de simplifier
          const s = simplify(L.slice(0, far + 1), 1.8).slice(0, -1).concat(simplify(L.slice(far).concat([L[0]]), 1.8).slice(0, -1)).map((q) => [(q[0] / M - 0.5) * 2 * S, (q[1] / M - 0.5) * 2 * S]);
          if (s.length < 3) continue; const P = octi(s.concat([s[0]]), rngFrom(99), g).map(fromC); P.pop();
          lines.push(makeLine(P, p.accent, g, true, w, h)); lines[lines.length - 1].logo = true;
        }
      }
      // correspondances : une station près d'une autre ligne
      for (const A of lines) for (const s of A.st) for (const B of lines) {
        if (A === B || s.x2) continue;
        for (let i = 0; i < B.G.pts.length; i += 2) { const q = B.G.pts[i]; if (Math.abs(q[0] - s.x) < g * 0.7 && Math.abs(q[1] - s.y) < g * 0.7) { s.x2 = true; break; } }
      }
      // fleuve : méandres octilinéaires d'un bord à l'autre
      let river = null;
      if (p.fleuve) {
        const W = []; const y0 = (R() - 0.5) * h * 0.4, amp = h * 0.16;
        for (let i = -1; i <= 6; i++) W.push([(i / 5 - 0.5) * (w + g * 6), y0 + Math.sin(i * 1.7 + R() * 2) * amp]);
        river = rounded(octi(W, R, g).map(fromC), g * 3, false);
      }
      net = { lines, g, river, m };
      return net;
    }
    function addUserLine(pts) {
      const C = p.couleurs.length ? p.couleurs : ['#000000'], used = new Set((net ? net.lines : []).map((l) => l.col));
      let col = C.find((c) => !used.has(c)) || C[(userLines.length + 1) % C.length];
      const s = simplify(pts, Math.max(8, Math.min(app.size.w, app.size.h) * p.maille * 0.8));
      userLines.push({ pts: s, col, seed: Math.floor(Math.random() * 1e9), t: simT }); if (userLines.length > 3) userLines.shift();
    }

    // ——— Dessin (canevas et SVG partagent les mêmes primitives) ———
    function render(pen, w, h, t) {
      const N = build(w, h), { g } = N, lw = g * p.epaisseur * 2.2, el = t - t0;
      if (N.river) pen.poly(N.river.pts, p.eau, g * 1.9, 1);
      const reveal = (k, L) => (app.thumbnail ? 1 : Math.max(0, Math.min(1, (el - k * 0.3) / 1.8))) * L;
      N.lines.forEach((Ln, k) => {
        const r = reveal(Ln.logo ? N.lines.length * 0.5 : k, Ln.G.len); if (r <= 0) return;
        const pts = []; for (let i = 0; i < Ln.G.pts.length && Ln.G.cum[i] <= r; i++) pts.push(Ln.G.pts[i]); const e = at(Ln.G, r); pts.push([e[0], e[1]]);

      });
      // stations : un petit trait perpendiculaire, ou un rond
      const sr = lw * 1.25;
      for (const Ln of N.lines) for (const s of Ln.st) {
        if (!(Ln.r >= s.s) || s.x2) continue;
        if (p.stations === 'ronds') pen.circle(s.x, s.y, lw * 0.55, p.fond, Ln.col, lw * 0.35);
        else { const nx = -Math.sin(s.a), ny = Math.cos(s.a); pen.poly([[s.x, s.y], [s.x + nx * sr, s.y + ny * sr]], Ln.col, lw * 0.75, 1); }
      }
      // correspondances : un rond par lieu, les voisins trop proches sont reliés par une barre
      const done = [];
      for (const Ln of N.lines) for (const s of Ln.st) {
        if (!(Ln.r >= s.s && s.x2)) continue; const near = done.find((q) => Math.hypot(q[0] - s.x, q[1] - s.y) < lw * 2.4);
        if (near) { if (Math.hypot(near[0] - s.x, near[1] - s.y) < lw * 0.8) continue; pen.poly([near, [s.x, s.y]], p.encre, lw * 1.1, 1); pen.poly([near, [s.x, s.y]], p.fond, lw * 0.5, 1); }
        done.push([s.x, s.y]);
      }
      for (const q of done) pen.circle(q[0], q[1], lw * 0.85, p.fond, p.encre, lw * 0.38);
      // rames : elles vont et viennent sur la partie visible de la ligne
      if (p.rames > 0) for (let k = 0; k < N.lines.length; k++) {
        const Ln = N.lines[k], L = Ln.G.len; if (!(Ln.r >= L)) continue;
        for (let i = 0; i < p.rames; i++) {
          const ph = (i / p.rames + k * 0.137) % 1, v = (t * p.vitesse * g * 1.6) / L;
          let s = (ph + v) % 1; s = Ln.closed ? s * L : (s < 0.5 ? s * 2 : 2 - s * 2) * L;
          const q = at(Ln.G, s); if (q[0] < -g || q[1] < -g || q[0] > w + g || q[1] > h + g) continue;
          pen.train(q[0], q[1], q[2], g * 0.95, lw * 0.62, p.encre === p.fond ? '#000000' : p.encre);
        }
      }
      if (drawing && drawing.pts.length > 1) pen.poly(drawing.pts, p.encre, 1.5, 0.6);
    }

    app.loop((t, dt) => {
      dt = Math.min(0.1, dt || 0);
      if (!app.thumbnail) simT += dt; else simT = 6;
      if (p.duree > 0 && !app.thumbnail && simT - t0 > p.duree) { cycle++; t0 = simT; userLines = []; }
      const { w, h, dpr } = app.size;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.fillStyle = p.fond; ctx.fillRect(0, 0, w, h);
      ctx.lineCap = 'round'; ctx.lineJoin = 'round';
      render({
        poly(P, col, lw, a) { ctx.globalAlpha = a; ctx.strokeStyle = col; ctx.lineWidth = lw; ctx.beginPath(); ctx.moveTo(P[0][0], P[0][1]); for (let i = 1; i < P.length; i++) ctx.lineTo(P[i][0], P[i][1]); ctx.stroke(); ctx.globalAlpha = 1; },
        circle(x, y, r, fill, stroke, sw) { ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fillStyle = fill; ctx.fill(); ctx.strokeStyle = stroke; ctx.lineWidth = sw; ctx.stroke(); },
        train(x, y, a, L, W, col) { ctx.save(); ctx.translate(x, y); ctx.rotate(a); ctx.fillStyle = col; ctx.beginPath(); ctx.roundRect(-L / 2, -W / 2, L, W, W / 2); ctx.fill(); ctx.fillStyle = p.fond; ctx.fillRect(-L * 0.3, -W * 0.16, L * 0.6, W * 0.32); ctx.restore(); },
      }, w, h, simT);
      app.finish(ctx);
    });

    function toSVG() {
      const { w, h } = app.size, f = (v) => +v.toFixed(1);
      let s = `<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><rect width="100%" height="100%" fill="${p.fond}"/>`;
      render({
        poly(P, col, lw, a) { s += `<path d="M${P.map((q) => f(q[0]) + ' ' + f(q[1])).join('L')}" fill="none" stroke="${col}" stroke-width="${f(lw)}" stroke-linecap="round" stroke-linejoin="round"${a < 1 ? ` stroke-opacity="${a}"` : ''}/>`; },
        circle(x, y, r, fill, stroke, sw) { s += `<circle cx="${f(x)}" cy="${f(y)}" r="${f(r)}" fill="${fill}" stroke="${stroke}" stroke-width="${f(sw)}"/>`; },
        train(x, y, a, L, W, col) { s += `<g transform="translate(${f(x)} ${f(y)}) rotate(${f(a * 180 / Math.PI)})"><rect x="${f(-L / 2)}" y="${f(-W / 2)}" width="${f(L)}" height="${f(W)}" rx="${f(W / 2)}" fill="${col}"/><rect x="${f(-L * 0.3)}" y="${f(-W * 0.16)}" width="${f(L * 0.6)}" height="${f(W * 0.32)}" fill="${p.fond}"/></g>`; },
      }, w, h, simT);
      return s + '</svg>';
    }
  </script>
</body>
</html>
