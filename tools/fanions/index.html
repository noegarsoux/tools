<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fanions</title>
  <link rel="stylesheet" href="../../assets/ui/atelier.css">
</head>
<body>
  <canvas></canvas>
  <script src="../../assets/ui/atelier.js"></script>
  <script>
    // Fanions : des guirlandes tendues en 3D (cordes en chaînes de Verlet, extrémités fixes). Chaque fanion est un
    // triangle accroché à deux nœuds de la corde, dont la pointe est libre. Le vent agit par la pression sur la
    // face : force ∝ ((vent − vitesse)·n) n, ce qui fait battre et retourner les fanions. Rendu en perspective,
    // la forme et le logo sont posés par une transformation affine sur les trois points projetés.
    const canvas = document.querySelector('canvas');
    const ctx = canvas.getContext('2d');
    const TAU = Math.PI * 2;
    const PAL = (k) => Atelier.PALETTES[k].colors;
    const BIE = PAL('biennale'), LUZ = PAL('luzern'), MEN = PAL('menthe');

    let vKey = '', logoM = null, logoKey = '', ptr = null, hov = null, S = null, gKey = '', simT = 0, gust = 0, bgC = null, bgKey = '';

    const app = Atelier.app({
      stage: canvas,
      animate: true,
      seed: true,
      finish: { grain: 0.035, vignette: 0.18 },
      hint: 'Survolez pour souffler · attrapez une corde et tirez · clic : rafale · molette : force du vent',
      notes: 'Des guirlandes de fanions aux couleurs de la marque, tendues à différentes profondeurs. Le vent pousse sur la face de chaque fanion : ils se soulèvent, battent et se retournent, et montrent leur envers plus sombre. Le logo est imprimé sur une partie d’entre eux. Survolez la scène pour souffler, attrapez une corde pour la tirer, cliquez pour une rafale.',
      params: {
        'Guirlandes': {
          cordes: { type: 'range', label: 'Guirlandes', min: 1, max: 6, step: 1, value: 3 },
          densite: { type: 'range', label: 'Fanions par corde', min: 4, max: 30, step: 1, value: 13 },
          taille: { type: 'range', label: 'Taille', min: 0.5, max: 2, step: 0.01, value: 1 },
          forme: { type: 'select', label: 'Forme', options: { triangle: 'Triangle', aronde: 'Queue d’aronde', drapeau: 'Drapeau', feston: 'Feston' }, value: 'triangle' },
          mou: { type: 'range', label: 'Mou de la corde', min: 0.01, max: 0.2, step: 0.005, value: 0.06 },
          profondeur: { type: 'range', label: 'Profondeur', min: 0, max: 1, step: 0.01, value: 0.6 },
        },
        'Vent': {
          vent: { type: 'range', label: 'Force', min: 0, max: 2.5, step: 0.01, value: 1 },
          direction: { type: 'range', label: 'Direction', min: -90, max: 90, step: 1, value: 25 },
          rafales: { type: 'range', label: 'Rafales', min: 0, max: 1, step: 0.01, value: 0.5 },
        },
        'Couleurs': {
          couleurs: { type: 'palette', label: 'Fanions', value: ['#e5452a', '#f2c230', '#2f5fd0', '#f4f1ea'] },
          logos: { type: 'range', label: 'Part de logos', min: 0, max: 1, step: 0.01, value: 0.35 },
          encre: { type: 'color', label: 'Logo', value: '#16161a' },
          corde: { type: 'color', label: 'Corde', value: '#3a3430' },
          fond: { type: 'color', label: 'Ciel', value: '#9dd3f0' },
          fond2: { type: 'color', label: 'Horizon', value: '#f4f1ea' },
          image: { type: 'file', label: 'Image du logo', accept: 'image/*' },
        },
      },
      presets: {
        'Fête': {},
        'Kermesse': { cordes: 5, densite: 18, taille: 0.8, couleurs: ['#e5452a', '#f4f1ea', '#2f5fd0'], fond: '#2f5fd0', fond2: '#9dd3f0', logos: 0.2 },
        'Grand vent': { vent: 2.2, rafales: 0.9, direction: 5, cordes: 2, fond: '#5a6b85', fond2: '#c9d3e0', mou: 0.04 },
        'Calme': { vent: 0.25, rafales: 0.15, mou: 0.12, fond: '#f2e3c9', fond2: '#fbf4e6' },
        'Queues d’aronde': { forme: 'aronde', couleurs: ['#16161a', '#f2c230'], encre: '#f2c230', logos: 0.5, fond: '#f2c230', fond2: '#f4f1ea', corde: '#16161a' },
        'Drapeaux': { forme: 'drapeau', cordes: 2, densite: 9, taille: 1.4, logos: 1, couleurs: ['#e5452a', '#2f5fd0', '#16161a'], encre: '#f4f1ea', fond: '#f4f1ea', fond2: '#e9e4da' },
        'Festons': { forme: 'feston', couleurs: ['#f2b0c8', '#b9a0e6', '#a4e0bc', '#f7e08c'], encre: '#7d38e7', fond: '#fbe3ea', fond2: '#ffffff', corde: '#7d38e7' },
        'Nuit': { fond: '#0e1222', fond2: '#2a2d50', couleurs: ['#f2c230', '#e5452a', '#f4f1ea'], corde: '#f4f1ea', encre: '#16161a' },
        'Biennale': { couleurs: [BIE[1], BIE[2], BIE[3], BIE[4]], encre: BIE[0], fond: BIE[3], fond2: BIE[0], corde: BIE[1] },
        'Luzern': { couleurs: [LUZ[0], LUZ[1], LUZ[4]], encre: LUZ[3], fond: LUZ[2], fond2: '#ffffff', corde: LUZ[3], forme: 'aronde' },
        'Menthe': { couleurs: [MEN[1], MEN[3], MEN[0]], encre: MEN[2], fond: MEN[2], fond2: MEN[0], corde: MEN[1], forme: 'feston' },
      },
      brand(colors) {
        const s = colors.slice().sort((a, b) => lum(a) - lum(b)), D = s[0], L = s[s.length - 1], mid = s.length > 2 ? s.slice(1, -1) : [D];
        return { couleurs: colors.slice(), encre: D, corde: D, fond: mix(mid[mid.length - 1], L, 0.55), fond2: L };
      },
      pointer: {
        down: (q) => { ptr = { x: q.x, y: q.y, vx: 0, vy: 0, moved: 0, n: S ? grab(q) : null }; },
        drag: (q) => { if (!ptr) return; ptr.vx = q.x - ptr.x; ptr.vy = q.y - ptr.y; ptr.moved += Math.hypot(ptr.vx, ptr.vy); ptr.x = q.x; ptr.y = q.y; hov = { x: q.x, y: q.y, vx: ptr.vx, vy: ptr.vy, t: simT }; },
        move: (q) => { hov = { x: q.x, y: q.y, vx: hov ? q.x - hov.x : 0, vy: hov ? q.y - hov.y : 0, t: simT }; },
        up: () => { if (ptr && ptr.moved < 6 && !ptr.n) gust = 1; ptr = null; },
        wheel: (q, dy) => app.set('vent', Math.max(0, Math.min(2.5, +(p.vent + (dy > 0 ? -0.1 : 0.1)).toFixed(2)))),
      },
      onChange(k) { if (['*', 'image'].includes(k)) logoKey = ''; },
      export: { name: 'fanions', svg: () => toSVG() },
    });
    const p = app.params;

    function hex(x) { const n = parseInt(x.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
    function lum(x) { const c = hex(x); return (c[0] * 0.299 + c[1] * 0.587 + c[2] * 0.114) / 255; }
    function mix(a, b, t) { const A = hex(a), C = hex(b); return '#' + A.map((v, i) => Math.round(v + (C[i] - v) * t).toString(16).padStart(2, '0')).join(''); }
    function rgba(c, a) { const h = hex(c); return `rgba(${h[0]},${h[1]},${h[2]},${a})`; }
    function rng(s) { let a = s >>> 0; return () => { a = (a + 0x6d2b79f5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }

    function buildLogo() {
      const img0 = p.image || app.logoImg, key = img0 ? (img0.src || 'c') : 'demo'; if (key === logoKey) return; logoKey = key; vKey = '';
      const M = 200, c = document.createElement('canvas'); c.width = c.height = M; const x = c.getContext('2d', { willReadFrequently: true }), L = M * 0.94, cx = M / 2;
      if (img0) { const iw = img0.naturalWidth || img0.width, ih = img0.naturalHeight || img0.height, s = L / Math.max(iw, ih); x.drawImage(img0, cx - iw * s / 2, cx - ih * s / 2, iw * s, ih * s); }
      else { x.fillStyle = '#000'; x.beginPath(); x.arc(cx, cx, L * 0.48, 0, TAU); x.arc(cx, cx, L * 0.27, 0, TAU, true); x.fill('evenodd'); x.fillRect(cx - L * 0.07, cx - L * 0.5, L * 0.14, L); }
      const d = x.getImageData(0, 0, M, M).data; let transp = 0; for (let i = 3; i < d.length; i += 4) if (d[i] < 128) transp++; const useA = transp > M * M * 0.05;
      const F = new Float64Array(M * M); for (let i = 0; i < M * M; i++) { const o = i * 4, l = (d[o] * 0.2126 + d[o + 1] * 0.7152 + d[o + 2] * 0.0722) / 255; F[i] = useA ? d[o + 3] / 255 : (d[o + 3] / 255) * Math.min(1, Math.max(0, (0.75 - l) * 2)); }
      { const G2 = new Float64Array(M * M); for (let j = 1; j < M - 1; j++) for (let i = 1; i < M - 1; i++) { let a = 0; for (let b = -1; b <= 1; b++) for (let c = -1; c <= 1; c++) a += F[(j + b) * M + i + c] * (b || c ? (b && c ? 1 : 2) : 4); G2[j * M + i] = a / 16; } F.set(G2); }
      for (let k = 0; k < M; k++) F[k] = F[(M - 1) * M + k] = F[k * M] = F[k * M + M - 1] = 0;
      logoM = contours(F, M, M, 0.5, 0, 0, 1).filter((c) => c.closed && c.pts.length > 6).map((c) => chaikin(chaikin(c.pts, true), true).map((q) => [q[0] / M - 0.5, q[1] / M - 0.5]));
    }
    // carrés marchants + chaînage
    function contours(F, nx, ny, lev, ox, oy, cs) {
      const pt = new Map(), adj = new Map();
      const P = (id) => { let q = pt.get(id); if (q) return q; const cell = id >> 1, i = cell % nx, j = (cell - i) / nx; let a, b, ax, ay, bx, by; if (id & 1) { a = F[j * nx + i]; b = F[(j + 1) * nx + i]; ax = bx = i; ay = j; by = j + 1; } else { a = F[j * nx + i]; b = F[j * nx + i + 1]; ay = by = j; ax = i; bx = i + 1; } const t = (lev - a) / (b - a || 1e-9); q = [ox + (ax + (bx - ax) * t) * cs, oy + (ay + (by - ay) * t) * cs]; pt.set(id, q); return q; };
      const link = (a, b) => { (adj.get(a) || adj.set(a, []).get(a)).push(b); (adj.get(b) || adj.set(b, []).get(b)).push(a); };
      for (let j = 0; j < ny - 1; j++) for (let i = 0; i < nx - 1; i++) {
        const A = F[j * nx + i] > lev, B = F[j * nx + i + 1] > lev, C = F[(j + 1) * nx + i + 1] > lev, D = F[(j + 1) * nx + i] > lev, idx = A | (B << 1) | (C << 2) | (D << 3);
        if (idx === 0 || idx === 15) continue;
        const T = (j * nx + i) * 2, R = (j * nx + i + 1) * 2 + 1, Bo = ((j + 1) * nx + i) * 2, Le = (j * nx + i) * 2 + 1;
        const ctr = (F[j * nx + i] + F[j * nx + i + 1] + F[(j + 1) * nx + i + 1] + F[(j + 1) * nx + i]) / 4 > lev;
        switch (idx) {
          case 1: case 14: link(Le, T); break; case 2: case 13: link(T, R); break; case 3: case 12: link(Le, R); break;
          case 4: case 11: link(R, Bo); break; case 6: case 9: link(T, Bo); break; case 7: case 8: link(Le, Bo); break;
          case 5: if (ctr) { link(Le, Bo); link(T, R); } else { link(Le, T); link(R, Bo); } break;
          case 10: if (ctr) { link(Le, T); link(R, Bo); } else { link(Le, Bo); link(T, R); } break;
        }
      }
      const seen = new Set(), out = [];
      const walk = (s) => { const L = [s]; seen.add(s); let cur = s; for (;;) { const nb = (adj.get(cur) || []).find((x) => !seen.has(x)); if (nb === undefined) break; seen.add(nb); L.push(nb); cur = nb; } return L; };
      for (const [id, nb] of adj) if (nb.length === 1 && !seen.has(id)) out.push({ pts: walk(id).map(P), closed: false });
      for (const [id] of adj) if (!seen.has(id)) out.push({ pts: walk(id).map(P), closed: true });
      return out;
    }
    function chaikin(pts, closed) {
      const o = []; const n = pts.length; for (let k = 0; k < (closed ? n : n - 1); k++) { const a = pts[k], b = pts[(k + 1) % n]; o.push([a[0] * 0.75 + b[0] * 0.25, a[1] * 0.75 + b[1] * 0.25], [a[0] * 0.25 + b[0] * 0.75, a[1] * 0.25 + b[1] * 0.75]); }
      if (!closed) { o.unshift(pts[0]); o.push(pts[n - 1]); } return o;
    }

    // formes dans le repère du fanion : A=(0,0), B=(1,0), pointe=(0.5,1)
    function shapeOf(k) {
      if (k === 'aronde') return [[0, 0], [1, 0], [1, 1], [0.5, 0.68], [0, 1]];
      if (k === 'drapeau') return [[0, 0], [1, 0], [1, 0.82], [0, 0.82]];
      if (k === 'feston') { const o = [[0, 0], [1, 0], [1, 0.42]]; for (let i = 0; i <= 16; i++) { const a = i / 16 * Math.PI; o.push([0.5 + Math.cos(a) * 0.5, 0.42 + Math.sin(a) * 0.5]); } return o; }
      return [[0, 0], [1, 0], [0.5, 1]];
    }
    const logoV = (k) => (k === 'triangle' ? 0.34 : k === 'aronde' ? 0.4 : k === 'feston' ? 0.45 : 0.41);

    // ——— construction ———
    function build(w, h) {
      const K = Math.round(p.cordes), R = rng(app.seed * 19 + 7), F = Math.max(w, h) * 1.3;
      S = { w, h, F, ropes: [], pens: [], cx: w / 2, cy: h / 2 };
      const pw = Math.min(w, h) * 0.075 * p.taille, ph = pw * (p.forme === 'drapeau' ? 1.05 : 1.25);
      S.pw = pw; S.ph = ph;
      for (let k = 0; k < K; k++) {
        const z = (K === 1 ? 0 : (k / (K - 1) - 0.5)) * Math.min(w, h) * 1.1 * p.profondeur;
        const s = F / (F + z), wide = w / s * 1.1;
        const yA = h * (0.1 + 0.5 * (K === 1 ? 0.25 : k / (K - 1)) + (R() - 0.5) * 0.12), yB = h * (0.1 + 0.5 * (K === 1 ? 0.25 : k / (K - 1)) + (R() - 0.5) * 0.24);
        const unp = (X, Y) => [S.cx + (X - S.cx) / s, S.cy + (Y - S.cy) / s];
        const a = unp(w / 2 - wide * s / 2, yA), b = unp(w / 2 + wide * s / 2, yB);
        const span = Math.hypot(b[0] - a[0], b[1] - a[1]), seg = pw / 2 / s * 0 + pw * 0.5;
        const M = Math.max(8, Math.round(span / seg)), L = span * (1 + p.mou) / M, N = [];
        for (let i = 0; i <= M; i++) { const t = i / M, x = a[0] + (b[0] - a[0]) * t, y = a[1] + (b[1] - a[1]) * t + Math.sin(t * Math.PI) * span * Math.sqrt(p.mou * 0.375); N.push({ x, y, z, px: x, py: y, pz: z, fix: i === 0 || i === M }); }
        const rope = { N, L, z, k }; S.ropes.push(rope);
        // fanions : chacun occupe 2 segments, avec un espace réglé par la densité
        const n = Math.round(p.densite * (1 + (z < 0 ? -z : 0) / (Math.min(w, h)) * 0)), step = Math.max(3, Math.floor(M / n));
        const C = p.couleurs.length ? p.couleurs : ['#e5452a'];
        let ci = Math.floor(R() * C.length);
        for (let i = 1; i + 2 < M; i += step) {
          const A = N[i], B = N[i + 2], hx = (A.x + B.x) / 2, hy = (A.y + B.y) / 2 + ph;
          const T = { x: hx + (R() - 0.5) * 2, y: hy, z: z + (R() - 0.5) * 2, px: hx, py: hy, pz: z };
          const wAB = Math.hypot(B.x - A.x, B.y - A.y), lt = Math.hypot(ph, wAB / 2);
          S.pens.push({ A, B, T, lt, c: ci % C.length, logo: R() < p.logos, rope, ph: R() * TAU, k });
          ci++;
        }
      }
      for (let i = 0; i < 200; i++) physics(1 / 60, true);
    }

    // ——— vent ———
    function windAt(x, y, z, t) {
      const d = p.direction * Math.PI / 180, V = p.vent * Math.min(S.w, S.h) * 1.4;
      const gx = x / S.w, g1 = Math.sin(gx * 5 - t * 1.7 + y / S.h * 2) * 0.5 + 0.5, g2 = Math.sin(gx * 11 + t * 2.9 - z * 0.003) * 0.5 + 0.5, g3 = Math.sin(t * 0.37) * 0.5 + 0.5;
      const m = V * ((1 - p.rafales) * 0.7 + p.rafales * (0.25 + 1.1 * g1 * g3 + 0.35 * g2)) * (1 + gust * 2.2);
      return [Math.sin(d) * m, -m * 0.08, -Math.cos(d) * m];
    }
    function physics(dt, quiet) {
      const g = Math.min(S.w, S.h) * 2.6, t = simT;
      const all = [];
      for (const r of S.ropes) for (const n of r.N) all.push(n);
      for (const q of S.pens) all.push(q.T);
      for (const n of all) {
        if (n.fix || n.held) { n.px = n.x; n.py = n.y; n.pz = n.z; continue; }
        const vx = n.x - n.px, vy = n.y - n.py, vz = n.z - n.pz; n.px = n.x; n.py = n.y; n.pz = n.z;
        n.x += vx * 0.985; n.y += vy * 0.985 + g * dt * dt; n.z += vz * 0.985;
      }
      // pression du vent sur chaque face
      const kA = 2.4;
      for (const q of S.pens) {
        const { A, B, T } = q, ux = B.x - A.x, uy = B.y - A.y, uz = B.z - A.z, vx = T.x - A.x, vy = T.y - A.y, vz = T.z - A.z;
        let nx = uy * vz - uz * vy, ny = uz * vx - ux * vz, nz = ux * vy - uy * vx; const nl = Math.hypot(nx, ny, nz) || 1; nx /= nl; ny /= nl; nz /= nl;
        const W = windAt(T.x, T.y, T.z, t), tv = [(T.x - T.px) / dt, (T.y - T.py) / dt, (T.z - T.pz) / dt];
        // souffle du pointeur
        if (hov && simT - hov.t < 0.25) { const dx = T.x - hov.x, dy = T.y - hov.y, rr = Math.min(S.w, S.h) * 0.18, d2 = dx * dx + dy * dy; if (d2 < rr * rr) { const f = (1 - Math.sqrt(d2) / rr) * 60; W[0] += hov.vx * f; W[1] += hov.vy * f; W[2] -= (Math.abs(hov.vx) + Math.abs(hov.vy)) * f * 0.6; } }
        const tur = Math.sin(t * 7.3 + q.ph) * 0.35 + Math.sin(t * 13.1 + q.ph * 2.3) * 0.2;
        const rel = (W[0] - tv[0]) * nx + (W[1] - tv[1]) * ny + (W[2] - tv[2]) * nz, f = kA * rel * dt * dt * (1 + tur);
        T.x += nx * f; T.y += ny * f; T.z += nz * f;
        // traînée le long du vent (le fanion s'aligne)
        const dr = 0.12 * dt * dt; T.x += (W[0] - tv[0]) * dr; T.y += (W[1] - tv[1]) * dr; T.z += (W[2] - tv[2]) * dr;
        const fr = f * 0.25; for (const n of [A, B]) if (!n.fix && !n.held) { n.x += nx * fr; n.y += ny * fr; n.z += nz * fr; }
      }
      if (ptr && ptr.n) { const n = ptr.n, s = S.F / (S.F + n.z); n.x = S.cx + (ptr.x - S.cx) / s; n.y = S.cy + (ptr.y - S.cy) / s; }
      for (let it = 0; it < 8; it++) {
        for (const r of S.ropes) { const N = r.N; for (let i = 0; i < N.length - 1; i++) { const a = N[i], b = N[i + 1]; dist(a, b, r.L, 1); } }
        for (const q of S.pens) { dist(q.A, q.T, q.lt, 0.5); dist(q.B, q.T, q.lt, 0.5); }
      }
    }
    function dist(a, b, L, wb) {
      const dx = b.x - a.x, dy = b.y - a.y, dz = b.z - a.z, d = Math.hypot(dx, dy, dz) || 1e-6; if (d <= L && wb === 1) return; // corde : pas de compression
      const ia = a.fix || a.held ? 0 : wb === 1 ? 1 : 0.15, ib = b.fix || b.held ? 0 : 1, sum = ia + ib; if (!sum) return;
      const k = (d - L) / d / sum; a.x += dx * k * ia; a.y += dy * k * ia; a.z += dz * k * ia; b.x -= dx * k * ib; b.y -= dy * k * ib; b.z -= dz * k * ib;
    }
    function proj(n) { const s = S.F / (S.F + n.z); return [S.cx + (n.x - S.cx) * s, S.cy + (n.y - S.cy) * s, s]; }
    function grab(q) {
      let best = null, bd = 30; for (const r of S.ropes) for (const n of r.N) { if (n.fix) continue; const P = proj(n), d = Math.hypot(P[0] - q.x, P[1] - q.y); if (d < bd) { bd = d; best = n; } }
      if (best) best.held = true; return best;
    }

    // ——— rendu ———
    function sky(dpr) {
      const { w, h } = S, key = [w, h, dpr, p.fond, p.fond2].join('|'); if (key === bgKey) return bgC; bgKey = key;
      const c = bgC || document.createElement('canvas'); c.width = Math.ceil(w * dpr); c.height = Math.ceil(h * dpr); bgC = c;
      const g = c.getContext('2d'); g.setTransform(dpr, 0, 0, dpr, 0, 0);
      const lg = g.createLinearGradient(0, 0, 0, h); lg.addColorStop(0, p.fond); lg.addColorStop(1, p.fond2); g.fillStyle = lg; g.fillRect(0, 0, w, h);
      const sg = g.createRadialGradient(w * 0.78, h * 0.12, 0, w * 0.78, h * 0.12, Math.max(w, h) * 0.6); sg.addColorStop(0, 'rgba(255,255,255,0.35)'); sg.addColorStop(1, 'rgba(255,255,255,0)'); g.fillStyle = sg; g.fillRect(0, 0, w, h);
      return c;
    }
    const LIGHT = (() => { const v = [-0.35, -0.6, -0.72], l = Math.hypot(...v); return v.map((x) => x / l); })();
    function penInfo(q) {
      const a = proj(q.A), b = proj(q.B), t = proj(q.T), mx = (a[0] + b[0]) / 2, my = (a[1] + b[1]) / 2;
      const front = (b[0] - a[0]) * (t[1] - a[1]) - (b[1] - a[1]) * (t[0] - a[0]) > 0;
      const ux = q.B.x - q.A.x, uy = q.B.y - q.A.y, uz = q.B.z - q.A.z, vx = q.T.x - q.A.x, vy = q.T.y - q.A.y, vz = q.T.z - q.A.z;
      let nx = uy * vz - uz * vy, ny = uz * vx - ux * vz, nz = ux * vy - uy * vx; const nl = Math.hypot(nx, ny, nz) || 1;
      const dl = Math.abs((nx * LIGHT[0] + ny * LIGHT[1] + nz * LIGHT[2]) / nl);
      return { a, b, t, m: [mx, my], front, dl, z: (q.A.z + q.B.z + q.T.z) / 3 };
    }
    function drawPen(g, q, I, C, dpr) {
      const col = C[q.c % C.length], sh = shapeOf(p.forme), base = I.front ? col : mix(col, '#000000', 0.2);
      const m = [I.b[0] - I.a[0], I.b[1] - I.a[1], I.t[0] - I.m[0], I.t[1] - I.m[1], I.a[0], I.a[1]];
      g.setTransform(m[0] * dpr, m[1] * dpr, m[2] * dpr, m[3] * dpr, m[4] * dpr, m[5] * dpr);
      g.beginPath(); sh.forEach((pt, i) => (i ? g.lineTo(pt[0], pt[1]) : g.moveTo(pt[0], pt[1]))); g.closePath();
      g.fillStyle = base; g.fill();
      if (q.logo && logoM) {
        const ls = 0.42, asp = S.pw / S.ph, vc = logoV(p.forme);
        g.save(); g.clip();
        g.fillStyle = I.front ? p.encre : rgba(mix(p.encre, base, 0.55), 1); g.beginPath();
        // l'envers montre le logo en miroir
        for (const lp of logoM) { lp.forEach((qq, i) => { const u = 0.5 + (I.front ? qq[0] : -qq[0]) * ls, v = vc + qq[1] * ls * asp; i ? g.lineTo(u, v) : g.moveTo(u, v); }); g.closePath(); }
        g.fill('evenodd'); g.restore();
        g.beginPath(); sh.forEach((pt, i) => (i ? g.lineTo(pt[0], pt[1]) : g.moveTo(pt[0], pt[1]))); g.closePath();
      }
      // ombrage selon l'orientation, et pli de la pointe
      const sv = 0.82 + 0.3 * I.dl; g.fillStyle = sv < 1 ? `rgba(0,0,0,${(1 - sv) * 0.9})` : `rgba(255,255,255,${(sv - 1) * 0.9})`; g.fill();
      const lg = g.createLinearGradient(0, 0, 0, 1); lg.addColorStop(0, 'rgba(0,0,0,0.12)'); lg.addColorStop(0.18, 'rgba(0,0,0,0)'); lg.addColorStop(0.6, 'rgba(255,255,255,0)'); lg.addColorStop(1, `rgba(0,0,0,${0.08 + 0.1 * Math.sin(simT * 6 + q.ph) ** 2})`); g.fillStyle = lg; g.fill();
    }

    app.loop((t, dt) => {
      dt = Math.min(1 / 20, dt || 0);
      const { w, h, dpr } = app.size; buildLogo();
      const key = [w, h, p.cordes, p.densite, p.taille, p.forme, p.mou, p.profondeur, p.logos, app.seed, (p.couleurs || []).length].join('|'); if (!S || key !== gKey) { gKey = key; build(w, h); }
      if (app.thumbnail) { if (!S.th) { S.th = true; for (let k = 0; k < 240; k++) { simT += 1 / 120; physics(1 / 120); } } }
      else { gust = Math.max(0, gust - dt * 0.8); const n = 2; for (let k = 0; k < n; k++) { simT += dt / n; physics(dt / n); } }
      if (!ptr) for (const r of S.ropes) for (const n of r.N) n.held = false;
      const C = p.couleurs.length ? p.couleurs : ['#e5452a'];
      ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.drawImage(sky(dpr), 0, 0);
      // de l'arrière vers l'avant : chaque corde avec ses fanions
      const ropes = S.ropes.slice().sort((a, b) => b.z - a.z);
      for (const r of ropes) {
        const P = r.N.map(proj), s0 = P[Math.floor(P.length / 2)][2];
        const fog = Math.max(0, Math.min(0.55, (r.z / (Math.min(w, h) * 0.6)) * 0.45));
        const pens = S.pens.filter((q) => q.rope === r).map((q) => ({ q, I: penInfo(q) }));
        // fanions derrière la corde puis devant
        const behind = pens.filter((o) => o.I.z > r.z), front = pens.filter((o) => o.I.z <= r.z);
        for (const o of behind) drawPen(ctx, o.q, o.I, C, dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        ctx.strokeStyle = p.corde; ctx.lineWidth = Math.max(0.8, 1.6 * s0 * Math.min(w, h) / 700); ctx.lineJoin = 'round'; ctx.beginPath(); P.forEach((q, i) => (i ? ctx.lineTo(q[0], q[1]) : ctx.moveTo(q[0], q[1]))); ctx.stroke();
        for (const o of front) drawPen(ctx, o.q, o.I, C, dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        if (fog > 0) { ctx.globalAlpha = fog; ctx.drawImage(sky(dpr), 0, 0, w, h); ctx.globalAlpha = 1; }
      }
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      app.finish(ctx);
    });

    // ——— SVG ———
    function toSVG() {
      const { w, h } = app.size, f = (v) => +v.toFixed(2); buildLogo(); const C = p.couleurs.length ? p.couleurs : ['#e5452a'];
      let o = `<defs><linearGradient id="ciel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${p.fond}"/><stop offset="1" stop-color="${p.fond2}"/></linearGradient></defs><rect width="100%" height="100%" fill="url(#ciel)"/>`;
      const sh = shapeOf(p.forme), ropes = S.ropes.slice().sort((a, b) => b.z - a.z);
      for (const r of ropes) {
        const P = r.N.map(proj), s0 = P[Math.floor(P.length / 2)][2], fog = Math.max(0, Math.min(0.55, (r.z / (Math.min(w, h) * 0.6)) * 0.45));
        const pens = S.pens.filter((q) => q.rope === r).map((q) => ({ q, I: penInfo(q) }));
        const one = ({ q, I }) => {
          const col = C[q.c % C.length], base = I.front ? col : mix(col, '#000000', 0.2), sv = 0.82 + 0.3 * I.dl, fc = sv < 1 ? mix(base, '#000000', (1 - sv) * 0.9) : mix(base, '#ffffff', (sv - 1) * 0.9);
          const mt = `matrix(${f(I.b[0] - I.a[0])} ${f(I.b[1] - I.a[1])} ${f(I.t[0] - I.m[0])} ${f(I.t[1] - I.m[1])} ${f(I.a[0])} ${f(I.a[1])})`;
          const tr = (u, v) => [I.a[0] + (I.b[0] - I.a[0]) * u + (I.t[0] - I.m[0]) * v, I.a[1] + (I.b[1] - I.a[1]) * u + (I.t[1] - I.m[1]) * v];
          let s = `<path d="M${sh.map((pt) => { const z = tr(pt[0], pt[1]); return f(z[0]) + ' ' + f(z[1]); }).join('L')}Z" fill="${fc}"/>`;
          if (q.logo && logoM) { const ls = 0.42, asp = S.pw / S.ph, vc = logoV(p.forme); s += `<path fill-rule="evenodd" fill="${I.front ? p.encre : mix(p.encre, base, 0.55)}" d="${logoM.map((l) => 'M' + l.filter((_, i) => i % 2 === 0).map((qq) => { const z = tr(0.5 + (I.front ? qq[0] : -qq[0]) * ls, vc + qq[1] * ls * asp); return +z[0].toFixed(1) + ' ' + +z[1].toFixed(1); }).join('L') + 'Z').join('')}"/>`; void mt; }
          return s;
        };
        o += pens.filter((x) => x.I.z > r.z).map(one).join('');
        o += `<path d="M${P.map((q) => f(q[0]) + ' ' + f(q[1])).join('L')}" fill="none" stroke="${p.corde}" stroke-width="${f(Math.max(0.8, 1.6 * s0 * Math.min(w, h) / 700))}" stroke-linejoin="round"/>`;
        o += pens.filter((x) => x.I.z <= r.z).map(one).join('');
        if (fog > 0) o += `<rect width="100%" height="100%" fill="url(#ciel)" opacity="${f(fog)}"/>`;
      }
      return `<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">${o}</svg>`;
    }
  </script>
