<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Graphe à ressorts</title>
  <link rel="stylesheet" href="../../assets/ui/atelier.css">
</head>
<body>
  <canvas></canvas>
  <script src="../../assets/ui/atelier.js"></script>
  <script>
    // Graphe à ressorts : dessin de graphe par forces. Chaque lien est un ressort de longueur L, chaque paire de nœuds
    // se repousse en L²/d (voisins proches seulement, grâce à une grille de cases), un léger rappel garde le tout au
    // centre. Le réseau pousse nœud après nœud depuis son parent ; une agitation douce le garde vivant. Le logo,
    // échantillonné en autant de points que de nœuds, tire chaque nœud vers sa place dans la silhouette.
    const canvas = document.querySelector('canvas');
    const ctx = canvas.getContext('2d');
    const TAU = Math.PI * 2;
    const PAL = (k) => Atelier.PALETTES[k].colors;
    const BIEN = PAL('biennale'), GLY = PAL('glyphes'), SAL = PAL('salon'), MEN = PAL('menthe'), KB = PAL('kegelbahn');

    let G = null, gKey = '', simT = 0, cycle = 0, born = 0, cam = null, grab = null, logoKey = '', logoPts = null, rot = 0;

    const app = Atelier.app({
      stage: canvas,
      animate: true,
      seed: true,
      finish: { grain: 0.03, vignette: 0.12 },
      hint: 'Tirez un nœud · touchez le vide pour greffer un nœud · molette : longueur des liens',
      notes: 'Comment dessiner un réseau sans que ses liens s\'emmêlent ? En 1991, Fruchterman et Reingold proposent de laisser la physique faire le travail : chaque lien devient un ressort, chaque nœud repousse les autres comme une charge électrique, et le système glisse de lui-même vers une forme où les grappes se séparent et où les liens ont à peu près tous la même longueur. C\'est ainsi que Gephi et la plupart des outils dessinent aujourd\'hui les réseaux sociaux. Ici le réseau pousse sous vos yeux : arbre où les nœuds populaires attirent les nouveaux venus, petit monde, grappes reliées par quelques ponts, ou maillage qui s\'étire comme un tissu. Le logo, s\'il est activé, attire chaque nœud vers sa place dans la silhouette.',
      params: {
        'Réseau': {
          structure: { type: 'select', label: 'Structure', options: { arbre: 'Arbre (les riches s\'enrichissent)', grappes: 'Grappes reliées par des ponts', monde: 'Petit monde', maillage: 'Maillage' }, value: 'arbre' },
          noeuds: { type: 'range', label: 'Nœuds', min: 20, max: 700, step: 1, value: 320 },
          boucles: { type: 'range', label: 'Liens en plus', min: 0, max: 1, step: 0.01, value: 0.12 },
          grappes: { type: 'range', label: 'Grappes', min: 2, max: 12, step: 1, value: 6, show: (q) => q.structure === 'grappes' },
        },
        'Mouvement': {
          croissance: { type: 'toggle', label: 'Croissance en boucle', value: true },
          duree: { type: 'range', label: 'Durée de la pousse (s)', min: 3, max: 40, step: 0.5, value: 14, show: (q) => q.croissance },
          agitation: { type: 'range', label: 'Agitation', min: 0, max: 1, step: 0.01, value: 0.3 },
          longueur: { type: 'range', label: 'Longueur des liens', min: 0.4, max: 2.5, step: 0.01, value: 1 },
          repulsion: { type: 'range', label: 'Répulsion', min: 0.2, max: 3, step: 0.01, value: 1 },
          rotation: { type: 'range', label: 'Rotation (°/s)', min: -15, max: 15, step: 0.5, value: 2 },
        },
        'Trait': {
          forme: { type: 'segmented', label: 'Liens', options: { droits: 'Droits', courbes: 'Courbes' }, value: 'droits' },
          epaisseur: { type: 'range', label: 'Épaisseur', min: 0.2, max: 3, step: 0.05, value: 1 },
          opacite: { type: 'range', label: 'Opacité des liens', min: 0.1, max: 1, step: 0.01, value: 0.7 },
          points: { type: 'range', label: 'Taille des nœuds', min: 0, max: 8, step: 0.1, value: 2.8 },
          selon: { type: 'segmented', label: 'Couleur selon', options: { grappe: 'Famille', profondeur: 'Profondeur', degre: 'Liens' }, value: 'grappe' },
        },
        'Logo aimant': {
          logo: { type: 'toggle', label: 'Le logo attire les nœuds', value: false },
          fidelite: { type: 'range', label: 'Force de l\'aimant', min: 0.05, max: 1, step: 0.01, value: 0.5, show: (q) => q.logo },
          image: { type: 'file', label: 'Logo', accept: 'image/*', show: (q) => q.logo },
        },
        'Couleurs': {
          fond: { type: 'color', label: 'Fond', value: '#0c0d12' },
          couleurs: { type: 'palette', label: 'Familles', value: ['#486cfc', '#f272ba', '#edd14b', '#7fe0c2', '#f4f1ea'] },
          liens: { type: 'segmented', label: 'Couleur des liens', options: { noeuds: 'Des nœuds', unie: 'Unie' }, value: 'noeuds' },
          trait: { type: 'color', label: 'Liens', value: '#8a8fa3', show: (q) => q.liens === 'unie' },
        },
      },
      presets: {
        'Arbre': {},
        'Grappes': { structure: 'grappes', noeuds: 360, grappes: 6, boucles: 0.2, couleurs: ['#ef5a2f', '#edd14b', '#486cfc', '#7fe0c2', '#f272ba', '#f4f1ea'] },
        'Petit monde': { structure: 'monde', noeuds: 260, boucles: 0.25, forme: 'courbes', selon: 'profondeur', couleurs: ['#486cfc', '#f272ba', '#edd14b'], points: 1.6 },
        'Maillage': { structure: 'maillage', noeuds: 400, agitation: 0.5, points: 1.2, selon: 'profondeur', couleurs: ['#7fe0c2', '#486cfc', '#2a2f5c'], fond: '#0a0d14', rotation: 0 },
        'Constellation': { noeuds: 500, boucles: 0, points: 1.6, epaisseur: 0.5, opacite: 0.5, liens: 'unie', trait: '#6b7088', couleurs: ['#f4f1ea', '#edd14b'], selon: 'degre', fond: '#06070b' },
        'Papier': { fond: '#f1ece1', couleurs: ['#1b1b1f', '#ef5a2f'], liens: 'unie', trait: '#1b1b1f', opacite: 0.55, points: 2.8, selon: 'degre', noeuds: 260 },
        'Logo': { logo: true, noeuds: 480, structure: 'arbre', boucles: 0.15, fidelite: 0.85, points: 3, couleurs: ['#ef5a2f', '#f4f1ea'], selon: 'degre', liens: 'unie', trait: '#5a5a66', points: 2 },
        'Biennale': { fond: BIEN[0], couleurs: [BIEN[1], BIEN[2], BIEN[3]], liens: 'unie', trait: BIEN[1], opacite: 0.6, structure: 'grappes', grappes: 4 },
        'Menthe': { fond: MEN[1], couleurs: [MEN[0], MEN[2], MEN[3]], forme: 'courbes', structure: 'monde', noeuds: 300, boucles: 0.3 },
        'Kegelbahn': { fond: KB[0], couleurs: [KB[1], KB[2]], structure: 'maillage', noeuds: 360, points: 1.4, selon: 'profondeur' },
      },
      brand(colors) {
        const s = colors.slice().sort((a, b) => lum(a) - lum(b));
        return { fond: s[0], couleurs: s.length > 1 ? s.slice(1) : ['#ffffff'], trait: s[Math.min(s.length - 1, 1)] };
      },
      pointer: {
        down: (q) => pointerDown(q.x, q.y),
        drag: (q) => { if (grab && grab.n) { const u = toWorld(q.x, q.y); grab.n.x = u[0]; grab.n.y = u[1]; grab.n.vx = grab.n.vy = 0; } },
        up: () => { if (grab && grab.n) grab.n.pin = false; grab = null; },
        wheel: (q, dy) => app.set('longueur', Math.max(0.4, Math.min(2.5, p.longueur * (dy > 0 ? 1 / 1.06 : 1.06)))),
      },
      onChange(k) { if (['*', 'structure', 'noeuds', 'boucles', 'grappes'].includes(k)) gKey = ''; if (['*', 'logo', 'image'].includes(k)) logoKey = ''; },
      onSeed() { gKey = ''; },
      export: { name: 'graphe-ressorts', svg: () => toSVG() },
    });
    const p = app.params;

    function hex(x) { const n = parseInt(x.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
    function lum(x) { const c = hex(x); return (c[0] * 0.299 + c[1] * 0.587 + c[2] * 0.114) / 255; }
    function mix(a, b, t) { const A = hex(a), B = hex(b); return '#' + A.map((v, i) => Math.round(v + (B[i] - v) * t).toString(16).padStart(2, '0')).join(''); }
    function mulberry(a) { return () => { a |= 0; a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }

    // ——— Construction du réseau : ordre de naissance, parent, liens, familles ———
    function buildGraph() {
      const key = [p.structure, p.noeuds, p.boucles, p.grappes, cycle].join(); if (key === gKey && G) return; gKey = key;
      const R = mulberry(Math.floor(app.rng()() * 1e9) + cycle * 7919), N = p.noeuds | 0, E = [], par = new Int32Array(N).fill(-1), fam = new Float32Array(N), adj = Array.from({ length: N }, () => []);
      const link = (a, b) => { if (a === b || adj[a].includes(b)) return; adj[a].push(b); adj[b].push(a); E.push([Math.min(a, b), Math.max(a, b)]); };
      let cat = true;
      if (p.structure === 'arbre') {
        // attachement préférentiel : un nouveau nœud choisit son parent au prorata de ses liens
        const bag = [0];
        let fc = 0; // chaque branche issue de la racine forme une famille
        for (let i = 1; i < N; i++) { const j = bag[Math.floor(R() * bag.length)]; par[i] = j; link(i, j); bag.push(i, j); fam[i] = j === 0 ? fc++ % 6 : fam[j]; }
        fam[0] = 0;
        const extra = Math.round(N * p.boucles * 0.5);
        for (let e = 0; e < extra; e++) { const a = 1 + Math.floor(R() * (N - 1)), b = adj[a][Math.floor(R() * adj[a].length)], c = adj[b][Math.floor(R() * adj[b].length)]; link(a, c); }
      } else if (p.structure === 'grappes') {
        const K = p.grappes | 0, members = Array.from({ length: K }, () => []);
        for (let i = 0; i < N; i++) {
          const c = i < K ? i : Math.floor(R() * K); fam[i] = c;
          if (i === 0) { members[c].push(i); continue; }
          if (!members[c].length) { const j = Math.floor(R() * i); par[i] = j; link(i, j); }
          else { const M = members[c], j = M[Math.floor(Math.pow(R(), 0.7) * M.length)]; par[i] = j; link(i, j); if (M.length > 2 && R() < 0.5 + p.boucles) link(i, M[Math.floor(R() * M.length)]); }
          members[c].push(i);
        }
        const bridges = Math.round(K * (1 + p.boucles * 4));
        for (let e = 0; e < bridges; e++) { const a = Math.floor(R() * N), b = Math.floor(R() * N); if (fam[a] !== fam[b]) link(a, b); }
      } else if (p.structure === 'monde') {
        // anneau où chaque nœud tient ses deux voisins de chaque côté, quelques liens recâblés au hasard
        for (let i = 1; i < N; i++) { par[i] = i - 1; link(i, i - 1); if (i > 1) link(i, i - 2); fam[i] = i / N; }
        link(N - 1, 0); link(N - 2, 0); link(N - 1, 1);
        const rew = Math.round(N * (0.02 + p.boucles * 0.12));
        for (let e = 0; e < rew; e++) link(Math.floor(R() * N), Math.floor(R() * N));
        cat = false;
      } else {
        // maillage triangulé, né depuis le centre
        const S = Math.max(3, Math.round(Math.sqrt(N))), idx = new Int32Array(S * S).fill(-1), order = [];
        const cells = []; for (let j = 0; j < S; j++) for (let i = 0; i < S; i++) cells.push([i, j, Math.hypot(i - (S - 1) / 2, (j - (S - 1) / 2) * 1.0) + R() * 0.3]);
        cells.sort((a, b) => a[2] - b[2]); cells.forEach((c, k) => { if (k < N) { idx[c[1] * S + c[0]] = k; order.push(c); } });
        for (let k = 0; k < order.length; k++) {
          const [i, j] = order[k]; fam[k] = order[k][2] / (S * 0.72);
          for (const [di, dj] of [[1, 0], [0, 1], [1, 1], [-1, 0], [0, -1], [-1, -1]]) { const ii = i + di, jj = j + dj; if (ii < 0 || jj < 0 || ii >= S || jj >= S) continue; const q = idx[jj * S + ii]; if (q < 0) continue; if (q < k && par[k] < 0) par[k] = q; if (R() > p.boucles * 0.5 || q < k) link(k, q); }
        }
        cat = false;
      }
      // profondeur (distance au premier nœud) et degré
      const depth = new Int32Array(N).fill(-1), Q = [0]; depth[0] = 0;
      for (let h = 0; h < Q.length; h++) for (const b of adj[Q[h]]) if (depth[b] < 0) { depth[b] = depth[Q[h]] + 1; Q.push(b); }
      let md = 1; for (let i = 0; i < N; i++) { if (depth[i] < 0) depth[i] = 0; md = Math.max(md, depth[i]); }
      let mg = 1; for (let i = 0; i < N; i++) mg = Math.max(mg, adj[i].length);
      const nodes = [];
      for (let i = 0; i < N; i++) nodes.push({ x: 0, y: 0, vx: 0, vy: 0, age: -1, ph: R() * TAU, ph2: R() * TAU, pin: false, deg: adj[i].length });
      G = { N, E, par, fam, adj, depth, md, mg, nodes, cat, R };
      born = 0; logoKey = ''; logoPts = null; buildLogo();
      if (app.thumbnail || !p.croissance) { for (let i = 0; i < N; i++) spawn(i); for (let s = 0; s < 260; s++) step(1 / 60, 3); }
    }
    function spawn(i) {
      const n = G.nodes[i], j = G.par[i], L = p.longueur;
      if (j >= 0 && G.nodes[j].age >= 0) { const a = G.R() * TAU; n.x = G.nodes[j].x + Math.cos(a) * L * 0.5; n.y = G.nodes[j].y + Math.sin(a) * L * 0.5; }
      else { const a = G.R() * TAU; n.x = Math.cos(a) * L * 0.3; n.y = Math.sin(a) * L * 0.3; }
      n.vx = n.vy = 0; n.age = 0; born = Math.max(born, i + 1); assign(i);
    }

    // ——— Le logo : autant de cibles que de nœuds, triées du centre vers le bord ———
    function buildLogo() {
      const img0 = p.image || app.logoImg, key = [p.logo, G.N, img0 ? (img0.src || 'c') : 'demo'].join(); if (key === logoKey) return; logoKey = key;
      logoPts = null; if (!p.logo) return;
      const M = 140, c = document.createElement('canvas'); c.width = c.height = M; const x = c.getContext('2d', { willReadFrequently: true }), L = M * 0.9, cx = M / 2;
      if (img0) { const iw = img0.naturalWidth || img0.width, ih = img0.naturalHeight || img0.height, s = L / Math.max(iw, ih); x.drawImage(img0, cx - iw * s / 2, cx - ih * s / 2, iw * s, ih * s); }
      else { x.fillStyle = '#000'; x.beginPath(); x.arc(cx, cx, L * 0.48, 0, TAU); x.arc(cx, cx, L * 0.27, 0, TAU, true); x.fill('evenodd'); x.fillRect(cx - L * 0.07, cx - L * 0.5, L * 0.14, L); }
      const d = x.getImageData(0, 0, M, M).data; let transp = 0; for (let i = 3; i < d.length; i += 4) if (d[i] < 128) transp++; const useA = transp > M * M * 0.05;
      const inside = []; for (let j = 0; j < M; j++) for (let i = 0; i < M; i++) { const o = (j * M + i) * 4, l = (d[o] * 0.2126 + d[o + 1] * 0.7152 + d[o + 2] * 0.0722) / 255; if (useA ? d[o + 3] > 128 : d[o + 3] > 128 && l < 0.5) inside.push([i / M - 0.5, j / M - 0.5]); }
      if (!inside.length) return;
      // tirage régulier : un point sur k, mélangé d'un peu de hasard ; l'échelle donne à chaque nœud la place d'un lien
      const R = mulberry(4242), pts = [], E = 1.15 * Math.sqrt(G.N / (inside.length / (M * M)));
      for (let i = 0; i < G.N + 40; i++) { const q = inside[Math.floor((i + R()) / (G.N + 40) * inside.length) % inside.length]; pts.push([(q[0] + (R() - 0.5) / M) * E, (q[1] + (R() - 0.5) / M) * E]); }
      let mx = 0, my = 0; for (const q of pts) { mx += q[0]; my += q[1]; } mx /= pts.length; my /= pts.length;
      logoPts = { pts, free: new Uint8Array(pts.length).fill(1), T: [], mx, my };
      for (let i = 0; i < born; i++) assign(i);
    }
    // chaque nœud prend la place libre la plus proche de celle de son parent : le réseau se répand dans le logo
    function assign(i) {
      if (!logoPts) return; const L = logoPts, j = G.par[i], from = j >= 0 && L.T[j] ? L.T[j] : [L.mx, L.my];
      let best = -1, bd = Infinity, any = -1, ad = Infinity;
      for (let k = 0; k < L.pts.length; k++) { const d = (L.pts[k][0] - from[0]) ** 2 + (L.pts[k][1] - from[1]) ** 2; if (L.free[k] && d < bd) { bd = d; best = k; } if (d < ad) { ad = d; any = k; } }
      if (best < 0) best = any; L.free[best] = 0; L.T[i] = L.pts[best];
    }

    // ——— Physique ———
    const cellMap = new Map();
    function step(dt, it = 1) {
      const N = born, L = p.longueur, Lr = L * 2.6, Kr = 0.55 * p.repulsion * L * L, Ks = 3.2, nodes = G.nodes, S = Math.sqrt(G.N) * L * 0.62;
      for (let k = 0; k < it; k++) {
        cellMap.clear();
        for (let i = 0; i < N; i++) { const n = nodes[i]; n.fx = -n.x * 0.06; n.fy = -n.y * 0.06; const key = Math.floor(n.x / Lr) * 73856093 ^ Math.floor(n.y / Lr) * 19349663; let c = cellMap.get(key); if (!c) cellMap.set(key, (c = [])); c.push(i); }
        for (let i = 0; i < N; i++) {
          const a = nodes[i], cx = Math.floor(a.x / Lr), cy = Math.floor(a.y / Lr);
          for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
            const c = cellMap.get((cx + dx) * 73856093 ^ (cy + dy) * 19349663); if (!c) continue;
            for (const j of c) { if (j <= i) continue; const b = nodes[j]; let ex = a.x - b.x, ey = a.y - b.y, d2 = ex * ex + ey * ey; if (d2 > Lr * Lr) continue; if (d2 < 1e-6) { ex = (Math.random() - 0.5) * 0.01; ey = (Math.random() - 0.5) * 0.01; d2 = 1e-4; } const f = Kr / d2 * (1 - d2 / (Lr * Lr)); a.fx += ex * f; a.fy += ey * f; b.fx -= ex * f; b.fy -= ey * f; }
          }
        }
        for (const [i, j] of G.E) { if (i >= N || j >= N) continue; const a = nodes[i], b = nodes[j], ex = b.x - a.x, ey = b.y - a.y, d = Math.hypot(ex, ey) || 1e-3, f = Ks * (d - L) / d; a.fx += ex * f; a.fy += ey * f; b.fx -= ex * f; b.fy -= ey * f; }
        if (logoPts && p.logo) { const K = p.fidelite * 4, Lp = L; for (let i = 0; i < N; i++) { const n = nodes[i], q = logoPts.T[i]; if (!q) continue; n.fx += (q[0] * Lp - n.x) * K; n.fy += (q[1] * Lp - n.y) * K; } }
        const ag = p.agitation * L * 1.2;
        for (let i = 0; i < N; i++) {
          const n = nodes[i]; if (n.pin) continue;
          n.fx += Math.cos(simT * 0.9 + n.ph) * ag + Math.sin(simT * 0.53 + n.ph2) * ag * 0.6; n.fy += Math.sin(simT * 0.77 + n.ph) * ag + Math.cos(simT * 0.41 + n.ph2) * ag * 0.6;
          n.vx = (n.vx + n.fx * dt) * 0.86; n.vy = (n.vy + n.fy * dt) * 0.86;
          const v = Math.hypot(n.vx, n.vy), vm = L * 6; if (v > vm) { n.vx *= vm / v; n.vy *= vm / v; }
          n.x += n.vx * dt * 4; n.y += n.vy * dt * 4;
        }
      }
    }

    // ——— Caméra : cadre lissé sur l'étendue des nœuds, rotation lente ———
    function frameCam(w, h, snap) {
      const nodes = G.nodes; let x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity, mx = 0, my = 0;
      for (let i = 0; i < born; i++) { const n = nodes[i]; mx += n.x; my += n.y; }
      mx /= Math.max(1, born); my /= Math.max(1, born);
      const ds = []; for (let i = 0; i < born; i++) { const n = nodes[i]; ds.push(Math.hypot(n.x - mx, n.y - my)); }
      ds.sort((a, b) => a - b); const r = Math.max(ds.length ? ds[Math.floor((ds.length - 1) * 0.97)] : 0, p.longueur * 4);
      const s = Math.min(w, h) * 0.45 / r;
      if (!cam || snap) cam = { x: mx, y: my, s }; else { const k = 0.06; cam.x += (mx - cam.x) * k; cam.y += (my - cam.y) * k; cam.s += (s - cam.s) * (s < cam.s ? 0.12 : 0.03); }
    }
    function toScreen(x, y, w, h) { const c = Math.cos(rot), s = Math.sin(rot), dx = x - cam.x, dy = y - cam.y; return [w / 2 + (dx * c - dy * s) * cam.s, h / 2 + (dx * s + dy * c) * cam.s]; }
    function toWorld(X, Y) { const { w, h } = app.size, c = Math.cos(-rot), s = Math.sin(-rot), dx = (X - w / 2) / cam.s, dy = (Y - h / 2) / cam.s; return [cam.x + dx * c - dy * s, cam.y + dx * s + dy * c]; }
    function pointerDown(X, Y) {
      if (!G || !cam) return; const { w, h } = app.size; let best = -1, bd = 30 * 30;
      for (let i = 0; i < born; i++) { const q = toScreen(G.nodes[i].x, G.nodes[i].y, w, h), d = (q[0] - X) ** 2 + (q[1] - Y) ** 2; if (d < bd) { bd = d; best = i; } }
      if (best >= 0) { grab = { n: G.nodes[best] }; grab.n.pin = true; return; }
      // greffe : un nœud neuf, relié aux deux nœuds les plus proches
      const u = toWorld(X, Y), near = [...Array(born).keys()].map((i) => [i, Math.hypot(G.nodes[i].x - u[0], G.nodes[i].y - u[1])]).sort((a, b) => a[1] - b[1]).slice(0, 2);
      if (!near.length || G.N >= 900) return;
      for (let k = born; k < G.N; k++) spawn(k);
      const i = G.N; G.N++; G.nodes.push({ x: u[0], y: u[1], vx: 0, vy: 0, age: 0, ph: Math.random() * TAU, ph2: Math.random() * TAU, pin: false, deg: near.length });
      G.adj.push([]); G.par = Int32Array.from([...G.par, near[0][0]]); G.fam = Float32Array.from([...G.fam, G.fam[near[0][0]]]); G.depth = Int32Array.from([...G.depth, G.depth[near[0][0]] + 1]);
      for (const [j] of near) { G.adj[i].push(j); G.adj[j].push(i); G.E.push([j, i]); G.nodes[j].deg++; }
      born = Math.max(born, i + 1); assign(i);
    }

    // ——— Couleurs ———
    function nodeT(i) {
      if (p.selon === 'profondeur') return G.depth[i] / G.md;
      if (p.selon === 'degre') return Math.min(1, Math.log(1 + G.nodes[i].deg - 1) / Math.log(1 + Math.max(2, G.mg - 1)));
      return G.cat ? -1 - G.fam[i] : G.fam[i];
    }
    function colorAt(i) {
      const C = p.couleurs.length ? p.couleurs : ['#ffffff'], t = nodeT(i);
      if (t < 0) return C[(Math.round(-1 - t)) % C.length];
      if (C.length === 1) return C[0];
      const u = Math.max(0, Math.min(1, t)) * (C.length - 1), k = Math.min(C.length - 2, Math.floor(u)); return mix(C[k], C[k + 1], u - k);
    }

    function advance(dt) {
      buildGraph(); buildLogo();
      if (!app.thumbnail && p.croissance) {
        const total = p.duree, hold = Math.max(4, total * 0.5), cyc = total + hold;
        // un réseau neuf (au chargement, après un réglage) part d'un réseau déjà à moitié poussé, mis en place d'un coup
        let warm = false; if (G.t0 === undefined) { warm = !G.fromCycle; G.t0 = simT - (warm ? total * 0.6 : 0); }
        const want = Math.min(G.N, Math.ceil(Math.pow(Math.min(1, (simT - G.t0) / total), 1.25) * G.N));
        while (born < want) { spawn(born); if (warm && born % 6 === 0) step(1 / 60, 1); }
        if (warm) { for (let i = 0; i < born; i++) G.nodes[i].age = 1; for (let k = 0; k < 120; k++) step(1 / 60, 1); }
        if (simT - G.t0 > cyc && !grab) { cycle++; gKey = ''; buildGraph(); G.fromCycle = true; G.t0 = simT; cam = null; buildLogo(); }
      } else if (born < G.N) { for (let i = born; i < G.N; i++) spawn(i); }
      for (let i = 0; i < born; i++) G.nodes[i].age += dt;
      step(Math.min(1 / 30, dt), 2);
    }

    app.loop((t, dt) => {
      dt = Math.min(0.1, dt || 0);
      simT += dt; rot += dt * p.rotation * Math.PI / 180;
      const { w, h, dpr } = app.size;
      advance(dt);
      frameCam(w, h, false);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.fillStyle = p.fond; ctx.fillRect(0, 0, w, h);
      draw(ctx, w, h);
      app.finish(ctx);
    });

    function edgePath(a, b, i, j) {
      if (p.forme !== 'courbes') return null;
      const mx = (a[0] + b[0]) / 2, my = (a[1] + b[1]) / 2, k = 0.22 * (((i * 31 + j * 17) % 2) ? 1 : -1);
      return [mx - (b[1] - a[1]) * k, my + (b[0] - a[0]) * k];
    }
    function draw(c, w, h) {
      const S = new Array(born); for (let i = 0; i < born; i++) S[i] = toScreen(G.nodes[i].x, G.nodes[i].y, w, h);
      const grow = (i) => Math.min(1, G.nodes[i].age * 2.5);
      c.lineWidth = p.epaisseur; c.lineCap = 'round';
      const groups = new Map();
      for (const [i, j] of G.E) {
        if (i >= born || j >= born) continue;
        // les liens tendus bien au-delà de leur longueur s'effacent : on lit la forme, pas l'écheveau
        const col = p.liens === 'unie' ? p.trait : colorAt(i), al = Math.min(grow(i), grow(j)), d = Math.hypot(G.nodes[i].x - G.nodes[j].x, G.nodes[i].y - G.nodes[j].y) / p.longueur, fade = d > 2.2 ? (d > 5 ? 2 : 1) : 0;
        const gk = col + '|' + fade; let L = groups.get(gk); if (!L) groups.set(gk, (L = [])); L.push(i, j, al);
      }
      for (const [gk, L] of groups) {
        const [col, fade] = gk.split('|'); c.strokeStyle = col; c.globalAlpha = p.opacite * [1, 0.45, 0.18][+fade];
        const P2 = new Path2D();
        for (let k = 0; k < L.length; k += 3) {
          const i = L[k], j = L[k + 1], a = S[i], b0 = S[j], al = L[k + 2], b = al < 1 ? [a[0] + (b0[0] - a[0]) * al, a[1] + (b0[1] - a[1]) * al] : b0;
          P2.moveTo(a[0], a[1]); const q = edgePath(a, b, i, j); if (q) P2.quadraticCurveTo(q[0], q[1], b[0], b[1]); else P2.lineTo(b[0], b[1]);
        }
        c.stroke(P2);
      }
      c.globalAlpha = 1;
      if (p.points > 0) {
        const byCol = new Map();
        for (let i = 0; i < born; i++) { const col = colorAt(i); let L = byCol.get(col); if (!L) byCol.set(col, (L = [])); L.push(i); }
        for (const [col, L] of byCol) {
          c.fillStyle = col; const P3 = new Path2D();
          for (const i of L) { const r = p.points * (0.6 + 0.4 * Math.sqrt(G.nodes[i].deg)) * 0.6 * grow(i); if (r < 0.2) continue; P3.moveTo(S[i][0] + r, S[i][1]); P3.arc(S[i][0], S[i][1], r, 0, TAU); }
          c.fill(P3);
        }
      }
    }

    function toSVG() {
      const { w, h } = app.size, f = (v) => +v.toFixed(2);
      let s = `<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><rect width="100%" height="100%" fill="${p.fond}"/>`;
      const S = []; for (let i = 0; i < born; i++) S[i] = toScreen(G.nodes[i].x, G.nodes[i].y, w, h);
      const groups = new Map();
      for (const [i, j] of G.E) {
        if (i >= born || j >= born) continue; const a = S[i], b = S[j], col0 = p.liens === 'unie' ? p.trait : colorAt(i), q = edgePath(a, b, i, j), d = Math.hypot(G.nodes[i].x - G.nodes[j].x, G.nodes[i].y - G.nodes[j].y) / p.longueur, col = col0 + '|' + (d > 2.2 ? (d > 5 ? 2 : 1) : 0);
        groups.set(col, (groups.get(col) || '') + `M${f(a[0])} ${f(a[1])}` + (q ? `Q${f(q[0])} ${f(q[1])} ${f(b[0])} ${f(b[1])}` : `L${f(b[0])} ${f(b[1])}`));
      }
      s += `<g fill="none" stroke-width="${f(p.epaisseur)}" stroke-linecap="round" stroke-opacity="${f(p.opacite)}">`;
      for (const [gk, d] of groups) { const [col, fade] = gk.split('|'); s += `<path d="${d}" stroke="${col}"${+fade ? ` stroke-opacity="${f(p.opacite * [1, 0.45, 0.18][+fade])}"` : ''}/>`; }
      s += '</g>';
      if (p.points > 0) for (let i = 0; i < born; i++) { const r = p.points * (0.6 + 0.4 * Math.sqrt(G.nodes[i].deg)) * 0.6 * Math.min(1, G.nodes[i].age * 2.5); if (r >= 0.2) s += `<circle cx="${f(S[i][0])}" cy="${f(S[i][1])}" r="${f(r)}" fill="${colorAt(i)}"/>`; }
      return s + '</svg>';
    }
  </script>
</body>
</html>
