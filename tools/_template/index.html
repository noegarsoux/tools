<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{TITLE}}</title>
  <link rel="stylesheet" href="../../assets/ui/atelier.css">
</head>
<body>
  <canvas></canvas>
  <script src="../../assets/ui/atelier.js"></script>
  <script>
    const canvas = document.querySelector('canvas');
    const ctx = canvas.getContext('2d');

    // Toute l'interface (barre du haut, panneau, presets, graine, exports) est générée par le kit.
    const app = Atelier.app({
      stage: canvas,
      animate: true,
      params: {
        'Forme': {
          count: { type: 'range', label: 'Nombre', min: 1, max: 60, step: 1, value: 24 },
          radius: { type: 'range', label: 'Rayon', min: 0.1, max: 0.5, step: 0.01, value: 0.32 },
        },
        'Couleur': {
          bg: { type: 'color', label: 'Fond', value: '#111114' },
          fg: { type: 'color', label: 'Forme', value: '#0d99ff' },
        },
      },
      presets: {
        'Défaut': { count: 24, radius: 0.32, bg: '#111114', fg: '#0d99ff' },
      },
      export: { png: true, video: true },
    });
    const p = app.params;

    app.loop((t) => {
      const { w, h, dpr } = app.size;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.fillStyle = p.bg;
      ctx.fillRect(0, 0, w, h);
      ctx.fillStyle = p.fg;
      const R = Math.min(w, h) * p.radius;
      for (let i = 0; i < p.count; i++) {
        const a = (i / p.count) * Math.PI * 2 + t * 0.5;
        ctx.beginPath();
        ctx.arc(w / 2 + Math.cos(a) * R, h / 2 + Math.sin(a) * R, 6, 0, Math.PI * 2);
        ctx.fill();
      }
    });
  </script>
</body>
</html>
