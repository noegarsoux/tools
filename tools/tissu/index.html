<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tissu</title>
  <link rel="stylesheet" href="../../assets/ui/atelier.css">
</head>
<body>
  <canvas></canvas>
  <script src="../../assets/ui/atelier.js"></script>
  <script>
    // Tissu : une étoffe aux motifs de la marque, simulée en intégration de Verlet. Une grille de points
    // reliés par des ressorts rigides (contraintes de distance), pesante, poussée par un vent qui frappe
    // chaque facette selon son orientation, d'où le claquement d'un drapeau. On l'attrape, on la tire ;
    // trop tirée, elle se déchire. L'ombrage vient de la normale de chaque facette.
    const canvas = document.querySelector('canvas');
    const ctx = canvas.getContext('2d');
    const TAU = Math.PI * 2;
    const PAL = (k) => Atelier.PALETTES[k].colors;
    const BIEN = PAL('biennale'), KB = PAL('kegelbahn'), SAL = PAL('salon'), LU = PAL('luzern'), GR = PAL('good-room');
    const P60 = PAL('papier-60'), ORB = PAL('orbite'), MENTHE = PAL('menthe'), PYR = PAL('pyramides'), ACIDE = PAL('acide');

    let C = 0, R = 0, P = null, O = null, pin = null, links = [], quadOk = null, grab = null, ptr = null, cutPrev = null, mask = null;
    let lastT = 0, tAcc = 0, seedOff = [0, 0, 0];

    const app = Atelier.app({
      stage: canvas,
      animate: true,
      seed: true,
      finish: { grain: 0.04, vignette: 0 },
      hint: 'Glissez pour attraper le tissu (ou le découper, selon l’outil) · survol : un souffle · molette : force du vent',
      notes: 'Chaque point garde sa position précédente : la vitesse est implicite (Verlet). Les liens sont rétablis plusieurs fois par image ; un lien étiré au-delà du seuil se rompt. Le vent pousse chaque facette selon l’angle qu’elle lui présente.',
      params: {
        'Étoffe': {
          accroche: { type: 'segmented', label: 'Accroche', options: { mat: 'Mât', haut: 'Tringle', coins: 'Deux coins' }, value: 'mat' },
          taille: { type: 'range', label: 'Taille', min: 0.3, max: 0.9, step: 0.01, value: 0.52 },
          finesse: { type: 'range', label: 'Finesse du maillage', min: 16, max: 64, step: 1, value: 40 },
          rigidite: { type: 'range', label: 'Rigidité', min: 1, max: 12, step: 1, value: 5 },
          dechirure: { type: 'range', label: 'Résistance à la déchirure', min: 1.3, max: 5, step: 0.05, value: 2.6 },
          outil: { type: 'segmented', label: 'Au glisser', options: { attraper: 'Attraper', couper: 'Découper' }, value: 'attraper' },
          recoudre: { type: 'button', label: 'Recoudre', action: () => build() },
        },
        'Vent': {
          vent: { type: 'range', label: 'Force du vent', min: 0, max: 3, step: 0.01, value: 1.6 },
          rafales: { type: 'range', label: 'Rafales', min: 0, max: 1, step: 0.01, value: 0.5 },
          direction: { type: 'range', label: 'Direction (°)', min: -180, max: 180, step: 1, value: 0 },
          gravite: { type: 'range', label: 'Gravité', min: 0, max: 2, step: 0.01, value: 1 },
        },
        'Motif': {
          motif: { type: 'segmented', label: 'Motif', options: { bandes: 'Bandes', rayures: 'Rayures', damier: 'Damier', logo: 'Logo', uni: 'Uni' }, value: 'bandes' },
          nombre: { type: 'range', label: 'Nombre de bandes', min: 2, max: 24, step: 1, value: 3 },
          relief: { type: 'range', label: 'Ombrage', min: 0, max: 1, step: 0.01, value: 0.65 },
        },
        'Couleur': {
          fond: { type: 'color', label: 'Fond', value: '#e9e7e2' },
          couleurs: { type: 'palette', label: 'Couleurs du tissu', value: [BIEN[2], BIEN[0], BIEN[1]] },
        },
      },
      presets: {
        'Drapeau': {},
        'Rayures': { motif: 'rayures', nombre: 12, couleurs: [KB[1], KB[3], KB[2]], fond: KB[0], vent: 1.5 },
        'Rideau': { accroche: 'haut', motif: 'rayures', nombre: 9, couleurs: [SAL[2], SAL[0]], fond: '#d9d5cd', vent: 0.6, rafales: 0.7, direction: 90, taille: 0.7 },
        'Hamac': { accroche: 'coins', motif: 'damier', nombre: 8, couleurs: [GR[1], GR[0]], fond: '#202020', vent: 0.5, direction: 90, taille: 0.6 },
        'Logo': { motif: 'logo', finesse: 64, couleurs: [P60[1], '#e5452a'], fond: P60[0], vent: 1.8 },
        'Luzern': { motif: 'bandes', nombre: 4, couleurs: [LU[0], LU[1], LU[2], LU[4]], fond: LU[3], vent: 1.8, rafales: 0.8 },
        'Tempête': { vent: 3, rafales: 1, dechirure: 1.6, motif: 'damier', nombre: 10, couleurs: [ORB[1], ORB[2]], fond: ORB[0] },
        'Menthe': { accroche: 'haut', motif: 'uni', couleurs: [MENTHE[3]], fond: MENTHE[0], vent: 0.9, direction: 70, relief: 0.9 },
        'Pyramides': { motif: 'rayures', nombre: 6, couleurs: [PYR[2], PYR[4], PYR[5], PYR[3]], fond: PYR[0], vent: 1.4 },
        'Acide': { accroche: 'coins', motif: 'bandes', nombre: 2, couleurs: [ACIDE[2], ACIDE[1]], fond: ACIDE[0], vent: 0.8, direction: 120, taille: 0.75 },
      },
      brand(colors) {
        const rest = colors.slice(1);
        return { fond: colors[0], couleurs: (rest.length ? rest : ['#000000']).slice(0, 6) };
      },
      pointer: {
        move: (q) => { ptr = { x: q.x, y: q.y }; },
        down: (q) => {
          ptr = { x: q.x, y: q.y };
          if (p.outil === 'couper') { cutPrev = { x: q.x, y: q.y }; return; }
          // Attrape le point le plus proche à l'écran.
          let best = -1, bd = Infinity;
          for (let i = 0; i < C * R; i++) { const s = proj(i), d = (s.x - q.x) ** 2 + (s.y - q.y) ** 2; if (d < bd) { bd = d; best = i; } }
          if (best >= 0 && bd < (Math.min(app.size.w, app.size.h) * 0.12) ** 2) grab = { i: best, x: q.x, y: q.y, z: P[best * 3 + 2] };
        },
        drag: (q) => {
          ptr = { x: q.x, y: q.y };
          if (grab) { grab.x = q.x; grab.y = q.y; }
          if (cutPrev) { cut(cutPrev, q); cutPrev = { x: q.x, y: q.y }; }
        },
        up: () => { grab = null; cutPrev = null; },
        wheel: (q, dy) => app.set('vent', Math.max(0, Math.min(3, +(p.vent - dy * 0.002).toFixed(2)))),
      },
      onChange(k) {
        if (k === '*' || k === 'accroche' || k === 'finesse' || k === 'taille') build();
        if (k === '*' || k === '_logo' || k === 'motif') mask = null;
      },
      onSeed() { reseed(); build(); },
      onResize() { build(); },
      export: { name: 'tissu', svg: () => toSVG() },
    });
    const p = app.params;
    canvas.addEventListener('pointerleave', () => { ptr = null; });

    function reseed() { const r = app.rng(3); seedOff = [r() * 100, r() * 100, r() * 100]; }
    reseed();

    // ——— Construction : grille C×R, liens de structure (voisins) et de flexion (à deux pas) ———
    let rest = 1, origin = null;
    function build() {
      const { w, h } = app.size, U = Math.min(w, h);
      C = Math.round(p.finesse); R = Math.max(6, Math.round(C * 0.64));
      const W = U * p.taille * 1.35, Hc = W * (R - 1) / (C - 1);
      rest = W / (C - 1);
      P = new Float32Array(C * R * 3); O = new Float32Array(C * R * 3); pin = new Float32Array(C * R * 3); const pinned = new Uint8Array(C * R);
      let x0, y0;
      if (p.accroche === 'mat') { x0 = w / 2 - W * 0.5; y0 = h / 2 - Hc * 0.72; }
      else { x0 = w / 2 - W / 2; y0 = h / 2 - Hc * 0.55; }
      origin = { x0, y0, W, Hc };
      for (let j = 0; j < R; j++) for (let i = 0; i < C; i++) {
        const k = j * C + i;
        // Position initiale : déjà tombée le long de la gravité pour le rideau et le hamac.
        P[k * 3] = x0 + i * rest; P[k * 3 + 1] = y0 + j * rest; P[k * 3 + 2] = 0;
        if (p.accroche === 'mat' && i === 0) pinned[k] = 1;
        if (p.accroche === 'haut' && j === 0 && (i % 4 === 0 || i === C - 1)) pinned[k] = 1;
        if (p.accroche === 'coins' && j === 0 && (i === 0 || i === C - 1)) pinned[k] = 1;
      }
      if (p.accroche === 'coins') {
        // Le hamac pend déjà en chaînette entre ses deux coins.
        for (let j = 0; j < R; j++) for (let i = 0; i < C; i++) {
          const k = j * C + i, u = i / (C - 1) - 0.5;
          P[k * 3 + 1] += (0.25 - u * u) * W * 0.5;
        }
      }
      O.set(P);
      for (let k = 0; k < C * R; k++) pin[k * 3] = pinned[k] ? 1 : 0;
      links = [];
      const add = (a, b, bend) => links.push({ a, b, L: Math.hypot(P[a * 3] - P[b * 3], P[a * 3 + 1] - P[b * 3 + 1], P[a * 3 + 2] - P[b * 3 + 2]), on: true, bend });
      for (let j = 0; j < R; j++) for (let i = 0; i < C; i++) {
        const k = j * C + i;
        if (i < C - 1) add(k, k + 1, false);
        if (j < R - 1) add(k, k + C, false);
        if (i < C - 2) add(k, k + 2, true);
        if (j < R - 2) add(k, k + 2 * C, true);
      }
      // Pour chaque facette, les liens de ses quatre bords : rompue si l'un d'eux l'est.
      quadOk = new Uint8Array((C - 1) * (R - 1)).fill(1);
      edgeIndex = new Map();
      links.forEach((l, n) => { if (!l.bend) edgeIndex.set(l.a * 100000 + l.b, n); });
      // Quelques pas de mise en place.
      for (let s = 0; s < 40; s++) simulate(1 / 60, s * 0.02, true);
    }
    let edgeIndex = new Map();
    const edge = (a, b) => links[edgeIndex.get(Math.min(a, b) * 100000 + Math.max(a, b))];

    // Projection perspective légère (z vers le fond).
    function proj(k) {
      const { w, h } = app.size, f = Math.max(w, h) * 2.2, z = P[k * 3 + 2], s = f / (f + z);
      return { x: w / 2 + (P[k * 3] - w / 2) * s, y: h / 2 + (P[k * 3 + 1] - h / 2) * s, s };
    }

    // Bruit lisse pour les rafales.
    function noise(x, y, t) {
      return Math.sin(x * 1.7 + t * 1.3 + seedOff[0]) * Math.cos(y * 1.3 - t * 0.9 + seedOff[1]) * 0.6
        + Math.sin(x * 3.1 - y * 2.3 + t * 2.1 + seedOff[2]) * 0.4;
    }

    function simulate(dt, t, quiet) {
      const { w, h } = app.size, U = Math.min(w, h), N = C * R;
      const g = 900 * p.gravite * (U / 800), dd = 0.99;
      const ang = p.direction * Math.PI / 180, base = p.vent * 760 * (U / 800);
      const gust = 1 + p.rafales * 0.9 * Math.sin(t * 1.1 + seedOff[0]) * Math.sin(t * 0.37 + seedOff[1]);
      const wx = Math.cos(ang) * base * gust, wy = Math.sin(ang) * base * gust;
      const F = new Float32Array(N * 3);
      // Vent : chaque facette reçoit une poussée le long de sa normale, proportionnelle à l'angle d'attaque.
      for (let j = 0; j < R - 1; j++) for (let i = 0; i < C - 1; i++) {
        if (!quadOk[j * (C - 1) + i]) continue;
        const a = j * C + i, b = a + 1, c = a + C, d = c + 1;
        const ux = P[d * 3] - P[a * 3], uy = P[d * 3 + 1] - P[a * 3 + 1], uz = P[d * 3 + 2] - P[a * 3 + 2];
        const vx = P[c * 3] - P[b * 3], vy = P[c * 3 + 1] - P[b * 3 + 1], vz = P[c * 3 + 2] - P[b * 3 + 2];
        let nx = uy * vz - uz * vy, ny = uz * vx - ux * vz, nz = ux * vy - uy * vx;
        const nl = Math.hypot(nx, ny, nz) || 1; nx /= nl; ny /= nl; nz /= nl;
        const tb = p.rafales * noise(i / C * 3, j / R * 3, t * 1.5);
        // Une onde qui court le long du tissu, du bord tenu vers le bord libre : le claquement.
        const wz = base * (0.55 * tb + 0.45 * p.rafales * Math.sin(i / C * 9 - t * 7.5 + seedOff[2]) * (0.3 + i / C));
        const dot = nx * wx + ny * wy + nz * wz;
        const fx = nx * dot * 0.25, fy = ny * dot * 0.25, fz = nz * dot * 0.25;
        for (const k of [a, b, c, d]) { F[k * 3] += fx; F[k * 3 + 1] += fy; F[k * 3 + 2] += fz; }
      }
      // Souffle au survol : pousse le tissu vers le fond autour du pointeur.
      if (ptr && !grab && !quiet) for (let k = 0; k < N; k++) {
        const s = proj(k), d2 = (s.x - ptr.x) ** 2 + (s.y - ptr.y) ** 2, L = U * 0.1;
        if (d2 < L * L * 4) F[k * 3 + 2] += 1600 * (U / 800) * Math.exp(-d2 / (L * L));
      }
      const dt2 = dt * dt;
      for (let k = 0; k < N; k++) {
        if (pin[k * 3]) continue;
        for (let e = 0; e < 3; e++) {
          const i = k * 3 + e, v = (P[i] - O[i]) * dd;
          O[i] = P[i];
          // Traînée directe (le tissu suit le vent) plus la poussée sur les facettes (il claque).
          P[i] += v + ((e === 1 ? g : 0) + F[i] + (e === 0 ? wx * 0.9 : e === 1 ? wy * 0.9 : 0)) * dt2;
        }
      }
      // Contraintes, répétées.
      const it = Math.round(p.rigidite), tear = p.dechirure;
      for (let n = 0; n < it; n++) {
        for (const l of links) {
          if (!l.on) continue;
          const a = l.a * 3, b = l.b * 3;
          const dx = P[b] - P[a], dy = P[b + 1] - P[a + 1], dz = P[b + 2] - P[a + 2];
          const d = Math.hypot(dx, dy, dz) || 1e-6;
          if (!l.bend && !quiet && d > l.L * tear && tear < 4.95) { l.on = false; continue; }
          const k = l.bend ? 0.25 : 0.5;
          const s = (d - l.L) / d * k, pa = pin[a] ? 0 : 1, pb = pin[b] ? 0 : 1, tw = pa + pb;
          if (!tw) continue;
          const fa = pa / tw * 2, fb = pb / tw * 2;
          P[a] += dx * s * fa; P[a + 1] += dy * s * fa; P[a + 2] += dz * s * fa;
          P[b] -= dx * s * fb; P[b + 1] -= dy * s * fb; P[b + 2] -= dz * s * fb;
        }
        if (grab) {
          const k = grab.i * 3, { w, h } = app.size, f = Math.max(w, h) * 2.2, s = (f + P[k + 2]) / f;
          P[k] = w / 2 + (grab.x - w / 2) * s; P[k + 1] = h / 2 + (grab.y - h / 2) * s;
        }
      }
      // Une rupture coupe aussi les liens de flexion qui l'enjambent, et éteint les facettes voisines.
      for (let j = 0; j < R - 1; j++) for (let i = 0; i < C - 1; i++) {
        const q = j * (C - 1) + i;
        if (!quadOk[q]) continue;
        const a = j * C + i;
        if (!edge(a, a + 1).on || !edge(a, a + C).on || !edge(a + 1, a + 1 + C).on || !edge(a + C, a + C + 1).on) quadOk[q] = 0;
      }
      for (const l of links) if (l.bend && l.on) {
        const mid = (l.a + l.b) / 2;
        if (!edge(l.a, mid).on || !edge(mid, l.b).on) l.on = false;
      }
      // Garde-fou : un point parti trop loin revient au repos.
      for (let i = 0; i < N * 3; i++) if (!isFinite(P[i])) { P.set(O); break; }
    }

    // Découper : rompt les liens dont le milieu projeté est proche du trait du pointeur.
    function cut(a, b) {
      const r = Math.max(6, rest * 0.8);
      for (const l of links) {
        if (!l.on) continue;
        const A = proj(l.a), B = proj(l.b), mx = (A.x + B.x) / 2, my = (A.y + B.y) / 2;
        const vx = b.x - a.x, vy = b.y - a.y, L2 = vx * vx + vy * vy || 1;
        const t = Math.max(0, Math.min(1, ((mx - a.x) * vx + (my - a.y) * vy) / L2));
        if ((mx - a.x - vx * t) ** 2 + (my - a.y - vy * t) ** 2 < r * r) l.on = false;
      }
    }

    // ——— Motif : couleur de la cellule (i, j) ———
    function buildMask() {
      const G = 256, cv = document.createElement('canvas'); cv.width = cv.height = G;
      const x = cv.getContext('2d', { willReadFrequently: true }), img = app.logoImg;
      x.fillStyle = '#000';
      if (img) {
        const iw = img.naturalWidth || img.width, ih = img.naturalHeight || img.height, k = G * 0.8 / Math.max(iw, ih);
        x.drawImage(img, (G - iw * k) / 2, (G - ih * k) / 2, iw * k, ih * k);
      } else {
        x.beginPath(); x.arc(G / 2, G / 2, G * 0.4, 0, TAU); x.arc(G / 2, G / 2, G * 0.27, 0, TAU, true); x.fill();
        x.beginPath(); x.arc(G / 2, G / 2, G * 0.15, 0, TAU); x.fill();
      }
      const d = x.getImageData(0, 0, G, G).data;
      mask = { G, a: new Uint8Array(G * G).map((_, i) => d[i * 4 + 3] > 128 ? 1 : 0) };
    }
    function cellColor(i, j, cols) {
      const u = (i + 0.5) / (C - 1), v = (j + 0.5) / (R - 1), n = Math.round(p.nombre), m = cols.length;
      switch (p.motif) {
        case 'bandes': return cols[Math.min(n - 1, Math.floor(u * n)) % m];
        case 'rayures': return cols[Math.floor(v * n) % m];
        case 'damier': return cols[(Math.floor(u * n) + Math.floor(v * n * (R - 1) / (C - 1) + 1e-6)) % Math.max(2, m) % m];
        case 'logo': {
          if (!mask) buildMask();
          // Le logo au centre, carré, sur la première couleur.
          const asp = (C - 1) / (R - 1), lx = (u - 0.5) * asp + 0.5, G = mask.G;
          const gx = Math.floor(lx * G), gy = Math.floor(v * G);
          const inside = gx >= 0 && gy >= 0 && gx < G && gy < G && mask.a[gy * G + gx];
          return inside ? cols[m > 1 ? 1 : 0] : (m > 1 ? cols[0] : p.fond);
        }
        default: return cols[0];
      }
    }

    const rgbCache = new Map();
    function rgb(c) {
      let v = rgbCache.get(c);
      if (!v) { v = [parseInt(c.slice(1, 3), 16), parseInt(c.slice(3, 5), 16), parseInt(c.slice(5, 7), 16)]; rgbCache.set(c, v); }
      return v;
    }

    // Facettes triées du fond vers l'avant, ombrées par leur normale (deux faces).
    function facets() {
      const cols = p.couleurs.length ? p.couleurs : ['#888888'], S = [];
      for (let k = 0; k < C * R; k++) S.push(proj(k));
      const out = [], L = [-0.35, -0.55, -0.76], Ll = Math.hypot(...L);
      for (let j = 0; j < R - 1; j++) for (let i = 0; i < C - 1; i++) {
        if (!quadOk[j * (C - 1) + i]) continue;
        const a = j * C + i, b = a + 1, c = a + C, d = c + 1;
        const ux = P[d * 3] - P[a * 3], uy = P[d * 3 + 1] - P[a * 3 + 1], uz = P[d * 3 + 2] - P[a * 3 + 2];
        const vx = P[c * 3] - P[b * 3], vy = P[c * 3 + 1] - P[b * 3 + 1], vz = P[c * 3 + 2] - P[b * 3 + 2];
        const nx = uy * vz - uz * vy, ny = uz * vx - ux * vz, nz = ux * vy - uy * vx, nl = Math.hypot(nx, ny, nz) || 1;
        const lam = (nx * L[0] + ny * L[1] + nz * L[2]) / nl / Ll;
        const back = nz > 0;
        const sh = 1 - p.relief + p.relief * (0.25 + 0.95 * Math.abs(lam)) * (back ? 0.82 : 1);
        const base = rgb(cellColor(i, j, cols));
        const col = `rgb(${Math.min(255, base[0] * sh) | 0},${Math.min(255, base[1] * sh) | 0},${Math.min(255, base[2] * sh) | 0})`;
        const z = (P[a * 3 + 2] + P[b * 3 + 2] + P[c * 3 + 2] + P[d * 3 + 2]) / 4;
        out.push({ z, col, pts: [S[a], S[b], S[d], S[c]] });
      }
      out.sort((A, B) => B.z - A.z);
      return out;
    }

    function draw() {
      const { w, h, dpr } = app.size;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.fillStyle = p.fond; ctx.fillRect(0, 0, w, h);
      // Le mât ou la tringle.
      ctx.strokeStyle = p.couleurs[p.couleurs.length - 1] || '#000'; ctx.lineCap = 'round';
      if (p.accroche === 'mat') {
        const s = proj(0);
        ctx.lineWidth = Math.max(3, rest * 0.45);
        ctx.beginPath(); ctx.moveTo(s.x - ctx.lineWidth / 2, s.y - rest * 2); ctx.lineTo(s.x - ctx.lineWidth / 2, h + 10); ctx.stroke();
      } else if (p.accroche === 'haut') {
        const a = proj(0), b = proj(C - 1);
        ctx.lineWidth = Math.max(3, rest * 0.35);
        ctx.beginPath(); ctx.moveTo(a.x - rest * 2, a.y - 2); ctx.lineTo(b.x + rest * 2, b.y - 2); ctx.stroke();
      }
      const F = facets();
      ctx.lineJoin = 'round';
      for (const f of F) {
        ctx.fillStyle = f.col; ctx.strokeStyle = f.col; ctx.lineWidth = 0.8;
        ctx.beginPath(); ctx.moveTo(f.pts[0].x, f.pts[0].y);
        for (let q = 1; q < 4; q++) ctx.lineTo(f.pts[q].x, f.pts[q].y);
        ctx.closePath(); ctx.fill(); ctx.stroke();
      }
    }

    function toSVG() {
      const { w, h } = app.size, F = facets(), f = (v) => +v.toFixed(1);
      let s = `<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">\n<rect width="100%" height="100%" fill="${p.fond}"/>\n`;
      for (const q of F) s += `<path fill="${q.col}" stroke="${q.col}" stroke-width="0.8" stroke-linejoin="round" d="M${q.pts.map((pt) => `${f(pt.x)} ${f(pt.y)}`).join('L')}Z"/>\n`;
      return s + '</svg>';
    }

    build();
    app.loop((t, dt) => {
      lastT = t;
      if (dt > 0) {
        // Pas fixes : la simulation ne dépend pas de la cadence d'affichage.
        tAcc += Math.min(dt, 0.1);
        let n = 0;
        while (tAcc >= 1 / 60 && n < 4) { simulate(1 / 60, t); tAcc -= 1 / 60; n++; }
      }
      draw();
      app.finish(ctx);
    });
  </script>
</body>
</html>
