<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Champ de flux</title>
  <link rel="stylesheet" href="../../assets/ui/atelier.css">
</head>
<body>
  <canvas></canvas>
  <script src="../../assets/ui/atelier.js"></script>
  <script>
    const PALETTES = {
      ember: { bg: '#0d0a0b', colors: ['#ff5a36', '#ffb347', '#ffd9a0', '#c2185b'] },
      ocean: { bg: '#04121c', colors: ['#2ec4b6', '#3a86ff', '#cbf3f0', '#80ffdb'] },
      mono: { bg: '#0f0f12', colors: ['#ffffff', '#bdbdbd', '#7a7a7a'] },
      neon: { bg: '#07010f', colors: ['#f72585', '#7209b7', '#4cc9f0', '#b5179e'] },
      paper: { bg: '#f3eee3', colors: ['#1b1b1b', '#3d405b', '#e07a5f', '#81b29a'] },
    };
    const canvas = document.querySelector('canvas');
    const ctx = canvas.getContext('2d');
    let particles = [], perm = new Uint8Array(512), z = 0;

    const app = Atelier.app({
      stage: canvas,
      animate: true,
      params: {
        'Particules': {
          count: { type: 'range', label: 'Nombre', min: 200, max: 6000, step: 100, value: 2500 },
          step: { type: 'range', label: 'Pas', min: 0.3, max: 4, step: 0.1, value: 1.2 },
          width: { type: 'range', label: 'Épaisseur', min: 0.3, max: 3, step: 0.1, value: 0.8 },
          fade: { type: 'range', label: 'Persistance', min: 0, max: 0.2, step: 0.005, value: 0.02 },
        },
        'Champ': {
          scale: { type: 'range', label: 'Échelle', min: 0.5, max: 10, step: 0.1, value: 3 },
          curl: { type: 'range', label: 'Turbulence', min: 0.5, max: 6, step: 0.1, value: 2 },
          drift: { type: 'range', label: 'Évolution', min: 0, max: 3, step: 0.1, value: 1 },
        },
        'Couleur': {
          palette: { type: 'select', label: 'Palette', value: 'ember', options: { ember: 'Braise', ocean: 'Océan', mono: 'Monochrome', neon: 'Néon', paper: 'Papier' } },
          clear: { type: 'button', label: 'Effacer la toile', action: () => reset() },
        },
      },
      presets: {
        'Braise': { palette: 'ember', count: 2500, scale: 3, curl: 2, step: 1.2, fade: 0.02, width: 0.8 },
        'Soie': { palette: 'mono', count: 5000, scale: 1.4, curl: 1.2, step: 0.8, fade: 0, width: 0.4 },
        'Encre': { palette: 'paper', count: 1500, scale: 4.5, curl: 3, step: 1.6, fade: 0, width: 1.2 },
        'Néon': { palette: 'neon', count: 3500, scale: 6, curl: 4.5, step: 2.2, fade: 0.06, width: 1 },
        'Courant': { palette: 'ocean', count: 4000, scale: 2, curl: 1.6, step: 3, fade: 0.1, width: 0.6 },
      },
      export: { png: true, video: true },
      onChange(key) {
        if (key === 'count') resize();
        else if (key === 'palette' || key === '*') reset();
      },
      onSeed: () => { reseed(); reset(); },
      onResize: () => reset(),
    });
    const p = app.params;

    // Bruit de valeur 3D lissé, piloté par la graine.
    function reseed() {
      const r = app.rng();
      const a = [...Array(256).keys()];
      for (let i = 255; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
      for (let i = 0; i < 512; i++) perm[i] = a[i & 255];
    }
    const fade = (x) => x * x * x * (x * (x * 6 - 15) + 10);
    const lerp = (a, b, k) => a + (b - a) * k;
    const h = (x, y, z) => perm[(perm[(perm[x & 255] + y) & 255] + z) & 255] / 255;
    function noise(x, y, z) {
      const X = Math.floor(x), Y = Math.floor(y), Z = Math.floor(z);
      const u = fade(x - X), v = fade(y - Y), w = fade(z - Z);
      return lerp(
        lerp(lerp(h(X, Y, Z), h(X + 1, Y, Z), u), lerp(h(X, Y + 1, Z), h(X + 1, Y + 1, Z), u), v),
        lerp(lerp(h(X, Y, Z + 1), h(X + 1, Y, Z + 1), u), lerp(h(X, Y + 1, Z + 1), h(X + 1, Y + 1, Z + 1), u), v), w);
    }

    function spawn(q = {}) {
      const { w, h } = app.size;
      q.x = Math.random() * w; q.y = Math.random() * h;
      q.life = 50 + Math.random() * 250;
      const cols = PALETTES[p.palette].colors;
      q.color = cols[Math.floor(Math.random() * cols.length)];
      return q;
    }
    function resize() {
      while (particles.length < p.count) particles.push(spawn());
      particles.length = p.count;
    }
    function reset() {
      const { w, h, dpr } = app.size;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.fillStyle = PALETTES[p.palette].bg;
      ctx.fillRect(0, 0, w, h);
      particles = Array.from({ length: p.count }, () => spawn());
    }

    app.loop((t, dt) => {
      const { w, h } = app.size;
      if (p.fade > 0) {
        ctx.globalAlpha = p.fade;
        ctx.fillStyle = PALETTES[p.palette].bg;
        ctx.fillRect(0, 0, w, h);
      }
      ctx.lineWidth = p.width;
      ctx.lineCap = 'round';
      ctx.globalAlpha = 0.55;
      const sc = p.scale / 1000, k = dt * 60;
      z += dt * 0.12 * p.drift;
      for (const q of particles) {
        const a = noise(q.x * sc, q.y * sc, z) * Math.PI * 2 * p.curl;
        const px = q.x, py = q.y;
        q.x += Math.cos(a) * p.step * k;
        q.y += Math.sin(a) * p.step * k;
        ctx.strokeStyle = q.color;
        ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(q.x, q.y); ctx.stroke();
        if (--q.life < 0 || q.x < 0 || q.x > w || q.y < 0 || q.y > h) spawn(q);
      }
      ctx.globalAlpha = 1;
    });

    reseed();
    reset();
  </script>
</body>
</html>
