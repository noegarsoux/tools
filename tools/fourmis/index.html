<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fourmis de Langton</title>
  <link rel="stylesheet" href="../../assets/ui/atelier.css">
</head>
<body>
  <canvas></canvas>
  <script src="../../assets/ui/atelier.js"></script>
  <script>
    // Fourmis de Langton (turmites) : une fourmi sur une grille. Sur une case d'état s, elle tourne selon la lettre s
    // de la règle (R droite, L gauche), fait passer la case à l'état suivant, puis avance.
    // « RL » est la fourmi de Langton : dix mille pas de désordre, puis une autoroute qui file à l'infini.
    // Dans le logo, une seconde règle prend le relais, et les cases qu'elle peint prennent la couleur d'accent.
    const canvas = document.querySelector('canvas');
    const ctx = canvas.getContext('2d');
    const TAU = Math.PI * 2;
    const PAL = (k) => Atelier.PALETTES[k].colors;
    const BIEN = PAL('biennale'), GLY = PAL('glyphes'), SAL = PAL('salon'), MEN = PAL('menthe'), KB = PAL('kegelbahn');
    // quelques règles célèbres, parcourues à la molette
    const CELEBRES = ['RL', 'LRRRRRLLR', 'LLRR', 'RLR', 'RRLLLRLLLRRR', 'LLRRRLRLRLLR', 'RRLLLRLLLLLLLLL', 'LRRRRLLLRRR', 'LRLRLLLLLLLR', 'RLLR', 'RRLRR', 'LLRLRLL'];
    const DX = [0, 1, 0, -1], DY = [-1, 0, 1, 0];

    let cols = 0, rows = 0, cell = 0, ox = 0, oy = 0, grid = null, owner = null, mask = null, buf = null, img = null, small = null, sctx = null;
    let ants = [], acc = 0, layoutKey = '', colKey = '', maskKey = '', dirty = true, ruleA = null, ruleB = null, tile = null, tileKey = '', pat = null, held = null, lastPaint = -1, lastXY = null;

    const app = Atelier.app({
      stage: canvas,
      animate: true,
      seed: true,
      finish: { grain: 0.03, vignette: 0.12 },
      hint: 'Touchez pour poser une fourmi · glissez pour peindre des cases · molette : règle suivante',
      notes: 'Une fourmi marche sur une grille. Sur chaque case, elle lit l\'état de la case, tourne selon la lettre correspondante de la règle (R à droite, L à gauche), fait passer la case à l\'état suivant et avance d\'un pas. Avec deux états et la règle RL, c\'est la fourmi de Chris Langton : environ dix mille pas de désordre, puis elle se met à construire une « autoroute » qui part en diagonale pour toujours. Plus de lettres, plus de couleurs : LLRR grandit en restant symétrique, LRRRRRLLR remplit un carré, RRLLLRLLLRRR un triangle. Plusieurs fourmis se croisent et dérangent leurs constructions mutuelles. La règle se règle par son nombre d\'états et un code : en binaire, chaque bit est une lettre, 1 pour R, 0 pour L, en commençant par la droite. Une case peinte au pointeur est un obstacle que la fourmi doit digérer.',
      params: {
        'Règle': {
          etats: { type: 'range', label: 'États (lettres)', min: 2, max: 16, step: 1, value: 11 },
          code: { type: 'range', label: 'Règle (R = 1, L = 0)', min: 0, max: 65535, step: 1, value: 1822 },
        },
        'Fourmis': {
          nombre: { type: 'range', label: 'Nombre', min: 1, max: 24, step: 1, value: 1 },
          depart: { type: 'segmented', label: 'Départ', options: { centre: 'Au centre', cercle: 'En cercle', hasard: 'Au hasard' }, value: 'centre' },
          vitesse: { type: 'range', label: 'Pas par seconde', min: 0, max: 6000, step: 10, value: 2400 },
          avance: { type: 'range', label: 'Pas déjà faits', min: 0, max: 200000, step: 1000, value: 70000 },
          montrer: { type: 'toggle', label: 'Montrer les fourmis', value: true },
          recommencer: { type: 'button', label: 'Recommencer', action: () => { layoutKey = ''; } },
        },
        'Logo dans la grille': {
          logo: { type: 'toggle', label: 'Règle différente dans le logo', value: false },
          regleLogo: { type: 'select', label: 'Règle dans le logo', options: { RL: 'RL · Langton', LLRR: 'LLRR · symétrie', RLR: 'RLR · désordre', LRRRRRLLR: 'LRRRRRLLR · carré', RRLLLRLLLRRR: 'RRLLLRLLLRRR · triangle' }, value: 'RL', show: (q) => q.logo },
          image: { type: 'file', label: 'Logo', accept: 'image/*', show: (q) => q.logo },
        },
        'Cases': {
          taille: { type: 'range', label: 'Taille', min: 2, max: 16, step: 1, value: 3 },
          forme: { type: 'segmented', label: 'Forme', options: { carre: 'Carré', pastille: 'Pastille', losange: 'Losange' }, value: 'carre' },
          ecart: { type: 'range', label: 'Écart', min: 0, max: 0.5, step: 0.01, value: 0 },
          teinte: { type: 'segmented', label: 'Couleur selon', options: { etat: 'État', fourmi: 'Fourmi' }, value: 'etat' },
        },
        'Couleurs': {
          fond: { type: 'color', label: 'Fond', value: '#101012' },
          couleurs: { type: 'palette', label: 'États', value: ['#edd14b', '#486cfc', '#ef5a2f'] },
          accent: { type: 'color', label: 'Logo et fourmis', value: '#f272ba' },
        },
      },
      presets: {
        'Spirale': {},
        'Carrés': { etats: 9, code: 318, nombre: 4, depart: 'cercle', avance: 30000, vitesse: 900, taille: 5, ecart: 0.08, couleurs: ['#486cfc', '#edd14b', '#ef5a2f', '#f4f1ea'] },
        'Langton': { etats: 2, code: 1, nombre: 1, depart: 'centre', avance: 11000, vitesse: 600, taille: 4, couleurs: ['#f4f1ea'], ecart: 0.12, accent: '#ef5a2f' },
        'Éclats': { etats: 15, code: 35, nombre: 1, depart: 'centre', avance: 90000, vitesse: 2400, taille: 3, ecart: 0, forme: 'carre', couleurs: ['#f4f1ea', '#486cfc', '#f272ba', '#edd14b'] },
        'Triangle': { etats: 12, code: 3619, nombre: 1, depart: 'centre', avance: 40000, vitesse: 2000, taille: 3, ecart: 0, couleurs: GLY.slice(2, 7) },
        'Colonie': { etats: 3, code: 5, nombre: 16, depart: 'hasard', avance: 3000, vitesse: 400, teinte: 'fourmi', taille: 6, ecart: 0.14, couleurs: ['#ef5a2f', '#edd14b', '#486cfc', '#f4f1ea', '#f272ba'] },
        'Autoroutes': { etats: 2, code: 1, nombre: 6, depart: 'cercle', avance: 14000, vitesse: 900, taille: 5, forme: 'carre', ecart: 0.18, fond: '#1d2a4a', couleurs: ['#f4f1ea'], accent: '#edd14b' },
        'Logo': { logo: true, etats: 4, code: 12, regleLogo: 'RL', nombre: 8, depart: 'cercle', avance: 24000, vitesse: 1500, teinte: 'etat', couleurs: ['#2a2a2f', '#3a3a40', '#232327'], accent: '#ef5a2f', taille: 4, ecart: 0.1 },
        'Biennale': { etats: 12, code: 2058, nombre: 1, depart: 'centre', avance: 120000, vitesse: 2400, fond: BIEN[0], couleurs: [BIEN[1], BIEN[2], BIEN[3]], accent: BIEN[4], forme: 'pastille', taille: 5, ecart: 0.1 },
        'Menthe': { etats: 9, code: 318, nombre: 2, depart: 'centre', avance: 60000, vitesse: 1500, fond: MEN[1], couleurs: [MEN[2], MEN[3], MEN[0]], taille: 4, ecart: 0.06 },
        'Kegelbahn': { etats: 5, code: 27, nombre: 5, depart: 'cercle', avance: 12000, fond: KB[0], couleurs: [KB[1], KB[2]], accent: KB[2], taille: 5, ecart: 0.16, forme: 'losange' },
      },
      brand(colors) {
        const lum = (x) => { const c = hex(x); return c[0] * 0.299 + c[1] * 0.587 + c[2] * 0.114; };
        const s = colors.slice().sort((a, b) => lum(a) - lum(b)), rest = s.slice(1);
        return { fond: s[0], couleurs: rest.length ? rest : ['#ffffff'], accent: s[s.length - 1] };
      },
      pointer: {
        down: (q) => { held = 'down'; lastPaint = -1; lastXY = { x: q.x, y: q.y }; },
        drag: (q) => {
          if (!held) return; held = 'drag';
          // un trait continu : on suit le segment depuis le dernier point, case par case
          const L = lastXY || { x: q.x, y: q.y }, n = Math.max(1, Math.ceil(Math.hypot(q.x - L.x, q.y - L.y) / (cell * 0.5)));
          for (let k = 1; k <= n; k++) paint(L.x + (q.x - L.x) * k / n, L.y + (q.y - L.y) * k / n);
          lastXY = { x: q.x, y: q.y };
        },
        up: (q) => { if (held === 'down') addAnt(q.x, q.y); held = null; lastPaint = -1; lastXY = null; },
        wheel: (q, dy) => {
          const r = ruleText(), i = CELEBRES.indexOf(r), d = dy > 0 ? 1 : -1, nx = CELEBRES[i < 0 ? 0 : (i + d + CELEBRES.length) % CELEBRES.length];
          app.set('etats', nx.length); app.set('code', codeOf(nx));
        },
      },
      onChange(k) {
        if (['*', 'nombre', 'depart', 'avance', 'taille'].includes(k)) layoutKey = '';
        if (k === 'image' || k === 'logo' || k === '*') maskKey = '';
        colKey = ''; dirty = true;
      },
      onSeed() { layoutKey = ''; },
      export: { name: 'fourmis', svg: () => toSVG() },
    });
    const p = app.params;

    const hex = (x) => { const n = parseInt(x.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; };
    // la règle : un nombre dont les bits disent, état par état, à droite (1) ou à gauche (0)
    const codeOf = (r) => [...r].reduce((a, c, i) => a + (c === 'R' ? 1 << i : 0), 0);
    function ruleText() { let r = ''; for (let i = 0; i < p.etats; i++) r += (p.code >> i) & 1 ? 'R' : 'L'; return r; }
    const TURN = { R: 1, L: 3, N: 0, U: 2 };
    function compile(r) { return Uint8Array.from(r, (c) => TURN[c]); }

    // ——— Grille et fourmis ———
    function layout() {
      const { w, h } = app.size, key = [w, h, p.taille].join();
      if (key === layoutKey && grid) return false; layoutKey = key;
      cell = p.taille; cols = Math.ceil(w / cell); rows = Math.ceil(h / cell);
      ox = Math.round((w - cols * cell) / 2); oy = Math.round((h - rows * cell) / 2);
      grid = new Uint8Array(cols * rows); owner = new Uint8Array(cols * rows);
      small = document.createElement('canvas'); small.width = cols; small.height = rows; sctx = small.getContext('2d');
      img = sctx.createImageData(cols, rows); buf = new Uint32Array(img.data.buffer);
      maskKey = ''; colKey = '';
      const rng = app.rng(), n = p.nombre, cx = cols >> 1, cy = rows >> 1;
      ants = [];
      for (let a = 0; a < n; a++) {
        let x, y, d;
        if (p.depart === 'centre') { x = cx + (a % 2) * (n > 1 ? 2 : 0) - (n > 1 ? 1 : 0) + (((a >> 1) % 3) - 1) * 3 * (n > 2 ? 1 : 0); y = cy + (((a >> 1) / 3 | 0) - 1) * 3 * (n > 6 ? 1 : 0); d = a % 4; }
        else if (p.depart === 'cercle') { const t = a / n * TAU, R = Math.min(cols, rows) * 0.18; x = Math.round(cx + Math.cos(t) * R); y = Math.round(cy + Math.sin(t) * R); d = (Math.round(t / (TAU / 4)) + 1) & 3; }
        else { x = (rng() * cols) | 0; y = (rng() * rows) | 0; d = (rng() * 4) | 0; }
        ants.push({ x: ((x % cols) + cols) % cols, y: ((y % rows) + rows) % rows, d });
      }
      buildMask(w, h); ruleA = compile(ruleText()); ruleB = compile(p.regleLogo);
      run(app.thumbnail ? Math.max(p.avance, 9000) : p.avance);
      acc = 0; dirty = true; return true;
    }
    function addAnt(x, y) {
      if (!grid) return; const i = Math.floor((x - ox) / cell), j = Math.floor((y - oy) / cell);
      if (i < 0 || j < 0 || i >= cols || j >= rows) return;
      if (ants.length >= 64) ants.shift();
      ants.push({ x: i, y: j, d: (Math.random() * 4) | 0 });
    }
    function paint(x, y) {
      if (!grid) return; const i = Math.floor((x - ox) / cell), j = Math.floor((y - oy) / cell);
      if (i < 0 || j < 0 || i >= cols || j >= rows) return; const k = j * cols + i; if (k === lastPaint) return; lastPaint = k;
      for (let dj = -1; dj <= 1; dj++) for (let di = -1; di <= 1; di++) {
        const ii = (i + di + cols) % cols, jj = (j + dj + rows) % rows, o = jj * cols + ii, K = (mask && mask[o] ? ruleB : ruleA).length;
        grid[o] = (grid[o] + 1) % K || 1; owner[o] = 255; setPix(o);
      }
      dirty = true;
    }

    // le logo en coordonnées de grille, centré
    function buildMask(w, h) {
      mask = null; if (!p.logo || !cols) return;
      const img0 = p.image || app.logoImg; maskKey = [cols, rows, img0 ? (img0.src || 'c') : 'demo'].join();
      const c = document.createElement('canvas'); c.width = cols; c.height = rows; const x = c.getContext('2d', { willReadFrequently: true });
      const L = Math.min(cols, rows) * 0.62, cx = cols / 2, cy = rows / 2;
      if (img0) { const iw = img0.naturalWidth || img0.width, ih = img0.naturalHeight || img0.height, k = L / Math.max(iw, ih); x.drawImage(img0, cx - iw * k / 2, cy - ih * k / 2, iw * k, ih * k); }
      else { x.fillStyle = '#000'; x.beginPath(); x.arc(cx, cy, L * 0.48, 0, TAU); x.arc(cx, cy, L * 0.27, 0, TAU, true); x.fill('evenodd'); x.fillRect(cx - L * 0.07, cy - L * 0.5, L * 0.14, L); }
      const N = cols * rows, d = x.getImageData(0, 0, cols, rows).data; let transp = 0; for (let i = 3; i < d.length; i += 4) if (d[i] < 128) transp++;
      const useA = transp > N * 0.05; mask = new Uint8Array(N);
      for (let i = 0; i < N; i++) { const l = (d[i * 4] * 0.2126 + d[i * 4 + 1] * 0.7152 + d[i * 4 + 2] * 0.0722) / 255; mask[i] = (useA ? d[i * 4 + 3] > 128 : d[i * 4 + 3] > 128 && l < 0.5) ? 1 : 0; }
    }

    // les fourmis avancent à tour de rôle, un pas chacune ; en animation on ne repeint que leurs cases
    function run(steps) { stepLive(Math.round(steps), false); colKey = ''; }
    function stepLive(steps, paint = true) {
      const A = ruleA, B = ruleB, KA = A.length, KB_ = B.length, M = mask, n = ants.length, C = cols, R = rows, G = grid, O = owner;
      for (let s = 0; s < steps; s++) for (let a = 0; a < n; a++) {
        const ant = ants[a], o = ant.y * C + ant.x, inL = M !== null && M[o] === 1, Rr = inL ? B : A, K = inL ? KB_ : KA, st = G[o] % K;
        ant.d = (ant.d + Rr[st]) & 3; G[o] = st + 1 === K ? 0 : st + 1; O[o] = a < 255 ? a : 254; if (paint) setPix(o);
        let x = ant.x + DX[ant.d], y = ant.y + DY[ant.d]; if (x < 0) x += C; else if (x >= C) x -= C; if (y < 0) y += R; else if (y >= R) y -= R;
        ant.x = x; ant.y = y;
      }
      if (steps > 0) dirty = true;
    }

    // ——— Couleurs ———
    let LUT = new Uint32Array(17), LUTF = new Uint32Array(17), LUTACC = 0, LUTFOND = 0;
    const pack = (c) => { const [r, g, b] = hex(c); return (255 << 24) | (b << 16) | (g << 8) | r; };
    function colors() {
      const key = [p.fond, p.couleurs.join(), p.accent, p.teinte, p.logo, cols, rows, maskKey].join('|');
      if (key === colKey) return; colKey = key;
      const C = p.couleurs.length ? p.couleurs : ['#ffffff'];
      LUTFOND = pack(p.fond); LUTACC = pack(p.accent);
      for (let s = 1; s < 17; s++) LUT[s] = pack(C[(s - 1) % C.length]);
      for (let a = 0; a < 17; a++) LUTF[a] = pack(C[a % C.length]);
      for (let o = 0, N = cols * rows; o < N; o++) setPix(o);
      dirty = true;
    }
    function colorIndex(o) {
      const s = grid[o]; if (!s) return -2;
      if (owner[o] === 255 || (mask && mask[o])) return -1;
      return p.teinte === 'fourmi' ? owner[o] % p.couleurs.length : (s - 1) % p.couleurs.length;
    }
    function setPix(o) {
      const s = grid[o];
      buf[o] = !s ? LUTFOND : (owner[o] === 255 || (mask && mask[o])) ? LUTACC : p.teinte === 'fourmi' ? LUTF[owner[o] % 17] : LUT[Math.min(16, s)];
    }

    // le motif qui découpe chaque case (pastille, losange, écart) : une tuile couleur de fond, percée
    function cutPattern(c, dpr) {
      const key = [p.forme, p.ecart, cell, dpr, p.fond].join();
      if (key === tileKey) return pat; tileKey = key;
      if (p.forme === 'carre' && p.ecart < 0.005) return (pat = null);
      const T = 64, t = document.createElement('canvas'); t.width = t.height = T; const x = t.getContext('2d');
      x.fillStyle = p.fond; x.fillRect(0, 0, T, T); x.globalCompositeOperation = 'destination-out'; x.fillStyle = '#000';
      const s = T * (1 - p.ecart), m = (T - s) / 2;
      x.beginPath();
      if (p.forme === 'pastille') x.arc(T / 2, T / 2, s / 2, 0, TAU);
      else if (p.forme === 'losange') { x.moveTo(T / 2, m); x.lineTo(T - m, T / 2); x.lineTo(T / 2, T - m); x.lineTo(m, T / 2); x.closePath(); }
      else x.roundRect(m, m, s, s, s * 0.12);
      x.fill();
      pat = c.createPattern(t, 'repeat'); return pat;
    }

    app.loop((t, dt) => {
      dt = Math.min(0.1, dt || 0);
      const { w, h, dpr } = app.size;
      layout();
      if (p.logo && !maskKey) { buildMask(w, h); colKey = ''; }
      if (!p.logo && mask) { mask = null; maskKey = ''; colKey = ''; }
      ruleA = compile(ruleText()); ruleB = compile(p.regleLogo);
      colors();
      if (!app.thumbnail) { acc += dt * p.vitesse; const k = Math.floor(acc); acc -= k; stepLive(k); }
      draw(ctx, w, h, dpr);
      app.finish(ctx);
    });

    function draw(c, w, h, dpr) {
      if (dirty) { sctx.putImageData(img, 0, 0); dirty = false; }
      c.setTransform(dpr, 0, 0, dpr, 0, 0);
      c.fillStyle = p.fond; c.fillRect(0, 0, w, h);
      c.imageSmoothingEnabled = false;
      c.drawImage(small, ox, oy, cols * cell, rows * cell);
      const P = cutPattern(c, dpr);
      if (P) {
        P.setTransform(new DOMMatrix([cell / 64, 0, 0, cell / 64, ox, oy]));
        c.fillStyle = P; c.fillRect(0, 0, w, h);
      }
      if (p.montrer && !app.thumbnail) {
        const r = Math.max(4, cell * 1.1);
        c.lineWidth = Math.max(1.2, r * 0.35); c.strokeStyle = p.fond; c.fillStyle = p.accent;
        c.beginPath();
        for (const a of ants) {
          const x = ox + (a.x + 0.5) * cell, y = oy + (a.y + 0.5) * cell, dx = DX[a.d], dy = DY[a.d];
          c.moveTo(x + dx * r * 1.25, y + dy * r * 1.25); c.lineTo(x - dx * r * 0.7 - dy * r * 0.8, y - dy * r * 0.7 + dx * r * 0.8); c.lineTo(x - dx * r * 0.7 + dy * r * 0.8, y - dy * r * 0.7 - dx * r * 0.8); c.closePath();
        }
        c.stroke(); c.fill();
      }
    }

    // ——— Export : une forme par case, groupées par couleur ; les carrés jointifs sont fusionnés en bandes ———
    function toSVG() {
      const { w, h } = app.size, C = p.couleurs, f = (v) => +v.toFixed(2), bins = C.map(() => []), ac = [];
      const g = cell * p.ecart, s = cell - g, joint = p.forme === 'carre' && p.ecart < 0.005;
      for (let j = 0; j < rows; j++) {
        const y = oy + j * cell;
        for (let i = 0; i < cols; i++) {
          const o = j * cols + i, ci = colorIndex(o); if (ci === -2) continue; const L = ci < 0 ? ac : bins[ci], x = ox + i * cell;
          if (joint) { let e = i; while (e + 1 < cols && colorIndex(o + e + 1 - i) === ci) e++; L.push(`M${f(x)} ${f(y)}h${f((e - i + 1) * cell)}v${f(cell)}h${f(-(e - i + 1) * cell)}z`); i = e; continue; }
          const cx = x + cell / 2, cy = y + cell / 2;
          if (p.forme === 'pastille') L.push(`M${f(cx - s / 2)} ${f(cy)}a${f(s / 2)} ${f(s / 2)} 0 1 0 ${f(s)} 0a${f(s / 2)} ${f(s / 2)} 0 1 0 ${f(-s)} 0z`);
          else if (p.forme === 'losange') L.push(`M${f(cx)} ${f(cy - s / 2)}l${f(s / 2)} ${f(s / 2)}l${f(-s / 2)} ${f(s / 2)}l${f(-s / 2)} ${f(-s / 2)}z`);
          else L.push(`M${f(x + g / 2)} ${f(y + g / 2)}h${f(s)}v${f(s)}h${f(-s)}z`);
        }
      }
      const grp = (col, L) => L.length ? `<path fill="${col}" d="${L.join('')}"/>` : '';
      let antsSVG = '';
      if (p.montrer) {
        const r = Math.max(4, cell * 1.1), d0 = [];
        for (const a of ants) {
          const x = ox + (a.x + 0.5) * cell, y = oy + (a.y + 0.5) * cell, dx = DX[a.d], dy = DY[a.d];
          d0.push(`M${f(x + dx * r * 1.25)} ${f(y + dy * r * 1.25)}L${f(x - dx * r * 0.7 - dy * r * 0.8)} ${f(y - dy * r * 0.7 + dx * r * 0.8)}L${f(x - dx * r * 0.7 + dy * r * 0.8)} ${f(y - dy * r * 0.7 - dx * r * 0.8)}z`);
        }
        if (d0.length) antsSVG = `<path fill="${p.accent}" stroke="${p.fond}" stroke-width="${f(Math.max(1.2, r * 0.35))}" stroke-linejoin="round" paint-order="stroke" d="${d0.join('')}"/>`;
      }
      return `<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><rect width="100%" height="100%" fill="${p.fond}"/>${C.map((c, k) => grp(c, bins[k])).join('')}${grp(p.accent, ac)}${antsSVG}</svg>`;
    }
  </script>
</body>
</html>
