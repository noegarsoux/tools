<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Halftone CMJN</title>
  <link rel="stylesheet" href="../../assets/ui/atelier.css">
</head>
<body>
  <canvas></canvas>
  <script src="../../assets/ui/atelier.js"></script>
  <script>
    // Halftone CMJN : l'image est séparée en quatre encres (cyan, magenta, jaune, noir), chacune tramée
    // sur sa propre grille tournée (15°, 75°, 0°, 45° en offset classique). Les points de chaque encre
    // grossissent avec la quantité d'encre et se superposent en multiplication, comme sur le papier.
    // On peut dérégler le repérage, rapprocher les angles pour faire naître le moiré, changer la forme
    // des points. Le sujet est un nuage de couleurs de la charte qui dérive, des sphères, un dégradé,
    // le logo ou une image.
    const canvas = document.querySelector('canvas');
    const ctx = canvas.getContext('2d');
    const TAU = Math.PI * 2, D2R = Math.PI / 180;
    const PAL = (k) => Atelier.PALETTES[k].colors;
    const KB = PAL('kegelbahn'), GR = PAL('good-room'), BIEN = PAL('biennale'), LU = PAL('luzern'), TH = PAL('thermique'), BIT = PAL('bitmap');
    const SAL = PAL('salon'), PYR = PAL('pyramides'), CODE = PAL('code');

    let ptr = null, drag = null, misreg = { x: 0, y: 0 }, lastT = 0, srcDirty = true, src = null, seedOff = [];

    const app = Atelier.app({
      stage: canvas,
      animate: true,
      seed: true,
      finish: { grain: 0.05, vignette: 0 },
      hint: 'Survol : une tache de couleur suit le pointeur · glissez pour dérégler le repérage · molette : pas de la trame',
      notes: 'Chaque encre a sa grille et son angle ; les points s’additionnent en multiplication sur le papier. Des angles trop proches font naître le moiré ; le retrait de sous-couleur remplace le gris commun aux trois couleurs par du noir.',
      params: {
        'Sujet': {
          sujet: { type: 'segmented', label: 'Sujet', options: { taches: 'Taches', spheres: 'Sphères', degrade: 'Dégradé', logo: 'Logo', image: 'Image' }, value: 'taches' },
          image: { type: 'file', label: 'Image', accept: 'image/*', show: (q) => q.sujet === 'image' },
          couleurs: { type: 'palette', label: 'Couleurs du sujet', value: [KB[1], KB[2], KB[3], KB[5], KB[4]], show: (q) => q.sujet !== 'image' },
          echelle: { type: 'range', label: 'Échelle', min: 0.4, max: 2.5, step: 0.01, value: 1 },
          vitesse: { type: 'range', label: 'Vitesse', min: 0, max: 1, step: 0.01, value: 0.3 },
        },
        'Trame': {
          pas: { type: 'range', label: 'Pas de la trame (px)', min: 3, max: 40, step: 0.5, value: 9 },
          forme: { type: 'segmented', label: 'Forme des points', options: { rond: 'Rond', carre: 'Carré', losange: 'Losange', ligne: 'Ligne' }, value: 'rond' },
          angles: { type: 'segmented', label: 'Angles', options: { offset: 'Offset', moire: 'Moiré', alignes: 'Alignés' }, value: 'offset' },
          rotation: { type: 'range', label: 'Rotation des trames (°)', min: -45, max: 45, step: 0.5, value: 0 },
          gain: { type: 'range', label: 'Engraissement', min: 0.5, max: 1.8, step: 0.01, value: 1 },
          noir: { type: 'range', label: 'Retrait de sous-couleur', min: 0, max: 1, step: 0.01, value: 0.7 },
          reperage: { type: 'range', label: 'Défaut de repérage', min: 0, max: 1, step: 0.01, value: 0.25 },
        },
        'Encres': {
          papier: { type: 'color', label: 'Papier', value: '#f6f3ec' },
          cyan: { type: 'color', label: 'Cyan', value: '#00a0e0' },
          magenta: { type: 'color', label: 'Magenta', value: '#e5007e' },
          jaune: { type: 'color', label: 'Jaune', value: '#ffe500' },
          noir_encre: { type: 'color', label: 'Noir', value: '#1d1d1b' },
        },
      },
      presets: {
        'Quadri': {},
        'Moiré': { angles: 'moire', pas: 7, reperage: 0.1, sujet: 'degrade' },
        'Gros points': { pas: 26, forme: 'rond', sujet: 'spheres', couleurs: [GR[1], GR[2], GR[3], GR[4]], reperage: 0.4 },
        'Losanges': { forme: 'losange', pas: 12, sujet: 'taches', couleurs: [BIEN[2], BIEN[3], BIEN[4], BIEN[1]], angles: 'offset' },
        'Lignes': { forme: 'ligne', pas: 8, sujet: 'degrade', rotation: 10 },
        'Logo': { sujet: 'logo', pas: 8, couleurs: ['#e5452a', '#486cfc', '#edd14b'], reperage: 0.3 },
        'Luzern': { sujet: 'taches', couleurs: [LU[0], LU[1], LU[2], LU[3]], pas: 10, papier: '#ffffff' },
        'Risographie': { sujet: 'spheres', couleurs: [SAL[2], SAL[3], SAL[4]], pas: 6, forme: 'rond', reperage: 0.8, papier: '#efe9dc', cyan: '#0078bf', magenta: '#ff48b0', jaune: '#ffe800', noir_encre: '#000000', gain: 1.15 },
        'Carrés': { forme: 'carre', pas: 14, angles: 'alignes', sujet: 'taches', couleurs: [BIT[2], BIT[3], BIT[4], BIT[1]], reperage: 0 },
        'Thermique': { sujet: 'degrade', couleurs: TH.slice(1), pas: 11, forme: 'rond', rotation: -12, gain: 1.2 },
      },
      brand(colors) {
        return { couleurs: colors.slice(0, 6), papier: '#f6f3ec' };
      },
      pointer: {
        move: (q) => { ptr = { x: q.x, y: q.y }; },
        down: (q) => { drag = { x: q.x, y: q.y, m: { ...misreg } }; },
        drag: (q) => { if (drag) misreg = { x: drag.m.x + (q.x - drag.x) * 0.15, y: drag.m.y + (q.y - drag.y) * 0.15 }; ptr = { x: q.x, y: q.y }; },
        up: () => { drag = null; },
        wheel: (q, dy) => app.set('pas', Math.max(3, Math.min(40, Math.round((p.pas * Math.exp(dy * 0.001)) * 2) / 2))),
      },
      onChange(k) {
        if (k === 'image' || k === '*' || k === 'sujet' || k === '_logo') srcDirty = true;
        if (k === '*') misreg = { x: 0, y: 0 };
      },
      onSeed() { reseed(); },
      export: { name: 'halftone-cmjn', svg: () => toSVG() },
    });
    const p = app.params;
    canvas.addEventListener('pointerleave', () => { ptr = null; });

    function reseed() {
      const r = app.rng(17);
      seedOff = Array.from({ length: 24 }, () => r());
    }
    reseed();

    const hex = (c) => [parseInt(c.slice(1, 3), 16) / 255, parseInt(c.slice(3, 5), 16) / 255, parseInt(c.slice(5, 7), 16) / 255];

    // ——— Source : image ou logo en RVB ———
    function buildSource() {
      srcDirty = false; src = null;
      const img = p.sujet === 'image' ? p.image : p.sujet === 'logo' ? app.logoImg : null;
      if (p.sujet !== 'image' && p.sujet !== 'logo') return;
      const M = 360, cv = document.createElement('canvas'), x = cv.getContext('2d', { willReadFrequently: true });
      if (img) {
        const iw = img.naturalWidth || img.width, ih = img.naturalHeight || img.height, k = M / Math.max(iw, ih);
        cv.width = Math.max(2, Math.round(iw * k)); cv.height = Math.max(2, Math.round(ih * k));
        x.drawImage(img, 0, 0, cv.width, cv.height);
      } else if (p.sujet === 'logo') {
        cv.width = cv.height = M; x.fillStyle = '#000';
        x.beginPath(); x.arc(M / 2, M / 2, M * 0.46, 0, TAU); x.arc(M / 2, M / 2, M * 0.3, 0, TAU, true); x.fill();
        x.beginPath(); x.arc(M / 2, M / 2, M * 0.17, 0, TAU); x.fill();
      } else return;
      const w = cv.width, h = cv.height, d = x.getImageData(0, 0, w, h).data, a = new Float32Array(w * h * 4);
      for (let i = 0; i < w * h * 4; i++) a[i] = d[i] / 255;
      src = { w, h, a };
    }
    function sampleSrc(u, v, out) {
      if (u < 0 || v < 0 || u >= 1 || v >= 1) { out[0] = out[1] = out[2] = 1; out[3] = 0; return; }
      const i = ((v * src.h | 0) * src.w + (u * src.w | 0)) * 4, a = src.a;
      out[0] = a[i]; out[1] = a[i + 1]; out[2] = a[i + 2]; out[3] = a[i + 3];
    }

    // ——— Sujet : couleur RVB ∈ [0, 1] en coordonnées centrées (unité = petit côté) ———
    const tmp = [0, 0, 0, 0];
    let frameCols = [], blobs = [];
    function prepare(t) {
      frameCols = (p.couleurs.length ? p.couleurs : ['#e5452a']).map(hex);
      const s = t * p.vitesse, { w, h } = app.size, U = Math.min(w, h);
      blobs = frameCols.map((c, i) => {
        const o = seedOff, a = o[i * 3] * TAU, b = o[i * 3 + 1] * TAU;
        return { x: 0.42 * Math.sin(s * (0.31 + 0.1 * i) + a) * (w / U) * 0.9, y: 0.34 * Math.cos(s * (0.27 + 0.07 * i) + b), r: 0.26 + 0.12 * o[i * 3 + 2], c };
      });
      if (ptr) blobs.push({ x: (ptr.x - w / 2) / U, y: (ptr.y - h / 2) / U, r: 0.16, c: frameCols[(frameCols.length > 1 ? 1 : 0)], hot: true });
    }
    function subject(X, Y, t, out) {
      const sc = p.echelle, x = X / sc, y = Y / sc;
      switch (p.sujet) {
        case 'spheres': {
          const n = Math.min(5, frameCols.length), s = t * p.vitesse;
          let best = null, bz = -1;
          for (let i = 0; i < n; i++) {
            const a = seedOff[i * 2] * TAU + s * 0.4 * (i % 2 ? 1 : -1);
            const cx = Math.cos(a) * 0.32 * (0.6 + seedOff[10 + i] * 0.6), cy = Math.sin(a) * 0.22, R = 0.13 + 0.09 * seedOff[i + 5];
            const dx = (x - cx) / R, dy = (y - cy) / R, r2 = dx * dx + dy * dy;
            if (r2 < 1) { const nz = Math.sqrt(1 - r2); if (cy + nz * R > bz) { bz = cy + nz * R; best = [dx, dy, nz, frameCols[i]]; } }
          }
          if (best) {
            const [nx, ny, nz, c] = best, l = Math.max(0, -0.5 * nx - 0.6 * ny + 0.62 * nz), spec = Math.pow(Math.max(0, l), 30) * 0.8;
            const k = 0.25 + 0.85 * l;
            out[0] = Math.min(1, c[0] * k + spec); out[1] = Math.min(1, c[1] * k + spec); out[2] = Math.min(1, c[2] * k + spec);
            return;
          }
          out[0] = out[1] = out[2] = 1 - 0.12 * Math.max(0, y + 0.3);
          return;
        }
        case 'degrade': {
          // Un tour du cercle chromatique qui tourne lentement, éclairci au centre.
          const a = Math.atan2(y, x) / TAU + t * p.vitesse * 0.05, r = Math.hypot(x, y);
          const n = frameCols.length, u = ((a % 1) + 1) % 1 * n, i = Math.floor(u), f = u - i, c0 = frameCols[i % n], c1 = frameCols[(i + 1) % n];
          const sf = f * f * (3 - 2 * f), wh = Math.max(0, 1 - r * 2.2);
          for (let k = 0; k < 3; k++) out[k] = (c0[k] + (c1[k] - c0[k]) * sf) * (1 - wh) + wh;
          return;
        }
        case 'logo':
        case 'image': {
          if (!src) { out[0] = out[1] = out[2] = 1; return; }
          const asp = src.w / src.h, { w, h } = app.size, fr = w / h;
          let ww, hh;
          if (p.sujet === 'logo') { const U = 0.8; ww = asp >= 1 ? U : U * asp; hh = asp >= 1 ? U / asp : U; }
          else { const cw = Math.max(fr, 1), ch = Math.max(1 / fr, 1); if (asp > cw / ch) { hh = ch; ww = ch * asp; } else { ww = cw; hh = cw / asp; } }
          sampleSrc(x / ww + 0.5, y / hh + 0.5, tmp);
          if (p.sujet === 'logo') {
            // Le logo, coloré par un dégradé des couleurs du sujet qui défile, sur le papier.
            const n = frameCols.length, u = (((x + y) * 0.9 + t * p.vitesse * 0.15) % 1 + 1) % 1 * n, i = Math.floor(u), f = u - i;
            const c0 = frameCols[i % n], c1 = frameCols[(i + 1) % n], al = tmp[3];
            for (let k = 0; k < 3; k++) out[k] = 1 - al + al * (c0[k] + (c1[k] - c0[k]) * f);
          } else { out[0] = tmp[0]; out[1] = tmp[1]; out[2] = tmp[2]; }
          blend(x, y, out, true);
          return;
        }
        default: {
          out[0] = out[1] = out[2] = 1;
          blend(x, y, out, false);
        }
      }
    }
    // Taches : chaque couleur du sujet se dépose en gaussienne, mélangée en soustractif (multiplication).
    function blend(x, y, out, onlyHot) {
      for (const b of blobs) {
        if (onlyHot && !b.hot) continue;
        const dx = x - b.x, dy = y - b.y, wgt = Math.exp(-(dx * dx + dy * dy) / (b.r * b.r)) * (b.hot ? 0.9 : 0.95);
        for (let k = 0; k < 3; k++) out[k] *= 1 - wgt + wgt * b.c[k];
      }
    }

    // RVB → CMJN avec retrait de sous-couleur (la part commune devient du noir).
    function cmyk(c, out) {
      const C = 1 - c[0], M = 1 - c[1], Y = 1 - c[2], K = Math.min(C, M, Y) * p.noir;
      const d = 1 - K + 1e-6;
      out[0] = (C - K) / d; out[1] = (M - K) / d; out[2] = (Y - K) / d; out[3] = K;
    }

    // Angles des quatre grilles (C, M, J, N).
    function screenAngles() {
      const r = p.rotation;
      if (p.angles === 'moire') return [15 + r, 18 + r, 0 + r, 21 + r];
      if (p.angles === 'alignes') return [r, r, r, r];
      return [15 + r, 75 + r, 0 + r, 45 + r];
    }

    // Pour chaque encre : liste de points { x, y, s } (s = taille relative ∈ [0, 1]).
    function dots(t) {
      const { w, h } = app.size, U = Math.min(w, h), step = p.pas, ang = screenAngles(), out = [[], [], [], []];
      if (srcDirty) buildSource();
      prepare(t);
      const rgb = [0, 0, 0], ck = [0, 0, 0, 0];
      // Repérage : chaque encre est légèrement décalée, et le décalage tremble doucement.
      const mr = p.reperage * step * 0.5;
      const off = [0, 1, 2, 3].map((i) => ({
        x: (i === 3 ? 0 : 1) * (mr * Math.sin(t * 0.7 + i * 2.1 + seedOff[20]) + misreg.x * (i === 1 ? 1 : i === 0 ? -0.6 : 0.3)),
        y: (i === 3 ? 0 : 1) * (mr * Math.cos(t * 0.6 + i * 1.7 + seedOff[21]) + misreg.y * (i === 2 ? 1 : i === 0 ? 0.5 : -0.4)),
      }));
      const R = Math.hypot(w, h) / 2 + step;
      for (let ch = 0; ch < 4; ch++) {
        const a = ang[ch] * D2R, ca = Math.cos(a), sa = Math.sin(a), n = Math.ceil(R / step), o = off[ch];
        for (let j = -n; j <= n; j++) for (let i = -n; i <= n; i++) {
          const gx = i * step, gy = j * step;
          const x = w / 2 + gx * ca - gy * sa, y = h / 2 + gx * sa + gy * ca;
          if (x < -step || y < -step || x > w + step || y > h + step) continue;
          subject((x - w / 2) / U, (y - h / 2) / U, t, rgb);
          cmyk(rgb, ck);
          const v = Math.min(1, Math.max(0, ck[ch] * p.gain));
          if (v < 0.02) continue;
          out[ch].push({ x: x + o.x, y: y + o.y, v, a });
        }
      }
      return out;
    }

    // Taille du point pour une couverture v : l'aire de la forme vaut v fois l'aire de la cellule.
    function dotPath(c, d, step) {
      const v = d.v;
      switch (p.forme) {
        case 'carre': {
          const s = step * Math.sqrt(v) / 2, ca = Math.cos(d.a), sa = Math.sin(d.a);
          c.moveTo(d.x + (-s) * ca - (-s) * sa, d.y + (-s) * sa + (-s) * ca);
          c.lineTo(d.x + s * ca - (-s) * sa, d.y + s * sa + (-s) * ca);
          c.lineTo(d.x + s * ca - s * sa, d.y + s * sa + s * ca);
          c.lineTo(d.x + (-s) * ca - s * sa, d.y + (-s) * sa + s * ca);
          c.closePath(); return;
        }
        case 'losange': {
          const s = step * Math.sqrt(v * 2) / 2 * 1.0, ca = Math.cos(d.a), sa = Math.sin(d.a);
          c.moveTo(d.x + s * ca, d.y + s * sa); c.lineTo(d.x - s * sa, d.y + s * ca); c.lineTo(d.x - s * ca, d.y - s * sa); c.lineTo(d.x + s * sa, d.y - s * ca);
          c.closePath(); return;
        }
        case 'ligne': {
          // Une bande le long de la ligne de trame, d'épaisseur proportionnelle à l'encre.
          const hw = step / 2 + 0.5, th = step * v / 2, ca = Math.cos(d.a), sa = Math.sin(d.a);
          c.moveTo(d.x - hw * ca + th * sa, d.y - hw * sa - th * ca); c.lineTo(d.x + hw * ca + th * sa, d.y + hw * sa - th * ca);
          c.lineTo(d.x + hw * ca - th * sa, d.y + hw * sa + th * ca); c.lineTo(d.x - hw * ca - th * sa, d.y - hw * sa + th * ca);
          c.closePath(); return;
        }
        default: {
          // Au-delà d'environ 78 %, le disque déborde de sa cellule et rejoint ses voisins.
          const r = step * Math.sqrt(v / Math.PI) * 1.0;
          c.moveTo(d.x + r, d.y); c.arc(d.x, d.y, r, 0, TAU);
        }
      }
    }

    function inks() { return [p.cyan, p.magenta, p.jaune, p.noir_encre]; }

    let cache = null;
    function draw(t) {
      const { w, h, dpr } = app.size, D = dots(t), I = inks();
      cache = D;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.globalCompositeOperation = 'source-over';
      ctx.fillStyle = p.papier; ctx.fillRect(0, 0, w, h);
      ctx.globalCompositeOperation = 'multiply';
      // Ordre d'impression : jaune, magenta, cyan, noir.
      for (const ch of [2, 1, 0, 3]) {
        ctx.fillStyle = I[ch];
        ctx.beginPath();
        for (const d of D[ch]) dotPath(ctx, d, p.pas);
        ctx.fill();
      }
      ctx.globalCompositeOperation = 'source-over';
    }

    function toSVG() {
      const { w, h } = app.size, D = cache || dots(lastT), I = inks(), f = (v) => +v.toFixed(2);
      // Un chemin par encre, sérialisé à partir des mêmes formes que le canvas.
      const rec = { d: '', moveTo(x, y) { this.d += `M${f(x)} ${f(y)}`; }, lineTo(x, y) { this.d += `L${f(x)} ${f(y)}`; }, closePath() { this.d += 'Z'; },
        arc(x, y, r) { this.d += `M${f(x + r)} ${f(y)}A${f(r)} ${f(r)} 0 1 0 ${f(x - r)} ${f(y)}A${f(r)} ${f(r)} 0 1 0 ${f(x + r)} ${f(y)}Z`; } };
      let s = `<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">\n<rect width="100%" height="100%" fill="${p.papier}"/>\n`;
      for (const ch of [2, 1, 0, 3]) {
        rec.d = '';
        for (const d of D[ch]) {
          if (p.forme === 'rond') { const r = p.pas * Math.sqrt(d.v / Math.PI); rec.arc(d.x, d.y, r); }
          else dotPath(rec, d, p.pas);
        }
        s += `<path fill="${I[ch]}" style="mix-blend-mode:multiply" d="${rec.d}"/>\n`;
      }
      return s + '</svg>';
    }

    app.loop((t) => { lastT = t; draw(t); app.finish(ctx); });
  </script>
</body>
</html>
