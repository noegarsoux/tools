<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Épicycles</title>
  <link rel="stylesheet" href="../../assets/ui/atelier.css">
</head>
<body>
  <canvas></canvas>
  <script src="../../assets/ui/atelier.js"></script>
  <script>
    // Épicycles : un contour fermé z(s) décomposé en série de Fourier, z(s) = Σ c_k · e^(2iπ k s).
    // Chaque terme est un cercle de rayon |c_k| qui tourne k fois par boucle ; mis bout à bout,
    // ils redessinent la forme. Peu de termes donnent une forme molle, beaucoup retrouvent les angles.
    const canvas = document.querySelector('canvas');
    const ctx = canvas.getContext('2d');
    const TAU = Math.PI * 2, M = 1024;
    const PAL = (k) => Atelier.PALETTES[k].colors;
    const ORB = PAL('orbite'), P60 = PAL('papier-60'), NUIT = PAL('trame-nuit'), ACIDE = PAL('acide'), KB = PAL('kegelbahn');
    const BIEN = PAL('biennale'), LUZ = PAL('luzern'), PHOTO = PAL('photocopie'), MENTHE = PAL('menthe');

    const SHAPE = new Set(['forme', 'branches', 'creux', 'image']);
    let ready = false, drawing = null, drawn = null, scrub = 0, scrubOff = 0;

    const app = Atelier.app({
      stage: canvas,
      animate: true,
      seed: false,
      finish: true,
      hint: 'Dessinez une forme fermée au pointeur · Alt + glisser : avancer dans la boucle · molette : harmoniques',
      notes: 'Le contour est échantillonné en 1024 points puis passé en transformée de Fourier discrète. Chaque coefficient devient un cercle qui tourne à sa fréquence ; la pointe de la chaîne redessine le contour. Les contours d’un logo sont reliés par des ponts invisibles (plume levée) pour former un seul tracé.',
      params: {
        'Forme': {
          forme: { type: 'segmented', label: 'Contour', options: { etoile: 'Étoile', polygone: 'Polygone', rosace: 'Rosace', coeur: 'Cœur', logo: 'Logo', dessin: 'Dessin' }, value: 'etoile' },
          image: { type: 'file', label: 'Logo ou image', accept: 'image/*', show: (q) => q.forme === 'logo' },
          branches: { type: 'range', label: 'Branches ou côtés', min: 2, max: 16, step: 1, value: 5, show: (q) => q.forme !== 'logo' && q.forme !== 'dessin' && q.forme !== 'coeur' },
          creux: { type: 'range', label: 'Creux', min: 0.1, max: 0.95, step: 0.01, value: 0.42, show: (q) => q.forme === 'etoile' || q.forme === 'rosace' },
        },
        'Série': {
          harmoniques: { type: 'range', label: 'Harmoniques', min: 1, max: 400, step: 1, value: 14 },
          ordre: { type: 'segmented', label: 'Ordre des cercles', options: { amplitude: 'Du plus grand', frequence: 'Par fréquence' }, value: 'amplitude' },
          anim: { type: 'segmented', label: 'Animation', options: { trace: 'Tracé', croissance: 'Croissance', fixe: 'Forme fixe' }, value: 'trace' },
          boucle: { type: 'range', label: 'Boucle (s)', min: 3, max: 60, step: 0.5, value: 12 },
          trainee: { type: 'range', label: 'Traînée (part du tour)', min: 0.02, max: 1, step: 0.01, value: 0.7 },
        },
        'Mise en page': {
          vue: { type: 'segmented', label: 'Vue', options: { seule: 'Une forme', planche: 'Planche' }, value: 'seule' },
          colonnes: { type: 'range', label: 'Colonnes de la planche', min: 2, max: 8, step: 1, value: 4, show: (q) => q.vue === 'planche' },
          echelle: { type: 'range', label: 'Échelle', min: 0.2, max: 1.2, step: 0.01, value: 0.7 },
          rotation: { type: 'range', label: 'Rotation (°)', min: -180, max: 180, step: 1, value: 0 },
        },
        'Rendu': {
          cercles: { type: 'range', label: 'Opacité des cercles', min: 0, max: 1, step: 0.01, value: 0.55 },
          rayons: { type: 'range', label: 'Opacité des rayons', min: 0, max: 1, step: 0.01, value: 1 },
          cible: { type: 'range', label: 'Contour d’origine', min: 0, max: 1, step: 0.01, value: 0.12 },
          trait: { type: 'range', label: 'Trait des cercles', min: 0.3, max: 4, step: 0.05, value: 1.2 },
          epaisseur: { type: 'range', label: 'Épaisseur du tracé', min: 0.5, max: 16, step: 0.1, value: 4 },
          pointe: { type: 'range', label: 'Pointe', min: 0, max: 0.04, step: 0.001, value: 0.01 },
          remplissage: { type: 'range', label: 'Remplissage de la forme', min: 0, max: 1, step: 0.01, value: 0 },
        },
        'Couleur': {
          fond: { type: 'color', label: 'Fond', value: P60[0] },
          encre: { type: 'color', label: 'Cercles', value: P60[1] },
          trace: { type: 'color', label: 'Tracé', value: ORB[0] },
          plein: { type: 'color', label: 'Remplissage', value: ORB[0] },
          palette: { type: 'palette', label: 'Dégradé de la chaîne', value: [P60[1], ORB[0]] },
        },
      },
      presets: {
        'Étoile': {},
        'Logo': { forme: 'logo', harmoniques: 120, cercles: 0.22, rayons: 0.6, epaisseur: 2.6, cible: 0.1, trainee: 1, remplissage: 0.15 },
        'Croissance': { anim: 'croissance', forme: 'polygone', branches: 4, harmoniques: 160, cercles: 0.35, rayons: 0.8, epaisseur: 2, cible: 0, remplissage: 1, plein: ACIDE[2], fond: NUIT[0], encre: NUIT[1], trace: NUIT[1], palette: [NUIT[2], NUIT[1]] },
        'Planche': { vue: 'planche', colonnes: 4, anim: 'fixe', ordre: 'frequence', forme: 'etoile', branches: 5, creux: 0.5, harmoniques: 20, cercles: 0.3, rayons: 0.7, cible: 0, epaisseur: 1.6, echelle: 0.86, remplissage: 1, plein: BIEN[2], fond: BIEN[0], encre: BIEN[1], trace: BIEN[1], palette: [BIEN[1], BIEN[1]] },
        'Rosace orbite': { forme: 'rosace', branches: 7, creux: 0.7, harmoniques: 40, trainee: 1, cercles: 0.3, rayons: 0.9, epaisseur: 3.4, fond: ORB[0], encre: ORB[1], trace: ORB[2], palette: [ORB[1], ORB[2]] },
        'Kegelbahn': { forme: 'polygone', branches: 3, harmoniques: 3, ordre: 'frequence', trainee: 1, cercles: 0.9, rayons: 1, trait: 2.2, epaisseur: 6, pointe: 0.018, cible: 0, fond: KB[0], encre: KB[2], trace: KB[1], palette: [KB[2], KB[3], KB[1], KB[5]] },
        'Cœur menthe': { forme: 'coeur', harmoniques: 6, ordre: 'frequence', trainee: 0.5, cercles: 0.5, rayons: 0.7, epaisseur: 5, pointe: 0.012, cible: 0.25, fond: MENTHE[0], encre: MENTHE[1], trace: MENTHE[3], palette: [MENTHE[1], MENTHE[3]] },
        'Photocopie': { forme: 'etoile', branches: 12, creux: 0.25, harmoniques: 300, cercles: 0.12, rayons: 0.4, trainee: 0.6, epaisseur: 2.4, cible: 0.06, echelle: 0.7, rotation: 15, fond: PHOTO[0], encre: PHOTO[1], trace: PHOTO[1], palette: [PHOTO[2], PHOTO[1]] },
        'Luzern': { forme: 'rosace', branches: 3, creux: 0.35, anim: 'croissance', harmoniques: 80, cercles: 0.4, rayons: 0.9, epaisseur: 4, cible: 0, fond: LUZ[3], encre: LUZ[2], trace: LUZ[0], palette: [LUZ[1], LUZ[2], LUZ[0]] },
      },
      brand(colors) {
        return { fond: colors[0], encre: colors[1] || colors[0], trace: colors[2] || colors[1] || colors[0], plein: colors[3] || colors[2] || colors[1] || colors[0], palette: colors.length > 1 ? colors.slice(1) : colors };
      },
      pointer: {
        down: (q) => {
          if (q.alt) { drawing = null; scrub = { x: q.x, s0: scrubOff }; return; }
          scrub = 0; drawing = [[q.x, q.y]];
        },
        drag: (q) => {
          if (scrub) { scrubOff = scrub.s0 + (q.x - scrub.x) / Math.max(1, app.size.w); return; }
          if (!drawing) return;
          const l = drawing[drawing.length - 1];
          if (Math.hypot(q.x - l[0], q.y - l[1]) > 2) drawing.push([q.x, q.y]);
        },
        up: () => {
          scrub = 0;
          if (!drawing) return;
          const d = drawing; drawing = null;
          let len = 0; for (let i = 1; i < d.length; i++) len += Math.hypot(d[i][0] - d[i - 1][0], d[i][1] - d[i - 1][1]);
          if (d.length < 8 || len < Math.min(app.size.w, app.size.h) * 0.15) return;
          drawn = d.map((q) => [q[0], q[1]]);
          if (p.forme !== 'dessin') app.set('forme', 'dessin'); else rebuild();
        },
        wheel: (q, dy) => app.set('harmoniques', Math.max(1, Math.min(400, Math.round(p.harmoniques * Math.exp(-dy * 0.002)) + (dy < 0 ? 1 : dy > 0 ? -1 : 0)))),
      },
      onChange: (key) => { if (ready && (key === '*' || SHAPE.has(key))) rebuild(); },
      export: { name: 'epicycles', svg: () => exportSVG() },
    });
    const p = app.params;

    // ——— Contours ———
    // Polygone fermé → points (x, y) ; drapeau « pont » pour les liaisons entre contours (plume levée).
    function polyPts(n, rIn, star) {
      const v = [], k = star ? 2 * n : n;
      for (let i = 0; i < k; i++) { const a = -Math.PI / 2 + TAU * i / k, r = star && i % 2 ? rIn : 1; v.push([Math.cos(a) * r, Math.sin(a) * r]); }
      return [v];
    }
    function curvePts(fn, n = 720) { const v = []; for (let i = 0; i < n; i++) v.push(fn(TAU * i / n)); return [v]; }
    function shapeLoops() {
      const n = p.branches;
      if (p.forme === 'polygone') return polyPts(Math.max(3, n), 1, false);
      if (p.forme === 'rosace') return curvePts((a) => { const r = 1 - p.creux * (1 - Math.abs(Math.cos(n * a / 2))); return [Math.cos(a - Math.PI / 2) * r, Math.sin(a - Math.PI / 2) * r]; });
      if (p.forme === 'coeur') return curvePts((a) => [16 * Math.sin(a) ** 3, -(13 * Math.cos(a) - 5 * Math.cos(2 * a) - 2 * Math.cos(3 * a) - Math.cos(4 * a))]);
      if (p.forme === 'logo') { const L = logoLoops(); if (L) return L; }
      if (p.forme === 'dessin' && drawn) return [drawn];
      return polyPts(Math.max(2, n), p.creux, true);
    }

    // Contours d'un logo : marching squares sur la luminance, segments reliés en boucles.
    let logoSrc = null, logoCache = null;
    function logoLoops() {
      const img = p.image || app.logoImg;
      if (!img) return null;
      if (img === logoSrc) return logoCache;
      logoSrc = img;
      const N = 260, iw = img.naturalWidth || img.width, ih = img.naturalHeight || img.height, k = N / Math.max(iw, ih);
      const cw = Math.max(2, Math.round(iw * k)), ch = Math.max(2, Math.round(ih * k)), W = cw + 4, H = ch + 4;
      const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
      const x = cv.getContext('2d', { willReadFrequently: true });
      x.fillStyle = '#fff'; x.fillRect(0, 0, W, H); x.drawImage(img, 2, 2, cw, ch);
      const d = x.getImageData(0, 0, W, H).data, v = new Float32Array(W * H);
      for (let i = 0; i < W * H; i++) v[i] = 1 - (d[i * 4] * 0.2126 + d[i * 4 + 1] * 0.7152 + d[i * 4 + 2] * 0.0722) / 255;
      // Si le fond est sombre (logo clair), on inverse.
      let edgeSum = 0; for (let i = 0; i < W; i++) edgeSum += v[2 * W + i] + v[(H - 3) * W + i];
      if (edgeSum / (2 * W) > 0.5) for (let i = 0; i < W * H; i++) v[i] = 1 - v[i];
      for (let i = 0; i < W; i++) { v[i] = v[(H - 1) * W + i] = 0; } for (let j = 0; j < H; j++) { v[j * W] = v[j * W + W - 1] = 0; }
      const th = 0.5, pos = new Map(), adj = new Map();
      const kp = (key, xx, yy) => { if (!pos.has(key)) pos.set(key, [xx, yy]); return key; };
      const hE = (i, j) => { const a = v[j * W + i], b = v[j * W + i + 1]; return kp((j * W + i) * 2, i + (th - a) / (b - a), j); };
      const vE = (i, j) => { const a = v[j * W + i], b = v[(j + 1) * W + i]; return kp((j * W + i) * 2 + 1, i, j + (th - a) / (b - a)); };
      const link = (a, b) => { (adj.get(a) || adj.set(a, []).get(a)).push(b); (adj.get(b) || adj.set(b, []).get(b)).push(a); };
      for (let j = 0; j < H - 1; j++) for (let i = 0; i < W - 1; i++) {
        const c = (v[j * W + i] > th ? 1 : 0) | (v[j * W + i + 1] > th ? 2 : 0) | (v[(j + 1) * W + i + 1] > th ? 4 : 0) | (v[(j + 1) * W + i] > th ? 8 : 0);
        if (c === 0 || c === 15) continue;
        const T = () => hE(i, j), R = () => vE(i + 1, j), B = () => hE(i, j + 1), L = () => vE(i, j);
        switch (c) {
          case 1: case 14: link(L(), T()); break;
          case 2: case 13: link(T(), R()); break;
          case 3: case 12: link(L(), R()); break;
          case 4: case 11: link(R(), B()); break;
          case 6: case 9: link(T(), B()); break;
          case 7: case 8: link(L(), B()); break;
          case 5: link(L(), T()); link(R(), B()); break;
          case 10: link(T(), R()); link(B(), L()); break;
        }
      }
      const seen = new Set(), loops = [];
      for (const start of adj.keys()) {
        if (seen.has(start)) continue;
        const loop = []; let prev = -1, cur = start;
        while (cur !== undefined && !seen.has(cur)) {
          seen.add(cur); loop.push(pos.get(cur));
          const nb = adj.get(cur); const nx = nb[0] !== prev ? nb[0] : nb[1];
          prev = cur; cur = nx;
        }
        if (loop.length > 6) loops.push(loop);
      }
      const len = (L) => { let s = 0; for (let i = 0; i < L.length; i++) { const a = L[i], b = L[(i + 1) % L.length]; s += Math.hypot(b[0] - a[0], b[1] - a[1]); } return s; };
      const total = loops.reduce((s, L) => s + len(L), 0);
      const kept = loops.filter((L) => len(L) > total * 0.01).sort((a, b) => len(b) - len(a));
      logoCache = kept.length ? kept : null;
      return logoCache;
    }

    // Enchaîne les boucles (la plus proche d'abord), avec ponts, puis rééchantillonne en M points.
    function buildPath(loops) {
      const segs = []; // [x0, y0, x1, y1, pont]
      const rest = loops.map((L) => L.slice());
      let tour = rest.shift(), start = tour[0];
      const pushLoop = (L) => { for (let i = 0; i < L.length; i++) { const a = L[i], b = L[(i + 1) % L.length]; segs.push([a[0], a[1], b[0], b[1], false]); } };
      pushLoop(tour);
      let last = tour[0];
      while (rest.length) {
        let bi = 0, bj = 0, bd = Infinity;
        rest.forEach((L, i) => { for (let j = 0; j < L.length; j++) { const dd = (L[j][0] - last[0]) ** 2 + (L[j][1] - last[1]) ** 2; if (dd < bd) { bd = dd; bi = i; bj = j; } } });
        const L = rest.splice(bi, 1)[0], R = L.slice(bj).concat(L.slice(0, bj));
        segs.push([last[0], last[1], R[0][0], R[0][1], true]);
        pushLoop(R); last = R[0];
      }
      if (last !== start) segs.push([last[0], last[1], start[0], start[1], true]);
      let T = 0; const cum = segs.map((s) => (T += Math.hypot(s[2] - s[0], s[3] - s[1])));
      const z = new Float64Array(2 * M), up = new Uint8Array(M);
      let si = 0;
      for (let n = 0; n < M; n++) {
        const at = T * n / M;
        while (si < segs.length - 1 && cum[si] < at) si++;
        const s = segs[si], l0 = si ? cum[si - 1] : 0, ll = Math.max(1e-9, cum[si] - l0), f = Math.min(1, Math.max(0, (at - l0) / ll));
        z[2 * n] = s[0] + (s[2] - s[0]) * f; z[2 * n + 1] = s[1] + (s[3] - s[1]) * f; up[n] = s[4] ? 1 : 0;
      }
      // Cadrage : centre de la boîte englobante, plus grand côté = 1.
      let x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity;
      for (let n = 0; n < M; n++) { const a = z[2 * n], b = z[2 * n + 1]; if (a < x0) x0 = a; if (a > x1) x1 = a; if (b < y0) y0 = b; if (b > y1) y1 = b; }
      const cx = (x0 + x1) / 2, cy = (y0 + y1) / 2, sc = 1 / Math.max(1e-9, x1 - x0, y1 - y0);
      for (let n = 0; n < M; n++) { z[2 * n] = (z[2 * n] - cx) * sc; z[2 * n + 1] = (z[2 * n + 1] - cy) * sc; }
      return { z, up };
    }

    // Transformée de Fourier discrète (M² opérations, une seule fois par forme).
    let PATH = null, COEF = [];
    function rebuild() {
      PATH = buildPath(shapeLoops());
      const { z } = PATH, cs = new Float64Array(M), sn = new Float64Array(M);
      for (let n = 0; n < M; n++) { cs[n] = Math.cos(TAU * n / M); sn[n] = Math.sin(TAU * n / M); }
      COEF = [];
      for (let k = -M / 2; k < M / 2; k++) {
        let re = 0, im = 0;
        for (let n = 0; n < M; n++) {
          const idx = ((k * n) % M + M) % M, c = cs[idx], s = -sn[idx];
          re += z[2 * n] * c - z[2 * n + 1] * s; im += z[2 * n] * s + z[2 * n + 1] * c;
        }
        COEF.push({ k, re: re / M, im: im / M, amp: Math.hypot(re, im) / M });
      }
      sortCoef();
    }
    let sortedFor = '';
    function sortCoef() {
      // Les termes quasi nuls (symétries de la forme) sont écartés : chaque harmonique ajoutée change le dessin.
      const amax = Math.max(...COEF.map((c) => (c.k ? c.amp : 0)));
      const c0 = COEF.find((c) => c.k === 0), rest = COEF.filter((c) => c.k !== 0 && c.amp > amax * 2e-4);
      if (p.ordre === 'frequence') rest.sort((a, b) => Math.abs(a.k) - Math.abs(b.k) || b.k - a.k);
      else rest.sort((a, b) => b.amp - a.amp);
      COEF = [c0, ...rest];
      sortedFor = p.ordre;
    }
    rebuild();
    ready = true;

    // Somme des K premiers termes en s ∈ [0, 1) ; renvoie la chaîne de centres si demandé.
    function evalAt(s, K, chain) {
      let x = COEF[0].re, y = COEF[0].im;
      if (chain) chain.push([x, y]);
      for (let i = 1; i <= K && i < COEF.length; i++) {
        const c = COEF[i], a = TAU * c.k * s, ca = Math.cos(a), sa = Math.sin(a);
        x += c.re * ca - c.im * sa; y += c.re * sa + c.im * ca;
        if (chain) chain.push([x, y]);
      }
      return [x, y];
    }
    const penUp = (s) => PATH.up[((Math.floor(s * M) % M) + M) % M] === 1;

    // Couleurs
    const rgbOf = (c) => { const h = String(c).replace('#', ''); const v = parseInt(h.length === 3 ? h.replace(/./g, '$&$&') : h.slice(0, 6), 16); return [v >> 16 & 255, v >> 8 & 255, v & 255]; };
    const mixHex = (a, b, k) => { const A = rgbOf(a), B = rgbOf(b); return '#' + A.map((v, i) => Math.round(v + (B[i] - v) * k).toString(16).padStart(2, '0')).join(''); };
    const gradAt = (pal, f) => { if (pal.length < 2) return pal[0]; const x = Math.min(0.9999, Math.max(0, f)) * (pal.length - 1), i = Math.floor(x); return mixHex(pal[i], pal[i + 1], x - i); };

    // ——— Dessin (canvas ou SVG via un « sink ») ———
    function cells() {
      const { w, h } = app.size;
      if (p.vue !== 'planche') return [{ cx: w / 2, cy: h / 2, size: Math.min(w, h), K: p.harmoniques, i: 0, n: 1 }];
      const cols = p.colonnes, rows = Math.max(1, Math.round(cols * h / w)), n = cols * rows, cw = w / cols, chh = h / rows, out = [];
      for (let i = 0; i < n; i++) {
        // Harmoniques croissantes, de 1 jusqu'au réglage (plus serrées au début, où la forme change le plus).
        const K = 1 + Math.round((p.harmoniques - 1) * Math.pow(n > 1 ? i / (n - 1) : 1, 1.25));
        out.push({ cx: cw * (i % cols + 0.5), cy: chh * (Math.floor(i / cols) + 0.5), size: Math.min(cw, chh), K, i, n });
      }
      return out;
    }
    function draw(t, sink) {
      if (sortedFor !== p.ordre) sortCoef();
      const L = p.boucle, phase = ((t / L + scrubOff) % 1 + 1) % 1;
      const rot = p.rotation * Math.PI / 180, cr = Math.cos(rot), sr = Math.sin(rot);
      for (const cell of cells()) {
        const sc = cell.size * p.echelle * (p.vue === 'planche' ? 0.82 : 1);
        const P = (q) => [cell.cx + (q[0] * cr - q[1] * sr) * sc, cell.cy + (q[0] * sr + q[1] * cr) * sc];
        let K = cell.K;
        // Croissance : les harmoniques montent de 1 au réglage le long de la boucle, puis redescendent.
        if (p.anim === 'croissance') { const g = 0.5 - 0.5 * Math.cos(TAU * phase); K = Math.max(1, Math.round(Math.pow(cell.K, g))); }
        const lw = p.trait * (p.vue === 'planche' ? 0.7 : 1), ew = p.epaisseur * (p.vue === 'planche' ? 0.7 : 1);
        // Contour d'origine
        if (p.cible > 0) {
          const pts = []; for (let n = 0; n <= M; n += 2) { const m = n % M; pts.push(PATH.up[m] ? null : P([PATH.z[2 * m], PATH.z[2 * m + 1]])); }
          sink.poly(pts, p.encre, lw, p.cible);
        }
        const s = phase;
        // Tracé reconstitué
        const full = p.anim !== 'trace' ? 1 : p.trainee, steps = Math.max(24, Math.round(560 * full));
        const pts = [];
        for (let i = 0; i <= steps; i++) {
          const u = p.anim === 'trace' ? s - full * (1 - i / steps) : i / steps;
          pts.push({ q: P(evalAt(u, K)), up: penUp(u), f: i / steps });
        }
        if (p.remplissage > 0) {
          // Un sous-tracé par contour (les ponts, plume levée, ne sont pas remplis).
          const runs = []; let run = null;
          for (let i = 0; i <= 600; i++) { const u = i / 600; if (penUp(u)) { run = null; continue; } if (!run) runs.push(run = []); run.push(P(evalAt(u, K))); }
          if (runs.length > 1 && !penUp(0) && !penUp(0.9999)) { const last = runs.pop(); runs[0] = last.concat(runs[0]); }
          sink.fill(runs.filter((r) => r.length > 2), p.plein, p.remplissage);
        }
        sink.trace(pts, ew, p.anim === 'trace');
        // Chaîne d'épicycles
        const chain = []; evalAt(s, K, chain);
        const nC = chain.length - 1;
        if (p.cercles > 0) for (let i = 1; i <= nC; i++) {
          const r = COEF[i].amp * sc; if (r < 0.4) continue;
          const c = P(chain[i - 1]); sink.circle(c[0], c[1], r, gradAt(p.palette, nC > 1 ? (i - 1) / (nC - 1) : 0), lw, p.cercles);
        }
        if (p.rayons > 0) for (let i = 1; i <= nC; i++) {
          const a = P(chain[i - 1]), b = P(chain[i]);
          sink.line(a, b, gradAt(p.palette, nC > 1 ? (i - 1) / (nC - 1) : 0), lw * 1.1, p.rayons);
        }
        if (p.pointe > 0) { const tip = P(chain[nC]); sink.dot(tip[0], tip[1], p.pointe * cell.size * (p.vue === 'planche' ? 0.6 : 1), p.trace); }
      }
    }

    const canvasSink = {
      poly(pts, col, lw, a) {
        ctx.globalAlpha = a; ctx.strokeStyle = col; ctx.lineWidth = lw; ctx.beginPath();
        let pen = false; for (const q of pts) { if (!q) { pen = false; continue; } if (pen) ctx.lineTo(q[0], q[1]); else { ctx.moveTo(q[0], q[1]); pen = true; } }
        ctx.stroke(); ctx.globalAlpha = 1;
      },
      trace(pts, ew, fade) {
        ctx.lineCap = 'round'; ctx.lineJoin = 'round';
        if (!fade) {
          ctx.strokeStyle = p.trace; ctx.lineWidth = ew; ctx.beginPath();
          let pen = false; for (const o of pts) { if (o.up) { pen = false; continue; } if (pen) ctx.lineTo(o.q[0], o.q[1]); else { ctx.moveTo(o.q[0], o.q[1]); pen = true; } }
          ctx.stroke(); return;
        }
        // Traînée : par paquets, la couleur glisse vers le fond (opaque, sans surimpression).
        const B = 16;
        for (let b = 0; b < B; b++) {
          const i0 = Math.floor(b * (pts.length - 1) / B), i1 = Math.floor((b + 1) * (pts.length - 1) / B);
          const f = (b + 1) / B; ctx.strokeStyle = mixHex(p.trace, p.fond, Math.pow(1 - f, 1.4)); ctx.lineWidth = ew * (0.35 + 0.65 * f);
          ctx.beginPath(); let pen = false;
          for (let i = i0; i <= i1; i++) { const o = pts[i]; if (o.up) { pen = false; continue; } if (pen) ctx.lineTo(o.q[0], o.q[1]); else { ctx.moveTo(o.q[0], o.q[1]); pen = true; } }
          ctx.stroke();
        }
      },
      fill(runs, col, a) { ctx.globalAlpha = a; ctx.fillStyle = col; ctx.beginPath(); for (const pts of runs) { ctx.moveTo(pts[0][0], pts[0][1]); for (const q of pts) ctx.lineTo(q[0], q[1]); ctx.closePath(); } ctx.fill('evenodd'); ctx.globalAlpha = 1; },
      circle(x, y, r, col, lw, a) { ctx.globalAlpha = a; ctx.strokeStyle = col; ctx.lineWidth = lw; ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.stroke(); ctx.globalAlpha = 1; },
      line(a, b, col, lw, al) { ctx.globalAlpha = al; ctx.strokeStyle = col; ctx.lineWidth = lw; ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.stroke(); ctx.globalAlpha = 1; },
      dot(x, y, r, col) { ctx.fillStyle = col; ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill(); },
    };

    app.loop((t) => {
      const { w, h, dpr } = app.size;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.fillStyle = p.fond; ctx.fillRect(0, 0, w, h);
      draw(t, canvasSink);
      if (drawing && drawing.length > 1) {
        ctx.strokeStyle = p.trace; ctx.lineWidth = 2; ctx.setLineDash([6, 6]); ctx.beginPath();
        ctx.moveTo(drawing[0][0], drawing[0][1]); for (const q of drawing) ctx.lineTo(q[0], q[1]); ctx.closePath(); ctx.stroke(); ctx.setLineDash([]);
      }
      app.finish(ctx);
    });

    // ——— Export SVG ———
    function exportSVG() {
      const { w, h } = app.size, f = (v) => Math.round(v * 100) / 100;
      const out = [`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${w} ${h}" width="${w}" height="${h}">`, `<rect width="${w}" height="${h}" fill="${p.fond}"/>`];
      const pathD = (list) => { let d = '', pen = false; for (const q of list) { if (!q) { pen = false; continue; } d += (pen ? 'L' : 'M') + f(q[0]) + ' ' + f(q[1]); pen = true; } return d; };
      draw(app.time, {
        poly(pts, col, lw, a) { out.push(`<path d="${pathD(pts)}" fill="none" stroke="${col}" stroke-width="${f(lw)}" stroke-opacity="${f(a)}"/>`); },
        trace(pts, ew, fade) {
          if (!fade) { out.push(`<path d="${pathD(pts.map((o) => (o.up ? null : o.q)))}" fill="none" stroke="${p.trace}" stroke-width="${f(ew)}" stroke-linecap="round" stroke-linejoin="round"/>`); return; }
          const B = 16;
          for (let b = 0; b < B; b++) {
            const i0 = Math.floor(b * (pts.length - 1) / B), i1 = Math.floor((b + 1) * (pts.length - 1) / B), fr = (b + 1) / B;
            out.push(`<path d="${pathD(pts.slice(i0, i1 + 1).map((o) => (o.up ? null : o.q)))}" fill="none" stroke="${mixHex(p.trace, p.fond, Math.pow(1 - fr, 1.4))}" stroke-width="${f(ew * (0.35 + 0.65 * fr))}" stroke-linecap="round" stroke-linejoin="round"/>`);
          }
        },
        fill(runs, col, a) { out.push(`<path d="${runs.map((pts) => 'M' + pts.map((q) => `${f(q[0])} ${f(q[1])}`).join('L') + 'Z').join('')}" fill="${col}" fill-rule="evenodd"${a < 1 ? ` fill-opacity="${f(a)}"` : ''}/>`); },
        circle(x, y, r, col, lw, a) { out.push(`<circle cx="${f(x)}" cy="${f(y)}" r="${f(r)}" fill="none" stroke="${col}" stroke-width="${f(lw)}" stroke-opacity="${f(a)}"/>`); },
        line(a, b, col, lw, al) { out.push(`<path d="M${f(a[0])} ${f(a[1])}L${f(b[0])} ${f(b[1])}" stroke="${col}" stroke-width="${f(lw)}" stroke-opacity="${f(al)}"/>`); },
        dot(x, y, r, col) { out.push(`<circle cx="${f(x)}" cy="${f(y)}" r="${f(r)}" fill="${col}"/>`); },
      });
      out.push('</svg>');
      return out.join('\n');
    }
  </script>
</body>
</html>
