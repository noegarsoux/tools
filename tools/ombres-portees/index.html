<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ombres portées</title>
  <link rel="stylesheet" href="../../assets/ui/atelier.css">
</head>
<body>
  <canvas></canvas>
  <script src="../../assets/ui/atelier.js"></script>
  <script>
    // Ombres portées : le texte est vectorisé (marching squares), puis chaque arête projette un quadrilatère
    // d'ombre vers l'opposé de la lumière (parallèle ou ponctuelle). L'union des quadrilatères (tous orientés
    // dans le même sens, règle non nulle) donne l'ombre exacte, identique au canvas et au SVG.
    const canvas = document.querySelector('canvas');
    const ctx = canvas.getContext('2d');
    const TAU = Math.PI * 2, DEG = Math.PI / 180;
    const PAL = (k) => Atelier.PALETTES[k].colors;
    const BIEN = PAL('biennale'), KB = PAL('kegelbahn'), SALON = PAL('salon'), GR = PAL('good-room'), LUZ = PAL('luzern');
    const P60 = PAL('papier-60'), MENTHE = PAL('menthe'), ORB = PAL('orbite'), ACIDE = PAL('acide'), PYR = PAL('pyramides'), THER = PAL('thermique');
    const FONTS = {
      grotesque: "'Helvetica Neue', Helvetica, Arial, sans-serif",
      serif: "Georgia, 'Times New Roman', Times, serif",
      mono: "'Courier New', Courier, monospace",
    };

    let vec = null, vecKey = '', hover = null, drag = null, spin = 0, lightPt = null;

    const app = Atelier.app({
      stage: canvas,
      animate: true,
      seed: true,
      finish: { grain: 0.03, vignette: 0 },
      hint: 'Le pointeur est la lumière · glissez verticalement : longueur · touchez : lumière parallèle ou ponctuelle',
      notes: 'Les ombres sont calculées en vecteurs à partir du contour des lettres : l’export SVG les contient telles quelles. Plusieurs lumières colorées se superposent en produit.',
      params: {
        'Texte': {
          texte: { type: 'textarea', label: 'Texte', value: 'OMBRE\nPORTÉE', rows: 3 },
          police: { type: 'font', label: 'Police', options: { grotesque: 'Grotesque', serif: 'Sérif', mono: 'Machine' }, value: 'grotesque' },
          graisse: { type: 'segmented', label: 'Graisse', options: { 400: 'Normale', 700: 'Grasse', 900: 'Noire' }, value: '900' },
          taille: { type: 'range', label: 'Taille', min: 0.2, max: 0.95, step: 0.01, value: 0.62 },
          interligne: { type: 'range', label: 'Interligne', min: 0.7, max: 1.4, step: 0.01, value: 0.92 },
        },
        'Lumière': {
          mode: { type: 'segmented', label: 'Lumière', options: { parallele: 'Parallèle', point: 'Ponctuelle' }, value: 'parallele' },
          angle: { type: 'range', label: 'Angle (°)', min: -180, max: 180, step: 1, value: -35 },
          longueur: { type: 'range', label: 'Longueur', min: 0, max: 1.2, step: 0.01, value: 0.35 },
          lumieres: { type: 'range', label: 'Lumières', min: 1, max: 3, step: 1, value: 1 },
          ecart: { type: 'range', label: 'Écart entre lumières (°)', min: 5, max: 120, step: 1, value: 40, show: (q) => q.lumieres > 1 },
          orbite: { type: 'range', label: 'Course de la lumière', min: 0, max: 1, step: 0.01, value: 0.35 },
          vitesse: { type: 'range', label: 'Vitesse', min: 0, max: 3, step: 0.01, value: 0.6 },
          paliers: { type: 'range', label: 'Paliers', min: 1, max: 8, step: 1, value: 1 },
        },
        'Couleur': {
          fond: { type: 'color', label: 'Fond', value: BIEN[3] },
          couleurTexte: { type: 'color', label: 'Texte', value: BIEN[0] },
          ombres: { type: 'palette', label: 'Ombres', value: [BIEN[2], BIEN[4], BIEN[1]] },
          melange: { type: 'segmented', label: 'Superposition', options: { multiply: 'Produit', 'source-over': 'Normale' }, value: 'multiply' },
          contour: { type: 'range', label: 'Contour du texte', min: 0, max: 6, step: 0.1, value: 0 },
        },
      },
      presets: {
        'Biennale': {},
        'Longue': { texte: 'LONG\nSHADOW', fond: P60[0], couleurTexte: P60[0], ombres: [P60[1]], longueur: 1.1, angle: 45, orbite: 0.1, contour: 2.5, melange: 'source-over' },
        'Trois lumières': { texte: 'RVB', lumieres: 3, ecart: 60, fond: '#f4f3f0', couleurTexte: '#ffffff', ombres: ['#00b8e6', '#e6007e', '#ffe600'], longueur: 0.3, orbite: 0.5, contour: 0 },
        'Kegelbahn': { texte: 'KEGEL\nBAHN', fond: KB[0], couleurTexte: KB[3], ombres: [KB[1], KB[2]], lumieres: 2, ecart: 70, melange: 'source-over', longueur: 0.25, paliers: 4 },
        'Projecteur': { texte: 'SCÈNE', mode: 'point', fond: '#141414', couleurTexte: '#f4f1ea', ombres: ['#2a2a2a'], longueur: 0.8, melange: 'source-over' },
        'Salon': { texte: 'SALON', fond: SALON[0], couleurTexte: SALON[4], ombres: [SALON[2], SALON[3]], lumieres: 2, paliers: 3, longueur: 0.45, contour: 2, melange: 'source-over' },
        'Good Room': { texte: 'GOOD\nROOM', fond: GR[0], couleurTexte: GR[0], ombres: [GR[1], GR[3]], lumieres: 2, ecart: 25, longueur: 0.5, contour: 1.5, melange: 'source-over' },
        'Luzern': { texte: 'LUZERN', fond: LUZ[4], couleurTexte: LUZ[0], ombres: [LUZ[1]], paliers: 6, longueur: 0.6, angle: 20, melange: 'source-over' },
        'Serif': { texte: 'Ombre\ndouce', police: 'serif', graisse: '700', fond: MENTHE[0], couleurTexte: MENTHE[1], ombres: [MENTHE[2]], paliers: 5, longueur: 0.3, angle: -60 },
        'Orbite': { texte: 'O', mode: 'point', fond: ORB[2], couleurTexte: ORB[0], ombres: [ORB[1]], taille: 0.5, longueur: 1, orbite: 0.8, melange: 'source-over' },
        'Pyramides': { texte: 'SOLEIL', fond: PYR[0], couleurTexte: PYR[4], ombres: [PYR[6], PYR[2]], paliers: 2, lumieres: 2, ecart: 15, longueur: 0.7, angle: 10, melange: 'source-over' },
        'Thermique': { texte: 'CHAUD', fond: THER[3], couleurTexte: THER[3], ombres: [THER[2], THER[4], THER[1]], lumieres: 3, ecart: 30, longueur: 0.4, contour: 2 },
      },
      brand(colors) {
        const c = colors.slice(1).length ? colors.slice(1) : ['#111111'];
        return { fond: colors[0], couleurTexte: c[c.length > 1 ? 1 : 0], ombres: c.slice(0, 3) };
      },
      pointer: {
        move: (q) => { hover = { x: q.x, y: q.y }; },
        down: (q) => { drag = { x: q.x, y: q.y, L: p.longueur, moved: false }; },
        drag: (q) => {
          if (!drag) return;
          hover = { x: q.x, y: q.y };
          if (Math.abs(q.y - drag.y) > 6) drag.moved = true;
          if (drag.moved) app.set('longueur', Math.max(0, Math.min(1.2, +(drag.L - (q.y - drag.y) / app.size.h).toFixed(3))));
        },
        up: () => { if (drag && !drag.moved) app.set('mode', p.mode === 'point' ? 'parallele' : 'point'); drag = null; },
        wheel: (q, dy) => app.set('longueur', Math.max(0, Math.min(1.2, +(p.longueur - dy * 0.0008).toFixed(3)))),
      },
      onChange() {},
      export: { name: 'ombres-portees', svg: () => toSVG() },
    });
    const p = app.params;
    canvas.addEventListener('pointerleave', () => { if (!drag) hover = null; });
    if (document.fonts) document.fonts.addEventListener('loadingdone', () => { vecKey = ''; });

    // ——— Marching squares + Douglas-Peucker (contours fermés) ———
    function marching(g, W, H, T) {
      // Arêtes : horizontales (x,y)-(x+1,y) et verticales (x,y)-(x,y+1), identifiées par un entier.
      const hid = (x, y) => (y * W + x) * 2, vid = (x, y) => (y * W + x) * 2 + 1;
      const link = new Map();
      const add = (a, b) => { (link.get(a) || link.set(a, []).get(a)).push(b); (link.get(b) || link.set(b, []).get(b)).push(a); };
      const pos = (id) => {
        const e = id >> 1, x = e % W, y = (e - x) / W;
        if (id & 1) { const a = g[y * W + x], b = g[(y + 1) * W + x]; return [x, y + (T - a) / (b - a || 1e-6)]; }
        const a = g[y * W + x], b = g[y * W + x + 1]; return [x + (T - a) / (b - a || 1e-6), y];
      };
      for (let y = 0; y < H - 1; y++) for (let x = 0; x < W - 1; x++) {
        const a = g[y * W + x] > T, b = g[y * W + x + 1] > T, c = g[(y + 1) * W + x + 1] > T, d = g[(y + 1) * W + x] > T;
        const code = (a << 3) | (b << 2) | (c << 1) | d;
        if (code === 0 || code === 15) continue;
        const t = hid(x, y), bo = hid(x, y + 1), l = vid(x, y), r = vid(x + 1, y);
        const center = (g[y * W + x] + g[y * W + x + 1] + g[(y + 1) * W + x + 1] + g[(y + 1) * W + x]) / 4 > T;
        switch (code) {
          case 1: case 14: add(l, bo); break;
          case 2: case 13: add(bo, r); break;
          case 3: case 12: add(l, r); break;
          case 4: case 11: add(t, r); break;
          case 6: case 9: add(t, bo); break;
          case 7: case 8: add(l, t); break;
          case 5: if (center) { add(l, t); add(bo, r); } else { add(t, r); add(l, bo); } break;
          case 10: if (center) { add(t, r); add(l, bo); } else { add(l, t); add(bo, r); } break;
        }
      }
      const seen = new Set(), loops = [];
      for (const start of link.keys()) {
        if (seen.has(start)) continue;
        const lp = []; let prev = -1, cur = start, guard = 0;
        while (guard++ < 200000) {
          seen.add(cur); const [px, py] = pos(cur); lp.push(px, py);
          const nb = link.get(cur); const nx = nb[0] !== prev ? nb[0] : nb[1];
          if (nx == null || nx === start) break;
          if (seen.has(nx)) break;
          prev = cur; cur = nx;
        }
        if (lp.length >= 8) loops.push(simplify(lp, 0.12));
      }
      return loops;
    }
    // Douglas-Peucker sur une boucle fermée.
    function simplify(lp, eps) {
      const n = lp.length / 2;
      if (n < 6) return lp;
      let far = 0, fd = -1;
      for (let i = 1; i < n; i++) { const d = (lp[i * 2] - lp[0]) ** 2 + (lp[i * 2 + 1] - lp[1]) ** 2; if (d > fd) { fd = d; far = i; } }
      const keep = new Uint8Array(n); keep[0] = keep[far] = 1;
      const stack = [[0, far], [far, n]];
      while (stack.length) {
        const [a, b] = stack.pop();
        if (b - a < 2) continue;
        const ax = lp[a * 2], ay = lp[a * 2 + 1], bx = lp[(b % n) * 2], by = lp[(b % n) * 2 + 1];
        const dx = bx - ax, dy = by - ay, L = Math.hypot(dx, dy) || 1e-9;
        let mi = -1, md = eps;
        for (let i = a + 1; i < b; i++) { const d = Math.abs((lp[i * 2] - ax) * dy - (lp[i * 2 + 1] - ay) * dx) / L; if (d > md) { md = d; mi = i; } }
        if (mi >= 0) { keep[mi] = 1; stack.push([a, mi], [mi, b]); }
      }
      const out = [];
      for (let i = 0; i < n; i++) if (keep[i]) out.push(lp[i * 2], lp[i * 2 + 1]);
      return out;
    }
    function inside(pts, x, y) {
      let c = false;
      for (let i = 0, j = pts.length - 2; i < pts.length; j = i, i += 2) {
        const xi = pts[i], yi = pts[i + 1], xj = pts[j], yj = pts[j + 1];
        if ((yi > y) !== (yj > y) && x < (xj - xi) * (y - yi) / (yj - yi) + xi) c = !c;
      }
      return c;
    }

    // ——— Vectorisation du texte ———
    function family() { return p.police === 'AtelierBrand' ? "'AtelierBrand', sans-serif" : (FONTS[p.police] || FONTS.grotesque); }
    function build(w, h) {
      const key = [p.texte, p.police, p.graisse, p.taille, p.interligne, Math.round(w), Math.round(h)].join('|');
      if (key === vecKey && vec) return vec;
      vecKey = key;
      const lines = String(p.texte || ' ').split('\n');
      // Le masque est calculé à mi-résolution puis remis à l'échelle de la scène.
      const k = 0.5, W = Math.max(8, Math.round(w * k)), H = Math.max(8, Math.round(h * k));
      const c = document.createElement('canvas'); c.width = W; c.height = H;
      const x = c.getContext('2d', { willReadFrequently: true });
      const fam = family(), ref = 100;
      x.font = `${p.graisse} ${ref}px ${fam}`;
      const widest = Math.max(1, ...lines.map((l) => x.measureText(l || ' ').width));
      let fs = (W * p.taille) / widest * ref;
      fs = Math.min(fs, (H * p.taille) / (lines.length * p.interligne));
      x.font = `${p.graisse} ${fs}px ${fam}`; x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillStyle = '#000';
      const lh = fs * p.interligne, y0 = H / 2 - ((lines.length - 1) * lh) / 2;
      lines.forEach((l, i) => x.fillText(l, W / 2, y0 + i * lh + fs * 0.04));
      const d = x.getImageData(0, 0, W, H).data, pad = 2, GW = W + pad * 2, GH = H + pad * 2, g = new Float32Array(GW * GH);
      for (let yy = 0; yy < H; yy++) for (let xx = 0; xx < W; xx++) g[(yy + pad) * GW + xx + pad] = d[(yy * W + xx) * 4 + 3] / 255;
      const loops = marching(g, GW, GH, 0.5).map((lp) => { for (let i = 0; i < lp.length; i += 2) { lp[i] = (lp[i] - pad) / k; lp[i + 1] = (lp[i + 1] - pad) / k; } return lp; });
      // Orientation de chaque boucle (aire signée), inversée pour les trous : sert à garder les arêtes de silhouette.
      const sg = loops.map((lp) => { let a = 0; const n = lp.length / 2; for (let i = 0; i < n; i++) { const j = (i + 1) % n; a += lp[i * 2] * lp[j * 2 + 1] - lp[j * 2] * lp[i * 2 + 1]; } return a >= 0 ? 1 : -1; });
      const hole = loops.map((lp, i) => { let d = 0; for (let j = 0; j < loops.length; j++) if (j !== i && inside(loops[j], lp[0], lp[1])) d++; return d % 2 === 1; });
      vec = { loops, orient: sg.map((s, i) => (hole[i] ? -s : s)) };
      return vec;
    }

    // ——— Lumières et ombres ———
    function lights(w, h, t) {
      const n = Math.round(p.lumieres), out = [];
      const sway = Math.sin(t * p.vitesse * 0.8) * p.orbite * 70 * DEG;
      for (let i = 0; i < n; i++) {
        const off = (i - (n - 1) / 2) * p.ecart * DEG;
        if (p.mode === 'point') {
          let lx, ly;
          if (hover) { lx = hover.x; ly = hover.y; }
          else { const a = t * p.vitesse * 0.5, R = Math.min(w, h) * (0.25 + 0.35 * p.orbite); lx = w / 2 + Math.cos(a) * R * 1.2; ly = h / 2 + Math.sin(a) * R * 0.7; }
          // Plusieurs lumières ponctuelles : écartées autour de la première.
          const r = Math.min(w, h) * 0.08 * i, ra = off * 2;
          out.push({ x: lx + Math.cos(ra) * r, y: ly + Math.sin(ra) * r });
        } else {
          let a = p.angle * DEG + sway;
          if (hover) a = Math.atan2(h / 2 - hover.y, w / 2 - hover.x);
          out.push({ a: a + off });
        }
      }
      return out;
    }
    // Quadrilatères d'ombre d'une lumière, pour une longueur L (px).
    function shadowQuads(loops, L, light, orient) {
      const quads = [];
      loops.forEach((lp, li) => {
        const n = lp.length / 2, o = orient ? orient[li] : 0;
        for (let i = 0; i < n; i++) {
          const j = (i + 1) % n, ax = lp[i * 2], ay = lp[i * 2 + 1], bx = lp[j * 2], by = lp[j * 2 + 1];
          let dax, day, dbx, dby;
          // Seules les arêtes tournées vers l'ombre (normale extérieure dans le sens de la lumière) comptent.
          if (o) {
            const nx = (by - ay) * o, ny = -(bx - ax) * o;
            const dx = light.a != null ? Math.cos(light.a) : (ax + bx) / 2 - light.x, dy = light.a != null ? Math.sin(light.a) : (ay + by) / 2 - light.y;
            if (nx * dx + ny * dy < -1e-6) continue;
          }
          if (light.a != null) { dax = dbx = Math.cos(light.a) * L; day = dby = Math.sin(light.a) * L; }
          else {
            const la = Math.hypot(ax - light.x, ay - light.y) || 1, lb = Math.hypot(bx - light.x, by - light.y) || 1;
            dax = ((ax - light.x) / la) * L; day = ((ay - light.y) / la) * L; dbx = ((bx - light.x) / lb) * L; dby = ((by - light.y) / lb) * L;
          }
          // Deux triangles par arête (une lumière proche peut croiser le quadrilatère) ;
          // orientation commune positive, pour que la règle non nulle fasse l'union.
          const cx = bx + dbx, cy = by + dby, ex = ax + dax, ey = ay + day;
          for (const t of [[ax, ay, bx, by, cx, cy], [ax, ay, cx, cy, ex, ey]]) {
            const s = (t[2] - t[0]) * (t[5] - t[1]) - (t[4] - t[0]) * (t[3] - t[1]);
            if (Math.abs(s) < 1e-3) continue;
            quads.push(s < 0 ? [t[0], t[1], t[4], t[5], t[2], t[3]] : t);
          }
        }
      });
      return quads;
    }
    function mix(a, b, k) {
      const A = parseInt(a.slice(1), 16), B = parseInt(b.slice(1), 16);
      const ch = (s) => Math.round(((A >> s) & 255) * (1 - k) + ((B >> s) & 255) * k).toString(16).padStart(2, '0');
      return '#' + ch(16) + ch(8) + ch(0);
    }

    function scene(pen, w, h, t) {
      const V = build(w, h), Ls = lights(w, h, t), S = Math.min(w, h), steps = Math.round(p.paliers);
      const P = p.ombres && p.ombres.length ? p.ombres : ['#111111'];
      Ls.forEach((light, li) => {
        const col = P[li % P.length];
        pen.group(p.melange);
        // Paliers : du plus long (le plus clair) au plus court (la teinte pleine).
        for (let k = steps; k >= 1; k--) {
          const L = (S * p.longueur * k) / steps, c = steps > 1 ? mix(col, p.fond, ((k - 1) / steps) * 0.75) : col;
          if (L < 0.5) continue;
          pen.quads(shadowQuads(V.loops, L, light, V.orient), c);
        }
        pen.end();
      });
      pen.text(V.loops, p.couleurTexte, p.contour > 0 ? (P[0]) : null, p.contour);
    }

    // ——— Canvas ———
    // Chaque lumière est peinte sur un calque à part (paliers en normal), puis posée en produit ou en normal.
    let layerC = null;
    function canvasPen(main) {
      let c = main, mode = 'source-over';
      return {
        group(m) {
          mode = m;
          if (!layerC) layerC = document.createElement('canvas');
          if (layerC.width !== main.canvas.width || layerC.height !== main.canvas.height) { layerC.width = main.canvas.width; layerC.height = main.canvas.height; }
          c = layerC.getContext('2d'); c.setTransform(1, 0, 0, 1, 0, 0); c.clearRect(0, 0, layerC.width, layerC.height); c.setTransform(main.getTransform());
        },
        end() {
          main.save(); main.setTransform(1, 0, 0, 1, 0, 0); main.globalCompositeOperation = mode; main.drawImage(layerC, 0, 0); main.restore();
          c = main;
        },
        quads(qs, col) { c.fillStyle = col; c.beginPath(); for (const q of qs) { c.moveTo(q[0], q[1]); c.lineTo(q[2], q[3]); c.lineTo(q[4], q[5]); c.closePath(); } c.fill('nonzero'); },
        text(loops, col, ink, lw) {
          c.beginPath(); for (const q of loops) { c.moveTo(q[0], q[1]); for (let i = 2; i < q.length; i += 2) c.lineTo(q[i], q[i + 1]); c.closePath(); }
          c.fillStyle = col; c.fill('evenodd');
          if (ink && lw > 0) { c.strokeStyle = ink; c.lineWidth = lw; c.lineJoin = 'round'; c.stroke(); }
        },
      };
    }
    app.loop((t, dt) => {
      const { w, h, dpr } = app.size;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.globalCompositeOperation = 'source-over';
      ctx.fillStyle = p.fond; ctx.fillRect(0, 0, w, h);
      scene(canvasPen(ctx), w, h, t);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      app.finish(ctx);
    });

    // ——— SVG ———
    function toSVG() {
      const { w, h } = app.size, out = [], f = (v) => Math.round(v * 100) / 100;
      let open = false;
      scene({
        group(mode) { out.push(`<g style="mix-blend-mode:${mode === 'source-over' ? 'normal' : mode}">`); open = true; },
        end() { out.push('</g>'); open = false; },
        quads(qs, col) { let d = ''; for (const q of qs) d += `M${f(q[0])} ${f(q[1])}L${f(q[2])} ${f(q[3])}L${f(q[4])} ${f(q[5])}Z`; out.push(`<path d="${d}" fill="${col}" fill-rule="nonzero"/>`); },
        text(loops, col, ink, lw) {
          let d = ''; for (const q of loops) { d += 'M' + f(q[0]) + ' ' + f(q[1]); for (let i = 2; i < q.length; i += 2) d += 'L' + f(q[i]) + ' ' + f(q[i + 1]); d += 'Z'; }
          out.push(`<path d="${d}" fill="${col}" fill-rule="evenodd"${ink && lw > 0 ? ` stroke="${ink}" stroke-width="${f(lw)}" stroke-linejoin="round"` : ''}/>`);
        },
      }, w, h, app.time || 0);
      return `<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">\n<rect width="100%" height="100%" fill="${p.fond}"/>\n${out.join('\n')}\n</svg>`;
    }
  </script>
</body>
</html>
