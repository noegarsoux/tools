<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Moulinets</title>
  <link rel="stylesheet" href="../../assets/ui/atelier.css">
</head>
<body>
  <canvas></canvas>
  <script src="../../assets/ui/atelier.js"></script>
  <script>
    // Moulinets : un champ de moulinets en papier aux couleurs de la marque. Chacun tourne selon le
    // vent qui passe sur lui ; les rafales traversent le champ comme des vagues, et votre souffle
    // (le pointeur) lance une onde qui se propage de moulinet en moulinet.
    const canvas = document.querySelector('canvas');
    const ctx = canvas.getContext('2d');
    const TAU = Math.PI * 2;
    const PAL = (k) => Atelier.PALETTES[k].colors;
    const BIEN = PAL('biennale'), KB = PAL('kegelbahn'), SALON = PAL('salon'), MENTHE = PAL('menthe'), GLY = PAL('glyphes'), BIT = PAL('bitmap'), PYR = PAL('pyramides'), CODE = PAL('code');

    let wheels = [], wKey = '', time = 0, puffs = [], drag = null, mask = null, maskKey = null, frozen = false;

    const app = Atelier.app({
      stage: canvas,
      animate: true,
      seed: true,
      finish: { grain: 0.05, vignette: 0.2 },
      hint: 'Glissez pour souffler sur les moulinets · touchez pour une bouffée · molette : vent',
      notes: 'Le vent est un champ : un souffle de fond, des rafales qui traversent le champ comme des vagues, et vos bouffées, qui partent du pointeur en anneaux. Chaque moulinet accélère vers la vitesse que lui impose le vent local et ralentit par frottement ; trop vite, ses pales se fondent en un disque flou.',
      params: {
        'Moulinets': {
          disposition: { type: 'select', label: 'Disposition', options: { grille: 'Grille', champ: 'Champ', logo: 'Logo', spirale: 'Spirale' }, value: 'champ' },
          image: { type: 'file', label: 'Logo', accept: 'image/*', show: (q) => q.disposition === 'logo' },
          densite: { type: 'range', label: 'Densité', min: 3, max: 20, step: 1, value: 8 },
          taille: { type: 'range', label: 'Taille', min: 0.4, max: 1.2, step: 0.01, value: 0.85 },
          pales: { type: 'segmented', label: 'Pales', options: { 4: '4', 6: '6', 8: '8' }, value: '4' },
          couleurs: { type: 'palette', label: 'Papiers', value: ['#e5452a', '#f2e640', '#4b6cf0', '#f2b0c8'] },
        },
        'Vent': {
          vent: { type: 'range', label: 'Souffle', min: 0, max: 1, step: 0.01, value: 0.35 },
          rafales: { type: 'range', label: 'Rafales', min: 0, max: 1, step: 0.01, value: 0.6 },
          echelle: { type: 'range', label: 'Largeur des rafales', min: 0.1, max: 1, step: 0.01, value: 0.4 },
          flou: { type: 'range', label: 'Flou de vitesse', min: 0, max: 1, step: 0.01, value: 0.6 },
        },
        'Fond': {
          fond: { type: 'color', label: 'Fond', value: '#f4f3f0' },
          sol: { type: 'color', label: 'Sol', value: '#d9d4c7' },
          tige: { type: 'color', label: 'Tiges', value: '#2a2723' },
        },
      },
      presets: {
        'Champ': {},
        'Grille': { disposition: 'grille', densite: 7, taille: 0.9 },
        'Logo': { disposition: 'logo', densite: 14, taille: 0.95 },
        'Spirale': { disposition: 'spirale', densite: 12, taille: 0.8 },
        'Six pales': { pales: '6', disposition: 'grille', densite: 6 },
        'Tempête': { vent: 0.9, rafales: 1, echelle: 0.25, densite: 10 },
        'Calme': { vent: 0.08, rafales: 0.35, echelle: 0.8 },
        'Biennale': { couleurs: [BIEN[2], BIEN[3], BIEN[4], BIEN[1]], fond: BIEN[0], sol: '#dcd9d2' },
        'Kegelbahn': { couleurs: [KB[1], KB[2], KB[3], KB[5]], fond: KB[0], sol: '#1b1416', tige: '#8a8090', disposition: 'grille' },
        'Salon': { couleurs: [SALON[2], SALON[3], SALON[4]], fond: SALON[0], sol: '#d6d1c6', pales: '8' },
        'Bitmap': { couleurs: [BIT[2], BIT[3], BIT[4]], fond: BIT[0], sol: '#c9c4b6', disposition: 'spirale' },
        'Glyphes': { couleurs: [GLY[2], GLY[3], GLY[4], GLY[5], GLY[6]], fond: GLY[1], sol: '#dcd7cc', densite: 11 },
        'Code': { couleurs: [CODE[1], CODE[2], CODE[3], CODE[4], CODE[5]], fond: CODE[6], sol: '#262626', tige: '#9a9a9a', disposition: 'logo' },
      },
      brand(colors) {
        const lum = (h) => { const n = parseInt(h.slice(1), 16); return ((n >> 16) & 255) * 0.299 + ((n >> 8) & 255) * 0.587 + (n & 255) * 0.114; };
        const all = colors.slice().sort((a, b) => lum(b) - lum(a));
        const dark = lum(all[all.length - 1]) < 80 ? all[all.length - 1] : '#2a2723';
        return { fond: all[0], couleurs: all.slice(1).length ? all.slice(1) : all, tige: dark };
      },
      pointer: {
        down: (q) => { drag = { x: q.x, y: q.y, x0: q.x, y0: q.y, moved: false }; },
        drag: (q) => {
          if (!drag) return;
          const dx = q.x - drag.x, dy = q.y - drag.y, d = Math.hypot(dx, dy);
          if (Math.hypot(q.x - drag.x0, q.y - drag.y0) > 6) drag.moved = true;
          if (d > 4) { puffs.push({ x: q.x, y: q.y, t: 0, k: Math.min(2, d / 20), dir: Math.sign(dx) || 1 }); if (puffs.length > 80) puffs.shift(); drag.x = q.x; drag.y = q.y; }
        },
        up: (q) => { if (drag && !drag.moved) puffs.push({ x: q.x, y: q.y, t: 0, k: 2.5, dir: 1 }); drag = null; },
        wheel: (q, dy) => app.set('vent', Math.max(0, Math.min(1, +(p.vent + (dy > 0 ? -0.05 : 0.05)).toFixed(2)))),
      },
      onChange(k) { if (['disposition', 'image', 'densite', 'taille'].includes(k)) wKey = ''; if (k === 'image') maskKey = null; frozen = false; },
      onSeed() { wKey = ''; frozen = false; },
      export: { name: 'moulinets', svg: () => toSVG() },
    });
    const p = app.params;

    const hex = (h) => { const n = parseInt(h.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; };
    const rgb = (c) => `rgb(${Math.round(c[0])},${Math.round(c[1])},${Math.round(c[2])})`;
    const mixc = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
    function hash(n) { const s = Math.sin(n * 127.1 + app.seed * 0.0131) * 43758.5453; return s - Math.floor(s); }
    function vnoise(x, o) { const i = Math.floor(x), f = x - i, u = f * f * (3 - 2 * f); return hash(i + o) * (1 - u) + hash(i + 1 + o) * u; }
    function noise2(x, y, o) { const iy = Math.floor(y), fy = y - iy, u = fy * fy * (3 - 2 * fy); return vnoise(x + iy * 7.31, o) * (1 - u) + vnoise(x + (iy + 1) * 7.31, o) * u; }

    function logoMask() {
      const img = p.image || app.logoImg, key = img ? (img.src || 'c') : 'demo';
      if (key === maskKey && mask) return mask; maskKey = key;
      const M = 100, c = document.createElement('canvas'); c.width = c.height = M; const x = c.getContext('2d', { willReadFrequently: true });
      if (img) { const iw = img.naturalWidth || img.width, ih = img.naturalHeight || img.height, k = M * 0.96 / Math.max(iw, ih); x.drawImage(img, (M - iw * k) / 2, (M - ih * k) / 2, iw * k, ih * k); }
      else { x.fillStyle = '#000'; x.beginPath(); x.arc(50, 50, 47, 0, TAU); x.arc(50, 50, 25, 0, TAU, true); x.fill('evenodd'); x.fillRect(43, 2, 14, 96); }
      const d = x.getImageData(0, 0, M, M).data, inside = new Uint8Array(M * M);
      let transp = 0; for (let i = 3; i < d.length; i += 16) if (d[i] < 128) transp++;
      const useA = transp > d.length / 16 * 0.05;
      for (let i = 0; i < M * M; i++) { const l = (d[i * 4] * 0.2126 + d[i * 4 + 1] * 0.7152 + d[i * 4 + 2] * 0.0722) / 255; inside[i] = (useA ? d[i * 4 + 3] > 128 : d[i * 4 + 3] > 128 && l < 0.5) ? 1 : 0; }
      mask = { M, inside }; return mask;
    }

    // ——— Disposition ———
    function build() {
      const { w, h } = app.size, key = [w, h, p.disposition, p.densite, p.taille, app.seed, maskKey].join();
      if (key === wKey) return; wKey = key;
      const S = Math.min(w, h), n = p.densite; wheels = [];
      const add = (x, y, R, stick, z) => { const i = wheels.length; wheels.push({ x, y, R, stick, z: z ?? 1, a: hash(i + 1) * TAU, w: 0, ci: Math.floor(hash(i + 2) * 97), spin: hash(i + 3) < 0.5 ? 1 : -1, ph: hash(i + 4) * 10 }); };
      if (p.disposition === 'grille') {
        const cols = n, cw = w / cols, rows = Math.max(1, Math.round(h / cw)), ch = h / rows;
        for (let j = 0; j < rows; j++) for (let i = 0; i < cols; i++) add((i + 0.5) * cw, (j + 0.5) * ch, Math.min(cw, ch) * 0.42 * p.taille, 0);
      } else if (p.disposition === 'champ') {
        // rangées en perspective : plus petites et plus serrées vers l'horizon
        const hor = h * 0.42, rows = Math.max(3, Math.round(n * 0.8));
        for (let j = 0; j < rows; j++) {
          const t = (j + 0.5) / rows, z = 0.25 + 0.75 * Math.pow(t, 1.3), yb = hor + (h * 1.02 - hor) * Math.pow(t, 1.2), R = S * 0.06 * z * p.taille * (10 / n) ** 0.7, cols = Math.ceil(w / (R * 3.2)) + 1, off = (j % 2) * 0.5;
          for (let i = 0; i < cols; i++) { const x = (i + off + (hash(j * 31 + i) - 0.5) * 0.4) * (w / (cols - 1)), st = R * (3.2 + hash(j * 17 + i) * 1.5); add(x, yb - st, R, st, z); }
        }
      } else if (p.disposition === 'spirale') {
        const N = Math.round(n * n * 0.9), ga = Math.PI * (3 - Math.sqrt(5)), Rmax = S * 0.47;
        for (let i = 0; i < N; i++) { const r = Rmax * Math.sqrt((i + 0.5) / N), a = i * ga; add(w / 2 + Math.cos(a) * r, h / 2 + Math.sin(a) * r, Rmax / Math.sqrt(N) * 0.85 * p.taille * (0.7 + 0.5 * r / Rmax), 0); }
      } else {
        const m = logoMask(), L = Math.min(w, h) * 0.92, step = L / n / 1.25;
        for (let y = 0; y < L; y += step) for (let x = 0; x < L; x += step) { const xx = x + ((Math.round(y / step) % 2) * step) / 2, u = Math.floor(xx / L * m.M), v = Math.floor(y / L * m.M); if (u < m.M && m.inside[v * m.M + u]) add((w - L) / 2 + xx + step / 2, (h - L) / 2 + y + step / 2, step * 0.5 * p.taille, 0); }
      }
      wheels.sort((a, b) => (a.y + a.stick) - (b.y + b.stick));
    }
    // vent local : souffle, rafales qui défilent, bouffées en anneaux
    function windAt(x, y) {
      const { w, h } = app.size, S = Math.min(w, h), sc = S * p.echelle;
      const g = noise2(x / sc - time * 0.5, y / sc * 0.7, 40), g2 = noise2(x / (sc * 0.4) - time * 1.1, y / (sc * 0.4), 80);
      let v = p.vent * (0.5 + 0.5 * vnoise(time * 0.2, 9)) + p.rafales * Math.max(0, (g * 0.75 + g2 * 0.25) - 0.35) * 1.8;
      for (const pf of puffs) { const r = pf.t * S * 0.9, d = Math.hypot(x - pf.x, y - pf.y), band = Math.exp(-((d - r) ** 2) / (S * S * 0.006)); v += pf.k * band * Math.exp(-pf.t * 1.5) * (1 + 1 / (1 + d / (S * 0.05))); }
      return v;
    }
    function step(dt) {
      time += dt;
      for (const pf of puffs) pf.t += dt; puffs = puffs.filter((pf) => pf.t < 2.5);
      for (const wh of wheels) {
        const v = windAt(wh.x, wh.y), target = v * 26 * wh.spin / Math.max(0.6, wh.R / 30);
        wh.w += (target - wh.w) * Math.min(1, dt * 2.2) - wh.w * dt * 0.1;
        wh.a += wh.w * dt;
      }
    }

    // ——— Dessin d'un moulinet ———
    function colorsFor(wh) { const cols = p.couleurs.length ? p.couleurs : ['#e5452a']; return [cols[wh.ci % cols.length], cols[(wh.ci + 1) % cols.length]]; }
    // pale d'un moulinet plié : arête droite du centre au coin, bord extérieur courbe qui revient vers le centre
    function bladeGeo(R, k, nb) {
      const span = TAU / nb, a0 = k * span, P = [Math.cos(a0) * R, Math.sin(a0) * R];
      const C1 = [Math.cos(a0 + span * 0.5) * R * 1.02, Math.sin(a0 + span * 0.5) * R * 1.02], Q = [Math.cos(a0 + span * 0.88) * R * 0.16, Math.sin(a0 + span * 0.88) * R * 0.16];
      const F = [Math.cos(a0 + span * 0.28) * R * 0.55, Math.sin(a0 + span * 0.28) * R * 0.55];
      return { P, C1, Q, F };
    }
    function drawWheel(x, wh, light) {
      const nb = +p.pales, [c1, c2] = colorsFor(wh), R = wh.R, sp = Math.abs(wh.w);
      // tige
      if (wh.stick > 0) { x.strokeStyle = p.tige; x.lineWidth = Math.max(1, R * 0.07); x.lineCap = 'round'; x.beginPath(); x.moveTo(wh.x, wh.y); x.lineTo(wh.x + R * 0.05, wh.y + wh.stick); x.stroke(); }
      x.save(); x.translate(wh.x, wh.y);
      const blur = Math.min(1, Math.max(0, (sp - 8) / 30)) * p.flou;
      const passes = blur > 0.2 ? 3 : 1;
      // ombre portée : la silhouette des pales, décalée
      x.save(); x.translate(R * 0.07, R * 0.1); x.rotate(wh.a); x.fillStyle = `rgba(0,0,0,${0.1 - 0.05 * blur})`; x.beginPath();
      for (let k = 0; k < nb; k++) { const g = bladeGeo(R, k, nb); x.moveTo(0, 0); x.lineTo(g.P[0], g.P[1]); x.quadraticCurveTo(g.C1[0], g.C1[1], g.Q[0], g.Q[1]); x.closePath(); }
      x.fill(); x.restore();
      for (let s = 0; s < passes; s++) {
        x.save(); x.rotate(wh.a - (passes > 1 ? s * Math.min(0.45, sp * 0.007) * Math.sign(wh.w) : 0));
        x.globalAlpha = passes > 1 ? (s === 0 ? 0.75 : 0.4) : 1;
        for (let k = 0; k < nb; k++) {
          const g = bladeGeo(R, k, nb), ang = wh.a + (k + 0.4) / nb * TAU, sh = 0.8 + 0.2 * Math.cos(ang - light), ca = hex(k % 2 ? c2 : c1), cb = hex(k % 2 ? c1 : c2);
          x.beginPath(); x.moveTo(0, 0); x.lineTo(g.P[0], g.P[1]); x.quadraticCurveTo(g.C1[0], g.C1[1], g.Q[0], g.Q[1]); x.closePath();
          x.fillStyle = rgb(mixc(ca, [0, 0, 0], 1 - sh)); x.fill();
          // revers du papier, visible le long de la découpe, plus clair
          x.beginPath(); x.moveTo(0, 0); x.lineTo(g.P[0], g.P[1]); x.quadraticCurveTo(g.F[0] * 1.2, g.F[1] * 1.2, g.Q[0] * 0.4, g.Q[1] * 0.4); x.closePath();
          x.fillStyle = rgb(mixc(cb, [255, 255, 255], 0.25 + 0.2 * sh)); x.fill();
        }
        x.restore();
      }
      x.globalAlpha = 1;
      // épingle
      x.fillStyle = p.tige; x.beginPath(); x.arc(0, 0, Math.max(1.5, R * 0.08), 0, TAU); x.fill();
      x.fillStyle = 'rgba(255,255,255,0.5)'; x.beginPath(); x.arc(-R * 0.022, -R * 0.026, Math.max(0.6, R * 0.028), 0, TAU); x.fill();
      x.restore();
    }

    app.loop((tt, dt) => {
      const { w, h, dpr } = app.size;
      dt = Math.min(1 / 30, dt || 0);
      build();
      if (app.thumbnail) { if (!frozen) { for (let i = 0; i < 60 * 5; i++) step(1 / 60); frozen = true; } }
      else step(dt);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.globalAlpha = 1;
      ctx.fillStyle = p.fond; ctx.fillRect(0, 0, w, h);
      if (p.disposition === 'champ') {
        const hor = h * 0.42, g = ctx.createLinearGradient(0, hor, 0, h); g.addColorStop(0, rgb(mixc(hex(p.sol), hex(p.fond), 0.5))); g.addColorStop(1, p.sol);
        ctx.fillStyle = g; ctx.fillRect(0, hor, w, h - hor);
      }
      const light = -2.2;
      for (const wh of wheels) drawWheel(ctx, wh, light);
      app.finish(ctx);
    });

    function toSVG() {
      const { w, h } = app.size, f = (v) => v.toFixed(1), out = [], nb = +p.pales, light = -2.2;
      out.push(`<rect width="100%" height="100%" fill="${p.fond}"/>`);
      if (p.disposition === 'champ') out.push(`<defs><linearGradient id="sol" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${rgb(mixc(hex(p.sol), hex(p.fond), 0.5))}"/><stop offset="1" stop-color="${p.sol}"/></linearGradient></defs><rect x="0" y="${f(h * 0.42)}" width="${w}" height="${f(h * 0.58)}" fill="url(#sol)"/>`);
      for (const wh of wheels) {
        const [c1, c2] = colorsFor(wh), R = wh.R;
        if (wh.stick > 0) out.push(`<line x1="${f(wh.x)}" y1="${f(wh.y)}" x2="${f(wh.x + R * 0.05)}" y2="${f(wh.y + wh.stick)}" stroke="${p.tige}" stroke-width="${f(Math.max(1, R * 0.08))}" stroke-linecap="round"/>`);
        let g = `<g transform="translate(${f(wh.x)} ${f(wh.y)})"><g transform="rotate(${f(wh.a * 180 / Math.PI)})">`;
        for (let k = 0; k < nb; k++) {
          const gg = bladeGeo(R, k, nb), ang = wh.a + (k + 0.4) / nb * TAU, sh = 0.8 + 0.2 * Math.cos(ang - light);
          g += `<path d="M0 0L${f(gg.P[0])} ${f(gg.P[1])}Q${f(gg.C1[0])} ${f(gg.C1[1])} ${f(gg.Q[0])} ${f(gg.Q[1])}Z" fill="${rgb(mixc(hex(k % 2 ? c2 : c1), [0, 0, 0], 1 - sh))}"/>`;
          g += `<path d="M0 0L${f(gg.P[0])} ${f(gg.P[1])}Q${f(gg.F[0] * 1.2)} ${f(gg.F[1] * 1.2)} ${f(gg.Q[0] * 0.4)} ${f(gg.Q[1] * 0.4)}Z" fill="${rgb(mixc(hex(k % 2 ? c1 : c2), [255, 255, 255], 0.25 + 0.2 * sh))}"/>`;
        }
        g += `</g><circle r="${f(Math.max(1.5, R * 0.09))}" fill="${p.tige}"/></g>`;
        out.push(g);
      }
      return `<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">\n${out.join('\n')}\n</svg>`;
    }
  </script>
</body>
</html>
