<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Globe de points</title>
  <link rel="stylesheet" href="../../assets/ui/atelier.css">
</head>
<body>
  <canvas></canvas>
  <script src="../../assets/ui/atelier.js"></script>
  <script>
    // Globe de points : N points répartis presque également sur la sphère par la spirale de Fibonacci (chaque point
    // tourne de l'angle d'or autour de l'axe en descendant d'un cran). Un bruit 3D décide des terres et des mers ;
    // la taille des points suit l'éclairage, comme une trame d'imprimerie. Des arcs de grand cercle relient des
    // points des terres, parcourus par des impulsions. Le logo est un décalque posé sur la sphère.
    const canvas = document.querySelector('canvas');
    const ctx = canvas.getContext('2d');
    const TAU = Math.PI * 2, GOLD = Math.PI * (3 - Math.sqrt(5));
    const PAL = (k) => Atelier.PALETTES[k].colors;
    const BIEN = PAL('biennale'), GLY = PAL('glyphes'), SAL = PAL('salon'), MEN = PAL('menthe'), KB = PAL('kegelbahn');

    let PX = null, PY = null, PZ = null, KIND = null, ptsKey = '', arcs = [], yawU = 0, tiltU = 0, held = null, simT = 0;
    let logoMask = null, LM = 256, logoKey = '';

    const app = Atelier.app({
      stage: canvas,
      animate: true,
      seed: true,
      finish: { grain: 0.03, vignette: 0.14 },
      hint: 'Glissez pour faire tourner le globe · molette : nombre de points',
      notes: 'Placer N points également répartis sur une sphère est un problème sans solution exacte ; la spirale de Fibonacci en donne une excellente approximation : chaque point descend d\'un cran en latitude et tourne de l\'angle d\'or, 137,5°, autour de l\'axe. Un bruit en trois dimensions, lu à la surface, dessine des continents imaginaires, différents à chaque graine. La taille des points suit l\'éclairage, comme une trame de journal : gros au soleil, minuscules au crépuscule. Les arcs suivent des grands cercles, le plus court chemin sur la sphère, soulevés comme des trajectoires de vol.',
      params: {
        'Globe': {
          points: { type: 'range', label: 'Points', min: 500, max: 24000, step: 100, value: 7000 },
          terres: { type: 'segmented', label: 'Surface', options: { terres: 'Continents', bandes: 'Bandes', uni: 'Uni' }, value: 'terres' },
          niveau: { type: 'range', label: 'Niveau des mers', min: -0.5, max: 0.5, step: 0.01, value: 0.05, show: (q) => q.terres === 'terres' },
          echelle: { type: 'range', label: 'Taille des continents', min: 0.5, max: 4, step: 0.05, value: 1.6, show: (q) => q.terres !== 'uni' },
          forme: { type: 'segmented', label: 'Point', options: { rond: 'Rond', tiret: 'Tiret', carre: 'Carré' }, value: 'rond' },
          taille: { type: 'range', label: 'Taille des points', min: 0.2, max: 1.6, step: 0.01, value: 0.8 },
          mers: { type: 'range', label: 'Points des mers', min: 0, max: 1, step: 0.01, value: 0.35 },
        },
        'Lumière': {
          lumiere: { type: 'range', label: 'Direction', min: -180, max: 180, step: 1, value: -40 },
          contraste: { type: 'range', label: 'Trame (contraste)', min: 0, max: 1, step: 0.01, value: 0.6 },
          dos: { type: 'range', label: 'Face cachée', min: 0, max: 1, step: 0.01, value: 0.12 },
          halo: { type: 'range', label: 'Halo', min: 0, max: 1, step: 0.01, value: 0.4 },
        },
        'Mouvement': {
          rotation: { type: 'range', label: 'Rotation (°/s)', min: -40, max: 40, step: 0.5, value: 8 },
          inclinaison: { type: 'range', label: 'Inclinaison de l\'axe', min: -60, max: 60, step: 1, value: 18 },
          arcs: { type: 'range', label: 'Arcs', min: 0, max: 60, step: 1, value: 14 },
          altitude: { type: 'range', label: 'Hauteur des arcs', min: 0, max: 0.6, step: 0.01, value: 0.18 },
          pulsation: { type: 'range', label: 'Vitesse des impulsions', min: 0, max: 2, step: 0.01, value: 0.45 },
        },
        'Logo sur le globe': {
          logo: { type: 'toggle', label: 'Logo en décalque', value: false },
          tailleLogo: { type: 'range', label: 'Taille', min: 0.15, max: 1.3, step: 0.01, value: 0.7, show: (q) => q.logo },
          image: { type: 'file', label: 'Logo', accept: 'image/*', show: (q) => q.logo },
        },
        'Couleurs': {
          fond: { type: 'color', label: 'Fond', value: '#0b0d14' },
          couleurs: { type: 'palette', label: 'Mers puis terres', value: ['#2a3a6a', '#486cfc', '#7fe0c2', '#f4f1ea'] },
          accent: { type: 'color', label: 'Arcs et logo', value: '#ef5a2f' },
        },
      },
      presets: {
        'Planète': {},
        'Trame': { terres: 'terres', points: 14000, taille: 1, contraste: 1, mers: 0, couleurs: ['#1b1b1f', '#f4f1ea'], fond: '#0d0d0f', arcs: 0, halo: 0.2, dos: 0 },
        'Trafic': { points: 9000, couleurs: ['#1d2233', '#3a4466', '#5a6488'], accent: '#edd14b', arcs: 40, altitude: 0.28, pulsation: 0.8, contraste: 0.3, halo: 0.5 },
        'Bandes': { terres: 'bandes', echelle: 2.5, points: 8000, couleurs: ['#ef5a2f', '#edd14b', '#f272ba', '#486cfc'], forme: 'tiret', taille: 0.9, arcs: 0, mers: 1, inclinaison: 28 },
        'Pixel': { forme: 'carre', points: 4000, taille: 1, couleurs: ['#202634', '#7fe0c2', '#edd14b'], contraste: 0.2, arcs: 8 },
        'Logo': { logo: true, terres: 'uni', points: 10000, taille: 1.1, couleurs: ['#4a4a56', '#4a4a56'], accent: '#ef5a2f', mers: 1, arcs: 0, tailleLogo: 0.9, contraste: 0.45, rotation: 6 },
        'Biennale': { fond: BIEN[0], couleurs: [BIEN[1], BIEN[2], BIEN[3]], accent: BIEN[4], halo: 0, dos: 0.08, points: 8000 },
        'Menthe': { fond: MEN[1], couleurs: [MEN[2], MEN[3], MEN[0]], accent: MEN[0], forme: 'tiret', arcs: 10 },
        'Kegelbahn': { fond: KB[0], couleurs: [KB[1], KB[2]], accent: KB[2], terres: 'bandes', forme: 'carre', points: 5000 },
      },
      brand(colors) {
        const s = colors.slice().sort((a, b) => lum(a) - lum(b)), rest = s.slice(1);
        return { fond: s[0], couleurs: rest.length ? rest : ['#ffffff'], accent: s[s.length - 1] };
      },
      pointer: {
        down: (q) => { held = { x: q.x, y: q.y, yaw: yawU, tilt: tiltU }; },
        drag: (q) => { if (!held) return; yawU = held.yaw + (q.x - held.x) / app.size.w * TAU * 0.7; tiltU = Math.max(-1.2, Math.min(1.2, held.tilt + (q.y - held.y) / app.size.h * Math.PI * 0.7)); },
        up: () => { held = null; },
        wheel: (q, dy) => app.set('points', Math.max(500, Math.min(24000, p.points + (dy > 0 ? -300 : 300)))),
      },
      onChange(k) {
        if (['*', 'points', 'terres', 'niveau', 'echelle', 'arcs'].includes(k)) ptsKey = '';
        if (k === 'image' || k === 'logo' || k === '*') logoKey = '';
      },
      onSeed() { ptsKey = ''; },
      export: { name: 'globe', svg: () => toSVG() },
    });
    const p = app.params;

    function hex(x) { const n = parseInt(x.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
    function lum(x) { const c = hex(x); return (c[0] * 0.299 + c[1] * 0.587 + c[2] * 0.114) / 255; }
    function mix(a, b, t) { const A = hex(a), B = hex(b); return '#' + A.map((v, i) => Math.round(v + (B[i] - v) * t).toString(16).padStart(2, '0')).join(''); }

    // ——— Bruit de valeur 3D (réseau haché, interpolation douce) ———
    let perm = null;
    function noiseSeed(rng) { perm = new Uint8Array(512); const a = Array.from({ length: 256 }, (_, i) => i); for (let i = 255; i > 0; i--) { const j = (rng() * (i + 1)) | 0; [a[i], a[j]] = [a[j], a[i]]; } for (let i = 0; i < 512; i++) perm[i] = a[i & 255]; }
    const hsh = (x, y, z) => perm[(perm[(perm[x & 255] + y) & 255] + z) & 255] / 255;
    function vnoise(x, y, z) {
      const xi = Math.floor(x), yi = Math.floor(y), zi = Math.floor(z), xf = x - xi, yf = y - yi, zf = z - zi;
      const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf), w = zf * zf * (3 - 2 * zf), L = (a, b, t) => a + (b - a) * t;
      return L(L(L(hsh(xi, yi, zi), hsh(xi + 1, yi, zi), u), L(hsh(xi, yi + 1, zi), hsh(xi + 1, yi + 1, zi), u), v), L(L(hsh(xi, yi, zi + 1), hsh(xi + 1, yi, zi + 1), u), L(hsh(xi, yi + 1, zi + 1), hsh(xi + 1, yi + 1, zi + 1), u), v), w) * 2 - 1;
    }
    const fbm = (x, y, z) => vnoise(x, y, z) * 0.55 + vnoise(x * 2.1 + 7, y * 2.1, z * 2.1) * 0.28 + vnoise(x * 4.3, y * 4.3 + 3, z * 4.3) * 0.17;

    // ——— Points : spirale de Fibonacci, catégorie (0 mer, 1.. terres) ———
    function buildPoints() {
      const key = [p.points, p.terres, p.niveau, p.echelle, p.arcs].join(); if (key === ptsKey && PX) return; ptsKey = key;
      const n = p.points, rng = app.rng(); noiseSeed(rng);
      PX = new Float32Array(n); PY = new Float32Array(n); PZ = new Float32Array(n); KIND = new Float32Array(n);
      const off = [rng() * 50, rng() * 50, rng() * 50];
      for (let i = 0; i < n; i++) {
        const y = 1 - (i + 0.5) / n * 2, r = Math.sqrt(1 - y * y), a = i * GOLD;
        PX[i] = Math.cos(a) * r; PY[i] = y; PZ[i] = Math.sin(a) * r;
        if (p.terres === 'uni') KIND[i] = 1;
        else if (p.terres === 'bandes') { const v = (y * p.echelle * 2 + fbm(PX[i] * 1.5 + off[0], y * 1.5, PZ[i] * 1.5) * 0.6 + 8) % 1; KIND[i] = 0.001 + v; }
        else { const v = fbm(PX[i] * p.echelle + off[0], y * p.echelle + off[1], PZ[i] * p.echelle + off[2]); KIND[i] = v > p.niveau ? Math.min(1, (v - p.niveau) / 0.35) + 0.001 : 0; }
      }
      // arcs entre points des terres (ou n'importe où)
      arcs = []; const land = []; for (let i = 0; i < n; i += 3) if (KIND[i] > 0) land.push(i);
      const pool = land.length > 10 ? land : Array.from({ length: n }, (_, i) => i);
      for (let k = 0; k < p.arcs; k++) {
        const a = pool[(rng() * pool.length) | 0]; let b = a, tries = 0;
        while (tries++ < 30) { b = pool[(rng() * pool.length) | 0]; const d = PX[a] * PX[b] + PY[a] * PY[b] + PZ[a] * PZ[b]; if (d < 0.75 && d > -0.6) break; }
        arcs.push({ a, b, ph: rng(), sp: 0.6 + rng() * 0.8 });
      }
    }

    // ——— Logo : un masque carré, posé en projection gnomonique autour d'un point de la sphère ———
    function buildLogo() {
      const img0 = p.image || app.logoImg, key = img0 ? (img0.src || 'c') : 'demo'; if (key === logoKey && logoMask) return; logoKey = key;
      const c = document.createElement('canvas'); c.width = c.height = LM; const x = c.getContext('2d', { willReadFrequently: true });
      const L = LM * 0.96, cx = LM / 2;
      if (img0) { const iw = img0.naturalWidth || img0.width, ih = img0.naturalHeight || img0.height, s = L / Math.max(iw, ih); x.drawImage(img0, cx - iw * s / 2, cx - ih * s / 2, iw * s, ih * s); }
      else { x.fillStyle = '#000'; x.beginPath(); x.arc(cx, cx, L * 0.48, 0, TAU); x.arc(cx, cx, L * 0.27, 0, TAU, true); x.fill('evenodd'); x.fillRect(cx - L * 0.07, cx - L * 0.5, L * 0.14, L); }
      const N = LM * LM, d = x.getImageData(0, 0, LM, LM).data; let transp = 0; for (let i = 3; i < d.length; i += 4) if (d[i] < 128) transp++;
      const useA = transp > N * 0.05; logoMask = new Uint8Array(N);
      for (let i = 0; i < N; i++) { const l = (d[i * 4] * 0.2126 + d[i * 4 + 1] * 0.7152 + d[i * 4 + 2] * 0.0722) / 255; logoMask[i] = (useA ? d[i * 4 + 3] > 128 : d[i * 4 + 3] > 128 && l < 0.5) ? 1 : 0; }
    }
    // décalque posé face à l'observateur au départ (sa latitude compense l'inclinaison de l'axe)
    function inLogo(x, y, z) {
      const la = p.inclinaison * Math.PI / 180, cx = 0, cy = Math.sin(la), cz = Math.cos(la), d = x * cx + y * cy + z * cz; if (d < 0.2) return false;
      const ex = 1, ey = 0, ez = 0, nx = 0, ny = Math.cos(la), nz = -Math.sin(la);
      const u = (x * ex + y * ey + z * ez) / d, v = (x * nx + y * ny + z * nz) / d, s = Math.tan(p.tailleLogo / 2);
      const i = Math.floor((u / s * 0.5 + 0.5) * LM), j = Math.floor((v / s * 0.5 + 0.5) * LM);
      return i >= 0 && j >= 0 && i < LM && j < LM && logoMask[j * LM + i] === 1;
    }

    // ——— Projection et rendu ———
    function view(w, h, t) {
      const yaw = t * p.rotation * Math.PI / 180 + yawU, tilt = p.inclinaison * Math.PI / 180 + tiltU, R = Math.min(w, h) * 0.38;
      const cY = Math.cos(yaw), sY = Math.sin(yaw), cT = Math.cos(tilt), sT = Math.sin(tilt);
      // repère : x à droite, y vers le bas à l'écran, z vers l'observateur
      const rot = (x, y, z) => { const x1 = x * cY + z * sY, z1 = -x * sY + z * cY; const y2 = y * cT - z1 * sT, z2 = y * sT + z1 * cT; return [x1, y2, z2]; };
      const la = p.lumiere * Math.PI / 180, L = [Math.cos(la) * 0.75, -0.45, Math.sin(la) * 0.2 + 0.6]; const ln = Math.hypot(...L); L[0] /= ln; L[1] /= ln; L[2] /= ln;
      return { rot, R, cx: w / 2, cy: h / 2, L };
    }
    function scene(w, h, t) {
      buildPoints(); if (p.logo) buildLogo();
      const V = view(w, h, t), n = PX.length, C = p.couleurs.length ? p.couleurs : ['#ffffff'], spacing = V.R * Math.sqrt(4 * Math.PI / n);
      const back = [], groups = new Map(), acc = [];
      const add = (col, x, y, r, ang) => { let G = groups.get(col); if (!G) groups.set(col, (G = [])); G.push(x, y, r, ang); };
      const colCache = new Map(); const colorFor = (k) => { if (C.length === 1) return C[0]; if (k <= 0) return C[0]; const land = C.length > 1 ? C.slice(1) : C, u = Math.min(0.999, k) * (land.length - 1); if (land.length === 1) return land[0]; const i = Math.floor(u), q = Math.round((u - i) * 6) / 6, key = i * 10 + q; let c = colCache.get(key); if (!c) colCache.set(key, (c = mix(land[i], land[i + 1], q))); return c; };
      for (let i = 0; i < n; i++) {
        const [x, y, z] = V.rot(PX[i], PY[i], PZ[i]), k = KIND[i], logo = p.logo && logoMask && inLogo(PX[i], PY[i], PZ[i]);
        const sea = k <= 0 && !logo; if (sea && p.mers <= 0) continue;
        const sx = V.cx + x * V.R, sy = V.cy + y * V.R;
        if (z < 0) { if (p.dos > 0 && !sea) back.push(sx, sy); continue; }
        const lam = Math.max(0, x * V.L[0] + y * V.L[1] + z * V.L[2]), shade = 1 - p.contraste + p.contraste * Math.sqrt(lam);
        const r = spacing * 0.42 * p.taille * shade * (sea ? Math.sqrt(p.mers) * 0.8 : 1) * (0.35 + 0.65 * Math.sqrt(z));
        if (r < 0.15) continue;
        // orientation des tirets : le long des parallèles projetés
        const e = p.forme === 'tiret' ? V.rot(-PZ[i], 0, PX[i]) : null, ang = e ? Math.atan2(e[1], e[0]) : 0;
        add(logo ? p.accent : colorFor(k), sx, sy, r, ang);
      }
      // arcs : grands cercles soulevés
      const arcPaths = [];
      if (p.arcs > 0) for (const A of arcs) {
        const a = [PX[A.a], PY[A.a], PZ[A.a]], b = [PX[A.b], PY[A.b], PZ[A.b]], om = Math.acos(Math.max(-1, Math.min(1, a[0] * b[0] + a[1] * b[1] + a[2] * b[2]))), so = Math.sin(om) || 1e-6;
        const S = 48, pts = [];
        for (let s = 0; s <= S; s++) {
          const u = s / S, ka = Math.sin((1 - u) * om) / so, kb = Math.sin(u * om) / so, lift = 1 + p.altitude * Math.sin(Math.PI * u) * om / 2;
          const [x, y, z] = V.rot((a[0] * ka + b[0] * kb) * lift, (a[1] * ka + b[1] * kb) * lift, (a[2] * ka + b[2] * kb) * lift);
          const vis = z > 0 || x * x + y * y > 1; pts.push(V.cx + x * V.R, V.cy + y * V.R, vis ? 1 : 0);
        }
        const head = ((t * p.pulsation * A.sp + A.ph) % 1.6) / 1.2;
        arcPaths.push({ pts, head });
      }
      return { back, groups, arcPaths, V, spacing };
    }

    function drawShape(P2, x, y, r, ang) {
      if (p.forme === 'rond') { P2.moveTo(x + r, y); P2.arc(x, y, r, 0, TAU); }
      else if (p.forme === 'carre') P2.rect(x - r * 0.9, y - r * 0.9, r * 1.8, r * 1.8);
      else { const c = Math.cos(ang) * r * 1.6, s = Math.sin(ang) * r * 1.6; P2.moveTo(x - c, y - s); P2.lineTo(x + c, y + s); }
    }

    app.loop((t, dt) => {
      dt = Math.min(0.1, dt || 0);
      if (!app.thumbnail && !held) simT += dt;
      const { w, h, dpr } = app.size;
      const S = scene(w, h, simT), V = S.V;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.fillStyle = p.fond; ctx.fillRect(0, 0, w, h);
      // halo
      if (p.halo > 0) {
        const C = p.couleurs[1] || p.couleurs[0] || '#ffffff', g = ctx.createRadialGradient(V.cx, V.cy, V.R * 0.92, V.cx, V.cy, V.R * (1.25 + p.halo * 0.4)), [r, gg, b] = hex(C);
        g.addColorStop(0, `rgba(${r},${gg},${b},${0.28 * p.halo})`); g.addColorStop(1, `rgba(${r},${gg},${b},0)`);
        ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
      }
      // face cachée, à peine
      if (S.back.length) { ctx.globalAlpha = p.dos; ctx.fillStyle = p.couleurs[p.couleurs.length - 1] || '#fff'; const P2 = new Path2D(), r = Math.max(0.5, S.spacing * 0.12); for (let i = 0; i < S.back.length; i += 2) { P2.moveTo(S.back[i] + r, S.back[i + 1]); P2.arc(S.back[i], S.back[i + 1], r, 0, TAU); } ctx.fill(P2); ctx.globalAlpha = 1; }
      // arcs : partie cachée exclue, traînée faible et impulsion
      drawArcs(ctx);
      for (const [col, G] of S.groups) {
        const P2 = new Path2D(); for (let i = 0; i < G.length; i += 4) drawShape(P2, G[i], G[i + 1], G[i + 2], G[i + 3]);
        if (p.forme === 'tiret') { ctx.strokeStyle = col; ctx.lineCap = 'round'; ctx.lineWidth = Math.max(0.6, S.spacing * 0.28 * p.taille); ctx.stroke(P2); } else { ctx.fillStyle = col; ctx.fill(P2); }
      }
      drawArcs(ctx, true);
      app.finish(ctx);
      function drawArcs(c, front) {
        if (!S.arcPaths.length) return;
        c.lineCap = 'round';
        for (const A of S.arcPaths) {
          const P = A.pts, n = P.length / 3;
          // trace complète faible (dessous), impulsion vive (dessus)
          if (!front) {
            c.globalAlpha = 0.35; c.strokeStyle = p.accent; c.lineWidth = 1; c.beginPath(); let pen = false;
            for (let k = 0; k < n; k++) { if (P[k * 3 + 2]) { if (pen) c.lineTo(P[k * 3], P[k * 3 + 1]); else c.moveTo(P[k * 3], P[k * 3 + 1]); pen = true; } else pen = false; }
            c.stroke(); c.globalAlpha = 1;
          } else if (A.head >= 0 && A.head <= 1) {
            const k1 = Math.round(A.head * (n - 1)), k0 = Math.max(0, k1 - 8);
            c.strokeStyle = p.accent; c.lineWidth = 2.2; c.beginPath(); let pen = false;
            for (let k = k0; k <= k1; k++) { if (P[k * 3 + 2]) { if (pen) c.lineTo(P[k * 3], P[k * 3 + 1]); else c.moveTo(P[k * 3], P[k * 3 + 1]); pen = true; } else pen = false; }
            c.stroke();
            if (P[k1 * 3 + 2]) { c.fillStyle = p.accent; c.beginPath(); c.arc(P[k1 * 3], P[k1 * 3 + 1], 2.6, 0, TAU); c.fill(); }
          }
        }
      }
    });

    function toSVG() {
      const { w, h } = app.size, f = (v) => +v.toFixed(2), S = scene(w, h, simT), V = S.V;
      let s = `<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><rect width="100%" height="100%" fill="${p.fond}"/>`;
      if (p.halo > 0) { const C = p.couleurs[1] || p.couleurs[0] || '#ffffff'; s += `<defs><radialGradient id="halo" gradientUnits="userSpaceOnUse" cx="${f(V.cx)}" cy="${f(V.cy)}" r="${f(V.R * (1.25 + p.halo * 0.4))}"><stop offset="${f(0.92 / (1.25 + p.halo * 0.4))}" stop-color="${C}" stop-opacity="${f(0.28 * p.halo)}"/><stop offset="1" stop-color="${C}" stop-opacity="0"/></radialGradient></defs><rect width="100%" height="100%" fill="url(#halo)"/>`; }
      if (S.back.length) { const r = Math.max(0.5, S.spacing * 0.12); let d = ''; for (let i = 0; i < S.back.length; i += 2) d += `M${f(S.back[i] - r)} ${f(S.back[i + 1])}a${f(r)} ${f(r)} 0 1 0 ${f(2 * r)} 0a${f(r)} ${f(r)} 0 1 0 ${f(-2 * r)} 0z`; s += `<path d="${d}" fill="${p.couleurs[p.couleurs.length - 1] || '#fff'}" fill-opacity="${f(p.dos)}"/>`; }
      const arcD = (front) => {
        let d = '';
        for (const A of S.arcPaths) {
          const P = A.pts, n = P.length / 3; let k0 = 0, k1 = n - 1;
          if (front) { if (A.head < 0 || A.head > 1) continue; k1 = Math.round(A.head * (n - 1)); k0 = Math.max(0, k1 - 8); }
          let pen = false; for (let k = k0; k <= k1; k++) { if (P[k * 3 + 2]) { d += `${pen ? 'L' : 'M'}${f(P[k * 3])} ${f(P[k * 3 + 1])}`; pen = true; } else pen = false; }
        }
        return d;
      };
      if (S.arcPaths.length) s += `<path d="${arcD(false)}" fill="none" stroke="${p.accent}" stroke-width="1" stroke-opacity="0.35" stroke-linecap="round"/>`;
      for (const [col, G] of S.groups) {
        let d = '';
        for (let i = 0; i < G.length; i += 4) {
          const x = G[i], y = G[i + 1], r = G[i + 2], a = G[i + 3];
          if (p.forme === 'rond') d += `M${f(x - r)} ${f(y)}a${f(r)} ${f(r)} 0 1 0 ${f(2 * r)} 0a${f(r)} ${f(r)} 0 1 0 ${f(-2 * r)} 0z`;
          else if (p.forme === 'carre') d += `M${f(x - r * 0.9)} ${f(y - r * 0.9)}h${f(r * 1.8)}v${f(r * 1.8)}h${f(-r * 1.8)}z`;
          else { const c = Math.cos(a) * r * 1.6, sn = Math.sin(a) * r * 1.6; d += `M${f(x - c)} ${f(y - sn)}L${f(x + c)} ${f(y + sn)}`; }
        }
        s += p.forme === 'tiret' ? `<path d="${d}" fill="none" stroke="${col}" stroke-width="${f(Math.max(0.6, S.spacing * 0.28 * p.taille))}" stroke-linecap="round"/>` : `<path d="${d}" fill="${col}"/>`;
      }
      if (S.arcPaths.length) s += `<path d="${arcD(true)}" fill="none" stroke="${p.accent}" stroke-width="2.2" stroke-linecap="round"/>`;
      return s + '</svg>';
    }
  </script>
</body>
</html>
