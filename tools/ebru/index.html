<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ebru</title>
  <link rel="stylesheet" href="../../assets/ui/atelier.css">
</head>
<body>
  <canvas></canvas>
  <script src="../../assets/ui/atelier.js"></script>
  <script>
    // Ebru : le papier marbré à la cuve, selon le modèle exact d'Aubrey Jaffer (Mathematical Marbling).
    // Chaque geste du marbreur est une transformation du plan, continue et inversible :
    //  · goutte de rayon r en C : P → C + (P − C)·√(1 + r²/|P − C|²) (l'encre déjà posée s'écarte sans perdre d'aire) ;
    //  · trait de stylet ou de peigne : P → P + z·u^d·M (déplacement le long du trait, qui décroît avec la distance d) ;
    //  · peigne circulaire et tourbillon de Lamb–Oseen : rotation d'un angle qui ne dépend que du rayon ;
    //  · stylet en serpentin : trait droit conjugué par une onde de cisaillement.
    // Comme chez Lu, Jaffer et al. (IEEE CG&A, 2012), chaque goutte est un contour vectoriel que chaque geste
    // transporte ; on insère des points là où il s'étire ou se courbe. Le rendu est exact à toute définition,
    // et l'export SVG reprend les contours affichés.
    const canvas = document.querySelector('canvas');
    const ctx = canvas.getContext('2d');
    const PAL = (k) => Atelier.PALETTES[k].colors;
    const MAXC = 8;
    const SKIM = 0.07;          // part du cycle consacrée à l'écrémage du bain
    const REPRISE = 5;          // secondes sans geste avant que le programme reprenne
    const TAU = Math.PI * 2;
    // Précision des contours, en unités du bain (le petit côté de l'image vaut 1).
    const TOL = 0.00012, CAP = 0.006, VMAX = 600000;
    const BUDGET = 1.5e6;       // sommets transportés par image quand le cycle est rejoué après un réglage

    const lamOf = (v) => 0.004 * Math.pow(30, v);                 // viscosité → portée du sillage (unités du bain)
    const ease = (x) => x * x * (3 - 2 * x);
    const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
    const rgb = (h) => { const n = parseInt(String(h).slice(1, 7), 16) || 0; return [n >> 16 & 255, n >> 8 & 255, n & 255]; };
    const hex = (c) => '#' + c.map((v) => Math.round(clamp(v, 0, 255)).toString(16).padStart(2, '0')).join('');
    const mixHex = (a, b, t) => { const A = rgb(a), B = rgb(b); return hex(A.map((v, i) => v + (B[i] - v) * t)); };
    const luma = (h) => { const [r, g, b] = rgb(h); return (r * 0.2126 + g * 0.7152 + b * 0.0722) / 255; };
    const isIn = (v, ...l) => l.includes(v);

    // État du bain : la suite des gestes du cycle, les contours déjà transportés, l'horloge.
    let prog = [], ops = [], ci = 0, regions = [], baseInit = [], geo = null;
    let clock = 0, curT = 20, cycleIdx = 0, lastUser = -1e9, lastPhi = -1, dirty = true;
    let HA = 1, HB = 1, QUAL = 1, VN = 0, behind = false, blank = true;
    let imgPix = null, imgSrc = null, logoLoops = null, logoSrc;
    let paperPat = null, gestR = null;
    const G = { st: null };

    const DEP = { semis: 'Semis (battal)', bandes: 'Bandes', cibles: 'Cibles', sumi: 'Suminagashi', aucun: 'Aucun' };
    const OUT = { aucun: 'Aucun', allerretour: 'Aller-retour (gel-git)', peigne: 'Peigne (nonpareil)', paon: 'Paon', vagues: 'Stylet en serpentin', souffle: 'Souffle (suminagashi)', petales: 'Pétales (tulipes)', spirales: 'Spirales (nid)', tourbillon: 'Tourbillon', rosace: 'Peigne circulaire' };

    const BM = PAL('bitmap'), BI = PAL('biennale'), GL = PAL('glyphes'), PG = PAL('papier-gris'), LU = PAL('luzern');
    const AC = PAL('acide'), GR = PAL('good-room'), P60 = PAL('papier-60');
    const pal = (c) => ({ fond: c[0], encres: c.slice(1), lisereCol: c[0] });

    const app = Atelier.app({
      stage: canvas,
      animate: true,
      seed: true,
      finish: { grain: 0.1, vignette: 0.1 },
      hint: 'Touchez pour verser une goutte (maintenez : elle grossit) · glissez pour tirer le stylet ou le peigne · molette : tourbillon',
      notes: 'Chaque goutte écarte l’encre déjà posée sans en changer l’aire ; chaque trait la déplace d’autant moins qu’elle est loin de la pointe (modèle exact de Jaffer). Le programme rejoue en boucle le travail du marbreur, puis écrème le bain.',
      params: {
        'Programme': {
          depot: { type: 'select', label: 'Dépôt des gouttes', options: DEP, value: 'semis' },
          outils: { type: 'select', label: 'Outil', options: OUT, value: 'allerretour' },
          cycle: { type: 'range', label: 'Durée du cycle (s)', min: 6, max: 60, step: 1, value: 20 },
          pose: { type: 'range', label: 'Temps de pose', min: 0, max: 0.5, step: 0.01, value: 0.16 },
          boucle: { type: 'toggle', label: 'Écrémer et recommencer', value: true },
          varier: { type: 'toggle', label: 'Varier à chaque cycle', value: false },
        },
        'Gouttes': {
          gouttes: { type: 'range', label: 'Nombre de gouttes', min: 6, max: 400, step: 1, value: 90, show: (q) => isIn(q.depot, 'semis', 'bandes') },
          taille: { type: 'range', label: 'Taille des gouttes', min: 0.02, max: 0.3, step: 0.005, value: 0.14 },
          varTaille: { type: 'range', label: 'Variation de taille', min: 0, max: 1, step: 0.01, value: 0.55, show: (q) => isIn(q.depot, 'semis', 'bandes', 'cibles') },
          centres: { type: 'range', label: 'Centres', min: 1, max: 16, step: 1, value: 5, show: (q) => isIn(q.depot, 'cibles', 'sumi') || isIn(q.outils, 'petales', 'spirales') },
          anneaux: { type: 'range', label: 'Anneaux par centre', min: 2, max: 40, step: 1, value: 9, show: (q) => isIn(q.depot, 'cibles', 'sumi') },
          etalement: { type: 'range', label: 'Étalement d’une goutte (s)', min: 0.2, max: 3, step: 0.05, value: 0.9 },
          fiel: { type: 'range', label: 'Gouttes de fiel (eau claire)', min: 0, max: 300, step: 1, value: 0 },
          tailleFiel: { type: 'range', label: 'Taille du fiel', min: 0.1, max: 1, step: 0.01, value: 0.3, show: (q) => q.fiel > 0 },
          image: { type: 'file', label: 'Couleurs d’après une image', accept: 'image/*' },
          imageOn: { type: 'toggle', label: 'Prendre les couleurs de l’image', value: true, show: (q) => !!q.image },
        },
        'Peigne': {
          orientation: { type: 'range', label: 'Orientation (°)', min: -90, max: 90, step: 1, value: 0, show: (q) => q.outils !== 'aucun' || q.depot === 'bandes' },
          passes: { type: 'range', label: 'Passes du stylet', min: 2, max: 30, step: 1, value: 10, show: (q) => isIn(q.outils, 'allerretour', 'peigne', 'paon', 'vagues') },
          ecart: { type: 'range', label: 'Écart des dents', min: 0.012, max: 0.2, step: 0.001, value: 0.045, show: (q) => isIn(q.outils, 'peigne', 'paon', 'rosace') || q.geste === 'peigne' },
          force: { type: 'range', label: 'Déplacement (z)', min: 0.02, max: 0.5, step: 0.005, value: 0.22, show: (q) => isIn(q.outils, 'allerretour', 'peigne', 'paon', 'vagues', 'petales', 'rosace') },
          viscosite: { type: 'range', label: 'Viscosité du bain', min: 0, max: 1, step: 0.01, value: 0.42 },
          souffles: { type: 'range', label: 'Souffles', min: 1, max: 8, step: 1, value: 3, show: (q) => q.outils === 'souffle' },
          vague: { type: 'range', label: 'Amplitude des vagues', min: 0, max: 0.3, step: 0.005, value: 0.07, show: (q) => isIn(q.outils, 'paon', 'vagues', 'souffle') },
          onde: { type: 'range', label: 'Longueur d’onde', min: 0.05, max: 1.2, step: 0.01, value: 0.34, show: (q) => isIn(q.outils, 'paon', 'vagues', 'souffle') },
          petales: { type: 'range', label: 'Pétales', min: 2, max: 12, step: 1, value: 5, show: (q) => q.outils === 'petales' },
          sensPetales: { type: 'segmented', label: 'Sens des pétales', options: { centre: 'Vers le centre', dehors: 'Vers l’extérieur' }, value: 'centre', show: (q) => q.outils === 'petales' },
          tours: { type: 'range', label: 'Tours', min: -3, max: 3, step: 0.05, value: 1.2, show: (q) => isIn(q.outils, 'spirales', 'tourbillon') },
        },
        'Geste': {
          geste: { type: 'segmented', label: 'Au glisser', options: { stylet: 'Stylet', peigne: 'Peigne', gouttes: 'Gouttes', tourbillon: 'Tourbillon' }, value: 'stylet' },
          dentsGeste: { type: 'range', label: 'Dents du peigne', min: 2, max: 15, step: 1, value: 6, show: (q) => q.geste === 'peigne' },
          forceGeste: { type: 'range', label: 'Force du geste', min: 0.1, max: 0.9, step: 0.01, value: 0.6, show: (q) => isIn(q.geste, 'stylet', 'peigne') },
        },
        'Bain': {
          base: { type: 'segmented', label: 'Fond du bain', options: { uni: 'Uni', rayures: 'Rayures', forme: 'Forme' }, value: 'uni' },
          rayures: { type: 'range', label: 'Largeur des rayures', min: 0.01, max: 0.25, step: 0.001, value: 0.05, show: (q) => q.base === 'rayures' },
          angleRayures: { type: 'range', label: 'Angle des rayures (°)', min: -90, max: 90, step: 1, value: 90, show: (q) => q.base === 'rayures' },
          forme: { type: 'select', label: 'Forme', options: { disque: 'Disque', anneau: 'Anneau', losange: 'Losange', logo: 'Logo de la charte' }, value: 'logo', show: (q) => q.base === 'forme' },
          tailleForme: { type: 'range', label: 'Taille de la forme', min: 0.15, max: 1, step: 0.01, value: 0.62, show: (q) => q.base === 'forme' },
        },
        'Rendu': {
          rendu: { type: 'segmented', label: 'Rendu', options: { aplat: 'Aplat', pigment: 'Pigment', trait: 'Trait' }, value: 'pigment' },
          bord: { type: 'range', label: 'Bord pigmenté', min: 0.04, max: 0.6, step: 0.01, value: 0.2, show: (q) => q.rendu === 'pigment' },
          veines: { type: 'range', label: 'Veines par goutte', min: 1, max: 4, step: 1, value: 1, show: (q) => q.rendu === 'pigment' },
          contraste: { type: 'range', label: 'Contraste du pigment', min: 0, max: 1, step: 0.01, value: 0.4, show: (q) => q.rendu === 'pigment' },
          lisere: { type: 'range', label: 'Liseré / trait (‰)', min: 0, max: 8, step: 0.05, value: 0 },
          papier: { type: 'range', label: 'Texture du papier', min: 0, max: 1, step: 0.01, value: 0.35 },
        },
        'Couleur': {
          fond: { type: 'color', label: 'Fond (bain)', value: BM[0] },
          encres: { type: 'palette', label: 'Encres', value: BM.slice(1) },
          lisereCol: { type: 'color', label: 'Liseré (et trait du fiel)', value: BM[0] },
        },
      },
      presets: {
        'Gel-git': {},
        'Nonpareil': { outils: 'peigne', gouttes: 110, taille: 0.11, passes: 9, force: 0.17, ecart: 0.045, ...pal(AC), seed: 11 },
        'Battal': { outils: 'aucun', gouttes: 260, taille: 0.075, varTaille: 0.8, fiel: 140, tailleFiel: 0.26, ...pal(GL), seed: 17 },
        'Paon': { outils: 'paon', gouttes: 100, taille: 0.12, passes: 9, ecart: 0.045, force: 0.17, vague: 0.07, onde: 0.34, ...pal(LU), seed: 21 },
        'Tulipes': { depot: 'cibles', outils: 'petales', centres: 7, anneaux: 11, taille: 0.13, petales: 5, force: 0.13, viscosite: 0.3, ...pal(BI), seed: 8 },
        'Nid': { outils: 'spirales', gouttes: 140, taille: 0.1, centres: 12, tours: 1.6, ...pal(GR), seed: 4 },
        'Suminagashi': { depot: 'sumi', outils: 'souffle', centres: 5, anneaux: 40, taille: 0.075, souffles: 4, vague: 0.14, onde: 0.45, viscosite: 0.75, ...pal(PG), seed: 5 },
        'Gravure': { depot: 'aucun', base: 'rayures', rayures: 0.018, angleRayures: 0, outils: 'vagues', orientation: 90, passes: 7, vague: 0.08, onde: 0.4, force: 0.2, rendu: 'trait', lisere: 1.4, papier: 0.5, ...pal(P60), seed: 2 },
      },
      brand(colors, a) {
        const q = a.params, cur = luma(q.fond);
        const bath = colors.reduce((a, c) => (Math.abs(luma(c) - cur) < Math.abs(luma(a) - cur) ? c : a), colors[0]);
        let inks = colors.filter((c) => c !== bath);
        if (!inks.length) inks = [luma(bath) > 0.5 ? '#111111' : '#f2f2f2'];
        const far = [...inks].sort((a, b) => Math.abs(luma(b) - luma(bath)) - Math.abs(luma(a) - luma(bath)))[0];
        return { fond: bath, encres: inks.slice(0, MAXC), lisereCol: q.rendu === 'trait' ? far : bath };
      },
      pointer: {
        down(q) {
          touch();
          G.st = 'pending'; G.P0 = loc(q); G.last = G.P0; G.t0 = app.time; G.op = null;
        },
        drag(q) {
          const P = loc(q);
          if (G.st === 'pending') {
            if (Math.hypot(P[0] - G.P0[0], P[1] - G.P0[1]) * unit() < 6) return;
            if (isIn(p.geste, 'stylet', 'peigne')) G.st = 'stroke';
            else if (p.geste === 'gouttes') { G.st = 'sprinkle'; G.acc = 0; sprinkle(G.P0); }
            else { G.st = 'vortex'; G.C = G.P0; G.ang = Math.atan2(P[1] - G.C[1], P[0] - G.C[0]); G.sig = clamp(Math.hypot(P[0] - G.C[0], P[1] - G.C[1]), 0.03, 0.6); }
          }
          if (G.st === 'stroke') strokeTo(P);
          else if (G.st === 'sprinkle') sprinkleTo(P);
          else if (G.st === 'vortex') {
            const a = Math.atan2(P[1] - G.C[1], P[0] - G.C[0]);
            let da = a - G.ang; while (da > Math.PI) da -= TAU; while (da < -Math.PI) da += TAU;
            G.ang = a;
            if (Math.abs(da) > 1e-4) addUser(vortexOp(G.C, da, G.sig));
          }
          if (G.st !== 'pending') touch();
          idle();
        },
        up() {
          if (G.st === 'pending') addUser(dropOp(G.P0, p.taille * 0.85, true));
          else if (G.st === 'drop' && G.op) { G.op.hold = false; dirty = true; }
          G.st = null; G.op = null; touch(); idle();
        },
        wheel(q, dy) {
          touch();
          addUser(vortexOp(loc(q), -dy * 0.004, Math.max(0.04, p.taille * 1.6)));
          idle();
        },
      },
      onChange(k, v) {
        if (k === '*') {
          // Une charte ou une palette seule recolore le bain sans le réécrémer.
          const s = shape();
          if (s !== lastShape) { G.st = null; paperPat = null; rebuild(); clock = startPhase() * p.cycle; curT = p.cycle; recompute(); }
        }
        else if (k === 'cycle') { clock = clock / curT * p.cycle; curT = p.cycle; }
        else if (k === 'encres') { if (v.length !== geo.nInk) rebuild(); }
        else if (k === 'rendu') recompute();
        else if (PROG.has(k)) rebuild();
        else if (GEOM.has(k)) recompute();
        lastShape = shape();
        dirty = true; idle();
      },
      onSeed() { paperPat = null; rebuild(); clock = startPhase() * p.cycle; recompute(); idle(); },
      onResize() {
        const U = unit(), A = app.size.w / U, B = app.size.h / U;
        if (!geo || Math.abs(A - geo.A) > 1e-4 || Math.abs(B - geo.B) > 1e-4) rebuild();
        dirty = true; blank = true; idle();
      },
      export: { name: 'ebru', svg: () => exportSVG() },
    });
    const p = app.params;
    const PROG = new Set(['depot', 'outils', 'pose', 'gouttes', 'taille', 'varTaille', 'centres', 'anneaux', 'etalement', 'fiel', 'tailleFiel', 'image', 'imageOn', 'orientation', 'passes', 'ecart', 'force', 'viscosite', 'souffles', 'vague', 'onde', 'petales', 'sensPetales', 'tours', 'varier']);
    const GEOM = new Set(['bord', 'veines', 'base', 'rayures', 'angleRayures', 'forme', 'tailleForme']);
    const objId = new WeakMap();
    let objN = 0;
    const idOf = (o) => { if (!o || typeof o !== 'object') return o || 0; if (!objId.has(o)) objId.set(o, ++objN); return objId.get(o); };
    const shape = () => JSON.stringify([[...PROG, ...GEOM, 'cycle', 'rendu', 'boucle'].map((k) => (k === 'image' ? idOf(p.image) : p[k])), inks().length]);
    let lastShape = '';

    // ——— Repère : unités du bain, origine au centre, le petit côté mesure 1 ———
    const unit = () => Math.min(app.size.w, app.size.h) || 1;
    const loc = (q) => { const U = unit(); return [(q.x - app.size.w / 2) / U, (q.y - app.size.h / 2) / U]; };
    const active = () => 1 - p.pose - SKIM;
    const startPhase = () => Math.max(0.02, active() - 0.1);
    const inks = () => (p.encres && p.encres.length ? p.encres : ['#111111']);

    // ——— Couleurs prises dans une image (cadrage « couvrir ») ———
    function syncImage() {
      const img = p.image || null;
      if (img === imgSrc) return;
      imgSrc = img; imgPix = null;
      const iw = img && (img.naturalWidth || img.width), ih = img && (img.naturalHeight || img.height);
      if (!iw || !ih) return;
      const k = Math.min(1, 160 / Math.max(iw, ih)), c = document.createElement('canvas');
      c.width = Math.max(1, Math.round(iw * k)); c.height = Math.max(1, Math.round(ih * k));
      const x = c.getContext('2d', { willReadFrequently: true });
      x.drawImage(img, 0, 0, c.width, c.height);
      imgPix = { d: x.getImageData(0, 0, c.width, c.height).data, w: c.width, h: c.height };
    }
    const useImg = () => !!(imgPix && p.imageOn);
    function imgCol(x, y) {
      const { d, w, h } = imgPix, ia = w / h, H = Math.max(geo.A / ia, geo.B);
      const i = (clamp(Math.floor((y / H + 0.5) * h), 0, h - 1) * w + clamp(Math.floor((x / (H * ia) + 0.5) * w), 0, w - 1)) * 4;
      return hex([d[i], d[i + 1], d[i + 2]]);
    }

    // ——— Logo de la charte : contours (marching squares sur la couverture), en unités de sa plus grande dimension ———
    function syncLogo() {
      const img = app.logoImg || null;
      if (img === logoSrc) return;
      logoSrc = img; logoLoops = null;
      const iw = img && (img.naturalWidth || img.width), ih = img && (img.naturalHeight || img.height);
      if (!iw || !ih) return;
      const N = 320, cv = document.createElement('canvas'); cv.width = cv.height = N;
      const x = cv.getContext('2d', { willReadFrequently: true });
      const k = N * 0.9 / Math.max(iw, ih);
      x.drawImage(img, (N - iw * k) / 2, (N - ih * k) / 2, iw * k, ih * k);
      const d = x.getImageData(0, 0, N, N).data;
      let clear = 0;
      for (let i = 3; i < d.length; i += 4) if (d[i] < 128) clear++;
      const useAlpha = clear > N * N * 0.1, f = new Float32Array(N * N);
      for (let i = 0; i < N * N; i++) {
        const l = (d[i * 4] * 0.2126 + d[i * 4 + 1] * 0.7152 + d[i * 4 + 2] * 0.0722) / 255;
        f[i] = 0.5 - (useAlpha ? d[i * 4 + 3] / 255 : (1 - l) * d[i * 4 + 3] / 255);
      }
      for (let i = 0; i < N; i++) { f[i] = f[(N - 1) * N + i] = f[i * N] = f[i * N + N - 1] = 0.5; }
      const nb = new Map(), pt = new Map(), at = (X, Y) => f[Y * N + X];
      const edge = (x0, y0, x1, y1) => {
        const key = `${x0},${y0},${x1},${y1}`;
        if (!pt.has(key)) { const a = at(x0, y0), t = a / (a - at(x1, y1)); pt.set(key, [(x0 + (x1 - x0) * t + 0.5) / N - 0.5, (y0 + (y1 - y0) * t + 0.5) / N - 0.5]); }
        return key;
      };
      const link = (a, b) => { for (const [s, e] of [[a, b], [b, a]]) { if (!nb.has(s)) nb.set(s, []); nb.get(s).push(e); } };
      const CASES = { 1: ['LB'], 2: ['BR'], 3: ['LR'], 4: ['TR'], 5: ['LT', 'BR'], 6: ['TB'], 7: ['LT'], 8: ['LT'], 9: ['TB'], 10: ['TR', 'LB'], 11: ['TR'], 12: ['LR'], 13: ['BR'], 14: ['LB'] };
      for (let Y = 0; Y < N - 1; Y++) for (let X = 0; X < N - 1; X++) {
        const c = (at(X, Y) < 0 ? 8 : 0) | (at(X + 1, Y) < 0 ? 4 : 0) | (at(X + 1, Y + 1) < 0 ? 2 : 0) | (at(X, Y + 1) < 0 ? 1 : 0);
        if (c === 0 || c === 15) continue;
        const E = { T: () => edge(X, Y, X + 1, Y), R: () => edge(X + 1, Y, X + 1, Y + 1), B: () => edge(X, Y + 1, X + 1, Y + 1), L: () => edge(X, Y, X, Y + 1) };
        for (const pr of CASES[c]) link(E[pr[0]](), E[pr[1]]());
      }
      const loops = [], seen = new Set();
      for (const start of nb.keys()) {
        if (seen.has(start)) continue;
        const loop = [];
        let prev = null, cur = start;
        while (cur && !seen.has(cur)) {
          seen.add(cur); loop.push(pt.get(cur));
          const nx = nb.get(cur).find((key) => key !== prev && !seen.has(key));
          prev = cur; cur = nx;
        }
        if (loop.length > 8) loops.push(loop.map(([u, v]) => [u / 0.9, v / 0.9]));
      }
      logoLoops = loops.length ? loops : null;
    }

    // ——— Contours : polylignes fermées, transportées par chaque geste avec raffinement adaptatif ———
    function curve(x, y, n) {
      let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
      for (let i = 0; i < n; i++) { const a = x[i], b = y[i]; if (a < x0) x0 = a; if (a > x1) x1 = a; if (b < y0) y0 = b; if (b > y1) y1 = b; }

        G.op = addUser(Object.assign(dropOp(G.P0, p.taille * 0.45, false), { hold: true }));
      }
      if (G.st === 'drop' && G.op) { G.op.r = Math.min(p.taille * 3, p.taille * (0.45 + 0.7 * (app.time - G.t0))); dirty = true; }
      const held = G.st || t - lastUser < REPRISE;
      if (!held && dt > 0) {
        clock = Math.min(clock + dt, p.boucle ? Infinity : (1 - SKIM) * T);
        if (clock >= T) newCycle();
      }
      const phi = clock / T;
      const moved = advance(phi), live = chain(phi);
      const skimming = p.boucle && phi >= 1 - SKIM;
      if (!force && !dirty && !moved && !live.length && !skimming && phi === lastPhi) return;
      dirty = false; blank = false; lastPhi = phi;
      draw(applyChain(regions, live), phi);
    }

    // ——— Export SVG : exactement les contours affichés ———
    function exportSVG() {
      settle();
      const { w, h } = app.size, S = canvas.width / w, W = Math.round(w * S), H = Math.round(h * S), U = unit() * S;
      const regs = current(clock / p.cycle), f = (v) => Math.round(v * 100) / 100;
      const d = (loops) => loops.map((c) => { const a = []; for (let i = 0; i < c.n; i++) a.push(f(W / 2 + c.x[i] * U) + ',' + f(H / 2 + c.y[i] * U)); return 'M' + a.join('L') + 'Z'; }).join('');
      const trait = p.rendu === 'trait', pig = p.rendu === 'pigment', lw = lineW() * U;
      const st = lw > 0 ? ` stroke="${p.lisereCol}" stroke-width="${f(lw)}" stroke-linejoin="round"` : '';
      const out = [];
      for (const R of regs) {
        const fr = R.even ? ' fill-rule="evenodd"' : '';
        if (trait) { out.push(`<path fill="none" stroke="${R.c < 0 ? p.lisereCol : colorOf(R)}" stroke-width="${f(lw)}" stroke-linejoin="round"${fr} d="${d(R.loops)}"/>`); continue; }
        const col = colorOf(R);
        if (pig && R.rings.length) {
          const T = tones(col, R.rings.length);
          out.push(`<path fill="${T[0]}"${st}${fr} d="${d(R.loops)}"/>`);
          R.rings.forEach((c, k) => out.push(`<path fill="${T[k + 1]}" d="${d([c])}"/>`));
        } else out.push(`<path fill="${col}"${st}${fr} d="${d(R.loops)}"/>`);
      }
      return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}"><rect width="${W}" height="${H}" fill="${p.fond}"/>${out.join('')}</svg>`;
    }

    clock = startPhase() * p.cycle; curT = p.cycle;
    rebuild();
    lastShape = shape();
    app.loop((t, dt) => render(t, dt));
  </script>
</body>
</html>
