<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Méduses</title>
  <link rel="stylesheet" href="../../assets/ui/atelier.css">
</head>
<body>
  <canvas></canvas>
  <script src="../../assets/ui/atelier.js"></script>
  <script>
    // Méduses : des méduses translucides nagent dans le noir aux couleurs de la marque. L'ombrelle se
    // contracte par à-coups (chaque battement pousse la méduse), les tentacules sont des chaînes souples
    // qui traînent derrière ; le motif de l'ombrelle peut être le logo. Neige marine et profondeur.
    const canvas = document.querySelector('canvas');
    const ctx = canvas.getContext('2d');
    const TAU = Math.PI * 2;
    const PAL = (k) => Atelier.PALETTES[k].colors;
    const KB = PAL('kegelbahn'), GR = PAL('good-room'), LUZ = PAL('luzern'), MENTHE = PAL('menthe'), THER = PAL('thermique'), PIX = PAL('pixels'), BIEN = PAL('biennale'), ORB = PAL('orbite');

    let jellies = [], snow = [], jKey = '', time = 0, drag = null, flow = [], mask = null, maskKey = null, tint = {}, warm = false;

    const app = Atelier.app({
      stage: canvas,
      animate: true,
      seed: true,
      finish: { grain: 0.06, vignette: 0.35 },
      hint: 'Touchez près d’une méduse pour l’effrayer · glissez pour créer un courant · molette : battements',
      notes: 'Une méduse nage par réaction : l’ombrelle se contracte d’un coup, chasse l’eau et la pousse vers l’avant, puis se relâche lentement. Les tentacules sont des chaînes de points reliés par des longueurs fixes (intégration de Verlet), freinés par l’eau.',
      params: {
        'Méduses': {
          nombre: { type: 'range', label: 'Nombre', min: 1, max: 14, step: 1, value: 6 },
          taille: { type: 'range', label: 'Taille', min: 0.04, max: 0.2, step: 0.005, value: 0.09 },
          battements: { type: 'range', label: 'Battements par seconde', min: 0.2, max: 2, step: 0.05, value: 0.7 },
          tentacules: { type: 'range', label: 'Tentacules', min: 0, max: 24, step: 1, value: 12 },
          longueur: { type: 'range', label: 'Longueur des tentacules', min: 0.5, max: 5, step: 0.1, value: 2.4 },
          motif: { type: 'select', label: 'Motif', options: { trefle: 'Trèfle', anneaux: 'Anneaux', logo: 'Logo', aucun: 'Aucun' }, value: 'trefle' },
          image: { type: 'file', label: 'Logo', accept: 'image/*', show: (q) => q.motif === 'logo' },
          couleurs: { type: 'palette', label: 'Méduses', value: ['#ff7ab8', '#7af0ff', '#c9a7ff', '#ffd27a'] },
        },
        'Eau': {
          lueur: { type: 'range', label: 'Lueur', min: 0, max: 2, step: 0.05, value: 1 },
          courant: { type: 'range', label: 'Courant', min: -1, max: 1, step: 0.01, value: 0.15 },
          neige: { type: 'range', label: 'Neige marine', min: 0, max: 600, step: 10, value: 220 },
          haut: { type: 'color', label: 'Eau en surface', value: '#0b2236' },
          bas: { type: 'color', label: 'Eau profonde', value: '#02060c' },
        },
      },
      presets: {
        'Abysses': {},
        'Logo': { motif: 'logo', nombre: 4, taille: 0.13, tentacules: 14, couleurs: ['#7af0ff', '#ff7ab8'] },
        'Banc': { nombre: 14, taille: 0.05, tentacules: 8, longueur: 3, battements: 1.1 },
        'Géante': { nombre: 1, taille: 0.2, tentacules: 24, longueur: 3.5, battements: 0.35, motif: 'anneaux' },
        'Kegelbahn': { couleurs: [KB[1], KB[2], KB[3]], haut: '#1a0b22', bas: KB[0] },
        'Good Room': { couleurs: [GR[1], GR[2], GR[3], GR[4]], haut: '#14181c', bas: GR[0], motif: 'anneaux' },
        'Menthe': { couleurs: [MENTHE[2], '#f2fff8'], haut: '#163028', bas: '#040c0a', neige: 400 },
        'Luzern': { couleurs: [LUZ[0], LUZ[2], LUZ[4]], haut: '#2a1606', bas: LUZ[3], motif: 'logo' },
        'Thermique': { couleurs: [THER[2], THER[3], THER[5]], haut: THER[1], bas: '#0a0a24', nombre: 9 },
        'Pixels': { couleurs: [PIX[5], PIX[4], PIX[2], PIX[3]], haut: '#101828', bas: '#04060c', tentacules: 18, longueur: 4 },
        'Lagon': { haut: '#2c8fa8', bas: '#0b3a52', couleurs: ['#ffffff', '#ffd0e4'], lueur: 0.6, neige: 120, courant: 0.4 },
        'Biennale': { couleurs: [BIEN[2], BIEN[3], BIEN[4]], haut: '#241010', bas: BIEN[1], motif: 'trefle' },
        'Orbite': { couleurs: [ORB[0], ORB[2]], haut: '#24100a', bas: ORB[1], nombre: 3, taille: 0.15, motif: 'aucun' },
      },
      brand(colors) {
        const lum = (h) => { const n = parseInt(h.slice(1), 16); return ((n >> 16) & 255) * 0.299 + ((n >> 8) & 255) * 0.587 + (n & 255) * 0.114; };
        const all = colors.slice().sort((a, b) => lum(a) - lum(b));
        const bright = all.slice(1).filter((c) => lum(c) > 50);
        return { bas: all[0], haut: all[1] && lum(all[1]) < 90 ? all[1] : all[0], couleurs: bright.length ? bright : ['#ffffff'] };
      },
      pointer: {
        down: (q) => { drag = { x: q.x, y: q.y, x0: q.x, y0: q.y, moved: false }; },
        drag: (q) => {
          if (!drag) return;
          if (Math.hypot(q.x - drag.x0, q.y - drag.y0) > 8) drag.moved = true;
          flow.push({ x: q.x, y: q.y, vx: (q.x - drag.x) * 6, vy: (q.y - drag.y) * 6, t: 0 }); if (flow.length > 80) flow.shift();
          drag.x = q.x; drag.y = q.y;
        },
        up: (q) => { if (drag && !drag.moved) startle(q.x, q.y); drag = null; },
        wheel: (q, dy) => app.set('battements', Math.max(0.2, Math.min(2, +(p.battements + (dy > 0 ? -0.05 : 0.05)).toFixed(2)))),
      },
      onChange(k) { if (k === 'image') maskKey = null; if (['nombre', 'taille', 'tentacules', 'longueur', 'couleurs'].includes(k)) jKey = ''; },
      onSeed() { jKey = ''; },
      export: { name: 'meduses', svg: () => toSVG() },
    });
    const p = app.params;

    const hex = (h) => { const n = parseInt(h.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; };
    const rgba = (h, a) => { const [r, g, b] = hex(h); return `rgba(${r},${g},${b},${a})`; };
    const light = () => { const [r, g, b] = hex(p.bas); return r * 0.3 + g * 0.6 + b * 0.1 > 120; };

    // ——— Population ———
    function build() {
      const { w, h } = app.size, key = [p.nombre, p.taille, p.tentacules, p.longueur, p.couleurs.join(), app.seed, w, h].join();
      if (key === jKey) return; jKey = key;
      const r = app.random, S = Math.min(w, h), cols = p.couleurs.length ? p.couleurs : ['#ffffff'];
      jellies = [];
      for (let i = 0; i < p.nombre; i++) {
        const z = 0.45 + 0.55 * (p.nombre > 1 ? (i + r() * 0.8) / p.nombre : 1);
        const R = S * p.taille * z * (0.75 + r() * 0.5);
        const j = { x: w * (0.12 + r() * 0.76), y: h * (0.2 + r() * 0.7), vx: 0, vy: 0, a: -Math.PI / 2 + (r() - 0.5) * 0.8, va: 0, R, z, col: cols[i % cols.length], ph: r(), rate: 0.8 + r() * 0.4, scare: 0, tents: [], arms: [] };
        // tentacules au bord de l'ombrelle, bras buccaux au centre
        const nT = p.tentacules, segs = 18, L = R * p.longueur / segs;
        for (let k = 0; k < nT; k++) { const u = nT > 1 ? k / (nT - 1) : 0.5; j.tents.push({ u: -1 + 2 * u, seg: L * (0.8 + r() * 0.4), pts: Array.from({ length: segs }, () => [j.x, j.y, j.x, j.y]) }); }
        for (let k = 0; k < 4; k++) j.arms.push({ u: -0.35 + k * 0.233, seg: R * 0.12, pts: Array.from({ length: 10 }, () => [j.x, j.y, j.x, j.y]) });
        jellies.push(j);
      }
      jellies.sort((a, b) => a.z - b.z);
      settle();
    }
    function settle() { for (let k = 0; k < 90; k++) stepJellies(1 / 60, true); }

    // forme de l'ombrelle : un dôme qui s'allonge et se resserre quand il se contracte
    // c = contraction 0..1 ; renvoie des points dans le repère de la méduse (y vers l'avant = haut du dôme)
    function bell(j, c, n) {
      const out = [], R = j.R, wdt = R * (1 - 0.28 * c), ht = R * (0.75 + 0.3 * c);
      for (let i = 0; i <= n; i++) {
        const t = i / n * Math.PI, s = Math.sin(t), co = Math.cos(t);
        // bord légèrement retourné vers l'intérieur
        const flare = 1 + 0.12 * Math.pow(Math.abs(co), 6) * (1 - c);
        out.push([co * wdt * flare, -s * ht * (1 - 0.15 * Math.pow(Math.abs(co), 3)) + Math.pow(Math.abs(co), 8) * R * 0.12 * (1 - c * 0.5)]);
      }
      return out;
    }
    function contraction(j) { const u = (time * p.battements * j.rate + j.ph) % 1; return u < 0.22 ? Math.sin(u / 0.22 * Math.PI / 2) : Math.pow(1 - (u - 0.22) / 0.78, 1.6); }
    function thrust(j) { const u = (time * p.battements * j.rate + j.ph) % 1; return u < 0.22 ? 1 : 0; }

    function startle(x, y) {
      for (const j of jellies) { const d = Math.hypot(j.x - x, j.y - y); if (d < j.R * 6 + 60) { j.scare = 1; j.va += (Math.atan2(j.y - y, j.x - x) - j.a > 0 ? 1 : -1) * 2; } }
    }

    function flowAt(x, y) {
      let vx = 0, vy = 0; const S = Math.min(app.size.w, app.size.h) * 0.12;
      for (const f of flow) { const d2 = (x - f.x) ** 2 + (y - f.y) ** 2, k = Math.exp(-d2 / (S * S)) * Math.exp(-f.t * 0.8); vx += f.vx * k; vy += f.vy * k; }
      return [vx, vy];
    }

    function stepJellies(dt, quiet) {
      const { w, h } = app.size, S = Math.min(w, h);
      // les méduses s'évitent un peu
      for (let a = 0; a < jellies.length; a++) for (let b = a + 1; b < jellies.length; b++) {
        const A = jellies[a], B = jellies[b], dx = B.x - A.x, dy = B.y - A.y, d = Math.hypot(dx, dy) || 1, m = (A.R + B.R) * 1.6;
        if (d < m && Math.abs(A.z - B.z) < 0.25) { const k = (m - d) / m * 40 * dt; A.vx -= dx / d * k * A.R; A.vy -= dy / d * k * A.R; B.vx += dx / d * k * B.R; B.vy += dy / d * k * B.R; }
      }
      for (const j of jellies) {
        const c = contraction(j), th = thrust(j) * (1 + j.scare * 1.5);
        // poussée dans l'axe, frein de l'eau, courant
        // près de la surface, elle bat moins fort et se laisse couler : elle reste dans le cadre
        const up = Math.max(0.15, Math.min(1, (j.y - j.R * 2) / (h * 0.3)));
        const ax = Math.cos(j.a), ay = Math.sin(j.a), F = j.R * 9 * th * Math.max(0.3, p.battements) * up;
        j.vx += ax * F * dt; j.vy += ay * F * dt;
        const [fx, fy] = quiet ? [0, 0] : flowAt(j.x, j.y);
        j.vx += (S * 0.03 * p.courant + fx * 0.6 - j.vx) * 1.6 * dt; j.vy += (fy * 0.6 + S * 0.02 - j.vy) * 1.6 * dt;
        j.x += j.vx * dt; j.y += j.vy * dt;
        // cap : tend à remonter, dévie des bords, ondule
        let want = -Math.PI / 2 + Math.sin(time * 0.17 + j.ph * 9) * 0.35;
        const m = Math.min(j.R * 2, w * 0.12);
        if (j.x < m * 1.5) want = -Math.PI / 2 + 0.6; if (j.x > w - m * 1.5) want = -Math.PI / 2 - 0.6;
        let da = Math.atan2(Math.sin(want - j.a), Math.cos(want - j.a));
        j.va += da * 1.4 * dt - j.va * 2 * dt; j.a += j.va * dt;
        j.scare = Math.max(0, j.scare - dt * 0.6);
        // repli de l'écran : par le haut, la méduse revient par le bas
        const ox = j.x, oy = j.y;
        if (j.y < -j.R * 4) { j.y = h + j.R * 3; } if (j.y > h + j.R * 6) j.y = -j.R * 3;
        if (j.x < -j.R * 5) j.x = w + j.R * 4; if (j.x > w + j.R * 5) j.x = -j.R * 4;
        if (ox !== j.x || oy !== j.y) { const ddx = j.x - ox, ddy = j.y - oy; for (const t of j.tents.concat(j.arms)) for (const q of t.pts) { q[0] += ddx; q[1] += ddy; q[2] += ddx; q[3] += ddy; } }
        // tentacules : chaînes de Verlet ancrées au bord de l'ombrelle
        const b = bell(j, c, 2), wd = Math.abs(b[0][0]);
        const ca = Math.cos(j.a + Math.PI / 2), sa = Math.sin(j.a + Math.PI / 2);
        const toW = (u, v) => [j.x + u * ca - v * sa, j.y + u * sa + v * ca];
        const grav = S * 0.02, damp = Math.exp(-2.4 * dt);
        for (const set of [j.tents, j.arms]) for (const t of set) {
          const isArm = set === j.arms;
          const [ax0, ay0] = toW(t.u * (isArm ? j.R * 0.9 : wd), isArm ? -j.R * 0.05 : j.R * 0.1);
          const P = t.pts;
          P[0][0] = ax0; P[0][1] = ay0; P[0][2] = ax0; P[0][3] = ay0;
          for (let k = 1; k < P.length; k++) {
            const q = P[k], vx = (q[0] - q[2]) * damp, vy = (q[1] - q[3]) * damp;
            q[2] = q[0]; q[3] = q[1];
            const [ffx, ffy] = quiet || k % 4 ? [0, 0] : flowAt(q[0], q[1]);
            // ondulation : une vague descend le long du tentacule
            const wv = Math.sin(time * 2.6 - k * 0.55 + t.u * 4 + j.ph * 9) * j.R * 0.06 * (k / P.length) * dt * dt * 60;
            q[0] += vx + (ffx * 0.3 + S * 0.03 * p.courant * 0.3) * dt * dt * 8 + wv * ca; q[1] += vy + grav * dt * dt + ffy * 0.3 * dt * dt * 8 + wv * sa;
          }
          for (let it = 0; it < 2; it++) for (let k = 1; k < P.length; k++) {
            const a = P[k - 1], q = P[k], dx = q[0] - a[0], dy = q[1] - a[1], d = Math.hypot(dx, dy) || 1e-6, L = t.seg;
            if (d > L) { const e = (d - L) / d; if (k === 1) { q[0] -= dx * e; q[1] -= dy * e; } else { a[0] += dx * e * 0.5; a[1] += dy * e * 0.5; q[0] -= dx * e * 0.5; q[1] -= dy * e * 0.5; } }
          }
        }
      }
      for (const f of flow) f.t += dt; flow = flow.filter((f) => f.t < 4);
    }

    // ——— Motif du logo, teinté par couleur ———
    function logoMask() {
      const img = p.image || app.logoImg, key = img ? (img.src || 'c') : 'demo';
      if (key === maskKey && mask) return mask;
      maskKey = key; tint = {};
      const M = 160, c = document.createElement('canvas'); c.width = c.height = M; const x = c.getContext('2d', { willReadFrequently: true });
      if (img) { const iw = img.naturalWidth || img.width, ih = img.naturalHeight || img.height, k = M * 0.9 / Math.max(iw, ih); x.drawImage(img, (M - iw * k) / 2, (M - ih * k) / 2, iw * k, ih * k); }
      else { x.fillStyle = '#000'; x.beginPath(); x.arc(80, 80, 72, 0, TAU); x.arc(80, 80, 44, 0, TAU, true); x.fill('evenodd'); x.fillRect(72, 4, 16, 152); }
      const d = x.getImageData(0, 0, M, M), dd = d.data;
      let transp = 0; for (let i = 3; i < dd.length; i += 16) if (dd[i] < 128) transp++;
      const useA = transp > dd.length / 16 * 0.05;
      for (let i = 0; i < dd.length; i += 4) { const l = (dd[i] * 0.2126 + dd[i + 1] * 0.7152 + dd[i + 2] * 0.0722) / 255, on = useA ? dd[i + 3] > 128 : dd[i + 3] > 128 && l < 0.5; dd[i] = dd[i + 1] = dd[i + 2] = 255; dd[i + 3] = on ? 255 : 0; }
      x.putImageData(d, 0, 0);
      mask = c; return mask;
    }
    function tinted(col) {
      if (tint[col]) return tint[col];
      const m = logoMask(), c = document.createElement('canvas'); c.width = m.width; c.height = m.height;
      const x = c.getContext('2d'); x.drawImage(m, 0, 0); x.globalCompositeOperation = 'source-in'; x.fillStyle = col; x.fillRect(0, 0, c.width, c.height);
      tint[col] = c; return c;
    }

    // ——— Neige marine ———
    function ensureSnow() {
      const { w, h } = app.size;
      while (snow.length < p.neige) snow.push({ x: app.random() * w, y: app.random() * h, z: 0.3 + app.random() * 0.7, s: 0.4 + app.random() * 1.4, ph: app.random() * TAU });
      if (snow.length > p.neige) snow.length = p.neige;
    }

    // ——— Dessin ———
    function drawJelly(x, j) {
      const c = contraction(j), b = bell(j, c, 28), L = light();
      const glow = Math.min(1, p.lueur) * (0.55 + 0.45 * j.z), col = j.col;
      x.save(); x.translate(j.x, j.y); x.rotate(j.a + Math.PI / 2);
      // halo
      if (!L && p.lueur > 0) {
        const g = x.createRadialGradient(0, -j.R * 0.4, 0, 0, -j.R * 0.4, j.R * 2.6);
        g.addColorStop(0, rgba(col, 0.22 * p.lueur * j.z)); g.addColorStop(1, rgba(col, 0));
        x.fillStyle = g; x.fillRect(-j.R * 2.6, -j.R * 3, j.R * 5.2, j.R * 5.2);
      }
      // ombrelle : verre teinté, plus dense vers le bord
      x.beginPath(); b.forEach(([u, v], i) => (i ? x.lineTo(u, v) : x.moveTo(u, v)));
      x.quadraticCurveTo(0, j.R * (0.05 + 0.1 * c), b[0][0], b[0][1]);
      const g2 = x.createRadialGradient(0, -j.R * 0.35, j.R * 0.1, 0, -j.R * 0.2, j.R * 1.1);
      g2.addColorStop(0, rgba(col, 0.1 * glow)); g2.addColorStop(0.7, rgba(col, 0.22 * glow)); g2.addColorStop(1, rgba(col, 0.5 * glow));
      x.fillStyle = g2; x.fill();
      // motif interne
      x.save(); x.clip();
      const mR = j.R * (1 - 0.2 * c);
      if (p.motif === 'trefle') {
        x.strokeStyle = rgba(col, 0.75 * glow); x.lineWidth = Math.max(1, j.R * 0.07);
        for (let k = 0; k < 4; k++) { const a = -Math.PI / 2 + (k - 1.5) * 0.55; x.beginPath(); x.arc(Math.cos(a) * mR * 0.32, -j.R * 0.38 + Math.sin(a) * mR * 0.18, mR * 0.14, 0, TAU * 0.8); x.stroke(); }
      } else if (p.motif === 'anneaux') {
        x.strokeStyle = rgba(col, 0.4 * glow); x.lineWidth = Math.max(0.8, j.R * 0.025);
        for (let k = 1; k <= 4; k++) { x.beginPath(); x.ellipse(0, -j.R * 0.05, mR * k * 0.22, j.R * (0.75 + 0.3 * c) * k * 0.22, 0, Math.PI, TAU); x.stroke(); }
        x.strokeStyle = rgba(col, 0.18 * glow); for (let k = -6; k <= 6; k++) { x.beginPath(); x.moveTo(k / 6 * mR * 0.15, -j.R * 0.7); x.lineTo(k / 6 * mR * 1.1, j.R * 0.1); x.stroke(); }
      } else if (p.motif === 'logo') {
        const s = mR * 1.05; x.globalAlpha = 0.85 * glow; x.drawImage(tinted(col), -s / 2, -j.R * 0.45 - s / 2 * (0.75 + 0.3 * c), s, s * (0.75 + 0.3 * c)); x.globalAlpha = 1;
      }
      x.restore();
      // bord lumineux
      x.beginPath(); b.forEach(([u, v], i) => (i ? x.lineTo(u, v) : x.moveTo(u, v)));
      x.strokeStyle = rgba(col, 0.85 * glow); x.lineWidth = Math.max(1, j.R * 0.04); x.stroke();
      x.strokeStyle = 'rgba(255,255,255,' + (0.35 * glow) + ')'; x.lineWidth = Math.max(0.5, j.R * 0.012); x.stroke();
      // velum (frange sous le bord)
      x.beginPath(); x.moveTo(b[0][0], b[0][1]); x.quadraticCurveTo(0, j.R * (0.05 + 0.1 * c), b[b.length - 1][0], b[b.length - 1][1]);
      x.strokeStyle = rgba(col, 0.35 * glow); x.lineWidth = Math.max(1, j.R * 0.06); x.stroke();
      x.restore();
    }
    function drawStrands(x, j) {
      const glow = Math.min(1, p.lueur) * (0.55 + 0.45 * j.z);
      x.lineCap = 'round'; x.lineJoin = 'round';
      for (const t of j.arms) {
        x.beginPath(); t.pts.forEach(([a, b], i) => (i ? x.lineTo(a, b) : x.moveTo(a, b)));
        x.strokeStyle = rgba(j.col, 0.35 * glow); x.lineWidth = Math.max(1, j.R * 0.12); x.stroke();
        x.strokeStyle = rgba(j.col, 0.5 * glow); x.lineWidth = Math.max(0.6, j.R * 0.03); x.stroke();
      }
      // tentacules : courbes lissées par les milieux, en trois tronçons qui s'effacent vers le bout
      x.lineCap = 'butt';
      for (const t of j.tents) {
        const P = t.pts, n = P.length, parts = 3;
        for (let c = 0; c < parts; c++) {
          const a = Math.floor(c * (n - 1) / parts), b = Math.floor((c + 1) * (n - 1) / parts), u = (c + 0.5) / parts;
          x.beginPath(); x.moveTo(a ? (P[a][0] + P[a - 1][0]) / 2 : P[0][0], a ? (P[a][1] + P[a - 1][1]) / 2 : P[0][1]);
          for (let k = a; k < b; k++) x.quadraticCurveTo(P[k][0], P[k][1], (P[k][0] + P[k + 1][0]) / 2, (P[k][1] + P[k + 1][1]) / 2);
          x.strokeStyle = rgba(j.col, (0.7 * (1 - u) + 0.12) * glow); x.lineWidth = Math.max(0.4, j.R * 0.022 * (1 - u * 0.6)); x.stroke();
        }
      }
      x.lineCap = 'round';
    }

    app.loop((tt, dt) => {
      const { w, h, dpr } = app.size, S = Math.min(w, h);
      dt = Math.min(0.04, dt || 0);
      build(); ensureSnow();
      if (app.thumbnail && !warm) { warm = true; for (let k = 0; k < 240; k++) { time += 1 / 60; stepJellies(1 / 60, true); } }
      time += dt; stepJellies(dt, false);

      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      const g = ctx.createLinearGradient(0, 0, 0, h); g.addColorStop(0, p.haut); g.addColorStop(1, p.bas);
      ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
      // rais de lumière depuis la surface
      const L = light();
      ctx.globalCompositeOperation = L ? 'source-over' : 'lighter';
      for (let k = 0; k < 5; k++) {
        const x0 = w * (0.1 + k * 0.2 + 0.05 * Math.sin(time * 0.1 + k)), wd = w * (0.04 + 0.03 * Math.sin(time * 0.13 + k * 2));
        const gr = ctx.createLinearGradient(0, 0, 0, h * 0.8); gr.addColorStop(0, 'rgba(255,255,255,0.05)'); gr.addColorStop(1, 'rgba(255,255,255,0)');
        ctx.fillStyle = gr; ctx.beginPath(); ctx.moveTo(x0 - wd, 0); ctx.lineTo(x0 + wd, 0); ctx.lineTo(x0 + wd * 3 + w * 0.08, h * 0.8); ctx.lineTo(x0 - wd + w * 0.08, h * 0.8); ctx.closePath(); ctx.fill();
      }
      // neige marine : dérive lente
      ctx.fillStyle = 'rgba(255,255,255,0.5)';
      for (const s of snow) {
        s.y += (6 + 10 * s.z) * dt; s.x += (Math.sin(time * 0.5 + s.ph) * 4 + S * 0.03 * p.courant * s.z) * dt;
        if (s.y > h) { s.y = -2; s.x = app.random() * w; } if (s.x < 0) s.x += w; if (s.x > w) s.x -= w;
        ctx.globalAlpha = 0.15 + 0.45 * s.z; ctx.fillRect(s.x, s.y, s.s * s.z, s.s * s.z);
      }
      ctx.globalAlpha = 1;
      for (const j of jellies) { drawStrands(ctx, j); drawJelly(ctx, j); }
      ctx.globalCompositeOperation = 'source-over';
      app.finish(ctx);
    });

    function toSVG() {
      const { w, h } = app.size, f = (v) => v.toFixed(1), out = [], L = light();
      const defs = [`<linearGradient id="eau" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${p.haut}"/><stop offset="1" stop-color="${p.bas}"/></linearGradient>`];
      out.push(`<rect width="100%" height="100%" fill="url(#eau)"/>`);
      out.push(`<g fill="#fff">${snow.map((s) => `<rect x="${f(s.x)}" y="${f(s.y)}" width="${f(s.s * s.z)}" height="${f(s.s * s.z)}" opacity="${(0.15 + 0.45 * s.z).toFixed(2)}"/>`).join('')}</g>`);
      jellies.forEach((j, n) => {
        const c = contraction(j), b = bell(j, c, 28), glow = Math.min(1, p.lueur) * (0.55 + 0.45 * j.z), col = j.col;
        const parts = [];
        for (const t of j.arms) parts.push(`<path d="${t.pts.map(([a, b2], i) => (i ? 'L' : 'M') + f(a) + ' ' + f(b2)).join('')}" stroke="${col}" stroke-opacity="${(0.35 * glow).toFixed(2)}" stroke-width="${f(Math.max(1, j.R * 0.12))}" fill="none" stroke-linecap="round"/>`);
        for (const t of j.tents) parts.push(`<path d="${t.pts.map(([a, b2], i) => (i ? 'L' : 'M') + f(a) + ' ' + f(b2)).join('')}" stroke="${col}" stroke-opacity="${(0.5 * glow).toFixed(2)}" stroke-width="${f(Math.max(0.4, j.R * 0.02))}" fill="none" stroke-linecap="round"/>`);
        const d = b.map(([u, v], i) => (i ? 'L' : 'M') + f(u) + ' ' + f(v)).join('') + `Q0 ${f(j.R * (0.05 + 0.1 * c))} ${f(b[0][0])} ${f(b[0][1])}Z`;
        defs.push(`<radialGradient id="om${n}" cx="0" cy="${f(-j.R * 0.2)}" r="${f(j.R * 1.1)}" fx="0" fy="${f(-j.R * 0.35)}" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="${col}" stop-opacity="${(0.1 * glow).toFixed(2)}"/><stop offset="0.7" stop-color="${col}" stop-opacity="${(0.22 * glow).toFixed(2)}"/><stop offset="1" stop-color="${col}" stop-opacity="${(0.5 * glow).toFixed(2)}"/></radialGradient><clipPath id="cl${n}"><path d="${d}"/></clipPath>`);
        let motif = '';
        const mR = j.R * (1 - 0.2 * c);
        if (p.motif === 'trefle') motif = Array.from({ length: 4 }, (_, k) => { const a = -Math.PI / 2 + (k - 1.5) * 0.55, cx = Math.cos(a) * mR * 0.32, cy = -j.R * 0.38 + Math.sin(a) * mR * 0.18, r = mR * 0.14; return `<circle cx="${f(cx)}" cy="${f(cy)}" r="${f(r)}" fill="none" stroke="${col}" stroke-opacity="${(0.75 * glow).toFixed(2)}" stroke-width="${f(Math.max(1, j.R * 0.07))}"/>`; }).join('');
        else if (p.motif === 'anneaux') motif = Array.from({ length: 4 }, (_, k) => `<ellipse cx="0" cy="${f(-j.R * 0.05)}" rx="${f(mR * (k + 1) * 0.22)}" ry="${f(j.R * (0.75 + 0.3 * c) * (k + 1) * 0.22)}" fill="none" stroke="${col}" stroke-opacity="${(0.4 * glow).toFixed(2)}"/>`).join('');
        else if (p.motif === 'logo') { const s = mR * 1.05; motif = `<image href="${tinted(col).toDataURL()}" x="${f(-s / 2)}" y="${f(-j.R * 0.45 - s / 2 * (0.75 + 0.3 * c))}" width="${f(s)}" height="${f(s * (0.75 + 0.3 * c))}" preserveAspectRatio="none" opacity="${(0.85 * glow).toFixed(2)}"/>`; }
        const rot = (j.a + Math.PI / 2) * 180 / Math.PI;
        parts.push(`<g transform="translate(${f(j.x)} ${f(j.y)}) rotate(${rot.toFixed(2)})"><path d="${d}" fill="url(#om${n})"/><g clip-path="url(#cl${n})">${motif}</g><path d="${b.map(([u, v], i) => (i ? 'L' : 'M') + f(u) + ' ' + f(v)).join('')}" fill="none" stroke="${col}" stroke-opacity="${(0.85 * glow).toFixed(2)}" stroke-width="${f(Math.max(1, j.R * 0.04))}"/></g>`);
        out.push(`<g style="mix-blend-mode:${L ? 'normal' : 'screen'}">${parts.join('')}</g>`);
      });
      return `<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">\n<defs>${defs.join('')}</defs>\n${out.join('\n')}\n</svg>`;
    }
  </script>
</body>
</html>
