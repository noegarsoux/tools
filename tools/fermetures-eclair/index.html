<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fermetures éclair</title>
  <link rel="stylesheet" href="../../assets/ui/atelier.css">
</head>
<body>
  <canvas></canvas>
  <script src="../../assets/ui/atelier.js"></script>
  <script>
    // Fermetures éclair : N fermetures parallèles cousues dans un tissu. Chaque fermeture suit une ligne médiane
    // c(y) (droite ou ondulée). Sous le curseur, les deux rangées de dents s'engrènent ; au-dessus, elles
    // s'écartent en V : demi-écart g(y) = G·(1 − e^(−3·(ys − y)/Lv)). Le tissu est un grand rectangle percé
    // (règle pair-impair) des fentes ouvertes, qui laissent voir le dessous : une doublure avec le logo.
    // Les dents sont des sprites (métal ou plastique) posés le long de chaque bord, inclinés selon sa pente.
    // Le curseur suit sa consigne avec un ressort ; son accélération fait balancer la tirette (pendule).
    const canvas = document.querySelector('canvas');
    const ctx = canvas.getContext('2d');
    const TAU = Math.PI * 2;
    const PAL = (k) => Atelier.PALETTES[k].colors;
    const ACI = PAL('acide'), BIT = PAL('bitmap'), MEN = PAL('menthe'), ORB = PAL('orbite');

    let simT = 0, vKey = '', logoM = null, logoKey = '', ptr = null, Z = [], UL = null, ulKey = '', TX = null, txKey = '', SP = null, spKey = '';

    const app = Atelier.app({
      stage: canvas,
      animate: true,
      seed: true,
      finish: { grain: 0.04, vignette: 0.16 },
      hint: 'Glissez une fermeture pour l\'ouvrir ou la fermer · clic : tout ouvrir ou tout fermer · molette : taille des dents',
      notes: 'Une fermeture éclair, ce sont deux rangées de dents décalées d\'une demi-dent, cousues sur deux rubans. Le curseur les force à s\'engrener en descendant et les écarte en remontant : au-dessus de lui, le tissu s\'ouvre en V. Ici, plusieurs fermetures traversent un même tissu et, en s\'ouvrant, laissent voir la doublure et le logo imprimé dessous. Les curseurs bougent seuls, en vague, ensemble ou au hasard, et leur tirette se balance à chaque à-coup. Glissez une fermeture pour la tirer vous-même.',
      params: {
        'Fermetures': {
          nombre: { type: 'range', label: 'Nombre', min: 1, max: 9, step: 1, value: 4 },
          orientation: { type: 'segmented', label: 'Sens', options: { verticale: 'Verticales', horizontale: 'Horizontales' }, value: 'verticale' },
          ondulation: { type: 'range', label: 'Ondulation', min: 0, max: 1, step: 0.01, value: 0.25 },
          frequence: { type: 'range', label: 'Fréquence des ondes', min: 0.3, max: 4, step: 0.05, value: 1.2 },
          ouverture: { type: 'range', label: 'Ouverture', min: 0.1, max: 1, step: 0.01, value: 0.75 },
          longueur: { type: 'range', label: 'Longueur du V', min: 0.05, max: 1, step: 0.01, value: 0.3 },
          taille: { type: 'range', label: 'Taille des dents', min: 0.006, max: 0.04, step: 0.0005, value: 0.018 },
        },
        'Curseurs': {
          matiere: { type: 'select', label: 'Matière', options: { or: 'Laiton doré', argent: 'Argent', bronze: 'Bronze', plastique: 'Plastique' }, value: 'or' },
          tirette: { type: 'segmented', label: 'Tirette', options: { plate: 'Plate', anneau: 'Anneau', cordon: 'Cordon' }, value: 'plate' },
          mode: { type: 'select', label: 'Mouvement', options: { vague: 'En vague', vaetvient: 'Va-et-vient', ensemble: 'Ensemble', hasard: 'Au hasard' }, value: 'vague' },
          vitesse: { type: 'range', label: 'Vitesse', min: 0.1, max: 3, step: 0.01, value: 1 },
          balancement: { type: 'range', label: 'Balancement', min: 0, max: 1, step: 0.01, value: 0.6 },
        },
        'Tissu et doublure': {
          trame: { type: 'segmented', label: 'Tissu', options: { serge: 'Sergé', toile: 'Toile', cuir: 'Cuir' }, value: 'serge' },
          tissus: { type: 'palette', label: 'Tissus', value: ['#26365c', '#2f4473'] },
          ruban: { type: 'color', label: 'Ruban', value: '#141a2a' },
          dents: { type: 'color', label: 'Dents en plastique', value: '#e5452a' },
          motif: { type: 'segmented', label: 'Doublure', options: { logo: 'Logo', logos: 'Logos', rayures: 'Rayures' }, value: 'logo' },
          dessous: { type: 'color', label: 'Doublure', value: '#f2c230' },
          encre: { type: 'color', label: 'Impression', value: '#16161a' },
          echelle: { type: 'range', label: 'Taille du motif', min: 0.2, max: 1.2, step: 0.01, value: 0.75 },
          image: { type: 'file', label: 'Logo', accept: 'image/*' },
        },
      },
      presets: {
        'Blouson': {},
        'Une seule': { nombre: 1, taille: 0.034, ouverture: 1, longueur: 0.55, ondulation: 0, mode: 'vaetvient', matiere: 'argent', tirette: 'anneau', tissus: ['#1b1b1e'], ruban: '#0c0c0e', dessous: '#e5452a', encre: '#f4f1ea', echelle: 0.85 },
        'Rideau': { nombre: 9, taille: 0.01, ondulation: 0, ouverture: 1, longueur: 0.5, mode: 'vague', vitesse: 0.7, trame: 'toile', tissus: ['#7a1420', '#8c1a28'], ruban: '#3a0a10', dessous: '#16161a', encre: '#f2c230', motif: 'logos', echelle: 0.5 },
        'Horizontales': { orientation: 'horizontale', nombre: 5, mode: 'ensemble', ondulation: 0.15, frequence: 2, tissus: ['#e9e4d8', '#d9d2c2'], ruban: '#2a2a2e', matiere: 'argent', dessous: '#2f5fd0', encre: '#f4f1ea', trame: 'toile' },
        'Plastique': { matiere: 'plastique', dents: '#f2c230', tirette: 'cordon', tissus: ['#e57d9e', '#d86a8e', '#f2b0c8'], ruban: '#f2c230', dessous: '#3a6fd0', encre: '#f4f1ea', motif: 'rayures', nombre: 3, taille: 0.026 },
        'Ondulées': { nombre: 3, ondulation: 1, frequence: 2.6, ouverture: 0.9, longueur: 0.45, mode: 'vaetvient', tissus: ['#2e3b25', '#3b4a30'], ruban: '#1a2214', matiere: 'bronze', dessous: '#f4f1ea', encre: '#e0402f' },
        'Cuir noir': { trame: 'cuir', tissus: ['#1a1a1c', '#222225'], ruban: '#0a0a0b', matiere: 'argent', tirette: 'anneau', dessous: '#e5452a', encre: '#16161a', motif: 'rayures', nombre: 2, taille: 0.026, ondulation: 0.1 },
        'Au hasard': { mode: 'hasard', nombre: 6, taille: 0.014, ondulation: 0.4, frequence: 1.6, tissus: ['#c9c2b2', '#b9b1a0', '#d6cfbf'], ruban: '#4a4238', dessous: '#16161a', encre: '#e5452a', motif: 'logos', echelle: 0.45, trame: 'toile' },
        'Acide': { tissus: [ACI[1]], ruban: '#000000', matiere: 'argent', dessous: ACI[2], encre: ACI[1], tirette: 'anneau', nombre: 3, ouverture: 1, mode: 'ensemble', trame: 'cuir' },
        'Menthe': { tissus: [MEN[3], mix(MEN[3], '#000000', 0.12)], ruban: MEN[1], matiere: 'plastique', dents: MEN[0], dessous: MEN[2], encre: MEN[1], tirette: 'cordon', nombre: 5, mode: 'vaetvient', motif: 'logos', echelle: 0.6 },
        'Orbite': { orientation: 'horizontale', nombre: 3, ondulation: 0.6, frequence: 1, tissus: [ORB[1]], ruban: '#000000', matiere: 'or', dessous: ORB[0], encre: ORB[2], ouverture: 1, longueur: 0.6, taille: 0.024, mode: 'vague', vitesse: 0.8 },
      },
      brand(colors) {
        const s = colors.slice().sort((a, b) => lum(a) - lum(b)), D = s[0], L = s[s.length - 1];
        const mid = s.length > 2 ? s.slice(1, -1) : [D];
        return { tissus: mid, ruban: mix(mid[0], '#000000', 0.45), dessous: L, encre: D, dents: mid[mid.length - 1] };
      },
      pointer: {
        down: (q) => { const L = toLocal(q), i = pick(L); ptr = { x: q.x, y: q.y, moved: 0, i }; if (i >= 0) { Z[i].grab = true; Z[i].hold = simT + 5; } },
        drag: (q) => { if (!ptr) return; ptr.moved += Math.hypot(q.x - ptr.x, q.y - ptr.y); ptr.x = q.x; ptr.y = q.y; if (ptr.i >= 0 && Z[ptr.i] && G) { const L = toLocal(q); Z[ptr.i].tgt = Math.max(0, Math.min(1, (L[1] - G.yMin) / (G.yMax - G.yMin))); Z[ptr.i].hold = simT + 5; } },
        up: () => {
          if (ptr && ptr.moved < 6) { const open = Z.reduce((a, z) => a + z.s, 0) / Math.max(1, Z.length) < 0.5; Z.forEach((z, k) => { z.tgt = open ? 1 : 0; z.hold = simT + 6 + k * 0.12; }); }
          if (ptr && ptr.i >= 0 && Z[ptr.i]) Z[ptr.i].grab = false; ptr = null;
        },
        wheel: (q, dy) => app.set('taille', Math.max(0.006, Math.min(0.04, +(p.taille * (dy > 0 ? 0.93 : 1.07)).toFixed(4)))),
      },
      onChange(k) { if (['*', 'image'].includes(k)) logoKey = ''; },
      export: { name: 'fermetures-eclair', svg: () => toSVG() },
    });
    const p = app.params;

    function hex(x) { const n = parseInt(x.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
    function lum(x) { const c = hex(x); return (c[0] * 0.299 + c[1] * 0.587 + c[2] * 0.114) / 255; }
    function mix(a, b, t) { const A = hex(a), C = hex(b); return '#' + A.map((v, i) => Math.round(v + (C[i] - v) * t).toString(16).padStart(2, '0')).join(''); }
    function rng(s) { let a = s >>> 0; return () => { a = (a + 0x6d2b79f5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }

    function buildLogo() {
      const img0 = p.image || app.logoImg, key = img0 ? (img0.src || 'c') : 'demo'; if (key === logoKey) return; logoKey = key; vKey = '';
      const M = 200, c = document.createElement('canvas'); c.width = c.height = M; const x = c.getContext('2d', { willReadFrequently: true }), L = M * 0.94, cx = M / 2;
      if (img0) { const iw = img0.naturalWidth || img0.width, ih = img0.naturalHeight || img0.height, s = L / Math.max(iw, ih); x.drawImage(img0, cx - iw * s / 2, cx - ih * s / 2, iw * s, ih * s); }
      else { x.fillStyle = '#000'; x.beginPath(); x.arc(cx, cx, L * 0.48, 0, TAU); x.arc(cx, cx, L * 0.27, 0, TAU, true); x.fill('evenodd'); x.fillRect(cx - L * 0.07, cx - L * 0.5, L * 0.14, L); }
      const d = x.getImageData(0, 0, M, M).data; let transp = 0; for (let i = 3; i < d.length; i += 4) if (d[i] < 128) transp++; const useA = transp > M * M * 0.05;
      const F = new Float64Array(M * M); for (let i = 0; i < M * M; i++) { const o = i * 4, l = (d[o] * 0.2126 + d[o + 1] * 0.7152 + d[o + 2] * 0.0722) / 255; F[i] = useA ? d[o + 3] / 255 : (d[o + 3] / 255) * Math.min(1, Math.max(0, (0.75 - l) * 2)); }
      { const G2 = new Float64Array(M * M); for (let j = 1; j < M - 1; j++) for (let i = 1; i < M - 1; i++) { let a = 0; for (let b = -1; b <= 1; b++) for (let c = -1; c <= 1; c++) a += F[(j + b) * M + i + c] * (b || c ? (b && c ? 1 : 2) : 4); G2[j * M + i] = a / 16; } F.set(G2); }
      for (let k = 0; k < M; k++) F[k] = F[(M - 1) * M + k] = F[k * M] = F[k * M + M - 1] = 0;
      logoM = contours(F, M, M, 0.5, 0, 0, 1).filter((c) => c.closed && c.pts.length > 6).map((c) => chaikin(chaikin(c.pts, true), true).map((q) => [q[0] / M - 0.5, q[1] / M - 0.5]));
    }
    // carrés marchants + chaînage
    function contours(F, nx, ny, lev, ox, oy, cs) {
      const pt = new Map(), adj = new Map();
      const P = (id) => { let q = pt.get(id); if (q) return q; const cell = id >> 1, i = cell % nx, j = (cell - i) / nx; let a, b, ax, ay, bx, by; if (id & 1) { a = F[j * nx + i]; b = F[(j + 1) * nx + i]; ax = bx = i; ay = j; by = j + 1; } else { a = F[j * nx + i]; b = F[j * nx + i + 1]; ay = by = j; ax = i; bx = i + 1; } const t = (lev - a) / (b - a || 1e-9); q = [ox + (ax + (bx - ax) * t) * cs, oy + (ay + (by - ay) * t) * cs]; pt.set(id, q); return q; };
      const link = (a, b) => { (adj.get(a) || adj.set(a, []).get(a)).push(b); (adj.get(b) || adj.set(b, []).get(b)).push(a); };
      for (let j = 0; j < ny - 1; j++) for (let i = 0; i < nx - 1; i++) {
        const A = F[j * nx + i] > lev, B = F[j * nx + i + 1] > lev, C = F[(j + 1) * nx + i + 1] > lev, D = F[(j + 1) * nx + i] > lev, idx = A | (B << 1) | (C << 2) | (D << 3);
        if (idx === 0 || idx === 15) continue;
        const T = (j * nx + i) * 2, R = (j * nx + i + 1) * 2 + 1, Bo = ((j + 1) * nx + i) * 2, Le = (j * nx + i) * 2 + 1;
        const ctr = (F[j * nx + i] + F[j * nx + i + 1] + F[(j + 1) * nx + i + 1] + F[(j + 1) * nx + i]) / 4 > lev;
        switch (idx) {
          case 1: case 14: link(Le, T); break; case 2: case 13: link(T, R); break; case 3: case 12: link(Le, R); break;
          case 4: case 11: link(R, Bo); break; case 6: case 9: link(T, Bo); break; case 7: case 8: link(Le, Bo); break;
          case 5: if (ctr) { link(Le, Bo); link(T, R); } else { link(Le, T); link(R, Bo); } break;
          case 10: if (ctr) { link(Le, T); link(R, Bo); } else { link(Le, Bo); link(T, R); } break;
        }
      }
      const seen = new Set(), out = [];
      const walk = (s) => { const L = [s]; seen.add(s); let cur = s; for (;;) { const nb = (adj.get(cur) || []).find((x) => !seen.has(x)); if (nb === undefined) break; seen.add(nb); L.push(nb); cur = nb; } return L; };
      for (const [id, nb] of adj) if (nb.length === 1 && !seen.has(id)) out.push({ pts: walk(id).map(P), closed: false });
      for (const [id] of adj) if (!seen.has(id)) out.push({ pts: walk(id).map(P), closed: true });
      return out;
    }
    function chaikin(pts, closed) {
      const o = []; const n = pts.length; for (let k = 0; k < (closed ? n : n - 1); k++) { const a = pts[k], b = pts[(k + 1) % n]; o.push([a[0] * 0.75 + b[0] * 0.25, a[1] * 0.75 + b[1] * 0.25], [a[0] * 0.25 + b[0] * 0.75, a[1] * 0.25 + b[1] * 0.75]); }
      if (!closed) { o.unshift(pts[0]); o.push(pts[n - 1]); } return o;
    }

    // ——— Géométrie (repère local : fermetures verticales, largeur LW, hauteur LH) ———
    let G = null;
    function geo(w, h) {
      const hor = p.orientation === 'horizontale', LW = hor ? h : w, LH = hor ? w : h, m = Math.min(w, h), N = p.nombre | 0;
      const sp = LW / N, tl = p.taille * m, P = tl * 1.05;
      G = {
        hor, LW, LH, m, N, sp, tl, P, th: P * 0.47, tw: tl * 1.15,
        amp: Math.min(sp * 0.22, m * 0.08) * p.ondulation, fr: p.frequence,
        Gm: Math.max(tl * 0.6, sp * 0.5 - tl * 2.2) * p.ouverture, Lv: p.longueur * LH,
        yMin: tl * 2.2, yMax: LH - tl * 3.5, Ls: tl * 3.3, pad: tl * 4,
      };
      while (Z.length < N) { const k = Z.length; Z.push({ s: 0.2, sv: 0, tgt: 0.2, hold: -1, th: 0, thv: 0, nt: 0, grab: false, a: 0 }); }
      Z.length = N;
      return G;
    }
    const cx = (i, y) => G.sp * (i + 0.5) + G.amp * Math.sin(y / G.LH * TAU * G.fr + i * 1.7);
    const ysOf = (i) => G.yMin + Z[i].s * (G.yMax - G.yMin);
    const gap = (i, y, ys) => { const d = ys - y; return d <= 0 ? 0 : G.Gm * (1 - Math.exp(-3 * d / G.Lv)); };
    // matrice locale → écran (en px CSS)
    const baseM = () => G.hor ? [0, -1, 1, 0, 0, G.LW] : [1, 0, 0, 1, 0, 0];
    function toLocal(q) { return G && G.hor ? [G.LW - q.y, q.x] : [q.x, q.y]; }
    function pick(L) { if (!G) return -1; let bi = -1, bd = 1e9; for (let i = 0; i < G.N; i++) { const d = Math.abs(L[0] - cx(i, L[1])); if (d < bd) { bd = d; bi = i; } } return bd < Math.max(G.sp * 0.5, G.tl * 3) ? bi : -1; }

    // ——— Mouvement des curseurs ———
    function target(i, T) {
      const N = G.N, z = Z[i];
      if (p.mode === 'vague') return 0.5 + 0.5 * Math.sin(T * 0.9 - i * (TAU / Math.max(3, N + 1)) * 0.9);
      if (p.mode === 'vaetvient') { const u = 0.5 - 0.5 * Math.cos(T * 0.75 + i * 2.3 + (i % 2) * Math.PI); return u * u * (3 - 2 * u); }
      if (p.mode === 'ensemble') { const u = 0.5 - 0.5 * Math.cos(T * 0.6 - i * 0.12); const v = u * u * (3 - 2 * u); return v * v * (3 - 2 * v); }
      if (simT >= z.nt) { const R = Math.random(); z.ht = R < 0.3 ? 0 : R < 0.55 ? 1 : Math.random(); z.nt = simT + (0.8 + Math.random() * 2.6) / p.vitesse; }
      return z.ht ?? 0.3;
    }
    function step(dt) {
      const sub = Math.max(1, Math.ceil(dt / (1 / 120))), h = dt / sub, T = simT * p.vitesse;
      const grav = G.hor ? [-1, 0] : [0, 1], gA = G.m * 3, Lt = G.tl * 2.6, damp = 0.5 + (1 - p.balancement) * 7;
      for (let i = 0; i < G.N; i++) {
        const z = Z[i];
        if (!z.grab && simT >= z.hold) z.tgt = target(i, T);
        const k = z.grab ? 260 : 26 * Math.max(0.3, p.vitesse) * Math.max(0.3, p.vitesse), c = 2 * Math.sqrt(k) * (z.grab ? 1 : 0.85);
        const ys = ysOf(i), sl = (cx(i, ys + 1) - cx(i, ys - 1)) / 2;
        for (let s = 0; s < sub; s++) {
          const a = k * (z.tgt - z.s) - c * z.sv; z.sv += a * h; z.s += z.sv * h;
          if (z.s < 0) { z.s = 0; z.sv = Math.max(0, z.sv); } if (z.s > 1) { z.s = 1; z.sv = Math.min(0, z.sv); }
          const ay = a * (G.yMax - G.yMin), Fx = grav[0] * gA - sl * ay, Fy = grav[1] * gA - ay;
          const tha = (Fx * Math.cos(z.th) - Fy * Math.sin(z.th)) / Lt - damp * z.thv;
          z.thv += tha * h; z.th += z.thv * h;
        }
      }
    }

    // ——— Doublure (repère écran, mise en cache) ———
    function underlay(w, h, dpr) {
      buildLogo();
      const key = [w, h, dpr, p.motif, p.dessous, p.encre, p.echelle, logoKey, p.orientation].join('|'); if (key === ulKey) return UL; ulKey = key;
      UL = UL || document.createElement('canvas'); UL.width = Math.round(w * dpr); UL.height = Math.round(h * dpr);
      const g = UL.getContext('2d'); g.setTransform(dpr, 0, 0, dpr, 0, 0); g.fillStyle = p.dessous; g.fillRect(0, 0, w, h);
      g.fillStyle = p.encre; const m = Math.min(w, h);
      for (const [x, y, s, r] of motifItems(w, h)) { g.save(); g.translate(x, y); g.rotate(r); g.scale(s, s); g.beginPath(); for (const lp of logoM) { lp.forEach((q, k) => k ? g.lineTo(q[0], q[1]) : g.moveTo(q[0], q[1])); g.closePath(); } g.fill('evenodd'); g.restore(); }
      if (p.motif === 'rayures') { const sw = m * 0.05 * p.echelle; g.save(); g.translate(w / 2, h / 2); g.rotate(-Math.PI / 4); const R = Math.hypot(w, h) / 2 + sw; for (let x = -R; x < R; x += sw * 2) g.fillRect(x, -R, sw, R * 2); g.restore(); }
      return UL;
    }
    function motifItems(w, h) {
      const m = Math.min(w, h), out = [];
      if (p.motif === 'logo') out.push([w / 2, h / 2, m * p.echelle, 0]);
      else if (p.motif === 'logos') { const s = m * 0.24 * p.echelle, st = s * 1.45; for (let j = 0, y = st * 0.4; y < h + st; j++, y += st) for (let x = (j % 2) * st / 2 - st * 0.1; x < w + st; x += st) out.push([x, y, s, 0]); }
      return out;
    }

    // ——— Textures et sprites ———
    function texture(dpr) {
      const key = [p.trame, dpr].join('|'); if (key === txKey) return TX; txKey = key;
      const R = rng(11), S = p.trame === 'cuir' ? 160 : p.trame === 'toile' ? 6 : 8, c = document.createElement('canvas'); c.width = c.height = Math.round(S * dpr);
      const g = c.getContext('2d'); g.scale(dpr, dpr);
      if (p.trame === 'serge') { g.lineWidth = 1.6; for (let k = -2; k < 3; k++) { g.strokeStyle = 'rgba(0,0,0,0.22)'; g.beginPath(); g.moveTo(k * S - 1, -1); g.lineTo(k * S + S + 1, S + 1); g.stroke(); g.strokeStyle = 'rgba(255,255,255,0.09)'; g.beginPath(); g.moveTo(k * S + S / 2 - 1, -1); g.lineTo(k * S + S * 1.5 + 1, S + 1); g.stroke(); } }

        const body = `M${f(-Wt / 2)} ${f(-Ls * 0.5)}L${f(Wt / 2)} ${f(-Ls * 0.5)}Q${f(Wt / 2 + tl * 0.1)} ${f(Ls * 0.1)} ${f(Wb / 2)} ${f(Ls * 0.5)}L${f(-Wb / 2)} ${f(Ls * 0.5)}Q${f(-Wt / 2 - tl * 0.1)} ${f(Ls * 0.1)} ${f(-Wt / 2)} ${f(-Ls * 0.5)}Z`;
        s += `<g transform="translate(${f(x)} ${f(ys)}) rotate(${f(-Math.atan(sl) * 180 / Math.PI)})"><path d="${body}" fill="#000" opacity="0.3" transform="translate(${f(tl * 0.18)} ${f(tl * 0.3)})"/><path d="${body}" fill="url(#met)" stroke="${M.d}" stroke-width="${f(tl * 0.06)}"/><path d="M${f(-tl * 0.45)} ${f(-Ls * 0.5)}L${f(tl * 0.45)} ${f(-Ls * 0.5)}L0 ${f(-Ls * 0.18)}Z" fill="${mix(M.d, '#000000', 0.35)}"/><rect x="${f(-tl * 0.42)}" y="${f(-Ls * 0.22)}" width="${f(tl * 0.84)}" height="${f(Ls * 0.5)}" rx="${f(tl * 0.3)}" fill="${M.b}" stroke="${M.d}" stroke-width="${f(tl * 0.06)}"/></g>`;
        const L = tl * 3.8, th = Z[i].th * 180 / Math.PI;
        let tab;
        if (p.tirette === 'anneau') { const r = tl * 1.15, cy = L * 0.55; tab = `<path d="M0 ${f(-tl * 0.15)}V${f(cy - r)}" stroke="${M.d}" stroke-width="${f(tl * 0.36)}"/><circle cy="${f(cy)}" r="${f(r)}" fill="none" stroke="${M.d}" stroke-width="${f(tl * 0.42)}"/><circle cy="${f(cy)}" r="${f(r)}" fill="none" stroke="${M.b}" stroke-width="${f(tl * 0.26)}"/>`; }
        else if (p.tirette === 'cordon') { const cL = L * 0.95, kr = tl * 0.62; tab = `<path d="M${f(-tl * 0.2)} 0Q${f(-tl * 0.5)} ${f(cL * 0.6)} 0 ${f(cL)}Q${f(tl * 0.5)} ${f(cL * 0.6)} ${f(tl * 0.2)} 0" fill="none" stroke="${mix(p.ruban, '#000000', 0.2)}" stroke-width="${f(tl * 0.42)}" stroke-linecap="round"/><ellipse cy="${f(cL * 0.62)}" rx="${f(kr * 0.85)}" ry="${f(kr * 1.15)}" fill="${M.b}"/>`; }
        else { const wt = tl * 0.95, wb = tl * 1.45; tab = `<path fill-rule="evenodd" fill="url(#met)" stroke="${M.d}" stroke-width="${f(tl * 0.06)}" d="M${f(-wt / 2)} ${f(-tl * 0.45)}L${f(wt / 2)} ${f(-tl * 0.45)}L${f(wb / 2)} ${f(L - wb / 2)}A${f(wb / 2)} ${f(wb / 2)} 0 0 1 ${f(-wb / 2)} ${f(L - wb / 2)}Z M${f(-tl * 0.28)} ${f(L * 0.52 + tl * 0.28)}A${f(tl * 0.28)} ${f(tl * 0.28)} 0 0 1 ${f(tl * 0.28)} ${f(L * 0.52 + tl * 0.28)}V${f(L * 0.82 - tl * 0.28)}A${f(tl * 0.28)} ${f(tl * 0.28)} 0 0 1 ${f(-tl * 0.28)} ${f(L * 0.82 - tl * 0.28)}Z"/>`; }
        s += `<g transform="translate(${f(x)} ${f(ys + G.Ls * 0.02)}) rotate(${f(-th)})">${tab}</g>`;
      }
      s += '</g>';
      return `<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><defs>${defs}</defs>${s}</svg>`;
    }
  </script>
