<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Taquin</title>
  <link rel="stylesheet" href="../../assets/ui/atelier.css">
</head>
<body>
  <canvas></canvas>
  <script src="../../assets/ui/atelier.js"></script>
  <script>
    // Taquin : une grille n×n de pièces et un trou. Chaque coup échange le trou avec une pièce voisine.
    // Le mélange joue des coups au hasard (sans revenir sur le précédent) et les empile dans un historique ;
    // la résolution dépile l'historique et rejoue chaque coup à l'envers. Les coups joués à la main entrent
    // dans le même historique, donc la résolution défait aussi ce que l'on a fait. Une fois l'image
    // recomposée, la dernière pièce vient boucher le trou et un reflet passe sur le plateau.
    const canvas = document.querySelector('canvas');
    const ctx = canvas.getContext('2d');
    const TAU = Math.PI * 2;
    const PAL = (k) => Atelier.PALETTES[k].colors;
    const BIT = PAL('bitmap'), KEG = PAL('kegelbahn'), LUZ = PAL('luzern'), MEN = PAL('menthe'), THE = PAL('thermique');

    let simT = 0, vKey = '', logoM = null, logoKey = '', ptr = null, B = [], gKey = '', IMG = null, imgKey = '', SP = null, spKey = '', BG = null, bgKey = '';

    const app = Atelier.app({
      stage: canvas,
      animate: true,
      seed: true,
      finish: { grain: 0.04, vignette: 0.18 },
      hint: 'Cliquez une pièce alignée avec le trou pour la faire glisser · clic hors du plateau : mélanger ou résoudre · molette : nombre de cases',
      notes: 'Le taquin est un plateau de pièces carrées avec une seule case vide : on ne peut que pousser une pièce voisine dans le trou. Ici, les pièces forment le logo de la marque sur un fond à motif. Le plateau se mélange coup par coup, puis se résout en rejouant chaque coup à l\'envers, y compris ceux que vous avez joués vous-même, jusqu\'à ce que la dernière pièce vienne boucher le trou. Cliquez une pièce alignée avec le trou pour la faire glisser.',
      params: {
        'Plateau': {
          cases: { type: 'range', label: 'Cases par côté', min: 3, max: 10, step: 1, value: 4 },
          plateaux: { type: 'segmented', label: 'Plateaux', options: { 1: 'Un', 2: 'Deux', 4: 'Quatre' }, value: '1' },
          coups: { type: 'range', label: 'Coups de mélange', min: 6, max: 240, step: 1, value: 60 },
          vitesse: { type: 'range', label: 'Vitesse', min: 0.2, max: 4, step: 0.01, value: 1 },
          espace: { type: 'range', label: 'Jeu entre pièces', min: 0, max: 0.12, step: 0.002, value: 0.03 },
          arrondi: { type: 'range', label: 'Arrondi', min: 0, max: 0.4, step: 0.01, value: 0.1 },
        },
        'Pièces': {
          matiere: { type: 'segmented', label: 'Matière', options: { bois: 'Bois', plastique: 'Plastique', plat: 'Plat' }, value: 'plastique' },
          motif: { type: 'select', label: 'Image', options: { uni: 'Logo sur fond uni', rayures: 'Logo sur rayures', cercles: 'Logo sur cercles', degrade: 'Logo sur dégradé', damier: 'Logo sur damier' }, value: 'cercles' },
          echelle: { type: 'range', label: 'Taille du logo', min: 0.2, max: 1, step: 0.01, value: 0.72 },
          couleurs: { type: 'palette', label: 'Couleurs', value: ['#16161a', '#f2c230', '#e5452a', '#f4f1ea'] },
          image: { type: 'file', label: 'Logo', accept: 'image/*' },
        },
        'Cadre': {
          cadre: { type: 'color', label: 'Cadre', value: '#2b2b30' },
          fond: { type: 'color', label: 'Fond', value: '#d9d4c9' },
        },
      },
      presets: {
        'Quinze': {},
        'Huit': { cases: 3, coups: 30, matiere: 'bois', motif: 'uni', couleurs: ['#3a2414', '#e9d3a8'], cadre: '#5a3a22', fond: '#efe7d8', arrondi: 0.06 },
        'Grand plateau': { cases: 8, coups: 200, vitesse: 2.6, motif: 'degrade', couleurs: ['#f4f1ea', '#3c4fd0', '#a047ab', '#e5452a'], espace: 0.02, fond: '#16161a', cadre: '#0a0a0a' },
        'Quatre plateaux': { plateaux: '4', cases: 4, coups: 40, vitesse: 1.6, motif: 'rayures', couleurs: ['#16161a', '#e5452a', '#f2c230'] },
        'Deux plateaux': { plateaux: '2', cases: 5, coups: 80, motif: 'damier', couleurs: ['#f4f1ea', '#2f5fd0', '#16161a'], matiere: 'plat', arrondi: 0.02, fond: '#f2c230', cadre: '#16161a' },
        'Bois': { matiere: 'bois', cases: 4, motif: 'cercles', couleurs: ['#2e1c10', '#c99b5f', '#8a5a32'], cadre: '#4a2e18', fond: '#d8c3a0', arrondi: 0.05 },
        'Bonbons': { matiere: 'plastique', arrondi: 0.32, espace: 0.06, cases: 5, motif: 'rayures', couleurs: ['#f4f1ea', '#e57d9e', '#f2b0c8', '#e5502a'], cadre: '#e57d9e', fond: '#fde6ee' },
        'Bitmap': { motif: 'damier', couleurs: [BIT[1], BIT[0], BIT[3], BIT[2]], fond: BIT[0], cadre: BIT[1], matiere: 'plat', cases: 6, coups: 120, vitesse: 2 },
        'Kegelbahn': { motif: 'cercles', couleurs: [KEG[0], KEG[1], KEG[2], KEG[3]], fond: KEG[3], cadre: KEG[0], cases: 4, plateaux: '2' },
        'Thermique': { motif: 'degrade', couleurs: [THE[6], THE[1], THE[4], THE[2], THE[3]], fond: THE[0], cadre: '#1a1a20', cases: 6, coups: 100, vitesse: 1.8 },
      },
      brand(colors) {
        const s = colors.slice().sort((a, b) => lum(a) - lum(b)), D = s[0], L = s[s.length - 1];
        return { couleurs: [D].concat(s.slice(1)), cadre: D, fond: L };
      },
      pointer: {
        down: (q) => { ptr = { x: q.x, y: q.y }; },
        up: (q) => {
          if (!ptr) return; const x = ptr.x, y = ptr.y; ptr = null;
          for (const b of B) {
            if (x < b.x || y < b.y || x > b.x + b.S || y > b.y + b.S) continue;
            const n = b.n, i = Math.floor((x - b.x - b.pad) / b.cs), j = Math.floor((y - b.y - b.pad) / b.cs); if (i < 0 || j < 0 || i >= n || j >= n) return;
            if (b.busy()) return; const hi = b.hole % n, hj = Math.floor(b.hole / n);
            if ((i === hi) !== (j === hj)) { b.user = simT + 4; b.ph = 'jeu'; const steps = Math.abs(i - hi) + Math.abs(j - hj), di = Math.sign(i - hi), dj = Math.sign(j - hj); for (let k = 0; k < steps; k++) b.move((hj + dj * (k + 1)) * n + hi + di * (k + 1), true, 0.14, k === steps - 1); }
            return;
          }
          for (const b of B) { b.user = simT + 1; if (b.ph === 'jeu' || b.ph === 'melange') { b.ph = 'resout'; } else if (b.ph !== 'resout') { b.ph = 'melange'; b.left = Math.round(p.coups); b.fill = 0; } }
        },
        wheel: (q, dy) => app.set('cases', Math.max(3, Math.min(10, p.cases + (dy > 0 ? -1 : 1)))),
      },
      onChange(k) { if (['*', 'image'].includes(k)) logoKey = ''; },
      export: { name: 'taquin', svg: () => toSVG() },
    });
    const p = app.params;

    function hex(x) { const n = parseInt(x.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
    function lum(x) { const c = hex(x); return (c[0] * 0.299 + c[1] * 0.587 + c[2] * 0.114) / 255; }
    function mix(a, b, t) { const A = hex(a), C = hex(b); return '#' + A.map((v, i) => Math.round(v + (C[i] - v) * t).toString(16).padStart(2, '0')).join(''); }
    function rng(s) { let a = s >>> 0; return () => { a = (a + 0x6d2b79f5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
    const pal = () => (p.couleurs.length ? p.couleurs : ['#16161a', '#f2c230']);
    const ease = (u) => u < 0.5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2;

    function buildLogo() {
      const img0 = p.image || app.logoImg, key = img0 ? (img0.src || 'c') : 'demo'; if (key === logoKey) return; logoKey = key; vKey = '';
      const M = 200, c = document.createElement('canvas'); c.width = c.height = M; const x = c.getContext('2d', { willReadFrequently: true }), L = M * 0.94, cx = M / 2;
      if (img0) { const iw = img0.naturalWidth || img0.width, ih = img0.naturalHeight || img0.height, s = L / Math.max(iw, ih); x.drawImage(img0, cx - iw * s / 2, cx - ih * s / 2, iw * s, ih * s); }
      else { x.fillStyle = '#000'; x.beginPath(); x.arc(cx, cx, L * 0.48, 0, TAU); x.arc(cx, cx, L * 0.27, 0, TAU, true); x.fill('evenodd'); x.fillRect(cx - L * 0.07, cx - L * 0.5, L * 0.14, L); }
      const d = x.getImageData(0, 0, M, M).data; let transp = 0; for (let i = 3; i < d.length; i += 4) if (d[i] < 128) transp++; const useA = transp > M * M * 0.05;
      const F = new Float64Array(M * M); for (let i = 0; i < M * M; i++) { const o = i * 4, l = (d[o] * 0.2126 + d[o + 1] * 0.7152 + d[o + 2] * 0.0722) / 255; F[i] = useA ? d[o + 3] / 255 : (d[o + 3] / 255) * Math.min(1, Math.max(0, (0.75 - l) * 2)); }
      { const G2 = new Float64Array(M * M); for (let j = 1; j < M - 1; j++) for (let i = 1; i < M - 1; i++) { let a = 0; for (let b = -1; b <= 1; b++) for (let c = -1; c <= 1; c++) a += F[(j + b) * M + i + c] * (b || c ? (b && c ? 1 : 2) : 4); G2[j * M + i] = a / 16; } F.set(G2); }
      for (let k = 0; k < M; k++) F[k] = F[(M - 1) * M + k] = F[k * M] = F[k * M + M - 1] = 0;
      logoM = contours(F, M, M, 0.5, 0, 0, 1).filter((c) => c.closed && c.pts.length > 6).map((c) => chaikin(chaikin(c.pts, true), true).map((q) => [q[0] / M - 0.5, q[1] / M - 0.5]));
    }
    // carrés marchants + chaînage
    function contours(F, nx, ny, lev, ox, oy, cs) {
      const pt = new Map(), adj = new Map();
      const P = (id) => { let q = pt.get(id); if (q) return q; const cell = id >> 1, i = cell % nx, j = (cell - i) / nx; let a, b, ax, ay, bx, by; if (id & 1) { a = F[j * nx + i]; b = F[(j + 1) * nx + i]; ax = bx = i; ay = j; by = j + 1; } else { a = F[j * nx + i]; b = F[j * nx + i + 1]; ay = by = j; ax = i; bx = i + 1; } const t = (lev - a) / (b - a || 1e-9); q = [ox + (ax + (bx - ax) * t) * cs, oy + (ay + (by - ay) * t) * cs]; pt.set(id, q); return q; };
      const link = (a, b) => { (adj.get(a) || adj.set(a, []).get(a)).push(b); (adj.get(b) || adj.set(b, []).get(b)).push(a); };
      for (let j = 0; j < ny - 1; j++) for (let i = 0; i < nx - 1; i++) {
        const A = F[j * nx + i] > lev, B = F[j * nx + i + 1] > lev, C = F[(j + 1) * nx + i + 1] > lev, D = F[(j + 1) * nx + i] > lev, idx = A | (B << 1) | (C << 2) | (D << 3);
        if (idx === 0 || idx === 15) continue;
        const T = (j * nx + i) * 2, R = (j * nx + i + 1) * 2 + 1, Bo = ((j + 1) * nx + i) * 2, Le = (j * nx + i) * 2 + 1;
        const ctr = (F[j * nx + i] + F[j * nx + i + 1] + F[(j + 1) * nx + i + 1] + F[(j + 1) * nx + i]) / 4 > lev;
        switch (idx) {
          case 1: case 14: link(Le, T); break; case 2: case 13: link(T, R); break; case 3: case 12: link(Le, R); break;
          case 4: case 11: link(R, Bo); break; case 6: case 9: link(T, Bo); break; case 7: case 8: link(Le, Bo); break;
          case 5: if (ctr) { link(Le, Bo); link(T, R); } else { link(Le, T); link(R, Bo); } break;
          case 10: if (ctr) { link(Le, T); link(R, Bo); } else { link(Le, Bo); link(T, R); } break;
        }
      }
      const seen = new Set(), out = [];
      const walk = (s) => { const L = [s]; seen.add(s); let cur = s; for (;;) { const nb = (adj.get(cur) || []).find((x) => !seen.has(x)); if (nb === undefined) break; seen.add(nb); L.push(nb); cur = nb; } return L; };
      for (const [id, nb] of adj) if (nb.length === 1 && !seen.has(id)) out.push({ pts: walk(id).map(P), closed: false });
      for (const [id] of adj) if (!seen.has(id)) out.push({ pts: walk(id).map(P), closed: true });
      return out;
    }
    function chaikin(pts, closed) {
      const o = []; const n = pts.length; for (let k = 0; k < (closed ? n : n - 1); k++) { const a = pts[k], b = pts[(k + 1) % n]; o.push([a[0] * 0.75 + b[0] * 0.25, a[1] * 0.75 + b[1] * 0.25], [a[0] * 0.25 + b[0] * 0.75, a[1] * 0.25 + b[1] * 0.75]); }
      if (!closed) { o.unshift(pts[0]); o.push(pts[n - 1]); } return o;
    }

    // ——— Image du puzzle : tracée une fois pour le canvas et pour le SVG ———
    function artOps(W) {
      const C = pal(), nc = C.length, L = C[0], bg = C.slice(1).length ? C.slice(1) : ['#f4f1ea'], ops = [];
      ops.push({ t: 'rect', x: 0, y: 0, w: W, h: W, c: bg[0] });
      if (p.motif === 'rayures') { const s = W / 10; for (let k = -12, q = 0; k < 12; k++, q++) ops.push({ t: 'poly', c: bg[q % bg.length], pts: [[k * s, 0], [k * s + s, 0], [k * s + s + W, W], [k * s + W, W]] }); }
      else if (p.motif === 'cercles') { for (let k = 9; k >= 1; k--) ops.push({ t: 'circ', x: W / 2, y: W / 2, r: W * 0.78 * k / 9, c: bg[k % bg.length] }); }
      else if (p.motif === 'damier') { const s = W / 6; for (let j = 0; j < 6; j++) for (let i = 0; i < 6; i++) if ((i + j) % 2) ops.push({ t: 'rect', x: i * s, y: j * s, w: s, h: s, c: bg[(1 + Math.floor((i + j * 6) / 2)) % bg.length] || bg[0] }); }
      else if (p.motif === 'degrade') ops.push({ t: 'grad', stops: bg });
      if (p.motif !== 'uni' && bg.length === 1) ops.push({ t: 'circ', x: W / 2, y: W / 2, r: W * 0.42 * p.echelle + W * 0.06, c: mix(bg[0], L, 0.15) });
      ops.push({ t: 'logo', x: W / 2, y: W / 2, s: W * p.echelle, c: L });
      return ops;
    }
    function paintArt(g, W) {
      for (const o of artOps(W)) {
        g.fillStyle = o.c || '#000';
        if (o.t === 'rect') g.fillRect(o.x, o.y, o.w, o.h);
        else if (o.t === 'poly') { g.beginPath(); o.pts.forEach((q, k) => k ? g.lineTo(q[0], q[1]) : g.moveTo(q[0], q[1])); g.fill(); }
        else if (o.t === 'circ') { g.beginPath(); g.arc(o.x, o.y, o.r, 0, TAU); g.fill(); }
        else if (o.t === 'grad') { const gr = g.createLinearGradient(0, 0, W, W); o.stops.forEach((c, k) => gr.addColorStop(k / Math.max(1, o.stops.length - 1), c)); g.fillStyle = gr; g.fillRect(0, 0, W, W); }
        else { g.beginPath(); for (const lp of logoM) { lp.forEach((q, k) => k ? g.lineTo(o.x + q[0] * o.s, o.y + q[1] * o.s) : g.moveTo(o.x + q[0] * o.s, o.y + q[1] * o.s)); g.closePath(); } g.fill('evenodd'); }
      }
    }

    // ——— Plateaux ———
    function Board(k, x, y, S) {
      const n = p.cases | 0, pad = S * 0.045, cs = (S - pad * 2) / n, R = rng(app.seed * 13 + k * 101);
      const b = { k, x, y, S, n, pad, cs, R, hole: n * n - 1, cell: [], tiles: [], hist: [], last: -1, ph: 'pause', tp: simT + k * 0.7, left: 0, user: -1, fill: 1, shine: -9 };
      for (let t = 0; t < n * n - 1; t++) { b.cell[t] = t; b.tiles.push({ id: t, at: t, from: t, t0: -9, d: 0.1 }); }
      b.cell[n * n - 1] = -1;
      b.busy = () => b.tiles.some((t) => simT < t.t0 + t.d);
      b.move = (c, user, d, last) => {
        const id = b.cell[c]; if (id < 0) return; const tl = b.tiles[id], hole = b.hole;
        tl.from = c; tl.at = hole; tl.t0 = simT; tl.d = d; b.cell[hole] = id; b.cell[c] = -1; b.hole = c;
        if (user !== 'undo') b.hist.push(hole);
      };
      b.solved = () => b.cell.every((v, i) => v === (i === n * n - 1 ? -1 : i));
      return b;
    }
    function layout(w, h) {
      const np = +p.plateaux || 1, m = Math.min(w, h); B = [];
      if (np === 1) { const S = m * 0.84; B.push(Board(0, w / 2 - S / 2, h / 2 - S / 2, S)); }
      else if (np === 2) { const hor = w >= h, S = Math.min(hor ? w * 0.44 : w * 0.84, hor ? h * 0.84 : h * 0.44); for (let k = 0; k < 2; k++) B.push(Board(k, hor ? w / 2 + (k ? S * 0.06 : -S * 1.06) : w / 2 - S / 2, hor ? h / 2 - S / 2 : h / 2 + (k ? S * 0.06 : -S * 1.06), S)); }
      else { const S = Math.min(w, h) * 0.42; for (let k = 0; k < 4; k++) B.push(Board(k, w / 2 + (k % 2 ? S * 0.05 : -S * 1.05), h / 2 + (k > 1 ? S * 0.05 : -S * 1.05), S)); }
    }
    function step(b) {

      else if (b.ph === 'retire') { b.fill = Math.max(0, 1 - (simT - b.tp) / (0.35 / sp)); if (b.fill <= 0) { b.ph = 'melange'; b.left = Math.round(p.coups); } }

    // ——— Sprites des pièces ———
    function sprites(dpr) {

      const b0 = B[0], n = b0.n, cs = b0.cs, S = b0.S, gp = cs * p.espace, ts = cs - gp, rad = ts * p.arrondi;

      const W = cs * n, art = document.createElement('canvas'); art.width = Math.ceil(W * dpr); art.height = Math.ceil(W * dpr); { const g = art.getContext('2d'); g.scale(dpr, dpr); paintArt(g, W); }

        g.save(); g.filter = `blur(${cs * 0.03 * dpr}px)`; g.fillStyle = 'rgba(0,0,0,0.45)'; g.translate(cs * 0.02, cs * 0.04); shp(); g.fill(); g.restore();
        g.save(); shp(); g.clip(); g.drawImage(art, (i * cs + gp / 2) * dpr, (j * cs + gp / 2) * dpr, ts * dpr, ts * dpr, 0, 0, ts, ts);
        if (p.matiere === 'bois') { g.globalCompositeOperation = 'multiply'; for (let k = 0; k < 22; k++) { const y = R() * ts, am = ts * 0.03; g.strokeStyle = `rgba(90,60,30,${0.12 + R() * 0.15})`; g.lineWidth = 0.5 + R() * 1.5; g.beginPath(); for (let x = 0; x <= ts; x += 4) { const v = y + Math.sin(x * 0.05 + k) * am; x ? g.lineTo(x, v) : g.moveTo(x, v); } g.stroke(); } g.globalCompositeOperation = 'source-over'; }

          const bw = ts * (p.matiere === 'bois' ? 0.06 : 0.08);
          const l = g.createLinearGradient(0, 0, ts, ts); l.addColorStop(0, 'rgba(255,255,255,0.45)'); l.addColorStop(0.5, 'rgba(255,255,255,0)'); l.addColorStop(1, 'rgba(0,0,0,0.45)');
          g.strokeStyle = l; g.lineWidth = bw * 2; shp(); g.stroke();
          if (p.matiere === 'plastique') { const hl = g.createLinearGradient(0, 0, 0, ts * 0.5); hl.addColorStop(0, 'rgba(255,255,255,0.28)'); hl.addColorStop(1, 'rgba(255,255,255,0)'); g.fillStyle = hl; g.beginPath(); g.roundRect(bw, bw, ts - bw * 2, ts * 0.42, Math.max(0, rad - bw)); g.fill(); }
        }
        g.restore(); g.strokeStyle = 'rgba(0,0,0,0.35)'; g.lineWidth = Math.max(0.5, cs * 0.008); shp(); g.stroke();
        tiles.push(c);
      }
      SP = { tiles, pad, ts, gp, art }; return SP;
    }
    function backdrop(w, h, dpr) {
      const key = [w, h, dpr, p.fond, p.cadre, B.map((b) => [b.x, b.y, b.S].join(',')).join(';')].join('|'); if (key === bgKey) return BG; bgKey = key;
      BG = BG || document.createElement('canvas'); BG.width = Math.round(w * dpr); BG.height = Math.round(h * dpr);
      const g = BG.getContext('2d'), m = Math.min(w, h); g.setTransform(dpr, 0, 0, dpr, 0, 0); g.fillStyle = p.fond; g.fillRect(0, 0, w, h);
      const gr = g.createRadialGradient(w / 2, h / 2, m * 0.1, w / 2, h / 2, Math.hypot(w, h) * 0.6); gr.addColorStop(0, 'rgba(255,255,255,0.1)'); gr.addColorStop(1, 'rgba(0,0,0,0.14)'); g.fillStyle = gr; g.fillRect(0, 0, w, h);
      for (const b of B) {
        const r = b.S * 0.05;
        g.save(); g.filter = `blur(${b.S * 0.02}px)`; g.fillStyle = 'rgba(0,0,0,0.35)'; g.beginPath(); g.roundRect(b.x + b.S * 0.01, b.y + b.S * 0.025, b.S, b.S, r); g.fill(); g.restore();
        const fr = g.createLinearGradient(b.x, b.y, b.x + b.S, b.y + b.S); fr.addColorStop(0, mix(p.cadre, '#ffffff', 0.18)); fr.addColorStop(1, mix(p.cadre, '#000000', 0.25));
        g.fillStyle = fr; g.beginPath(); g.roundRect(b.x, b.y, b.S, b.S, r); g.fill();
        const ix = b.x + b.pad * 0.7, iw = b.S - b.pad * 1.4;
        g.fillStyle = mix(p.cadre, '#000000', 0.45); g.beginPath(); g.roundRect(ix, ix - b.x + b.y, iw, iw, r * 0.5); g.fill();
        g.save(); g.beginPath(); g.roundRect(ix, ix - b.x + b.y, iw, iw, r * 0.5); g.clip(); g.strokeStyle = 'rgba(0,0,0,0.5)'; g.lineWidth = b.pad * 0.6; g.filter = `blur(${b.pad * 0.25}px)`; g.beginPath(); g.roundRect(ix - b.pad * 0.1, ix - b.x + b.y - b.pad * 0.1, iw, iw, r * 0.5); g.stroke(); g.restore();
      }
      return BG;
    }

    app.loop((t, dt) => {
      dt = Math.min(1 / 20, dt || 0);
      const { w, h, dpr } = app.size; buildLogo();
      const key = [w, h, p.cases, p.plateaux, app.seed].join('|'); if (!B.length || key !== gKey) { gKey = key; layout(w, h); }
      if (app.thumbnail) { if (!B.th) { B.th = true; for (let k = 0; k < 6000; k++) { simT += 1 / 60; for (const b of B) step(b); if (B[0].ph === 'resout' && B[0].hist.length < Math.round(p.coups) * 0.55) break; } for (const b of B) for (const tl of b.tiles) tl.t0 = -9; } }
      else { simT += dt; for (const b of B) step(b); }
      const SPR = sprites(dpr), ts = SPR.ts, pd = SPR.pad;
      ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.drawImage(backdrop(w, h, dpr), 0, 0);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      for (const b of B) {
        const n = b.n, cs = b.cs, ox = b.x + b.pad + SPR.gp / 2, oy = b.y + b.pad + SPR.gp / 2, moving = [];
        for (const tl of b.tiles) {
          if (tl.id === n * n - 1) continue;
          const u = Math.min(1, Math.max(0, (simT - tl.t0) / tl.d)); if (u < 1) { moving.push(tl); continue; }
          ctx.drawImage(SPR.tiles[tl.id], ox + (tl.at % n) * cs - pd, oy + Math.floor(tl.at / n) * cs - pd, ts + pd * 2, ts + pd * 2);
        }
        for (const tl of moving) {
          const u = ease(Math.min(1, (simT - tl.t0) / tl.d)), fx = tl.from % n, fy = Math.floor(tl.from / n), tx = tl.at % n, ty = Math.floor(tl.at / n);
          ctx.drawImage(SPR.tiles[tl.id], ox + (fx + (tx - fx) * u) * cs - pd, oy + (fy + (ty - fy) * u) * cs - pd, ts + pd * 2, ts + pd * 2);
        }
        if (b.fill > 0) { const id = n * n - 1, sc = 1 + (1 - b.fill) * 0.35; ctx.save(); ctx.globalAlpha = b.fill; const cx = ox + (n - 1) * cs + ts / 2, cy = oy + (n - 1) * cs + ts / 2; ctx.translate(cx, cy); ctx.scale(sc, sc); ctx.drawImage(SPR.tiles[id], -ts / 2 - pd, -ts / 2 - pd, ts + pd * 2, ts + pd * 2); ctx.restore(); }
        const su = (simT - b.shine) * p.vitesse / 0.9;
        if (su >= 0 && su <= 1) { ctx.save(); ctx.beginPath(); ctx.rect(b.x + b.pad, b.y + b.pad, b.S - b.pad * 2, b.S - b.pad * 2); ctx.clip(); const X = b.x - b.S * 0.5 + su * b.S * 2, gr = ctx.createLinearGradient(X - b.S * 0.25, 0, X + b.S * 0.25, 0); gr.addColorStop(0, 'rgba(255,255,255,0)'); gr.addColorStop(0.5, 'rgba(255,255,255,0.35)'); gr.addColorStop(1, 'rgba(255,255,255,0)'); ctx.fillStyle = gr; ctx.setTransform(dpr, 0, -0.4 * dpr, dpr, 0.4 * (b.y + b.S / 2) * dpr, 0); ctx.fillRect(X - b.S * 0.25, b.y, b.S * 0.5, b.S); ctx.restore(); }
      }
      app.finish(ctx);
    });

    function toSVG() {
      const { w, h } = app.size, f = (v) => +v.toFixed(2); buildLogo();
      const b0 = B[0], cs = b0.cs, n = b0.n, gp = cs * p.espace, ts = cs - gp, rad = ts * p.arrondi, W = cs * n;
      let art = '';
      for (const o of artOps(W)) {
        if (o.t === 'rect') art += `<rect x="${f(o.x)}" y="${f(o.y)}" width="${f(o.w)}" height="${f(o.h)}" fill="${o.c}"/>`;
        else if (o.t === 'poly') art += `<path fill="${o.c}" d="M${o.pts.map((q) => f(q[0]) + ' ' + f(q[1])).join('L')}Z"/>`;
        else if (o.t === 'circ') art += `<circle cx="${f(o.x)}" cy="${f(o.y)}" r="${f(o.r)}" fill="${o.c}"/>`;
        else if (o.t === 'grad') art += `<rect width="${f(W)}" height="${f(W)}" fill="url(#deg)"/>`;
        else art += `<path fill="${o.c}" fill-rule="evenodd" d="${logoM.map((lp) => 'M' + lp.map((q) => f(o.x + q[0] * o.s) + ' ' + f(o.y + q[1] * o.s)).join('L') + 'Z').join('')}"/>`;
      }
      const bg = pal().slice(1).length ? pal().slice(1) : ['#f4f1ea'];
      let defs = `<linearGradient id="deg" x1="0" y1="0" x2="1" y2="1">${bg.map((c, k) => `<stop offset="${f(k / Math.max(1, bg.length - 1))}" stop-color="${c}"/>`).join('')}</linearGradient><linearGradient id="bis" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="0.45"/><stop offset="0.5" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity="0.45"/></linearGradient><g id="art">${art}</g><clipPath id="piece"><rect width="${f(ts)}" height="${f(ts)}" rx="${f(rad)}"/></clipPath><filter id="flou" x="-0.2" y="-0.2" width="1.4" height="1.4"><feGaussianBlur stdDeviation="${f(cs * 0.03)}"/></filter>`;
      let s = `<rect width="100%" height="100%" fill="${p.fond}"/>`;
      for (const b of B) {
        const r = b.S * 0.05, ix = b.pad * 0.7, iw = b.S - b.pad * 1.4, ox = b.x + b.pad + gp / 2, oy = b.y + b.pad + gp / 2;
        s += `<rect x="${f(b.x)}" y="${f(b.y)}" width="${f(b.S)}" height="${f(b.S)}" rx="${f(r)}" fill="${p.cadre}"/><rect x="${f(b.x + ix)}" y="${f(b.y + ix)}" width="${f(iw)}" height="${f(iw)}" rx="${f(r * 0.5)}" fill="${mix(p.cadre, '#000000', 0.45)}"/>`;
        for (const tl of b.tiles.concat(b.fill >= 0.5 ? [{ id: n * n - 1 }] : [])) {
          const at = tl.id === n * n - 1 ? n * n - 1 : tl.at, i = tl.id % n, j = Math.floor(tl.id / n), x = ox + (at % n) * cs, y = oy + Math.floor(at / n) * cs;
          s += `<g transform="translate(${f(x)} ${f(y)})"><rect x="${f(cs * 0.02)}" y="${f(cs * 0.04)}" width="${f(ts)}" height="${f(ts)}" rx="${f(rad)}" fill="#000" opacity="0.4" filter="url(#flou)"/><g clip-path="url(#piece)"><use href="#art" transform="translate(${f(-(i * cs + gp / 2))} ${f(-(j * cs + gp / 2))})"/>${p.matiere !== 'plat' ? `<rect width="${f(ts)}" height="${f(ts)}" rx="${f(rad)}" fill="none" stroke="url(#bis)" stroke-width="${f(ts * 0.16)}"/>` : ''}</g><rect width="${f(ts)}" height="${f(ts)}" rx="${f(rad)}" fill="none" stroke="#000" stroke-opacity="0.35" stroke-width="${f(Math.max(0.5, cs * 0.008))}"/></g>`;
        }
      }
      return `<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><defs>${defs}</defs>${s}</svg>`;
    }
  </script>
