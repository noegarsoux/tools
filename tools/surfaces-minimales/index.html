<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Surfaces minimales</title>
  <link rel="stylesheet" href="../../assets/ui/atelier.css">
</head>
<body>
  <canvas></canvas>
  <script src="../../assets/ui/atelier.js"></script>
  <script>
    // Surfaces minimales triplement périodiques : gyroïde de Schoen, Schwarz P et D, Neovius, I-WP,
    // lidinoïde, Fischer-Koch S. Chaque surface est approchée par une surface de niveau f(q) = t
    // (approximation nodale, somme de sinus et cosinus), avec son gradient analytique : s = (f − t)/|∇f|
    // est alors une distance signée approchée à la surface, en radians du réseau.
    // Paroi : |s| < e (la cloison qui sépare les deux labyrinthes) ; réseau : s > 0 (un seul labyrinthe
    // plein) ; double réseau : |s| > e (les deux labyrinthes pleins, entrelacés, qui ne se touchent jamais).
    // Le treillis est rendu par raymarching (ombres douces et occlusion ambiante à la Quilez), logé dans
    // un conteneur (sphère, cube, cylindre, tore, logo extrudé) qu'une coupe fixe face à l'œil ouvre.
    // Les mêmes champs, recopiés en JavaScript, donnent la coupe à plat en SVG (marching squares)
    // et le volume en OBJ (surface nets).
    const canvas = document.querySelector('canvas');
    const gl = canvas.getContext('webgl2', { alpha: false, antialias: false, depth: false, stencil: false, preserveDrawingBuffer: false });
    const TAU = Math.PI * 2, DEG = Math.PI / 180;
    const PAL = (k) => Atelier.PALETTES[k].colors;
    const ORB = PAL('orbite'), MEN = PAL('menthe'), KB = PAL('kegelbahn'), LU = PAL('luzern'), P60 = PAL('papier-60');
    const BIEN = PAL('biennale'), ACIDE = PAL('acide'), GLY = PAL('glyphes'), PAP = PAL('papier'), THE = PAL('thermique');

    const SURF = { gyroide: 'Gyroïde (Schoen)', p: 'Schwarz P', d: 'Schwarz D (diamant)', neovius: 'Neovius', iwp: 'I-WP', lidinoide: 'Lidinoïde', fks: 'Fischer-Koch S' };
    const SURF_ID = { gyroide: 0, p: 1, d: 2, neovius: 3, iwp: 4, lidinoide: 5, fks: 6 };
    // Pente moyenne |∇f| sur la surface f = 0 : normalise les champs pour qu'ils se mélangent à égalité.
    const SC = [1.534, 1.337, 1.497, 2.889, 4.349, 1.537, 1.805];
    const VIEW_ID = { objet: 0, traversee: 1, coupe: 2 };
    const STRUCT_ID = { paroi: 0, reseau: 1, double: 2 };
    const FORME_ID = { sphere: 0, cube: 1, cylindre: 2, tore: 3, logo: 4 };
    const CUT_ID = { aucune: 0, plan: 1, quartier: 2, tranche: 3 };
    const MAT_ID = { argile: 0, plastique: 1, chrome: 2, irise: 3 };
    const FLOOR_Y = -1.2, BOUND = 1.62, LOGO_H = 0.95, LOGO_N = 320, MAXP = 6;

    let ready = false, frame = 0, drag = null, velAz = 0, velEl = 0, renderScale = 1, ema = 16, lastNow = 0;

    const app = Atelier.app({
      stage: canvas,
      animate: true,
      seed: false,
      finish: { grain: 0.06, vignette: 0.12 },
      hint: 'Glissez pour tourner le treillis · Maj + glisser : épaisseur et niveau · molette : taille des cellules',
      notes: 'Le SVG reprend la coupe à plat (avec les réglages actuels) ; le volume OBJ est le treillis dans son conteneur, coupé comme à l’écran, à importer dans Blender ou à imprimer.',
      params: {
        'Surface': {
          surface: { type: 'select', label: 'Surface', options: SURF, value: 'gyroide' },
          structure: { type: 'segmented', label: 'Structure', options: { paroi: 'Paroi', reseau: 'Réseau', double: 'Double réseau' }, value: 'paroi' },
          cellules: { type: 'range', label: 'Cellules (périodes)', min: 1, max: 8, step: 0.05, value: 3 },
          niveau: { type: 'range', label: 'Niveau t (fraction volumique)', min: -1, max: 1, step: 0.01, value: 0 },
          epaisseur: { type: 'range', label: 'Épaisseur de paroi', min: 0.05, max: 1.2, step: 0.01, value: 0.42, show: (q) => q.structure !== 'reseau' },
          torsion: { type: 'range', label: 'Torsion', min: -3, max: 3, step: 0.01, value: 0 },
          gradation: { type: 'range', label: 'Gradation (haut → bas)', min: -1, max: 1, step: 0.01, value: 0 },
          morphose: { type: 'select', label: 'Métamorphose vers', options: { aucune: 'Aucune', ...SURF }, value: 'aucune' },
        },
        'Vue': {
          vue: { type: 'segmented', label: 'Vue', options: { objet: 'Objet', traversee: 'Traversée', coupe: 'Coupe à plat' }, value: 'objet' },
          azimut: { type: 'range', label: 'Azimut (°)', min: -180, max: 180, step: 1, value: 28 },
          elevation: { type: 'range', label: 'Élévation (°)', min: -60, max: 70, step: 1, value: 24 },
          focale: { type: 'range', label: 'Focale (mm)', min: 16, max: 200, step: 1, value: 60, show: (q) => q.vue !== 'coupe' },
          forage: { type: 'range', label: 'Rayon du forage (cellules)', min: 0, max: 2, step: 0.01, value: 0.2, show: (q) => q.vue === 'traversee' },
        },
        'Conteneur': {
          forme: { type: 'segmented', label: 'Forme', options: { sphere: 'Sphère', cube: 'Cube', cylindre: 'Cylindre', tore: 'Tore', logo: 'Logo' }, value: 'sphere', show: (q) => q.vue === 'objet' || (q.vue === 'coupe' && q.masque) },
          silhouette: { type: 'file', label: 'Silhouette (SVG, PNG)', accept: 'image/svg+xml,image/png,image/webp,image/jpeg', show: (q) => q.forme === 'logo' && q.vue !== 'traversee' },
          profondeur: { type: 'range', label: 'Profondeur d’extrusion', min: 0.05, max: 0.6, step: 0.01, value: 0.28, show: (q) => q.forme === 'logo' && q.vue === 'objet' },
          arrondi: { type: 'range', label: 'Arrondi des arêtes', min: 0, max: 0.5, step: 0.01, value: 0.12, show: (q) => (q.forme === 'cube' || q.forme === 'cylindre') && q.vue !== 'traversee' },
          taille: { type: 'range', label: 'Taille dans le cadre', min: 0.3, max: 1.2, step: 0.01, value: 0.66, show: (q) => q.vue !== 'traversee' },
          coupe: { type: 'segmented', label: 'Coupe', options: { aucune: 'Aucune', plan: 'Plan', quartier: 'Quartier', tranche: 'Tranche' }, value: 'quartier', show: (q) => q.vue === 'objet' },
          coupePos: { type: 'range', label: 'Position de la coupe', min: -0.9, max: 0.9, step: 0.01, value: 0, show: (q) => q.vue === 'objet' && q.coupe !== 'aucune' },
          masque: { type: 'toggle', label: 'Découper dans la forme', value: false, show: (q) => q.vue === 'coupe' },
          peau: { type: 'segmented', label: 'Peau du conteneur', options: { matiere: 'Matière', coupe: 'Couleur de coupe' }, value: 'matiere', show: (q) => q.vue !== 'coupe' },
        },
        'Mouvement': {
          boucle: { type: 'range', label: 'Durée de la boucle (s)', min: 4, max: 40, step: 1, value: 16 },
          tours: { type: 'range', label: 'Tours par boucle', min: -3, max: 3, step: 1, value: 1 },
          defilement: { type: 'range', label: 'Défilement (périodes par boucle)', min: 0, max: 4, step: 1, value: 0 },
          respiration: { type: 'range', label: 'Respiration', min: 0, max: 1, step: 0.01, value: 0.35 },
        },
        'Matière': {
          rendu: { type: 'segmented', label: 'Rendu', options: { argile: 'Argile', plastique: 'Plastique', chrome: 'Chrome', irise: 'Irisé' }, value: 'argile', show: (q) => q.vue !== 'coupe' },
          lumiere: { type: 'range', label: 'Direction de la lumière (°)', min: 0, max: 360, step: 1, value: 135, show: (q) => q.vue !== 'coupe' },
          hauteur: { type: 'range', label: 'Hauteur de la lumière (°)', min: 5, max: 85, step: 1, value: 48, show: (q) => q.vue !== 'coupe' },
          ombres: { type: 'range', label: 'Ombres portées', min: 0, max: 1, step: 0.01, value: 0.75, show: (q) => q.vue === 'objet' },
          occlusion: { type: 'range', label: 'Occlusion ambiante', min: 0, max: 1, step: 0.01, value: 0.7, show: (q) => q.vue !== 'coupe' },
          paliers: { type: 'range', label: 'Paliers de lumière (0 = lisse)', min: 0, max: 6, step: 1, value: 0, show: (q) => q.vue !== 'coupe' && (q.rendu === 'argile' || q.rendu === 'plastique') },
          brouillard: { type: 'range', label: 'Brouillard', min: 0, max: 1, step: 0.01, value: 0.5, show: (q) => q.vue === 'traversee' },
          sol: { type: 'range', label: 'Ombre au sol', min: 0, max: 1, step: 0.01, value: 0.45, show: (q) => q.vue === 'objet' },
          bandes: { type: 'range', label: 'Bandes concentriques', min: 0, max: 12, step: 1, value: 0, show: (q) => q.vue === 'coupe' },
        },
        'Couleur': {
          fond: { type: 'color', label: 'Fond', value: ORB[0] },
          faceA: { type: 'color', label: 'Face recto', value: ORB[2] },
          faceB: { type: 'color', label: 'Face verso', value: '#f2b9a0' },
          coupeCol: { type: 'color', label: 'Coupe', value: ORB[1] },
          ombre: { type: 'color', label: 'Ombres', value: '#5a1d08', show: (q) => q.vue !== 'coupe' },
          degrade: { type: 'palette', label: 'Reflets et bandes', value: [LU[3], LU[1], LU[2], LU[4]], show: (q) => (q.vue !== 'coupe' && (q.rendu === 'chrome' || q.rendu === 'irise')) || (q.vue === 'coupe' && q.bandes > 0) },
        },
      },
      presets: {
        'Orbite': {},
        'Papillon': {
          surface: 'gyroide', structure: 'reseau', cellules: 4.2, niveau: 0.15, respiration: 0.5, coupe: 'plan', coupePos: 0.25,
          rendu: 'irise', occlusion: 0.8, ombres: 0.55, sol: 0, elevation: 18, focale: 85, lumiere: 120,
          fond: MEN[0], faceA: MEN[2], faceB: MEN[3], coupeCol: MEN[1], ombre: '#0a0d0d', degrade: [MEN[1], MEN[3], MEN[2], MEN[0]],
        },
        'Traversée': {
          vue: 'traversee', surface: 'gyroide', structure: 'paroi', cellules: 2.4, epaisseur: 0.4, forage: 1, peau: 'coupe', defilement: 2, tours: 1, respiration: 0.2,
          azimut: 0, elevation: 0, focale: 24, brouillard: 0.55, occlusion: 0.9, lumiere: 210, hauteur: 30,
          fond: KB[0], faceA: KB[1], faceB: KB[2], coupeCol: KB[3], ombre: KB[0],
        },
        'Coupe': {
          vue: 'coupe', surface: 'gyroide', structure: 'paroi', cellules: 2.6, epaisseur: 0.34, azimut: 45, elevation: 35, tours: 0, defilement: 1, respiration: 0.25, taille: 0.6,
          fond: P60[0], faceA: P60[0], faceB: P60[0], coupeCol: P60[1],
        },
        'Bandes': {
          vue: 'coupe', surface: 'd', structure: 'paroi', cellules: 2.2, epaisseur: 0.16, bandes: 4, masque: true, forme: 'sphere', taille: 0.82,
          azimut: 30, elevation: 20, tours: 1, defilement: 0, respiration: 0.3,
          fond: KB[0], faceA: KB[0], faceB: KB[0], coupeCol: KB[0], degrade: [KB[1], KB[2], KB[3]],
        },
        'Chrome': {
          surface: 'd', structure: 'reseau', cellules: 2.6, niveau: 0.1, forme: 'cube', arrondi: 0.25, coupe: 'aucune', rendu: 'chrome', elevation: 24, focale: 70,
          sol: 0.3, occlusion: 0.6, respiration: 0.4, taille: 0.7,
          fond: LU[1], faceA: LU[4], faceB: LU[2], coupeCol: LU[0], ombre: LU[3], degrade: [LU[3], LU[0], LU[4]],
        },
        'Os': {
          surface: 'iwp', structure: 'paroi', cellules: 3.4, epaisseur: 0.3, gradation: 0.85, torsion: 1.4, forme: 'cylindre', arrondi: 0.3, coupe: 'plan', coupePos: 0.15,
          elevation: 32, focale: 90, paliers: 0, occlusion: 0.5, sol: 0.5, respiration: 0.3, tours: 1,
          fond: PAP[0], faceA: '#ffffff', faceB: '#e9e6df', coupeCol: PAP[1], ombre: '#8d8a84',
        },
        'Logo': {
          surface: 'gyroide', structure: 'double', cellules: 4, epaisseur: 0.18, forme: 'logo', profondeur: 0.3, coupe: 'plan', coupePos: 0.12, tours: 0, azimut: 24,
          elevation: 14, focale: 80, rendu: 'plastique', respiration: 0.4, defilement: 1, sol: 0.4,
          fond: BIEN[0], faceA: BIEN[2], faceB: BIEN[3], coupeCol: BIEN[1], ombre: '#3a1f14',
        },
      },
      brand(colors) {
        const bg = colors[0], inks = colors.slice(1);
        if (!inks.length) return { fond: bg };
        const far = inks.slice().sort((a, b) => Math.abs(lum(b) - lum(bg)) - Math.abs(lum(a) - lum(bg)));
        const dark = colors.slice().sort((a, b) => lum(a) - lum(b))[0];
        return {
          fond: bg, coupeCol: far[0], faceA: far[1] || far[0], faceB: far[2] || far[1] || bg,
          ombre: mixHex(dark, '#000000', 0.35), degrade: colors.slice().sort((a, b) => lum(a) - lum(b)).slice(0, MAXP),
        };
      },
      pointer: {
        down(q) {
          drag = { x: q.x, y: q.y, shift: q.shift, az: p.azimut, el: p.elevation, niv: p.niveau, ep: p.epaisseur };
          velAz = velEl = 0;
        },
        drag(q) {
          if (!drag) return;
          const U = Math.min(app.size.w, app.size.h), dx = (q.x - drag.x) / U, dy = (q.y - drag.y) / U;
          if (drag.shift || q.shift) {
            app.set('epaisseur', +clamp(drag.ep + dx * 1.2, 0.05, 1.2).toFixed(2));
            app.set('niveau', +clamp(drag.niv - dy * 2, -1, 1).toFixed(2));
          } else {
            app.set('azimut', Math.round(wrapDeg(drag.az + dx * 240)));
            app.set('elevation', Math.round(clamp(drag.el + dy * 160, -60, 70)));
            velAz = q.vx / U * 240; velEl = q.vy / U * 160;
          }
          if (!app.playing) render(app.time, 1);
        },
        up() { drag = null; },
        wheel(q, dy) {
          app.set('cellules', +clamp(p.cellules * Math.exp(dy * 0.0012), 1, 8).toFixed(2));
          if (!app.playing) render(app.time, 1);
        },
      },
      onChange(k) {
        if (!ready) return;
        if (k === '*' || k === 'silhouette' || k === 'forme') logoDirty = true;
        if (!app.playing) render(app.time, 1);
      },
      export: {
        name: 'surfaces-minimales',
        svg: () => sectionSVG(),
        extra: { 'Volume OBJ (Blender, impression 3D)': () => exportOBJ() },
      },
    });
    const p = app.params;

    function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
    function wrapDeg(a) { return ((a + 180) % 360 + 360) % 360 - 180; }
    function rgb(hex) { const n = parseInt(String(hex).slice(1, 7), 16) || 0; return [(n >> 16 & 255) / 255, (n >> 8 & 255) / 255, (n & 255) / 255]; }
    function lum(hex) { const [r, g, b] = rgb(hex); return 0.2126 * r + 0.7152 * g + 0.0722 * b; }
    function mixHex(a, b, t) { const x = rgb(a), y = rgb(b); return '#' + x.map((v, i) => Math.round((v + (y[i] - v) * t) * 255).toString(16).padStart(2, '0')).join(''); }

    // ——— Matrices 3×3 en colonnes (format WebGL) ———
    const M = {
      rx(a) { const c = Math.cos(a), s = Math.sin(a); return [1, 0, 0, 0, c, s, 0, -s, c]; },
      ry(a) { const c = Math.cos(a), s = Math.sin(a); return [c, 0, -s, 0, 1, 0, s, 0, c]; },
      rz(a) { const c = Math.cos(a), s = Math.sin(a); return [c, s, 0, -s, c, 0, 0, 0, 1]; },
      mul(a, b) { const o = []; for (let c = 0; c < 3; c++) for (let r = 0; r < 3; r++) o[c * 3 + r] = a[r] * b[c * 3] + a[3 + r] * b[c * 3 + 1] + a[6 + r] * b[c * 3 + 2]; return o; },
      t(a) { return [a[0], a[3], a[6], a[1], a[4], a[7], a[2], a[5], a[8]]; },
      ap(m, v) { return [m[0] * v[0] + m[3] * v[1] + m[6] * v[2], m[1] * v[0] + m[4] * v[1] + m[7] * v[2], m[2] * v[0] + m[5] * v[1] + m[8] * v[2]]; },
    };

    // ——— État d'une image : tout ce qui bouge ne dépend que de la phase de la boucle ———
    function state(t) {
      const fr = ((t / p.boucle) % 1 + 1) % 1, ph = TAU * fr;
      const view = VIEW_ID[p.vue], struct = STRUCT_ID[p.structure];
      const br = Math.sin(ph) * p.respiration;
      const morph = p.morphose !== 'aucune' && p.morphose !== p.surface;
      const S = {
        fr, ph, view, struct,
        ty: SURF_ID[p.surface], ty2: morph ? SURF_ID[p.morphose] : 0, mix: morph ? 0.5 - 0.5 * Math.cos(ph) : 0,
        k: view === 1 ? Math.PI * p.cellules * 0.5 : Math.PI * p.cellules,
        level: p.niveau + (struct === 1 ? br * 0.45 : 0),
        thick: Math.max(0.03, p.epaisseur * (struct === 1 ? 1 : 1 + 0.55 * br)),
        twist: p.torsion, grad: p.gradation,
        forme: FORME_ID[p.forme], round: p.arrondi, depth: p.profondeur,
        cut: view === 0 ? CUT_ID[p.coupe] : 0, cutPos: p.coupePos,
        tanF: 12 / p.focale,
      };
      const dv = p.defilement * TAU * fr;
      S.off = view === 1 ? [0, 0, 0] : [dv, dv, dv];
      const az = p.azimut * DEG, el = p.elevation * DEG, spin = p.tours * TAU * fr;
      if (view === 0) {
        S.rot = M.ry(-(az + spin));
        S.camM = M.rx(-el);
        S.dist = 1 / (p.taille * S.tanF);
        S.ro = M.ap(S.camM, [0, 0, S.dist]);
      } else if (view === 1) {
        S.camM = M.mul(M.mul(M.ry(az), M.rx(el)), M.rz(spin));
        const [lx, ly] = travelLine(S);
        S.ro = [lx / S.k, ly / S.k, -p.defilement * (TAU / S.k) * fr];
        S.rot = M.ry(0);
        S.bubble = 0.62 / S.k * Math.PI;
        S.bore = p.forage * TAU / S.k;
      } else {
        S.plane = M.mul(M.mul(M.ry(az), M.rx(el)), M.rz(spin));
        S.rot = M.ry(0);
      }
      const la = p.lumiere * DEG, le = p.hauteur * DEG;
      S.light = [Math.cos(la) * Math.cos(le), Math.sin(le), Math.sin(la) * Math.cos(le)];
      return S;
    }

    // Traversée : la caméra suit l'axe z ; on choisit la ligne (x, y) qui reste le plus loin de la matière sur une période.
    let lineKey = '', lineXY = [0, 0];
    function travelLine(S) {
      const e = p.epaisseur * (1 + 0.55 * p.respiration), key = `${S.ty}:${S.struct}:${p.niveau}:${e.toFixed(3)}`;
      if (key === lineKey) return lineXY;
      const N = 28, NZ = 40, clear = (x, y, z) => {
        const fg = tpms(S.ty, x, y, z), s = clamp((fg[0] - p.niveau) / Math.max(Math.hypot(fg[1], fg[2], fg[3]), 0.35), -1.6, 1.6);
        return S.struct === 0 ? Math.abs(s) - e : S.struct === 1 ? -s : e - Math.abs(s);
      };
      let best = -1e9;
      for (let i = 0; i < N; i++) for (let j = 0; j < N; j++) {
        const x = (i + 0.5) / N * TAU, y = (j + 0.5) / N * TAU;
        let m = 1e9;
        for (let k = 0; k < NZ && m > best; k++) m = Math.min(m, clear(x, y, k / NZ * TAU));
        if (m > best) { best = m; lineXY = [x, y]; }
      }
      lineKey = key;
      return lineXY;
    }

    // ——— Champs en JavaScript (copie exacte du shader) : coupe SVG et volume OBJ ———
    function tpms(ty, x, y, z) {
      const sx = Math.sin(x), sy = Math.sin(y), sz = Math.sin(z), cx = Math.cos(x), cy = Math.cos(y), cz = Math.cos(z);
      let f, gx, gy, gz;
      if (ty === 0) { f = sx * cy + sy * cz + sz * cx; gx = cx * cy - sz * sx; gy = cy * cz - sx * sy; gz = cz * cx - sy * sz; }
      else if (ty === 1) { f = cx + cy + cz; gx = -sx; gy = -sy; gz = -sz; }
      else if (ty === 2) {
        f = sx * sy * sz + sx * cy * cz + cx * sy * cz + cx * cy * sz;
        gx = cx * sy * sz + cx * cy * cz - sx * sy * cz - sx * cy * sz;
        gy = sx * cy * sz - sx * sy * cz + cx * cy * cz - cx * sy * sz;
        gz = sx * sy * cz - sx * cy * sz - cx * sy * sz + cx * cy * cz;
      } else if (ty === 3) { f = 3 * (cx + cy + cz) + 4 * cx * cy * cz; gx = -3 * sx - 4 * sx * cy * cz; gy = -3 * sy - 4 * cx * sy * cz; gz = -3 * sz - 4 * cx * cy * sz; }
      else {
        const S2x = 2 * sx * cx, S2y = 2 * sy * cy, S2z = 2 * sz * cz, C2x = cx * cx - sx * sx, C2y = cy * cy - sy * sy, C2z = cz * cz - sz * sz;
        if (ty === 4) {
          f = 2 * (cx * cy + cy * cz + cz * cx) - (C2x + C2y + C2z);
          gx = -2 * sx * (cy + cz) + 2 * S2x; gy = -2 * sy * (cx + cz) + 2 * S2y; gz = -2 * sz * (cx + cy) + 2 * S2z;
        } else if (ty === 5) {
          const T1 = S2x * cy * sz + S2y * cz * sx + S2z * cx * sy, T2 = C2x * C2y + C2y * C2z + C2z * C2x;
          f = 0.5 * T1 - 0.5 * T2 + 0.15;
          gx = 0.5 * (2 * C2x * cy * sz + S2y * cz * cx - S2z * sx * sy) + S2x * (C2y + C2z);

    app.loop((t, dt) => {
      // 2 : export ou miniature, sur-échantillonné ; 1 : pleine définition (navigateur piloté) ; 0 : aperçu adaptatif.
      const final = dt === 0 || app.offline || app.recording || app.thumbnail ? 2 : navigator.webdriver ? 1 : 0;
      if (!final) {
        // Qualité adaptative de l'aperçu : la définition baisse si l'image tarde, remonte sinon.
        const now = performance.now(), iv = lastNow ? now - lastNow : 16;
        lastNow = now; ema = ema * 0.9 + Math.min(iv, 120) * 0.1;
        if (ema > 26 && renderScale > 0.5) renderScale = Math.max(0.5, renderScale * 0.94);
        else if (ema < 18 && renderScale < 1) renderScale = Math.min(1, renderScale * 1.02);
      }
      if (!drag && (Math.abs(velAz) > 0.05 || Math.abs(velEl) > 0.05)) {
        app.set('azimut', Math.round(wrapDeg(p.azimut + velAz)), true);
        app.set('elevation', Math.round(clamp(p.elevation + velEl, -60, 70)), true);
        velAz *= 0.9; velEl *= 0.9;
      }
      render(t, final);
    });
  </script>
</body>
</html>
