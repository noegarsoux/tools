<body>
  <canvas></canvas>
  <script src="../../assets/ui/atelier.js"></script>
  <script>
    // Plaque vibrante : le sable descend |u| vers les lignes nodales.
    // Carré / lettre : u = cos(nπξ)cos(mπη) − cos(mπξ)cos(nπη), deux modes dont le second
    // a un cycle de plus, donc la figure boucle sur la durée choisie.
    // Disque : J_n(z_{n,m} r) cos(nθ), z_{n,m} zéro de la fonction de Bessel.
    const canvas = document.querySelector('canvas');
    const ctx = canvas.getContext('2d');
    const CH = Atelier.PALETTES.chladni.colors;
    const PAPIER = Atelier.PALETTES.papier.colors;
    const NUIT = Atelier.PALETTES['trame-nuit'].colors;
    const ACIDE = Atelier.PALETTES.acide.colors;

    const FG = 156;
    const MS = 480;
    const ZEROS = [
      [2.4048, 5.5201, 8.6537, 11.7915, 14.9309, 18.0711],
      [3.8317, 7.0156, 10.1735, 13.3237, 16.4706, 19.6159],
      [5.1356, 8.4172, 11.6198, 14.7960, 17.9598, 21.1170],
      [6.3802, 9.7610, 13.0152, 16.2235, 19.4094, 22.5827],
      [7.5883, 11.0647, 14.3725, 17.6160, 20.8269, 24.0190],
      [8.7715, 12.3386, 15.7002, 18.9801, 22.2178, 25.4303],
      [9.9361, 13.5893, 17.0038, 20.3208, 23.5861, 26.8202],
      [11.0864, 14.8213, 18.2876, 21.6415, 24.9349, 28.1912],
      [12.2251, 16.0378, 19.5545, 22.9452, 26.2668, 29.5457],
    ];
    const SWEEP = [[3, 2], [4, 3], [5, 2], [2, 5], [6, 3], [3, 5], [4, 6], [7, 2], [5, 4], [2, 4]];

    const bessel = buildBessel();
    const kernCache = new Map();
    const scratch = document.createElement('canvas');
    const plateCv = document.createElement('canvas');
    const sandCv = document.createElement('canvas');
    const plateX = plateCv.getContext('2d');
    const sandX = sandCv.getContext('2d');
    const hardCv = document.createElement('canvas');

    let grains = [];
    let bows = [];
    let noise = () => 0.5;
    let maskA = null;
    let maskBox = { x: 0, y: 0, w: MS, h: MS };
    let maskAspect = 1;
    let field = new Float32Array(FG * FG);
    let absField = new Float32Array(FG * FG);
    let gridA = null;
    let gridB = null;
    let sweepCache = null;
    let modeKey = '';
    let maskSerial = 0;
    let fieldMax = 1;
    let head = new Int32Array(32);
    let nextA = new Int32Array(32);
    let geomKey = '';
    let logoSeen = null;
    let sandImg = null;
    let sand32 = null;
    let linePolys = null;

    const glyphOn = (q) => q.forme === 'lettre' || q.forme === 'logo';

    const app = Atelier.app({
      stage: canvas,
      animate: true,
      seed: 21,
      finish: { grain: 0.15, vignette: 0.36 },
      hint: 'Glissez l’archet pour écarter le sable · molette pour l’échelle · Maj + molette pour incliner',
      notes: 'Le sable gagne les lignes immobiles. Le second mode a un cycle de plus : la figure boucle.',
      params: {
        'Plaque': {
          forme: { type: 'segmented', label: 'Forme', options: { carre: 'Carré', disque: 'Disque', lettre: 'Lettre', logo: 'Logo' }, value: 'carre' },
          cadre: { type: 'segmented', label: 'Cadre', options: { plein: 'Plein', inscrit: 'Inscrit' }, value: 'plein', show: (q) => q.forme === 'carre' || q.forme === 'disque' },
          mot: { type: 'text', label: 'Mot', value: 'A', maxlength: 16, show: (q) => q.forme === 'lettre' || (q.forme === 'logo' && !q.masque) },
          fonte: { type: 'font', label: 'Fonte', options: { serif: 'Serif', 'sans-serif': 'Sans', monospace: 'Mono', 'Impact, "Arial Black", sans-serif': 'Impact' }, value: 'serif', show: glyphOn },
          graisse: { type: 'range', label: 'Graisse', min: 400, max: 900, step: 10, value: 720, show: glyphOn },
          approche: { type: 'range', label: 'Approche', min: -0.04, max: 0.35, step: 0.01, value: 0, show: glyphOn },
          masque: { type: 'file', label: 'Logo', accept: 'image/*', show: (q) => q.forme === 'logo' },
          echelle: { type: 'range', label: 'Échelle', min: 0.46, max: 1.2, step: 0.01, value: 0.94 },
          inclinaison: { type: 'range', label: 'Inclinaison', min: -40, max: 40, step: 1, value: 0 },
          bord: { type: 'range', label: 'Bord nodal', min: 0.04, max: 0.5, step: 0.01, value: 0.18, show: glyphOn },
        },
        'Modes': {
          n: { type: 'range', label: 'Mode n', min: 0, max: 8, step: 1, value: 4 },
          m: { type: 'range', label: 'Mode m', min: 1, max: 6, step: 1, value: 3 },
          famille: { type: 'segmented', label: 'Famille', options: { ecart: 'Écart', somme: 'Somme', membrane: 'Membrane' }, value: 'ecart' },
          melange: { type: 'range', label: 'Mélange', min: 0, max: 1, step: 0.01, value: 0.38 },
          n2: { type: 'range', label: 'Second n', min: 0, max: 8, step: 1, value: 2 },
          m2: { type: 'range', label: 'Second m', min: 1, max: 6, step: 1, value: 5 },
          battement: { type: 'range', label: 'Battement', min: 0, max: 5, step: 1, value: 1 },
          boucle: { type: 'range', label: 'Boucle (s)', min: 4, max: 20, step: 0.5, value: 12 },
          balayage: { type: 'range', label: 'Balayage', min: 0, max: 1, step: 0.01, value: 0 },
        },
        'Sable': {
          nombre: { type: 'range', label: 'Nombre', min: 800, max: 12000, step: 100, value: 9800 },
          calibre: { type: 'range', label: 'Calibre', min: 0.35, max: 2.4, step: 0.05, value: 1.25 },
          mobilite: { type: 'range', label: 'Mobilité', min: 0.15, max: 2.6, step: 0.05, value: 1.15 },
          frottement: { type: 'range', label: 'Frottement', min: 0.4, max: 10, step: 0.1, value: 3.4 },
          agitation: { type: 'range', label: 'Agitation', min: 0, max: 1, step: 0.01, value: 0.07 },
          epaisseur: { type: 'range', label: 'Épaisseur', min: 0, max: 1, step: 0.01, value: 0.32 },
          vers: { type: 'segmented', label: 'Dépôt', options: { noeuds: 'Nœuds', ventres: 'Ventres' }, value: 'noeuds' },
          reposer: { type: 'button', label: 'Reposer le sable', action: () => respawn(true) },
        },
        'Archet': {
          force: { type: 'range', label: 'Force', min: 0, max: 2, step: 0.05, value: 1.15 },
          portee: { type: 'range', label: 'Portée', min: 0.06, max: 0.55, step: 0.01, value: 0.22 },
          tenue: { type: 'range', label: 'Tenue', min: 0, max: 1, step: 0.01, value: 0.74 },
        },
        'Couleur': {
          fond: { type: 'color', label: 'Fond', value: CH[0] },
          plaque: { type: 'color', label: 'Plaque', value: '#101010' },
          sable: { type: 'color', label: 'Sable', value: CH[1] },
          eclat: { type: 'color', label: 'Éclat', value: CH[2] },
          lueur: { type: 'range', label: 'Lueur', min: 0, max: 1, step: 0.01, value: 0.28 },
        },
      },
      presets: {
        'Sable': { forme: 'carre', cadre: 'plein', n: 4, m: 3, famille: 'ecart', melange: 0.38, n2: 2, m2: 5, battement: 1, boucle: 12, balayage: 0, nombre: 9800, calibre: 1.25, mobilite: 1.15, frottement: 3.4, agitation: 0.07, epaisseur: 0.32, vers: 'noeuds', echelle: 0.94, inclinaison: 0, lueur: 0.28, fond: CH[0], plaque: '#101010', sable: CH[1], eclat: CH[2], seed: 21 },
        'Rosace': { forme: 'disque', cadre: 'inscrit', n: 5, m: 2, famille: 'ecart', melange: 0.5, n2: 3, m2: 2, battement: 1, boucle: 14, balayage: 0, nombre: 9400, calibre: 0.9, mobilite: 1.2, epaisseur: 0.44, vers: 'noeuds', echelle: 0.9, lueur: 0.62, fond: CH[0], plaque: '#0c0c0c', sable: '#d2d2d2', eclat: CH[2], seed: 8 },
        'Glyphe': { forme: 'lettre', mot: 'A', fonte: 'Impact, "Arial Black", sans-serif', graisse: 840, approche: 0, n: 3, m: 2, famille: 'ecart', melange: 0.28, n2: 2, m2: 4, battement: 1, boucle: 12, nombre: 10000, calibre: 0.9, epaisseur: 0.62, bord: 0.18, echelle: 0.92, vers: 'noeuds', lueur: 0.32, fond: CH[0], plaque: '#3a3a3a', sable: CH[2], eclat: '#ffffff', seed: 5 },
        'Encre': { forme: 'carre', cadre: 'plein', n: 2, m: 5, famille: 'ecart', melange: 0.22, n2: 4, m2: 1, battement: 1, boucle: 16, balayage: 0, nombre: 7200, calibre: 1.2, mobilite: 0.95, agitation: 0.06, epaisseur: 0.48, vers: 'noeuds', echelle: 0.92, lueur: 0.06, fond: PAPIER[0], plaque: '#f3f0e8', sable: PAPIER[1], eclat: '#4a4a4a', grain: 0.08, vignette: 0.12, seed: 11 },
        'Battement': { forme: 'carre', cadre: 'plein', n: 4, m: 3, famille: 'ecart', melange: 0.95, n2: 5, m2: 2, battement: 2, boucle: 8, balayage: 0, nombre: 7800, calibre: 1, mobilite: 1.55, frottement: 2.6, epaisseur: 0.3, vers: 'noeuds', echelle: 0.94, lueur: 0.7, fond: NUIT[0], plaque: '#1a1a1a', sable: NUIT[1], eclat: '#ffffff', seed: 19 },
        'Balayage': { forme: 'disque', cadre: 'inscrit', n: 3, m: 2, famille: 'ecart', melange: 0.2, battement: 0, balayage: 1, boucle: 10, nombre: 7600, mobilite: 1.65, epaisseur: 0.34, vers: 'noeuds', echelle: 0.9, lueur: 0.5, fond: CH[0], plaque: '#101010', sable: CH[1], eclat: CH[2], seed: 3 },
        'Acide': { forme: 'carre', cadre: 'plein', n: 4, m: 3, famille: 'membrane', melange: 0.35, n2: 2, m2: 5, battement: 1, boucle: 12, nombre: 2400, calibre: 1.55, mobilite: 0.9, agitation: 0.02, epaisseur: 0.7, vers: 'ventres', echelle: 0.92, lueur: 0.55, fond: ACIDE[0], plaque: '#b7b7b3', sable: ACIDE[1], eclat: ACIDE[2], grain: 0.08, vignette: 0.18, seed: 27 },
        'Anneaux': { forme: 'disque', cadre: 'inscrit', n: 0, m: 3, famille: 'ecart', melange: 0.72, n2: 0, m2: 5, battement: 1, boucle: 12, balayage: 0, nombre: 8200, calibre: 1.05, epaisseur: 0.78, vers: 'noeuds', echelle: 0.9, lueur: 0.38, fond: CH[0], plaque: '#0e0e0e', sable: CH[2], eclat: CH[1], seed: 14 },
      },
      brand(colors) {
        const bg = colors[0];
        const ink = colors[1] || '#f2f2f2';
        const hi = colors[2] || ink;
        return { fond: bg, plaque: mixHex(bg, ink, 0.14), sable: ink, eclat: hi };
      },
      export: { svg: () => nodalSVG(), name: 'chladni' },
      pointer: {
        down: (q) => bowAt(q),
        drag: (q) => bowAt(q),
        wheel: (q, dy) => {
          const dir = dy > 0 ? -1 : 1;
          if (q.shift) app.set('inclinaison', Math.max(-40, Math.min(40, p.inclinaison + dir * 2)));
          else app.set('echelle', Math.max(0.46, Math.min(1.2, +(p.echelle + dir * 0.025).toFixed(3))));
        },
      },
      onChange(key) {
        if (key === 'nombre' || key === 'forme' || key === 'mot' || key === 'fonte' || key === 'graisse' || key === 'approche' || key === 'masque' || key === '*') {
          if (key !== 'nombre') rebuildMask();
          respawn(true);
        }
      },
      onSeed() { respawn(true); },
      onResize() {
        const sig = geomSig();
        if (sig !== geomKey) { geomKey = sig; respawn(true); }
      },
    });
    const p = app.params;

    function buildBessel() {
      const nMax = 8, step = 0.05, xMax = 32;
      const len = Math.ceil(xMax / step) + 2;
      const lut = Array.from({ length: nMax + 1 }, () => new Float32Array(len));
      const series = (n, x) => {
        if (x < 1e-8) return n === 0 ? 1 : 0;
        let term = 1;
        for (let i = 1; i <= n; i++) term *= x / (2 * i);
        let sum = term;
        const q = x * x * 0.25;
        for (let k = 1; k < 50; k++) {
          term *= -q / (k * (k + n));
          sum += term;
          if (Math.abs(term) < 1e-12) break;
        }
        return sum;
      };
      for (let n = 0; n <= nMax; n++) for (let i = 0; i < len; i++) lut[n][i] = series(n, i * step);
      return { lut, step, len, nMax };
    }

    function jn(n, x) {
      const nn = n < 0 ? 0 : n > bessel.nMax ? bessel.nMax : n | 0;
      if (x < 0) x = 0;
      const f = x / bessel.step;
      const i = f | 0;
      const row = bessel.lut[nn];
      if (i >= bessel.len - 1) return row[bessel.len - 1];
      const t = f - i;
      return row[i] * (1 - t) + row[i + 1] * t;
    }

    function besselZero(n, m) {
      const row = ZEROS[Math.max(0, Math.min(8, n | 0))];
      const k = Math.max(1, m | 0);
      if (k <= row.length) return row[k - 1];
      return row[row.length - 1] + (k - row.length) * Math.PI;
    }

    function diskKern(R) {
      let k = kernCache.get(R);
      if (k) return k;
      const d = R * 2 + 1;
      k = new Float32Array(d * d);
      const inv = 1 / (R * R || 1);
      for (let y = -R; y <= R; y++) {
        for (let x = -R; x <= R; x++) {
          const q = (x * x + y * y) * inv;
          k[(y + R) * d + (x + R)] = q >= 1 ? 0 : (q > 0.42 ? (1 - q) / 0.58 : 1);
        }
      }
      kernCache.set(R, k);
      return k;
    }

    function hexOf(h) {
      const n = parseInt(String(h || '#000').slice(1), 16);
      if (!Number.isFinite(n)) return [0, 0, 0];
      return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
    }
    function luma(h) {
      const [r, g, b] = hexOf(h);
      return 0.2126 * r + 0.7152 * g + 0.0722 * b;
    }
    function mixHex(a, b, t) {
      const A = hexOf(a), B = hexOf(b);
      const ch = (i) => Math.round(A[i] + (B[i] - A[i]) * t).toString(16).padStart(2, '0');
      return '#' + ch(0) + ch(1) + ch(2);
    }
    function hash(i) {
      let x = Math.imul(((i + 1) ^ (app.seed >>> 0)) >>> 0, 0x9e3779b1);
      x = Math.imul(x ^ (x >>> 16), 0x85ebca6b);
      x ^= x >>> 13;
      return (x >>> 0) / 4294967296;
    }
    function isGlyph() { return p.forme === 'lettre' || p.forme === 'logo'; }

    function geom() {
      const { w, h, dpr } = app.size;
      const e = Math.max(0.2, p.echelle || 0.9);
      let pw, ph;
      if (isGlyph()) {
        const aspect = maskAspect > 0.05 ? maskAspect : 1;
        const maxW = Math.max(8, w * e), maxH = Math.max(8, h * e);
        if (aspect > maxW / maxH) { pw = maxW; ph = pw / aspect; }
        else { ph = maxH; pw = ph * aspect; }
      } else if (p.cadre === 'inscrit') {
        pw = ph = Math.max(8, Math.min(w, h) * e);
      } else {
        pw = Math.max(8, w * e);
        ph = Math.max(8, h * e);
      }
      const u = Math.min(pw, ph) / 2 || 1;
      return { w, h, dpr: dpr || 1, pw, ph, ax: (pw / 2) / u, ay: (ph / 2) / u };
    }
    function geomSig() {
      const g = geom();
      return `${p.forme}|${p.cadre}|${g.ax.toFixed(2)}|${g.ay.toFixed(2)}|${maskAspect.toFixed(2)}`;
    }

    function boxBlur(src, w, h, r) {
      const tmp = new Float32Array(src.length);
      const dst = new Float32Array(src.length);
      const inv = 1 / (r * 2 + 1);
      for (let y = 0; y < h; y++) {
        let sum = 0;
        for (let k = -r; k <= r; k++) sum += src[y * w + Math.min(w - 1, Math.max(0, k))];
        for (let x = 0; x < w; x++) {
          tmp[y * w + x] = sum * inv;
          const x0 = x - r, x1 = x + r + 1;
          sum -= src[y * w + (x0 < 0 ? 0 : x0)];
          sum += src[y * w + (x1 >= w ? w - 1 : x1)];
        }
      }
      for (let x = 0; x < w; x++) {
        let sum = 0;
        for (let k = -r; k <= r; k++) sum += tmp[Math.min(h - 1, Math.max(0, k)) * w + x];
        for (let y = 0; y < h; y++) {
          dst[y * w + x] = sum * inv;
          const y0 = y - r, y1 = y + r + 1;
          sum -= tmp[(y0 < 0 ? 0 : y0) * w + x];
          sum += tmp[(y1 >= h ? h - 1 : y1) * w + x];
        }
      }
      return dst;
    }

    function paintGlyph(g, S) {
      const text = String(p.mot || 'A').trim().slice(0, 16) || 'A';
      g.clearRect(0, 0, S, S);
      g.fillStyle = '#fff';
      g.strokeStyle = '#fff';
      g.textAlign = 'center';
      g.textBaseline = 'middle';
      g.lineJoin = 'round';
      g.letterSpacing = `${p.approche || 0}em`;
      const family = p.fonte || 'serif';
      const weight = p.graisse || 700;
      let size = S * 0.76;
      g.font = `${weight} ${size}px ${family}`;
      const width = g.measureText(text).width || size;
      if (width > S * 0.88) {
        size *= (S * 0.88) / width;
        g.font = `${weight} ${size}px ${family}`;
      }
      const extra = Math.max(0, (weight - 520) / 420) * size * 0.04;
      g.lineWidth = extra;
      if (extra > 0.4) g.strokeText(text, S / 2, S / 2);
      g.fillText(text, S / 2, S / 2);
    }

    function paintLogo(g, S, img) {
      g.clearRect(0, 0, S, S);
      const iw = img.naturalWidth || img.width;
      const ih = img.naturalHeight || img.height;
      if (!iw || !ih) return false;
      const k = Math.min((S * 0.88) / iw, (S * 0.88) / ih);
      g.drawImage(img, (S - iw * k) / 2, (S - ih * k) / 2, iw * k, ih * k);
      return true;
    }

    function rebuildMask() {
      if (!isGlyph()) { maskA = null; maskAspect = 1; return; }
      const S = MS;
      scratch.width = S;
      scratch.height = S;
      const g = scratch.getContext('2d', { willReadFrequently: true });
      const img = p.forme === 'logo' ? (p.masque || app.logoImg) : null;
      if (!(img && img.width && paintLogo(g, S, img))) paintGlyph(g, S);
      const pic = g.getImageData(0, 0, S, S).data;
      const hard = new Float32Array(S * S);
      let trans = 0, corner = 0, center = 0, cn = 0, cc = 0;
      for (let y = 0; y < S; y++) {
        for (let x = 0; x < S; x++) {
          const o = (y * S + x) * 4;
          const a = pic[o + 3] / 255;
          const lum = (pic[o] * 0.2126 + pic[o + 1] * 0.7152 + pic[o + 2] * 0.0722) / 255;
          if (a < 0.98) trans++;
          if (x < 5 || y < 5 || x > S - 6 || y > S - 6) { corner += lum; cn++; }
          if (x > S * 0.38 && x < S * 0.62 && y > S * 0.38 && y < S * 0.62) { center += lum; cc++; }
          hard[y * S + x] = a;
        }
      }
      const useAlpha = trans > S * S * 0.04;
      if (!useAlpha) {
        const dark = (center / Math.max(1, cc)) < (corner / Math.max(1, cn));
        for (let i = 0; i < hard.length; i++) {
          const o = i * 4;
          const lum = (pic[o] * 0.2126 + pic[o + 1] * 0.7152 + pic[o + 2] * 0.0722) / 255;
          hard[i] = dark ? 1 - lum : lum;
        }
      }
      let blurred = boxBlur(hard, S, S, 3);
      blurred = boxBlur(blurred, S, S, 3);
      let minX = S, minY = S, maxX = 0, maxY = 0, acc = 0;
      for (let y = 0; y < S; y++) for (let x = 0; x < S; x++) {
        if (hard[y * S + x] > 0.4) {
          acc++;
          if (x < minX) minX = x;
          if (y < minY) minY = y;
          if (x > maxX) maxX = x;
          if (y > maxY) maxY = y;
        }
      }
      if (acc < 40) {
        hard.fill(0);
        blurred.fill(0);
        const cx = S / 2, cy = S / 2, r = S * 0.34;
        for (let y = 0; y < S; y++) for (let x = 0; x < S; x++) {
          const d = Math.hypot(x - cx, y - cy) / r;
          const v = d < 1 ? 1 : 0;
          hard[y * S + x] = v;
          blurred[y * S + x] = d < 1.08 ? Math.max(0, 1 - Math.max(0, d - 0.82) / 0.26) : 0;
        }
        minX = cx - r; maxX = cx + r; minY = cy - r; maxY = cy + r;
      }
      const pad = 10;
      maskBox = {
        x: Math.max(0, minX - pad),
        y: Math.max(0, minY - pad),
        w: Math.min(S - 1, maxX + pad) - Math.max(0, minX - pad) + 1,
        h: Math.min(S - 1, maxY + pad) - Math.max(0, minY - pad) + 1,
      };
      maskAspect = maskBox.w / Math.max(1, maskBox.h);
      maskA = blurred;
      maskSerial++;
      hardCv.width = S;
      hardCv.height = S;
      const hg = hardCv.getContext('2d');
      const out = hg.createImageData(S, S);
      const dd = out.data;
      for (let i = 0; i < hard.length; i++) {
        const o = i * 4;
        dd[o] = dd[o + 1] = dd[o + 2] = 255;
        dd[o + 3] = hard[i] > 0.45 ? 255 : 0;
      }
      hg.putImageData(out, 0, 0);
    }

    function sampleMask(ξ, η) {
      if (!maskA) return 1;
      const S = MS;
      const u = Math.min(1, Math.max(0, (ξ + 1) * 0.5));
      const v = Math.min(1, Math.max(0, (η + 1) * 0.5));
      const fx = maskBox.x + u * Math.max(1, maskBox.w - 1);
      const fy = maskBox.y + v * Math.max(1, maskBox.h - 1);
      const x0 = Math.max(0, Math.min(S - 2, fx | 0));
      const y0 = Math.max(0, Math.min(S - 2, fy | 0));
      const tx = Math.min(1, Math.max(0, fx - x0));
      const ty = Math.min(1, Math.max(0, fy - y0));
      const i = y0 * S + x0;
      return maskA[i] * (1 - tx) * (1 - ty) + maskA[i + 1] * tx * (1 - ty) + maskA[i + S] * (1 - tx) * ty + maskA[i + S + 1] * tx * ty;
    }

    function rimOf(m) {
      const w = Math.max(0.04, p.bord || 0.18);
      const t0 = 0.12;
      const t1 = Math.min(0.95, t0 + w);
      let t = (m - t0) / (t1 - t0);
      if (t < 0) t = 0;
      else if (t > 1) t = 1;
      return t * t * (3 - 2 * t);
    }

    function modeDisk(ξ, η, n, m) {
      const r = Math.hypot(ξ, η);
      if (r > 1) return 0;
      const th = Math.atan2(η, ξ);
      const radial = jn(n, besselZero(n, m) * r);
      if (n === 0) return radial;
      if (p.famille === 'membrane') return radial * Math.sin(n * th);
      if (p.famille === 'somme') return radial * (Math.cos(n * th) + Math.sin(n * th)) * 0.7071;
      return radial * Math.cos(n * th);
    }

    function modeRect(ξ, η, n, m) {
      if (p.famille === 'membrane') {
        const N = Math.max(1, n), M = Math.max(1, m);
        return Math.sin(N * Math.PI * (ξ + 1) * 0.5) * Math.sin(M * Math.PI * (η + 1) * 0.5);
      }
      const a = Math.cos(n * Math.PI * ξ) * Math.cos(m * Math.PI * η);
      const b = Math.cos(m * Math.PI * ξ) * Math.cos(n * Math.PI * η);
      if (p.famille === 'somme' || n === m) return 0.5 * (a + b);
      return 0.5 * (a - b);
    }

    function mode(ξ, η, n, m) {
      n |= 0; m |= 0;
      if (m < 1) m = 1;
      if (n < 0) n = 0;
      if (p.forme === 'disque') return modeDisk(ξ, η, n, m);
      return modeRect(ξ, η, n, m);
    }

    function phases(t) {
      const cycles = p.battement | 0;
      if (cycles <= 0) return [1, 1];
      const w = (Math.PI * 2 * t) / Math.max(2, p.boucle);
      return [Math.cos(w * cycles), Math.cos(w * (cycles + 1))];
    }

    function sweepAt(t) {
      if (p.balayage < 0.015) return null;
      const turns = Math.max(1, Math.round(p.balayage * 4));
      const pos = ((t / Math.max(2, p.boucle)) * turns) % SWEEP.length;
      const i = Math.floor(pos) % SWEEP.length;
      const f = pos - Math.floor(pos);
      const s = f * f * (3 - 2 * f);
      return { a: SWEEP[i], b: SWEEP[(i + 1) % SWEEP.length], s, w: Math.min(1, p.balayage) };
    }

    function wave(ξ, η, ph1, ph2, sw) {
      let u = mode(ξ, η, p.n, p.m) * ph1 + (p.melange || 0) * mode(ξ, η, p.n2, p.m2) * ph2;
      if (sw) {
        const us = mode(ξ, η, sw.a[0], sw.a[1]) * (1 - sw.s) + mode(ξ, η, sw.b[0], sw.b[1]) * sw.s;
        u = u * (1 - sw.w) + us * sw.w;
      }
      return u;
    }

    function addBows(grid, G, ax, ay) {
      if (!bows.length || p.force < 0.001) return;
      const sig = Math.max(0.025, p.portee);
      const sig2 = sig * sig;
      const rad = sig * 3.1;
      for (let b = 0; b < bows.length; b++) {
        const bow = bows[b];
        if (bow.life < 0.03) continue;
        const amp = bow.life * p.force;
        const ξc = bow.x / ax, ηc = bow.y / ay;
        const i0 = Math.max(0, Math.floor(((ξc - rad / ax) + 1) * 0.5 * (G - 1)));
        const i1 = Math.min(G - 1, Math.ceil(((ξc + rad / ax) + 1) * 0.5 * (G - 1)));
        const j0 = Math.max(0, Math.floor(((ηc - rad / ay) + 1) * 0.5 * (G - 1)));
        const j1 = Math.min(G - 1, Math.ceil(((ηc + rad / ay) + 1) * 0.5 * (G - 1)));
        for (let j = j0; j <= j1; j++) {
          const y = ((j / (G - 1)) * 2 - 1) * ay;
          for (let i = i0; i <= i1; i++) {
            const x = ((i / (G - 1)) * 2 - 1) * ax;
            const dx = x - bow.x, dy = y - bow.y;
            const d2 = dx * dx + dy * dy;
            if (d2 > rad * rad) continue;
            grid[j * G + i] += amp * Math.exp(-d2 / sig2);
          }
        }
      }
    }

    function writeMode(dest, n, m) {
      const G = FG;
      const glyph = isGlyph() && maskA;
      const disk = p.forme === 'disque';
      for (let j = 0; j < G; j++) {
        const η = (j / (G - 1)) * 2 - 1;
        for (let i = 0; i < G; i++) {
          const ξ = (i / (G - 1)) * 2 - 1;
          let u = 0;
          if (!(disk && ξ * ξ + η * η > 1)) {
            u = mode(ξ, η, n, m);
            if (glyph) u *= rimOf(sampleMask(ξ, η));
          }
          dest[j * G + i] = u;
        }
      }
    }

    function bakeModes() {
      const key = [p.forme, p.famille, p.n | 0, p.m | 0, p.n2 | 0, p.m2 | 0, isGlyph() ? 1 : 0, ((p.bord || 0) * 100) | 0, maskSerial, p.balayage > 0.01 ? 1 : 0].join('|');
      if (key === modeKey && gridA) return;
      modeKey = key;
      const G = FG;
      gridA = new Float32Array(G * G);
      gridB = new Float32Array(G * G);
      writeMode(gridA, p.n | 0, p.m | 0);
      writeMode(gridB, p.n2 | 0, p.m2 | 0);
      sweepCache = p.balayage > 0.01 ? SWEEP.map(([n, m]) => { const g = new Float32Array(G * G); writeMode(g, n, m); return g; }) : null;
    }

    function fillGrid(grid, G, t) {
      const gm = geom();
      const [ph1, ph2] = phases(t);
      const sw = sweepAt(t);
      const mix = p.melange || 0;
      if (G === FG) {
        bakeModes();
        const ia = sw && sweepCache ? SWEEP.indexOf(sw.a) : -1;
        const ib = sw && sweepCache ? SWEEP.indexOf(sw.b) : -1;
        for (let i = 0; i < G * G; i++) {
          let u = gridA[i] * ph1 + mix * gridB[i] * ph2;
          if (ia >= 0) {
            const us = sweepCache[ia][i] * (1 - sw.s) + sweepCache[ib][i] * sw.s;
            u = u * (1 - sw.w) + us * sw.w;
          }
          grid[i] = u;
        }
      } else {
        const glyph = isGlyph() && maskA;
        const disk = p.forme === 'disque';
        for (let j = 0; j < G; j++) {
          const η = (j / (G - 1)) * 2 - 1;
          for (let i = 0; i < G; i++) {
            const ξ = (i / (G - 1)) * 2 - 1;
            let u = 0;
            if (!(disk && ξ * ξ + η * η > 1)) {
              u = wave(ξ, η, ph1, ph2, sw);
              if (glyph) u *= rimOf(sampleMask(ξ, η));
            }
            grid[j * G + i] = u;
          }
        }
      }
      if (p.vers === 'ventres') addBows(grid, G, gm.ax, gm.ay);
    }

    function buildField(t) {
      fillGrid(field, FG, t);
      let m = 1e-4;
      for (let i = 0; i < field.length; i++) {
        const a = Math.abs(field[i]);
        absField[i] = a;
        if (a > m) m = a;
      }
      fieldMax = m;
    }

    function sampleGrid(arr, ξ, η) {
      const G = FG;
      const fx = (Math.max(-1, Math.min(1, ξ)) + 1) * 0.5 * (G - 1);
      const fy = (Math.max(-1, Math.min(1, η)) + 1) * 0.5 * (G - 1);
      const i = Math.max(0, Math.min(G - 2, fx | 0));
      const j = Math.max(0, Math.min(G - 2, fy | 0));
      const tx = fx - i, ty = fy - j;
      const o = j * G + i;
      return arr[o] * (1 - tx) * (1 - ty) + arr[o + 1] * tx * (1 - ty) + arr[o + G] * (1 - tx) * ty + arr[o + G + 1] * tx * ty;
    }
    function sampleAbs(ξ, η) { return sampleGrid(absField, ξ, η); }
    function sampleSigned(ξ, η) { return sampleGrid(field, ξ, η); }

    function contain(gr, ax, ay) {
      if (p.forme === 'disque') {
        const ξ = gr.x / ax, η = gr.y / ay;
        const r = Math.hypot(ξ, η);
        if (r > 0.985) {
          const k = 0.985 / r;
          gr.x *= k; gr.y *= k;
          gr.vx *= 0.35; gr.vy *= 0.35;
        }
        return;
      }
      if (isGlyph() && maskA) {
        let ξ = gr.x / ax, η = gr.y / ay;
        if (sampleMask(ξ, η) < 0.2) {
          const e = 0.03;
          const gx = sampleMask(ξ + e, η) - sampleMask(ξ - e, η);
          const gy = sampleMask(ξ, η + e) - sampleMask(ξ, η - e);
          const gl = Math.hypot(gx, gy) || 1;
          ξ += (gx / gl) * 0.045;
          η += (gy / gl) * 0.045;
          gr.x = ξ * ax; gr.y = η * ay;
          gr.vx *= 0.4; gr.vy *= 0.4;
        }
        return;
      }
      const limX = ax * 0.992, limY = ay * 0.992;
      if (gr.x > limX) { gr.x = limX; gr.vx *= -0.15; }
      else if (gr.x < -limX) { gr.x = -limX; gr.vx *= -0.15; }
      if (gr.y > limY) { gr.y = limY; gr.vy *= -0.15; }
      else if (gr.y < -limY) { gr.y = -limY; gr.vy *= -0.15; }
    }

    function repel(ax, ay) {
      const minD = 0.00135 + (p.epaisseur || 0) * 0.0055;
      const minD2 = minD * minD;
      const cols = Math.max(12, Math.min(200, Math.ceil((ax * 2) / minD)));
      const rows = Math.max(12, Math.min(200, Math.ceil((ay * 2) / minD)));
      const ncell = cols * rows;
      if (head.length < ncell) head = new Int32Array(ncell);
      else head.fill(-1);
      const n = grains.length;
      if (nextA.length < n) nextA = new Int32Array(n);
      const spanX = ax * 2, spanY = ay * 2;
      for (let i = 0; i < n; i++) {
        const gr = grains[i];
        let ix = ((gr.x + ax) / spanX * cols) | 0;
        let iy = ((gr.y + ay) / spanY * rows) | 0;
        if (ix < 0) ix = 0; else if (ix >= cols) ix = cols - 1;
        if (iy < 0) iy = 0; else if (iy >= rows) iy = rows - 1;
        const id = iy * cols + ix;
        nextA[i] = head[id];
        head[id] = i;
      }
      for (let i = 0; i < n; i++) {
        const gr = grains[i];
        let ix = ((gr.x + ax) / spanX * cols) | 0;
        let iy = ((gr.y + ay) / spanY * rows) | 0;
        if (ix < 0) ix = 0; else if (ix >= cols) ix = cols - 1;
        if (iy < 0) iy = 0; else if (iy >= rows) iy = rows - 1;
        for (let oy = -1; oy <= 1; oy++) {
          const yy = iy + oy;
          if (yy < 0 || yy >= rows) continue;
          for (let ox = -1; ox <= 1; ox++) {
            const xx = ix + ox;
            if (xx < 0 || xx >= cols) continue;
            let j = head[yy * cols + xx];
            let checks = 0;
            while (j > i && checks < 10) {
              checks++;
              const o = grains[j];
              const dx = gr.x - o.x, dy = gr.y - o.y;
              const d2 = dx * dx + dy * dy;
              if (d2 < minD2 && d2 > 1e-10) {
                const d = Math.sqrt(d2);
                const f = ((minD - d) / d) * 0.28;
                gr.x += dx * f; gr.y += dy * f;
                o.x -= dx * f; o.y -= dy * f;
              }
              j = nextA[j];
            }
          }
        }
      }
    }

    function spawnOne(ax, ay) {
      for (let k = 0; k < 48; k++) {
        const ξ = noise() * 2 - 1;
        const η = noise() * 2 - 1;
        if (p.forme === 'disque' && ξ * ξ + η * η > 0.9) continue;
        if (isGlyph() && maskA && sampleMask(ξ, η) < 0.5) continue;
        if (p.forme === 'carre' && (Math.abs(ξ) > 0.98 || Math.abs(η) > 0.98)) continue;
        return { x: ξ * ax, y: η * ay, vx: 0, vy: 0 };
      }
      return { x: 0, y: 0, vx: 0, vy: 0 };
    }

    function move(dt, settling, t) {
      const { ax, ay } = geom();
      const time = t || 0;
      const mob = settling ? Math.max(p.mobilite, 1.6) : p.mobilite;
      const ag = settling ? 0 : (p.agitation || 0);
      const damp = Math.exp(-p.frottement * dt);
      const e = 2.2 / (FG - 1);
      const n = grains.length;
      const ventres = p.vers === 'ventres';
      const maxS = 0.05;
      const phase = time * 6.2831853 / Math.max(0.5, p.boucle || 8);
      for (let i = 0; i < n; i++) {
        const gr = grains[i];
        const ξ = gr.x / ax, η = gr.y / ay;
        gr.vx *= damp;
        gr.vy *= damp;
        const sp = Math.hypot(gr.vx, gr.vy);
        if (sp > 1.15) { const k = 1.15 / sp; gr.vx *= k; gr.vy *= k; }
        let dx = 0, dy = 0, tx = 1, ty = 0, near = false;
        if (ventres) {
          const gξ = (sampleAbs(ξ + e, η) - sampleAbs(ξ - e, η)) / (2 * e);
          const gη = (sampleAbs(ξ, η + e) - sampleAbs(ξ, η - e)) / (2 * e);
          const gx = gξ / ax, gy = gη / ay;
          dx = gx * mob * dt * 0.9;
          dy = gy * mob * dt * 0.9;
          const gl = Math.hypot(gx, gy);
          tx = gl > 1e-6 ? -gy / gl : 1;
          ty = gl > 1e-6 ? gx / gl : 0;
          near = gl < 0.35 || sampleAbs(ξ, η) > fieldMax * 0.78;
          if (near) { dx = 0; dy = 0; }
        } else {
          const u = sampleSigned(ξ, η);
          const gξ = (sampleSigned(ξ + e, η) - sampleSigned(ξ - e, η)) / (2 * e);
          const gη = (sampleSigned(ξ, η + e) - sampleSigned(ξ, η - e)) / (2 * e);
          const gx = gξ / ax, gy = gη / ay;
          const g2 = gx * gx + gy * gy;
          if (g2 > 1e-8) {
            dx = -u * gx / g2;
            dy = -u * gy / g2;
            const gl = Math.sqrt(g2);
            tx = -gy / gl; ty = gx / gl;
          }
          dx *= Math.min(1, 0.35 + mob * 0.45);
          dy *= Math.min(1, 0.35 + mob * 0.45);
          near = Math.abs(u) < Math.max(0.012, fieldMax * 0.05);
        }
        const sl = Math.hypot(dx, dy);
        if (sl > maxS) { const k = maxS / sl; dx *= k; dy *= k; }
        gr.x += dx + gr.vx * dt;
        gr.y += dy + gr.vy * dt;
        if (near && ag > 0) {
          const slide = Math.sin(phase + hash(i) * 6.2831853) * ag * 0.11 * dt;
          gr.x += tx * slide;
          gr.y += ty * slide;
        }
      }
      repel(ax, ay);
      for (let i = 0; i < n; i++) contain(grains[i], ax, ay);
    }

    function zeroPolys() {
      const G = 104;
      const sx = (FG - 1) / (G - 1);
      const segs = [];
      const at = (i, j) => {
        const x = i * sx, y = j * sx;
        const i0 = x | 0, j0 = y | 0;
        const tx = x - i0, ty = y - j0;
        const i1 = i0 + 1 < FG ? i0 + 1 : i0;
        const j1 = j0 + 1 < FG ? j0 + 1 : j0;
        const o00 = j0 * FG + i0, o10 = j0 * FG + i1, o01 = j1 * FG + i0, o11 = j1 * FG + i1;
        return field[o00] * (1 - tx) * (1 - ty) + field[o10] * tx * (1 - ty) + field[o01] * (1 - tx) * ty + field[o11] * tx * ty;
      };
      for (let j = 0; j < G - 1; j++) {
        for (let i = 0; i < G - 1; i++) {
          const x0 = (i / (G - 1)) * 2 - 1, x1 = ((i + 1) / (G - 1)) * 2 - 1;
          const y0 = (j / (G - 1)) * 2 - 1, y1 = ((j + 1) / (G - 1)) * 2 - 1;
          const a = at(i, j), b = at(i + 1, j), c = at(i + 1, j + 1), d = at(i, j + 1);
          const pts = [];
          const push = (p0, p1, ax0, ay0, bx, by) => {
            if ((p0 > 0) === (p1 > 0) || p0 === p1) return;
            const t = p0 / (p0 - p1);
            pts.push([ax0 + (bx - ax0) * t, ay0 + (by - ay0) * t]);
          };
          push(a, b, x0, y0, x1, y0);
          push(b, c, x1, y0, x1, y1);
          push(d, c, x0, y1, x1, y1);
          push(a, d, x0, y0, x0, y1);
          const keep = (q, r) => {
            const mx = (q[0] + r[0]) / 2, my = (q[1] + r[1]) / 2;
            if (p.forme === 'disque' && mx * mx + my * my > 1.002) return false;
            if (isGlyph() && sampleMask(mx, my) < 0.5) return false;
            return true;
          };
          if (pts.length === 2 && keep(pts[0], pts[1])) segs.push(pts[0].concat(pts[1]));
          else if (pts.length === 4) {
            const center = (a + b + c + d) * 0.25;
            const pairs = (a > 0) === (center > 0) ? [[0, 1], [2, 3]] : [[1, 2], [3, 0]];
            for (const [u, v] of pairs) if (keep(pts[u], pts[v])) segs.push(pts[u].concat(pts[v]));
          }
        }
      }
      return chainSegs(segs);
    }

    function respawn(doSettle) {
      noise = app.rng(4);
      bows = [];
      const { ax, ay } = geom();
      const n = Math.max(200, Math.min(12000, p.nombre | 0));
      grains = new Array(n);
      buildField(app.time || 0);
      const ventres = p.vers === 'ventres';
      for (let i = 0; i < n; i++) grains[i] = { x: 0, y: 0, vx: 0, vy: 0, ox: 0, oy: 0 };
      if (ventres) {
        const G = FG;
        const peaks = [];
        for (let j = 2; j < G - 2; j++) {
          for (let i = 2; i < G - 2; i++) {
            const a = absField[j * G + i];
            if (a < fieldMax * 0.22) continue;
            let top = true;
            for (let y = -1; y <= 1 && top; y++) {
              for (let x = -1; x <= 1; x++) {
                if ((x || y) && absField[(j + y) * G + (i + x)] > a) top = false;
              }
            }
            if (!top) continue;
            const ξ = (i / (G - 1)) * 2 - 1;
            const η = (j / (G - 1)) * 2 - 1;
            if (p.forme === 'disque' && ξ * ξ + η * η > 0.9) continue;
            if (isGlyph() && maskA && sampleMask(ξ, η) < 0.45) continue;
            if (!isGlyph() && p.forme !== 'disque' && (Math.abs(ξ) > 0.94 || Math.abs(η) > 0.94)) continue;
            peaks.push(ξ, η);
          }
        }
        if (peaks.length >= 2) {
          const m = peaks.length / 2;
          const cell = 2 / (G - 1);
          for (let i = 0; i < n; i++) {
            const k = i % m;
            grains[i] = {
              x: (peaks[k * 2] + (noise() - 0.5) * cell * 1.4) * ax,
              y: (peaks[k * 2 + 1] + (noise() - 0.5) * cell * 1.4) * ay,
              vx: 0, vy: 0, ox: 0, oy: 0,
            };
          }
        } else {
          for (let i = 0; i < n; i++) grains[i] = spawnOne(ax, ay);
        }
      }
      if (ventres) {
        linePolys = null;
        if (doSettle) {
          for (let s = 0; s < 10; s++) move(1 / 30, true, app.time || 0);
        }
      } else seat(0, app.time || 0);
      geomKey = geomSig();
    }

    function seat(dt, t) {
      const { ax, ay } = geom();
      const raw = zeroPolys();
      const polys = [];
      let total = 0;
      const pack = [];
      const acc = [];
      for (const poly of raw) {
        let L = 0;
        for (let i = 1; i < poly.length; i++) L += Math.hypot(poly[i][0] - poly[i - 1][0], poly[i][1] - poly[i - 1][1]);
        if (L < 0.08 || poly.length < 5) continue;
        polys.push(poly);
        for (let i = 1; i < poly.length; i++) {
          const dx = poly[i][0] - poly[i - 1][0];
          const dy = poly[i][1] - poly[i - 1][1];
          const seg = Math.hypot(dx, dy);
          if (seg < 1e-6) continue;
          total += seg;
          pack.push(poly[i][0], poly[i][1], -dy / seg, dx / seg);
          acc.push(total);
        }
      }
      linePolys = polys;
      const n = grains.length;
      const m = acc.length;
      if (total < 0.12 || !n || !m) return;
      const rows = p.epaisseur > 0.62 ? 3 : 2;
      const thick = 0.0024 + p.epaisseur * 0.007;
      const per = Math.ceil(n / rows);
      const decay = Math.exp(-(0.2 + p.frottement * 0.1 + p.mobilite * 0.2) * Math.max(dt, 0));
      const ag = p.agitation || 0;
      const phase = (t || 0) * 6.2831853 / Math.max(0.5, p.boucle || 8);
      for (let i = 0; i < n; i++) {
        const gr = grains[i];
        const row = i % rows;
        const idx = (i / rows) | 0;
        const dist = ((idx + 0.5) / per) * total;
        let lo = 0, hi = m - 1;
        while (lo < hi) {
          const mid = (lo + hi) >> 1;
          if (acc[mid] < dist) lo = mid + 1;
          else hi = mid;
        }
        const o = lo * 4;
        const wob = Math.sin(phase * 2 + hash(i) * 6.2831853) * ag * thick;
        const side = (row - (rows - 1) / 2) * thick * 0.85 + (hash(i) - 0.5) * thick * 0.35 + wob;
        const ox = gr.ox || 0;
        const oy = gr.oy || 0;
        const tx = (pack[o] + pack[o + 2] * side) * ax + ox;
        const ty = (pack[o + 1] + pack[o + 3] * side) * ay + oy;
        gr.ox = ox * decay;
        gr.oy = oy * decay;
        gr.x = tx;
        gr.y = ty;
        contain(gr, ax, ay);
      }
    }

    function decayBows(dt) {
      const k = 0.2 + (1 - p.tenue) * 3.5;
      const f = Math.exp(-k * dt);
      for (let i = bows.length - 1; i >= 0; i--) {
        bows[i].life *= f;
        if (bows[i].life < 0.025) bows.splice(i, 1);
      }
    }

    function toLocal(q, g) {
      let x = q.x - g.w / 2;
      let y = q.y - g.h / 2;
      const a = -p.inclinaison * Math.PI / 180;
      const c = Math.cos(a), s = Math.sin(a);
      const xr = x * c - y * s;
      const yr = x * s + y * c;
      const u = Math.min(g.pw, g.ph) / 2 || 1;
      return { x: xr / u, y: yr / u };
    }

    function inside(loc, ax, ay) {
      const ξ = loc.x / ax, η = loc.y / ay;
      if (p.forme === 'disque') return ξ * ξ + η * η <= 1;
      if (isGlyph()) return sampleMask(ξ, η) > 0.28;
      return Math.abs(ξ) <= 1 && Math.abs(η) <= 1;
    }

    function bowAt(q) {
      const g = geom();
      const loc = toLocal(q, g);
      if (!inside(loc, g.ax, g.ay)) return;
      const last = bows[bows.length - 1];
      const step = Math.max(0.02, p.portee * 0.34);
      if (last && Math.hypot(last.x - loc.x, last.y - loc.y) < step) {
        last.x = loc.x; last.y = loc.y; last.life = 1;
      } else {
        bows.push({ x: loc.x, y: loc.y, life: 1 });
        if (bows.length > 20) bows.shift();
      }
      const reach = Math.max(0.04, p.portee);
      const speed = Math.hypot(q.vx || 0, q.vy || 0);
      const mag = p.force * (0.42 + Math.min(1, speed / 14));
      for (let i = 0; i < grains.length; i++) {
        const gr = grains[i];
        const dx = gr.x - loc.x, dy = gr.y - loc.y;
        const d = Math.hypot(dx, dy);
        if (d >= reach || d < 1e-5) continue;
        const f = 1 - d / reach;
        const nx = dx / d, ny = dy / d;
        if (p.vers === 'ventres') {
          gr.vx += nx * f * mag;
          gr.vy += ny * f * mag;
          gr.x += nx * f * reach * 0.38;
          gr.y += ny * f * reach * 0.38;
          const sp = Math.hypot(gr.vx, gr.vy);
          if (sp > 1.15) { const k = 1.15 / sp; gr.vx *= k; gr.vy *= k; }
          contain(gr, g.ax, g.ay);
        } else {
          gr.ox = (gr.ox || 0) + nx * f * reach * 0.38;
          gr.oy = (gr.oy || 0) + ny * f * reach * 0.38;
          const m = Math.hypot(gr.ox, gr.oy);
          const cap = reach * 1.7;
          if (m > cap) { const k = cap / m; gr.ox *= k; gr.oy *= k; }
        }
      }
    }

    function watchLogo() {
      if (p.forme !== 'logo' || p.masque) return;
      if (app.logoImg && app.logoImg !== logoSeen && app.logoImg.width) {
        logoSeen = app.logoImg;
        rebuildMask();
        respawn(true);
      }
    }

    function sizeCanvas(c, pw, ph, pd) {
      const bw = Math.max(1, Math.round(pw * pd));
      const bh = Math.max(1, Math.round(ph * pd));
      if (c.width !== bw || c.height !== bh) { c.width = bw; c.height = bh; }
    }

    function splat(data, W, H, cx, cy, kern, R, amt, rgb) {
      const d = R * 2 + 1;
      const rr = rgb[0], gg = rgb[1], bb = rgb[2];
      for (let y = -R; y <= R; y++) {
        const py = cy + y;
        if (py < 0 || py >= H) continue;
        const row = py * W;
        const kr = (y + R) * d + R;
        for (let x = -R; x <= R; x++) {
          const w = kern[kr + x];
          if (w <= 0) continue;
          const px = cx + x;
          if (px < 0 || px >= W) continue;
          const o = (row + px) << 2;
          const a = data[o + 3] + w * amt;
          data[o] = rr;
          data[o + 1] = gg;
          data[o + 2] = bb;
          data[o + 3] = a > 255 ? 255 : a;
        }
      }
    }

    function paintPiles(W, H, ax, ay) {
      sandX.setTransform(1, 0, 0, 1, 0, 0);
      sandX.clearRect(0, 0, W, H);
      const unit = Math.min(W, H) / 2;
      const rad = unit * (0.03 + p.epaisseur * 0.032) * Math.min(1.15, p.calibre);
      const q = Math.max(28, rad * 2.1);
      const bins = new Map();
      const n = grains.length;
      for (let i = 0; i < n; i++) {
        const gr = grains[i];
        const px = (gr.x / ax + 1) * 0.5 * (W - 1);
        const py = (gr.y / ay + 1) * 0.5 * (H - 1);
        const key = ((px / q) | 0) + ':' + ((py / q) | 0);
        let b = bins.get(key);
        if (!b) bins.set(key, b = { x: 0, y: 0, c: 0 });
        b.x += px; b.y += py; b.c++;
      }
      sandX.globalCompositeOperation = 'source-over';
      for (const b of bins.values()) {
        if (b.c < 4) continue;
        const x = b.x / b.c, y = b.y / b.c;
        const r = Math.max(9, Math.min(rad * 1.25, 7 + Math.sqrt(b.c) * 2.1));
        sandX.fillStyle = p.sable;
        sandX.globalAlpha = 0.92;
        sandX.beginPath();
        sandX.arc(x, y, r, 0, 6.2831853);
        sandX.fill();
        sandX.fillStyle = p.eclat;
        sandX.globalAlpha = 0.55 + p.lueur * 0.4;
        sandX.beginPath();
        sandX.arc(x, y, r * (0.22 + p.lueur * 0.08), 0, 6.2831853);
        sandX.fill();
      }
      sandX.globalAlpha = 1;
    }

    function paintGrains(W, H, ax, ay) {
      if (p.vers === 'ventres') {
        paintPiles(W, H, ax, ay);
        return;
      }
      if (!sandImg || sandImg.width !== W || sandImg.height !== H) {
        sandImg = new ImageData(W, H);
        sand32 = new Uint32Array(sandImg.data.buffer);
      } else sand32.fill(0);
      const data = sandImg.data;
      const unit = Math.min(W, H) / 2;
      const R = p.vers === 'ventres'
        ? Math.max(4, Math.min(11, Math.round(unit * (0.014 + p.epaisseur * 0.018) * p.calibre)))
        : Math.max(1, Math.min(4, Math.round(unit * (0.0031 + p.epaisseur * 0.0028) * p.calibre)));
      const kern = diskKern(R);
      const kernHi = diskKern(Math.max(1, R - 1));
      const sable = hexOf(p.sable);
      const eclat = hexOf(p.eclat);
      const amt = 168 + p.lueur * 40;
      const n = grains.length;
      const glow = p.lueur > 0.4;
      const kernGlow = glow ? diskKern(Math.min(8, R + 2)) : null;
      for (let i = 0; i < n; i++) {
        const gr = grains[i];
        const px = ((gr.x / ax + 1) * 0.5 * (W - 1)) | 0;
        const py = ((gr.y / ay + 1) * 0.5 * (H - 1)) | 0;
        const hv = hash(i);
        if (p.vers === 'ventres') {
          splat(data, W, H, px, py, kern, R, amt, sable);
          if (hv > 0.8) splat(data, W, H, px, py, kernHi, Math.max(2, R - 3), amt * 0.8, eclat);
        } else if (hv > 0.7) splat(data, W, H, px, py, kernHi, Math.max(1, R - 1), amt, eclat);
        else splat(data, W, H, px, py, kern, R, amt * (0.55 + hv * 0.5), sable);
        if (glow && hv < p.lueur * 0.45) splat(data, W, H, px, py, kernGlow, Math.min(7, R + 2), 28 + p.lueur * 36, eclat);
      }
      sandX.setTransform(1, 0, 0, 1, 0, 0);
      sandX.putImageData(sandImg, 0, 0);
      if (linePolys && linePolys.length && p.vers !== 'ventres') {
        sandX.globalCompositeOperation = 'destination-over';
        sandX.strokeStyle = p.sable;
        sandX.globalAlpha = 0.94;
        sandX.lineCap = 'round';
        sandX.lineJoin = 'round';
        const lw = Math.max(R * 2.2, Math.min(W, H) * (0.0085 + p.epaisseur * 0.014) * Math.max(0.7, p.calibre));
        sandX.lineWidth = lw;
        const jig = lw * 0.11;
        sandX.beginPath();
        for (let k = 0; k < linePolys.length; k++) {
          const poly = linePolys[k];
          if (poly.length < 2) continue;
          for (let i = 0; i < poly.length; i++) {
            const jx = (hash(k * 131 + i) - 0.5) * jig;
            const jy = (hash(k * 131 + i + 17) - 0.5) * jig;
            const x = (poly[i][0] + 1) * 0.5 * (W - 1) + jx;
            const y = (poly[i][1] + 1) * 0.5 * (H - 1) + jy;
            if (i === 0) sandX.moveTo(x, y);
            else sandX.lineTo(x, y);
          }
        }
        sandX.stroke();
        sandX.globalAlpha = 1;
        sandX.globalCompositeOperation = 'source-over';
      }
      if (bows.length && p.force > 0.02 && p.vers !== 'ventres') {
        const { ax, ay } = geom();
        sandX.globalCompositeOperation = 'destination-out';
        sandX.fillStyle = '#000';
        const reach = Math.max(0.06, p.portee);
        for (let i = 0; i < bows.length; i++) {
          const b = bows[i];
          const px = (b.x / ax + 1) * 0.5 * (W - 1);
          const py = (b.y / ay + 1) * 0.5 * (H - 1);
          const rad = Math.max(6, (Math.min(W, H) / 2) * reach * 0.72 * (0.45 + 0.55 * b.life));
          sandX.globalAlpha = Math.min(1, 0.55 + b.life * 0.45);
          sandX.beginPath();
          sandX.arc(px, py, rad, 0, 6.2831853);
          sandX.fill();
        }
        sandX.globalAlpha = 1;
        sandX.globalCompositeOperation = 'source-over';
      }
    }

    function clipSand(c, pw, ph) {
      c.globalCompositeOperation = 'destination-in';
      c.globalAlpha = 1;
      if (isGlyph() && hardCv.width) {
        c.drawImage(hardCv, maskBox.x, maskBox.y, Math.max(1, maskBox.w), Math.max(1, maskBox.h), 0, 0, pw, ph);
        return;
      }
      c.fillStyle = '#fff';
      c.beginPath();
      if (p.forme === 'disque') c.ellipse(pw / 2, ph / 2, pw / 2, ph / 2, 0, 0, Math.PI * 2);
      else c.rect(0, 0, pw, ph);
      c.fill();
    }

    function paintPlate(c, pw, ph) {
      c.globalCompositeOperation = 'source-over';
      c.globalAlpha = 1;
      if (isGlyph() && hardCv.width) {
        c.drawImage(hardCv, maskBox.x, maskBox.y, Math.max(1, maskBox.w), Math.max(1, maskBox.h), 0, 0, pw, ph);
        c.globalCompositeOperation = 'source-in';
        c.fillStyle = p.plaque;
        c.fillRect(0, 0, pw, ph);
        c.globalCompositeOperation = 'source-over';
        return;
      }
      c.fillStyle = p.plaque;
      c.beginPath();
      if (p.forme === 'disque') c.ellipse(pw / 2, ph / 2, pw / 2, ph / 2, 0, 0, Math.PI * 2);
      else c.rect(0, 0, pw, ph);
      c.fill();
    }

    function shade(c, pw, ph) {
      c.save();
      c.globalCompositeOperation = 'source-atop';
      const g = c.createRadialGradient(pw * 0.5, ph * 0.46, Math.min(pw, ph) * 0.18, pw * 0.5, ph * 0.5, Math.max(pw, ph) * 0.72);
      if (luma(p.plaque) > 170) {
        g.addColorStop(0, 'rgba(0,0,0,0)');
        g.addColorStop(0.75, 'rgba(0,0,0,0)');
        g.addColorStop(1, 'rgba(0,0,0,0.14)');
      } else {
        g.addColorStop(0, 'rgba(255,255,255,0.04)');
        g.addColorStop(0.55, 'rgba(0,0,0,0)');
        g.addColorStop(1, 'rgba(0,0,0,0.4)');
      }
      c.fillStyle = g;
      c.fillRect(0, 0, pw, ph);
      c.restore();
    }

    function strokeRim(c, pw, ph) {
      if (isGlyph()) return;
      c.save();
      c.globalCompositeOperation = 'source-over';
      c.strokeStyle = luma(p.plaque) > 150 ? mixHex(p.plaque, '#111', 0.45) : p.eclat;
      c.globalAlpha = luma(p.fond) > 160 ? 0.55 : 0.62;
      const lw = Math.max(1.25, Math.min(pw, ph) * 0.0042);
      c.lineWidth = lw;
      c.beginPath();
      if (p.forme === 'disque') c.ellipse(pw / 2, ph / 2, Math.max(1, pw / 2 - lw / 2), Math.max(1, ph / 2 - lw / 2), 0, 0, Math.PI * 2);
      else c.rect(lw / 2, lw / 2, Math.max(1, pw - lw), Math.max(1, ph - lw));
      c.stroke();
      c.restore();
    }

    function render() {
      const g = geom();
      const { w, h, pw, ph, dpr } = g;
      let pd = dpr;
      const longest = Math.max(pw, ph) * pd;
      if (longest > 4096) pd *= 4096 / longest;
      const sd = Math.min(2, Math.max(1, pd));
      const W = Math.max(8, Math.round(pw * sd));
      const H = Math.max(8, Math.round(ph * sd));
      if (sandCv.width !== W || sandCv.height !== H) {
        sandCv.width = W;
        sandCv.height = H;
        sandImg = null;
      }
      sizeCanvas(plateCv, pw, ph, pd);
      paintGrains(W, H, g.ax, g.ay);
      sandX.globalCompositeOperation = 'source-over';
      clipSand(sandX, W, H);

      plateX.setTransform(pd, 0, 0, pd, 0, 0);
      plateX.globalAlpha = 1;
      plateX.globalCompositeOperation = 'source-over';
      plateX.clearRect(0, 0, pw, ph);
      paintPlate(plateX, pw, ph);
      shade(plateX, pw, ph);
      plateX.globalCompositeOperation = 'source-over';
      plateX.imageSmoothingEnabled = true;
      plateX.drawImage(sandCv, 0, 0, pw, ph);
      strokeRim(plateX, pw, ph);

      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.clearRect(0, 0, w, h);
      ctx.fillStyle = p.fond;
      ctx.fillRect(0, 0, w, h);
      if (luma(p.fond) < 110) {
        const glow = ctx.createRadialGradient(w / 2, h * 0.48, Math.min(w, h) * 0.04, w / 2, h / 2, Math.max(w, h) * 0.72);
        glow.addColorStop(0, 'rgba(255,255,255,0.035)');
        glow.addColorStop(1, 'rgba(255,255,255,0)');
        ctx.fillStyle = glow;
        ctx.fillRect(0, 0, w, h);
      }
      ctx.save();
      ctx.translate(w / 2, h / 2);
      ctx.rotate((p.inclinaison || 0) * Math.PI / 180);
      if (luma(p.fond) > 150) {
        ctx.shadowColor = 'rgba(0,0,0,0.26)';
        ctx.shadowBlur = Math.min(pw, ph) * 0.04;
      }
      ctx.drawImage(plateCv, -pw / 2, -ph / 2, pw, ph);
      ctx.restore();
    }

    function esc(s) {
      return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&apos;' }[c]));
    }

    function chainSegs(segs) {
      const key = (x, y) => ((x * 480 + 480) | 0) * 4096 + ((y * 480 + 480) | 0);
      const adj = new Map();
      const add = (k, i) => { let a = adj.get(k); if (!a) adj.set(k, a = []); a.push(i); };
      for (let i = 0; i < segs.length; i++) {
        add(key(segs[i][0], segs[i][1]), i);
        add(key(segs[i][2], segs[i][3]), i);
      }
      const used = new Uint8Array(segs.length);
      const polys = [];
      const take = (x, y) => {
        const list = adj.get(key(x, y));
        if (!list) return -1;
        for (const i of list) if (!used[i]) return i;
        return -1;
      };
      for (let s = 0; s < segs.length; s++) {
        if (used[s]) continue;
        used[s] = 1;
        const poly = [[segs[s][0], segs[s][1]], [segs[s][2], segs[s][3]]];
        const grow = (atEnd) => {
          let guard = 0;
          while (guard++ < segs.length + 2) {
            const e = atEnd ? poly[poly.length - 1] : poly[0];
            const i = take(e[0], e[1]);
            if (i < 0) break;
            used[i] = 1;
            const sg = segs[i];
            const d0 = Math.hypot(sg[0] - e[0], sg[1] - e[1]);
            const d1 = Math.hypot(sg[2] - e[0], sg[3] - e[1]);
            const nxt = d0 <= d1 ? [sg[2], sg[3]] : [sg[0], sg[1]];
            if (atEnd) poly.push(nxt); else poly.unshift(nxt);
          }
        };
        grow(true); grow(false);
        if (poly.length >= 2) polys.push(poly);
      }
      return polys;
    }

    function nodalSVG() {
      const g = geom();
      const G = 210;
      const grid = new Float32Array(G * G);
      fillGrid(grid, G, app.time || 0);
      const segs = [];
      const at = (i, j) => grid[j * G + i];
      for (let j = 0; j < G - 1; j++) {
        for (let i = 0; i < G - 1; i++) {
          const x0 = (i / (G - 1)) * 2 - 1, x1 = ((i + 1) / (G - 1)) * 2 - 1;
          const y0 = (j / (G - 1)) * 2 - 1, y1 = ((j + 1) / (G - 1)) * 2 - 1;
          const a = at(i, j), b = at(i + 1, j), c = at(i + 1, j + 1), d = at(i, j + 1);
          const pts = [];
          const push = (p0, p1, ax, ay, bx, by) => {
            if ((p0 > 0) === (p1 > 0) || p0 === p1) return;
            const t = p0 / (p0 - p1);
            pts.push([ax + (bx - ax) * t, ay + (by - ay) * t]);
          };
          push(a, b, x0, y0, x1, y0);
          push(b, c, x1, y0, x1, y1);
          push(d, c, x0, y1, x1, y1);
          push(a, d, x0, y0, x0, y1);
          const keep = (q, r) => {
            const mx = (q[0] + r[0]) / 2, my = (q[1] + r[1]) / 2;
            if (p.forme === 'disque' && mx * mx + my * my > 1.002) return false;
            if (isGlyph() && sampleMask(mx, my) < 0.55) return false;
            return true;
          };
          if (pts.length === 2 && keep(pts[0], pts[1])) segs.push(pts[0].concat(pts[1]));
          else if (pts.length === 4) {
            const center = (a + b + c + d) * 0.25;
            const pairs = (a > 0) === (center > 0) ? [[0, 1], [2, 3]] : [[1, 2], [3, 0]];
            for (const [u, v] of pairs) if (keep(pts[u], pts[v])) segs.push(pts[u].concat(pts[v]));
          }
        }
      }
      const polys = chainSegs(segs);
      const ang = (p.inclinaison || 0) * Math.PI / 180;
      const co = Math.cos(ang), si = Math.sin(ang);
      const project = (ξ, η) => {
        const sx = ξ * g.pw / 2, sy = η * g.ph / 2;
        return [g.w / 2 + sx * co - sy * si, g.h / 2 + sx * si + sy * co];
      };
      let paths = '';
      for (const poly of polys) {
        let d = '';
        for (let i = 0; i < poly.length; i++) {
          const [x, y] = project(poly[i][0], poly[i][1]);
          d += `${i ? 'L' : 'M'}${x.toFixed(1)} ${y.toFixed(1)}`;
        }
        const a0 = poly[0], a1 = poly[poly.length - 1];
        if (Math.hypot(a0[0] - a1[0], a0[1] - a1[1]) < 0.02) d += 'Z';
        paths += `<path d="${d}" fill="none" stroke="${p.sable}" stroke-width="${(Math.min(g.pw, g.ph) * (0.003 + p.epaisseur * 0.006)).toFixed(2)}" stroke-linecap="round" stroke-linejoin="round"/>`;
      }
      const cx = g.w / 2, cy = g.h / 2;
      const rot = ` transform="rotate(${p.inclinaison || 0} ${cx.toFixed(1)} ${cy.toFixed(1)})"`;
      let shape = '';
      if (p.forme === 'disque') shape = `<ellipse cx="${cx}" cy="${cy}" rx="${(g.pw / 2).toFixed(1)}" ry="${(g.ph / 2).toFixed(1)}" fill="${p.plaque}"${rot}/>`;
      else if (isGlyph()) {
        const text = String(p.mot || 'A').trim().slice(0, 16) || 'A';
        const size = Math.min(g.pw, g.ph) * 0.7;
        shape = `<text x="${cx.toFixed(1)}" y="${cy.toFixed(1)}" text-anchor="middle" dominant-baseline="central" fill="${p.plaque}" font-family="${esc(p.fonte || 'serif')}" font-size="${size.toFixed(1)}" font-weight="${p.graisse | 0}"${rot}>${esc(text)}</text>`;
      } else shape = `<rect x="${(cx - g.pw / 2).toFixed(1)}" y="${(cy - g.ph / 2).toFixed(1)}" width="${g.pw.toFixed(1)}" height="${g.ph.toFixed(1)}" fill="${p.plaque}"${rot}/>`;
      return `<svg xmlns="http://www.w3.org/2000/svg" width="${g.w}" height="${g.h}" viewBox="0 0 ${g.w} ${g.h}"><rect width="${g.w}" height="${g.h}" fill="${p.fond}"/>${shape}${paths}</svg>`;
    }

    rebuildMask();
    respawn(true);
    app.loop((t, dt) => {
      if (app.size.w < 2 || app.size.h < 2) return;
      watchLogo();
      if (dt > 0) decayBows(dt);
      buildField(t);
      if (p.vers === 'ventres') {
        linePolys = null;
        if (dt > 0) {
          const sub = Math.min(3, Math.max(1, Math.round(dt * 48)));
          const h = dt / sub;
          for (let i = 0; i < sub; i++) move(h, false, t);
        }
      } else seat(dt, t);
      render();
      app.finish(ctx);
    });
  </script>
