<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Distributeur de boules</title>
  <link rel="stylesheet" href="../../assets/ui/atelier.css">
</head>
<body>
  <canvas></canvas>
  <script src="../../assets/ui/atelier.js"></script>
  <script>
    // Distributeur de boules : un tas de billes (dynamique par positions : gravité, puis contacts résolus
    // plusieurs fois par pas, grille de voisinage) dans un globe ou un bocal. Un tour de manivelle libère la bille
    // la plus basse, qui tombe dans le socle et ressort par la trappe dans le plateau. Le plateau trop plein
    // s'efface par la plus ancienne, et une bille neuve retombe par le couvercle : la boucle ne s'arrête pas.
    const canvas = document.querySelector('canvas');
    const ctx = canvas.getContext('2d');
    const TAU = Math.PI * 2;
    const PAL = (k) => Atelier.PALETTES[k].colors;
    const BIE = PAL('biennale'), LUZ = PAL('luzern'), MEN = PAL('menthe');

    let vKey = '', logoM = null, logoKey = '', ptr = null, S = null, gKey = '', simT = 0;
    const cache = {};

    const app = Atelier.app({
      stage: canvas,
      animate: true,
      seed: true,
      finish: { grain: 0.035, vignette: 0.2 },
      hint: 'Clic : un tour de manivelle · glissez dans le globe pour remuer les billes · molette : secousse',
      notes: 'Un distributeur de boules de gomme : les billes aux couleurs de la marque s’entassent dans le globe, un tour de manivelle libère la plus basse, qui ressort par la trappe et roule dans le plateau. Quand le plateau déborde, une bille neuve retombe par le couvercle. Le logo est frappé sur le socle. Cliquez pour tourner la manivelle, glissez dans le globe pour remuer le tas.',
      params: {
        'Billes': {
          remplissage: { type: 'range', label: 'Remplissage', min: 0.15, max: 0.95, step: 0.01, value: 0.62 },
          taille: { type: 'range', label: 'Taille', min: 0.5, max: 2.2, step: 0.05, value: 1 },
          variation: { type: 'range', label: 'Variation de taille', min: 0, max: 0.4, step: 0.01, value: 0.06 },
          couleurs: { type: 'palette', label: 'Couleurs', value: ['#e5452a', '#f2c230', '#2f5fd0', '#f4f1ea', '#5bb08a', '#f2b0c8'] },
          brillance: { type: 'range', label: 'Brillance', min: 0, max: 1, step: 0.01, value: 0.7 },
        },
        'Mouvement': {
          auto: { type: 'toggle', label: 'Manivelle automatique', value: true },
          cadence: { type: 'range', label: 'Intervalle (s)', min: 0.6, max: 8, step: 0.1, value: 2.2 },
          gravite: { type: 'range', label: 'Gravité', min: 0.3, max: 2, step: 0.01, value: 1 },
          rebond: { type: 'range', label: 'Rebond', min: 0, max: 0.7, step: 0.01, value: 0.25 },
          plateau: { type: 'range', label: 'Billes dans le plateau', min: 1, max: 8, step: 1, value: 4 },
        },
        'Machine': {
          forme: { type: 'select', label: 'Réservoir', options: { globe: 'Globe', bocal: 'Bocal', capsule: 'Capsule' }, value: 'globe' },
          corps: { type: 'color', label: 'Corps', value: '#e5452a' },
          metal: { type: 'color', label: 'Métal', value: '#c9ccd1' },
          encre: { type: 'color', label: 'Logo', value: '#f4f1ea' },
          verre: { type: 'color', label: 'Teinte du verre', value: '#dfe9f2' },
          fond: { type: 'color', label: 'Fond', value: '#f2e3c9' },
          echelle: { type: 'range', label: 'Échelle', min: 0.6, max: 1.15, step: 0.01, value: 1 },
          image: { type: 'file', label: 'Image du logo', accept: 'image/*' },
        },
      },
      presets: {
        'Classique': {},
        'Pastel': { couleurs: ['#f2b0c8', '#b9a0e6', '#a4e0bc', '#f7e08c', '#9dd3f0', '#ffffff'], corps: '#f4f1ea', metal: '#e8c9a8', encre: '#e57d9e', fond: '#fbe3ea', verre: '#ffffff', brillance: 0.5 },
        'Monochrome': { couleurs: ['#2f5fd0', '#2552b8', '#3d6fe0', '#1f4aa6'], corps: '#16161a', metal: '#9aa0aa', encre: '#2f5fd0', fond: '#f4f1ea', brillance: 0.9 },
        'Bocal': { forme: 'bocal', remplissage: 0.72, taille: 0.75, corps: '#2f5fd0', encre: '#f2c230', fond: '#f4f1ea' },
        'Géantes': { remplissage: 0.55, taille: 2.1, variation: 0, cadence: 3.2, plateau: 2, corps: '#16161a', encre: '#e5452a', fond: '#e9e4da' },
        'Capsule': { forme: 'capsule', remplissage: 0.5, taille: 0.85, corps: '#5bb08a', encre: '#16161a', couleurs: ['#16161a', '#f4f1ea', '#e5452a'], fond: '#e9efe6' },
        'Nuit': { fond: '#14161c', corps: '#2a2d36', metal: '#7d838f', encre: '#f2c230', verre: '#7f9ccf', couleurs: ['#f2c230', '#e5452a', '#ffffff'], brillance: 1 },
        'Rebonds': { rebond: 0.65, gravite: 1.6, cadence: 0.8, remplissage: 0.4, taille: 1.2, corps: '#f2c230', encre: '#16161a', fond: '#2f5fd0' },
        'Biennale': { couleurs: BIE.slice(0, 4), corps: BIE[2], encre: BIE[0], metal: '#d6d4cf', fond: BIE[4] },
        'Luzern': { couleurs: [LUZ[0], LUZ[1], LUZ[2], LUZ[4]], corps: LUZ[3], encre: LUZ[0], metal: LUZ[2], fond: LUZ[2], verre: '#ffffff' },
        'Menthe': { couleurs: [MEN[0], MEN[2], MEN[3]], corps: MEN[3], encre: MEN[0], metal: '#dfe4e2', fond: MEN[0], verre: MEN[2], forme: 'bocal' },
      },
      brand(colors) {
        const s = colors.slice().sort((a, b) => lum(a) - lum(b)), D = s[0], L = s[s.length - 1], mid = s.length > 2 ? s.slice(1, -1) : [D];
        return { couleurs: colors.slice(), corps: mid[0], encre: L, fond: mix(L, mid[mid.length - 1], 0.12), metal: mix(L, D, 0.25) };
      },
      pointer: {
        down: (q) => { ptr = { x: q.x, y: q.y, px: q.x, py: q.y, moved: 0, stir: !!S && inside(q.x, q.y, -S.r) }; },
        drag: (q) => { if (!ptr) return; ptr.moved += Math.hypot(q.x - ptr.x, q.y - ptr.y); ptr.x = q.x; ptr.y = q.y; },
        up: () => { if (ptr && ptr.moved < 6 && S) crank(); ptr = null; },
        wheel: () => { if (S) for (const b of S.b) if (b.z === 0) { b.py += S.r * (0.3 + Math.random() * 0.6) * p.gravite; b.px += (Math.random() - 0.5) * S.r * 0.6; } },
      },
      onChange(k) { if (['*', 'image'].includes(k)) logoKey = ''; },
      export: { name: 'distributeur', svg: () => toSVG() },
    });
    const p = app.params;

    function hex(x) { const n = parseInt(x.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
    function lum(x) { const c = hex(x); return (c[0] * 0.299 + c[1] * 0.587 + c[2] * 0.114) / 255; }
    function mix(a, b, t) { const A = hex(a), C = hex(b); return '#' + A.map((v, i) => Math.round(v + (C[i] - v) * t).toString(16).padStart(2, '0')).join(''); }
    function rgba(c, a) { const h = hex(c); return `rgba(${h[0]},${h[1]},${h[2]},${a})`; }
    function rng(s) { let a = s >>> 0; return () => { a = (a + 0x6d2b79f5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
    const ease = (x) => (x <= 0 ? 0 : x >= 1 ? 1 : x * x * (3 - 2 * x));

    function buildLogo() {
      const img0 = p.image || app.logoImg, key = img0 ? (img0.src || 'c') : 'demo'; if (key === logoKey) return; logoKey = key; vKey = '';
      const M = 200, c = document.createElement('canvas'); c.width = c.height = M; const x = c.getContext('2d', { willReadFrequently: true }), L = M * 0.94, cx = M / 2;
      if (img0) { const iw = img0.naturalWidth || img0.width, ih = img0.naturalHeight || img0.height, s = L / Math.max(iw, ih); x.drawImage(img0, cx - iw * s / 2, cx - ih * s / 2, iw * s, ih * s); }
      else { x.fillStyle = '#000'; x.beginPath(); x.arc(cx, cx, L * 0.48, 0, TAU); x.arc(cx, cx, L * 0.27, 0, TAU, true); x.fill('evenodd'); x.fillRect(cx - L * 0.07, cx - L * 0.5, L * 0.14, L); }
      const d = x.getImageData(0, 0, M, M).data; let transp = 0; for (let i = 3; i < d.length; i += 4) if (d[i] < 128) transp++; const useA = transp > M * M * 0.05;
      const F = new Float64Array(M * M); for (let i = 0; i < M * M; i++) { const o = i * 4, l = (d[o] * 0.2126 + d[o + 1] * 0.7152 + d[o + 2] * 0.0722) / 255; F[i] = useA ? d[o + 3] / 255 : (d[o + 3] / 255) * Math.min(1, Math.max(0, (0.75 - l) * 2)); }
      { const G2 = new Float64Array(M * M); for (let j = 1; j < M - 1; j++) for (let i = 1; i < M - 1; i++) { let a = 0; for (let b = -1; b <= 1; b++) for (let c = -1; c <= 1; c++) a += F[(j + b) * M + i + c] * (b || c ? (b && c ? 1 : 2) : 4); G2[j * M + i] = a / 16; } F.set(G2); }
      for (let k = 0; k < M; k++) F[k] = F[(M - 1) * M + k] = F[k * M] = F[k * M + M - 1] = 0;
      logoM = contours(F, M, M, 0.5, 0, 0, 1).filter((c) => c.closed && c.pts.length > 6).map((c) => chaikin(chaikin(c.pts, true), true).map((q) => [q[0] / M - 0.5, q[1] / M - 0.5]));
    }
    // carrés marchants + chaînage
    function contours(F, nx, ny, lev, ox, oy, cs) {
      const pt = new Map(), adj = new Map();
      const P = (id) => { let q = pt.get(id); if (q) return q; const cell = id >> 1, i = cell % nx, j = (cell - i) / nx; let a, b, ax, ay, bx, by; if (id & 1) { a = F[j * nx + i]; b = F[(j + 1) * nx + i]; ax = bx = i; ay = j; by = j + 1; } else { a = F[j * nx + i]; b = F[j * nx + i + 1]; ay = by = j; ax = i; bx = i + 1; } const t = (lev - a) / (b - a || 1e-9); q = [ox + (ax + (bx - ax) * t) * cs, oy + (ay + (by - ay) * t) * cs]; pt.set(id, q); return q; };
      const link = (a, b) => { (adj.get(a) || adj.set(a, []).get(a)).push(b); (adj.get(b) || adj.set(b, []).get(b)).push(a); };
      for (let j = 0; j < ny - 1; j++) for (let i = 0; i < nx - 1; i++) {
        const A = F[j * nx + i] > lev, B = F[j * nx + i + 1] > lev, C = F[(j + 1) * nx + i + 1] > lev, D = F[(j + 1) * nx + i] > lev, idx = A | (B << 1) | (C << 2) | (D << 3);
        if (idx === 0 || idx === 15) continue;
        const T = (j * nx + i) * 2, R = (j * nx + i + 1) * 2 + 1, Bo = ((j + 1) * nx + i) * 2, Le = (j * nx + i) * 2 + 1;
        const ctr = (F[j * nx + i] + F[j * nx + i + 1] + F[(j + 1) * nx + i + 1] + F[(j + 1) * nx + i]) / 4 > lev;
        switch (idx) {
          case 1: case 14: link(Le, T); break; case 2: case 13: link(T, R); break; case 3: case 12: link(Le, R); break;
          case 4: case 11: link(R, Bo); break; case 6: case 9: link(T, Bo); break; case 7: case 8: link(Le, Bo); break;
          case 5: if (ctr) { link(Le, Bo); link(T, R); } else { link(Le, T); link(R, Bo); } break;
          case 10: if (ctr) { link(Le, T); link(R, Bo); } else { link(Le, Bo); link(T, R); } break;
        }
      }
      const seen = new Set(), out = [];
      const walk = (s) => { const L = [s]; seen.add(s); let cur = s; for (;;) { const nb = (adj.get(cur) || []).find((x) => !seen.has(x)); if (nb === undefined) break; seen.add(nb); L.push(nb); cur = nb; } return L; };
      for (const [id, nb] of adj) if (nb.length === 1 && !seen.has(id)) out.push({ pts: walk(id).map(P), closed: false });
      for (const [id] of adj) if (!seen.has(id)) out.push({ pts: walk(id).map(P), closed: true });
      return out;
    }
    function chaikin(pts, closed) {
      const o = []; const n = pts.length; for (let k = 0; k < (closed ? n : n - 1); k++) { const a = pts[k], b = pts[(k + 1) % n]; o.push([a[0] * 0.75 + b[0] * 0.25, a[1] * 0.75 + b[1] * 0.25], [a[0] * 0.25 + b[0] * 0.75, a[1] * 0.25 + b[1] * 0.75]); }
      if (!closed) { o.unshift(pts[0]); o.push(pts[n - 1]); } return o;
    }

    // ——— géométrie ———
    function build(w, h) {
      const Rg = Math.min((h * 0.88) / 3.75, w * 0.36) * p.echelle;
      const top = h / 2 - Rg * 3.75 / 2;
      const G = { x: w / 2, y: top + Rg * 0.3 + Rg };
      const shp = p.forme;
      // réservoir : demi-largeur, demi-hauteur, rayon d'angle (le globe est un cercle)
      const box = shp === 'globe' ? { hw: Rg, hh: Rg, cr: Rg } : shp === 'bocal' ? { hw: Rg * 0.92, hh: Rg, cr: Rg * 0.22 } : { hw: Rg * 0.72, hh: Rg, cr: Rg * 0.72 };
      const yb0 = G.y + box.hh * 0.9, bh = Rg * 1.5, yb1 = yb0 + bh;
      const r = Rg * 0.062 * p.taille;
      const base = { y0: yb0, y1: yb1, wt: Rg * 0.56, wb: Rg * 0.86, logo: { x: G.x, y: yb0 + bh * 0.21, s: Rg * 0.46 }, crank: { x: G.x, y: yb0 + bh * 0.49, r: Rg * 0.19 }, mouth: { x: G.x, y: yb0 + bh * 0.71, w: Math.min(r * 2.8, Rg * 0.3), h: Math.min(r * 2.3, Rg * 0.2) } };
      const tray = { x: G.x, y: yb1 - bh * 0.07, w: Math.max(r * 1.1 * p.plateau + r, Rg * 0.42), lip: r * 1.05 };
      const old = S;
      S = { w, h, Rg, G, box, base, tray, r, b: [], tN: 0, cr: 0, crT: -1, door: 0, next: 1.2, top };
      const R = rng(app.seed * 17 + 5), C = p.couleurs.length ? p.couleurs : ['#e5452a'];
      let A = 0; const ns = 60; for (let i = 0; i < ns; i++) for (let j = 0; j < ns; j++) if (sdf(G.x + ((i + 0.5) / ns * 2 - 1) * box.hw, G.y + ((j + 0.5) / ns * 2 - 1) * box.hh, box, G) < -r) A++;
      A *= (box.hw * 2 / ns) * (box.hh * 2 / ns);
      const n = Math.min(1200, Math.max(8, Math.round(p.remplissage * A * 0.84 / (Math.PI * r * r * (1 + p.variation * p.variation)))));
      for (let i = 0; i < n; i++) {
        let x, y, tries = 0; do { x = G.x + (R() * 2 - 1) * box.hw; y = G.y + (R() * 2 - 1) * box.hh; tries++; } while (!inside(x, y, r, box, G) && tries < 50);
        const rr = r * (1 + (R() * 2 - 1) * p.variation);
        S.b.push({ x, y, px: x, py: y, r: rr, c: Math.floor(R() * C.length), z: 0, id: i, a: 1 });
      }
      S.tN = n;
      // le tas se pose avant le premier affichage
      for (let k = 0; k < 160; k++) step(1 / 60, true);
      for (const b of S.b) { b.px = b.x; b.py = b.y; }
    }
    // distance signée au réservoir (négative dedans)
    function sdf(x, y, box = S.box, G = S.G) {
      const qx = Math.abs(x - G.x) - (box.hw - box.cr), qy = Math.abs(y - G.y) - (box.hh - box.cr);
      const ox = Math.max(qx, 0), oy = Math.max(qy, 0);
      return Math.hypot(ox, oy) + Math.min(Math.max(qx, qy), 0) - box.cr;
    }
    function inside(x, y, m, box, G) { return sdf(x, y, box, G) < -m; }
    function sdfGrad(x, y) { const e = 0.5, d0 = sdf(x, y); const gx = sdf(x + e, y) - d0, gy = sdf(x, y + e) - d0, l = Math.hypot(gx, gy) || 1; return [gx / l, gy / l]; }

    function crank() { if (!S || S.crT >= 0) return; S.crT = 0; S.released = false; }

    function step(dt, quiet) {
      const g = S.Rg * 9 * p.gravite, B = S.b, bot = { x: S.G.x, y: S.G.y + S.box.hh };
      if (!quiet) {
        S.next -= dt;
        if (p.auto && S.next <= 0 && S.crT < 0) { crank(); S.next = p.cadence; }
        if (S.crT >= 0) {
          S.crT += dt; S.cr = ease(S.crT / 0.9) * TAU;
          if (!S.released && S.crT > 0.45) {
            S.released = true;
            let best = null, bd = 1e9; for (const b of B) if (b.z === 0) { const d = Math.hypot(b.x - bot.x, b.y - bot.y); if (d < bd) { bd = d; best = b; } }
            if (best && bd < S.r * 4) { best.z = 1; best.t = 0; }
          }
          if (S.crT > 0.9) { S.crT = -1; S.cr = 0; }
        }
        S.door = Math.max(0, S.door - dt * 2.5);
      }
      for (const b of B) {
        if (b.z === 3) { b.a -= dt * 2.5; continue; }
        const vx = (b.x - b.px), vy = (b.y - b.py); b.px = b.x; b.py = b.y;
        if (b.z === 1) { b.t += dt; b.x += (bot.x - b.x) * Math.min(1, dt * 10); b.y += vy * 0.98 + g * dt * dt; if (b.y > S.base.y0 + S.r * 2) { b.z = 2; b.t = 0; b.hidden = 0.35; } continue; }
        if (b.z === 2 && b.hidden > 0) { b.hidden -= dt; if (b.hidden <= 0) { const m = S.base.mouth; b.x = m.x + (Math.random() - 0.5) * S.r * 0.4; b.y = m.y; b.px = b.x - S.r * 0.02; b.py = b.y - S.r * 0.06; S.door = 1; } else { b.x = S.base.mouth.x; b.y = S.base.mouth.y; } continue; }
        b.x += vx * 0.995; b.y += vy * 0.995 + g * dt * dt;
      }
      // plateau trop plein : la plus ancienne s'efface, une neuve tombe par le couvercle
      const inTray = B.filter((b) => b.z === 2 && !(b.hidden > 0));
      if (inTray.length > p.plateau) {
        const o = inTray.reduce((a, c) => (c.t2 < a.t2 ? c : a)); o.z = 3;
        const C = p.couleurs.length ? p.couleurs : ['#e5452a'];
        const nb = { x: S.G.x + (Math.random() - 0.5) * S.r * 2, y: S.G.y - S.box.hh + S.r * 1.2, r: o.r, c: Math.floor(Math.random() * C.length), z: 0, id: S.tN++, a: 1 };
        nb.px = nb.x; nb.py = nb.y - S.r * 0.15; B.push(nb);
      }
      for (let i = B.length - 1; i >= 0; i--) if (B[i].z === 3 && B[i].a <= 0) B.splice(i, 1);
      for (const b of B) if (b.z === 2 && b.t2 == null) b.t2 = simT + Math.random() * 1e-3;
      // contraintes
      const cell = S.r * 2.6, grid = new Map(), key = (i, j) => i * 73856093 ^ j * 19349663;
      const act = B.filter((b) => b.z === 0 || b.z === 1 || (b.z === 2 && !(b.hidden > 0)));
      const st = ptr && ptr.stir ? { x: ptr.x, y: ptr.y, r: S.Rg * 0.13 } : null;
      for (let it = 0; it < 4; it++) {
        grid.clear();
        for (const b of act) { const k = key(Math.floor(b.x / cell), Math.floor(b.y / cell)); let l = grid.get(k); if (!l) grid.set(k, (l = [])); l.push(b); }
        for (const b of act) {
          const ci = Math.floor(b.x / cell), cj = Math.floor(b.y / cell);
          for (let di = -1; di <= 1; di++) for (let dj = -1; dj <= 1; dj++) {
            const l = grid.get(key(ci + di, cj + dj)); if (!l) continue;
            for (const o of l) {
              if (o.id <= b.id) continue;
              if ((o.z === 2) !== (b.z === 2)) continue;
              const dx = o.x - b.x, dy = o.y - b.y, d2 = dx * dx + dy * dy, m = b.r + o.r; if (d2 >= m * m || d2 < 1e-9) continue;
              const d = Math.sqrt(d2), k = (m - d) / d * 0.5; b.x -= dx * k; b.y -= dy * k; o.x += dx * k; o.y += dy * k;
              if (it === 3) { const nx = dx / d, ny = dy / d, vt = ((o.x - o.px) - (b.x - b.px)) * -ny + ((o.y - o.py) - (b.y - b.py)) * nx, c = vt * 0.12; b.x -= ny * c; b.y += nx * c; o.x += ny * c; o.y -= nx * c; }
            }
          }
        }
        for (const b of act) {

      const K = base.crank; o += `<circle cx="${f(K.x)}" cy="${f(K.y)}" r="${f(K.r)}" fill="url(#met)"/><g transform="translate(${f(K.x)} ${f(K.y)}) rotate(${f(S.cr * 180 / Math.PI)})"><rect x="${f(-K.r * 0.97)}" y="${f(-K.r * 0.11)}" width="${f(K.r * 1.94)}" height="${f(K.r * 0.22)}" rx="${f(K.r * 0.1)}" fill="${mix(M, '#ffffff', 0.25)}" stroke="${mix(M, '#000000', 0.3)}" stroke-width="1"/><circle r="${f(K.r * 0.2)}" fill="${mix(M, '#ffffff', 0.5)}"/></g>`;
      const m = base.mouth; o += `<rect x="${f(m.x - m.w * 0.62)}" y="${f(m.y - m.h * 0.6)}" width="${f(m.w * 1.24)}" height="${f(m.h * 1.1)}" rx="${f(m.w * 0.2)}" fill="${mix(M, '#000000', 0.15)}"/><rect x="${f(m.x - m.w * 0.5)}" y="${f(m.y - m.h * 0.5)}" width="${f(m.w)}" height="${f(m.h * 0.9 * (1 - ease(S.door) * 0.75))}" fill="url(#met)"/>`;
      const T = tray; o += `<rect x="${f(T.x - T.w)}" y="${f(T.y - T.lip * 1.1)}" width="${f(T.w * 2)}" height="${f(T.lip * 1.1)}" fill="${mix(M, '#000000', 0.3)}"/>`;
      o += S.b.filter((b) => b.z === 2 && !(b.hidden > 0)).map(ball).join('');
      o += `<rect x="${f(T.x - T.w * 1.06)}" y="${f(T.y - T.lip * 0.55)}" width="${f(T.w * 2.12)}" height="${f(T.lip * 0.85)}" rx="${f(T.lip * 0.3)}" fill="url(#met)"/><rect x="${f(G.x - wb * 1.04)}" y="${f(y1 - Rg * 0.055)}" width="${f(wb * 2.08)}" height="${f(Rg * 0.07)}" rx="${f(Rg * 0.02)}" fill="url(#met)"/>`;
      return `<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><defs>${defs}</defs>${o}</svg>`;
    }
  </script>
</body>
