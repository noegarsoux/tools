<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Flocons</title>
  <link rel="stylesheet" href="../../assets/ui/atelier.css">
</head>
<body>
  <canvas></canvas>
  <script src="../../assets/ui/atelier.js"></script>
  <script>
    // Flocons : automate cellulaire de Clifford Reiter (2005) sur un réseau hexagonal. Chaque case porte
    // une quantité de vapeur ; les cases gelées et leurs voisines la retiennent et l'accumulent, les autres
    // la laissent diffuser. Trois nombres (humidité, diffusion, apport) suffisent à passer de la plaque
    // hexagonale à la dendrite fougère. On ne calcule qu'un douzième du cristal, la symétrie fait le reste.
    const canvas = document.querySelector('canvas');
    const ctx = canvas.getContext('2d');
    const TAU = Math.PI * 2, SQ3 = Math.sqrt(3);
    const PAL = (k) => Atelier.PALETTES[k].colors;
    const KB = PAL('kegelbahn'), MENTHE = PAL('menthe'), BIEN = PAL('biennale'), LUZ = PAL('luzern'), THERM = PAL('thermique');

    // morphologies de référence (humidité b, diffusion a, apport g)
    const MORPHS = [
      { b: 0.4, a: 1, g: 0.001 }, { b: 0.3, a: 0.1, g: 0.02 }, { b: 0.3, a: 0.2, g: 0.01 }, { b: 0.4, a: 0.25, g: 0.002 },
      { b: 0.6, a: 2.5, g: 0.0005 }, { b: 0.65, a: 0.8, g: 0.0002 }, { b: 0.95, a: 1, g: 0.001 }, { b: 0.8, a: 1, g: 0.002 },
      { b: 0.35, a: 0.15, g: 0.005 }, { b: 0.35, a: 1, g: 0.001 }, { b: 0.5, a: 0.2, g: 0.01 }, { b: 0.3, a: 1, g: 0.05 },
    ];
    const aOf = (v) => 0.05 * Math.pow(50, v), gOf = (v) => 0.0001 * Math.pow(300, v);

    let flakes = [], layoutKey = '', time = 0, frozen = false, rng = Math.random, puff = 0, drag = null, mask = null, maskKey = null;

    const app = Atelier.app({
      stage: canvas,
      animate: true,
      seed: true,
      finish: { grain: 0.04, vignette: 0.22 },
      hint: 'Touchez : bouffée d’humidité, nouveau flocon une fois fini, ou flocon semé dans le ciel · glissez pour tourner · molette : humidité',
      notes: 'Le modèle de Reiter découpe l’air en cases hexagonales. Une case gelée, ou voisine d’une case gelée, est réceptive : elle garde sa vapeur et en reçoit un peu plus à chaque pas. Les autres moyennent leur vapeur avec leurs voisines. Peu d’humidité donne des plaques, beaucoup des étoiles et des fougères ; la météo fait varier ces conditions pendant la chute, comme pour un vrai flocon. Les anneaux marquent le temps de croissance.',
      params: {
        'Cristal': {
          composition: { type: 'select', label: 'Composition', options: { unique: 'Un flocon', trio: 'Trio', ciel: 'Chute de neige', logo: 'Logo' }, value: 'unique' },
          image: { type: 'file', label: 'Logo', accept: 'image/*', show: (q) => q.composition === 'logo' },
          humidite: { type: 'range', label: 'Humidité', min: 0.25, max: 0.95, step: 0.01, value: 0.4 },
          diffusion: { type: 'range', label: 'Diffusion', min: 0, max: 1, step: 0.01, value: 0.77 },
          apport: { type: 'range', label: 'Apport de vapeur', min: 0, max: 1, step: 0.01, value: 0.4 },
          meteo: { type: 'range', label: 'Météo changeante', min: 0, max: 1, step: 0.01, value: 0.45 },
          varier: { type: 'toggle', label: 'Varier les cristaux', value: true },
          finesse: { type: 'range', label: 'Finesse', min: 30, max: 120, step: 1, value: 84 },
        },
        'Mouvement': {
          duree: { type: 'range', label: 'Durée de croissance (s)', min: 3, max: 40, step: 0.5, value: 11 },
          pause: { type: 'range', label: 'Pause (s)', min: 0, max: 12, step: 0.5, value: 3 },
          rotation: { type: 'range', label: 'Rotation', min: -1, max: 1, step: 0.01, value: 0.12 },
          nombre: { type: 'range', label: 'Flocons', min: 4, max: 60, step: 1, value: 18, show: (q) => q.composition === 'ciel' || q.composition === 'logo' },
          vent: { type: 'range', label: 'Vent', min: -1, max: 1, step: 0.01, value: 0.15, show: (q) => q.composition === 'ciel' },
        },
        'Rendu': {
          rendu: { type: 'segmented', label: 'Rendu', options: { givre: 'Givre', encre: 'Encre', anneaux: 'Anneaux' }, value: 'givre' },
          anneaux: { type: 'range', label: 'Anneaux de croissance', min: 0, max: 1, step: 0.01, value: 0.45 },
          halo: { type: 'range', label: 'Halo de vapeur', min: 0, max: 1, step: 0.01, value: 0.35 },
          glace: { type: 'color', label: 'Glace', value: '#eef4ff' },
          accent: { type: 'color', label: 'Reflets', value: '#7fb2ff' },
          fond: { type: 'color', label: 'Fond', value: '#0b1424' },
        },
      },
      presets: {
        'Étoile changeante': {},
        'Plaque': { humidite: 0.3, diffusion: 0.18, apport: 0.93, meteo: 0.1, varier: false, anneaux: 0.6, duree: 12 },
        'Étoile sectorielle': { humidite: 0.4, diffusion: 0.41, apport: 0.53, meteo: 0.6, varier: false, duree: 12 },
        'Fougère': { humidite: 0.6, diffusion: 1, apport: 0.28, meteo: 0.2, varier: false, duree: 9 },
        'Dentelle': { humidite: 0.95, diffusion: 0.77, apport: 0.4, meteo: 0, varier: false, rendu: 'anneaux', anneaux: 0.7, duree: 6 },
        'Trio': { composition: 'trio', finesse: 70 },
        'Chute de neige': { composition: 'ciel', finesse: 44, nombre: 22, duree: 7, halo: 0.15 },
        'Logo': { composition: 'logo', finesse: 30, nombre: 40, duree: 6, halo: 0.2 },
        'Encre sur papier': { rendu: 'encre', glace: '#14213d', accent: '#3a6fd0', fond: '#f3efe6', halo: 0.25 },
        'Menthe': { glace: MENTHE[0], accent: MENTHE[2], fond: MENTHE[1], composition: 'trio' },
        'Kegelbahn': { glace: '#ffffff', accent: KB[1], fond: KB[0], rendu: 'anneaux', anneaux: 0.8 },
        'Luzern': { glace: LUZ[4], accent: LUZ[2], fond: LUZ[1], composition: 'ciel', finesse: 44, nombre: 22 },
        'Biennale': { glace: BIEN[1], accent: BIEN[2], fond: BIEN[0], rendu: 'encre', halo: 0.3 },
      },
      brand(colors) {
        const lum = (h) => { const n = parseInt(h.slice(1), 16); return ((n >> 16) & 255) * 0.299 + ((n >> 8) & 255) * 0.587 + (n & 255) * 0.114; };
        const sat = (h) => { const c = hex(h), mx = Math.max(...c), mn = Math.min(...c); return mx ? (mx - mn) / mx : 0; };
        const all = colors.slice().sort((a, b) => lum(b) - lum(a));
        const accent = colors.slice().sort((a, b) => sat(b) - sat(a))[0];
        return { glace: all[0], fond: all[all.length - 1], accent };
      },
      pointer: {
        down: (q) => { drag = { x: q.x, y: q.y, moved: false, a0: Math.atan2(q.y - app.size.h / 2, q.x - app.size.w / 2) }; },
        drag: (q) => {
          if (!drag) return; if (Math.hypot(q.x - drag.x, q.y - drag.y) > 6) drag.moved = true;
          if (drag.moved) { const a = Math.atan2(q.y - app.size.h / 2, q.x - app.size.w / 2); let d = a - drag.a0; d = Math.atan2(Math.sin(d), Math.cos(d)); drag.a0 = a; const f = nearest(q.x, q.y); if (f) f.rot += d; }
        },
        up: (q) => { if (drag && !drag.moved) tap(q.x, q.y); drag = null; },
        wheel: (q, dy) => app.set('humidite', Math.max(0.25, Math.min(0.95, +(p.humidite + (dy > 0 ? -0.02 : 0.02)).toFixed(2)))),
      },
      onChange(k) {
        if (k === 'image') maskKey = null;
        if (k === '*' || ['composition', 'nombre', 'finesse', 'image'].includes(k)) layoutKey = '';
        if (['humidite', 'diffusion', 'apport'].includes(k)) for (const f of flakes) applyMorph(f);
        if (k === 'varier') for (const f of flakes) { pickMorph(f); restart(f, true); }
        for (const f of flakes) f.dirty = true;
        frozen = false;
      },
      onSeed() { layoutKey = ''; frozen = false; },
      export: { name: 'flocons', svg: () => toSVG() },
    });
    const p = app.params;

    const hex = (h) => { const n = parseInt(h.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; };
    function mulberry(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
    const sstep = (a, b, x) => { const t = Math.max(0, Math.min(1, (x - a) / (b - a))); return t * t * (3 - 2 * t); };

    // ——— Géométrie hexagonale réduite au douzième ———
    const geoCache = new Map();
    function geo(R) {
      if (geoCache.has(R)) return geoCache.get(R);
      const S = 2 * R + 1, canon = new Int32Array(S * S).fill(-1), idx = new Map(), rep = [];
      const canonical = (x, z) => {
        const y = -x - z; const t = [x, y, z].sort((m, n) => n - m); const A = t[0], B = t[1], C = t[2];
        return (A > -C || (A === -C && B >= 0)) ? [A, C] : [-C, -A];
      };
      for (let dj = -R; dj <= R; dj++) for (let di = -R; di <= R; di++) {
        const r = Math.max(Math.abs(di), Math.abs(dj), Math.abs(di + dj)); if (r > R) continue;
        const [ci, cj] = canonical(di, dj), k = ci * 4096 + cj;
        let id = idx.get(k); if (id === undefined) { id = rep.length; idx.set(k, id); rep.push([ci, cj, Math.max(Math.abs(ci), Math.abs(cj), Math.abs(ci + cj))]); }
        canon[(dj + R) * S + di + R] = id;
      }
      const nW = rep.length, nb = new Int32Array(nW * 6), rr = new Float32Array(nW), D6 = [[1, 0], [-1, 0], [0, 1], [0, -1], [1, -1], [-1, 1]];
      for (let k = 0; k < nW; k++) {
        const [i, j, r] = rep[k]; rr[k] = r;
        for (let m = 0; m < 6; m++) { const a = i + D6[m][0], b = j + D6[m][1]; const id = (Math.abs(a) <= R && Math.abs(b) <= R) ? canon[(b + R) * S + a + R] : -1; nb[k * 6 + m] = id < 0 ? nW : id; }
      }
      const g = { R, S, nW, canon, nb, rr, rep, c0: canon[R * S + R], pix: new Map() };
      geoCache.set(R, g); return g;
    }
    // interpolation : triangle du réseau contenant le point (coordonnées en cases)
    function cellAt(G, i, j) { const R = G.R; if (Math.abs(i) > R || Math.abs(j) > R) return G.nW; const v = G.canon[(j + R) * G.S + i + R]; return v < 0 ? G.nW : v; }
    function tri(G, x, y, out) {
      const fj = y / (SQ3 / 2), fi = x - fj / 2, i0 = Math.floor(fi), j0 = Math.floor(fj), fx = fi - i0, fy = fj - j0;
      if (fx + fy < 1) { out[0] = cellAt(G, i0, j0); out[1] = cellAt(G, i0 + 1, j0); out[2] = cellAt(G, i0, j0 + 1); out[3] = 1 - fx - fy; out[4] = fx; out[5] = fy; }
      else { out[0] = cellAt(G, i0 + 1, j0 + 1); out[1] = cellAt(G, i0, j0 + 1); out[2] = cellAt(G, i0 + 1, j0); out[3] = fx + fy - 1; out[4] = 1 - fx; out[5] = 1 - fy; }
    }
    // carte pixel → cellules pour une taille de rendu D (pixels) donnée
    function pixMap(G, D) {
      if (G.pix.has(D)) return G.pix.get(D);
      const id = new Int32Array(D * D * 3), w = new Float32Array(D * D * 2), fd = new Float32Array(D * D), cs = D / (2 * G.R + 3), o = [0, 0, 0, 0, 0, 0];
      for (let py = 0; py < D; py++) for (let px = 0; px < D; px++) {
        const k = py * D + px, X = (px + 0.5 - D / 2) / cs, Y = (py + 0.5 - D / 2) / cs; tri(G, X, Y, o); fd[k] = 1 - sstep(0.6, 0.86, Math.hypot(X, Y) / G.R);
        if (o[0] === G.nW && o[1] === G.nW && o[2] === G.nW) { id[k * 3] = -1; continue; }
        id[k * 3] = o[0]; id[k * 3 + 1] = o[1]; id[k * 3 + 2] = o[2]; w[k * 2] = o[3]; w[k * 2 + 1] = o[4];
      }
      const m = { id, w, fd }; if (G.pix.size > 6) G.pix.clear(); G.pix.set(D, m); return m;
    }

    // ——— Un flocon ———
    function makeFlake(o) {
      const f = Object.assign({ x: 0, y: 0, size: 100, R: 60, rot: rng() * TAU, vr: (rng() - 0.5) * 0.3, vx: 0, vy: 0, delay: 0, alpha: 0, dirty: true }, o);
      f.G = geo(f.R); f.s = new Float32Array(f.G.nW + 1); f.sp = new Float32Array(f.G.nW + 1); f.u = new Float32Array(f.G.nW + 1); f.v = new Float32Array(f.G.nW + 1); f.ft = new Float32Array(f.G.nW);
      f.cv = document.createElement('canvas'); f.cx = f.cv.getContext('2d');
      pickMorph(f); restart(f, false); return f;
    }
    function pickMorph(f) {
      f.m = p.varier ? (f.first ? MORPHS[0] : MORPHS[Math.floor(rng() * MORPHS.length)]) : null; f.jit = 1 + (rng() - 0.5) * 0.03;
      applyMorph(f);
      f.ph = rng() * TAU; f.ph2 = rng() * TAU;
      if (f.first) { f.ph = 0; f.ph2 = 1; f.first = false; }
    }
    // les curseurs agissent en direct sur un cristal en croissance
    function applyMorph(f) {
      const m = f.m;
      if (m) { f.b = m.b + (p.humidite - 0.4) * 0.4; f.a = m.a * Math.pow(50, (p.diffusion - 0.77) * 0.4); f.g = m.g * Math.pow(300, (p.apport - 0.4) * 0.4); }
      else { f.b = p.humidite * f.jit; f.a = aOf(p.diffusion); f.g = gOf(p.apport); }
      f.b = Math.max(0.22, Math.min(0.97, f.b)); f.a = Math.max(0.03, Math.min(3, f.a));
    }
    function restart(f, keepAlpha) {
      const { s, ft, G } = f; s.fill(f.b); ft.fill(-1); s[G.c0] = 1; ft[G.c0] = 0; f.t = 0; f.clock = 0; f.maxR = 0; f.maxS = 1; f.state = 'grow'; f.hold = 0; f.spf = 1; f.acc = 0; f.blend = 1; f.steps = 0; f.dirty = true;
      if (!keepAlpha) f.alpha = 0;
    }
    function bEdge(f) { return f.b * (1 + p.meteo * 0.08 * Math.sin(f.ph + f.maxR / f.G.R * 5.5)); }
    function stepFlake(f, n) {
      const { s, u, v, ft, G } = f, nW = G.nW, nb = G.nb, rr = G.rr, pr = f.maxR / f.G.R;
      // la météo change pendant la chute : diffusion et apport oscillent (échelle logarithmique)
      const a2 = Math.min(3, f.a * Math.exp(p.meteo * 1.4 * Math.sin(f.ph + pr * 6.5))) / 2;
      const gm = f.g * Math.exp(p.meteo * 1.0 * Math.sin(f.ph2 + pr * 8.0)) + puff * 0.01 * (f.local || 1);
      const be = bEdge(f);
      for (let it = 0; it < n; it++) {
        s[nW] = be; u[nW] = be;
        for (let k = 0; k < nW; k++) {
          const sk = s[k]; let rec = sk >= 1;
          if (!rec) { const b = k * 6; rec = s[nb[b]] >= 1 || s[nb[b + 1]] >= 1 || s[nb[b + 2]] >= 1 || s[nb[b + 3]] >= 1 || s[nb[b + 4]] >= 1 || s[nb[b + 5]] >= 1; }
          if (rec) { u[k] = 0; v[k] = sk + gm; } else { u[k] = sk; v[k] = 0; }
        }
        for (let k = 0; k < nW; k++) {
          const b = k * 6, uk = u[k];
          const sn = uk + a2 * ((u[nb[b]] + u[nb[b + 1]] + u[nb[b + 2]] + u[nb[b + 3]] + u[nb[b + 4]] + u[nb[b + 5]]) / 6 - uk) + v[k];
          s[k] = sn;
          if (sn >= 1) { if (ft[k] < 0) { ft[k] = f.clock; if (rr[k] > f.maxR) f.maxR = rr[k]; } if (sn > f.maxS) f.maxS = sn; }
        }
        f.steps++;
        if (f.maxR >= f.G.R - 2) break;
      }
    }
    function updateFlake(f, dt) {
            if (f.delay > 0) { f.delay -= dt; return; }
      const T = p.duree * (f.durK || 1);
      if (f.state === 'grow') {
        f.t += dt; f.clock = f.t / T;
        const target = Math.min(1, Math.pow(f.t / T, 0.85)), pr = f.maxR / f.G.R;
        f.spf = pr < target ? Math.min(f.spfMax || 360, f.spf * 1.2 + 0.2) : Math.max(0.04, f.spf * 0.85);
        f.acc = (f.acc || 0) + f.spf; const n = Math.floor(f.acc); f.acc -= n;
        if (n > 0) { if (f.spf < 1) { f.sp.set(f.s); f.blend = 0; } stepFlake(f, n); f.dirty = true; }
        if (f.spf < 1 && f.blend < 1) { f.blend = Math.min(1, f.blend + f.spf); f.dirty = true; } else if (f.spf >= 1) f.blend = 1;
        if (f.maxR >= f.G.R - 2 || f.t > T * 2.2) { f.state = 'hold'; f.hold = 0; }
        f.alpha = Math.min(1, f.alpha + dt * 2);
      } else if (f.state === 'hold') {
        f.hold += dt; f.alpha = Math.min(1, f.alpha + dt * 2);
        if (f.cycle && f.hold > p.pause) f.state = 'fade';
      } else if (f.state === 'fade') {
        f.alpha -= dt * 0.9; if (f.alpha <= 0) { f.alpha = 0; pickMorph(f); restart(f, false); f.delay = 0.3; }
      }
    }

    // ——— Rendu d'un flocon dans son canevas ———
    function renderFlake(f, D) {
      if (!f.img || f.cv.width !== D) { f.cv.width = f.cv.height = D; f.img = f.cx.createImageData(D, D); f.dirty = true; }
      if (!f.dirty) return; f.dirty = false;
      const M = pixMap(f.G, D), id = M.id, w = M.w, bl = f.state === 'grow' ? f.blend : 1, sc = f.s, sp = f.sp, s = bl < 1 ? f.mixed || (f.mixed = new Float32Array(sc.length)) : sc, ft = f.ft, nW = f.G.nW, Dt = f.img.data;
      const gl = hex(p.glace), ac = hex(p.accent), mode = p.rendu, ring = p.anneaux, halo = p.halo * (f.sky ? 0.45 : 1), be = s[nW] || f.b;
      if (bl < 1) for (let i = 0; i < sc.length; i++) s[i] = sp[i] + (sc[i] - sp[i]) * bl;
      const tNow = f.clock, thInv = 1 / Math.max(0.02, f.maxS - 1), rf = mode === 'anneaux' ? 16 : 9;
      for (let k = 0, n = D * D; k < n; k++) {
        const o = k * 4, i0 = id[k * 3];
        if (i0 < 0) { Dt[o + 3] = 0; continue; }
        const i1 = id[k * 3 + 1], i2 = id[k * 3 + 2], w0 = w[k * 2], w1 = w[k * 2 + 1], w2 = 1 - w0 - w1;
        const F = w0 * s[i0] + w1 * s[i1] + w2 * s[i2];
        const inside = sstep(0.975, 1.02, F);
        let r = 0, g = 0, b = 0, al = 0;
        if (halo > 0 && F < 1.02) { const hv = F < be ? Math.min(1, (be - F) / be * 2.2) : 0.35 + 0.65 * sstep(be, 1, F); r = ac[0]; g = ac[1]; b = ac[2]; al = hv * halo * 0.55 * M.fd[k]; }
        if (inside > 0) {
          const t0 = i0 < nW ? ft[i0] : -1, t1 = i1 < nW ? ft[i1] : -1, t2 = i2 < nW ? ft[i2] : -1;
          const T = w0 * (t0 < 0 ? tNow : t0) + w1 * (t1 < 0 ? tNow : t1) + w2 * (t2 < 0 ? tNow : t2);
          const th = Math.min(1, Math.max(0, (F - 1) * thInv));
          const rv = 0.5 + 0.5 * Math.cos(T * rf * TAU);
          let cr, cg, cb, ca;
          if (mode === 'encre') {
            const q = 0.75 + 0.25 * th - ring * 0.25 * rv; cr = gl[0]; cg = gl[1]; cb = gl[2]; ca = q;
          } else if (mode === 'anneaux') {
            const m = Math.pow(rv, 3) * ring; cr = gl[0] + (ac[0] - gl[0]) * m; cg = gl[1] + (ac[1] - gl[1]) * m; cb = gl[2] + (ac[2] - gl[2]) * m; ca = 0.55 + 0.45 * Math.max(th, m);
          } else {
            const edge = 1 - sstep(1.0, 1.0 + 0.1 / thInv, F), body = Math.pow(th, 0.55);
            const m = (1 - body) * 0.6 * (1 - edge * 0.8); // fines zones teintées par les reflets
            const lit = 0.72 + 0.28 * body - ring * 0.22 * rv + edge * 0.35;
            cr = (gl[0] + (ac[0] - gl[0]) * m) * lit; cg = (gl[1] + (ac[1] - gl[1]) * m) * lit; cb = (gl[2] + (ac[2] - gl[2]) * m) * lit;
            ca = 0.42 + 0.48 * body + edge * 0.3;
          }

          r = (Math.min(255, cr) * A + r * ao) / at; g = (Math.min(255, cg) * A + g * ao) / at; b = (Math.min(255, cb) * A + b * ao) / at; al = at;
        }
        Dt[o] = r; Dt[o + 1] = g; Dt[o + 2] = b; Dt[o + 3] = al * 255;
      }
      f.cx.putImageData(f.img, 0, 0);
    }

    // ——— Logo ———
    function logoPts(n) {
      const img0 = p.image || app.logoImg, key = (img0 ? (img0.src || 'c') : 'demo') + n;
      if (key === maskKey && mask) return mask; maskKey = key;
      const M = 160, c = document.createElement('canvas'); c.width = c.height = M; const x = c.getContext('2d', { willReadFrequently: true });
      if (img0) { const iw = img0.naturalWidth || img0.width, ih = img0.naturalHeight || img0.height, k = M * 0.96 / Math.max(iw, ih); x.drawImage(img0, (M - iw * k) / 2, (M - ih * k) / 2, iw * k, ih * k); }
      else { x.fillStyle = '#000'; x.beginPath(); x.arc(80, 80, 74, 0, TAU); x.arc(80, 80, 40, 0, TAU, true); x.fill('evenodd'); x.fillRect(70, 3, 20, 154); }
      const d = x.getImageData(0, 0, M, M).data; let transp = 0; for (let i = 3; i < d.length; i += 16) if (d[i] < 128) transp++;
      const useA = transp > d.length / 16 * 0.05, inn = [];
      for (let y = 0; y < M; y++) for (let xx = 0; xx < M; xx++) { const i = (y * M + xx) * 4, l = (d[i] * 0.2126 + d[i + 1] * 0.7152 + d[i + 2] * 0.0722) / 255; if (useA ? d[i + 3] > 110 : (d[i + 3] > 128 && l < 0.5)) inn.push([xx / M, y / M]); }
      // échantillonnage de Poisson approché : on garde les points les plus éloignés
      const r = mulberry(7), pts = [], area = inn.length / (M * M); let rad = Math.sqrt(area / n / 3.2);
      for (let tries = 0; tries < 6 && pts.length < n; tries++) {
        pts.length = 0;
        for (let t = 0; t < inn.length * 2 && pts.length < n; t++) { const q = inn[Math.floor(r() * inn.length)]; if (pts.every((o) => Math.hypot(o[0] - q[0], o[1] - q[1]) > rad)) pts.push(q); }
        rad *= 0.85;
      }
      mask = { pts, rad: rad / 0.85 }; return mask;
    }

    // ——— Compositions ———
    function layout() {
      const { w, h } = app.size, S = Math.min(w, h), key = [p.composition, p.nombre, p.finesse, w, h, app.seed, maskKey].join();
      if (key === layoutKey) return; layoutKey = key; rng = mulberry(app.seed * 9973 + 11); flakes = [];
      const F = Math.round(p.finesse);
      if (p.composition === 'unique') flakes.push(makeFlake({ x: w / 2, y: h / 2, size: S * 0.46, R: F, cycle: true, spfMax: 420, first: true }));
      else if (p.composition === 'trio') {
        flakes.push(makeFlake({ x: w * 0.5 - S * 0.2, y: h * 0.53, size: S * 0.36, R: F, cycle: true, durK: 1 }));
        flakes.push(makeFlake({ x: w * 0.5 + S * 0.33, y: h * 0.3, size: S * 0.2, R: Math.round(F * 0.6), cycle: true, delay: 1.5, durK: 0.8 }));
        flakes.push(makeFlake({ x: w * 0.5 + S * 0.3, y: h * 0.76, size: S * 0.15, R: Math.round(F * 0.5), cycle: true, delay: 3, durK: 0.7 }));
      } else if (p.composition === 'ciel') {
        for (let i = 0; i < p.nombre; i++) flakes.push(skyFlake({ y: rng() * h * 1.1 - h * 0.05 }, i));
      } else {
        const L = S * 0.9, x0 = (w - L) / 2, y0 = (h - L) / 2, m = logoPts(Math.round(p.nombre));
        for (const [u, v] of m.pts) {
          const d = Math.hypot(u - 0.5, v - 0.5);
          flakes.push(makeFlake({ x: x0 + u * L, y: y0 + v * L, size: m.rad * L * 0.62 * (0.8 + rng() * 0.4), R: F, cycle: true, delay: d * 4 + rng() * 0.6, durK: 0.8 + rng() * 0.4 }));
        }
      }
    }
    function skyFlake(o, i) {
      const { w, h } = app.size, S = Math.min(w, h), z = 0.35 + rng() * 0.65;
      const f = makeFlake(Object.assign({ x: rng() * w, y: -S * 0.1, size: S * (0.035 + 0.11 * z * z), R: Math.max(16, Math.round(p.finesse * (0.5 + 0.5 * z))), z, durK: 0.7 + rng() * 0.6, sky: true }, o));
      f.vy = S * (0.018 + 0.05 * z); f.vr = (rng() - 0.5) * 0.5; f.sway = rng() * TAU;
      return f;
    }
    function nearest(x, y) { let best = null, bd = Infinity; for (const f of flakes) { const d = Math.hypot(f.x - x, f.y - y) / Math.max(20, f.size); if (d < bd) { bd = d; best = f; } } return best; }
    function tap(x, y) {
      if (p.composition === 'ciel') {
        const f = skyFlake({ x, y }, flakes.length); f.alpha = 0.2; flakes.push(f); if (flakes.length > p.nombre + 12) flakes.splice(flakes.findIndex((g) => g.sky), 1);
      } else { puff = 1; for (const f of flakes) { f.local = Math.max(0.2, 1.4 - Math.hypot(f.x - x, f.y - y) / Math.max(40, f.size * 1.6)); if (f.state === 'hold' && f.local > 0.9) f.state = 'fade'; } }
    }

    // ——— Boucle ———
    function drawAll() {
      const { w, h, dpr } = app.size;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
      const bg = hex(p.fond), S = Math.min(w, h);
      const gr = ctx.createRadialGradient(w / 2, h * 0.45, 0, w / 2, h * 0.45, Math.hypot(w, h) * 0.6);
      const lift = (c, k) => `rgb(${c.map((v) => Math.round(v + (255 - v) * k * (v < 128 ? 1 : -0.4))).join(',')})`;
      gr.addColorStop(0, lift(bg, 0.06)); gr.addColorStop(1, p.fond);
      ctx.fillStyle = gr; ctx.fillRect(0, 0, w, h);
      ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high';
      const list = flakes.slice().sort((a, b) => (a.z || 1) - (b.z || 1));
      for (const f of list) {
        if (f.delay > 0 || f.alpha <= 0.001) continue;
        const D = Math.max(24, Math.min(900, Math.round(f.size * 2 * Math.min(dpr, 1.5) * 1.04 * 0.8)));
        renderFlake(f, D);
        ctx.save(); ctx.translate(f.x, f.y); ctx.rotate(f.rot); ctx.globalAlpha = f.alpha * (f.sky ? 0.55 + 0.45 * f.z : 1);
        const E = f.size * 2 * 1.04; ctx.drawImage(f.cv, -E / 2, -E / 2, E, E); ctx.restore();
      }
      ctx.globalAlpha = 1;
    }
    function simulate(dt) {
      const { w, h } = app.size, S = Math.min(w, h);
      puff = Math.max(0, puff - dt * 0.7);
      for (const f of flakes) {
        updateFlake(f, dt);
        f.rot += dt * (p.rotation * 0.25 + (f.sky ? f.vr * 0.6 : 0));
        if (f.sky) {
          f.sway += dt * 0.7; f.y += f.vy * dt; f.x += (p.vent * S * 0.06 * (0.5 + f.z) + Math.sin(f.sway) * S * 0.01) * dt;
          if (f.y - f.size > h || f.x < -f.size * 2 || f.x > w + f.size * 2) {
            const i = flakes.indexOf(f), nf = skyFlake({}, i); nf.x = p.vent > 0.3 ? rng() * w * 0.8 - w * 0.1 : rng() * w; nf.y = -nf.size; nf.alpha = 1; flakes[i] = nf;
          }
          if (f.state === 'hold') f.alpha = 1;
        }
      }
    }
    app.loop((tt, dt) => {
      dt = Math.min(0.05, dt || 0);
      layout();
      if (app.thumbnail) {
        if (!frozen) { layoutKey = ''; layout(); for (let i = 0; i < 60 * 14; i++) { simulate(1 / 60); if (flakes.every((f) => f.state !== 'grow' || f.sky)) break; } for (const f of flakes) { f.alpha = 1; f.dirty = true; } frozen = true; }
      } else simulate(dt);
      drawAll();
      app.finish(ctx);
    });

    // ——— Export SVG : silhouettes vectorielles (marching squares sur le champ interpolé) ———
    function field(f, x, y, o) { tri(f.G, x, y, o); return o[3] * f.s[o[0]] + o[4] * f.s[o[1]] + o[5] * f.s[o[2]]; }
    function iso(f, level, M) {
      const R = f.G.R + 1.5, o = [0, 0, 0, 0, 0, 0], N = M + 1, V = new Float32Array(N * N), step = 2 * R / M;
      for (let j = 0; j < N; j++) for (let i = 0; i < N; i++) V[j * N + i] = (i === 0 || j === 0 || i === M || j === M) ? 0 : field(f, -R + i * step, -R + j * step, o);
      const pos = new Map(), next = new Map();
      const ep = (a, b, ia, ib) => { const t = (level - a) / (b - a); return [ia[0] + (ib[0] - ia[0]) * t, ia[1] + (ib[1] - ia[1]) * t]; };
      const E = (i, j, d) => (j * N + i) * 2 + d;
      for (let j = 0; j < M; j++) for (let i = 0; i < M; i++) {
        const a = V[j * N + i], b = V[j * N + i + 1], c = V[(j + 1) * N + i + 1], d = V[(j + 1) * N + i];
        const idx = (a >= level ? 8 : 0) | (b >= level ? 4 : 0) | (c >= level ? 2 : 0) | (d >= level ? 1 : 0);
        if (idx === 0 || idx === 15) continue;
        const T = E(i, j, 0), Rr = E(i + 1, j, 1), B = E(i, j + 1, 0), L = E(i, j, 1);
        if (!pos.has(T)) pos.set(T, ep(a, b, [i, j], [i + 1, j])); if (!pos.has(B)) pos.set(B, ep(d, c, [i, j + 1], [i + 1, j + 1]));
        if (!pos.has(L)) pos.set(L, ep(a, d, [i, j], [i, j + 1])); if (!pos.has(Rr)) pos.set(Rr, ep(b, c, [i + 1, j], [i + 1, j + 1]));
        const S = (x, y) => next.set(x, y);
        switch (idx) {
          case 1: S(B, L); break; case 2: S(Rr, B); break; case 3: S(Rr, L); break; case 4: S(T, Rr); break;
          case 5: S(T, L); S(B, Rr); break; case 6: S(T, B); break; case 7: S(T, L); break; case 8: S(L, T); break;
          case 9: S(B, T); break; case 10: S(L, B); S(Rr, T); break; case 11: S(Rr, T); break; case 12: S(L, Rr); break;
          case 13: S(B, Rr); break; case 14: S(L, B); break;
        }
      }
      const loops = [];
      while (next.size) {
        let k = next.keys().next().value; const loop = []; let guard = 0;
        while (k !== undefined && next.has(k) && guard++ < 200000) { loop.push(pos.get(k)); const n2 = next.get(k); next.delete(k); k = n2; }
        if (loop.length > 3) loops.push(loop.map(([i, j]) => [(-R + i * step), (-R + j * step)]));
      }
      return loops;
    }
    function toSVG() {
      const { w, h } = app.size, out = [], fmt = (v) => v.toFixed(2);
      out.push(`<rect width="100%" height="100%" fill="${p.fond}"/>`);
      for (const f of flakes) {
        if (f.delay > 0 || f.alpha <= 0.02 || f.maxR < 1) continue;
        const cs = f.size * 2 * 1.04 / (2 * f.G.R + 3), M = Math.min(420, Math.max(60, f.G.R * 4));
        const path = (lv) => iso(f, lv, M).map((L) => 'M' + L.map(([x, y]) => fmt(x * cs) + ' ' + fmt(y * cs)).join('L') + 'Z').join('');
        const op = (f.alpha * (f.sky ? 0.55 + 0.45 * f.z : 1)).toFixed(3);
        out.push(`<g transform="translate(${fmt(f.x)} ${fmt(f.y)}) rotate(${fmt(f.rot * 180 / Math.PI)})" opacity="${op}">`);
        out.push(`<path d="${path(1)}" fill="${p.glace}" fill-opacity="${p.rendu === 'encre' ? 0.85 : 0.6}" fill-rule="evenodd"/>`);
        if (f.maxS > 1.05) out.push(`<path d="${path(1 + (f.maxS - 1) * 0.35)}" fill="${p.rendu === 'anneaux' ? p.accent : p.glace}" fill-opacity="0.75" fill-rule="evenodd"/>`);
        out.push('</g>');
      }
      return `<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">\n${out.join('\n')}\n</svg>`;
    }
  </script>
