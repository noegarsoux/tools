<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pendule double</title>
  <link rel="stylesheet" href="../../assets/ui/atelier.css">
</head>
<body>
  <canvas></canvas>
  <script src="../../assets/ui/atelier.js"></script>
  <script>
    // Pendule double : deux tiges, deux masses, aucune friction. Lâchés à un millionième de radian d'écart,
    // des centaines de pendules restent d'abord confondus puis se séparent en gerbe : c'est le chaos.
    // La carte prend chaque pixel pour un départ (angle du haut en x, angle du bas en y) et le colore selon
    // le temps que met le pendule à basculer par-dessus son pivot.
    const canvas = document.querySelector('canvas');
    const ctx = canvas.getContext('2d');
    const TAU = Math.PI * 2, PI = Math.PI;
    const PAL = (k) => Atelier.PALETTES[k].colors;
    const KB = PAL('kegelbahn'), BIEN = PAL('biennale'), THERM = PAL('thermique'), LUZ = PAL('luzern'), ORB = PAL('orbite'), MENTHE = PAL('menthe');

    let simKey = '', frozen = false, rng = Math.random, pend = null, N = 0, tSim = 0, trail = null, held = null, cycleT = 0, hist = [], start = { a1: 0, a2: 0 };
    let map = null, mapKey = '', mark = null, budget = 3;

    const app = Atelier.app({
      stage: canvas,
      animate: true,
      seed: true,
      finish: { grain: 0.05, vignette: 0.18 },
      hint: 'Glissez pour tenir les pendules puis lâchez · sur la carte, touchez un départ · molette : écart initial',
      notes: 'Un pendule double obéit à des équations parfaitement connues, sans hasard. Pourtant deux pendules lâchés à un millionième de radian l’un de l’autre finissent par n’avoir plus rien en commun : l’écart double à intervalles réguliers jusqu’à tout envahir. La carte montre, pour chaque départ possible, combien de temps le pendule met avant de passer par-dessus son pivot. Au centre, les départs trop bas n’ont jamais assez d’énergie pour basculer ; tout autour, la frontière se replie à l’infini.',
      params: {
        'Pendules': {
          mode: { type: 'segmented', label: 'Vue', options: { gerbe: 'Gerbe', carte: 'Carte' }, value: 'gerbe' },
          nombre: { type: 'range', label: 'Nombre de pendules', min: 1, max: 1000, step: 1, value: 240 },
          ecart: { type: 'range', label: 'Écart initial (10⁻⁶ → 1)', min: 0, max: 1, step: 0.01, value: 0.45 },
          angle1: { type: 'range', label: 'Angle de départ, bras du haut', min: -180, max: 180, step: 1, value: 125 },
          angle2: { type: 'range', label: 'Angle de départ, bras du bas', min: -180, max: 180, step: 1, value: 160 },
          cycle: { type: 'range', label: 'Nouveau lâcher toutes les (s)', min: 4, max: 60, step: 1, value: 18 },
        },
        'Physique': {
          masses: { type: 'range', label: 'Masse du bas / du haut', min: 0.2, max: 4, step: 0.05, value: 1 },
          longueurs: { type: 'range', label: 'Longueur du bas / du haut', min: 0.3, max: 2, step: 0.05, value: 1 },
          vitesse: { type: 'range', label: 'Vitesse', min: 0.1, max: 2, step: 0.05, value: 0.8 },
          amorti: { type: 'range', label: 'Frottement', min: 0, max: 0.3, step: 0.01, value: 0 },
        },
        'Rendu': {
          traine: { type: 'range', label: 'Traînées', min: 0, max: 1, step: 0.01, value: 0.85 },
          bras: { type: 'range', label: 'Opacité des bras', min: 0, max: 1, step: 0.01, value: 0.22 },
          epaisseur: { type: 'range', label: 'Épaisseur', min: 0.3, max: 3, step: 0.05, value: 1 },
          resolution: { type: 'range', label: 'Finesse de la carte', min: 80, max: 420, step: 4, value: 240 },
          fond: { type: 'color', label: 'Fond', value: '#0d0d10' },
          couleurs: { type: 'palette', label: 'Couleurs', value: ['#ff5a36', '#ffb347', '#f7e7a1', '#7fd3c7', '#4f7cff', '#b06cff'] },
        },
      },
      presets: {
        'Gerbe': {},
        'Un millionième': { ecart: 0, nombre: 600, angle1: 150, angle2: 150, traine: 0.75 },
        'Éventail large': { ecart: 0.85, nombre: 240, bras: 0.6, traine: 0.6 },
        'Seul': { nombre: 1, traine: 0.97, bras: 1, epaisseur: 1.6, cycle: 40 },
        'Carte': { mode: 'carte' },
        'Carte Biennale': { mode: 'carte', fond: BIEN[0], couleurs: [BIEN[1], BIEN[2], BIEN[3], BIEN[4]] },
        'Lourd en bas': { masses: 3, longueurs: 0.6, angle1: 90, angle2: 170 },
        'Papier': { fond: '#f4f1ea', couleurs: ['#151515', '#e5452a'], traine: 0.9, bras: 0.15 },
        'Kegelbahn': { fond: KB[0], couleurs: [KB[1], KB[2], KB[3], KB[5]] },
        'Carte thermique': { mode: 'carte', fond: '#101014', couleurs: [THERM[1], THERM[4], THERM[2], THERM[3], '#fbf3dc'] },
        'Luzern': { fond: LUZ[3], couleurs: [LUZ[0], LUZ[1], LUZ[2], LUZ[4]], nombre: 500 },
      },
      brand(colors) {
        const lum = (x) => { const c = hex(x); return c[0] * 0.299 + c[1] * 0.587 + c[2] * 0.114; };
        const all = colors.slice().sort((a, b) => lum(a) - lum(b));
        return { fond: all[0], couleurs: all.length > 1 ? all.slice(1) : [all[0]] };
      },
      pointer: {
        down: (q) => { held = { x: q.x, y: q.y, x0: q.x, y0: q.y, moved: false }; grab(q.x, q.y); },
        drag: (q) => { if (!held) return; if (Math.hypot(q.x - held.x0, q.y - held.y0) > 5) held.moved = true; held.x = q.x; held.y = q.y; grab(q.x, q.y); },
        up: () => { if (held) { grab(held.x, held.y); release(); } held = null; },
        wheel: (q, dy) => app.set('ecart', Math.max(0, Math.min(1, +(p.ecart + (dy > 0 ? -0.05 : 0.05)).toFixed(2)))),
      },
      onChange(k) { if (k === '*' || ['nombre', 'ecart', 'angle1', 'angle2', 'masses', 'longueurs', 'mode'].includes(k)) simKey = ''; if (k === '*' || ['masses', 'longueurs', 'resolution', 'couleurs', 'fond', 'amorti'].includes(k)) mapKey = ''; frozen = false; },
      onSeed() { simKey = ''; frozen = false; },
      export: { name: 'pendule-double', svg: () => toSVG() },
    });
    const p = app.params;

    const hex = (x) => { const n = parseInt(x.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; };
    const mix = (a, b, t) => { const A = hex(a), B = hex(b); return '#' + A.map((v, i) => Math.round(v + (B[i] - v) * t).toString(16).padStart(2, '0')).join(''); };
    const lumHex = (x) => { const c = hex(x); return c[0] * 0.299 + c[1] * 0.587 + c[2] * 0.114; };
    function mulberry(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
    // couleur le long de la palette, t ∈ [0, 1]
    function ramp(t) { const c = p.couleurs, n = c.length; if (n === 1) return hex(c[0]); const x = Math.max(0, Math.min(0.9999, t)) * (n - 1), i = Math.floor(x), f = x - i, A = hex(c[i]), B = hex(c[i + 1]); return [A[0] + (B[0] - A[0]) * f, A[1] + (B[1] - A[1]) * f, A[2] + (B[2] - A[2]) * f]; }
    const css = (c, a = 1) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`;

    // ——— Équations du mouvement (masses ponctuelles, tiges sans masse) ———
    const G = 9.81;
    function deriv(a1, a2, w1, w2, m2, l2, k, out) {
      const m1 = 1, l1 = 1, d = a1 - a2, sd = Math.sin(d), cd = Math.cos(d), den = 2 * m1 + m2 - m2 * Math.cos(2 * d);
      out[0] = w1; out[1] = w2;
      out[2] = (-G * (2 * m1 + m2) * Math.sin(a1) - m2 * G * Math.sin(a1 - 2 * a2) - 2 * sd * m2 * (w2 * w2 * l2 + w1 * w1 * l1 * cd)) / (l1 * den) - k * w1;
      out[3] = (2 * sd * (w1 * w1 * l1 * (m1 + m2) + G * (m1 + m2) * Math.cos(a1) + w2 * w2 * l2 * m2 * cd)) / (l2 * den) - k * w2;
    }
    const K1 = new Float64Array(4), K2 = new Float64Array(4), K3 = new Float64Array(4), K4 = new Float64Array(4);
    // un pas de Runge-Kutta 4 sur les tableaux A1, A2, W1, W2 à l'indice i
    function rk4(S, i, h, m2, l2, k) {
      const a1 = S.a1[i], a2 = S.a2[i], w1 = S.w1[i], w2 = S.w2[i];
      deriv(a1, a2, w1, w2, m2, l2, k, K1);
      deriv(a1 + K1[0] * h / 2, a2 + K1[1] * h / 2, w1 + K1[2] * h / 2, w2 + K1[3] * h / 2, m2, l2, k, K2);
      deriv(a1 + K2[0] * h / 2, a2 + K2[1] * h / 2, w1 + K2[2] * h / 2, w2 + K2[3] * h / 2, m2, l2, k, K3);
      deriv(a1 + K3[0] * h, a2 + K3[1] * h, w1 + K3[2] * h, w2 + K3[3] * h, m2, l2, k, K4);
      S.a1[i] = a1 + h / 6 * (K1[0] + 2 * K2[0] + 2 * K3[0] + K4[0]); S.a2[i] = a2 + h / 6 * (K1[1] + 2 * K2[1] + 2 * K3[1] + K4[1]);
      S.w1[i] = w1 + h / 6 * (K1[2] + 2 * K2[2] + 2 * K3[2] + K4[2]); S.w2[i] = w2 + h / 6 * (K1[3] + 2 * K2[3] + 2 * K3[3] + K4[3]);
    }

    // ——— La gerbe ———
    const spread = () => Math.pow(10, -6 + p.ecart * 6) * (p.ecart >= 1 ? 1 : 1);
    function launch(a1, a2) {
      N = p.nombre; pend = { a1: new Float64Array(N), a2: new Float64Array(N), w1: new Float64Array(N), w2: new Float64Array(N) };
      const s = spread();
      for (let i = 0; i < N; i++) { const f = N === 1 ? 0 : i / (N - 1) - 0.5; pend.a1[i] = a1 + f * s; pend.a2[i] = a2; }
      start = { a1, a2 }; tSim = 0; cycleT = 0; hist = [];
    }
    function geom() {
      const { w, h } = app.size, m = Math.min(w, h), l2 = p.longueurs, scale = m * 0.44 / (1 + l2);
      let cx = w / 2, cy = h / 2;
      if (p.mode === 'carte') { cx = w / 2; cy = h / 2; }
      return { cx, cy, L1: scale, L2: scale * l2 };
    }
    function bobs(i, g) {
      const x1 = g.cx + Math.sin(pend.a1[i]) * g.L1, y1 = g.cy + Math.cos(pend.a1[i]) * g.L1;
      return [x1, y1, x1 + Math.sin(pend.a2[i]) * g.L2, y1 + Math.cos(pend.a2[i]) * g.L2];
    }
    // tenir : la masse du bas suit la main (cinématique inverse), ou sur la carte, choisir le départ
    function grab(x, y) {
      if (p.mode === 'carte') {
        const { w, h } = app.size, a1 = (x / w) * TAU - PI, a2 = (y / h) * TAU - PI;
        mark = { x, y }; launch(a1, a2); clearTrail(); return;
      }
      const g = geom(); let dx = x - g.cx, dy = y - g.cy; const d = Math.max(1e-3, Math.hypot(dx, dy)), reach = (g.L1 + g.L2) * 0.999, near = Math.abs(g.L1 - g.L2) * 1.001;
      const r = Math.max(near, Math.min(reach, d)); dx *= r / d; dy *= r / d;
      const base = Math.atan2(dx, dy), c = (g.L1 * g.L1 + r * r - g.L2 * g.L2) / (2 * g.L1 * r), off = Math.acos(Math.max(-1, Math.min(1, c)));
      const a1 = base + off, x1 = Math.sin(a1) * g.L1, y1 = Math.cos(a1) * g.L1, a2 = Math.atan2(dx - x1, dy - y1);
      launch(a1, a2); held && (held.hold = true);
    }
    function release() { if (held) held.hold = false; clearTrail(); }
    function clearTrail() { if (trail) { const c = trail.getContext('2d'); c.setTransform(1, 0, 0, 1, 0, 0); c.clearRect(0, 0, trail.width, trail.height); } }
    function ensureTrail() {
      const { w, h, dpr } = app.size, W = Math.round(w * dpr), H = Math.round(h * dpr);
      if (!trail || trail.width !== W || trail.height !== H) { trail = document.createElement('canvas'); trail.width = W; trail.height = H; }
      return trail.getContext('2d');
    }
    function advance(dt, paint) {
      // pas internes courts : le chaos se joue dans les détails
      const sim = dt * p.vitesse * 1.6, n = Math.max(1, Math.ceil(sim / 0.004)), hh = sim / n, m2 = p.masses, l2 = p.longueurs, k = p.amorti;
      const g = geom(), tc = paint ? ensureTrail() : null, { dpr } = app.size;
      const prev = paint ? new Float32Array(N * 2) : null;
      if (paint) for (let i = 0; i < N; i++) { const b = bobs(i, g); prev[i * 2] = b[2]; prev[i * 2 + 1] = b[3]; }
      for (let s = 0; s < n; s++) for (let i = 0; i < N; i++) rk4(pend, i, hh, m2, l2, k);
      tSim += sim;
      if (paint) {
        tc.setTransform(dpr, 0, 0, dpr, 0, 0); tc.lineCap = 'round';
        const lw = Math.max(0.5, Math.min(app.size.w, app.size.h) * 0.0016 * p.epaisseur * (N < 20 ? 2 : 1));
        tc.lineWidth = lw; const bins = Math.min(24, N);
        for (let b = 0; b < bins; b++) {
          tc.beginPath();
          for (let i = Math.floor(b * N / bins); i < Math.floor((b + 1) * N / bins); i++) { const q = bobs(i, g); tc.moveTo(prev[i * 2], prev[i * 2 + 1]); tc.lineTo(q[2], q[3]); }
          tc.strokeStyle = css(ramp(N === 1 ? 0.5 : (b + 0.5) / bins), N < 30 ? 0.9 : Math.max(0.15, Math.min(0.9, 40 / N))); tc.stroke();
        }
      }
      // un peu d'histoire pour l'export SVG
      if (paint && hist.length < 2400) { const S = []; const step = Math.max(1, Math.floor(N / 48)); for (let i = 0; i < N; i += step) { const q = bobs(i, g); S.push(q[2], q[3]); } hist.push(S); }
    }
    function fadeTrail(dt) {
      const tc = ensureTrail(), a = Math.min(1, (1 - p.traine) * 6 * dt + 0.004);
      tc.setTransform(1, 0, 0, 1, 0, 0); tc.globalCompositeOperation = 'destination-out'; tc.fillStyle = `rgba(0,0,0,${a})`; tc.fillRect(0, 0, trail.width, trail.height); tc.globalCompositeOperation = 'source-over';
    }

    // ——— La carte des basculements ———
    function buildMap() {
      const { w, h } = app.size, RW = Math.round(p.resolution), RH = Math.max(8, Math.round(RW * h / w)), n = RW * RH, m2 = p.masses, l2 = p.longueurs;
      const S = { a1: new Float64Array(n), a2: new Float64Array(n), w1: new Float64Array(n), w2: new Float64Array(n) }, T = new Float32Array(n).fill(-1), act = [];
      const vMin = -(1 + m2) * G + m2 * l2 * G; // en dessous, l'énergie ne suffit jamais à faire basculer le bras du bas
      for (let y = 0; y < RH; y++) for (let x = 0; x < RW; x++) {
        const i = y * RW + x, a1 = ((x + 0.5) / RW) * TAU - PI, a2 = ((y + 0.5) / RH) * TAU - PI; S.a1[i] = a1; S.a2[i] = a2;
        const V = -(1 + m2) * G * Math.cos(a1) - m2 * l2 * G * Math.cos(a2);
        if (V < vMin) T[i] = -2; else act.push(i);
      }
      const cv = document.createElement('canvas'); cv.width = RW; cv.height = RH; const cx = cv.getContext('2d'), img = cx.createImageData(RW, RH);
      map = { RW, RH, S, T, act: Int32Array.from(act), na: act.length, t: 0, cv, cx, img, u32: new Uint32Array(img.data.buffer), dirty: true };
      const F = hex(p.fond); const bg = (255 << 24) | (F[2] << 16) | (F[1] << 8) | F[0]; map.u32.fill(bg);
      // départs sans assez d'énergie : un ton à peine plus marqué que le fond
      const Z = hex(mix(p.fond, lumHex(p.fond) < 128 ? '#ffffff' : '#000000', 0.06)), zc = (255 << 24) | (Z[2] << 16) | (Z[1] << 8) | Z[0];
      for (let i = 0; i < n; i++) if (T[i] === -2) map.u32[i] = zc;
      budget = 3;
    }
    const TMAX = 60;
    function stepMap(ms) {
      // on avance toute la carte d'un même pas, autant que le budget de temps le permet
      const M = map, m2 = p.masses, l2 = p.longueurs, k = p.amorti, h = 0.01, t0 = performance.now();
      let loops = 0;
      while (M.na > 0 && M.t < TMAX && (loops < 1 || performance.now() - t0 < ms)) {
        let j = 0;
        for (let q = 0; q < M.na; q++) {
          const i = M.act[q]; rk4(M.S, i, h, m2, l2, k);
          if (Math.abs(M.S.a2[i]) > PI || Math.abs(M.S.a1[i]) > PI) { M.T[i] = M.t + h; const c = ramp(Math.log(1 + M.T[i]) / Math.log(1 + TMAX)); M.u32[i] = (255 << 24) | ((c[2] | 0) << 16) | ((c[1] | 0) << 8) | (c[0] | 0); }
          else M.act[j++] = i;
        }
        M.na = j; M.t += h; loops++; M.dirty = true;
      }
    }

    // ——— Boucle ———
    app.loop((tt, dt) => {
      dt = Math.min(0.05, dt || 0);
      const { w, h, dpr } = app.size;
      const key = [p.mode, p.nombre, p.ecart, p.angle1, p.angle2, p.masses, p.longueurs, w, h, app.seed].join();
      if (key !== simKey) {
        simKey = key; rng = mulberry(app.seed * 31337 + 5);
        launch(p.angle1 * PI / 180, p.angle2 * PI / 180); ensureTrail(); clearTrail();
        // la gerbe est déjà ouverte au premier regard
        if (p.mode === 'gerbe') for (let i = 0, n = app.thumbnail ? 330 : 230; i < n; i++) { advance(1 / 60, true); fadeTrail(1 / 60); }
      }
      if (p.mode === 'carte') {
        const mk = [p.masses, p.longueurs, p.resolution, p.couleurs.join(), p.fond, p.amorti, w, h].join();
        if (mk !== mapKey || !map) { mapKey = mk; buildMap(); stepMap(app.thumbnail ? 4000 : 250); }
        else if (!app.thumbnail) stepMap(7);
      }
      const hold = held && held.hold;
      const idle = p.mode === 'carte' && !mark;
      if (idle) {}
      else if (!app.thumbnail && !hold) {
        advance(dt, true); fadeTrail(dt); cycleT += dt;
        // nouveau lâcher : on repart d'un départ voisin, tiré au hasard
        if (p.mode === 'gerbe' && cycleT > p.cycle) { launch((100 + rng() * 75) * PI / 180 * (rng() < 0.5 ? -1 : 1), (rng() * 360 - 180) * PI / 180); clearTrail(); }
      } else if (!app.thumbnail) fadeTrail(dt);
      draw();
      app.finish(ctx);
    });

    function draw() {
      const { w, h, dpr } = app.size;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
      ctx.fillStyle = p.fond; ctx.fillRect(0, 0, w, h);
      if (p.mode === 'carte' && map) {
        if (map.dirty) { map.cx.putImageData(map.img, 0, 0); map.dirty = false; }
        ctx.imageSmoothingEnabled = p.resolution < 300; ctx.imageSmoothingQuality = 'low'; ctx.drawImage(map.cv, 0, 0, w, h); ctx.imageSmoothingEnabled = true;
        if (mark) { ctx.strokeStyle = lumHex(p.fond) < 128 ? '#ffffff' : '#000000'; ctx.lineWidth = 1.2; ctx.beginPath(); ctx.arc(mark.x, mark.y, 6, 0, TAU); ctx.moveTo(mark.x - 12, mark.y); ctx.lineTo(mark.x - 8, mark.y); ctx.moveTo(mark.x + 8, mark.y); ctx.lineTo(mark.x + 12, mark.y); ctx.stroke(); }
        if (!mark) return;
        // le pendule choisi se balance par-dessus la carte, sur un voile
        ctx.fillStyle = mix(p.fond, '#000000', 0.2); ctx.globalAlpha = 0.55; const g = geom(); ctx.beginPath(); ctx.arc(g.cx, g.cy, (g.L1 + g.L2) * 1.06, 0, TAU); ctx.fill(); ctx.globalAlpha = 1;
      }
      if (trail) ctx.drawImage(trail, 0, 0, w, h);
      // bras et masses
      const g = geom(), lw = Math.max(0.6, Math.min(w, h) * 0.002 * p.epaisseur), single = N < 20;
      if (p.bras > 0) {
        ctx.lineCap = 'round'; ctx.lineJoin = 'round'; const bins = Math.min(24, N);
        for (let b = 0; b < bins; b++) {
          ctx.beginPath();
          for (let i = Math.floor(b * N / bins); i < Math.floor((b + 1) * N / bins); i++) { const q = bobs(i, g); ctx.moveTo(g.cx, g.cy); ctx.lineTo(q[0], q[1]); ctx.lineTo(q[2], q[3]); }
          ctx.strokeStyle = css(ramp(N === 1 ? 0.5 : (b + 0.5) / bins), single ? p.bras : Math.min(1, p.bras * 30 / Math.sqrt(N))); ctx.lineWidth = single ? lw * 2 : lw; ctx.stroke();
        }
        const r = single ? lw * 4.5 : lw * 1.4;
        for (let i = 0; i < N; i += Math.max(1, Math.floor(N / 400))) { const q = bobs(i, g), c = ramp(N === 1 ? 0.5 : i / (N - 1)); ctx.fillStyle = css(c, single ? 1 : Math.min(1, p.bras * 2)); ctx.beginPath(); ctx.arc(q[2], q[3], r, 0, TAU); ctx.fill(); if (single) { ctx.beginPath(); ctx.arc(q[0], q[1], r * 0.8, 0, TAU); ctx.fill(); } }
        ctx.fillStyle = lumHex(p.fond) < 128 ? '#f2f2f2' : '#151515'; ctx.beginPath(); ctx.arc(g.cx, g.cy, Math.max(2, lw * 2), 0, TAU); ctx.fill();
      }
    }

    // ——— Export SVG ———
    function toSVG() {
      const { w, h } = app.size, out = [`<rect width="100%" height="100%" fill="${p.fond}"/>`];
      const hexc = (c) => '#' + c.map((v) => Math.round(v).toString(16).padStart(2, '0')).join('');
      if (p.mode === 'carte' && map) {
        // la carte en bandes horizontales de même couleur
        const sx = w / map.RW, sy = h / map.RH;
        for (let y = 0; y < map.RH; y++) { let x0 = 0; for (let x = 1; x <= map.RW; x++) { const a = map.u32[y * map.RW + x0]; if (x === map.RW || map.u32[y * map.RW + x] !== a) { out.push(`<rect x="${(x0 * sx).toFixed(2)}" y="${(y * sy).toFixed(2)}" width="${((x - x0) * sx + 0.3).toFixed(2)}" height="${(sy + 0.3).toFixed(2)}" fill="${hexc([a & 255, (a >> 8) & 255, (a >> 16) & 255])}"/>`); x0 = x; } } }
      } else if (hist.length > 1) {
        const k = hist[0].length / 2, keep = hist.slice(-900);
        for (let j = 0; j < k; j++) { const pts = keep.map((S) => S[j * 2].toFixed(1) + ',' + S[j * 2 + 1].toFixed(1)); out.push(`<polyline points="${pts.join(' ')}" fill="none" stroke="${hexc(ramp(k === 1 ? 0.5 : j / (k - 1)))}" stroke-width="${(Math.max(0.5, Math.min(w, h) * 0.0016 * p.epaisseur)).toFixed(2)}" stroke-opacity="0.7" stroke-linecap="round" stroke-linejoin="round"/>`); }
      }
      if (N && pend) { const g = geom(); for (let i = 0; i < N; i += Math.max(1, Math.floor(N / 120))) { const q = bobs(i, g); out.push(`<polyline points="${g.cx.toFixed(1)},${g.cy.toFixed(1)} ${q[0].toFixed(1)},${q[1].toFixed(1)} ${q[2].toFixed(1)},${q[3].toFixed(1)}" fill="none" stroke="${hexc(ramp(N === 1 ? 0.5 : i / (N - 1)))}" stroke-width="1" stroke-opacity="${Math.min(1, p.bras * 2).toFixed(2)}"/>`); } }
      return `<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">${out.join('')}</svg>`;
    }
  </script>
</body>
</html>
